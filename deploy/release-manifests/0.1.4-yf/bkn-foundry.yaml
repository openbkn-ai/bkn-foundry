# Release lockfile for bkn-foundry 0.1.4-yf — the 0.1.4 line plus the openCypher
# query subset. Pins the chart version of every component that makes up the
# product. Consumed by:
#     deploy.sh openbkn install --version=0.1.4-yf
# Charts are published at 0.1.4-yf-release by pushes to release/0.1.4-yf.
# bkn-studio is built outside this repo and has no 0.1.4-yf line, so it stays
# pinned to the 0.1.4 chart.
apiVersion: deploy.openbkn.ai/v0.1.4
kind: VersionSet
product: bkn-foundry
version: 0.1.4-yf
source:
  type: oci
  registry: oci://ghcr.io/openbkn-ai/charts
releases:
  core-data-migrator:
    chart: core-data-migrator
    version: 0.1.4-yf-release
    stage: pre
  bkn-safe:
    chart: bkn-safe
    version: 0.1.4-yf-release
  mf-model-manager:
    chart: mf-model-manager
    version: 0.1.4-yf-release
  mf-model-api:
    chart: mf-model-api
    version: 0.1.4-yf-release
  vega-backend:
    chart: vega-backend
    version: 0.1.4-yf-release
  bkn-backend:
    chart: bkn-backend
    version: 0.1.4-yf-release
  ontology-query:
    chart: ontology-query
    version: 0.1.4-yf-release
  agent-operator-integration:
    chart: agent-operator-integration
    version: 0.1.4-yf-release
  oss-gateway-backend:
    chart: oss-gateway-backend
    version: 0.1.4-yf-release
  sandbox:
    chart: sandbox
    version: 0.1.4-yf-release
  agent-retrieval:
    chart: agent-retrieval
    version: 0.1.4-yf-release
  bkn-agent:
    chart: bkn-agent
    version: 0.1.4-yf-release
  agent-observability:
    chart: agent-observability
    version: 0.1.4-yf-release
  otelcol-contrib:
    chart: otelcol-contrib
    version: 0.1.4-yf-release
  bkn-studio:
    chart: bkn-studio
    version: 0.1.4-release