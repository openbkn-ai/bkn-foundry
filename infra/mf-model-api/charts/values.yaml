replicaCount: 1

namespace: openbkn

image:
  registry: ghcr.io/openbkn-ai
  repository: mf-model-api
  tag: "__VERSION__"
  pullPolicy: IfNotPresent
  name: mf-model-api

service:
  enableDualStack: false
  type: ClusterIP
  ports:
    port: 9898
    targetPort: 9898
  annotations: {}

ingress:
  enabled: true
  # Path-based routing.
  # Do not configure host; use different path prefixes to distinguish services.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500M"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  paths:
    - /api/mf-model-api

env:
  devicecode: ""

# bkn-safe (ISF replacement) cutover knobs. isf is the only other accepted
# value and is retired; anything else refuses to start.
# provider: "bkn-safe" | "shadow" | "isf". url: bkn-safe ClusterIP base URL.
bknSafe:
  # Defaults match what the installer writes. A chart-only install therefore
  # lands on a working bkn-safe deployment instead of the retired ISF: an
  # unset or misspelled authzProvider is now a startup error, not a fallback.
  authzProvider: "bkn-safe"
  directoryProvider: "bkn-safe"
  url: "http://bkn-safe:3000"

bknTrace:
  evidence:
    ingestUrl: ""
    timeoutMs: "1000"
    ingestTokenSecretName: ""
    ingestTokenSecretKey: "ingest-token"

nodeSelector: {}

depServices:
  class-443:
    ingressClass: class-443
  rds:
    host: "rds-proton-rds-mariadb-cluster"
    port: "3320"
    user: 'username'
    password: 'password'
    type: ""
    database: "openbkn"
    maxConnections: 5
  opensearch:
    read: "opensearch-read"
    write: "opensearch-write"
    host: "opensearch-master"
    port: "9200"
    user: "admin"
    password: "password"
  redis:
    connectType: sentinel
    enableSSL: false
    connectInfo:
      sentinelHost: redis-sentinel.resource.svc.cluster.local
      sentinelPort: 26379
      username: root
      password: password
      sentinelUsername: root
      sentinelPassword: password
      masterGroupName: mymaster
      masterHost: xxx.dcs.huaweicloud.com
      masterPort: 26379
      slaveHost: xxx-readonly.dcs.huaweicloud.com
      slavePort: 26379
      host: ""
      port: 26379
    secretName: redis-ssl-secret
    caName: ca.pem
    certName: cert.pem
    keyName: key.pem
  mq:
    auth:
      mechanism: 'PLAIN'
      username: 'username'
      password: 'password'
    mqHost: 'kafka-headless.resource'
    mqLookupdHost: ""
    mqLookupdPort: 0
    mqPort: 9097
    mqType: kafka
  text_vector:
    mapping: "{}"
  vlm_vector:
    mapping: "{}"
  text_reranker:
    mapping: "{}"
  hydra:
    # ISF replacement: introspect against bkn-safe's paired hydra (cross-ns).
    publicHost: "bkn-safe-hydra-public"
    publicPort: "4444"
    administrativeHost: "bkn-safe-hydra-admin"
    administrativePort: "4445"
  user_management:
    publicHost: "user-management-public"
    publicPort: "30980"
    privateHost: "user-management-private"
    privatePort: "30980"
  authorization:
    privateHost: "authorization-private"
    privatePort: "30920"


resources:
  requests:
    cpu: 1000m
    memory: 1024Mi
  limits:
    cpu: 4
    memory: 8Gi
auth:
  # Whether to enable permission control. false=disabled (all APIs are allowed and data is not filtered);
  # true=enabled (full authentication and resource-permission logic is used).
  enabled: "true"

observability:
    logEnabled: "false"
    traceEnabled: "false"
    metricEnabled: "false"
    # Same as mf-model-manager: after the AR backend was removed, the HTTP exporter has no target service.
    # Default to console (stdlib logging) to prevent the background log thread from blocking in getaddrinfo.
    logExporter: "console"
    traceProvider: "console"
    metricProvider: "console"
    logLoadInternal: "10"
    logLoadMaxLog: "1000"
    traceMaxQueueSize: "50000"
    metricIntervalSecond: "60"
    httpLogFeedIngesterUrl: "http://feed-ingester-service:13031/api/feed_ingester/v1/jobs/dip-o11y-log/events"
    httpTraceFeedIngesterUrl: "http://feed-ingester-service:13031/api/feed_ingester/v1/jobs/dip-o11y-trace/events"
    httpMetricFeedIngesterUrl: "http://feed-ingester-service:13031/api/feed_ingester/v1/jobs/dip-o11y-metric/events"
    grpcTraceFeedIngesterUrl: "feed-ingester-service:30013"
    grpcTraceJobId: "dip-o11y-trace-grpc"
# Metering transport backend: default to redis because Redis is installed system-wide,
# so metering works out of the box. Large deployments can explicitly switch to kafka;
# auto selects based on whether KAFKAHOST is injected.
metering:
  backend: "redis"
