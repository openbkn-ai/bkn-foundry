---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  namespace: sandbox-system
data:
  # 环境配置（改为 development 以自动创建数据库表）
  ENVIRONMENT: "development"
  DEBUG: "false"

  # 数据库配置
  DATABASE_URL: "mysql+aiomysql://sandbox:password@mariadb.sandbox-system.svc.cluster.local:3306/sandbox"

  # Kubernetes 配置（executor pods 部署到同一个 namespace）
  KUBERNETES_NAMESPACE: "sandbox-system"

  # 执行配置（降低默认资源请求以适应本地环境）
  DEFAULT_TIMEOUT: "300"
  MAX_TIMEOUT: "3600"
  DEFAULT_CPU: "0.2"
  DEFAULT_MEMORY: "256Mi"
  DEFAULT_DISK: "512Mi"

  # 清理配置
  IDLE_THRESHOLD_MINUTES: "30"
  MAX_LIFETIME_HOURS: "6"
  CLEANUP_INTERVAL_SECONDS: "300"

  # 禁用 Bubblewrap（K8s 环境下推荐使用）
  DISABLE_BWRAP: "true"

  # 集群内 Context Loader 的 MCP 地址，控制面会把它写进每个沙箱 Pod，
  # 沙箱里的 sandbox_sdk.bkn 据此回访 BKN，调用方不必每次执行都传地址。
  # 本目录部署的是独立沙箱（sandbox-system），默认没有 BKN，因此留空；
  # 与 BKN 同集群时填形如 http://agent-retrieval:30779/api/agent-retrieval/v1/mcp/。
  # 尾斜杠必须有：缺了网关回 307，而沙箱用的 urllib 对 POST 不跟随重定向。
  BKN_SANDBOX_MCP_URL: ""
