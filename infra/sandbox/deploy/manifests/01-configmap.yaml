---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  namespace: sandbox-system
data:
  # 环境配置（改为 development 以自动创建数据库表）
  ENVIRONMENT: "development"
  DEBUG: "false"

  # 数据库配置
  DATABASE_URL: "mysql+aiomysql://sandbox:password@mariadb.sandbox-system.svc.cluster.local:3306/sandbox"

  # Kubernetes 配置（executor pods 部署到同一个 namespace）
  KUBERNETES_NAMESPACE: "sandbox-system"

  # 执行配置（降低默认资源请求以适应本地环境）
  DEFAULT_TIMEOUT: "300"
  MAX_TIMEOUT: "3600"
  DEFAULT_CPU: "0.2"
  DEFAULT_MEMORY: "256Mi"
  DEFAULT_DISK: "512Mi"

  # 清理配置
  IDLE_THRESHOLD_MINUTES: "30"
  MAX_LIFETIME_HOURS: "6"
  CLEANUP_INTERVAL_SECONDS: "300"

  # 禁用 Bubblewrap（K8s 环境下推荐使用）
  DISABLE_BWRAP: "true"

  # 集群内平台地址，控制面会把它写进每个沙箱 Pod，沙箱里的 bkn-osdk 据此回访 BKN，
  # 用户代码不必自己 configure()。本目录部署的是独立沙箱（sandbox-system），默认没有
  # BKN，因此留空。
  # 与 BKN 同集群时填 agent-retrieval 的地址；BKN 通常在另一个命名空间，因此要写 FQDN
  # （与本文件 DATABASE_URL 的写法一致），短名解析不到：
  #   http://agent-retrieval.<bkn-namespace>.svc.cluster.local:30779
  # 只填到主机与端口，路径由 bkn-osdk 自己拼——REST 走 /api/agent-retrieval/v1/kn/，
  # MCP 面走 /api/agent-retrieval/v1/mcp。因此这里不要带尾斜杠，也不要带路径。
  BKN_BASE_URL: ""

  # 集群内 Context Loader 的 MCP 地址，供内建面 sandbox_sdk.bkn 使用。该面已不推荐用于
  # 新函数（改用 bkn-osdk），但**仍受支持**，存量函数不用改写，所以这仍是活的配置项。
  # 值要带完整 MCP 路径，尾斜杠必须有：缺了网关回 307，而那个面用的 urllib 对 POST 不
  # 跟随重定向。
  #   http://agent-retrieval.<bkn-namespace>.svc.cluster.local:30779/api/agent-retrieval/v1/mcp/
  # 若只填了这一个、没填 BKN_BASE_URL，控制面会剥掉 MCP 路径推导出后者，bkn-osdk 照样
  # 可用——存量部署不改 values 也能继续工作。
  BKN_SANDBOX_MCP_URL: ""
