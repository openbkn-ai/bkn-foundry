---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-executor-egress
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels:
      app: sandbox-executor
      managed_by: sandbox-control-plane
      sandbox-type: execution
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: sandbox-control-plane
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    # BKN is normally deployed in openbkn. Keep executor access on the
    # authenticated-only listener; port 30779 also exposes trusted /in routes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbkn
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-retrieval
      ports:
        - protocol: TCP
          port: 30780
    # Runtime Python dependencies are downloaded over HTTPS. Public address
    # space remains reachable on 443, while cluster/private/link-local ranges
    # (including cloud metadata endpoints) stay denied.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - 100::/64
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - protocol: TCP
          port: 443
