# Default values for sandbox-platform Helm chart

namespace: openbkn
imagePullPolicy: IfNotPresent
imagePullSecrets: []
image:
  registry: "ghcr.io/openbkn-ai"
  controlPlane:
    repository: sandbox-control-plane
    tag: "__VERSION__"
    pullPolicy: IfNotPresent
  defaultTemplates:
    pythonBasic:
      repository: sandbox-template-python-basic
      tag: "__VERSION__"
      pullPolicy: IfNotPresent
    multiLanguage:
      repository: sandbox-template-multi-language
      tag: "__VERSION__"
      pullPolicy: IfNotPresent
  # Deprecated: use image.defaultTemplates.pythonBasic instead.
  defaultTemplate:
    repository: sandbox-template-python-basic
    tag: "__VERSION__"
    pullPolicy: IfNotPresent
  minio:
    repository: minio
    tag: "RELEASE.2025-09-07T16-13-09Z"
    pullPolicy: IfNotPresent

# Control Plane configuration
controlPlane:
  enabled: true
  replicaCount: 1

  service:
    type: ClusterIP
    port: 8000
    annotations: {}

  # Internal execution backend — callers reach it via the cluster service
  # (sandbox-control-plane:8000), not the gateway. The catch-all "/" ingress was
  # helm-template boilerplate and hijacked the gateway root from bkn-studio (the
  # web UI), so nginx admission rejected studio's own "/" ingress. Disabled.
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    paths:
      - path: /
        pathType: Prefix
    tls: []

  # Resource limits and requests
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - sandbox-control-plane
            topologyKey: kubernetes.io/hostname

  env:
    ENVIRONMENT: "staging"
    DEBUG: "false"
    DATABASE_URL: "mysql+aiomysql://root:password@mariadb.sandbox-system.svc.cluster.local:3306/sandbox"
    DEFAULT_TIMEOUT: "300"
    MAX_TIMEOUT: "3600"
    DEFAULT_CPU: "1"
    DEFAULT_MEMORY: "512Mi"
    DEFAULT_DISK: "1Gi"
    IDLE_THRESHOLD_MINUTES: "-1"
    MAX_LIFETIME_HOURS: "-1"
    CLEANUP_INTERVAL_SECONDS: "300"
    DISABLE_BWRAP: "true"
    PYTHONUNBUFFERED: "1"
    # In-cluster platform address. The control plane writes it into every sandbox
    # pod so bkn-osdk reaches BKN with no configure() call in user code. The
    # sandbox is inside the cluster and cannot use the gateway address, so only
    # the deployment knows this value.
    # Host and port only, no path and no trailing slash: bkn-osdk appends its own
    # paths, the REST routes under /api/agent-retrieval/v1/kn/ and the MCP face at
    # /api/agent-retrieval/v1/mcp.
    # Left EMPTY on purpose. resolve_bkn_base_url() prefers this key, so a non-empty
    # default would override whatever an existing deployment already put in
    # BKN_SANDBOX_MCP_URL below — including the FQDN a cross-namespace install needs
    # — and silently repoint it at a short name that does not resolve there. Empty
    # means the derive-from-legacy path actually runs, which is what makes an
    # upgrade require no values change.
    # Set it explicitly on a new install, host and port only:
    #   BKN_BASE_URL: "http://agent-retrieval:30779"
    # or cross-namespace:
    #   BKN_BASE_URL: "http://agent-retrieval.<bkn-namespace>.svc.cluster.local:30779"
    # Both empty means no BKN access; functions that call it fail with the SDK's
    # "No base URL" error.
    # Helm cannot read another release's values, so the address is written out here
    # rather than derived from the agent-retrieval chart. The authoritative port is
    # agent-retrieval's own `project.port`, which its sandboxMCPURL() renders into
    # the same string for run_code; change them together. A wrong address does not
    # fail closed — calls fail at the network layer instead.
    BKN_BASE_URL: ""
    # In-cluster Context Loader MCP endpoint, used by the built-in sandbox_sdk.bkn face.
    # That face is no longer recommended for new functions (use bkn-osdk) but is still
    # supported, so existing functions need no rewrite and this stays a live setting.
    # The value carries the full MCP path and the trailing slash is required: without it the
    # gateway answers 307 and that face's urllib does not follow redirects on POST.
    # Setting only this one still works: the control plane derives BKN_BASE_URL from it by
    # stripping the MCP path.
    BKN_SANDBOX_MCP_URL: "http://agent-retrieval:30779/api/agent-retrieval/v1/mcp/"

  s3:
    # Note: endpointUrl is dynamically set in secret.yaml using .Values.namespace
    # The actual endpoint will be: http://minio.<namespace>.svc.cluster.local:9000
    endpointUrl: ""  # Dynamically generated from namespace
    bucket: "sandbox-workspace"
    region: "us-east-1"
# MinIO configuration
minio:
  enabled: true
  replicaCount: 1

  service:
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001
    annotations: {}

  ingress:
    enabled: true
    className: "class-443"
    annotations: {}
    paths:
      - path: /
        pathType: ImplementationSpecific

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi

  defaultBuckets:
    - sandbox-workspace

  auth:
    rootUser: "minioadmin"
    rootPassword: "minioadmin"

  nodeSelector: {}
  tolerations: []

# ServiceAccount configuration
serviceAccount:
  create: true
  name: "sandbox-control-plane"
  annotations: {}

# RBAC configuration
rbac:
  create: true
  name: "sandbox-control-plane"

# ConfigMap configuration
configMap:
  create: true
  name: "sandbox-config"

secret:
  create: true
  name: "sandbox-secrets"
  s3:
    accessKeyId: "minioadmin"
    secretAccessKey: "minioadmin"
    region: "us-east-1"


# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false


depServices:
  class-443:
    ingressClass: class-443
  # Database connection configuration
  rds:
    type: MariaDB
    host: mariadb-mariadb-cluster.resource
    port: 3330
    hostRead: mariadb-mariadb-cluster.resource
    portRead: 3330
    user: anyshare
    password: xxx
    database: adp
    maxConnections: 30
    maxReadConnections: 30
    dbCharset: utf8mb4
    timeout: 10
    readTimeout: 10
    writeTimeout: 10
