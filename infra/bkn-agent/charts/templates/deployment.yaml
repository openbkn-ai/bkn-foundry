{{- /* Single-replica constraint: task recovery scans and concurrent thread
writes both assume one globally unique replica. Multiple replicas could reclaim
one another's tasks or write the same thread concurrently. Multi-replica
support is deferred to #246; until then, pin replicaCount to 1 so --set cannot
override it. */}}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail (printf "bkn-agent currently supports only one replica (see #246 for multi-replica support); replicaCount must be 1, got %v" .Values.replicaCount) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.image.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.image.name }}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Values.image.name }}
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          image: "{{- if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.ports.targetPort }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.service.ports.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.service.ports.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          env:
            - name: BKN_AGENT_PORT
              value: {{ .Values.service.ports.targetPort | quote }}
            - name: RDSHOST
              value: {{ .Values.depServices.rds.host | quote }}
            - name: RDSPORT
              value: {{ .Values.depServices.rds.port | quote }}
            - name: RDSDBNAME
              value: {{ .Values.depServices.rds.database | quote }}
            - name: RDSUSER
              value: {{ .Values.depServices.rds.user | quote }}
            - name: RDSPASS
              value: {{ .Values.depServices.rds.password | quote }}
            - name: MF_MODEL_API_PRIVATE_BASE
              value: {{ .Values.runtime.mfModelApiPrivateBase | quote }}
            - name: OPERATOR_INTEGRATION_BASE
              value: {{ .Values.runtime.operatorIntegrationBase | quote }}
            - name: CONTEXT_LOADER_MCP_URL
              value: {{ .Values.runtime.contextLoaderMcpUrl | quote }}
            - name: BKN_AGENT_DEFAULT_MODEL
              value: {{ .Values.runtime.defaultModel | quote }}
            - name: BKN_PROVENANCE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "provenanceBootstrap.auth.existingSecret is required" .Values.provenanceBootstrap.auth.existingSecret | quote }}
                  key: {{ required "provenanceBootstrap.auth.secretKey is required" .Values.provenanceBootstrap.auth.secretKey | quote }}
            - name: CHECKPOINTER_BACKEND
              value: {{ .Values.runtime.checkpointerBackend | quote }}
            - name: CHECKPOINTER_ALLOW_RUNTIME_DDL
              value: {{ .Values.runtime.checkpointerAllowRuntimeDdl | quote }}
            - name: OTEL_ENABLED
              value: {{ .Values.observability.otelEnabled | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            - name: BKN_TRACE_EVIDENCE_INGEST_URL
              value: {{ .Values.observability.bknTraceEvidenceIngestUrl | quote }}
            - name: BKN_TRACE_ARTIFACT_INGEST_URL
              value: {{ .Values.observability.bknTraceArtifactIngestUrl | quote }}
            {{- if .Values.observability.bknTraceEvidenceIngestTokenSecretName }}
            - name: BKN_TRACE_EVIDENCE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.bknTraceEvidenceIngestTokenSecretName | quote }}
                  key: {{ .Values.observability.bknTraceEvidenceIngestTokenSecretKey | quote }}
            {{- end }}
            - name: BKN_TRACE_EVIDENCE_TIMEOUT_S
              value: {{ .Values.observability.bknTraceEvidenceTimeoutS | quote }}
          volumeMounts:
            - name: host-time
              mountPath: /etc/localtime
      volumes:
        - name: host-time
          hostPath:
            path: /etc/localtime
