{{- if .Values.publicIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Keep the existing resource name stable during chart upgrades.
  name: {{ .Values.image.name }}-metric-design
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.publicIngress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ required "publicIngress.className is required" .Values.publicIngress.className | quote }}
  rules:
    - http:
        paths:
          - path: /api/bkn-agent/v1/metric-design/executions
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.image.name }}
                port:
                  number: {{ .Values.service.ports.port }}
          - path: /api/bkn-agent/v1/executions
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.image.name }}
                port:
                  number: {{ .Values.service.ports.port }}
          - path: /api/bkn-agent/v1/me/agents
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.image.name }}
                port:
                  number: {{ .Values.service.ports.port }}
          - path: /api/bkn-agent/v1/networks
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.image.name }}
                port:
                  number: {{ .Values.service.ports.port }}
          {{- if .Values.publicIngress.adminAgentsEnabled }}
          - path: /api/bkn-agent/v1/admin/agents
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.image.name }}
                port:
                  number: {{ .Values.service.ports.port }}
          {{- end }}
{{- end }}
