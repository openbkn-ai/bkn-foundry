{{- if or .Values.config.crypto.enabled .Values.config.crypto.aesKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.moduleName }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    module: {{ .Values.moduleName }}
type: Opaque
data:
  aes_key: {{ .Values.config.crypto.aesKey | required "AES key is required when config.crypto.enabled is true" | b64enc | quote }}
{{- end }}
