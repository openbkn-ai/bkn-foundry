nameOverride: ""
fullnameOverride: ""

mode: deployment
image:
  registry: ghcr.io/openbkn-ai
  repository: otelcol-openbkn
  tag: "0.148.0-openbkn.1"
  pullPolicy: IfNotPresent
  name: opentelemetry-collector-contrib

replicaCount: 1

# The processor obtains policy and control acknowledgements through existing
# BKN Safe OAuth2 client_credentials. Secret material is mounted only into the
# pod; it is never rendered into the ConfigMap.
traceAdmission:
  enabled: true
  policyURL: http://agent-observability-internal:8081/api/agent-observability/v1/internal/trace-evidence/policy
  configurationURL: http://agent-observability:8080/api/agent-observability/v1/trace-evidence-configuration
  heartbeatURL: http://agent-observability-internal:8081/api/agent-observability/v1/internal/trace-evidence/endpoints:heartbeat
  ackURLBase: http://agent-observability-internal:8081/api/agent-observability/v1/internal/trace-evidence/operations
  tokenURL: http://bkn-safe:4444/oauth2/token
  clientID: ""
  workloadIdentity: ""
  scope: ""
  audienceClusterID: cluster-a
  currentKeyID: ""
  currentPublicKeySecret: ""
  currentPublicKeyKey: public-key
  previousKeyID: ""
  previousPublicKeySecret: ""
  previousPublicKeyKey: public-key
  clientSecretSecret: ""
  clientSecretKey: client-secret
  pollInterval: 10s
  httpTimeout: 3s

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

resources:
  limits:
    cpu: 500m
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
    prometheus.io/path: /metrics
  ports:
    grpc: 4317
    http: 4318
    health: 13133
    metrics: 8888

probes:
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

monitoring:
  prometheusRule:
    enabled: false
    namespace: ""
    additionalLabels: {}
    queueUtilizationThreshold: 0.8
    for: 5m

# Enable only after confirming that producer and monitoring pod labels match
# the target cluster. The policy protects OTLP ingestion from arbitrary pods.
networkPolicy:
  enabled: false
  producerPodLabels:
    openbkn.ai/otel-producer: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: monitoring
  monitoringPodLabels: {}

opensearchExporter:
  enabled: true
  http:
    endpoint:  http://opensearch-cluster-master.resource.svc.cluster.local:9200
    tls:
      insecure: true
  auth:
    enabled: false
    existingSecret: ""
    usernameKey: username
    passwordKey: password
  dataset: default
  namespace: namespace
  logsIndex: ""
  logsIndexFallback: unknown
  logsIndexTimeFormat: ""
  tracesIndex: ""
  tracesIndexFallback: unknown
  tracesIndexTimeFormat: ""
  mapping:
    mode: ss4o
    timestampField: ""
    unixTimestamp: false
    dedup: false
    dedot: false
  bulkAction: create
  sendingQueue:
    enabled: true
    numConsumers: 4
    queueSize: 512
  retryOnFailure:
    enabled: true
    initialInterval: 1s
    maxInterval: 10s
    maxElapsedTime: 5m

debugExporter:
  enabled: false
  verbosity: detailed

config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 512
      spike_limit_mib: 128
    batch:
      timeout: 1s
      send_batch_size: 512
      send_batch_max_size: 1024
    traceadmission:
      policy_url: ${env:TRACE_ADMISSION_POLICY_URL}
      configuration_url: ${env:TRACE_ADMISSION_CONFIGURATION_URL}
      heartbeat_url: ${env:TRACE_ADMISSION_HEARTBEAT_URL}
      ack_url_base: ${env:TRACE_ADMISSION_ACK_URL_BASE}
      token_url: ${env:TRACE_ADMISSION_TOKEN_URL}
      client_id: ${env:TRACE_ADMISSION_CLIENT_ID}
      client_secret: ${env:TRACE_ADMISSION_CLIENT_SECRET}
      scope: ${env:TRACE_ADMISSION_SCOPE}
      audience_cluster_id: ${env:TRACE_ADMISSION_AUDIENCE}
      current_key_id: ${env:TRACE_ADMISSION_CURRENT_KEY_ID}
      current_public_key: ${env:TRACE_ADMISSION_CURRENT_PUBLIC_KEY}
      previous_key_id: ${env:TRACE_ADMISSION_PREVIOUS_KEY_ID}
      previous_public_key: ${env:TRACE_ADMISSION_PREVIOUS_PUBLIC_KEY}
      workload_identity: ${env:TRACE_ADMISSION_WORKLOAD_IDENTITY}
      poll_interval: ${env:TRACE_ADMISSION_POLL_INTERVAL}
      http_timeout: ${env:TRACE_ADMISSION_HTTP_TIMEOUT}

  service:
    extensions: [health_check]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, traceadmission, batch]
        exporters: [opensearch]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [opensearch]

extraArgs: []
extraEnvs: []
