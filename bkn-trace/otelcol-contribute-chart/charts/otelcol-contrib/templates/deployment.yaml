{{- if eq .Values.mode "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otelcol-contrib.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "otelcol-contrib.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "otelcol-contrib.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "otelcol-contrib.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/collector-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "otelcol-contrib.serviceAccountName" . }}
      containers:
        - name: otelcol-contrib
          image: "{{- if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/conf/collector-config.yaml
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.service.ports.grpc }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.service.ports.http }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.ports.health }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
          env:
            {{- if .Values.opensearchExporter.auth.enabled }}
            - name: OPENSEARCH_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "opensearchExporter.auth.existingSecret is required when OpenSearch auth is enabled" .Values.opensearchExporter.auth.existingSecret | quote }}
                  key: {{ .Values.opensearchExporter.auth.usernameKey | quote }}
            - name: OPENSEARCH_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "opensearchExporter.auth.existingSecret is required when OpenSearch auth is enabled" .Values.opensearchExporter.auth.existingSecret | quote }}
                  key: {{ .Values.opensearchExporter.auth.passwordKey | quote }}
            {{- end }}
            {{- if .Values.traceAdmission.enabled }}
            - name: TRACE_ADMISSION_POLICY_URL
              value: {{ .Values.traceAdmission.policyURL | quote }}
            - name: TRACE_ADMISSION_CONFIGURATION_URL
              value: {{ .Values.traceAdmission.configurationURL | quote }}
            - name: TRACE_ADMISSION_HEARTBEAT_URL
              value: {{ .Values.traceAdmission.heartbeatURL | quote }}
            - name: TRACE_ADMISSION_ACK_URL_BASE
              value: {{ .Values.traceAdmission.ackURLBase | quote }}
            - name: TRACE_ADMISSION_TOKEN_URL
              value: {{ .Values.traceAdmission.tokenURL | quote }}
            - name: TRACE_ADMISSION_CLIENT_ID
              value: {{ required "traceAdmission.clientID is required when Trace Admission is enabled" .Values.traceAdmission.clientID | quote }}
            - name: TRACE_ADMISSION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "traceAdmission.clientSecretSecret is required when Trace Admission is enabled" .Values.traceAdmission.clientSecretSecret | quote }}
                  key: {{ .Values.traceAdmission.clientSecretKey | quote }}
            - name: TRACE_ADMISSION_SCOPE
              value: {{ .Values.traceAdmission.scope | quote }}
            - name: TRACE_ADMISSION_AUDIENCE
              value: {{ .Values.traceAdmission.audienceClusterID | quote }}
            - name: TRACE_ADMISSION_CURRENT_KEY_ID
              value: {{ required "traceAdmission.currentKeyID is required when Trace Admission is enabled" .Values.traceAdmission.currentKeyID | quote }}
            - name: TRACE_ADMISSION_CURRENT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "traceAdmission.currentPublicKeySecret is required when Trace Admission is enabled" .Values.traceAdmission.currentPublicKeySecret | quote }}
                  key: {{ .Values.traceAdmission.currentPublicKeyKey | quote }}
            - name: TRACE_ADMISSION_PREVIOUS_KEY_ID
              value: {{ .Values.traceAdmission.previousKeyID | quote }}
            - name: TRACE_ADMISSION_PREVIOUS_PUBLIC_KEY
              {{- if .Values.traceAdmission.previousPublicKeySecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.traceAdmission.previousPublicKeySecret | quote }}
                  key: {{ .Values.traceAdmission.previousPublicKeyKey | quote }}
              {{- else }}
              value: ""
              {{- end }}
            - name: TRACE_ADMISSION_WORKLOAD_IDENTITY
              value: {{ required "traceAdmission.workloadIdentity is required when Trace Admission is enabled" .Values.traceAdmission.workloadIdentity | quote }}
            - name: TRACE_ADMISSION_POLL_INTERVAL
              value: {{ .Values.traceAdmission.pollInterval | quote }}
            - name: TRACE_ADMISSION_HTTP_TIMEOUT
              value: {{ .Values.traceAdmission.httpTimeout | quote }}
            {{- end }}
            {{- with .Values.extraEnvs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: health
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: health
            {{- toYaml .Values.probes.readiness | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "otelcol-contrib.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- else }}
{{- fail "Only mode=deployment is supported in this initial release" }}
{{- end }}
