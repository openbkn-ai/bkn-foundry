dist:
  name: otelcol-openbkn
  description: OpenBKN Collector with traces-only Trace Admission Gateway
  output_path: ./_build
  module: github.com/openbkn-ai/bkn-foundry/bkn-trace/otelcol-contribute-chart/otelcol-openbkn
  version: 0.148.0-openbkn.1
  otelcol_version: 0.148.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.148.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.148.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.148.0
  # Build the processor from the checked-out source. The gomod/version keeps
  # the generated registration and compatibility checks pinned, while path
  # prevents OCB from fetching an unpublished or mutable repository revision.
  - gomod: github.com/openbkn-ai/bkn-foundry/bkn-trace/otelcol-contribute-chart/processor/traceadmissionprocessor v0.148.0-openbkn.1
    path: ./processor/traceadmissionprocessor

exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/opensearchexporter v0.148.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.148.0
