openapi: 3.0.3
info:
  title: BKN Observability archive
  version: 0.2.2
  description: >-
    Log and Trace archive contract. Archiving runs in the background: a POST
    records a run and returns 202, and a worker executes its batches under the
    per-kind lock, independent of the request. The batch lifecycle and object
    format are unchanged. Complete frozen checkpoints are saved before upload.
    Only a verified manifest committed to the job permits source cleanup.
    Runtime limits are owner-managed, never supplied by an archive request.
    Trace interactions over the per-interaction budget are retained online
    automatically, excluded from selection under the current budget, and listed
    with the run that met them.
servers:
  - url: /api/observability/v1
security:
  - bearerAuth: []
paths:
  /log-archive-jobs:
    post:
      summary: Submit a background log archive run
      description: >-
        Requires observability archive management capability. The 30-day cutoff
        is server-selected when the run is submitted and fixed for the run. The
        response returns before any batch runs; progress and the outcome are
        read from the overview (current_run) or GET /archive-runs/{run_id}.
        /trace-archive-jobs has the same contract for Trace (7-day cutoff).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '202': { description: Queued run, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: >-
            archive_busy (a run of this kind is queued, running or waiting to
            retry), archive_cleanup_required, or archive_nothing_to_do.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '500':
          description: archive_failed; the run was not recorded
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    get:
      summary: List the latest 20 log archive jobs plus unfinished cleanup
      description: >-
        Includes all cleanup_incomplete jobs regardless of age, without duplicate
        jobs. Results are ordered by created_at and archive_job_id descending.
        Reads that fail return 503 rather than an empty or partial history.
      responses:
        '200': { description: Recent history and any older unfinished cleanup, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Job' } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503':
          description: archive_history_unavailable; refresh before starting another archive
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /log-archive-overview:
    get:
      summary: Archive overview with the latest run
      description: >-
        candidate_count excludes retained Trace interactions. current_run is the
        latest run of this kind and stays after it ends until the next one
        starts. /trace-archive-overview has the same shape.
      responses:
        '200': { description: Overview, content: { application/json: { schema: { $ref: '#/components/schemas/Overview' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /archive-runs/{run_id}:
    parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Read one run's result
      description: Summary and retry record; retained interactions are paged at /archive-runs/{run_id}/retained.
      responses:
        '200': { description: Run summary, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /archive-runs/{run_id}/retained:
    parameters:
      - { name: run_id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/RetainedOffset' }
      - { $ref: '#/components/parameters/RetainedLimit' }
    get:
      summary: Page the Trace interactions one run kept online
      responses:
        '200': { description: One page and the total, content: { application/json: { schema: { $ref: '#/components/schemas/RetainedPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /trace-archive-retained:
    parameters:
      - { $ref: '#/components/parameters/RetainedOffset' }
      - { $ref: '#/components/parameters/RetainedLimit' }
    get:
      summary: Page Trace interactions retained under the current budget
      description: Newest first; independent of the 20-job history.
      responses:
        '200': { description: One page and the total, content: { application/json: { schema: { $ref: '#/components/schemas/RetainedPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /archive-jobs/{job_id}:
    parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Read persisted archive progress
      responses:
        '200': { description: Job including optional log progress fields, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /archive-jobs/{job_id}/retry-cleanup:
    parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Submit a background run that reverifies a cleanup-incomplete batch and resumes its run
      description: >-
        Returns 202 with the queued run (trigger retry_cleanup). Failed/unverified jobs cannot authorize cleanup. The stored batch keeps its
        frozen limits and identities; new limits apply only to subsequent batches.
        Legacy log checkpoints first match archived content, then delete with the
        current verified document version. Changed sources remain hot for review.
      responses:
        '202': { description: Queued run, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /archive-jobs/{job_id}/download:
    parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Stream verified archive data through the application
      responses:
        '200': { description: JSONL data, content: { application/x-ndjson: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    RetainedOffset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    RetainedLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    Error:
      description: Existing observability error envelope; no credentials or signed URLs
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Run:
      type: object
      required: [run_id, archive_kind, trigger, status, eligible_at_start, processed_count, retained_count, batch_count, retry_count, created_at]
      properties:
        run_id: { type: string }
        archive_kind: { type: string, enum: [log, trace] }
        trigger: { type: string, enum: [archive, retry_cleanup] }
        status: { type: string, enum: [queued, running, retry_wait, completed, failed] }
        eligible_at_start: { type: integer, description: Candidates when the run was submitted, excluding retained interactions }
        processed_count: { type: integer, description: Records archived and cleaned so far }
        retained_count: { type: integer, description: Trace interactions this run kept online }
        batch_count: { type: integer }
        retry_count: { type: integer, maximum: 3, description: Automatic retries after transient failures (1, 5, 15 minutes) }
        next_attempt_at: { type: string, format: date-time }
        last_failure_code:
          type: string
          description: Reason of the last retry, or of failure when status is failed
          enum: [temporarily_unavailable, records_not_ready, cleanup_pending, cleanup_required, cleanup_verification_failed, capacity_exceeded, configuration_invalid, oversized_interaction, unexpected_error]
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    RetainedInteraction:
      type: object
      required: [interaction_id, run_id, stage, measured, budget, unit, retained_at]
      properties:
        interaction_id: { type: string }
        run_id: { type: string }
        stage: { type: string, example: sql_payload }
        measured: { type: integer, format: int64 }
        at_least: { type: boolean, description: measured is a lower bound from a bounded read }
        budget: { type: integer, format: int64 }
        unit: { type: string, enum: [bytes, rows] }
        retained_at: { type: string, format: date-time }
    RetainedPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RetainedInteraction' } }
        total: { type: integer }
    Overview:
      type: object
      required: [archive_kind, retention_days, cutoff_at, candidate_count, storage, retained_count]
      properties:
        archive_kind: { type: string, enum: [log, trace] }
        retention_days: { type: integer }
        cutoff_at: { type: string, format: date-time }
        candidate_count: { type: integer }
        storage: { type: object, properties: { status: { type: string, enum: [ready, unavailable] } } }
        retained_count: { type: integer }
        current_run: { $ref: '#/components/schemas/Run' }
    Failure:
      type: object
      required: [stage]
      properties:
        stage: { type: string, example: checkpoint_bytes }
        candidate_id: { type: string }
        actual: { type: integer, format: int64 }
        limit: { type: integer, format: int64 }
        unit: { type: string, example: bytes }
        at_least: { type: boolean, description: Actual is only a measured lower bound for a bounded read }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, request_id]
          properties:
            code: { type: string, example: archive_capacity_exceeded }
            message: { type: string }
            retryable: { type: boolean }
            request_id: { type: string }
            required_action: { type: string }
            details:
              type: object
              properties:
                archive_job_id: { type: string, description: Present only when there is a recorded job }
                failure: { $ref: '#/components/schemas/Failure' }
    Job:
      type: object
      required: [archive_job_id, archive_kind, status, candidate_count]
      properties:
        archive_job_id: { type: string }
        archive_kind: { type: string, enum: [log, trace] }
        status: { type: string, enum: [failed, cleanup_incomplete, completed] }
        candidate_count: { type: integer }
        manifest_ref: { type: string }
        error_message: { type: string }
        range:
          type: object
          properties:
            from: { type: string, format: date-time, nullable: true }
            to: { type: string, format: date-time }
        batch_progress:
          type: object
          additionalProperties: true
          description: Optional new fields; old jobs without them remain readable
          properties:
            run_id: { type: string }
            batch_number: { type: integer }
            eligible_at_selection: { type: integer }
            verified_count: { type: integer }
            cleaned_count: { type: integer }
            cleaned_in_run: { type: integer }
            remaining_at_selection: { type: integer }
            run_complete: { type: boolean }
            stage: { type: string, example: prepared }
            checkpoint_prepared: { type: boolean }
            failure: { $ref: '#/components/schemas/Failure' }
            log_limits:
              type: object
              properties:
                max_candidates: { type: integer, minimum: 1, maximum: 10000 }
                max_payload_bytes: { type: integer, minimum: 1024, maximum: 67108864 }
