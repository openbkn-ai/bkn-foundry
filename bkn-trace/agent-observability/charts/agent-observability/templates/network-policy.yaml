{{- if .Values.networkPolicy.enabled }}
{{- if not (gt (len .Values.networkPolicy.allowedClients) 0) }}
{{- fail "networkPolicy.allowedClients must contain at least one private lifecycle client" }}
{{- end }}
{{- $allowedClients := .Values.networkPolicy.allowedClients }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-observability.fullname" . }}
  labels:
    {{- include "agent-observability.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-observability.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Public read APIs remain behind the existing Ingress and OAuth boundary.
    - ports:
        - protocol: TCP
          port: http
    # Managed lifecycle calls use the private listener only. Evidence ingest
    # remains on the token-protected public API for platform producers.
    - from:
        {{- range $allowedClients }}
        {{- if not (gt (len .podLabels) 0) }}
        {{- fail "networkPolicy.allowedClients[].podLabels is required" }}
        {{- end }}
        {{- $podLabels := .podLabels }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ default $.Release.Namespace .namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $podLabels | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: internal-http
{{- end }}
