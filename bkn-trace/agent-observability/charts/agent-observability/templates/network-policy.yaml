{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-observability.fullname" . }}
  labels:
    {{- include "agent-observability.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-observability.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Public read APIs remain behind the existing Ingress and OAuth boundary.
    - ports:
        - protocol: TCP
          port: http
    # Lifecycle and evidence writes use the private listener only.
    - from:
        - podSelector:
            matchLabels:
              app: agent-retrieval
      ports:
        - protocol: TCP
          port: internal-http
{{- end }}
