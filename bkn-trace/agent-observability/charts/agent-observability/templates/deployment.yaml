apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-observability.fullname" . }}
  labels:
    {{- include "agent-observability.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-observability.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-observability.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agent-observability.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-observability
          image: {{ printf "%s/%s:%s" .Values.image.registry .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal-http
              containerPort: 8081
              protocol: TCP
          env:
            - name: OPENSEARCH_ENDPOINT
              value: {{ .Values.opensearch.endpoint | quote }}
            - name: OPENSEARCH_TRACE_INDEX
              value: {{ .Values.opensearch.traceIndex | quote }}
            - name: OPENSEARCH_LOG_INDEX
              value: {{ .Values.opensearch.logIndex | quote }}
            - name: OPENSEARCH_EVIDENCE_INDEX
              value: {{ .Values.evidence.index | quote }}
            - name: BKN_TRACE_EVIDENCE_STORE
              value: {{ .Values.evidence.store | quote }}
            - name: BKN_TRACE_CORE_STORE
              value: {{ .Values.core.store | quote }}
            - name: BKN_TRACE_CORE_AUTO_MIGRATE
              value: {{ ternary "true" "false" .Values.core.autoMigrate | quote }}
            - name: BKN_TRACE_CORE_ABANDON_INTERVAL
              value: {{ .Values.core.abandonInterval | quote }}
            - name: BKN_TRACE_CORE_ONE_SHOT_IDLE_TTL
              value: {{ .Values.core.oneShotIdleTTL | quote }}
            - name: BKN_TRACE_EVIDENCE_COLLECTION_STATE
              value: {{ .Values.core.evidenceCollectionState | quote }}
            - name: BKN_TRACE_PROJECTION_ENABLED
              value: {{ ternary "true" "false" .Values.core.projection.enabled | quote }}
            - name: BKN_TRACE_PROJECTION_INDEX
              value: {{ .Values.core.projection.index | quote }}
            - name: BKN_TRACE_PROJECTION_INTERVAL
              value: {{ .Values.core.projection.interval | quote }}
            {{- with .Values.core.projection.rebuildVersion }}
            - name: BKN_TRACE_PROJECTION_REBUILD_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.core.store "mariadb" }}
            - name: BKN_TRACE_CORE_MARIADB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "core.mariadb.existingSecret is required for the MariaDB Core store" .Values.core.mariadb.existingSecret | quote }}
                  key: {{ .Values.core.mariadb.dsnKey | quote }}
            {{- end }}
            - name: BKN_TRACE_ALLOW_UNAUTHENTICATED_INGEST
              value: {{ ternary "true" "false" .Values.evidence.ingestAuth.allowUnauthenticated | quote }}
            - name: BKN_TRACE_ALLOW_UNAUTHENTICATED_QUERY
              value: {{ ternary "true" "false" .Values.evidence.queryAuth.allowUnauthenticated | quote }}
            - name: BKN_SAFE_BASE_URL
              value: {{ required "bknSafe.baseURL is required" .Values.bknSafe.baseURL | quote }}
            # The EE entitlement gate verifies the deployment licence through
            # the same in-cluster BKN Safe endpoint as Trace access scope.
            - name: BKN_SAFE_URL
              value: {{ required "bknSafe.baseURL is required" .Values.bknSafe.baseURL | quote }}
            - name: BKN_SAFE_ACCESS_TIMEOUT
              value: {{ .Values.bknSafe.accessTimeout | quote }}
            {{- if .Values.evidence.queryAuth.hydraAdminURL }}
            - name: BKN_TRACE_HYDRA_ADMIN_URL
              value: {{ .Values.evidence.queryAuth.hydraAdminURL | quote }}
            {{- end }}
            - name: BKN_TRACE_DEPLOYMENT_TENANT_ID
              value: {{ required "evidence.queryAuth.deploymentTenantID is required" .Values.evidence.queryAuth.deploymentTenantID | quote }}
            {{- if .Values.businessResolver.enabled }}
            - name: BKN_TRACE_BKN_RESOLVER_URL
              value: {{ .Values.businessResolver.bknBaseURL | quote }}
            - name: BKN_TRACE_VEGA_RESOLVER_URL
              value: {{ .Values.businessResolver.vegaBaseURL | quote }}
            - name: BKN_TRACE_RESOLVER_TIMEOUT
              value: {{ .Values.businessResolver.timeout | quote }}
            {{- end }}
            {{- if .Values.enterpriseBusinessProvenance.enabled }}
            - name: BKN_TRACE_PROVENANCE_AGENT_URL
              value: {{ required "enterpriseBusinessProvenance.agentURL is required when enabled" .Values.enterpriseBusinessProvenance.agentURL | quote }}
            - name: BKN_TRACE_PROVENANCE_AGENT_ID
              value: {{ required "enterpriseBusinessProvenance.agentID is required when enabled" .Values.enterpriseBusinessProvenance.agentID | quote }}
            - name: BKN_TRACE_PROVENANCE_AGENT_NAME
              value: {{ required "enterpriseBusinessProvenance.agentName is required when enabled" .Values.enterpriseBusinessProvenance.agentName | quote }}
            {{- end }}
            - name: OPENSEARCH_AUTH_ENABLED
              value: {{ ternary "true" "false" .Values.opensearch.auth.enabled | quote }}
            {{- if .Values.opensearch.auth.enabled }}
            - name: OPENSEARCH_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "opensearch.auth.existingSecret is required when OpenSearch auth is enabled" .Values.opensearch.auth.existingSecret | quote }}
                  key: {{ .Values.opensearch.auth.usernameKey | quote }}
            - name: OPENSEARCH_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "opensearch.auth.existingSecret is required when OpenSearch auth is enabled" .Values.opensearch.auth.existingSecret | quote }}
                  key: {{ .Values.opensearch.auth.passwordKey | quote }}
            {{- end }}
            {{- if .Values.evidence.ingestAuth.existingSecret }}
            - name: BKN_TRACE_EVIDENCE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.evidence.ingestAuth.existingSecret | quote }}
                  key: {{ .Values.evidence.ingestAuth.secretKey | quote }}
            {{- end }}
            {{- if .Values.observability.cursorSigning.existingSecret }}
            - name: BKN_OBSERVABILITY_CURSOR_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.cursorSigning.existingSecret | quote }}
                  key: {{ .Values.observability.cursorSigning.secretKey | quote }}
            {{- end }}
            - name: BKN_OBSERVABILITY_SOURCE_TIMEOUT
              value: {{ .Values.observability.sourceTimeout | quote }}
            - name: BKN_OBSERVABILITY_MAX_CONCURRENT_SOURCES
              value: {{ .Values.observability.maxConcurrentSources | quote }}
            {{- if .Values.observability.sourceCoverage.enabled }}
            - name: BKN_OBSERVABILITY_SOURCE_COVERAGE_METRICS_ENDPOINT
              value: {{ required "observability.sourceCoverage.metricsEndpoint is required when source coverage monitoring is enabled" .Values.observability.sourceCoverage.metricsEndpoint | quote }}
            - name: BKN_OBSERVABILITY_SOURCE_COVERAGE_SOURCE_ID
              value: {{ required "observability.sourceCoverage.sourceID is required when source coverage monitoring is enabled" .Values.observability.sourceCoverage.sourceID | quote }}
            - name: BKN_OBSERVABILITY_SOURCE_COVERAGE_DEPLOYMENT_ID
              value: {{ required "observability.sourceCoverage.deploymentID is required when source coverage monitoring is enabled" .Values.observability.sourceCoverage.deploymentID | quote }}
            - name: BKN_OBSERVABILITY_SOURCE_COVERAGE_INTERVAL
              value: {{ .Values.observability.sourceCoverage.interval | quote }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
