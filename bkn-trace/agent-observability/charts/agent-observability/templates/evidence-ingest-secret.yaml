{{- if and .Values.evidence.ingestAuth.createSecret .Values.evidence.ingestAuth.existingSecret }}
{{- $name := .Values.evidence.ingestAuth.existingSecret -}}
{{- $key := .Values.evidence.ingestAuth.secretKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "agent-observability.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ if and $existing (index $existing.data $key) }}{{ index $existing.data $key }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
