nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  registry: ghcr.io/openbkn-ai
  repository: agent-observability
  pullPolicy: IfNotPresent
  tag: "__VERSION__"

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: class-443
  annotations: {}
  host: ""
  paths:
    - /api/agent-observability/v1
  tls: []

evidence:
  store: memory
  index: bkn-trace-evidence-v2
  indexManagement:
    enabled: false
    maxResultWindow: 10000
    refreshInterval: 5s
    createJob:
      enabled: false
      image:
        registry: docker.io
        repository: curlimages/curl
        tag: "8.10.1"
        pullPolicy: IfNotPresent
      backoffLimit: 1
  ingestAuth:
    existingSecret: ""
    secretKey: token
    allowUnauthenticated: false
  rawTraceQuery:
    enabled: false
  queryAuth:
    existingSecret: ""
    secretKey: token
    hydraAdminURL: http://bkn-safe-hydra-admin:4445
    allowUnauthenticated: false

bknSafe:
  baseURL: http://bkn-safe:3000
  accessTimeout: 3s

businessResolver:
  # Opt in only when the deployment can reach the BKN and Vega authorization-aware APIs.
  # When disabled, business refs and operation-business edges are returned as empty arrays
  # and disclosure_partial reports that user-visible business metadata was not resolved.
  enabled: false
  bknBaseURL: ""
  vegaBaseURL: ""
  timeout: 3s

core:
  # Keep existing trace/evidence reads available after an upgrade. Enable
  # MariaDB explicitly only after its Secret and database are ready.
  store: memory
  autoMigrate: true
  abandonInterval: 30s
  oneShotIdleTTL: 15m
  evidenceCollectionState: enabled
  projection:
    enabled: false
    index: bkn-trace-core
    interval: 1s
    rebuildVersion: bkn-trace-core-v013
  mariadb:
    existingSecret: bkn-trace-core-mariadb
    dsnKey: dsn

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

opensearch:
  endpoint:  http://opensearch-cluster-master.resource.svc.cluster.local:9200
  traceIndex: ss4o_traces-default-anyshare
  auth:
    enabled: false
    username: ""
    password: ""
