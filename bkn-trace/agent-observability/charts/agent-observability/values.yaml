nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  registry: ghcr.io/openbkn-ai
  repository: agent-observability
  pullPolicy: IfNotPresent
  tag: "__VERSION__"

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 8080

networkPolicy:
  enabled: true
  allowedClients:
    - namespace: ""
      podLabels:
        app.kubernetes.io/name: agent-retrieval
    # Keep the pre-0.1.3 selector during rolling upgrades. Remove it only after
    # every agent-retrieval workload carries the stable Kubernetes label above.
    - namespace: ""
      podLabels:
        app: agent-retrieval

ingress:
  enabled: true
  className: class-443
  annotations: {}
  host: ""
  paths:
    - /api/agent-observability/v1
    - /api/observability/v1
  tls: []

evidence:
  store: memory
  index: bkn-trace-evidence-v2
  ingestAuth:
    existingSecret: ""
    secretKey: token
    # Bundle installers may enable this explicitly. Standalone upgrades keep
    # externally managed Secrets outside Helm ownership by default.
    createSecret: false
    allowUnauthenticated: false
  queryAuth:
    hydraAdminURL: http://bkn-safe-hydra-admin:4445
    # 0.1.3 is deployed as a single tenant. This trusted server-side value is
    # injected after gateway authentication and never accepted from Studio.
    deploymentTenantID: openbkn-local
    allowUnauthenticated: false
    # Kill switch for the public lifecycle write surface. Set to false to make
    # every public lifecycle call answer 503 authorization_unavailable without
    # taking the query surface down with it.
    publicLifecycleEnabled: true

bknSafe:
  baseURL: http://bkn-safe:3000
  accessTimeout: 3s

businessResolver:
  # Standard OpenBKN installs resolve technical refs through authorization-aware
  # internal APIs. Standalone installs may disable this or override the endpoints.
  enabled: true
  bknBaseURL: "http://bkn-backend-svc:13014"
  vegaBaseURL: "http://vega-backend-svc:13014"
  executionFactoryURL: "http://agent-operator-integration:9000"
  modelManagerURL: "http://mf-model-manager:9898"
  timeout: 3s

# The Community binary ignores this block. The EE image uses it solely to
# select the deployment-approved, read-only business-provenance Agent.
enterpriseBusinessProvenance:
  enabled: false
  agentURL: ""
  agentID: ""
  agentName: ""
  bootstrap:
    enabled: true
    ownerID: bdd59f76-19c3-58b0-bf5f-082c4c3cbddb
    bknSafeURL: http://bkn-safe:3000/api/safe/v1
    bknAgentURL: http://bkn-agent:30800/api/bkn-agent/v1
    auth:
      existingSecret: bkn-agent-provenance-bootstrap
      secretKey: token
    image:
      # Registry inherits the release-wide private/offline override. The tag is
      # explicitly the bkn-agent release version; it must not inherit an
      # agent-observability-only hotfix tag.
      registry: ""
      repository: bkn-agent
      tag: "__VERSION__"
      pullPolicy: IfNotPresent

observability:
  # Configure the same Secret on every replica so signed pagination cursors
  # remain valid across pods. A single local replica may leave this empty.
  cursorSigning:
    existingSecret: ""
    secretKey: key
  sourceTimeout: 3s
  maxConcurrentSources: 4
  archive:
    # Object storage is configured only by the deployment owner. Studio never
    # receives storage credentials or an arbitrary archive target.
    ossGatewayURL: ""
    storageID: ""
    prefix: observability-archive
  sourceCoverage:
    # Optional independent health probe. It is disabled unless the installation
    # uses the persistent MariaDB Core store and provides a cluster-internal
    # Collector metrics endpoint.
    enabled: false
    metricsEndpoint: ""
    sourceID: otel-runtime
    deploymentID: observability/otelcol-contrib
    interval: 30s

core:
  # Keep existing trace/evidence reads available after an upgrade. Enable
  # MariaDB explicitly only after its Secret and database are ready.
  store: memory
  autoMigrate: true
  abandonInterval: 30s
  oneShotIdleTTL: 15m
  capacity:
    # Per-Interaction safeguards. Changes take effect after a Core rollout.
    maxOperationsPerInteraction: 256
    maxClaimsPerInteraction: 32
    maxEvidenceRefsPerInteraction: 4096
  evidenceCollectionState: enabled
  projection:
    enabled: false
    index: bkn-trace-core
    interval: 1s
    # Rebuilding projections is an explicit maintenance operation. Leave empty
    # during normal startup so a rollout does not continuously rebuild indexes.
    rebuildVersion: ""
  mariadb:
    existingSecret: bkn-trace-core-mariadb
    dsnKey: dsn

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

opensearch:
  endpoint:  http://opensearch-cluster-master.resource.svc.cluster.local:9200
  # Keep these aligned with the bundled Collector's ss4o dataset/namespace.
  traceIndex: ss4o_traces-default-namespace
  logIndex: ss4o_logs-default-namespace
  # Empty for standalone use. The product installer supplies the compatibility
  # pipeline and binds it as the Trace index default ingest pipeline.
  traceTimestampPipeline: ""
  # Records the installer-managed timestamp repair contract. It is not an
  # OpenSearch setting; it lets same-version release installs reconcile once
  # when the repair implementation changes.
  traceTimestampPipelineRevision: ""
  auth:
    enabled: false
    existingSecret: ""
    usernameKey: username
    passwordKey: password
