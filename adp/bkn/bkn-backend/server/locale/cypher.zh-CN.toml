# Cypher
[BknBackend.Cypher.InvalidParameter]
Description = "Cypher 查询请求参数无效"
Solution = "请检查请求体与查询参数。"
ErrorLink = ""

[BknBackend.Cypher.SyntaxError]
Description = "Cypher 查询语法解析失败"
Solution = "请按提示位置修正查询语句。"
ErrorLink = ""

[BknBackend.Cypher.Unsupported]
Description = "Cypher 查询使用了本接口不支持的语法"
Solution = "请改写为受支持的只读子集。"
ErrorLink = ""

[BknBackend.Cypher.InvalidQuery]
Description = "Cypher 查询与知识网络模型不匹配"
Solution = "请对照模型检查标签、关系类型与属性。"
ErrorLink = ""

[BknBackend.Cypher.LimitExceeded]
Description = "请求的 LIMIT 超过接口单次返回上限"
Solution = "请调小 LIMIT 并分页获取结果。"
ErrorLink = ""

[BknBackend.Cypher.InternalError]
Description = "Cypher 查询编译失败"
Solution = "请联系管理员。"
ErrorLink = ""

[BknBackend.Cypher.QueryFailed]
Description = "编译后的查询执行失败"
Solution = "请稍后重试或联系管理员。"
ErrorLink = ""

[BknBackend.Cypher.Forbidden]
Description = "数据源拒绝读取查询涉及的资源"
Solution = "请联系管理员发布知识网络并完成代理账号同步，或授予这些对象类所绑定资源的访问权限。"
ErrorLink = ""

[BknBackend.Cypher.PropertyForbidden]
Description = "查询读取了当前用户无完整访问权限的属性"
Solution = "请从查询中移除所列属性，或联系管理员授予这些属性的完整访问权限。"
ErrorLink = ""

[BknBackend.Cypher.ReadBudgetExceeded]
Description = "查询需要读取的数据行超过单次执行上限"
Solution = "请为模式中的节点增加过滤条件，减少需要读取的数据行。"
ErrorLink = ""

[BknBackend.Cypher.PropertyForbidden.Detail]
NotFull = "查询读取的每个属性都需要完整访问权限，以下属性未获授权：{{.properties}}。"

[BknBackend.Cypher.InvalidParameter.Detail]
NonSQLSource = "查询读到的对象类存放在数据集或索引里，或者分布在多个数据源中。这类数据只支持基础写法：MATCH、OPTIONAL MATCH、WHERE、RETURN 属性和聚合、ORDER BY / SKIP / LIMIT、WITH 聚合后过滤和按值过滤（半连接）。CASE、coalesce、对分组再统计、比较两个列表、把节点传给下一个 MATCH 和 collect 都不可用（返回节点和关系可以），请改写。"
NonSQLSourceTooLarge = "查询读到的对象类存放在数据集或索引里，或者分布在多个数据源中，需要逐表读取后关联；这次要读的数据超过上限或超时，请加条件缩小范围。"
CartesianProduct = "模式里有不相连的部分，其中至少两部分没有任何条件限制，结果会是两张表所有行的两两组合。请用关系类或 a.code = b.code 这类相等条件把它们连起来，或者给其中一边加上条件。"
QueryRequired = "query 不能为空。"
QueryTooLong = "query 长度不能超过 {{.max}} 个字符。"
LimitExceeded = "LIMIT 不能超过 {{.max}}。"
