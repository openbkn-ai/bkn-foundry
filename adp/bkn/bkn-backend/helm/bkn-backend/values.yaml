namespace: openbkn
moduleName: bkn-backend

# Environment variables: language/time zone.
env:
  timezone: Asia/Shanghai
  language: en_US.UTF-8

# bkn-safe (ISF replacement) cutover knobs. Default empty = ISF behavior.
# provider: "" | "shadow" | "bkn-safe". url: bkn-safe ClusterIP base. Revertible.
bknSafe:
  authzProvider: ""
  directoryProvider: ""
  url: ""

replicaCount: 1

# Node selector.
nodeSelector: {}

image:
  registry: ghcr.io/openbkn-ai
  repository: bkn-backend
  tag: "__VERSION__"
  pullPolicy: IfNotPresent

service:
  bknBackend:
    type: ClusterIP
    port: 13014
    nodePort: 31014
    ingress:
      enabled: true
      interface:
        path:
          - /api/bkn-backend/v1
          - /api/ontology-manager/v1

# Anti-affinity settings.
antiAffinity:
  enabled: true
  rule: "soft" # Optional values: hard, soft.

# Authentication switch.
auth:
  enabled: true

# Microservice communication dependency configuration.
depServices:
  class-443:
    ingressClass: class-443
  rds:
    host: mariadb-mariadb-master.resource.svc.cluster.local.
    port: 3330
    user: root
    password: ""
    type: MariaDB
  mq:
    mqType: kafka
    mqHost: kafka-headless.resource.svc.cluster.local.
    mqPort: 9097
    protocol: sasl_plaintext
    tenant: default
    auth:
      username: admin
      password: ""
      mechanism: PLAIN
  opensearch:
    host: opensearch-master.resource.svc.cluster.local.
    port: 9200
    protocol: http
    user: admin
    password: ""
  authorization-private:
    host: authorization-private
    port: 30920
    protocol: http
  user-management:
    host: user-management-private
    port: 30980
    protocol: http
  hydra-admin:
    # ISF replacement: introspect against bkn-safe's paired hydra (cross-ns).
    host: bkn-safe-hydra-admin
    port: 4445
    protocol: http
  mf-model-manager:
    host: mf-model-manager
    port: 9898
    protocol: http
  mf-model-api:
    host: mf-model-api
    port: 9898
    protocol: http
  ontology-query:
    host: ontology-query-svc
    port: 13018
    protocol: http
  vega-backend:
    host: vega-backend-svc
    port: 13014
    protocol: http
  agent-operator-integration:
    host: agent-operator-integration
    port: 9000
    protocol: http

config:
  server:
    runMode: release
    httpPort: 13014
    language: zh-CN
    readTimeOut: 600
    writeTimeOut: 600
    # Leave empty to use mf-model-manager's system default. Set a model name
    # here only when this BKN deployment must explicitly override it.
    defaultSmallModelName: ""
    defaultSmallModelEnabled: false
  log:
    logLevel: info
    developMode: false
    maxAge: 100
    maxBackups: 20
    maxSize: 100
  # OTel Collector configuration.
  otel:
    # Service name.
    service_name: "bkn-backend"
    # Runtime environment.
    environment: "production"
    # OTLP reporting endpoint.
    otlp_endpoint: "otelcol-contrib:4318"

    # Trace configuration.
    trace:
      enabled: false
      # Sampling rate: 0.0 - 1.0.
      sampling_rate: 1.0

    # Log configuration.
    log:
      enabled: false
      # Log level: debug, info, warn, error.
      level: "info"

# Resource configuration.
resources:
  requests:
    cpu: 0
    memory: 0Gi
  limits:
    cpu: 2
    memory: 4Gi

bknTrace:
  evidence:
    ingestUrl: ""
    timeoutMs: "2000"
    ingestTokenSecretName: ""
    ingestTokenSecretKey: "ingest-token"
  producerOutbox:
    enabled: false
    workerEnabled: false
    producerStreamID: "bkn-backend"
    applicationPrincipalID: "bkn-backend"
    queryGatewayTokenSecretName: ""
    queryGatewayTokenSecretKey: "query-gateway-token"
    cleanup:
      enabled: false
      schedule: "0 3 * * *"
      batchSize: 1000
      deliveredRetentionDays: 30
      abandonedRetentionDays: 180
