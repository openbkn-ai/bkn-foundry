apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.moduleName }}
  namespace: {{ .Values.namespace }}
  labels:
    module: {{ .Values.moduleName }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      module: {{ .Values.moduleName }}
  template:
    metadata:
      labels:
        module: {{ .Values.moduleName }}
    spec:
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      dnsConfig:
        options:
          - name: single-request-reopen
          - name: use-vc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      {{- if .Values.antiAffinity.enabled }}
      affinity:
        {{- if eq .Values.antiAffinity.rule "soft" }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: module
                      operator: In
                      values:
                        - {{ .Values.moduleName }}
        {{- else if eq .Values.antiAffinity.rule "hard" }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: module
                    operator: In
                    values:
                      - {{ .Values.moduleName }}
        {{- end }}
      {{- end }}
      containers:
      - name: bkn-backend
        image: {{ template "bkn-backend.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - name: backend
            containerPort: {{ .Values.service.bknBackend.port }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.service.bknBackend.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/bkn-backend/v1/health
            port: backend
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        env:
          - name: TZ
            value: {{ .Values.env.timezone }}
          - name: LANG
            value: {{ .Values.env.language }}
          - name: BKN_SAFE_URL
            value: {{ .Values.bknSafe.url | quote }}
          - name: BKN_SAFE_BASE_URL
            value: {{ .Values.bknSafe.url | quote }}
          {{- if .Values.bknTrace.projectionRead.enabled }}
          - name: BKN_TRACE_PROJECTION_GRANT_ENABLED
            value: "true"
          - name: BKN_TRACE_PROJECTION_GRANT_ISSUER
            value: {{ required "bknTrace.projectionRead.issuer is required when projection reads are enabled" .Values.bknTrace.projectionRead.issuer | quote }}
          - name: BKN_TRACE_PROJECTION_GRANT_AUDIENCE
            value: {{ required "bknTrace.projectionRead.audience is required when projection reads are enabled" .Values.bknTrace.projectionRead.audience | quote }}
          - name: BKN_TRACE_PROJECTION_GRANT_PUBLIC_KEYS
            valueFrom:
              secretKeyRef:
                name: {{ required "bknTrace.projectionRead.publicKeysSecretName is required when projection reads are enabled" .Values.bknTrace.projectionRead.publicKeysSecretName | quote }}
                key: {{ .Values.bknTrace.projectionRead.publicKeysSecretKey | quote }}
          {{- end }}
          {{- if .Values.bknTrace.evidencePublisher.enabled }}
          - name: BKN_TRACE_EVIDENCE_PUBLISHER_ENABLED
            value: "true"
          - name: BKN_TRACE_KAFKA_BROKERS
            value: {{ required "bknTrace.evidencePublisher.brokers is required" .Values.bknTrace.evidencePublisher.brokers | quote }}
          - name: BKN_TRACE_KAFKA_SASL_MECHANISM
            value: "PLAIN"
          - name: BKN_TRACE_KAFKA_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ required "bknTrace.evidencePublisher.usernameSecretName is required" .Values.bknTrace.evidencePublisher.usernameSecretName | quote }}
                key: {{ .Values.bknTrace.evidencePublisher.usernameSecretKey | quote }}
          - name: BKN_TRACE_KAFKA_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ required "bknTrace.evidencePublisher.passwordSecretName is required" .Values.bknTrace.evidencePublisher.passwordSecretName | quote }}
                key: {{ .Values.bknTrace.evidencePublisher.passwordSecretKey | quote }}
          - name: BKN_TRACE_PRODUCER_ID
            value: {{ required "bknTrace.evidencePublisher.producerId is required" .Values.bknTrace.evidencePublisher.producerId | quote }}
          - name: BKN_TRACE_WORKLOAD_IDENTITY
            value: {{ required "bknTrace.evidencePublisher.workloadIdentity is required" .Values.bknTrace.evidencePublisher.workloadIdentity | quote }}
          - name: BKN_TRACE_PRODUCER_STREAM_ID
            value: {{ required "bknTrace.evidencePublisher.producerStreamId is required" .Values.bknTrace.evidencePublisher.producerStreamId | quote }}
          - name: BKN_TRACE_CAPTURE_POLICY_REVISION
            value: {{ required "bknTrace.evidencePublisher.capturePolicyRevision is required" .Values.bknTrace.evidencePublisher.capturePolicyRevision | quote }}
          - name: BKN_TRACE_EVIDENCE_QUEUE_MAX_RECORDS
            value: {{ .Values.bknTrace.evidencePublisher.queueMaxRecords | quote }}
          - name: BKN_TRACE_EVIDENCE_QUEUE_MAX_BYTES
            value: {{ .Values.bknTrace.evidencePublisher.queueMaxBytes | quote }}
          - name: BKN_TRACE_EVIDENCE_MAX_RECORD_BYTES
            value: {{ .Values.bknTrace.evidencePublisher.maxRecordBytes | quote }}
          - name: BKN_TRACE_EVIDENCE_MAX_ATTEMPTS
            value: {{ .Values.bknTrace.evidencePublisher.maxAttempts | quote }}
          - name: BKN_TRACE_EVIDENCE_RETRY_BACKOFF_MS
            value: {{ .Values.bknTrace.evidencePublisher.retryBackoffMs | quote }}
          {{- end }}
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          {{- if .Values.depServices.rds.type }}
          - name: DB_TYPE
            value: {{ .Values.depServices.rds.type | quote }}
          {{- end }}
          {{- if .Values.depServices.mq.mqType }}
          - name: MQ_TYPE
            value: {{ .Values.depServices.mq.mqType | quote }}
          {{- end }}
          - name: DM_SVC_PATH
            value: /opt/bkn-backend/config
          - name: KN_CHILD_RESOURCE_FILTER_CHUNK_SIZE
            value: {{ .Values.auth.knChildResourceFilterChunkSize | quote }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
          - name: {{ .Values.moduleName }}-cm
            mountPath: /opt/bkn-backend/config
      restartPolicy: Always
      volumes:
      - name: {{ .Values.moduleName }}-cm
        configMap:
          name: {{ .Values.moduleName }}-cm
