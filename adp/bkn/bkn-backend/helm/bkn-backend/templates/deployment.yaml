apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.moduleName }}
  namespace: {{ .Values.namespace }}
  labels:
    module: {{ .Values.moduleName }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      module: {{ .Values.moduleName }}
  template:
    metadata:
      labels:
        module: {{ .Values.moduleName }}
    spec:
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      dnsConfig:
        options:
          - name: single-request-reopen
          - name: use-vc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      {{- if .Values.antiAffinity.enabled }}
      affinity:
        {{- if eq .Values.antiAffinity.rule "soft" }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: module
                      operator: In
                      values:
                        - {{ .Values.moduleName }}
        {{- else if eq .Values.antiAffinity.rule "hard" }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: module
                    operator: In
                    values:
                      - {{ .Values.moduleName }}
        {{- end }}
      {{- end }}
      containers:
      - name: bkn-backend
        image: {{ template "bkn-backend.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - name: backend
            containerPort: {{ .Values.service.bknBackend.port }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.service.bknBackend.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: {{ .Values.service.bknBackend.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        env:
          - name: TZ
            value: {{ .Values.env.timezone }}
          - name: LANG
            value: {{ .Values.env.language }}
          - name: BKN_SAFE_URL
            value: {{ .Values.bknSafe.url | quote }}
          - name: BKN_SAFE_BASE_URL
            value: {{ .Values.bknSafe.url | quote }}
          {{- if .Values.bknTrace.projectionRead.enabled }}
          - name: BKN_TRACE_PROJECTION_GRANT_ENABLED
            value: "true"
          - name: BKN_TRACE_PROJECTION_GRANT_ISSUER
            value: {{ required "bknTrace.projectionRead.issuer is required when projection reads are enabled" .Values.bknTrace.projectionRead.issuer | quote }}
          - name: BKN_TRACE_PROJECTION_GRANT_AUDIENCE
            value: {{ required "bknTrace.projectionRead.audience is required when projection reads are enabled" .Values.bknTrace.projectionRead.audience | quote }}
          - name: BKN_TRACE_PROJECTION_GRANT_PUBLIC_KEYS
            valueFrom:
              secretKeyRef:
                name: {{ required "bknTrace.projectionRead.publicKeysSecretName is required when projection reads are enabled" .Values.bknTrace.projectionRead.publicKeysSecretName | quote }}
                key: {{ .Values.bknTrace.projectionRead.publicKeysSecretKey | quote }}
          {{- end }}
          {{- if .Values.bknTrace.evidence.ingestUrl }}
          - name: BKN_TRACE_EVIDENCE_INGEST_URL
            value: {{ .Values.bknTrace.evidence.ingestUrl | quote }}
          - name: BKN_TRACE_EVIDENCE_TIMEOUT_MS
            value: {{ .Values.bknTrace.evidence.timeoutMs | quote }}
          {{- end }}
          {{- if .Values.bknTrace.evidence.ingestTokenSecretName }}
          - name: BKN_TRACE_EVIDENCE_INGEST_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.bknTrace.evidence.ingestTokenSecretName | quote }}
                key: {{ .Values.bknTrace.evidence.ingestTokenSecretKey | quote }}
          {{- end }}
          - name: BKN_TRACE_OUTBOX_ENABLED
            value: {{ .Values.bknTrace.producerOutbox.enabled | quote }}
          - name: BKN_TRACE_OUTBOX_WORKER_ENABLED
            value: {{ .Values.bknTrace.producerOutbox.workerEnabled | quote }}
          - name: BKN_TRACE_PRODUCER_STREAM_ID
            value: {{ .Values.bknTrace.producerOutbox.producerStreamID | quote }}
          - name: BKN_TRACE_APPLICATION_PRINCIPAL_ID
            value: {{ .Values.bknTrace.producerOutbox.applicationPrincipalID | quote }}
          {{- if .Values.bknTrace.producerOutbox.queryGatewayTokenSecretName }}
          - name: BKN_TRACE_QUERY_GATEWAY_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.bknTrace.producerOutbox.queryGatewayTokenSecretName | quote }}
                key: {{ .Values.bknTrace.producerOutbox.queryGatewayTokenSecretKey | quote }}
          {{- end }}
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          {{- if .Values.depServices.rds.type }}
          - name: DB_TYPE
            value: {{ .Values.depServices.rds.type | quote }}
          {{- end }}
          {{- if .Values.depServices.mq.mqType }}
          - name: MQ_TYPE
            value: {{ .Values.depServices.mq.mqType | quote }}
          {{- end }}
          - name: DM_SVC_PATH
            value: /opt/bkn-backend/config
          - name: AUTH_ENABLED
            value: {{ .Values.auth.enabled | quote }}
          - name: KN_CHILD_RESOURCE_PEP_ENABLED
            value: {{ .Values.auth.knChildResourcePepEnabled | quote }}
          - name: ACTION_EXECUTION_PEP_ENABLED
            value: {{ .Values.auth.actionExecutionPepEnabled | quote }}
          - name: KN_CHILD_RESOURCE_FILTER_CHUNK_SIZE
            value: {{ .Values.auth.knChildResourceFilterChunkSize | quote }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
          - name: {{ .Values.moduleName }}-cm
            mountPath: /opt/bkn-backend/config
      restartPolicy: Always
      volumes:
      - name: {{ .Values.moduleName }}-cm
        configMap:
          name: {{ .Values.moduleName }}-cm
