{{- if empty .Values.cursorEncryption.existingSecret }}
{{- $name := include "ontology-query.cursorSecretName" . }}
{{- $key := .Values.cursorEncryption.secretKey }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  {{ $key }}: {{ if and $existing (hasKey $existing.data $key) }}{{ index $existing.data $key | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
{{- end }}
