{{- if and (gt (int .Values.replicaCount) 1) (empty .Values.cursorEncryption.existingSecret) }}
{{- fail "cursorEncryption.existingSecret is required when replicaCount is greater than 1" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.moduleName }}
  namespace: {{ .Values.namespace }}
  labels:
    module: {{ .Values.moduleName }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      module: {{ .Values.moduleName }}
  template:
    metadata:
      labels:
        module: {{ .Values.moduleName }}
    spec:
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      dnsConfig:
        options:
          - name: single-request-reopen
          - name: use-vc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      {{- if .Values.antiAffinity.enabled }}
      affinity:
        {{- if eq .Values.antiAffinity.rule "soft" }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: module
                      operator: In
                      values:
                        - {{ .Values.moduleName }}
        {{- else if eq .Values.antiAffinity.rule "hard" }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: module
                    operator: In
                    values:
                      - {{ .Values.moduleName }}
        {{- end }}
      {{- end }}
      containers:
      - name: ontology-query
        image: {{ template "ontology-query.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - name: query
            containerPort: {{ .Values.service.ontologyQuery.port }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.service.ontologyQuery.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ontology-query/v1/health
            port: query
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        env:
          - name: TZ
            value: {{ .Values.env.timezone }}
          - name: LANG
            value: {{ .Values.env.language }}
          {{- if .Values.cursorEncryption.existingSecret }}
          - name: BKN_QUERY_CURSOR_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.cursorEncryption.existingSecret | quote }}
                key: {{ .Values.cursorEncryption.secretKey | quote }}
          {{- end }}
          {{- if .Values.bknTrace.evidencePublisher.enabled }}
          - name: BKN_TRACE_EVIDENCE_PUBLISHER_ENABLED
            value: "true"
          - name: BKN_TRACE_KAFKA_BROKERS
            value: {{ required "bknTrace.evidencePublisher.brokers is required" .Values.bknTrace.evidencePublisher.brokers | quote }}
          - name: BKN_TRACE_KAFKA_SASL_MECHANISM
            value: "PLAIN"
          - name: BKN_TRACE_KAFKA_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ required "bknTrace.evidencePublisher.usernameSecretName is required" .Values.bknTrace.evidencePublisher.usernameSecretName | quote }}
                key: {{ .Values.bknTrace.evidencePublisher.usernameSecretKey | quote }}
          - name: BKN_TRACE_KAFKA_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ required "bknTrace.evidencePublisher.passwordSecretName is required" .Values.bknTrace.evidencePublisher.passwordSecretName | quote }}
                key: {{ .Values.bknTrace.evidencePublisher.passwordSecretKey | quote }}
          - name: BKN_TRACE_PRODUCER_ID
            value: {{ .Values.bknTrace.evidencePublisher.producerId | quote }}
          - name: BKN_TRACE_WORKLOAD_IDENTITY
            value: {{ .Values.bknTrace.evidencePublisher.workloadIdentity | quote }}
          - name: BKN_TRACE_PRODUCER_STREAM_ID
            value: {{ .Values.bknTrace.evidencePublisher.producerStreamId | quote }}
          - name: TRACE_ADMISSION_POLICY_URL
            value: {{ .Values.bknTrace.evidencePublisher.traceAdmission.policyURL | quote }}
          - name: TRACE_ADMISSION_CONFIGURATION_URL
            value: {{ .Values.bknTrace.evidencePublisher.traceAdmission.configurationURL | quote }}
          - name: TRACE_ADMISSION_HEARTBEAT_URL
            value: {{ .Values.bknTrace.evidencePublisher.traceAdmission.heartbeatURL | quote }}
          - name: TRACE_ADMISSION_ACK_URL_BASE
            value: {{ .Values.bknTrace.evidencePublisher.traceAdmission.ackURLBase | quote }}
          - name: TRACE_ADMISSION_TOKEN_URL
            value: {{ .Values.bknTrace.evidencePublisher.traceAdmission.tokenURL | quote }}
          - name: TRACE_ADMISSION_CLIENT_ID
            value: {{ required "bknTrace.evidencePublisher.traceAdmission.clientID is required" .Values.bknTrace.evidencePublisher.traceAdmission.clientID | quote }}
          - name: TRACE_ADMISSION_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ required "bknTrace.evidencePublisher.traceAdmission.clientSecretSecretName is required" .Values.bknTrace.evidencePublisher.traceAdmission.clientSecretSecretName | quote }}
                key: {{ .Values.bknTrace.evidencePublisher.traceAdmission.clientSecretSecretKey | quote }}
          - name: TRACE_ADMISSION_SCOPE
            value: {{ .Values.bknTrace.evidencePublisher.traceAdmission.scope | quote }}
          - name: TRACE_ADMISSION_AUDIENCE
            value: {{ .Values.bknTrace.evidencePublisher.traceAdmission.audienceClusterID | quote }}
          - name: TRACE_ADMISSION_CURRENT_KEY_ID
            value: {{ required "bknTrace.evidencePublisher.traceAdmission.currentKeyID is required" .Values.bknTrace.evidencePublisher.traceAdmission.currentKeyID | quote }}
          - name: TRACE_ADMISSION_CURRENT_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: {{ required "bknTrace.evidencePublisher.traceAdmission.currentPublicKeySecretName is required" .Values.bknTrace.evidencePublisher.traceAdmission.currentPublicKeySecretName | quote }}
                key: {{ .Values.bknTrace.evidencePublisher.traceAdmission.currentPublicKeySecretKey | quote }}
          - name: TRACE_ADMISSION_PREVIOUS_KEY_ID
            value: {{ .Values.bknTrace.evidencePublisher.traceAdmission.previousKeyID | quote }}
          - name: TRACE_ADMISSION_PREVIOUS_PUBLIC_KEY
            {{- if .Values.bknTrace.evidencePublisher.traceAdmission.previousPublicKeySecretName }}
            valueFrom:
              secretKeyRef:
                name: {{ .Values.bknTrace.evidencePublisher.traceAdmission.previousPublicKeySecretName | quote }}
                key: {{ .Values.bknTrace.evidencePublisher.traceAdmission.previousPublicKeySecretKey | quote }}
            {{- else }}
            value: ""
            {{- end }}
          - name: BKN_TRACE_EVIDENCE_QUEUE_MAX_RECORDS
            value: {{ .Values.bknTrace.evidencePublisher.queueMaxRecords | quote }}
          - name: BKN_TRACE_EVIDENCE_QUEUE_MAX_BYTES
            value: {{ .Values.bknTrace.evidencePublisher.queueMaxBytes | quote }}
          - name: BKN_TRACE_EVIDENCE_MAX_RECORD_BYTES
            value: {{ .Values.bknTrace.evidencePublisher.maxRecordBytes | quote }}
          - name: BKN_TRACE_EVIDENCE_MAX_ATTEMPTS
            value: {{ .Values.bknTrace.evidencePublisher.maxAttempts | quote }}
          - name: BKN_TRACE_EVIDENCE_RETRY_BACKOFF_MS
            value: {{ .Values.bknTrace.evidencePublisher.retryBackoffMs | quote }}
          {{- end }}
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          {{- if .Values.depServices.rds.type }}
          - name: DB_TYPE
            value: {{ .Values.depServices.rds.type | quote }}
          {{- end }}
          - name: DM_SVC_PATH
            value: /opt/ontology-query/config
          - name: ACTION_EXECUTION_MAX_OBJECTS
            value: "{{ .Values.env.actionExecutionMaxObjects }}"
          - name: ACTION_EXECUTION_DUPLICATE_WINDOW_SECONDS
            value: "{{ .Values.env.actionExecutionDuplicateWindowSeconds }}"
          - name: BKN_SAFE_BASE_URL
            value: {{ .Values.bknSafe.url | quote }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
          - name: {{ .Values.moduleName }}-cm
            mountPath: /opt/ontology-query/config
      restartPolicy: Always
      volumes:
      - name: {{ .Values.moduleName }}-cm
        configMap:
          name: {{ .Values.moduleName }}-cm
