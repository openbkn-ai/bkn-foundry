namespace: openbkn
moduleName: ontology-query

# Environment variables: language, time zone, and execution limits
env:
  timezone: Asia/Shanghai
  language: en_US.UTF-8
  actionExecutionMaxObjects: 10000  # Maximum objects allowed in a single action execution
  # Reject duplicate in-flight executes for the same kn + action type + instance set + dynamic_params within this window (seconds).
  # Set to 0 to disable duplicate detection (escape/kill switch: ACTION_EXECUTION_DUPLICATE_WINDOW_SECONDS=0).
  actionExecutionDuplicateWindowSeconds: 60

replicaCount: 1

# Node selector
nodeSelector: {}

image:
  registry: ghcr.io/openbkn-ai
  repository: ontology-query
  tag: "__VERSION__"
  pullPolicy: IfNotPresent

service:
  ontologyQuery:
    type: ClusterIP
    port: 13018
    nodePort: 31018
    ingress:
      enabled: true
      interface:
        path:
          - /api/ontology-query/v1

# Anti-affinity settings
antiAffinity:
  enabled: true
  rule: "soft" # Optional values: hard, soft

# Authentication switch
auth:
  enabled: true

bknSafe:
  url: "http://bkn-safe:3000"

# Dependency service configuration for microservice communication
depServices:
  class-443:
    ingressClass: class-443
  # Only required when bknTrace.producerOutbox.enabled is true. It shares the
  # bkn-backend instance and the openbkn schema, but owns separate tables.
  rds:
    host: mariadb-mariadb-master.resource.svc.cluster.local.
    port: 3330
    user: root
    password: ""
    type: MARIADB
  hydra-admin:
    host: bkn-safe-hydra-admin
    port: 4445
    protocol: http
  opensearch:
    host: opensearch-master.resource.svc.cluster.local.
    port: 9200
    protocol: http
    user: admin
    password: eisoo.com123
  bkn-backend:
    host: bkn-backend-svc
    port: 13014
    protocol: http
  agent-operator-integration:
    host: agent-operator-integration
    port: 9000
    protocol: http
  mf-model-manager:
    host: mf-model-manager
    port: 9898
    protocol: http
  mf-model-api:
    host: mf-model-api
    port: 9898
    protocol: http
  vega-backend:
    host: vega-backend-svc
    port: 13014
    protocol: http

config:
  server:
    runMode: release
    httpPort: 13018
    language: zh-CN
    readTimeOut: 120
    writeTimeOut: 120
    viewDataTimeout: 5m
    defaultSmallModelEnabled: true
    # Subgraph BFS only: silent truncate for filtered_cross_join virtual edges per relation step
    filteredCrossJoinMaxEdgeExpand: 10000
  log:
    logLevel: info
    developMode: false
    maxAge: 100
    maxBackups: 20
    maxSize: 100
  # OTel Collector configuration
  otel:
    # Service name
    service_name: "ontology-query"
    # Runtime environment
    environment: "production"
    # OTLP reporting endpoint
    otlp_endpoint: "otelcol-contrib:4318"

    # Trace configuration
    trace:
      enabled: false
      # Sampling rate: 0.0 - 1.0
      sampling_rate: 1.0

    # Log configuration
    log:
      enabled: false
      # Log level: debug, info, warn, error
      level: "info"

# Resource configuration
resources:
  requests:
    cpu: 0
    memory: 0Gi
  limits:
    cpu: 4
    memory: 32Gi

bknTrace:
  evidence:
    ingestUrl: ""
    timeoutMs: "2000"
    ingestTokenSecretName: ""
    ingestTokenSecretKey: "ingest-token"
  producerOutbox:
    enabled: false
    workerEnabled: false
    producerStreamID: "ontology-query"
    applicationPrincipalID: "ontology-query"
    queryGatewayTokenSecretName: ""
    queryGatewayTokenSecretKey: "query-gateway-token"
    cleanup:
      enabled: false
      schedule: "0 3 * * *"
      batchSize: 1000
      deliveredRetentionDays: 30
      abandonedRetentionDays: 180
