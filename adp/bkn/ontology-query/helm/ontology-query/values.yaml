namespace: openbkn
moduleName: ontology-query

# Environment variables: language, time zone, and execution limits
env:
  timezone: Asia/Shanghai
  language: en_US.UTF-8
  actionExecutionMaxObjects: 10000  # Maximum objects allowed in a single action execution
  # Reject duplicate in-flight executes for the same kn + action type + instance set + dynamic_params within this window (seconds).
  # Set to 0 to disable duplicate detection (escape/kill switch: ACTION_EXECUTION_DUPLICATE_WINDOW_SECONDS=0).
  actionExecutionDuplicateWindowSeconds: 60

replicaCount: 1

# Node selector
nodeSelector: {}

image:
  registry: ghcr.io/openbkn-ai
  repository: ontology-query
  tag: "__VERSION__"
  pullPolicy: IfNotPresent

service:
  ontologyQuery:
    type: ClusterIP
    port: 13018
    nodePort: 31018
    ingress:
      enabled: true
      interface:
        path:
          - /api/ontology-query/v1

# Anti-affinity settings
antiAffinity:
  enabled: true
  rule: "soft" # Optional values: hard, soft

bknSafe:
  url: "http://bkn-safe:3000"

# Dependency service configuration for microservice communication
depServices:
  class-443:
    ingressClass: class-443
  rds:
    host: mariadb-mariadb-master.resource.svc.cluster.local.
    port: 3330
    user: root
    password: ""
    type: MARIADB
  hydra-admin:
    host: bkn-safe-hydra-admin
    port: 4445
    protocol: http
  opensearch:
    host: opensearch-master.resource.svc.cluster.local.
    port: 9200
    protocol: http
    user: admin
    password: eisoo.com123
  bkn-backend:
    host: bkn-backend-svc
    port: 13014
    protocol: http
  agent-operator-integration:
    host: agent-operator-integration
    port: 9000
    protocol: http
  mf-model-manager:
    host: mf-model-manager
    port: 9898
    protocol: http
  mf-model-api:
    host: mf-model-api
    port: 9898
    protocol: http
  vega-backend:
    host: vega-backend-svc
    port: 13014
    protocol: http

config:
  server:
    runMode: release
    httpPort: 13018
    language: zh-CN
    readTimeOut: 120
    writeTimeOut: 120
    viewDataTimeout: 5m
    defaultSmallModelEnabled: true
    # Subgraph BFS only: silent truncate for filtered_cross_join virtual edges per relation step
    filteredCrossJoinMaxEdgeExpand: 10000
  log:
    logLevel: info
    developMode: false
    maxAge: 100
    maxBackups: 20
    maxSize: 100
  # OTel Collector configuration
  otel:
    # Service name
    service_name: "ontology-query"
    # Runtime environment
    environment: "production"
    # OTLP reporting endpoint
    otlp_endpoint: "otelcol-contrib:4318"

    # Trace configuration
    trace:
      enabled: false
      # Sampling rate: 0.0 - 1.0
      sampling_rate: 1.0

    # Log configuration
    log:
      enabled: false
      # Log level: debug, info, warn, error
      level: "info"

# Resource configuration
resources:
  requests:
    cpu: 0
    memory: 0Gi
  limits:
    cpu: 4
    memory: 32Gi

# All replicas must use the same secret so encrypted query cursors survive
# load balancing. A single replica may omit it and use a process-local random
# key; Helm rejects replicaCount > 1 when existingSecret is empty.
cursorEncryption:
  existingSecret: ""
  secretKey: "cursor-key"

bknTrace:
  evidencePublisher:
    enabled: false
    brokers: ""
    usernameSecretName: ""
    usernameSecretKey: "username"
    passwordSecretName: ""
    passwordSecretKey: "password"
    producerId: "ontology-query"
    workloadIdentity: "ontology-query"
    producerStreamId: "ontology-query"
    traceAdmission:
      policyURL: "http://agent-observability-internal:8081/api/agent-observability/v1/internal/trace-evidence/policy"
      configurationURL: "http://agent-observability:8080/api/agent-observability/v1/trace-evidence-configuration"
      heartbeatURL: "http://agent-observability-internal:8081/api/agent-observability/v1/internal/trace-evidence/endpoints:heartbeat"
      ackURLBase: "http://agent-observability-internal:8081/api/agent-observability/v1/internal/trace-evidence/operations"
      tokenURL: "http://bkn-safe:4444/oauth2/token"
      clientID: ""
      clientSecretSecretName: ""
      clientSecretSecretKey: "client-secret"
      scope: ""
      audienceClusterID: "cluster-a"
      currentKeyID: ""
      currentPublicKeySecretName: ""
      currentPublicKeySecretKey: "public-key"
      previousKeyID: ""
      previousPublicKeySecretName: ""
      previousPublicKeySecretKey: "public-key"
    queueMaxRecords: 4096
    queueMaxBytes: 67108864
    maxRecordBytes: 1048576
    maxAttempts: 3
    retryBackoffMs: 100

# Retention of action execution logs (#790). When enabled, a CronJob deletes finished
# executions (completed, failed, cancelled) that ended more than retentionDays ago, together
# with their per-instance results. Pending and running executions are never deleted.
# Disabled by default: nothing is removed until this is turned on explicitly.
actionLogRetention:
  enabled: false
  schedule: "30 3 * * *"
  retentionDays: 90
  batchSize: 500    # executions deleted per batch (max 1000)
  maxBatches: 20    # batches per run; the next run continues where this one stopped
  # One run deletes at most batchSize x maxBatches executions (10000 with the defaults, i.e.
  # 10000 a day on the default daily schedule). A run that stops at this limit logs
  # more_remaining=true and a warning; raise maxBatches or schedule runs more often if it repeats.
  dryRun: false     # true: only log how many executions and results would be deleted
