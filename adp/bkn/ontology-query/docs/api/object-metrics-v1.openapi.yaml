openapi: 3.1.0
info:
  title: OpenBKN Object Metric Query API
  version: 1.0.0
  description: Trials an unpublished definition or executes an immutable, published object-metric version.
servers:
  - url: /api/ontology-query
security:
  - bearerAuth: []
paths:
  /v1/knowledge-networks/{kn_id}/object-metrics/trial:
    post:
      operationId: trialObjectMetricData
      summary: Trial an unpublished object metric against real data without persisting it.
      parameters:
        - name: kn_id
          in: path
          required: true
          schema: { type: string }
        - name: branch
          in: query
          schema: { type: string, default: main }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectMetricTrial" }
      responses:
        "200":
          description: Trial result produced by the same runtime as a published query.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectMetricData" }
        "400": { description: "Invalid definition, runtime input, or time range. An object-data source property error during execution may include metadata.reason=property_unavailable." }
        "403": { description: "The caller lacks query_data on a required resource or full access to a trial input property (including an unknown property). These authorization failures occur before execution and do not include metadata.reason=property_unavailable." }
        "409": { description: Result changed between pages; restart pagination from the first page. }
        "422": { description: "The definition cannot be executed, or HAVING was requested on an incomplete result." }
  /v1/knowledge-networks/{kn_id}/object-metrics/{metric_id}/data:
    post:
      operationId: queryObjectMetricData
      summary: Query an immutable published object metric version.
      parameters:
        - name: kn_id
          in: path
          required: true
          schema: { type: string }
        - name: metric_id
          in: path
          required: true
          schema: { type: string }
        - name: branch
          in: query
          schema: { type: string, default: main }
        - name: version
          in: query
          required: true
          description: Immutable published metric version. Runtime never resolves an implicit latest version.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectMetricQuery" }
      responses:
        "200":
          description: Metric result with explicit no-data, unavailable, or partial status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectMetricData" }
        "400": { description: "Invalid runtime filter, dimension, time range, or version. An object-data source property error during execution includes metadata.reason=property_unavailable and does not distinguish inaccessible from unknown properties." }
        "403": { description: "The caller cannot query this metric, or no source property can be returned. The latter includes metadata.reason=property_unavailable." }
        "404": { description: Metric or referenced ontology element not found. }
        "409": { description: The requested version is not published, or the result changed between pages. }
        "422": { description: The immutable definition cannot be executed against current data, or HAVING was requested on an incomplete result. }
  /v1/knowledge-networks/{kn_id}/object-metrics/{metric_id}/data/drill-through:
    post:
      operationId: drillThroughObjectMetricData
      summary: Page through authorized participants of a published metric result bucket.
      parameters:
        - name: kn_id
          in: path
          required: true
          schema: { type: string }
        - name: metric_id
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectMetricDrillThroughRequest" }
      responses:
        "200":
          description: Paged participants from current data, possibly partial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectMetricDrillThrough" }
        "400": { description: "Invalid bucket, query, or cursor." }
        "403": { description: The caller cannot query the metric or source data. }
        "409": { description: The selected bucket is no longer available. }
        "422": { description: "The selected result does not advertise participants, or participant lookup is unavailable for this metric." }
  /v1/knowledge-networks/{kn_id}/object-metrics/trial/drill-through:
    post:
      operationId: trialObjectMetricDrillThrough
      summary: Page through authorized participants of a trial result bucket.
      parameters:
        - name: kn_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectMetricTrialDrillThroughRequest" }
      responses:
        "200":
          description: Paged participants from current data, possibly partial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectMetricDrillThrough" }
        "400": { description: "Invalid bucket, query, or cursor." }
        "403": { description: The caller cannot query the trial or source data. }
        "409": { description: The selected bucket is no longer available. }
        "422": { description: "The selected result does not advertise participants, or participant lookup is unavailable for this metric." }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PropertyRef:
      type: object
      required: [object_type_id, property_name]
      properties:
        object_type_id: { type: string }
        property_name: { type: string }
        relation_path_alias: { type: string }
    ObjectMetricQuery:
      type: object
      additionalProperties: false
      properties:
        instance_identities:
          type: array
          items: { type: object, additionalProperties: true }
        filter:
          type: object
          description: Typed condition AST restricted to the published query capabilities.
          additionalProperties: true
        group_by:
          type: array
          description: Runtime dimensions selected from the metric definition's query_capabilities.analysis_dimensions. Fixed grain is always applied and cannot be removed.
          items: { $ref: "#/components/schemas/PropertyRef" }
        having:
          type: object
          additionalProperties: false
          required: [operator]
          description: Filters final metric values after the complete atomic, derived, or composite result is computed. Rejected on partial results.
          properties:
            operator: { type: string, enum: [eq, ne, gt, gte, lt, lte, is_null, is_not_null] }
            value: { description: Required except for is_null and is_not_null; must match the result physical type. }
            unit_code: { type: string, description: When provided, must equal the result unit code. }
        order_by:
          type: array
          description: Sorts final rows. Ties are broken by the stable result identity; nulls sort last.
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string, enum: [value, time, dimension] }
              dimension: { $ref: "#/components/schemas/PropertyRef" }
              direction: { type: string, enum: [asc, desc] }
        page_size: { type: integer, minimum: 1, maximum: 1000, description: Optional. Omit to return all rows; pagination is stateless and re-evaluates the query. }
        cursor: { type: string, description: Opaque next_cursor from a prior page of the identical query. Returns 409 if the recalculated result has changed. }
        time:
          type: object
          required: [start, end]
          additionalProperties: false
          properties:
            start: { type: integer, format: int64, description: Inclusive Unix time in milliseconds. }
            end: { type: integer, format: int64, description: Inclusive Unix time in milliseconds. }
        bucket_selection:
          type: object
          additionalProperties: false
          required: [parent_query, bucket_key]
          properties:
            parent_query: { $ref: "#/components/schemas/ObjectMetricQuery" }
            bucket_key: { type: string }
    ObjectMetricTrial:
      type: object
      additionalProperties: false
      required: [definition, query]
      properties:
        definition:
          type: object
          description: A complete atomic, derived, or composite ObjectMetricDefinitionV1. Non-atomic dependencies must reference published immutable versions.
          additionalProperties: true
        query: { $ref: "#/components/schemas/ObjectMetricQuery" }
    ObjectMetricData:
      type: object
      required: [model, entries, status, total_count, overall_ms]
      properties:
        model:
          type: object
          additionalProperties: true
        entries:
          type: array
          items:
            type: object
            required: [status]
            properties:
              instance_identity: { type: object, additionalProperties: true }
              dimensions: { type: object, additionalProperties: true }
              dimension_cells:
                type: array
                description: Full dimension references; unlike the legacy dimensions map, relation path aliases remain distinct.
                items:
                  type: object
                  required: [ref, value]
                  properties:
                    ref: { $ref: "#/components/schemas/PropertyRef" }
                    value: {}
              time: { type: integer, format: int64 }
              time_bucket:
                type: object
                required: [start, end]
                properties:
                  start: { type: integer, format: int64 }
                  end: { type: integer, format: int64 }
              value: {}
              status: { type: string, enum: [ok, no_data, unavailable] }
              bucket_key: { type: string, description: Opaque result locator; does not grant data access. }
              available_actions:
                type: array
                items: { type: string, enum: [filter, drill, participants, context] }
        status: { type: string, enum: [ok, no_data, unavailable, partial] }
        empty_reason: { type: string, enum: [filtered_out], description: Present when HAVING excluded every computed row. }
        total_count: { type: integer, description: Number of final rows after HAVING and before pagination. }
        next_cursor: { type: string, description: Opaque cursor for the next page, if any. }
        warnings:
          type: array
          items: { type: string }
        overall_ms: { type: integer, format: int64 }
        evaluated_at: { type: integer, format: int64 }
        effective_window:
          type: object
          required: [start, end]
          properties:
            start: { type: integer, format: int64 }
            end: { type: integer, format: int64 }
    ObjectMetricDrillThroughRequest:
      type: object
      additionalProperties: false
      required: [query, bucket_key]
      properties:
        query: { $ref: "#/components/schemas/ObjectMetricQuery" }
        bucket_key: { type: string }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        cursor: { type: string }
    ObjectMetricTrialDrillThroughRequest:
      type: object
      additionalProperties: false
      required: [query, bucket_key, definition]
      properties:
        query: { $ref: "#/components/schemas/ObjectMetricQuery" }
        bucket_key: { type: string }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        cursor: { type: string }
        definition: { type: object, additionalProperties: true }
    ObjectMetricDrillThrough:
      type: object
      required: [participants, evaluated_at, status]
      properties:
        participants:
          type: array
          items:
            type: object
            required: [instance_identity, role]
            properties:
              instance_identity: { type: object, additionalProperties: true }
              role: { type: string }
        next_cursor: { type: string }
        bucket_value: {}
        evaluated_at: { type: integer, format: int64 }
        status: { type: string, enum: [ok, partial] }
        warnings:
          type: array
          items: { type: string }
