openapi: 3.0.3
info:
  title: Action admission inspection and execution observations
  version: 1.0.0
servers:
  - url: /
paths:
  /api/ontology-query/v1/knowledge-networks/{kn_id}/action-types/{at_id}/execute/inspect:
    post:
      operationId: inspectActionExecution
      summary: Inspect the actual action admission guards without executing its source
      description: >-
        Uses the same published definition, caller and proxy permissions, explicit
        targets, preconditions, parameter mapping and inflight duplicate guards as
        execute. Does not allocate an execution, enqueue work, invoke a source or
        create business Trace. Authenticated admission inspection is an ordinary
        domain read. The response never grants later execution authority.
      security:
        - bearerAuth: []
      parameters:
        - {in: path, name: kn_id, required: true, schema: {type: string}}
        - {in: path, name: at_id, required: true, schema: {type: string}}
        - {in: query, name: branch, schema: {type: string, enum: [main], default: main}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Same operation-specific execution_schema as execute; no dry_run flag or alternate execution mode.
              properties:
                dynamic_params: {type: object}
                _instance_identities: {type: array, items: {type: object}}
                object_input: {type: object}
                relation_target:
                  type: object
                  properties:
                    source_identity: {type: object}
                    target_identity: {type: object}
      responses:
        '200':
          description: Observed admission decision. Unavailable dependencies are not valid rejections.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionInspection'}
        '400': {description: Invalid request body}
        '401': {description: Invalid or missing user authentication}
        '503': {description: Runtime inspection is unavailable}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    ActionInspection:
      type: object
      required: [kn_id, action_type_id, observed_at, phase, decision, duplicate_check_enabled, duplicate_window_seconds, preconditions_checked]
      properties:
        kn_id: {type: string}
        action_type_id: {type: string}
        observed_at: {type: integer, format: int64}
        decision: {type: string, enum: [accepted, rejected, unavailable]}
        phase: {type: string, enum: [definition, input, authorization, proxy_authorization, target, precondition, parameters, duplicate, complete]}
        error_code: {type: string}
        operation_config: {type: object}
        execution_mode: {type: string, enum: [once, per_instance]}
        target_count: {type: integer, minimum: 0}
        total_count: {type: integer, minimum: 0}
        targets: {type: array, items: {type: object}}
        fingerprint: {type: string}
        duplicate_check_enabled: {type: boolean}
        duplicate_window_seconds: {type: integer, minimum: 0}
        duplicate_execution_id: {type: string}
        preconditions_checked: {type: integer, minimum: 0}
    ActionExecutionObservations:
      type: object
      description: >-
        The existing full action-log endpoint returns preparation on the execution
        and binding_context/invocation_observation on each result. These are
        server-generated evidence, never accepted from caller input. Read every
        result page before comparing counts. Missing observations are inconclusive.
      properties:
        preparation: {$ref: '#/components/schemas/ActionInspection'}
        results:
          type: array
          items:
            type: object
            properties:
              binding_context:
                type: object
                description: Authorized target properties actually used for binding this invocation.
              invocation_observation:
                type: object
                properties:
                  authorization: {type: string, enum: [accepted, rejected, unavailable]}
                  source_authorization: {type: string, enum: [accepted, rejected, unavailable]}
                  error_code: {type: string}
