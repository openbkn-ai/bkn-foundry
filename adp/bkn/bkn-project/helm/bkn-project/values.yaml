namespace: openbkn
moduleName: bkn-project

# Environment variables: language/time zone.
env:
  timezone: Asia/Shanghai
  language: en_US.UTF-8

# Certificate refresh for licensed extension points.
bknSafe:
  url: "http://bkn-safe:3000"

# Settings of an edition image, as environment variables (name/value or valueFrom entries).
extraEnv: []

# Containers an edition runs before the service, such as its database migration.
initContainers: []

# A migration an edition runs before the service, on the service's own image (so it follows
# image.registry and image.tag), with the same configuration mounted. The community image has no
# migration; keep it off there.
migration:
  enabled: false
  args: [migrate]
  # A Secret with keys `user` and `password` for the migration account. When empty, the migration
  # runs with the service account, which then needs the migration's privileges too.
  existingSecret: ""

replicaCount: 1

# Node selector.
nodeSelector: {}

image:
  registry: ghcr.io/openbkn-ai
  repository: bkn-project
  tag: "__VERSION__"
  pullPolicy: IfNotPresent

service:
  bknProject:
    type: ClusterIP
    port: 13016
    nodePort: 31016
    ingress:
      enabled: true
      interface:
        path:
          - /api/bkn-project/v1

# Built-in git store. One bare repository per release lineage is kept under
# /data/git. The volume is ReadWriteOnce, so keep replicaCount at 1 while it
# is enabled.
persistence:
  enabled: true
  size: 5Gi
  # Empty uses the cluster's default StorageClass.
  storageClass: ""

# Anti-affinity settings.
antiAffinity:
  enabled: true
  rule: "soft" # Optional values: hard, soft.

# Microservice communication dependency configuration.
depServices:
  class-443:
    ingressClass: class-443
  rds:
    host: mariadb-mariadb-master.resource.svc.cluster.local.
    port: 3330
    # The service account: SELECT, INSERT, UPDATE and DELETE on the t_bkn_project_* tables of the
    # openbkn database, no DDL (tables are created by data-migrator). Not root.
    user: bkn_project
    password: ""
    # A Secret with keys `user` and `password` to use instead of the two values above. When empty,
    # the chart keeps them in its own Secret; they never go into the ConfigMap.
    existingSecret: ""
    type: MariaDB
  hydra-admin:
    # Introspect against bkn-safe's paired Hydra.
    host: bkn-safe-hydra-admin
    port: 4445
    protocol: http
  bkn-backend:
    host: bkn-backend-svc
    port: 13014
    protocol: http
  agent-operator-integration:
    host: agent-operator-integration
    port: 9000
    protocol: http
  vega-backend:
    host: vega-backend-svc
    port: 13014
    protocol: http
  bkn-agent:
    host: bkn-agent
    port: 30800
    protocol: http

config:
  server:
    runMode: release
    httpPort: 13016
    language: zh-CN
    readTimeOut: 600
    writeTimeOut: 600
  log:
    logLevel: info
    developMode: false
    maxAge: 100
    maxBackups: 20
    maxSize: 100
  gitStore:
    rootDir: /data/git
  # Drafting an ontology from table structure. The keyword lists are business vocabulary.
  draft:
    codeTableMaxRows: 500
    codeTableMaxColumns: 3
    adoptHitRate: 0.95
    suggestHitRate: 0.8
    # A relation inferred from a field name is only proposed when the field has fewer distinct values.
    minInferredDistinct: 10
    queryTimeout: 60
    timeout: 10m
    # Each attempt of the check after a draft is confirmed; a failed attempt is retried once.
    checkTimeout: 10m
    privacyKeywords: [姓名, 手机, 电话, 身份证, 证件, 邮箱, 住址, 地址, 银行卡, 出生,
      full_name, first_name, last_name, phone, mobile, telephone, id_card, id_number,
      passport, email, address, bank_card, card_number, birth]
    nameFieldKeywords: [name, label, title, 名称, 名字]
    identifierWords: [id, code, no, num, number, key, sn, 编号, 编码, 代码, 号码]
    genericStems: [name, remark, desc, description, status, type, 名称, 备注, 描述, 状态, 类型]
  # OTel Collector configuration.
  otel:
    # Service name.
    service_name: "bkn-project"
    # Runtime environment.
    environment: "production"
    # OTLP reporting endpoint.
    otlp_endpoint: "otelcol-contrib:4318"

    # Trace configuration.
    trace:
      enabled: false
      # Sampling rate: 0.0 - 1.0.
      sampling_rate: 1.0

    # Log configuration.
    log:
      enabled: false
      # Log level: debug, info, warn, error.
      level: "info"

# Resource configuration.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

# The service drains requests and waits for its workers for up to 60 s after SIGTERM; the pod gets
# a little longer before it is killed.
terminationGracePeriodSeconds: 75
