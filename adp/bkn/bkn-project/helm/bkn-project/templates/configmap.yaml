apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.moduleName }}-cm
  namespace: {{ .Values.namespace }}
data:
  bkn-project-config.yaml: |
    server:
      {{- toYaml .Values.config.server | nindent 6 }}
    log:
      {{- toYaml .Values.config.log | nindent 6 }}
    otel:
      {{- toYaml .Values.config.otel | nindent 6 }}
    gitStore:
      {{- toYaml .Values.config.gitStore | nindent 6 }}
    draft:
      {{- toYaml .Values.config.draft | nindent 6 }}
    depServices:
      {{- /* The database account goes to the pod from a Secret, never into this file. */}}
      {{- $rds := omit .Values.depServices.rds "user" "password" "existingSecret" }}
      {{- toYaml (merge (dict "rds" $rds) (omit .Values.depServices "rds")) | nindent 6 }}

  dm_svc.conf: |
    TIME_ZON=(480)
    LANGUAGE=(cn)
    DM=({{ .Values.depServices.rds.host }})
    [DM]
    LOGIN_MODE=(1)
