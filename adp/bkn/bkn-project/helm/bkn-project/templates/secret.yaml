{{- if not .Values.depServices.rds.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.moduleName }}-db
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  user: {{ .Values.depServices.rds.user | quote }}
  password: {{ .Values.depServices.rds.password | quote }}
{{- end }}
