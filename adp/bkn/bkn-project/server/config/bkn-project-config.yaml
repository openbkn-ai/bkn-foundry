server:
  runMode: release
  httpPort: 13016
  language: zh-CN
  readTimeOut: 600
  writeTimeOut: 600
log:
  logLevel: debug
  developMode: false
  maxAge: 100
  maxBackups: 20
  maxSize: 100
# OTel Collector configuration.
otel:
  # Service name.
  service_name: "bkn-project"
  # Runtime environment.
  environment: "production"
  # OTLP reporting endpoint.
  otlp_endpoint: "otelcol-contrib:4318"

  # Trace configuration.
  trace:
    enabled: false
    # Sampling rate: 0.0 - 1.0.
    sampling_rate: 1.0

  # Log configuration.
  log:
    enabled: false
    # Log level: debug, info, warn, error.
    level: "info"

# Built-in git store: one bare repository per release lineage.
gitStore:
  rootDir: /data/git

# Drafting an ontology from table structure. The keyword lists are business vocabulary.
draft:
  codeTableMaxRows: 500
  codeTableMaxColumns: 3
  adoptHitRate: 0.95
  suggestHitRate: 0.8
  queryTimeout: 60
  timeout: 10m
  privacyKeywords: [姓名, 手机, 电话, 身份证, 证件, 邮箱, 住址, 地址, 银行卡, 出生,
    full_name, first_name, last_name, phone, mobile, telephone, id_card, id_number,
    passport, email, address, bank_card, card_number, birth]
  nameFieldKeywords: [name, label, title, 名称, 名字]

depServices:
  class-443:
    ingressClass: class-443
  rds:
    host: mariadb-mariadb-master.resource.svc.cluster.local.
    port: 3330
    user: root
    password: ""
    type: MariaDB
  hydra-admin:
    host: hydra-admin
    port: 4445
    protocol: http
  bkn-backend:
    host: bkn-backend-svc
    port: 13014
    protocol: http
  agent-operator-integration:
    host: agent-operator-integration
    port: 9000
    protocol: http
  vega-backend:
    host: vega-backend-svc
    port: 13014
    protocol: http
  bkn-agent:
    host: bkn-agent
    port: 30800
    protocol: http
