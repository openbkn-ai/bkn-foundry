replicaCount: 1

nodeSelector: {}

namespace: openbkn
moduleName: agent-retrieval

# Set to dev for development mode.
runMode: release

enableSecurityContext: true
securityContext:
  runAsUser: 5000
  runAsGroup: 5000

image:
  registry: ghcr.io/openbkn-ai
  service:
    repository: agent-retrieval
    tag: "__VERSION__"
    pullPolicy: IfNotPresent

service:
  podID: "POD_ID" # Use PODID as machineID; set the podID environment variable name here.
  name: "agent-retrieval"
  machineID: ""
  ingressclassname: "class-443"
  agentRetrieval:
    nodePort: 31023
    ingress:
      enabled: true
      interface:
        path:
          - /api/agent-retrieval/v1
  type: ClusterIP
  enableDualStack: false
  port: 30779
  language: zh-CN
  loggerOutput: stdout
  loggerLevel: 1
  debug: false
  businessTimeOffset: 0
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 5
  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  concept_search_config:
    concept_recall_size: 100
    knn_k: 300
  instance_search_config:
    # 0 keeps the relevance gate off. See agent-retrieval.yaml for how to calibrate it.
    min_reranker_score: 0
    # 0 keeps the object type pre-filter off. Same file for how to calibrate it.
    min_object_type_score_ratio: 0
  rerank_llm: # The model uses the system default LLM by default; override per request through rerank_llm_model.
    temperature: 0
    top_k: 2
    top_p: 0.5
    frequency_penalty: 0.5
    presence_penalty: 0.5
    max_tokens: 5000
# Authentication switches.
auth:
  enabled: true

depServices:
  rds:
    type: mysql
    host: 127.0.0.1
    port: 3320
    user: ""
    password: ""
    maxConnections: 30
    useExternalDB: false
    connTimeout: 30
    readTimeout: 30
    writeTimeout: 30
    dbCharset: utf8mb4
    system_id: ""
  hydra:
    publicHost: bkn-safe-hydra-public
    publicPort: 4444
    publicProtocol: http
    administrativeHost: bkn-safe-hydra-admin
    administrativePort: 4445
    administrativeProtocol: http
    administrativePrefix: /admin
  bkn-backend:
    privateHost: bkn-backend-svc
    privatePort: 13014
    privateProtocol: http
  ontology-query:
    privateHost: ontology-query-svc
    privatePort: 13018
    privateProtocol: http
  vega-backend:
    privateHost: vega-backend-svc
    privatePort: 13014
    privateProtocol: http
  agent-operator-integration:
    privateHost: agent-operator-integration
    privatePort: 9000
    privateProtocol: http
  bkn-safe:
    privateHost: bkn-safe
    privatePort: 3000
    privateProtocol: http
  redis:
    connectType: sentinel
    enableSSL: false
    connectInfo:
      username: root
      password: yourpassword
      host: ""
      port: 26379
      masterHost: ""
      masterPort: 26379
      slaveHost: ""
      slavePort: 26379
      sentinelHost: redis-sentinel.resource.svc.cluster.local
      sentinelPort: 26379
      sentinelUsername: root
      sentinelPassword: yourpassword
      masterGroupName: mymaster
      poolSize: 10
    secretName: ""
    caName: ""
    certName: ""
    keyName: ""
  class-443:
    ingressClass: class-443
  mf-model-api:
    privateProtocol: http
    privateHost: mf-model-api
    privatePort: 9898

env:
  language: en_US.UTF-8
  timezone: Asia/Shanghai

# Master switch for skill execution capability; disabled by default.
# When disabled, execute_skill is not assembled as an MCP tool (absent from tools/list and /mcp/info),
# and the corresponding REST route is not registered, so the route table reflects that this deployment has no skill execution capability.
# It sends model-generated entry commands into the sandbox. Before enabling it, verify sandbox isolation and skill authorization are configured as needed.
skill:
  executeEnabled: false

resources:
  requests:
    cpu: 200m
    memory: 200Mi
  limits:
    cpu: 4
    memory: 8Gi

observability:
  service_name: agent-retrieval
  service_version: "1.0.0"
  environment: production
  otlp_endpoint: "otelcol-contrib:4318"
  trace:
    enabled: false
    sampling_rate: 1.0
  lifecycle:
    # Mandatory 3.0 business-call dependency. Product deployments install
    # agent-observability before agent-retrieval. Lifecycle is no longer served
    # on public port 8080; existing custom values must migrate to this URL.
    core_url: "http://agent-observability-internal:8081"
    # 0.1.3 defaults to the same single-tenant scope as agent-observability.
    # A trusted inbound x-tenant-id always takes precedence in multi-tenant deployments.
    default_tenant_id: "openbkn-local"
    # Matches the platform-wide default business domain. MCP clients (Claude Code,
    # Cursor, Studio) carry no domain header, so without this every lifecycle call
    # fails closed. A trusted inbound x-business-domain still wins; multi-domain
    # deployments clear this value to force every caller to declare its domain.
    default_business_domain: "bd_public"
  evidence:
    ingest_url: "http://agent-observability:8080/api/agent-observability/v1/evidence/events"
    timeout_ms: 2000
    # Standard installs create this Secret through agent-observability. A
    # standalone retrieval install must clear ingest_url to disable evidence;
    # otherwise a missing Secret leaves evidence delivery unauthorized.
    ingest_token_secret_name: "bkn-trace-evidence-ingest"
    ingest_token_secret_key: "token"
  log:
    enabled: false
    level: info
