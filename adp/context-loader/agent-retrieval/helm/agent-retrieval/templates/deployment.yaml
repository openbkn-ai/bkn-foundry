{{- if semverCompare ">=1.16-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: apps/v1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/name: agent-retrieval
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - {{ .Release.Name }}
            topologyKey: "kubernetes.io/hostname"
      {{- if ne .Values.runMode "dev" }}
      {{- if eq .Values.enableSecurityContext true }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.service.repository }}:{{ .Values.image.service.tag }}"
          imagePullPolicy: {{ .Values.image.service.pullPolicy }}

          env:
            {{- if .Values.service.loggerOutput}}
              - name: LOGOUT
                value: {{ .Values.service.loggerOutput }}
            {{- end}}
            {{- if .Values.env.language}}
              - name: LANG
                value: {{ .Values.env.language }}
              - name: LC_ALL
                value: {{ .Values.env.language }}
            {{- end}}
            {{- if .Values.env.timezone}}
              - name: TZ
                value: {{ .Values.env.timezone }}
            {{- end}}
            {{- if .Values.skill }}
              - name: EXECUTE_SKILL_ENABLED
                value: {{ .Values.skill.executeEnabled | default false | quote }}
            {{- end}}
            {{- if .Values.depServices.rds.type}}
              - name: DB_TYPE
                value: {{ .Values.depServices.rds.type | quote }}
            {{- end}}
            {{- if hasKey .Values "auth" }}
              - name: CONTEXT_LOADER_RESOURCE_FILTER_CHUNK_SIZE
                value: {{ .Values.auth.resourceFilterChunkSize | default 200 | quote }}
            {{- end}}
              - name: PTC_SANDBOX_MCP_URL
                value: {{ printf "http://%s.%s.svc.cluster.local:%v/api/agent-retrieval/v1/mcp/" .Release.Name .Values.namespace .Values.service.sandboxPort | quote }}
              - name: BKN_TRACE_CORE_URL
                value: {{ required "observability.lifecycle.core_url is required" .Values.observability.lifecycle.core_url | quote }}
            {{- if .Values.observability.evidence.artifact_endpoint }}
              - name: BKN_TRACE_ARTIFACT_ENDPOINT
                value: {{ .Values.observability.evidence.artifact_endpoint | quote }}
            {{- end}}
            {{- if .Values.observability.evidence.artifact_secret_name }}
              - name: BKN_TRACE_ARTIFACT_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: {{ .Values.observability.evidence.artifact_secret_name | quote }}
                    key: {{ .Values.observability.evidence.artifact_secret_key | quote }}
                    optional: true
            {{- end}}
            {{- if .Values.observability.evidencePublisher.enabled }}
              - name: BKN_TRACE_EVIDENCE_PUBLISHER_ENABLED
                value: "true"
              - name: BKN_TRACE_KAFKA_BROKERS
                value: {{ required "observability.evidencePublisher.brokers is required" .Values.observability.evidencePublisher.brokers | quote }}
              - name: BKN_TRACE_KAFKA_SASL_MECHANISM
                value: "PLAIN"
              - name: BKN_TRACE_KAFKA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: {{ required "observability.evidencePublisher.usernameSecretName is required" .Values.observability.evidencePublisher.usernameSecretName | quote }}
                    key: "username"
              - name: BKN_TRACE_KAFKA_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: {{ required "observability.evidencePublisher.passwordSecretName is required" .Values.observability.evidencePublisher.passwordSecretName | quote }}
                    key: "password"
              - name: BKN_TRACE_PRODUCER_ID
                value: "agent-retrieval"
              - name: BKN_TRACE_WORKLOAD_IDENTITY
                value: "agent-retrieval"
              - name: BKN_TRACE_PRODUCER_STREAM_ID
                value: "agent-retrieval"
              - name: BKN_TRACE_CAPTURE_POLICY_REVISION
                value: {{ required "observability.evidencePublisher.capturePolicyRevision is required" .Values.observability.evidencePublisher.capturePolicyRevision | quote }}
              - name: BKN_TRACE_EVIDENCE_QUEUE_MAX_RECORDS
                value: {{ .Values.observability.evidencePublisher.queueMaxRecords | quote }}
              - name: BKN_TRACE_EVIDENCE_QUEUE_MAX_BYTES
                value: {{ .Values.observability.evidencePublisher.queueMaxBytes | quote }}
              - name: BKN_TRACE_EVIDENCE_MAX_RECORD_BYTES
                value: {{ .Values.observability.evidencePublisher.maxRecordBytes | quote }}
              - name: BKN_TRACE_EVIDENCE_MAX_ATTEMPTS
                value: {{ .Values.observability.evidencePublisher.maxAttempts | quote }}
              - name: BKN_TRACE_EVIDENCE_RETRY_BACKOFF_MS
                value: {{ .Values.observability.evidencePublisher.retryBackoffMs | quote }}
            {{- end}}

          ports:
            - name: public-port
              containerPort: {{ .Values.service.port }}
            - name: sandbox-port
              containerPort: {{ .Values.service.sandboxPort }}
          {{- if ne .Values.runMode "dev"}}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: public-port
            initialDelaySeconds: {{ .Values.service.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.service.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.service.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.service.readinessProbe.failureThreshold }}
          {{- end}}
          volumeMounts:
            - name: {{ .Release.Name }}-config
              mountPath: /sysvol/config/
            - name: {{ .Release.Name }}-secret
              mountPath: /sysvol/secret/
            {{- if eq .Values.runMode "dev" }}
            - name: home-path
              mountPath: /root
            {{- end }}
          {{- if ne .Values.runMode "dev" }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          {{ end }}
      volumes:
        - name: {{ .Release.Name }}-config
          configMap:
            name: {{ .Release.Name }}
        - name: {{ .Release.Name }}-secret
          secret:
            secretName: {{ .Release.Name }}
        {{ if eq .Values.runMode "dev" }}
        - name: home-path
          hostPath:
            path: /root
        {{ end }}
      dnsConfig:
         options:
           - name: single-request-reopen
           - name: use-vc
