openapi: 3.0.2
info:
  title: 行动类定义查询接口
  version: 1.0.0
  description: |
    必须指定知识网络 ID 和行动类 ID，查询该行动类的业务语义与执行参数；可选传入明确目标进行预览。
    接口沿用 get_action_info 名称，但不能只凭对象实例标识发现关联的行动类。
    旧版行动查询在未指定实例时曾按条件扫描对象；当前版本不扫描，只返回行动类级别定义。

servers:
  - url: http://agent-retrieval:30779
    description: 行动类信息查询服务

tags:
  - name: action-info
    description: 按行动类 ID 查询业务定义与执行参数，支持明确目标预览

paths:
  /api/agent-retrieval/in/v1/kn/get_action_info:
    post:
      summary: get_action_info
      description: |
        给定 kn_id 和 at_id，返回指定行动类的业务信息 action_type 及底层执行工具定义 _dynamic_tools。
        明确传入目标身份时可预览该目标的参数；不传目标时返回行动类级别定义，不按适用条件扫描实例。
        本接口不负责从对象实例发现候选行动类；旧文档中的“根据对象实例标识召回关联行动”不能作为这一能力的契约。
      operationId: getActionInfo
      tags:
        - action-info
      parameters:
        - name: x-account-id
          in: header
          required: false
          schema:
            type: string
          description: 账户ID，用于内部服务调用时传递账户信息
        - name: x-account-type
          in: header
          required: false
          schema:
            type: string
            enum:
              - user
              - app
              - anonymous
          description: 账户类型：user(用户), app(应用), anonymous(匿名)
        - name: response_format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - toon
            default: json
          description: 响应格式：json 或 toon，默认 json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRecallRequest'
            examples:
              definition_example:
                summary: 查询行动类定义和执行参数
                value:
                  kn_id: kn_medical
                  at_id: generate_treatment_plan
              multi_instance_example:
                summary: 多对象实例示例
                value:
                  kn_id: kn_medical
                  at_id: generate_treatment_plan
                  _instance_identities:
                    - disease_id: disease_000001
                    - disease_id: disease_000002
              single_instance_example:
                summary: 单对象实例示例
                value:
                  kn_id: kn_medical
                  at_id: generate_treatment_plan
                  _instance_identities:
                    - disease_id: disease_000001
      responses:
        '200':
          description: 成功返回行动类业务信息与动态工具列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRecallResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_request:
                  value:
                    code: INVALID_REQUEST
                    description: _instance_identities 格式错误
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 上游服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    BKNContext:
      type: object
      required: [conversation_id, interaction_id]
      properties:
        conversation_id:
          type: string
        interaction_id:
          type: string
        parent_operation_id:
          type: string
        causation_event_ids:
          type: array
          maxItems: 64
          items:
            type: string
        business_refs:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/BusinessRef'
      additionalProperties: false

    BusinessRef:
      type: object
      required: [ref_type, ref_id]
      additionalProperties: false
      properties:
        ref_type:
          type: string
          enum: [knowledge_network, object_type, object_instance, property, relation_type, data_resource, metric, logic, function, action_type, action_instance]
        ref_id:
          type: string
        version:
          type: string
    ActionRecallRequest:
      type: object
      required:
        - kn_id
        - at_id
      properties:
        bkn_context:
          $ref: '#/components/schemas/BKNContext'
          description: 可选业务溯源上下文；提供时须有真实会话和交互 ID。Trace 不可用时可省略，业务调用继续执行并返回未记录标头。
        kn_id:
          type: string
          description: 知识网络ID
        at_id:
          type: string
          description: 行动类ID（从 Schema 获取）
        _instance_identities:
          type: array
          description: 对象修改或删除时的明确实例身份列表；定义查询可省略，不会按适用条件扫描实例。
          items:
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: number
                - type: boolean
                - type: integer
          example:
            - disease_id: disease_000001
            - disease_id: disease_000002
        relation_target:
          type: object
          description: 关系操作预览时的一对起点和终点实例身份。
          required: [source_identity, target_identity]
          properties:
            source_identity:
              type: object
              additionalProperties: true
            target_identity:
              type: object
              additionalProperties: true
        object_input:
          type: object
          additionalProperties: true
          description: 新建对象操作预览时的新实例属性值。

    ActionRecallResponse:
      type: object
      required:
        - _dynamic_tools
      properties:
        headers:
          type: object
          additionalProperties: true
        action_type:
          $ref: '#/components/schemas/ActionBusinessInfo'
          description: 行动类自身的业务语义；旧版服务可能不返回。
        _dynamic_tools:
          type: array
          description: Function Call 格式的工具列表
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              parameters:
                type: object
              output_schema:
                type: object
                description: >-
                  执行结果的 JSON Schema（result 字段的形状，即工具 2xx 响应体本身）。
                  工具未声明输出契约、或行动源为 MCP 时该字段不出现。
              api_url:
                type: string
              fixed_params:
                type: object

    ActionBusinessInfo:
      type: object
      required: [id, name, operation_config]
      properties:
        id:
          type: string
        name:
          type: string
          description: 行动类业务名称，区别于底层工具名。
        description:
          type: string
          description: 行动类 comment，区别于底层工具描述。
        action_intent:
          type: string
          enum: [add, modify, delete]
          description: 兼容旧定义的粗粒度意图；关系操作和独立工具行动的准确语义以 operation_config 为准。
        object_type_id:
          type: string
          description: 对象或关系操作绑定的对象类 ID；独立工具行动不返回。
        operation_config:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [object, relation, tool]
            relation_type_id:
              type: string
            relation_operation:
              type: string
              enum: [create, delete]
            anchor_role:
              type: string
              enum: [source, target]
          additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
