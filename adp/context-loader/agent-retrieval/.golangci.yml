version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.24"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Printf
        - fmt.Println
        - fmt.Print
    staticcheck:
      checks:
        - all
  exclusions:
    paths:
      - vendor
      - mock
      - mocks
      - server/tests
      - server/mocks
      - ".*_mock\\.go$"
      - ".*_gen\\.go$"

issues:
  # Do not limit the maximum number of reports per linter (default is 50).
  max-issues-per-linter: 0
  # Do not limit the maximum number of reports per code section (default is 3).
  max-same-issues: 0
