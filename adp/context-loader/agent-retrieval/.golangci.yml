# golangci-lint configuration.
# Documentation: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  go: "1.24"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    # Ignore error return values from fmt.Print* and fmt.Fprint* functions.
    exclude-functions:
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Fprint
      - fmt.Printf
      - fmt.Println
      - fmt.Print
  staticcheck:
    checks:
      - all

issues:
  # Do not limit the maximum number of reports per linter (default is 50).
  max-issues-per-linter: 0
  # Do not limit the maximum number of reports per code section (default is 3).
  max-same-issues: 0
  # Exclude generated and test-helper directories.
  exclude-dirs:
    - vendor
    - mock
    - mocks
    - server/tests
    - server/mocks
  exclude-files:
    - ".*_mock\\.go$"
    - ".*_gen\\.go$"
