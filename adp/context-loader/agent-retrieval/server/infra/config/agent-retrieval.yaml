project:
  language: zh-CN
  host: "0.0.0.0"
  port: 30779
  logger_level: 1
  name:
  pod_id: "POD_ID"
  machine_id: ""
  debug: false
concept_search_config:
  concept_recall_size: 100
  knn_k: 300
instance_search_config:
  # Reject instances the reranker scores below this, and return nothing when no candidate clears it.
  # 0 leaves the gate off. Calibrate per deployment: run a few queries the network can answer and a
  # few it cannot, then pick a value between the two score bands — measured on two of our own
  # environments those bands sit an order of magnitude apart, and in different places.
  # Setting it above 0 makes every instance query pay for one reranker call.
  min_reranker_score: 0
  # Skip an object type whose concept-recall score is below this fraction of the best-scoring one,
  # before instance recall pays a downstream query for it. 0 leaves the pre-filter off.
  # Measured spreads are narrow — concept recall has already kept only its top matches, so the worst
  # survivor scored 0.21 and 0.27 of the best on two of our networks. Pick a value from the
  # [ObjectTypePreFilter] debug line on your own data; the best-scoring object type is always kept.
  min_object_type_score_ratio: 0
oauth: # Corresponds to the Hydra service.
  public_host: "hydra-public.openbkn"
  public_port: 4444
  public_protocol: "http"
  admin_host: "hydra-admin.openbkn"
  admin_port: 4445
  admin_protocol: "http"
  admin_prefix: "/admin"
bkn_backend:
  private_protocol: "http"
  private_host: "bkn-backend-svc.openbkn"
  private_port: 13014
ontology_query:
  private_protocol: "http"
  private_host: "ontology-query-svc.openbkn"
  private_port: 13018
vega:
  private_protocol: "http"
  private_host: "vega-backend-svc.openbkn"
  private_port: 13014
data_retrieval:
  private_protocol: "http"
  private_host: "data-retrieval.openbkn"
  private_port: 9100
operator_integration:
  private_protocol: "http"
  private_host: "agent-operator-integration.openbkn"
  private_port: 9000
bkn_safe: # bkn-safe authorization service, used to validate user self-issued AppKey (API Key).
  private_protocol: "http"
  private_host: "bkn-safe"
  private_port: 3000
auth:
  # Limits one bkn-safe request only; the complete candidate set is processed in chunks.
  resource_filter_chunk_size: 200
redis:
  connectType: "sentinel"
  enableSSL: false
  secretName: ""
  caName: ""
  certName: ""
  keyName: ""
  poolSize: 10
mf_model_api:
  private_protocol: "http"
  private_host: "mf-model-api.openbkn"
  private_port: 9898
find_skills:
  default_top_k: 10
  max_top_k: 20
  recall_timeout_ms: 5000
  total_timeout_ms: 10000
  skills_object_type_id: "skills"
