project:
  language: zh-CN
  host: "0.0.0.0"
  port: 30779
  logger_level: 1
  name:
  pod_id: "POD_ID"
  machine_id: ""
  debug: false
concept_search_config:
  concept_recall_size: 100
  knn_k: 300
oauth: # Corresponds to the Hydra service.
  public_host: "hydra-public.openbkn"
  public_port: 4444
  public_protocol: "http"
  admin_host: "hydra-admin.openbkn"
  admin_port: 4445
  admin_protocol: "http"
  admin_prefix: "/admin"
bkn_backend:
  private_protocol: "http"
  private_host: "bkn-backend-svc.openbkn"
  private_port: 13014
ontology_query:
  private_protocol: "http"
  private_host: "ontology-query-svc.openbkn"
  private_port: 13018
vega:
  private_protocol: "http"
  private_host: "vega-backend-svc.openbkn"
  private_port: 13014
data_retrieval:
  private_protocol: "http"
  private_host: "data-retrieval.openbkn"
  private_port: 9100
operator_integration:
  private_protocol: "http"
  private_host: "agent-operator-integration.openbkn"
  private_port: 9000
bkn_safe: # bkn-safe authorization service, used to validate user self-issued AppKey (API Key).
  private_protocol: "http"
  private_host: "bkn-safe"
  private_port: 3000
redis:
  connectType: "sentinel"
  enableSSL: false
  secretName: ""
  caName: ""
  certName: ""
  keyName: ""
  poolSize: 10
mf_model_api:
  private_protocol: "http"
  private_host: "mf-model-api.openbkn"
  private_port: 9898
rerank_llm: # The model uses the system default LLM by default; override per request through rerank_llm_model (for testing/validation).
  temperature: 0
  top_k: 2
  top_p: 0.5
  frequency_penalty: 0.5
  presence_penalty: 0.5
  max_tokens: 5000
find_skills:
  default_top_k: 10
  max_top_k: 20
  recall_timeout_ms: 5000
  total_timeout_ms: 10000
  skills_object_type_id: "skills"
