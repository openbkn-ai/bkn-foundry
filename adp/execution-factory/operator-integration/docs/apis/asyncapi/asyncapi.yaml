asyncapi: 2.6.0
info:
  title: 执行工厂异步消息接口
  version: 1.0.0
  description: 执行工厂对外发布的事件通知接口规范

servers:
  production:
    url: kafka://{host}:{port}
    protocol: kafka
    description: 生产环境消息队列

channels:
  authorization.resource.name.modify:
    description: 工具箱、函数工具箱或 MCP 名称变更后发布，用于同步授权资源名称。
    subscribe:
      message:
        $ref: "#/components/messages/AuthResourceNameModifyMessage"

components:
  messages:
    AuthResourceNameModifyMessage:
      payload:
        type: object
        required:
          - id
          - type
          - name
        properties:
          id:
            type: string
            description: 资源 ID（工具箱 box_id 或 MCP mcp_id）
          type:
            type: string
            description: 授权资源类型
            enum:
              - tool_box
              - function
              - mcp
          name:
            type: string
            description: 变更后的资源名称
