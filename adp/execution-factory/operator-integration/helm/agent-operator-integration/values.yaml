replicaCount: 1

nodeSelector: {}

namespace: openbkn
moduleName: agent-operator-integration

# bkn-safe authz. authzProvider: "" | "isf" | "shadow" | "bkn-safe", can be rolled back.
#
# The default value is bkn-safe: ISF has been retired. A null value will cause selectAuthz to fall to the ISF adapter.
# (authorization_safe.go:283-286), and the authorization judgment is fail-closed when an error occurs.
# (OperationCheckAll of decision.go turns errors to 403), and the result is that all authentication.
# Always refuse. The actual deployment configuration such as deploy/conf/config.yaml is passed to bkn-safe, here.
# Just make the chart default value consistent with it to avoid shortfalls when directly helm install.
bknSafe:
  authzProvider: "bkn-safe"
  url: ""

# Set to dev for development mode.
runMode: release

enableSecurityContext: true
securityContext:
  runAsUser: 5000
  runAsGroup: 5000

image:
  registry: ghcr.io/openbkn-ai
  service:
    repository: agent-operator-integration
    tag: "__VERSION__"
    pullPolicy: IfNotPresent

service:
  podID: "POD_ID" # Use PODID as machineID, fill in the podID environment variable name here.
  name: "agent-operator-integration"
  machineID: ""

  agentOperatorIntegration:
    nodePort: 31023
    ingress:
      enabled: true
      interface:
        path:
          # Only the public surface is exposed. internal-v1 does not verify tokens; identity comes from the caller-supplied X-Account-ID header.
          # When this header is missing, hydra.go falls back to a hardcoded administrator. Once Ingress is enabled, about 40 write interfaces
          # under this path (function/exec, impex import, etc.) can be called from outside the cluster without credentials.
          # In-cluster callers (bkn-agent, agent-retrieval) use ClusterIP agent-operator-integration:9000 and do not go through Ingress,
          # so they are not affected. See #326.
          - /api/agent-operator-integration/v1
          # Capability surface: Ingress path of the original standalone capabilities-lab service. That service has been merged into this service
          # and its chart will be deleted accordingly. The path remains unchanged and is now handled by this service.
          # This surface is also public (token-verified), so it does not conflict with the internal-v1 consolidation in #326 step 3.
          - /api/capabilities-lab/v1
  type: ClusterIP
  enableDualStack: false
  port: 9000
  language: zh-CN
  loggerOutput: stdout
  loggerLevel: 1
  debug: false
  businessTimeOffset: 0
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 10
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6
  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  operator:
    importFileSizeLimit: 2097152 # Import file size limit is 2M.
    importOperatorMaxCount: 10 # Maximum number of operators imported in batches.
    descriptionLengthLimit: 500 # Length limit of operator description, unit character.
  mcp:
    connTimeout: 30 # Unit: seconds.
    maxInstances: 100 # Maximum number of instances.
    instanceTTL: 1800 # Unit second.
    cleanupInterval: 600 # Unit second.
  category:
    initSwitch: true # Whether to initialize operator classification.
  proxyModule:
    defaultTimeout: 300 # Unit second.
    maxTimeout: 300 # Unit second.
    maxClients: 50 # Unit second.
    clientLifetime: 600 # Unit second.
  skillIndexBuild:
    enablePeriodicFullScan: false
    periodicFullScanInterval: 168h # 7 days.
    enableTaskCleanup: false
    taskRetention: 720h # 30 days.

# Authentication switch.
auth:
  enabled: true

# Business domain switch.
businessDomain:
  enabled: false

depServices:
  class-443:
    ingressClass: class-443
  mq: {}
  rds:
    type: mysql
    host: 127.0.0.1
    port: 3320
    user: ""
    password: ""
    maxConnections: 30
    useExternalDB: false
    connTimeout: 30
    readTimeout: 30
    writeTimeout: 30
    database: openbkn
    dbCharset: utf8mb4
    system_id: ""
  hydra:
    # ISF replacement: introspect/token against bkn-safe's paired hydra (cross-ns).
    publicHost: bkn-safe-hydra-public
    publicPort: 4444
    publicProtocol: http
    administrativeHost: bkn-safe-hydra-admin
    administrativePort: 4445
    administrativeProtocol: http
    administrativePrefix: /admin
  user-management:
    privateHost: user-management-private
    privatePort: 30980
    privateProtocol: http
  authorization:
    privateHost: authorization-private
    privatePort: 30920
    privateProtocol: http
  business-system-service:
    privateHost: business-system-service
    privatePort: 80
    privateProtocol: http
  redis:
    connectType: sentinel
    enableSSL: false
    connectInfo:
      username: root
      password: ""
      host: ""
      port: 26379
      masterHost: ""
      masterPort: 26379
      slaveHost: ""
      slavePort: 26379
      sentinelHost: redis-sentinel.redis.svc.cluster.local
      sentinelPort: 26379
      sentinelUsername: root
      sentinelPassword: ""
      masterGroupName: mymaster
      poolSize: 10
    secretName: ""
    caName: ""
    certName: ""
    keyName: ""
  mf-model-api:
    privateHost: "mf-model-api"
    privatePort: 9898
    privateProtocol: "http"
  mf-model-manager:
    privateHost: mf-model-manager
    privatePort: 9898
    privateProtocol: "http"
  aiGenerationConfig:
    pythonFunctionGeneratorPromptID: ""
    metadataParamGeneratorPromptID: ""
    llm:
      model: ""
      maxTokens: 2048
      temperature: 0.2 # Reduce randomness.
      topK: 40
      topP: 0.95
      frequencyPenalty: 0.0
      presencePenalty: 0.0
  sandbox-control-plane:
    privateHost: "sandbox-control-plane"
    privatePort: 8000
    privateProtocol: "http"
    templateID: "" # Template ID, pattern uses python-basic.
    sessionResources:
      cpu: 1
      memory: 512Mi
      disk: 1Gi
      timeout: 3600 # Unit: second.
    maxSessions: 3
    activeSessions: 1
    maxConcurrentTasks: 100
  oss-gateway-backend:
    privateHost: "oss-gateway-backend"
    privatePort: 8080
    privateProtocol: "http"
    storageID: ""
    internalRequest: false
    expires: 3600
  vega-backend:
    privateHost: vega-backend-svc
    privatePort: 13014
    privateProtocol: http

env:
  language: en_US.UTF-8
  timezone: Asia/Shanghai

# Authorization level of internal (internal-v1) skill reading interface:
# shadow (default) - checks authorization but does not block it, only logs if it is not passed, equivalent to the old behavior.
# enforce - enforce by account, no right to return 403.
# off - no checks at all (fallback level)
# context-loader has packaged /content and /files/read into MCP tools, and skill_id is filled in by the caller;
# Observe the shadow log online to confirm that there is no accidental damage, and then turn to enforce.
skill:
  internalReadAuthz: shadow

resources:
  requests:
    cpu: 200m
    memory: 200Mi
  limits:
    cpu: 4
    memory: 8Gi

observability:
  service_name: agent-operator-integration
  service_version: "1.0.0"
  environment: production
  otlp_endpoint: "otelcol-contrib:4318"
  trace:
    enabled: false
    sampling_rate: 1.0
  evidence:
    ingest_url: ""
    ingest_token_secret_name: ""
    ingest_token_secret_key: "ingest-token"
  log:
    enabled: false
    level: info
