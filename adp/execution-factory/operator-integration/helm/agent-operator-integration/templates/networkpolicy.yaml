{{- if .Values.knProxy.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
{{ toYaml .Values.knProxy.networkPolicy.allowedIngress | indent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
