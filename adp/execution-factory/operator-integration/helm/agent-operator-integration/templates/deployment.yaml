{{- if semverCompare ">=1.16-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: apps/v1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - {{ .Release.Name }}
            topologyKey: "kubernetes.io/hostname"
      {{- if ne .Values.runMode "dev" }}
      {{- if eq .Values.enableSecurityContext true }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.service.repository }}:{{ .Values.image.service.tag }}"
          imagePullPolicy: {{ .Values.image.service.pullPolicy }}

          env:
              - name: BKN_SAFE_URL
                value: {{ .Values.bknSafe.url | quote }}
            {{- if .Values.skill }}
              - name: SKILL_INTERNAL_READ_AUTHZ
                value: {{ .Values.skill.internalReadAuthz | default "shadow" | quote }}
            {{- end}}
            {{- if .Values.service.loggerOutput}}
              - name: LOGOUT
                value: {{ .Values.service.loggerOutput }}
            {{- end}}
            {{- if .Values.env.language}}
              - name: LANG
                value: {{ .Values.env.language }}
              - name: LC_ALL
                value: {{ .Values.env.language }}
            {{- end}}
            {{- if .Values.env.timezone}}
              - name: TZ
                value: {{ .Values.env.timezone }}
            {{- end}}
            {{- if .Values.depServices.rds.type}}
              - name: DB_TYPE
                value: {{ .Values.depServices.rds.type | quote }}
            {{- end}}
            {{- with .Values.observability.evidence.publisher }}
            {{- if .brokers }}
              - name: BKN_TRACE_KAFKA_BROKERS
                value: {{ .brokers | quote }}
              - name: BKN_TRACE_KAFKA_SASL_MECHANISM
                value: PLAIN
              - name: BKN_TRACE_PRODUCER_ID
                value: {{ .producer_id | quote }}
              - name: BKN_TRACE_PRODUCER_STREAM_ID
                value: {{ .producer_stream_id | quote }}
              - name: BKN_TRACE_WORKLOAD_IDENTITY
                value: {{ .workload_identity | quote }}
              - name: TRACE_ADMISSION_POLICY_URL
                value: {{ .trace_admission.policy_url | quote }}
              - name: TRACE_ADMISSION_CONFIGURATION_URL
                value: {{ .trace_admission.configuration_url | quote }}
              - name: TRACE_ADMISSION_HEARTBEAT_URL
                value: {{ .trace_admission.heartbeat_url | quote }}
              - name: TRACE_ADMISSION_ACK_URL_BASE
                value: {{ .trace_admission.ack_url_base | quote }}
              - name: TRACE_ADMISSION_TOKEN_URL
                value: {{ .trace_admission.token_url | quote }}
              - name: TRACE_ADMISSION_CLIENT_ID
                value: {{ required "observability.evidence.publisher.trace_admission.client_id is required" .trace_admission.client_id | quote }}
              - name: TRACE_ADMISSION_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: {{ required "observability.evidence.publisher.trace_admission.client_secret_name is required" .trace_admission.client_secret_name | quote }}
                    key: {{ .trace_admission.client_secret_key | quote }}
              - name: TRACE_ADMISSION_SCOPE
                value: {{ .trace_admission.scope | quote }}
              - name: TRACE_ADMISSION_AUDIENCE
                value: {{ .trace_admission.audience_cluster_id | quote }}
              - name: TRACE_ADMISSION_CURRENT_KEY_ID
                value: {{ required "observability.evidence.publisher.trace_admission.current_key_id is required" .trace_admission.current_key_id | quote }}
              - name: TRACE_ADMISSION_CURRENT_PUBLIC_KEY
                valueFrom:
                  secretKeyRef:
                    name: {{ required "observability.evidence.publisher.trace_admission.current_public_key_secret_name is required" .trace_admission.current_public_key_secret_name | quote }}
                    key: {{ .trace_admission.current_public_key_secret_key | quote }}
              - name: TRACE_ADMISSION_PREVIOUS_KEY_ID
                value: {{ .trace_admission.previous_key_id | quote }}
              - name: TRACE_ADMISSION_PREVIOUS_PUBLIC_KEY
                {{- if .trace_admission.previous_public_key_secret_name }}
                valueFrom:
                  secretKeyRef:
                    name: {{ .trace_admission.previous_public_key_secret_name | quote }}
                    key: {{ .trace_admission.previous_public_key_secret_key | quote }}
                {{- else }}
                value: ""
                {{- end }}
              - name: BKN_TRACE_EVIDENCE_QUEUE_MAX_RECORDS
                value: {{ .queue_max_records | quote }}
              - name: BKN_TRACE_EVIDENCE_QUEUE_MAX_BYTES
                value: {{ .queue_max_bytes | int64 | quote }}
              - name: BKN_TRACE_EVIDENCE_MAX_RECORD_BYTES
                value: {{ .max_record_bytes | int64 | quote }}
              - name: BKN_TRACE_EVIDENCE_MAX_ATTEMPTS
                value: {{ .max_attempts | quote }}
              - name: BKN_TRACE_EVIDENCE_RETRY_BACKOFF_MS
                value: {{ .retry_backoff_ms | quote }}
              {{- if .credentials_secret_name }}
              - name: BKN_TRACE_KAFKA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: {{ .credentials_secret_name | quote }}
                    key: {{ .username_secret_key | quote }}
              - name: BKN_TRACE_KAFKA_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: {{ .credentials_secret_name | quote }}
                    key: {{ .password_secret_key | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.observability.audit.publisher }}
              - name: BKN_AUDIT_KAFKA_BROKERS
                value: {{ .brokers | quote }}
              - name: BKN_AUDIT_KAFKA_SASL_MECHANISM
                value: PLAIN
              - name: BKN_AUDIT_ENVIRONMENT
                value: {{ $.Values.observability.environment | quote }}
              {{- if .credentials_secret_name }}
              - name: BKN_AUDIT_KAFKA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: {{ .credentials_secret_name | quote }}
                    key: {{ .username_secret_key | quote }}
              - name: BKN_AUDIT_KAFKA_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: {{ .credentials_secret_name | quote }}
                    key: {{ .password_secret_key | quote }}
              {{- end }}
            {{- end }}

          ports:
            - name: public-port
              containerPort: {{ .Values.service.port }}
          {{- if ne .Values.runMode "dev"}}
          readinessProbe: # Readiness probe.
            httpGet:
              path: /health/ready
              port: public-port
            initialDelaySeconds: {{ .Values.service.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.service.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.service.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.service.readinessProbe.failureThreshold }}
          livenessProbe: # survival probe.
            httpGet:
              path: /health/alive
              port: public-port
            initialDelaySeconds: {{ .Values.service.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.service.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.service.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.service.livenessProbe.failureThreshold }}
          startupProbe: # Start probe.
            httpGet:
              path: /health/alive
              port: public-port
            initialDelaySeconds: {{ .Values.service.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.service.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.service.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.service.startupProbe.failureThreshold }}
          {{- end}}
          volumeMounts:
            - name: {{ .Release.Name }}-config
              mountPath: /sysvol/config/
            - name: {{ .Release.Name }}-secret
              mountPath: /sysvol/secret/
            {{- if eq .Values.runMode "dev" }}
            - name: home-path
              mountPath: /root
            {{- end }}
          {{- if ne .Values.runMode "dev" }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          {{ end }}
      volumes:
        - name: {{ .Release.Name }}-config
          configMap:
            name: {{ .Release.Name }}
        - name: {{ .Release.Name }}-secret
          secret:
            secretName: {{ .Release.Name }}
        {{ if eq .Values.runMode "dev" }}
        - name: home-path
          hostPath:
            path: /root
        {{ end }}
      dnsConfig:
         options:
           - name: single-request-reopen
           - name: use-vc
