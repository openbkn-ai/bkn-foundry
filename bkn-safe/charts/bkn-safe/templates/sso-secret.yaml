{{- if and .Values.bundledDeps.ssoTokenHook.enabled (not .Values.bundledDeps.ssoTokenHook.secretName) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "bkn-safe.ssoSecretName" .) }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data | default dict }}
{{- /* Never regenerate a partially lost key set and silently invalidate trust. */}}
{{- range $key := list .Values.bundledDeps.ssoTokenHook.secretKey "hydraClientSecret" "assertionPrivateKeyPEM" }}
{{- if not (index $data $key) }}{{- fail (printf "existing SSO Secret is missing %s; restore the original Secret" $key) }}{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bkn-safe.ssoSecretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{ .Values.bundledDeps.ssoTokenHook.secretKey }}: {{ if $existing }}{{ index $data .Values.bundledDeps.ssoTokenHook.secretKey | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
  hydraClientSecret: {{ if $existing }}{{ index $data "hydraClientSecret" | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
  assertionPrivateKeyPEM: {{ if $existing }}{{ index $data "assertionPrivateKeyPEM" | quote }}{{ else }}{{ genPrivateKey "rsa" | b64enc | quote }}{{ end }}
{{- end }}
