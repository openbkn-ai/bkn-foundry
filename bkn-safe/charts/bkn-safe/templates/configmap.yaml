apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  SAFE_HTTP_ADDR: ":{{ .Values.service.ports.port }}"
  SAFE_SEED_ON_START: {{ .Values.config.seedOnStart | quote }}
  {{- /* DB connection: prefer the shared cluster MariaDB from config.yaml's
         depServices.rds (the platform-standard mechanism mariadb.sh populates +
         grants, same as every other service); fall back to config.db (bundled
         MariaDB for pure dev). The app DB name stays config.db.name ("safe") —
         mariadb.sh seeds that database on the cluster MariaDB. The PASSWORD is
         NOT here — it lives in the Secret (templates/secret.yaml). */}}
  {{- $rds := (.Values.depServices | default dict).rds | default dict }}
  {{- if $rds.host }}
  SAFE_DB_TYPE: {{ $rds.type | default "MySQL" | quote }}
  SAFE_DB_HOST: {{ $rds.host | quote }}
  SAFE_DB_PORT: {{ $rds.port | default "3306" | quote }}
  SAFE_DB_USER: {{ $rds.user | quote }}
  {{- else }}
  SAFE_DB_TYPE: {{ .Values.config.db.type | quote }}
  SAFE_DB_HOST: {{ .Values.config.db.host | quote }}
  SAFE_DB_PORT: {{ .Values.config.db.port | quote }}
  SAFE_DB_USER: {{ .Values.config.db.user | quote }}
  {{- end }}
  SAFE_DB_NAME: {{ .Values.config.db.name | quote }}
  SAFE_HYDRA_ADMIN_URL: {{ .Values.config.hydra.adminURL | quote }}
  SAFE_HYDRA_PUBLIC_URL: {{ .Values.config.hydra.publicURL | quote }}
  SAFE_LDAP_URL: {{ .Values.config.ldap.url | quote }}
  SAFE_LDAP_BIND_DN: {{ .Values.config.ldap.bindDN | quote }}
  {{- /* SAFE_LDAP_BIND_PASSWORD and BKN_SAFE_INITIAL_PASSWORD are NOT here —
         they live in the Secret (templates/secret.yaml). */}}
  SAFE_LDAP_BASE_DN: {{ .Values.config.ldap.baseDN | quote }}
  SAFE_LDAP_USER_FILTER: {{ .Values.config.ldap.userFilter | quote }}
  SAFE_LICENSE_SERVER_URL: {{ .Values.config.license.serverURL | quote }}
  SAFE_LICENSE_CA_FILE: {{ .Values.config.license.caFile | quote }}
  SAFE_LICENSE_INSECURE_SKIP_VERIFY: {{ .Values.config.license.insecureSkipVerify | quote }}
  {{- with .Values.config.audit }}
  {{- /* No `default` here: it treats false and 0 as unset, and 0 is a documented
         value for every one of these knobs (disable / keep all / record no
         allows). Only a missing key falls back. */}}
  SAFE_AUDIT_CHAIN_HEAD_LOG_INTERVAL: {{ if kindIs "invalid" .chainHeadLogInterval }}"15m"{{ else }}{{ .chainHeadLogInterval | toString | quote }}{{ end }}
  {{- with .decisionLog }}
  SAFE_AUTHZ_DECISION_LOG_ENABLED: {{ if kindIs "bool" .enabled }}{{ .enabled | toString | quote }}{{ else }}"true"{{ end }}
  SAFE_AUTHZ_DECISION_LOG_ALLOW_SAMPLE_RATE: {{ if kindIs "invalid" .allowSampleRate }}"1"{{ else }}{{ .allowSampleRate | toString | quote }}{{ end }}
  SAFE_AUTHZ_DECISION_LOG_QUEUE_SIZE: {{ if kindIs "invalid" .queueSize }}"4096"{{ else }}{{ .queueSize | toString | quote }}{{ end }}
  SAFE_AUTHZ_DECISION_LOG_RETENTION_DAYS: {{ if kindIs "invalid" .retentionDays }}"90"{{ else }}{{ .retentionDays | toString | quote }}{{ end }}
  {{- end }}
  {{- end }}
  {{- /* OPENBKN_INSTANCE_ID is NOT here — the instance identity lives in its
         own ConfigMap (templates/instance-id.yaml) so that it survives
         `helm uninstall`. Both are pulled in via envFrom. */}}
  GIN_MODE: "release"
