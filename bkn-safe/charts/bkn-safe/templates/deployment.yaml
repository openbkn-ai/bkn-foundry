{{- /* Casbin policies are cached in process. Until a cross-pod watcher is
added, multiple replicas can make authorization decisions from different
policy versions. Keep the supported deployment shape explicit. */}}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail (printf "bkn-safe currently supports only one replica; replicaCount must be 1, got %v" .Values.replicaCount) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.image.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.image.name }}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Values.image.name }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 10 | quote }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | trunc 10 | quote }}
        {{- /* A changed instance identity changes the license fingerprint, and
               the fingerprint is resolved once at startup — the Pod has to be
               replaced for it to take effect. */}}
        checksum/instance-id: {{ include (print $.Template.BasePath "/instance-id.yaml") . | sha256sum | trunc 10 | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{- if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - configMapRef:
                name: {{ .Release.Name }}-instance-id
            - secretRef:
                name: {{ .Release.Name }}-secrets
          ports:
            - name: http
              containerPort: {{ .Values.service.ports.port }}
          livenessProbe:
            httpGet:
              path: /health/alive
              port: {{ .Values.service.ports.port }}
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.ports.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: host-time
              mountPath: /etc/localtime
      volumes:
        - name: host-time
          hostPath:
            path: /etc/localtime
