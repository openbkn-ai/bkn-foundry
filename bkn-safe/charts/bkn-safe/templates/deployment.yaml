{{- /* Casbin policies are cached in process. Until a cross-pod watcher is
added, multiple replicas can make authorization decisions from different
policy versions. Keep the supported deployment shape explicit. */}}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail (printf "bkn-safe currently supports only one replica; replicaCount must be 1, got %v" .Values.replicaCount) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.image.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.image.name }}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Values.image.name }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 10 | quote }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | trunc 10 | quote }}
        {{- /* A changed instance identity changes the license fingerprint, and
               the fingerprint is resolved once at startup — the Pod has to be
               replaced for it to take effect. */}}
        checksum/instance-id: {{ include (print $.Template.BasePath "/instance-id.yaml") . | sha256sum | trunc 10 | quote }}
    spec:
      serviceAccountName: {{ .Values.image.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{- if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - configMapRef:
                name: {{ .Release.Name }}-instance-id
            - secretRef:
                name: {{ .Release.Name }}-secrets
          {{- if or .Values.auditPublisher.enabled .Values.extraEnv .Values.bundledDeps.ssoTokenHook.enabled }}
          env:
          {{- if .Values.bundledDeps.ssoTokenHook.enabled }}
          {{- /* Preserve explicit extraEnv from existing manual deployments,
                 emitting each env name only once for Kubernetes strategic merge. */}}
          {{- $overrides := dict }}
          {{- range .Values.extraEnv }}{{- $_ := set $overrides .name true }}{{- end }}
          {{- $defaults := list
                (dict "name" "SAFE_SSO_AUTO_BOOTSTRAP" "value" "true")
                (dict "name" "SAFE_SSO_HYDRA_CLIENT_ID" "value" (printf "%s-sso-exchange" .Release.Name))
                (dict "name" "SAFE_SSO_ASSERTION_ISSUER" "value" (printf "%s/bkn-safe/sso-exchange" (include "bkn-safe.hydraBrowserPublicURL" .))) }}
          {{- range $defaults }}
          {{- if not (hasKey $overrides .name) }}
          {{- toYaml (list .) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- range $env, $key := dict "SAFE_SSO_HYDRA_CLIENT_SECRET" "hydraClientSecret" "SAFE_SSO_ASSERTION_PRIVATE_KEY_PEM" "assertionPrivateKeyPEM" "SAFE_SSO_HOOK_KEY" .Values.bundledDeps.ssoTokenHook.secretKey }}
          {{- if not (hasKey $overrides $env) }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "bkn-safe.ssoSecretName" $ | quote }}
                  key: {{ $key | quote }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.auditPublisher.enabled }}
            - name: BKN_AUDIT_ENVIRONMENT
              value: {{ required "auditPublisher.environment is required" .Values.auditPublisher.environment | quote }}
            - name: BKN_AUDIT_KAFKA_BROKERS
              value: {{ required "auditPublisher.brokers is required" .Values.auditPublisher.brokers | quote }}
            - name: BKN_AUDIT_KAFKA_SASL_MECHANISM
              value: PLAIN
            - name: BKN_AUDIT_KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ required "auditPublisher.credentialsSecretName is required" .Values.auditPublisher.credentialsSecretName | quote }}
                  key: {{ required "auditPublisher.usernameSecretKey is required" .Values.auditPublisher.usernameSecretKey | quote }}
            - name: BKN_AUDIT_KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "auditPublisher.credentialsSecretName is required" .Values.auditPublisher.credentialsSecretName | quote }}
                  key: {{ required "auditPublisher.passwordSecretKey is required" .Values.auditPublisher.passwordSecretKey | quote }}
          {{- end }}
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.ports.port }}
          livenessProbe:
            httpGet:
              path: /health/alive
              port: {{ .Values.service.ports.port }}
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.ports.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: host-time
              mountPath: /etc/localtime
      volumes:
        - name: host-time
          hostPath:
            path: /etc/localtime
