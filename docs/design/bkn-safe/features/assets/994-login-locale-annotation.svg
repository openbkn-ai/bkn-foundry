<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">BKN Safe 登录页语言切换入口标注</title>
  <desc id="description">现有登录卡片右上角新增中文与 English 切换，中文为当前状态，切换保持 OAuth challenge 并同步到 Studio。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#162849" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf1f7"/>
    </linearGradient>
    <style>
      text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .body { fill: #152239; font-size: 15px; }
      .muted { fill: #64748d; font-size: 13px; }
      .label { fill: #72819b; font-size: 12px; }
      .callout-title { fill: #152239; font-size: 16px; font-weight: 600; }
      .callout-body { fill: #64748d; font-size: 13px; }
    </style>
  </defs>

  <rect width="960" height="640" rx="24" fill="url(#background)"/>
  <text x="48" y="48" fill="#152239" font-size="20" font-weight="700">#994 登录页语言切换标注</text>
  <text x="48" y="70" class="muted">视觉基线保持不变，仅在卡片右上角增加紧凑语言入口</text>

  <rect x="58" y="96" width="450" height="486" rx="22" fill="#ffffff" stroke="#e7ebf2" filter="url(#shadow)"/>

  <g transform="translate(126 144)">
    <g stroke="#172233" stroke-width="2" fill="none">
      <path d="M17 0 42 14v28L17 56-8 42V14Z"/>
      <path d="m-8 14 25 14 25-14M17 0v56"/>
    </g>
    <circle cx="-8" cy="14" r="5" fill="#2563eb"/>
    <circle cx="17" cy="28" r="5" fill="#2563eb"/>
    <circle cx="42" cy="14" r="5" fill="#2cc5c9"/>
    <text x="62" y="28" fill="#0f172a" font-size="31" font-weight="700">Open<tspan fill="#2563eb">BKN</tspan></text>
    <text x="64" y="45" fill="#72819b" font-size="9">Open Business Knowledge Network</text>
  </g>

  <g transform="translate(382 118)">
    <text x="0" y="16" fill="#2563eb" font-size="12" font-weight="600">中文</text>
    <text x="30" y="16" fill="#a0aabd" font-size="12">/</text>
    <text x="40" y="16" fill="#72819b" font-size="12">English</text>
  </g>
  <circle cx="473" cy="117" r="13" fill="#2563eb"/>
  <text x="473" y="122" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1</text>

  <rect x="102" y="248" width="362" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="118" y="279" fill="#a0a0a0" font-size="15">账号</text>
  <rect x="102" y="314" width="362" height="50" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="118" y="345" fill="#a0a0a0" font-size="15">密码</text>
  <rect x="102" y="384" width="362" height="56" rx="8" fill="#2563eb"/>
  <text x="283" y="419" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">登录</text>

  <circle cx="520" cy="144" r="4" fill="#2563eb"/>
  <path d="M520 144H584" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="602" cy="144" r="16" fill="#2563eb"/>
  <text x="602" y="149" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text>
  <text x="630" y="140" class="callout-title">固定入口</text>
  <text x="630" y="162" class="callout-body">卡片右上角；登录前即可操作</text>

  <circle cx="416" cy="124" r="4" fill="#2563eb"/>
  <path d="M416 124V244H584" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <circle cx="602" cy="244" r="16" fill="#2563eb"/>
  <text x="602" y="249" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text>
  <text x="630" y="240" class="callout-title">清晰状态</text>
  <text x="630" y="262" class="callout-body">当前语言使用品牌蓝和 600 字重</text>
  <text x="630" y="282" class="callout-body">支持 hover 与键盘 focus-visible</text>

  <circle cx="464" cy="408" r="4" fill="#2563eb"/>
  <path d="M464 408H584" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="602" cy="408" r="16" fill="#2563eb"/>
  <text x="602" y="413" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text>
  <text x="630" y="395" class="callout-title">贯穿认证流程</text>
  <text x="630" y="419" class="callout-body">切换保留 login_challenge，不新建 OAuth 交易</text>
  <text x="630" y="439" class="callout-body">POST 隐藏字段 + 共享语言 Cookie 延续偏好</text>
  <text x="630" y="459" class="callout-body">登录成功后 Studio 继续使用同一语言</text>

  <rect x="584" y="502" width="324" height="58" rx="10" fill="#f9fbff" stroke="#e7ebf2"/>
  <text x="602" y="526" class="label">不变范围</text>
  <text x="602" y="547" class="body">Logo、输入框、登录按钮和认证业务逻辑</text>
</svg>
