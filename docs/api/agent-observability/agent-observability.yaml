info:
  contact: {}
  description: APIs for querying agent traces from OpenSearch.
  title: Agent Observability API
  version: "1.0"
paths:
  /access-profile:
    get:
      description: Returns server-derived page capabilities and a scope fingerprint.
        Roles and managed resource identifiers are never accepted from or disclosed
        to the client.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rdto.AccessProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rdto.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/rdto.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/rdto.ErrorResponse'
      summary: Get the current BKN Trace access profile
      tags:
      - access
  /conversations:
    get:
      parameters:
      - description: Page size, 1..100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.conversationPage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
      summary: List managed Conversations in the authorized owner scope
      tags:
      - lifecycle
    post:
      consumes:
      - application/json
      parameters:
      - description: Managed Conversation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httphandler.ensureConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/sessionvo.Conversation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
      summary: Create or return the current managed Conversation
      tags:
      - lifecycle
  /conversations/{conversation_id}:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: conversation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sessionvo.Conversation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
        "404":
          description: Not Found
