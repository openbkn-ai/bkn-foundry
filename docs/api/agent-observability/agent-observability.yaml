            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httphandler.lifecycleErrorEnvelope'
      summary: Get one managed Conversation
      tags:
      - lifecycle
