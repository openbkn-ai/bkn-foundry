    post:
      tags:
      - BknAgent
      summary: Invoke
      description: 'Run once synchronously and return only when the task reaches a
        terminal state.


        Only a published agent may be called; a draft answers exactly like a missing

        one. Both chat and task modes are accepted. Execution is a single stateless

        turn and no thread is persisted, while the task record is still stored so
        the

        run stays observable.'
