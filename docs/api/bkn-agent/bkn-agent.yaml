components:
  schemas:
    AgentConfigOut:
      properties:
        agent_id:
          type: string
          title: Agent Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        status:
          type: string
          title: Status
        shared:
          $ref: '#/components/schemas/EffectiveOut'
        network:
          $ref: '#/components/schemas/AgentSettingOut'
        user:
          $ref: '#/components/schemas/AgentSettingOut'
        effective:
          $ref: '#/components/schemas/EffectiveOut'
        mcp_profile:
          anyOf:
          - type: string
          - type: 'null'
          title: Mcp Profile
        can_edit_network:
          type: boolean
          title: Can Edit Network
        can_edit_shared:
          type: boolean
          title: Can Edit Shared
      type: object
      required:
      - agent_id
      - status
      - shared
      - network
      - user
      - effective
      - can_edit_network
      - can_edit_shared
      title: AgentConfigOut
      description: Everything the configuration page shows for one network, in one
        read.
    AgentDeleted:
      properties:
        deleted:
          type: string
          title: Deleted
      type: object
      required:
      - deleted
      title: AgentDeleted
    AgentExportItem:
      properties:
        agent_id:
          type: string
          title: Agent Id
        spec:
          $ref: '#/components/schemas/AgentSpec'
        prompt:
          anyOf:
          - $ref: '#/components/schemas/PromptExport'
          - type: 'null'
      type: object
      required:
      - agent_id
      - spec
      title: AgentExportItem
    AgentLimits:
      properties:
        max_turns:
          anyOf:
          - type: integer
            maximum: 200.0
            minimum: 1.0
          - type: 'null'
          title: Max Turns
        max_tool_calls:
          anyOf:
          - type: integer
            maximum: 500.0
            minimum: 0.0
          - type: 'null'
          title: Max Tool Calls
        timeout_s:
          anyOf:
          - type: integer
            maximum: 3600.0
            minimum: 1.0
          - type: 'null'
          title: Timeout S
        max_output_tokens:
          anyOf:
          - type: integer
            maximum: 65536.0
            minimum: 10.0
          - type: 'null'
          title: Max Output Tokens
        keep_tool_results:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Keep Tool Results
          description: 'Tool results of the current question kept for the model: at
            least this many, and more while their capped size fits in keep_tool_results
            x data_result_chars. Default 3.'
        data_result_chars:
          anyOf:
          - type: integer
            maximum: 200000.0
            minimum: 500.0
          - type: 'null'
          title: Data Result Chars
          description: Character cap for one data tool result. Default 12000.
        schema_result_chars:
          anyOf:
          - type: integer
            maximum: 500000.0
            minimum: 500.0
          - type: 'null'
          title: Schema Result Chars
          description: Character cap for one schema or discovery tool result. Default
            24000.
        summarize_after_tokens:
          anyOf:
          - type: integer
            maximum: 1000000.0
            minimum: 4000.0
          - type: 'null'
          title: Summarize After Tokens
          description: Earlier questions are summarized once the saved thread passes
            this many tokens; the current question is never summarized. Default 60000.
      type: object
      title: AgentLimits
    AgentList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
      type: object
      required:
      - items
      - total
      - page
      - size
      title: AgentList
    AgentOut:
      properties:
        agent_id:
          type: string
          minLength: 1
          title: Agent Id
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        mode:
          type: string
          enum:
          - chat
          - task
          title: Mode
          default: chat
        prompt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Id
        prompt_vars_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Prompt Vars Schema
        model:
          type: string
          title: Model
          default: ''
        tools:
          items: {}
          type: array
          title: Tools
        skills:
          items:
            type: string
          type: array
          title: Skills
        limits:
          anyOf:
          - $ref: '#/components/schemas/AgentLimits'
          - type: 'null'
        status:
          type: string
          enum:
          - draft
          - published
          title: Status
          default: draft
        create_user:
          type: string
          title: Create User
        update_user:
          type: string
          title: Update User
        create_time:
          type: integer
          title: Create Time
        update_time:
          type: integer
          title: Update Time
      type: object
      required:
      - agent_id
      - name
      - create_user
      - update_user
      - create_time
      - update_time
      title: AgentOut
    AgentSetting:
      properties:
        instruction:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Instruction
        allowed_tools:
          anyOf:
          - items:
              type: string
              maxLength: 128
              minLength: 1
            type: array
            maxItems: 100
          - type: 'null'
          title: Allowed Tools
        limits:
          anyOf:
          - $ref: '#/components/schemas/AgentLimits'
          - type: 'null'
      additionalProperties: false
      type: object
      title: AgentSetting
      description: 'A network or user layer: appends instructions and narrows tools
        and limits.


        It can never widen what the layer above allows; values beyond it are clamped

        when the layers are merged.'
    AgentSettingOut:
      properties:
        agent_id:
          type: string
          title: Agent Id
        setting:
          $ref: '#/components/schemas/AgentSetting'
        version:
          type: integer
          title: Version
        update_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: Update Time
      type: object
      required:
      - agent_id
      - setting
      - version
      title: AgentSettingOut
    AgentSpec:
      properties:
        agent_id:
          anyOf:
          - type: string
            maxLength: 50
            minLength: 1
            pattern: ^[0-9A-Za-z_.-]+$
          - type: 'null'
          title: Agent Id
        name:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[0-9A-Za-z_一-鿿]+$
          title: Name
        mode:
          type: string
          enum:
          - chat
          - task
          title: Mode
          default: chat
        prompt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Id
        prompt_vars_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Prompt Vars Schema
        model:
          type: string
          title: Model
          default: ''
        tools:
          items:
            oneOf:
            - $ref: '#/components/schemas/McpToolRef'
            - $ref: '#/components/schemas/ToolboxToolRef'
            - $ref: '#/components/schemas/AgentToolRef'
            - $ref: '#/components/schemas/ContextLoaderToolRef'
            - $ref: '#/components/schemas/BuiltinToolRef'
            discriminator:
              propertyName: type
              mapping:
                agent: '#/components/schemas/AgentToolRef'
                builtin: '#/components/schemas/BuiltinToolRef'
