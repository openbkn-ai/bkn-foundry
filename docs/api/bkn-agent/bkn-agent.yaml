      parameters:
      - name: resource_type
        in: query
        required: true
        schema:
          enum:
          - agent
          - agent_tpl
          type: string
          title: Resource Type
      - name: name
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Name
      - name: sort
        in: query
        required: false
        schema:
          const: name
          type: string
          default: name
          title: Sort
      - name: direction
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: asc
          title: Direction
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
