  /api/bkn-agent/v1/chat:
    post:
      tags:
      - BknAgent
      summary: Chat
      operationId: chat_api_bkn_agent_v1_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: 'SSE event stream: meta({thread_id, agent_id}) comes first;
            within the answer turn token({content}) and tool_call({name}) interleave;
            when response_format is set, one structured({content: object matching
            the schema}) event precedes done; a normal stream ends with done({thread_id});
            a failed one ends with error({code, detail}) — failures are never silent.
            The human-readable error text follows the request Accept-Language; code
            stays stable.'
          content:
            application/json:
              schema: {}
            text/event-stream:
              schema:
                type: string
        4XX:
          description: Platform error envelope (400 parameters / 401 identity / 404
            not found / 409 conflict). The human-readable fields follow the request
            Accept-Language; code stays stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/bkn-agent/v1/invoke/{agent_id}:
    post:
      tags:
      - BknAgent
      summary: Invoke
      description: 'Run once synchronously and return only when the task reaches a
        terminal state.


        Only a published agent may be called; a draft answers exactly like a missing

        one. Both chat and task modes are accepted. Execution is a single stateless

        turn and no thread is persisted, while the task record is still stored so
        the

        run stays observable.'
      operationId: invoke_api_bkn_agent_v1_invoke__agent_id__post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOut'
        4XX:
          description: Platform error envelope (400 parameters / 401 identity / 404
            not found / 409 conflict). The human-readable fields follow the request
            Accept-Language; code stays stable.
          content:
