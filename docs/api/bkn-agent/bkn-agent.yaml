          title: Solution
        trace_id:
          type: string
          title: Trace Id
        link:
          type: string
          title: Link
          default: ''
      type: object
      required:
      - code
      - description
      - detail
      - solution
      - trace_id
      title: ErrorEnvelope
      description: Platform error envelope, used by every non-2xx response.
