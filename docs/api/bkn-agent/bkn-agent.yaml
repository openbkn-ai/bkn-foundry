  /api/bkn-agent/v1/chat:
    post:
      tags:
      - BknAgent
      summary: Chat
      operationId: chat_api_bkn_agent_v1_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: 'SSE event stream: meta({thread_id, agent_id}) comes first;
            within the answer turn token({content}) and tool_call({name}) interleave;
            when response_format is set, one structured({content: object matching
            the schema}) event precedes done; a normal stream ends with done({thread_id});
            a failed one ends with error({code, detail}) — failures are never silent.
            The human-readable error text follows the request Accept-Language; code
            stays stable.'
          content:
            application/json:
              schema: {}
            text/event-stream:
              schema:
                type: string
        4XX:
