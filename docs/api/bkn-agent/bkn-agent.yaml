components:
  schemas:
    AgentDeleted:
      properties:
        deleted:
          type: string
          title: Deleted
      type: object
      required:
      - deleted
      title: AgentDeleted
    AgentExportItem:
      properties:
        agent_id:
          type: string
          title: Agent Id
        spec:
          $ref: '#/components/schemas/AgentSpec'
        prompt:
          anyOf:
          - $ref: '#/components/schemas/PromptExport'
          - type: 'null'
      type: object
      required:
      - agent_id
      - spec
      title: AgentExportItem
    AgentLimits:
      properties:
        max_turns:
          anyOf:
          - type: integer
            maximum: 200.0
            minimum: 1.0
          - type: 'null'
          title: Max Turns
        max_tool_calls:
          anyOf:
          - type: integer
            maximum: 500.0
            minimum: 0.0
          - type: 'null'
          title: Max Tool Calls
        timeout_s:
          anyOf:
          - type: integer
            maximum: 3600.0
            minimum: 1.0
          - type: 'null'
          title: Timeout S
        max_output_tokens:
          anyOf:
          - type: integer
            maximum: 65536.0
            minimum: 10.0
          - type: 'null'
          title: Max Output Tokens
      type: object
      title: AgentLimits
    AgentList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
      type: object
      required:
      - items
      - total
      - page
      - size
      title: AgentList
    AgentOut:
      properties:
        agent_id:
          type: string
          minLength: 1
          title: Agent Id
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        mode:
          type: string
          enum:
          - chat
          - task
          title: Mode
          default: chat
        prompt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Id
        prompt_vars_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Prompt Vars Schema
        model:
          type: string
          title: Model
          default: ''
        tools:
          items: {}
          type: array
          title: Tools
        skills:
          items:
            type: string
          type: array
          title: Skills
        limits:
          anyOf:
          - $ref: '#/components/schemas/AgentLimits'
          - type: 'null'
        status:
          type: string
          enum:
          - draft
          - published
          title: Status
          default: draft
        create_user:
          type: string
          title: Create User
        update_user:
          type: string
          title: Update User
        create_time:
          type: integer
          title: Create Time
        update_time:
          type: integer
          title: Update Time
      type: object
      required:
      - agent_id
      - name
      - create_user
      - update_user
      - create_time
      - update_time
      title: AgentOut
    AgentSpec:
      properties:
        agent_id:
          anyOf:
          - type: string
            maxLength: 50
            minLength: 1
            pattern: ^[0-9A-Za-z_.-]+$
          - type: 'null'
          title: Agent Id
        name:
          type: string
          maxLength: 100
          minLength: 1
          pattern: ^[0-9A-Za-z_一-鿿]+$
          title: Name
        mode:
          type: string
          enum:
          - chat
          - task
          title: Mode
          default: chat
        prompt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Id
        prompt_vars_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Prompt Vars Schema
        model:
          type: string
          title: Model
          default: ''
        tools:
          items:
            oneOf:
            - $ref: '#/components/schemas/McpToolRef'
            - $ref: '#/components/schemas/ToolboxToolRef'
            - $ref: '#/components/schemas/AgentToolRef'
            - $ref: '#/components/schemas/ContextLoaderToolRef'
            discriminator:
              propertyName: type
              mapping:
                agent: '#/components/schemas/AgentToolRef'
                context_loader: '#/components/schemas/ContextLoaderToolRef'
                mcp: '#/components/schemas/McpToolRef'
                toolbox: '#/components/schemas/ToolboxToolRef'
          type: array
          title: Tools
        skills:
          items:
            type: string
          type: array
          title: Skills
        limits:
          anyOf:
          - $ref: '#/components/schemas/AgentLimits'
          - type: 'null'
        status:
          type: string
          enum:
          - draft
          - published
          title: Status
          default: draft
      type: object
      required:
      - name
      title: AgentSpec
    AgentToolRef:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Description
        type:
          type: string
          const: agent
          title: Type
        agent_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Agent Id
      additionalProperties: true
      type: object
      required:
      - type
      - agent_id
      title: AgentToolRef
    ChatRequest:
      properties:
        agent_id:
          type: string
          title: Agent Id
        thread_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Thread Id
        message:
          type: string
          minLength: 1
          title: Message
        skills:
          items:
            type: string
          type: array
          title: Skills
        prompt_override:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Override
        prompt_vars:
          additionalProperties: true
          type: object
          title: Prompt Vars
        response_format:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Response Format
      type: object
      required:
      - agent_id
      - message
      title: ChatRequest
    ContextLoaderToolRef:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Description
        type:
          type: string
          const: context_loader
          title: Type
        allowed_tools:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 100
          - type: 'null'
          title: Allowed Tools
          description: Allowlist of Context Loader MCP tool names this agent may load;
            omit it to allow all.
      additionalProperties: true
      type: object
      required:
      - type
      title: ContextLoaderToolRef
      description: 'Context Loader knowledge-network retrieval tools, loaded over
        its MCP surface.


        Deliberately carries no url: the endpoint comes from CONTEXT_LOADER_MCP_URL,

        so an agent definition can be exported and imported across environments

        without embedding an environment address, which a type=mcp reference with
        a

        hard-coded url cannot do.'
    EffectivePromptOut:
      properties:
        source:
          type: string
          enum:
          - override
          - default
          title: Source
        content:
          type: string
          title: Content
        prompt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Id
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      type: object
      required:
      - source
      - content
      title: EffectivePromptOut
