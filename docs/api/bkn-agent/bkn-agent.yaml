      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOut'
        4XX:
          description: Platform error envelope (400 parameters / 401 identity / 404
            not found / 409 conflict). The human-readable fields follow the request
            Accept-Language; code stays stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags:
      - BknAgent
      summary: List Agents
      operationId: list_agents_api_bkn_agent_v1_agents_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        4XX:
          description: Platform error envelope (400 parameters / 401 identity / 404
            not found / 409 conflict). The human-readable fields follow the request
            Accept-Language; code stays stable.
          content:
            application/json:
              schema:
