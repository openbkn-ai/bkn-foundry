  /api/bkn-agent/v1/executions:
    post:
      tags:
      - BknAgentExecution
      summary: Execute
      operationId: execute_api_bkn_agent_v1_executions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
        required: true
      responses:
        '200':
          description: 'SSE: meta, reasoning, token, tool_started, tool_finished,
            usage, result, terminal. reasoning carries the model''s streamed thinking
            when it provides any; it is never part of the answer. Each event carries
            run_id and sequence. result.content.answer is the last assistant message;
            text streamed before tool calls is progress, not the answer. tool_finished
            of a built-in provider''s tool may carry progress, {<result key>: what
            the run planned since the previous one}, to show before the run ends;
            the final result stays authoritative. Successful result is persisted before
            result/terminal; terminal.status is succeeded/failed/cancelled. Retries
            return meta and the existing terminal; an active retry returns 409. Disconnect
            cancels execution.'
          content:
            text/event-stream:
              schema:
                type: string
        4XX:
          description: Platform error envelope (400 parameters / 401 identity / 404
            not found / 409 conflict). The human-readable fields follow the request
            Accept-Language; code stays stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - HTTPBearer: []
