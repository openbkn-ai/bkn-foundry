openapi: 3.0.3
info:
  title: BKN Safe Enterprise Row-filter Policy Management API
  version: 1.0.0
  description: |
    Manages one fixed-condition object-instance row-filter policy for a user or
    role on one published object type. Row filtering is evaluated only after
    the caller has the object's base `query_data` permission and can therefore
    narrow, but never grant or expand, query access.

    This first version supports only administrator-entered fixed values. It has
    no user/department auto-matching, identity-field mapping, SQL, scripts,
    regular expressions, nested Boolean groups, or legacy policy migration.

    The API is available only when the Enterprise row-filter capability is
    assembled and licensed. Reads and writes additionally require the matching
    user- or role-administration permission. Updates use optimistic locking;
    clients must read the current `revision`, submit it as `expected_revision`,
    and handle `409 revision_conflict` without automatically overwriting the
    newer policy.
servers:
  - url: /api/safe/v1/admin
security:
  - BearerAuth: []
tags:
  - name: Row-filter policies
paths:
  /row-filter-policies:
    get:
      tags: [Row-filter policies]
      operationId: getRowFilterPolicy
      summary: Get one subject's explicit row-filter policy and available fields
      parameters:
        - $ref: '#/components/parameters/ObjectTypeRef'
        - $ref: '#/components/parameters/SubjectType'
        - $ref: '#/components/parameters/SubjectID'
      responses:
        '200':
          description: Current explicit policy snapshot. A null policy means no direct row filter is configured for this subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowFilterSnapshot'
              examples:
                configured:
                  value:
                    object_type_ref: supply_chain/order
                    subject: {type: user, id: user-1}
                    policy:
                      relation: and
                      conditions:
                        - property_name: region
                          operator: in
                          values: [east, south]
                        - property_name: priority
                          operator: gte
                          values: [3]
                    revision: AAAAAAAAAAE
                    available_fields:
                      - {display_name: Sales region, name: region, type: string}
                      - {display_name: Priority, name: priority, type: integer}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CapabilityUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
    patch:
      tags: [Row-filter policies]
      operationId: patchRowFilterPolicy
      summary: Create, replace, or delete one explicit row-filter policy
      description: |
        The request atomically updates the policy and its audit record. For a
        create, `expected_revision` must be null. For an update or deletion it
        must equal the revision returned by the latest GET. `policy: null`
        deletes an existing policy and is an idempotent no-op when none exists.
        A deleted policy no longer participates in user/role policy composition;
        deletion does not mean “deny every row”.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRowFilterPolicyRequest'
            examples:
              create:
                value:
                  object_type_ref: supply_chain/order
                  subject: {type: role, id: sales-east}
                  expected_revision: null
                  policy:
                    relation: and
                    conditions:
                      - property_name: region
                        operator: in
                        values: [east]
                  reason: Restrict the role to the east sales region
              delete:
                value:
                  object_type_ref: supply_chain/order
                  subject: {type: role, id: sales-east}
                  expected_revision: AAAAAAAAAAE
                  policy: null
                  reason: Remove the obsolete regional restriction
      responses:
        '200':
          description: Updated snapshot. A successful deletion returns a null policy and revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowFilterSnapshot'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CapabilityUnavailable'}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
  /row-filter-policies/explain:
    post:
      tags: [Row-filter policies]
      operationId: explainRowFilterPolicy
      summary: Explain the row-filter rules currently applicable to a subject
      description: |
        For a user, returns the direct policy, matching role policies, and the
        normalized effective predicate. Complete user/role policies are ORed;
        conditions inside each policy retain that policy's AND or OR relation.
        For a role, `role_policy_only` is true and no user-effective predicate is
        calculated because a role alone does not identify a concrete user's full
        role membership. The response never includes filtered object instances.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowFilterTarget'
      responses:
        '200':
          description: Effective-rule explanation and the selected subject's current snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowFilterExplanation'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CapabilityUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/TemporarilyUnavailable'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2 access token
  parameters:
    ObjectTypeRef:
      name: object_type_ref
      in: query
      required: true
      description: Canonical `<knowledge-network-id>/<object-type-id>` reference.
      schema:
        $ref: '#/components/schemas/ObjectTypeRef'
    SubjectType:
      name: subject_type
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/SubjectType'
    SubjectID:
      name: subject_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    ObjectTypeRef:
      type: string
      minLength: 3
      maxLength: 81
      pattern: '^[a-z0-9][a-z0-9_-]{0,39}/[a-z0-9][a-z0-9_-]{0,39}$'
    SubjectType:
      type: string
      enum: [user, role]
    RowFilterSubject:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          $ref: '#/components/schemas/SubjectType'
        id:
          type: string
          minLength: 1
          maxLength: 128
    RowFilterTarget:
      type: object
      additionalProperties: false
      required: [object_type_ref, subject]
      properties:
        object_type_ref:
          $ref: '#/components/schemas/ObjectTypeRef'
        subject:
          $ref: '#/components/schemas/RowFilterSubject'
    RowFilterValue:
      description: A string, 64-bit integer represented exactly in JSON, or Boolean. The service does not coerce between types.
      oneOf:
        - type: string
        - type: integer
          format: int64
        - type: boolean
    RowFilterOperator:
      type: string
      enum: [in, not_in, gt, gte, lt, lte, between]
    RowFilterCondition:
      type: object
      additionalProperties: false
      required: [property_name, operator, values]
      properties:
        property_name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,39}$'
        operator:
          $ref: '#/components/schemas/RowFilterOperator'
        values:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RowFilterValue'
          description: |
            `in` and `not_in` accept 1-100 values. `gt`, `gte`, `lt`, and
            `lte` accept exactly one integer. `between` accepts two ascending
            integers and includes both boundaries. Boolean properties support
            only `in`. All values in one condition must have the published
            property's exact scalar type.
    RowFilterPolicy:
      type: object
      additionalProperties: false
      required: [relation, conditions]
      properties:
        relation:
          type: string
          enum: [and, or]
        conditions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/RowFilterCondition'
    NullableRowFilterPolicy:
      type: object
      nullable: true
      additionalProperties: false
      required: [relation, conditions]
      properties:
        relation:
          type: string
          enum: [and, or]
        conditions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/RowFilterCondition'
    AvailableField:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        display_name:
          type: string
          description: Business display name when one is available.
        name:
          type: string
          description: Technical property name submitted in policy conditions.
        type:
          type: string
          enum: [string, integer, boolean]
    RowFilterSnapshot:
      type: object
      additionalProperties: false
      required: [object_type_ref, subject, policy, revision, available_fields]
      properties:
        object_type_ref:
          $ref: '#/components/schemas/ObjectTypeRef'
        subject:
          $ref: '#/components/schemas/RowFilterSubject'
        policy:
          $ref: '#/components/schemas/NullableRowFilterPolicy'
        revision:
          type: string
          nullable: true
          description: Opaque optimistic-lock token. Null when no direct policy exists.
        available_fields:
          type: array
          items:
            $ref: '#/components/schemas/AvailableField'
    PatchRowFilterPolicyRequest:
      type: object
      additionalProperties: false
      required: [object_type_ref, subject, expected_revision, policy, reason]
      properties:
        object_type_ref:
          $ref: '#/components/schemas/ObjectTypeRef'
        subject:
          $ref: '#/components/schemas/RowFilterSubject'
        expected_revision:
          type: string
          nullable: true
          description: Null for creation or idempotent deletion of an absent policy; otherwise the latest snapshot revision.
        policy:
          $ref: '#/components/schemas/NullableRowFilterPolicy'
          description: Null deletes the explicit policy.
        reason:
          type: string
          minLength: 1
          maxLength: 512
    PolicySource:
      type: object
      additionalProperties: false
      required: [subject, policy]
      properties:
        subject:
          $ref: '#/components/schemas/RowFilterSubject'
        policy:
          $ref: '#/components/schemas/RowFilterPolicy'
    EffectivePredicate:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [true, false, in, not_in, gt, gte, lt, lte, between, and, or]
        property:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/RowFilterValue'
        predicates:
          type: array
          items:
            $ref: '#/components/schemas/EffectivePredicate'
    RowFilterExplanation:
      type: object
      additionalProperties: false
      required: [snapshot, role_policy_only]
      properties:
        snapshot:
          $ref: '#/components/schemas/RowFilterSnapshot'
        effective_predicate:
          $ref: '#/components/schemas/EffectivePredicate'
        effective_row_filter_digest:
          type: string
          description: Stable digest of the normalized effective predicate; omitted for a role-only explanation.
        direct_policy:
          $ref: '#/components/schemas/RowFilterPolicy'
        role_policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicySource'
        role_policy_only:
          type: boolean
    ManagementError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthenticated, forbidden, unavailable, revision_conflict, internal_error]
            message:
              type: string
  responses:
    InvalidRequest:
      description: Invalid target, policy shape, field, operator, value type, or request body.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementError'}
    Unauthenticated:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementError'}
    Forbidden:
      description: The operator lacks permission to read or manage the selected user or role policy.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementError'}
    CapabilityUnavailable:
      description: The Enterprise row-filter management capability is not mounted or licensed.
    RevisionConflict:
      description: The policy changed after the caller's last read; fetch a fresh snapshot before deciding whether to retry.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementError'}
    InternalError:
      description: Policy management failed without committing a partial policy or audit record.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementError'}
    TemporarilyUnavailable:
      description: A required directory, authorization, schema, or policy dependency is unavailable; the operation fails closed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementError'}
