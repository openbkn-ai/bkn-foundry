---
# Knowledge-network capability binding: which Skills and ToolBox tools belong to a knowledge network.
openapi: 3.0.2
info:
  title: BKN Capabilities
  version: 0.1.0
  description: |
    A capability binding records that a Skill or a ToolBox tool belongs to a knowledge network.
    The master data stays in the execution factory; the binding holds only the reference, so
    creating, publishing and indexing capabilities is unchanged by these endpoints.

    ## Identity

    A capability is identified by three parts:

    | capability_type | box_id | capability_id |
    |---|---|---|
    | `skill` | empty | `skill_id` |
    | `function` | `box_id` | `tool_id` |

    `box_id` is required for a function because a tool id is scoped to its box in the execution
    factory, and it is the same name the execution factory, Context Loader and Studio already
    use. A skill has no container and omits it.

    The stored column behind it is type-neutral (`f_owner_id`) so a later capability type can
    bring a different kind of container without a migration; that name does not appear on the
    wire. A `box_id` sent with a skill is dropped rather than stored — keeping it would create a
    second row for the same skill that the unique key cannot collapse, and repeated mounts would
    stop being idempotent.

    ## What a binding answers

    A binding answers "which capabilities does this knowledge network have", not "which
    capability is relevant to this question". Listing does not replace retrieval: a network
    with dozens of Skills and tools needs the execution factory's search endpoints.

    ## Scope and branch

    Bindings are per branch. Creating a branch copies them, deleting a branch clears them, and
    the count in the knowledge-network statistics follows the branch being viewed.

    ## Idempotency

    Mounting is a statement about membership, not an event. Mounting a capability that is
    already bound returns the existing binding rather than failing, and repeating an entry
    inside one request produces one row.

    ## Mounting validates the target

    A mount checks the capability against the execution factory before writing anything, and
    the two failures it can report are deliberately distinct: **the target does not exist**
    (check the id) and **the target exists but is not usable** (publish the tool box or skill,
    or enable the tool). Collapsing them into one error would leave the caller guessing which
    fix applies.

    Validation runs over the whole request first. A batch whose fourth capability is unknown
    writes nothing at all rather than leaving three bindings behind.

    When the execution factory is unreachable the answer is **502 and no write**. A binding
    recorded without validation cannot be told apart later from one that was checked.

    Two things are deliberately *not* checked. `metadata_type` is ignored, so `openapi` and
    `function` tools are equally bindable — a binding names a tool, and the box is only the
    execution factory's container for it. And mounting does not require permission to *execute*
    the target: binding is a modeling action by the network's owner, while whether a caller may
    run the tool stays the execution factory's decision at call time.

    ## Whole-box mounting

    `{"capability_type": "function", "box_id": "box-x", "all_tools": true}` mounts every
    enabled tool of that box. The expansion happens **at write time**: the stored rows are
    ordinary tool-level bindings carrying `bound_as_box: true`, so the read path never expands
    anything and any single row can be released on its own.

    Tools added to the box afterwards are **not** inherited. That is the point of expanding
    rather than storing a box-level scope: on a shared box, inheritance would let someone else's
    edit widen this network's reach. The list view reports how many tools of a box are not
    mounted so they can be added deliberately.

    Disabled tools are skipped, on the same terms that reject them when named directly. A box
    with no tool to mount is a 400, not a silent success — "I mounted the box" and "nothing
    happened" must not look alike.

    ## Metadata is backfilled, not stored

    A binding stores only the reference. Names, descriptions and statuses are read from the
    execution factory when the list is served, so they never go stale and the master data stays
    in one place.

    The reads are shaped around what costs what. Function metadata comes **per tool box**, not
    per tool: the box endpoint inlines its tools, so a page of twenty function bindings across
    three boxes costs three calls. Skill names are one call for the whole page. Only a skill's
    description and status must be read one skill at a time, which is why they are behind
    `with_detail=true` rather than always paid.

    ## Dangling bindings are marked, never deleted

    A binding whose target has been removed from the execution factory comes back with
    `status: "missing"`. It is not deleted: removing it silently would erase the evidence that
    the network once pointed at something, and it is the owner's decision whether to clean it up
    or restore the capability. When a whole tool box is gone, every binding under it is marked
    and the box appears in `boxes` with `box_missing: true`.

    This matters because retrieval treats a dangling reference as simply absent — it matches
    nothing and says nothing. Without the marker the only symptom is "the navigation says four
    functions but only three ever come back".

    ## Whole-box top-up

    A whole-box mount is expanded at write time and does not follow the box afterwards, so tools
    added later are not bound. `boxes` reports `total_tools`, `mounted_tools` and
    `unmounted_tools` per box so the list can show "20 of 23 mounted" and offer to add the rest
    deliberately. Disabled tools are excluded from the totals: they are not something a top-up
    would add.

    These counts are **per branch, not per page**. Pagination slices the entry list, not the box,
    so counting a page against a box-wide total would read "10 of 23 mounted" for a box that is
    fully mounted and offer a top-up that does nothing. When the count cannot be established the
    box is omitted from `boxes` and `metadata_available` turns false, rather than published with
    a number that would send the caller after tools that are already bound.

    ## When the execution factory is down

    Listing degrades rather than fails: the bindings come back in full with empty metadata and
    `metadata_available: false`. Listing memberships is the point of the endpoint and the names
    are decoration — failing the request would take the mount UI down with the factory. The flag
    exists so an empty name is not read as a deleted capability; an outage and a deletion must
    not look alike.

    ## The internal face answers differently

    `GET /api/bkn-backend/in/v1/knowledge-networks/{kn_id}/capabilities` returns **bare
    references** — `capability_type`, `box_id`, `capability_id` — with no metadata, no paging and
    no box summaries.

    Context Loader calls it on every recall to learn what is in scope before asking the execution
    factory to search inside that scope. Backfilling names here would add a service hop per
    recall to produce exactly what the caller is about to fetch itself, and paging it would hand
    back a subset of the scope, which is a different scope. A network with no bindings resolves
    to an empty list rather than an error: "this network has no skills" is an answer, not a
    broken dependency.

    **Prefix aliases**: every path below is also served under `/api/ontology-manager/v1`, and
    the internal face under `/api/bkn-backend/in/v1` and `/api/ontology-manager/in/v1`.
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/capabilities:
    get:
      summary: List the capabilities bound to a knowledge network
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
          in: query
        - name: type
          description: Filter by capability type. Any other value is rejected with 400.
          schema:
            enum:
              - skill
              - function
            type: string
          in: query
        - name: box_id
          description: Filter by owning tool box. Only meaningful for functions.
          schema:
            type: string
          in: query
        - name: metadata_type
          description: >-
            Narrow function bindings to one kind of tool box: `openapi` or `function`. The value
            belongs to the box rather than the binding, so it is resolved to the set of boxes of
            that kind and applied as a query condition — paging and `total_count` are therefore
            over rows that already match. A box whose kind cannot be read counts as `function`,
            which keeps a dangling binding visible in one of the two lists rather than neither.

            The kind belongs to a tool box, so this implies `type=function`: skills and MCP tools
            are never returned alongside it. Any value other than the two is a 400.
          schema:
            type: string
            enum: [openapi, function]
          in: query
        - name: with_detail
          description: >-
            Also fill description and status. A skill's detail is read one skill at a time, so
            this is opt-in; function detail arrives with the box response either way.
          schema:
            type: boolean
            default: false
          in: query
        - name: offset
          description: Offset. Defaults to 0.
          schema:
            type: integer
          in: query
        - name: limit
          description: Page size. Defaults to 10.
          schema:
            type: integer
          in: query
        - name: sort
          description: Sort field. Defaults to create_time.
          schema:
            enum:
              - create_time
              - update_time
            type: string
          in: query
        - name: direction
          description: Sort direction, asc or desc. Defaults to desc.
          schema:
            enum:
              - asc
              - desc
            type: string
          in: query
      responses:
        '200':
          description: Capability bindings of this branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityBindingList'
        '400':
          description: Invalid capability type or pagination parameter
        '403':
          description: The caller cannot view this knowledge network
        '404':
          description: Knowledge network or branch not found
      operationId: listCapabilities
      tags:
        - Capabilities
    post:
      summary: Mount capabilities onto a knowledge network
      description: |
        Idempotent. A capability already bound resolves to its existing binding, and the
        response carries one entry per requested capability in request order.
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
          in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachCapabilitiesRequest'
      responses:
        '200':
          description: The bindings of the requested capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityBindingList'
        '400':
          description: >-
            Empty capability list, unsupported capability_type, missing capability_id, a
            function without box_id, or a value longer than its column: box_id and
            capability_id are limited to 64 characters and comment to 255. Over-long values are
            rejected here rather than reaching the database, where they would surface as a 500
            under strict SQL mode or be silently truncated into a binding pointing at a
            different capability. Also returned when the target does not exist
            (`BknBackend.CapabilityBinding.TargetNotFound`), exists but is unpublished or
            disabled (`BknBackend.CapabilityBinding.TargetNotAvailable`), or a whole-box mount
            names a box with no tool to mount (`BknBackend.CapabilityBinding.EmptyToolBox`).
        '502':
          description: >-
            The execution factory is unreachable, so the targets could not be validated
            (`BknBackend.CapabilityBinding.ExecutionFactoryUnavailable`). Nothing is written —
            a retry is safe.
        '403':
          description: The caller cannot modify this knowledge network
        '404':
          description: Knowledge network or branch not found
      operationId: attachCapabilities
      tags:
        - Capabilities
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/capabilities/{binding_ids}:
    delete:
      summary: Release capability bindings
      description: |
        Releases by binding ID, comma separated for a batch. IDs that are already gone are not
        an error. Binding IDs are used rather than the capability identity because a
        tool-level binding needs box_id as well to be located, and identifiers containing
        special characters would have to be escaped in the path.
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: binding_ids
          description: Comma-separated binding IDs
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
          in: query
      responses:
        '204':
          description: >-
            Released. Releasing a binding that is already gone is also a 204: the request states
            that the capability is not mounted, and that is true either way. This matches
            DELETE .../metrics.
        '400':
          description: Empty binding_ids
        '403':
          description: The caller cannot modify this knowledge network
        '404':
          description: Knowledge network or branch not found
      operationId: detachCapabilities
      tags:
        - Capabilities
components:
  schemas:
    CapabilityBinding:
      description: One capability bound to a knowledge network branch
      type: object
      required:
        - id
        - kn_id
        - branch
        - capability_type
        - capability_id
      properties:
        id:
          description: >-
            Binding ID, a UUIDv7. Empty for a capability the model uses that nobody mounted:
            there is no stored row behind it. See `releasable`.
          type: string
        kn_id:
          description: Business knowledge network ID
          type: string
        branch:
          description: Branch
          type: string
        capability_type:
          description: Capability type
          enum:
            - skill
            - function
            - mcp_tool
          type: string
        box_id:
          description: Owning tool box ID. Present for functions, absent for skills.
          type: string
        capability_id:
          description: Execution-factory identifier — skill_id for a skill, tool_id for a function
          type: string
        bound_as_box:
          description: >-
            Whether the row came from expanding a whole-box mount. It does not change the
            binding semantics: the row is an ordinary tool-level binding and can be released
            on its own.
          type: boolean
        releasable:
          description: >-
            Whether this entry can be released here. False for a capability that is in the
            network because an object type's logic property or an action type uses it: it has
            no row and no id, and the way to remove it is to change what `sources` names.
            Releasing a mounted one removes the mount, not the capability — it stays in the
            list with only its model sources left.
          type: boolean
        sources:
          description: >-
            Why this capability is in the network. `manual` is an explicit mount, `box` a
            whole-box or whole-server expansion, `object_type` and `action_type` a use by the
            model. Several can appear at once; the object_type refs name the property, because
            dropping a property and dropping the object type are different repairs.
          type: array
          items:
            type: object
            properties:
              kind:
                enum: [manual, box, object_type, action_type]
                type: string
              refs:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    property: { type: string }
        comment:
          description: Free-text note
          type: string
        name:
          description: >-
            Capability name, backfilled from the execution factory when available. Never
            persisted in the binding.
          type: string
        description:
          description: Capability description, backfilled from the execution factory
          type: string
        status:
          description: >-
            Capability status in the execution factory, backfilled. The value `missing` means the
            target no longer exists there; the binding is reported, not deleted.
          type: string
        owner_name:
          description: Tool box name, backfilled
          type: string
        creator:
          $ref: '#/components/schemas/AccountInfo'
        create_time:
          description: Creation time in milliseconds
          type: integer
          format: int64
        updater:
          $ref: '#/components/schemas/AccountInfo'
        update_time:
          description: Update time in milliseconds
          type: integer
          format: int64
    CapabilityBoxSummary:
      description: How much of a tool box this branch has mounted
      type: object
      required:
        - box_id
        - total_tools
        - mounted_tools
        - unmounted_tools
      properties:
        box_id:
          type: string
        box_name:
          description: Empty when the execution factory could not be reached
          type: string
        box_missing:
          description: The box no longer exists; every binding under it is missing too
          type: boolean
        total_tools:
          description: Enabled tools currently in the box
          type: integer
        mounted_tools:
          description: Of those, the ones bound to this branch
          type: integer
        unmounted_tools:
          description: What a one-click top-up would add
          type: integer
    CapabilityBindingList:
      description: Capability binding list
      type: object
      required:
        - entries
        - total_count
        - metadata_available
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityBinding'
        total_count:
          description: Total matching bindings, ignoring pagination
          type: integer
        boxes:
          description: The tool boxes behind the whole-box mounts on this page
          type: array
          items:
            $ref: '#/components/schemas/CapabilityBoxSummary'
        metadata_available:
          description: >-
            False when the execution factory could not be reached. The bindings are still
            complete; only their names, descriptions and statuses are missing.
          type: boolean
    AttachCapabilitiesRequest:
      description: Mount request
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AttachCapabilityEntry'
    AttachCapabilityEntry:
      description: One capability to mount
      type: object
      required:
        - capability_type
        - capability_id
      properties:
        capability_type:
          enum:
            - skill
            - function
          type: string
        box_id:
          description: Tool box ID. Required for a function, ignored for a skill.
          type: string
        capability_id:
          description: >-
            skill_id for a skill, tool_id for a function. Omitted when all_tools is set.
          type: string
        all_tools:
          description: >-
            Mount every enabled tool of the box named by box_id. Expanded at write time into
            one tool-level binding per tool, each with bound_as_box true; tools added to the box
            later are not inherited.
          type: boolean
        releasable:
          description: >-
            Whether this entry can be released here. False for a capability that is in the
            network because an object type's logic property or an action type uses it: it has
            no row and no id, and the way to remove it is to change what `sources` names.
            Releasing a mounted one removes the mount, not the capability — it stays in the
            list with only its model sources left.
          type: boolean
        sources:
          description: >-
            Why this capability is in the network. `manual` is an explicit mount, `box` a
            whole-box or whole-server expansion, `object_type` and `action_type` a use by the
            model. Several can appear at once; the object_type refs name the property, because
            dropping a property and dropping the object type are different repairs.
          type: array
          items:
            type: object
            properties:
              kind:
                enum: [manual, box, object_type, action_type]
                type: string
              refs:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    property: { type: string }
        comment:
          description: Free-text note
          type: string
    AccountInfo:
      description: Account information
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
tags:
  - name: Capabilities
    description: Knowledge-network capability binding
