---
openapi: 3.0.2
info:
  title: ActionType
  version: 0.1.0
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/action-types:
    get:
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: name_pattern
          description: Fuzzy match by name. Defaults to empty.
          schema:
            type: string
          in: query
        - name: sort
          description: Sort type. Defaults to update_time.
          schema:
            enum:
              - update_time
              - name
            type: string
          in: query
        - name: direction
          description: |-
            Sort direction. Supported values are asc and desc.
            Defaults to desc.
          schema:
            enum:
              - asc
              - desc
            type: string
          in: query
        - name: offset
          description: "Offset of the first returned item. Must be greater than or equal to 0. Defaults to 0."
          schema:
            format: int64
            type: integer
          in: query
        - name: limit
          description: |-
            Maximum number of items returned per page.
            Pagination accepts 1 through 1000, and -1 disables pagination.
            Defaults to 10.
          schema:
            format: int64
            type: integer
          in: query
        - name: tag
          description: Exact match by tag. Defaults to empty.
          schema:
            type: string
          in: query
        - name: action_type
          description: |-
            Query filter: filter by action category enum using the same value domain as action_type and action_intent in the response.
          schema:
            enum:
              - add
              - modify
              - delete
            type: string
          in: query
          required: false
        - name: object_type_id
          description: Bound object type
          schema:
            type: string
          in: query
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListActionTypes"
          description: ok
      summary: List action types
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/override"
            examples:
              创建行动类:
                value:
                  - id: restart_pod
                    name: 重启pod
                    tags:
                      - 拓扑架构
                    comment: "当pod状态是unknown或者failed时,重启pod"
                    icon: ""
                    color: ""
                    branch: main
                    action_type: modify
                    action_intent: modify
                    object_type_id: pod
                    condition:
                      object_type_id: pod
                      field: pod_status
                      operation: in
                      value_from: const
                      value:
                        - Unknown
                        - Failed
                    impact_contracts:
                      - object_type_id: pod
                        expected_operation: modify
                        description: 重启 pod
                        affected_fields: []
                    action_source:
                      type: tool
                      box_id: tool_123
                      tool_id: box_123
                    parameters:
                      - name: pod
                        value_from: property
                        value: pod_name
                      - name: namespace
                        value_from: property
                        value: pod_namespace
                      - name: cmd_type
                        value_from: input
                        value: ""
                    schedule:
                      type: ""
                      expression: ""
                    module_type: action_type
              检索行动类-第一次请求:
                value:
                  need_total: true
                  limit: 1
                  condition:
                    operation: and
                    sub_conditions:
                      - field: comment
                        operation: match
                        value_from: const
                        value: pod
                      - field: "*"
                        operation: knn
                        value_from: const
                        value:
                          - pod
                          - 10
              检索行动类-非第一次请求:
                value:
                  cursor: cursor-action-types-1
                  need_total: true
                  limit: 1
                  condition:
                    operation: and
                    sub_conditions:
                      - field: comment
                        operation: match
                        value_from: const
                        value: pod
                      - field: "*"
                        operation: knn
                        value_from: const
                        value:
                          - pod
                          - 10
        required: true
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: import_mode
          description: Import mode. Supported values are normal, ignore, and overwrite. Defaults to normal.
          schema:
            enum:
              - normal
              - ignore
              - overwrite
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true. When true, validates dependencies such as bound and affected object types. When false, missing dependencies do not cause an error.
          schema:
            type: boolean
            default: true
          in: query
        - name: x-http-method-override
          description: Request override header
          schema:
            enum:
              - POST
              - GET
            type: string
          in: header
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionTypeSearchResponse"
              examples:
                检索行动类-第一次请求:
                  value:
                    entries:
                      - id: restart_pod
                        name: 重启pod
                        tags:
                          - 拓扑架构
                        comment: "当pod状态是unknown或者failed时,重启pod"
                        icon: ""
                        color: ""
                        branch: main
                        detail: ""
                        creator: a0f02238-6cec-11f0-82bb-fa1c4529a151
                        create_time: 1757657606651
                        updater: a0f02238-6cec-11f0-82bb-fa1c4529a151
                        update_time: 1758098535626
                        kn_id: kn_system_incident_event_network
                        action_type: modify
                        action_intent: modify
                        object_type_id: pod
                        impact_contracts:
                          - object_type_id: pod
                            expected_operation: modify
                            description: 重启pod
                            affected_fields: []
                        object_type:
                          id: ""
                          name: ""
                          icon: ""
                          color: ""
                        condition:
                          object_type_id: pod
                          field: pod_status
                          operation: in
                          value_from: const
                          value:
                            - Unknown
                            - Failed
                        action_source:
                          type: tool
                          box_id: tool_123
                          tool_id: box_123
                        parameters:
                          - name: pod
                            value_from: property
                            value: pod_name
                          - name: namespace
                            value_from: property
                            value: pod_namespace
                          - name: cmd_type
                            value_from: input
                            value: ""
                        schedule:
                          type: ""
                          expression: ""
                        IfNameModify: false
                        module_type: action_type
                    total_count: 2
                    next_cursor: cursor-action-types-1
                检索行动类-非第一次请求:
                  value:
                    entries:
                      - id: restart_pod_test
                        name: 重启pod_test
                        tags:
                          - 拓扑架构
                        comment: "当pod状态是unknown或者failed时,重启pod"
                        icon: ""
                        color: ""
                        branch: main
                        detail: ""
                        creator: a0f02238-6cec-11f0-82bb-fa1c4529a151
                        create_time: 1758346280120
                        updater: a0f02238-6cec-11f0-82bb-fa1c4529a151
                        update_time: 1758346280120
                        kn_id: kn_system_incident_event_network
                        action_type: modify
                        action_intent: modify
                        object_type_id: pod
                        impact_contracts:
                          - object_type_id: pod
                            expected_operation: modify
                            description: 重启pod
                            affected_fields: []
                        object_type:
                          id: ""
                          name: ""
                          icon: ""
                          color: ""
                        condition:
                          object_type_id: pod
                          field: pod_status
                          operation: in
                          value_from: const
                          value:
                            - Unknown
                            - Failed
                        action_source:
                          type: tool
                          box_id: tool_123
                          tool_id: box_123
                        parameters:
                          - name: pod
                            value_from: property
                            value: pod_name
                          - name: namespace
                            value_from: property
                            value: pod_namespace
                          - name: cmd_type
                            value_from: input
                            value: ""
                        schedule:
                          type: ""
                          expression: ""
                        IfNameModify: false
                        module_type: action_type
                    next_cursor: cursor-action-types-2
          description: "GET override for action type retrieval"
        "201":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ID"
          description: ok
      summary: Create or retrieve action types
    parameters:
      - name: kn_id
        description: Business knowledge network ID
        schema:
          type: string
        in: path
        required: true
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/action-types/{at_id}:
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActionType"
        required: true
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: at_id
          description: Action type ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true. When true, validates bound and affected object types and other dependencies. When false, skips validation.
          schema:
            type: boolean
            default: true
          in: query
      responses:
        "204":
          description: ok
      summary: Update an action type
    parameters:
      - name: kn_id
        description: Business knowledge network ID
        in: path
        required: true
      - name: at_id
        description: Action type ID
        in: path
        required: true
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/action-types/{at_ids}:
    get:
      parameters:
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionTypeDetails"
          description: ok
      summary: Get action type details
    delete:
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: at_ids
          description: Action type ID
          schema:
            type: array
            items:
              type: string
          in: path
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      responses:
        "204":
          description: Deletion succeeded
      summary: Delete an action type
    parameters:
      - name: kn_id
        description: Business knowledge network ID
        schema:
          type: string
        in: path
        required: true
      - name: at_ids
        description: Action type ID
        schema:
          type: array
          items:
            type: string
        in: path
        required: true
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/action-types/validation:
    post:
      summary: Validate action types
      description: |
        Validates only action type dependency existence and does not persist data. It validates dependencies such as bound and affected object types.

        Response: HTTP 200 with valid and detail follows the other validation APIs. Parameter and authentication errors are non-2xx.

        Internal API: the corresponding internal path resolves the caller from headers and does not use OAuth.
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: import_mode
          description: Matches action type creation and validates conflicts with persisted action type IDs or names using normal, ignore, or overwrite.
          schema:
            type: string
            enum: [normal, ignore, overwrite]
            default: normal
          in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  description: Action types to validate. Uses the same structure as the creation API.
                  items:
                    type: object
      responses:
        "200":
          description: Validation result returned. Both pass and fail can return 200.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                  detail:
                    type: string
                    description: Explanation when valid is false
        "400":
          description: Invalid request parameters and similar errors. Business validation failures use 200 with valid=false.
components:
  schemas:
    BasicInfo:
      description: Basic resource information containing ID and name
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Resource ID
          type: string
        name:
          description: Resource name
          type: string
    ConceptTypeResponse:
      description: Query response structure for object types, relation types, and action types
      required:
        - id
        - name
        - tags
      type: object
      properties:
        id:
          description: Concept ID
          type: string
        name:
          description: Concept name
          type: string
        tags:
          description: Tags
          type: array
          items:
            type: string
        groups:
          description: Owning concept group ID
          type: array
          items:
            type: string
    Object:
      description: JSON object with variable fields
      type: object
    ExpectedImpactOperation:
      description: |
        Expected operation semantics in the contract. It uses the same add, modify, and delete enum as action_intent and action_type.
        impact_contracts[].expected_operation is required; affect.expected_operation must be valid when present.
      type: string
      enum:
        - add
        - modify
        - delete
    ImpactContractItem:
      description: |
        One action impact contract declaration as structured metadata. Its shape matches the runtime JSON and t_action_type.f_impact_contracts serialization. The platform validates completeness against the contract but does not use it for execution orchestration. See the action type design section 7.
      type: object
      properties:
        object_type_id:
          description: Affected object type ID
          type: string
        expected_operation:
          $ref: "#/components/schemas/ExpectedImpactOperation"
        description:
          description: Human-readable explanation, such as risk guidance
          type: string
        affected_fields:
          description: Expected involved data property name list
          type: array
          items:
            type: string
    Affect:
      deprecated: true
      description: |
        Deprecated. Use impact_contracts, an ImpactContractItem array, to declare impact scope. A compatibility single-line impact can still be accepted and converted to a one-item array. See action type design sections 5.9 and 7.5.
      type: object
      properties:
        comment:
          description: Impact description
          type: string
        object_type_id:
          description: Affected object type ID
          type: string
        expected_operation:
          allOf:
            - $ref: "#/components/schemas/ExpectedImpactOperation"
          description: |
            When present, it must be add, modify, or delete, consistent with action_intent.
            When only affect is submitted and the server converts it to impact_contracts, action_type is still used to write expected_operation for the contract item. This field may be omitted.
        affected_fields:
          description: Expected involved data property name list, aligned with impact_contracts[].affected_fields
          type: array
          items:
            type: string
    Schedule:
      description: Execution frequency configuration
      required:
        - time_type
        - frequency
        - expression
        - type
      type: object
      properties:
        type:
          description: Execution type. Supports a fixed frequency (FIX_RATE) or a cron expression (CRON).
          enum:
            - FIX_RATE
            - CRON
          type: string
        expression:
          description: |-
            Execution expression.

            1. Fixed frequency persists execution at a fixed interval. Set frequency=<time_durations> as a number followed by a unit: m for minutes, h for hours, or d for days.
          type: string
    ID:
      description: id
      required:
        - id
      type: object
      properties:
        id:
          description: id
          type: string
    Branch:
      description: Branch information
      required:
        - base_version
        - comment
        - id
        - kn_id
        - name
        - tags
      type: object
      properties:
        id:
          description: Branch ID
          type: string
        name:
          description: Branch name
          type: string
        tags:
          description: Tags
          type: array
          items:
            type: string
        comment:
          description: Comment
          type: string
        base_version:
          description: Source version
          type: string
        kn_id:
          description: Business knowledge network ID
          type: string
    ListActionTypes:
      description: Action type list
      required:
        - entries
        - total_count
      type: object
      properties:
        entries:
          description: Entry list
          type: array
          items:
            $ref: "#/components/schemas/ActionType"
        total_count:
          description: Total count
          type: integer
    ToolSource:
      description: Tool resource
      required:
        - type
        - tool_id
        - box_id
      type: object
      properties:
        type:
          description: Resource type
          enum:
            - tool
          type: string
        box_id:
          description: Toolbox ID
          type: string
        tool_id:
          description: Tool ID
          type: string
    ConceptGroup:
      description: Concept group
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Concept group ID
          type: string
        name:
          description: Concept group name
          type: string
    SimpleObjectType:
      description: ""
      required:
        - id
        - name
        - icon
        - color
      type: object
      properties:
        id:
          description: Object type ID
          type: string
        name:
          description: Object type name
          type: string
        icon:
          description: Object type icon
          type: string
        color:
          description: Object type color
          type: string
        branch:
          description: Owning branch
          type: string
    AffectDetail:
      deprecated: true
      description: |
        Deprecated. A single-line impact is backfilled for list and detail compatibility. Prefer impact_contracts in responses. See action type design section 7.5.
      required:
        - object_type_id
      type: object
      properties:
        comment:
          description: Impact description
          type: string
        object_type_id:
          description: Affected object type ID
          type: string
        expected_operation:
          allOf:
            - $ref: "#/components/schemas/ExpectedImpactOperation"
          description: When present, it must be a valid enum consistent with action_intent and action_type.
        affected_fields:
          description: Expected involved data property name list
          type: array
          items:
            type: string
        object_type:
          $ref: "#/components/schemas/SimpleObjectType"
          description: Object type information
    override:
      oneOf:
        - type: object
        - $ref: "#/components/schemas/ReqActionTypes"
        - $ref: "#/components/schemas/override--get"
      discriminator:
        mapping:
          x-http-method-override:POST: "#/components/schemas/ReqActionTypes"
          x-http-method-override:GET: "#/components/schemas/override--get"
        propertyName: x-http-method-override
      description: POST override for batch creation and action type retrieval
      type: object
    override--get:
      oneOf:
        - $ref: "#/components/schemas/FirstQueryWithCursor"
        - $ref: "#/components/schemas/PageTurnQueryWithCursor"
      description: Action type retrieval request body
      type: object
    Sort:
      description: Sort field. Defaults to descending _score order.
      required:
        - field
        - direction
      type: object
      properties:
        field:
          description: Sort field
          type: string
        direction:
          description: Sort direction
          enum:
            - desc
            - asc
          type: string
    ActionTypeSearchResponse:
      description: Action type retrieval response
      required:
        - type
        - entries
      type: object
      properties:
        entries:
          description: Object instance data
          type: array
          items:
            $ref: "#/components/schemas/ActionTypeDetail"
        total_count:
          description: Total count
          type: integer
        next_cursor:
          description: Opaque continuation cursor. Send it back as cursor for the next page.
          type: string
    Parameter:
      description: Tool parameters
      required:
        - name
        - value_from
      type: object
      properties:
        name:
          description: Parameter name
          type: string
        type:
          description: Parameter type
          type: string
        source:
          description: Parameter source
          type: string
        value_from:
          description: Value source
          enum:
            - property
            - input
            - const
          type: string
        value:
          description: Parameter value. For value_from=property, provide the object type data property name. For value_from=input, omit this field.
          type: string
    ActionTypeDetails:
      description: Action type details
      required:
        - entries
      type: object
      properties:
        entries:
          description: Action type details
          type: array
          items:
            $ref: "#/components/schemas/ActionTypeDetail"
    ReqActionTypes:
      description: Batch creation request body
      required:
        - entries
      type: object
      properties:
        entries:
          description: Action type information
          type: array
          items:
            $ref: "#/components/schemas/ReqActionType"
    FirstQueryWithCursor:
      description: First action type retrieval request
      required:
        - condition
        - limit
      type: object
      properties:
        concept_groups:
          description: Concept group ID array
          type: array
          items:
            type: string
        condition:
          $ref: "#/components/schemas/Condition"
          description: Action type retrieval condition
        sort:
          description: Sort field. Defaults to _score with descending direction.
          type: array
          items:
            $ref: "#/components/schemas/Sort"
        limit:
          description: Returned item count. Defaults to 10 and ranges from 1 to 10000.
          type: integer
        need_total:
          description: Whether total count is required. Defaults to false.
          type: boolean
    PageTurnQueryWithCursor:
      description: Subsequent paginated query request
      required:
        - limit
        - cursor
        - condition
      type: object
      properties:
        concept_groups:
          description: Concept group ID array
          type: array
          items:
            type: string
        condition:
          $ref: "#/components/schemas/Condition"
          description: Filter condition
        sort:
          description: Sort field. Defaults to _score with descending direction.
          type: array
          items:
            $ref: "#/components/schemas/Sort"
        limit:
          description: Returned item count. Defaults to 10 and ranges from 1 to 10000.
          type: integer
        need_total:
          description: Whether total count is required. Defaults to false.
          type: boolean
        cursor:
          description: next_cursor returned by the previous response.
          type: string
    MCPSource:
      description: MCP resource
      required:
        - type
        - mcp_id
        - tool_name
      type: object
      properties:
        type:
          description: Resource type
          enum:
            - mcp
          type: string
        mcp_id:
          description: MCP ID
          type: string
        tool_name:
          description: Tool name
          type: string
    ReqActionType:
      description: Action type creation information
      required:
        - action_type
        - groups
        - kn_id
        - name
        - object_type
        - concept_type
        - branch
        - base_version
        - object_type_id
      type: object
      properties:
        id:
          description: Action type ID
          type: string
        name:
          description: Action type name
          type: string
        tags:
          description: Tags。
          type: array
          items:
            type: string
        comment:
          description: Comment
          type: string
        icon:
          description: Icon
          type: string
        color:
          description: Color
          type: string
        branch:
          description: Branch ID
          type: string
        action_type:
          deprecated: true
          description: |
            Deprecated. Prefer action_intent with add, modify, or delete. Both fields may be present but must agree; when only one is provided, the server can backfill the other.
          enum:
            - add
            - modify
            - delete
          type: string
        action_intent:
          description: |
            Recommended. Uses the same enum as legacy action_type and maps to f_action_intent. See design section 1.3.
          enum:
            - add
            - modify
            - delete
          type: string
        object_type_id:
          description: Object type ID bound to the action type
          type: string
        condition:
          $ref: "#/components/schemas/ActionCondition"
          description: Action condition
        affect:
          deprecated: true
          description: |
            Deprecated. Use impact_contracts. Do not submit it together with affect except for the server-converted single-line affect compatibility case.
          allOf:
            - $ref: "#/components/schemas/Affect"
        impact_contracts:
          description: |
            Impact contract array stored in f_impact_contracts as JSON. Do not mix it with affect.
          type: array
          items:
            $ref: "#/components/schemas/ImpactContractItem"
        action_source:
          oneOf:
            - $ref: "#/components/schemas/ToolSource"
            - $ref: "#/components/schemas/MCPSource"
          description: Resource bound to the action
        parameters:
          description: Action resource parameters
          type: array
          items:
