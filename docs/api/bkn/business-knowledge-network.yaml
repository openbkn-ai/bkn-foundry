---
openapi: 3.0.2
info:
  title: BusinessKnowledgeNetwork
  version: 0.1.0
paths:
  /api/bkn-backend/v1/knowledge-networks:
    get:
      parameters:
        - name: name_pattern
          description: Fuzzy match by business knowledge network name. Defaults to empty.
          schema:
            type: string
          in: query
        - name: sort
          description: Sort type. Defaults to update_time.
          schema:
            enum:
              - update_time
              - name
            type: string
          in: query
        - name: direction
          description: |-
            Sort direction. Supported values are asc and desc.
            Defaults to desc.
          schema:
            enum:
              - asc
              - desc
            type: string
          in: query
        - name: offset
          description: "Offset of the first returned item. Must be greater than or equal to 0. Defaults to 0."
          schema:
            format: int64
            type: integer
          in: query
        - name: limit
          description: |-
            Maximum number of items returned per page.
            Pagination accepts 1 through 1000, and -1 disables pagination.
            Defaults to 10.
          schema:
            format: int64
            type: integer
          in: query
        - name: tag
          description: Exact match by tag. Defaults to empty.
          schema:
            type: string
          in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListKN"
          description: ok
      summary: List business knowledge networks
    post:
      parameters:
        - name: import_mode
          description: Import mode. Supported values are normal, ignore, and overwrite. Defaults to normal.
          schema:
            enum:
              - normal
              - ignore
              - overwrite
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true. When true, validates dependencies such as object type and relation type views. When false, missing dependencies do not cause an error.
          schema:
            type: boolean
            default: true
          in: query
        - name: validate_dependency
          deprecated: true
          description: "Deprecated. Use strict_mode instead. This parameter is retained for compatibility and is read when strict_mode is empty."
          schema:
            type: boolean
            default: true
          in: query
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReqKnowledgeNetwork"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ID"
              example:
                id: "example-knowledge-network-id"
          description: Creation succeeded
      summary: Create a business knowledge network
  /api/bkn-backend/v1/knowledge-networks/{kn_id}:
    get:
      parameters:
        - name: mode
          description: Query mode. Currently supports export. By default, returns only knowledge network details and not included child types.
          schema:
            enum:
              - ""
              - export
            type: string
          in: query
        - name: include_statistics
          description: Whether to include statistics for concepts under the business knowledge network. Defaults to false.
          schema:
            type: boolean
          in: query
          required: false
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
        - name: detail_level
          description: |
            Response detail level. full returns complete definitions; summary returns only concept IDs and names
            for progressive loading of large knowledge networks. Defaults to full.
          schema:
            type: string
            enum: [full, summary]
            default: full
          in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeNetworkDetail"
              examples:
                contain detail:
                  value:
                    id: kn_system_incident_event_network
                    name: DIP系统故障事件网络
                    tags:
                      - 事件
                      - 故障
                    comment: DIP系统故障事件网络。。。。。。。。。。。。
                    icon: ""
                    color: ""
                    branch: main
                    creator: a0f02238-6cec-11f0-82bb-fa1c4529a151
                    create_time: 1757583140948
                    updater: a0f02238-6cec-11f0-82bb-fa1c4529a151
                    update_time: 1757583140948
                    detail: markdown文本
                not_contain_detail:
                  value:
                    id: kn_system_incident_event_network
                    name: DIP系统故障事件网络
                    tags:
                      - 事件
                      - 故障
                    comment: DIP系统故障事件网络。。。。。。。。。。。。
                    icon: ""
                    color: ""
                    branch: main
                    creator: a0f02238-6cec-11f0-82bb-fa1c4529a151
                    create_time: 1757583140948
                    updater: a0f02238-6cec-11f0-82bb-fa1c4529a151
                    update_time: 1757583140948
          description: ok
      summary: Get business knowledge network details
      description: Gets ontology model details and includes specification content when requested.
    put:
      parameters:
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true. When true, validates dependencies for nested object types, relation types, action types, and concept groups in the request. When false, skips validation.
          schema:
            type: boolean
            default: true
          in: query
        - name: import_mode
          description: |
            Import mode. normal reports an error for duplicate concept names; overwrite replaces them;
            ignore skips them. Defaults to normal.
          schema:
            type: string
            enum: [normal, overwrite, ignore]
            default: normal
          in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgeNetwork"
        required: true
      responses:
        "204":
          description: Update succeeded
      summary: Update a business knowledge network
    delete:
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      responses:
        "204":
          description: Deletion succeeded
      summary: Delete a business knowledge network
      description: Deletes a business knowledge network and all of its object types, relation types, action types, and concept groups.
    parameters:
      - name: kn_id
        description: Business knowledge network ID
        schema:
          type: string
        in: path
        required: true
  /api/bkn-backend/in/v1/trace/projection/knowledge-networks/{kn_id}:
    get:
      summary: Export one knowledge network for a sealed Trace projection
      description: |
        Internal Trace-only capability. The caller supplies a signed Ed25519
        ProjectionReadGrant in X-BKN-Projection-Grant; it is not a user bearer
        token. BKN verifies issuer, audience, key ID, expiry, signature and that
        the exact path kn_id is in the grant. It never resolves user identity,
        tenant, business domain, a list, or a reverse lookup. A missing, invalid,
        expired, or non-matching grant returns 404.
      parameters:
        - name: kn_id
          description: The single knowledge network explicitly authorized by the grant.
          schema:
            type: string
          in: path
          required: true
        - name: X-BKN-Projection-Grant
          description: Signed ProjectionReadGrant. Do not send an Authorization bearer token.
          schema:
            type: string
          in: header
          required: true
      responses:
        "200":
          description: Current export of the authorized knowledge network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeNetworkDetail"
        "404":
          description: Projection reads are disabled, the grant is invalid or does not authorize this network, or the network does not exist.
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/validation:
    post:
      summary: Validate a business knowledge network
      description: |
        Validates only knowledge network dependency existence and does not persist data. It validates all dependencies including object types, relation types, action types, and concept groups.
        The server builds one BatchIDIndex from the four top-level request buckets and nested concept_groups buckets, allowing references to types present only in nested groups.

        Response: HTTP 200 indicates processing completed. valid=true means validation passed; valid=false means validation failed or an error occurred, with detail explaining the cause. Invalid bodies, invalid strict_mode, missing knowledge networks, and authorization failures return non-2xx responses.

        Internal API: the corresponding internal path uses the same request and response contract, resolves the caller from headers, and does not use OAuth.
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: import_mode
          description: Matches creation semantics. When neither import_mode nor mode is provided, uses normal. It validates persisted ID and name conflicts with normal, ignore, and overwrite semantics.
          schema:
            type: string
            enum: [normal, ignore, overwrite]
            default: normal
          in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateKNRequestBody"
      responses:
        "200":
          description: Validation result returned. Both pass and fail can return 200.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                    description: true means validation passed. false means validation failed or an error occurred while processing validation.
                  detail:
                    type: string
                    description: Explanation when valid is false
        "400":
          description: Invalid request parameters, such as an invalid body, unparseable strict_mode, or invalid import_mode or mode. This is not a business validation result.
components:
  schemas:
    ValidateKNRequestBody:
      type: object
      description: Knowledge network structure including child concepts such as object_types, relation_types, action_types, and concept_groups
      properties:
        object_types:
          type: array
        relation_types:
          type: array
        action_types:
          type: array
        concept_groups:
          type: array
    BasicInfo:
      description: Basic resource information containing ID and name
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Resource ID
          type: string
        name:
          description: Resource name
          type: string
    ConceptCondition:
      description: Concept query condition. Filterable fields include type name, property name, and description.
      required:
        - operation
      type: object
      properties:
        field:
          description: Field name
          enum:
            - id
            - name
            - property_name
            - property_display_name
            - comment
            - "*"
          type: string
        operation:
          description: |-
            Operators.

            knn: Vector filter without vectorizing the original text. The value is an array whose first item is the filter content and whose second item is the number of neighbors to return.

            knn_vector: Vector filter for already-vectorized text. The value is an array whose first item is the vector and whose second item is the number of neighbors to return.
          enum:
            - and
            - or
            - ==
            - "!="
            - in
            - not_in
            - like
            - not_like
            - regex
            - match
            - match_phrase
            - knn
            - knn_vector
          type: string
        sub_conditions:
          description: Nested filter conditions
          type: array
          items:
            $ref: "#/components/schemas/ConceptCondition"
        value:
          description: Field value
        value_from:
          description: Field value source. Currently supports const only.
          enum:
            - const
          type: string
    ConceptTypeQueryBody:
      description: Query request body for object types, relation types, and action types
      required:
        - condition
      type: object
      properties:
        concept_groups:
          description: Optional concept group ID array
          type: array
          items:
            type: string
        concept_type:
          description: Optional concept type. Selects object types, relation types, or action types; empty queries all.
          enum:
            - object_type
            - relation_type
            - action_type
          type: string
        condition:
          $ref: "#/components/schemas/ConceptCondition"
          description: Filter condition
    ConceptTypeResponse:
      description: Query response structure for object types, relation types, and action types
      required:
        - id
        - name
        - tags
      type: object
      properties:
        id:
          description: Concept ID
          type: string
        name:
          description: Concept name
          type: string
        tags:
          description: Tags
          type: array
          items:
            type: string
        groups:
          description: Owning concept group ID
          type: array
          items:
            type: string
    Path:
      description: Path
      required:
        - nodes
        - edges
        - length
      type: object
      properties:
        nodes:
          description: Ordered node list in the path
          type: array
          items:
            $ref: "#/components/schemas/ObjectTypeDetail"
        edges:
          description: Ordered edge list in the path
          type: array
          items:
            $ref: "#/components/schemas/RelationTypeDetail"
        length:
          description: Path length, measured by edge count
          type: integer
    ConceptGroup:
      description: Concept group
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Concept groupID
          type: string
        name:
          description: Concept group name
          type: string
    DataSource:
      description: Data source
      required:
        - type
        - id
      type: object
      properties:
        type:
          description: Data source type
          enum:
            - resource
          type: string
        id:
          description: Data sourceID
          type: string
        name:
          description: Name. Returned when viewing details.
          type: string
    DataProperty:
      description: Data properties
      required:
        - name
        - display_name
        - type
        - comment
        - mapped_field
        - index
        - fulltext_config
        - vector_config
      type: object
      properties:
        name:
          description: Property name. May contain lowercase letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        display_name:
          description: Property display name
          type: string
        type:
          description: Property data type. In addition to view field types, supports metric, objective, event, trace, log, and operator.
          type: string
        comment:
          description: Property description
          type: string
        mapped_field:
          description: Field name mapped to the data source
          type: string
        index:
          description: Whether indexing is enabled. Defaults to true.
          type: boolean
        fulltext_config:
          $ref: "#/components/schemas/FulltextConfig"
          description: Full-text index configuration
        vector_config:
          $ref: "#/components/schemas/VectorConfig"
          description: Vector index configuration
    FulltextConfig:
      description: Full-text index configuration
      required:
        - analyzer
        - field_keyword
      type: object
      properties:
        analyzer:
          description: Analyzer
          enum:
            - standard
            - ik_max_word
          type: string
        field_keyword:
          description: Whether to retain the original string for exact matching. Defaults to false.
          type: boolean
    VectorConfig:
      description: Vector index configuration
      required:
        - dimension
      type: object
      properties:
        dimension:
          description: Vector dimension
          type: integer
    LogicProperty:
      description: Logic properties
      required:
        - name
        - data_source
        - parameters
      type: object
      properties:
        name:
          description: Property name. May contain lowercase letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        display_name:
          description: Property display name
          type: string
        type:
          description: Property data type. In addition to view field types, supports metric, objective, event, trace, log, and operator.
          type: string
        comment:
          description: Property description
          type: string
        index:
          description: Whether indexing is enabled. Defaults to true.
          type: boolean
        data_source:
          $ref: "#/components/schemas/DataSource"
          description: Logic source
        parameters:
          description: Parameters required by the logic
          type: array
          items:
            $ref: "#/components/schemas/Parameter"
    Object:
      description: JSON object with variable fields
      type: object
    Parameter:
      description: Logic parameters
      required:
        - name
        - value_from
      type: object
      properties:
        name:
          description: Parameter name
          type: string
        value_from:
          description: Value source
          enum:
            - property
            - input
          type: string
        value:
          description: Parameter value. For value_from=property, provide the object type data property name. For value_from=input, omit this field.
          type: string
    FilteredCrossJoinMappingRule:
      description: |
        Matching rules for filtered_cross_join (FCJ). It does not use data views or key mappings.
        source_condition and target_condition are optional instance filters with the same structure as object instance query Condition.
        Either side may be omitted, or mapping_rules can be an empty object when neither side has extra filters.
      type: object
      properties:
        source_condition:
          description: Source-side instance filter. Omit it for no source-side constraint.
          type: object
        target_condition:
          description: Target-side instance filter. Omit it for no target-side constraint.
          type: object
    ActionCondition:
      description: Action condition
      type: object
      properties:
        object_type_id:
          description: Object type ID. Include it when filtering multiple object types; otherwise any matching property name can be filtered.
          type: string
        field:
          description: Field name, which is the object type property name
          type: string
        operation:
          description: Operator
          enum:
            - and
            - or
            - ==
            - "!="
            - ">"
            - ">="
            - <
            - <=
            - in
            - not_in
            - range
            - out_range
            - exist
            - not_exist
          type: string
        sub_conditions:
          description: Nested filter conditions
          type: array
          items:
            $ref: "#/components/schemas/ActionCondition"
        value:
          description: Field value
        value_from:
          description: Field value source. Currently supports const only.
          enum:
            - const
          type: string
    ExpectedImpactOperation:
      description: Consistent with action_intent and action_type. impact_contracts[].expected_operation is required; affect.expected_operation must be valid when present.
      type: string
      enum:
        - add
        - modify
        - delete
    ImpactContractItem:
      description: |
        One action impact contract item, consistent with action-type.yaml and f_impact_contracts. See design section 7.
      type: object
      properties:
        object_type_id:
          type: string
        expected_operation:
          $ref: "#/components/schemas/ExpectedImpactOperation"
        description:
          type: string
        affected_fields:
          type: array
          items:
            type: string
    Affect:
      deprecated: true
      description: |
        Deprecated. Use impact_contracts instead. See design section 5.9.
      required:
        - comment
      type: object
      properties:
        object_type:
          description: Affected object type ID
          type: string
        comment:
          description: Impact description
          type: string
        expected_operation:
          allOf:
            - $ref: "#/components/schemas/ExpectedImpactOperation"
          description: When present, must be add, modify, or delete, consistent with action_intent. May be omitted.
        affected_fields:
          description: Expected involved data property name list
          type: array
          items:
            type: string
    Schedule:
      description: Execution frequency configuration
      required:
        - time_type
        - frequency
        - expression
        - type
      type: object
      properties:
        type:
          description: Execution type. Supports a fixed frequency (FIX_RATE) or a cron expression (CRON).
          enum:
            - FIX_RATE
            - CRON
          type: string
        expression:
          description: |-
            Execution expression.

            1. Fixed frequency persists execution at a fixed interval. Set frequency=<time_durations> as a number followed by a unit: m for minutes, h for hours, or d for days.
          type: string
    RelationPathReqeustBody:
      description: Path query request body
      required:
        - start_object_type
        - end_object_type
        - path_max_length
        - direction
        - source_object_type
      type: object
      properties:
        concept_groups:
          description: Concept groupid
          type: array
          items:
            type: string
        source_object_type:
          description: Source object type ID
          type: string
        target_object_type:
          description: Target object type ID. When present, finds paths between the source and target types. When empty, finds all nodes connected from the source type within the path length.
          type: string
        path_max_length:
          description: "Maximum path length, not greater than 5."
          type: integer
        direction:
          description: "Direction: forward, reverse, or bidirectional"
          enum:
            - forward
            - reverse
            - bidirectional
          type: string
        path_select_policy:
          description: Path selection strategy. Defines a condition or rule for choosing paths when multiple paths exist. When omitted, returns all relations. Strategy support is future work.
          type: string
    ID:
      description: id
      required:
        - id
      type: object
      properties:
        id:
          description: id
          type: string
    ReqBranch:
      description: Branch creation information
      required:
        - name
        - base_version
      type: object
      properties:
        id:
          description: Branch ID. Immutable after creation. May contain lowercase letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        name:
          description: Branch name. Immutable after creation. May contain lowercase letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        tags:
          description: Tags used for business identification
          type: array
          items:
            type: string
        comment:
          description: Comment
          type: string
        base_version:
          description: Source version
          type: string
    UpdateBranch:
      description: Branch update information. Only tags and comment can be modified.
      type: object
      properties:
        tags:
          description: Tags used for business identification
          type: array
          items:
            type: string
        comment:
          description: Comment
          type: string
    Branch:
      description: Branch information
      required:
        - base_version
        - comment
        - id
        - kn_id
        - name
        - tags
      type: object
      properties:
        id:
          description: Branch ID
          type: string
        name:
          description: Branch name
          type: string
        tags:
          description: Tags
          type: array
          items:
            type: string
        comment:
          description: Comment
          type: string
        base_version:
          description: Source version
          type: string
        kn_id:
          description: Business knowledge network ID
          type: string
    ReqConceptGroup:
      description: Concept group creation information
      required:
        - name
        - branch
        - base_version
      type: object
      properties:
        id:
          description: ID. Immutable after creation. May contain lowercase letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        name:
          description: Name.
          type: string
        tags:
          description: Tags used for business identification
          type: array
          items:
            type: string
        comment:
          description: Comment
          type: string
        branch:
          description: Branch ID
          type: string
        base_version:
          description: Source version
          type: string
        object_type_ids:
          description: Object type list included in the concept group
          type: array
          items:
            type: string
        relation_type_ids:
          description: Relation type list included in the concept group
          type: array
          items:
            type: string
        action_type_ids:
          description: Action type list included in the concept group
          type: array
          items:
            type: string
    UpdateConceptGroup:
      description: Concept group update information
      required:
        - base_version
        - branch
      type: object
      properties:
        name:
          description: Name.
          type: string
        tags:
          description: Tags used for business identification
          type: array
          items:
            type: string
        comment:
          description: Comment
          type: string
        branch:
          description: Branch ID
          type: string
        base_version:
          description: Source version
          type: string
        object_type_ids:
          description: Object type list included in the concept group
          type: array
          items:
            type: string
        relation_type_ids:
          description: Relation type list included in the concept group
          type: array
          items:
            type: string
        action_type_ids:
          description: Action type list included in the concept group
          type: array
          items:
            type: string
    ListBranches:
      description: Branch list
      required:
        - entries
        - total_count
      type: object
      properties:
        entries:
          description: Entry list
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        total_count:
          description: Total count
          type: integer
    ListObjectTypes:
      description: Object type list
      required:
        - entries
        - total_count
      type: object
      properties:
        entries:
          description: Entry list
          type: array
          items:
            $ref: "#/components/schemas/ObjectTypeDetail"
        total_count:
          description: Total count
          type: integer
    ListRelationTypes:
      description: Relation type list
      required:
        - entries
        - total_count
      type: object
      properties:
        entries:
          description: Entry list
          type: array
          items:
            $ref: "#/components/schemas/RelationTypeDetail"
        total_count:
          description: Total count
          type: integer
    ListActionTypes:
      description: Action type list
      required:
        - entries
        - total_count
      type: object
      properties:
        entries:
          description: Entry list
          type: array
          items:
            $ref: "#/components/schemas/ActionTypeDetail"
        total_count:
          description: Total count
          type: integer
