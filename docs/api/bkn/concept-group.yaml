---
openapi: 3.0.2
info:
  title: ConceptGroup
  version: 0.1.0
  description: |
    Concept groups use `concept_group:{kn_id}/{group_id}`. Reads and lists
    require `view_detail`; updates use `modify`; deletion uses `delete`.
    Lists are filtered before total and pagination. See
    `../knowledge-network-authorization.md`.
security:
  - OAuth2: []
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/concept-groups/{group_id}:
    get:
      parameters:
        - name: kn_id
          in: path
          required: true
        - name: group_id
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: include_statistics
          description: Whether to calculate and return statistics. Defaults to false.
          schema:
            type: boolean
            default: false
          in: query
        - name: mode
          description: Response view mode. Returns the default view when empty.
          schema:
            type: string
          in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptGroupDetail"
          description: ok
      summary: Get concept group details
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConceptGroup"
        required: true
      parameters:
        - name: kn_id
          in: path
          required: true
        - name: group_id
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true. When true, validates object type references and other dependencies declared in the concept group. When false, skips this validation.
          schema:
            type: boolean
            default: true
          in: query
      responses:
        "204":
          description: ok
      summary: Update a concept group
    delete:
      parameters:
        - name: kn_id
          in: path
          required: true
        - name: group_id
          in: path
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      responses:
        "204":
          description: ok
      summary: Delete one concept group
    parameters:
      - name: kn_id
        in: path
        required: true
      - name: group_id
        in: path
        required: true
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/concept-groups:
    get:
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: name_pattern
          description: Fuzzy match by name. Defaults to empty.
          schema:
            type: string
          in: query
        - name: sort
          description: Sort type. Defaults to update_time.
          schema:
            enum:
              - update_time
              - name
            type: string
          in: query
        - name: direction
          description: |-
            Sort direction. Supported values are asc and desc.
            Defaults to desc.
          schema:
            enum:
              - asc
              - desc
            type: string
          in: query
        - name: offset
          description: "Offset of the first returned item. Must be greater than or equal to 0. Defaults to 0."
          schema:
            format: int64
            type: integer
          in: query
        - name: limit
          description: |-
            Maximum number of items returned per page.
            Pagination accepts 1 through 1000, and -1 disables pagination.
            Defaults to 10.
          schema:
            format: int64
            type: integer
          in: query
        - name: tag
          description: Exact match by tag. Defaults to empty.
          schema:
            type: string
          in: query
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConceptGroups"
          description: ok
      summary: List concept groups
    post:
      parameters:
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: import_mode
          description: Import mode. Supported values are normal, ignore, and overwrite. Defaults to normal.
          schema:
            enum:
              - normal
              - ignore
              - overwrite
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true. When true, validates dependencies such as object type and relation type views. When false, missing dependencies do not cause an error.
          schema:
            type: boolean
            default: true
          in: query
        - name: validate_dependency
          deprecated: true
          description: "Deprecated. Use strict_mode instead. This parameter is retained for compatibility and is read when strict_mode is empty."
          schema:
            type: boolean
            default: true
          in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReqConceptGroup"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ID"
          description: Creation or import succeeded
      summary: Create a concept group
      description: Create a concept group
    parameters:
      - name: kn_id
        description: Business knowledge network ID
        schema:
          type: string
        in: path
        required: true
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/concept-groups/{group_id}/object-types:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddObjectTypeToGroup"
        required: true
      parameters:
        - name: kn_id
          in: path
          required: true
        - name: group_id
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true. When true, validates that object type IDs exist. When false, missing object types do not cause an error.
          schema:
            type: boolean
            default: true
          in: query
      responses:
        "201":
          description: Addition succeeded
      summary: Add an object type
    parameters:
      - name: kn_id
        in: path
        required: true
      - name: group_id
        in: path
        required: true
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/concept-groups/{group_id}/object-types/{ot_ids}:
    delete:
      parameters:
        - name: kn_id
          in: path
          required: true
        - name: group_id
          in: path
          required: true
        - name: ot_ids
          in: path
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      responses:
        "204":
          description: Removal succeeded
      summary: Remove an object type
    parameters:
      - name: kn_id
        in: path
        required: true
      - name: group_id
        in: path
        required: true
      - name: ot_ids
        in: path
        required: true
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/concept-groups/validation:
    post:
      summary: Validate concept groups
      description: |
        Validates only concept group dependency existence and does not persist data. It validates nested object types, relation types, action types, and their dependencies.
        Concept IDs in the same batch are collected from the requested concept_groups tree, including nested buckets, so strict mode can resolve references that have not yet been persisted.

        Response: HTTP 200 with valid and detail uses the same semantics as knowledge network validation. Parameter and authentication errors are non-2xx.

        Internal API: the corresponding internal path has the same semantics, resolves the caller from headers, and does not use OAuth.
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: import_mode
          description: Matches the concept group creation API and validates conflicts with persisted concept group IDs or names using normal, ignore, or overwrite.
          schema:
            type: string
            enum: [normal, ignore, overwrite]
            default: normal
          in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  description: Concept groups to validate. Uses the same structure as the creation API.
                  items:
                    type: object
      responses:
        "200":
          description: Validation result returned. Both pass and fail can return 200.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                  detail:
                    type: string
                    description: Explanation when valid is false
        "400":
          description: Invalid request parameters and similar errors. Business validation failures use 200 with valid=false.
components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
  schemas:
    ReqConceptGroup:
      description: Concept group information
      required:
        - name
        - branch
      type: object
      properties:
        id:
          description: ID. Immutable after creation. May contain lowercase letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        name:
          description: Name
          type: string
        tags:
          description: Tags used for business identification
          type: array
          items:
            type: string
        comment:
          description: Comment
          type: string
        icon:
          description: Icon
          type: string
        color:
          description: Color
          type: string
        branch:
          description: Branch ID
          type: string
    ID:
      description: id
      required:
        - id
      type: object
      properties:
        id:
          description: id
          type: string
    ListConceptGroups:
      description: Concept group list
      required:
        - entries
        - total_count
      type: object
      properties:
        entries:
          description: Entry list
          type: array
          items:
            $ref: "#/components/schemas/ConceptGroup"
        total_count:
          description: Total count
          type: integer
    ConceptGroup:
      description: Concept group for list views
      required:
        - branch
        - color
        - comment
        - create_time
        - creator
        - icon
        - id
        - name
        - tags
        - update_time
        - updater
      type: object
      properties:
        id:
          description: ID
          type: string
        name:
          description: Name
          type: string
        tags:
          description: Tags. May be empty.
          type: array
          items:
            type: string
        comment:
          description: Comment. May be empty.
          type: string
        icon:
          description: Icon
          type: string
        color:
          description: Color
          type: string
        branch:
          description: Branch ID
          type: string
        statistics:
          $ref: "#/components/schemas/Statistics"
          description: Concept statistics
        creator:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        create_time:
          format: int64
          description: Creation time
          type: integer
        updater:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        update_time:
          format: int64
          description: Most recent update time
          type: integer
        kn_id:
          description: Owning knowledge network ID
          type: string
        object_type_ids:
          description: Object type ID list included in this concept group
          type: array
          items:
            type: string
        module_type:
          description: Module type of the concept
          type: string
        operations:
          description: Operations allowed for the current accessor on this concept group.
          type: array
          items:
            type: string
    Statistics:
      description: Concept statistics
      required:
        - action_types_total
        - object_types_total
        - relation_types_total
      type: object
      properties:
        object_types_total:
          description: Object type count
          type: integer
        relation_types_total:
          description: Relation type count
          type: integer
        action_types_total:
          description: Action type count
          type: integer
        concept_groups_total:
          description: Concept group count
          type: integer
        risk_types_total:
          description: Risk type count
          type: integer
        metrics_total:
          description: Metric count
          type: integer
    DataSource:
      description: Resource source
      required:
        - type
        - id
      type: object
      properties:
        type:
          description: Data source type
          enum:
            - resource
          type: string
        id:
          description: Data source ID
          type: string
        name:
          description: Name. Returned when viewing details.
          type: string
    ExpectedImpactOperation:
      description: Consistent with action_intent and action_type.
      type: string
      enum:
        - add
        - modify
        - delete
    ImpactContractItem:
      description: One action impact contract item, consistent with action-type.yaml and f_impact_contracts.
      type: object
      properties:
        object_type_id:
          type: string
        expected_operation:
          $ref: "#/components/schemas/ExpectedImpactOperation"
        description:
          type: string
        affected_fields:
          type: array
          items:
            type: string
    ActionTypeDetail:
      description: Action type
      required:
        - action_source
        - action_type
        - affect
        - branch
        - color
        - comment
        - create_time
        - creator
        - icon
        - id
        - kn_id
        - module_type
        - name
        - object_type_id
        - parameters
        - schedule
        - tags
        - update_time
        - updater
      type: object
      properties:
        id:
          description: Action typeID
          type: string
        name:
          description: Action type name
          type: string
        tags:
          description: Tags. May be empty.
          type: array
          items:
            type: string
        comment:
          description: Comment. May be empty.
          type: string
        icon:
          description: Icon
          type: string
        color:
          description: Color
          type: string
        branch:
          description: Branch ID
          type: string
        kn_id:
          description: Business knowledge network ID
          type: string
        action_type:
          deprecated: true
          description: "Deprecated. Equivalent to action_intent with add, modify, or delete."
          enum:
            - add
            - modify
            - delete
          type: string
        action_intent:
          description: Preferred field consistent with ActionType.action_type backfill.
          enum:
            - add
            - modify
            - delete
          type: string
        object_type_id:
          description: Object type ID bound to the action type
          type: string
        object_type:
          $ref: "#/components/schemas/SimpleObjectType"
          description: Object type bound to the action type.
        condition:
          $ref: "#/components/schemas/ActionCondition"
          description: Action condition
        affect:
          deprecated: true
          description: "Deprecated. Single-line impact; use impact_contracts for equivalent information."
          allOf:
            - $ref: "#/components/schemas/AffectDetail"
        impact_contracts:
          type: array
          items:
            $ref: "#/components/schemas/ImpactContractItem"
        action_source:
          $ref: "#/components/schemas/ToolSource"
          description: Resource bound to the action
        parameters:
          description: Action resource parameters
          type: array
          items:
            $ref: "#/components/schemas/Parameter"
        schedule:
          $ref: "#/components/schemas/Schedule"
          description: Action listener parameter configuration
        creator:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        create_time:
          format: int64
          description: Creation time
          type: integer
        updater:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        update_time:
          format: int64
          description: Most recent update time
          type: integer
        module_type:
          description: Module type
          enum:
            - action_type
          type: string
    ToolSource:
      description: Data source
      required:
        - type
        - tool_id
        - box_id
      type: object
      properties:
        type:
          description: Resource type
          enum:
            - tool
          type: string
        box_id:
          description: Toolbox ID
          type: string
        tool_id:
          description: Tool ID
          type: string
    AffectDetail:
      deprecated: true
      description: |
        Deprecated. Use impact_contracts.
      required:
        - comment
        - object_type_id
      type: object
      properties:
        comment:
          description: Impact description
          type: string
        object_type_id:
          description: Affected object type ID
          type: string
        object_type:
          $ref: "#/components/schemas/SimpleObjectType"
          description: Object type information
    SimpleObjectType:
      description: ""
      required:
        - id
        - name
        - icon
        - color
      type: object
      properties:
        id:
          description: Object type ID
          type: string
        name:
          description: Object type name
          type: string
        icon:
          description: Object type icon
          type: string
        color:
          description: Object type color
          type: string
    ActionCondition:
      description: Action condition
      type: object
      properties:
        object_type_id:
          description: Object type ID. Include it when filtering multiple object types; otherwise any matching property name can be filtered.
          type: string
        field:
          description: Field name, which is the object type property name
          type: string
        operation:
          description: Operator
          enum:
            - and
            - or
            - ==
            - "!="
            - ">"
            - ">="
            - <
            - <=
            - in
            - not_in
            - range
            - out_range
            - exist
            - not_exist
          type: string
        sub_conditions:
          description: Nested filter conditions
          type: array
          items:
            $ref: "#/components/schemas/ActionCondition"
        value:
          description: Field value
        value_from:
          description: Field value source. Currently supports const only.
          enum:
            - const
          type: string
    Parameter:
      description: Tool parameters
      required:
        - name
        - value_from
      type: object
      properties:
        name:
          description: Parameter name
          type: string
        type:
          description: Parameter type
          type: string
        source:
          description: Parameter source
          type: string
        value_from:
          description: Value source
          enum:
            - property
            - input
            - const
          type: string
        value:
          description: Parameter value. For value_from=property, provide the object type data property name. For value_from=input, omit this field.
          type: string
    Schedule:
      description: Execution frequency configuration
      required:
        - expression
        - type
      type: object
      properties:
        type:
          description: Execution type. Supports a fixed frequency (FIX_RATE) or a cron expression (CRON).
          enum:
            - FIX_RATE
            - CRON
          type: string
        expression:
          description: |-
            Execution expression.

            1. Fixed frequency persists execution at a fixed interval. Set frequency=<time_durations> as a number followed by a unit: m for minutes, h for hours, or d for days.
          type: string
    ObjectTypeDetail:
      description: Node (object type) information
      required:
        - branch
        - color
        - comment
        - create_time
        - creator
        - data_properties
        - data_source
        - display_key
        - icon
        - id
        - kn_id
        - module_type
        - name
        - primary_keys
        - tags
        - update_time
        - updater
      type: object
      properties:
        id:
          description: Object type ID
          type: string
        name:
          description: Object type name
          type: string
        tags:
          description: Tags. May be empty.
          type: array
          items:
            type: string
        comment:
          description: Comment. May be empty.
          type: string
        icon:
          description: Icon
          type: string
        color:
          description: Color
          type: string
        branch:
          description: Branch ID
          type: string
        kn_id:
          description: Business knowledge network ID
          type: string
        concept_groups:
          description: Concept group ID
          type: array
          items:
            $ref: "#/components/schemas/SimpleConceptGroup"
        data_source:
          $ref: "#/components/schemas/DataSource"
          description: Data source
        data_properties:
          description: Data properties
          type: array
          items:
            $ref: "#/components/schemas/DataProperty"
        logic_properties:
          description: Logic properties
          type: array
          items:
            $ref: "#/components/schemas/LogicProperty"
        primary_keys:
          description: Primary keys
          type: array
          items:
            type: string
        display_key:
          description: Display property for object instances
          type: string
        creator:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        create_time:
          format: int64
          description: Creation time
          type: integer
        updater:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        update_time:
          format: int64
          description: Most recent update time
          type: integer
        module_type:
          description: Module type
          enum:
            - object_type
          type: string
        incremental_key:
          description: Property name used for incremental synchronization
          type: string
        status:
          description: Object type index status aggregated from Vega index information
          type: object
          properties:
            incremental_key:
              description: Property name used for incremental synchronization
              type: string
            incremental_value:
              description: Position value reached by the most recent incremental synchronization
              type: string
            index:
              description: Associated index name
              type: string
            index_available:
              description: Whether the index is available
              type: boolean
            doc_count:
              description: Document count in the index
              type: integer
              format: int64
            storage_size:
              description: Storage bytes used by the index
              type: integer
              format: int64
            update_time:
              description: Index status update time
              type: integer
              format: int64
    DataProperty:
      description: Data properties
      required:
        - name
        - display_name
        - type
      type: object
      properties:
        name:
          description: Property name. May contain lowercase letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        display_name:
          description: Property display name
          type: string
        type:
          description: Property data type. In addition to view field types, supports metric, objective, event, trace, log, and operator.
          type: string
        comment:
          description: Property description
          type: string
        mapped_field:
          $ref: "#/components/schemas/ViewField"
          description: Field name mapped to the data source
        condition_operations:
          description: "Filter operations supported by string properties. String types are string and text."
          type: array
          items:
            type: string
    FulltextConfig:
      description: Full-text index configuration
      required:
        - analyzer
        - enabled
      type: object
      properties:
        analyzer:
          description: Analyzer
          enum:
            - standard
            - ik_max_word
          type: string
        enabled:
          description: Whether enabled
          type: boolean
      example:
        analyzer: standard
        enabled: true
    KeywordConfig:
      title: Root Type for KeywordConfig
      description: Keyword search configuration
      type: object
      properties:
        enabled:
          description: Whether enabled
          type: boolean
        ignore_above_len:
          format: int32
          description: Maximum length of ignored data
          type: integer
      example:
        enabled: true
        ignore_above_len: 52
    VectorConfig:
      description: Vector index configuration
      required:
        - enabled
      type: object
      properties:
        enabled:
          description: Whether enabled
          type: boolean
        model_id:
          description: Vector model ID
          type: string
      example:
        enabled: true
        model_id: some text
    ViewField:
      description: View field information
      required:
        - name
      type: object
      properties:
        name:
          description: Field name
          type: string
        display_name:
          description: Field display name. Returned when viewing details.
          type: string
        type:
          description: View field type. Returned when viewing details.
          type: string
    LogicProperty:
      description: Logic properties
      required:
        - name
        - data_source
        - parameters
      type: object
      properties:
        name:
          description: Property name. May contain lowercase letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        display_name:
          description: Property display name
          type: string
        type:
          description: Property data type. In addition to view field types, supports metric, objective, event, trace, log, and operator.
          type: string
        comment:
          description: Property description
          type: string
        index:
          description: Whether indexing is enabled. Defaults to true.
          type: boolean
        data_source:
          $ref: "#/components/schemas/LogicSource"
          description: Logic source
        parameters:
          description: Parameters required by the logic
          type: array
          items:
            $ref: "#/components/schemas/Parameter"
    LogicSource:
      description: Data source
      required:
        - type
        - id
      type: object
      properties:
        type:
          description: Data source type
          enum:
            - metric
            - operator
          type: string
        id:
          description: Data source ID
          type: string
        name:
          description: Name. Returned when viewing details.
          type: string
    RelationTypeDetail:
      description: Relation type
      required:
        - branch
        - color
        - comment
        - create_time
        - creator
        - icon
        - id
        - kn_id
        - mapping_rules
        - name
        - source_object_type_id
        - tags
        - target_object_type_id
        - type
        - update_time
        - updater
      type: object
      properties:
        id:
          description: Relation typeID
          type: string
        name:
          description: Relation type name
          type: string
        tags:
          description: Tags. May be empty.
          type: array
          items:
            type: string
        comment:
          description: Comment. May be empty.
          type: string
        icon:
          description: Icon
          type: string
        color:
          description: Color
          type: string
        branch:
          description: Branch ID
          type: string
        kn_id:
          description: Business knowledge network ID
          type: string
        source_object_type_id:
          description: Source object type ID
          type: string
        source_object_type:
          $ref: "#/components/schemas/SimpleObjectType"
          description: Source object type. Returned when viewing details.
        target_object_type_id:
          description: Target object type ID
          type: string
        target_object_type:
          $ref: "#/components/schemas/SimpleObjectType"
          description: Target object type. Returned when viewing details.
        type:
          description: Relation type
          enum:
            - direct
            - filtered_cross_join
          type: string
        mapping_rules:
          oneOf:
            - $ref: "#/components/schemas/DirectMappingRules"
            - $ref: "#/components/schemas/FilteredCrossJoinMappingRule"
          description: Matching rules for the relation. direct uses a Mapping array; filtered_cross_join uses FilteredCrossJoinMappingRule.
        creator:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        create_time:
          format: int64
          description: Creation time
          type: integer
        updater:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        update_time:
          format: int64
          description: Most recent update time
          type: integer
    DirectMappingRules:
      description: Direct mapping
      type: array
      items:
        $ref: "#/components/schemas/Mapping"
    FilteredCrossJoinMappingRule:
      description: |
        Matching rules for filtered_cross_join (FCJ). It does not use data views or key mappings.
        source_condition and target_condition are optional instance filters with the same structure as object instance query Condition.
        Either side may be omitted, or mapping_rules can be an empty object when neither side has extra filters.
      type: object
      properties:
        source_condition:
          description: Source-side instance filter. Omit it for no source-side constraint.
          type: object
        target_condition:
          description: Target-side instance filter. Omit it for no target-side constraint.
          type: object
    Mapping:
      description: Mapping rule
      required:
        - target_property
        - source_property
      type: object
      properties:
        target_property:
          $ref: "#/components/schemas/SimpleProperty"
          description: Source property
        source_property:
          $ref: "#/components/schemas/SimpleProperty"
          description: Target property
    SimpleProperty:
      description: Simple property information
      required:
        - name
        - display_name
      type: object
      properties:
        name:
          description: Property name
          type: string
        display_name:
          description: Property display name. Returned when viewing details.
          type: string
    AddObjectTypeToGroup:
      description: Add object types to a concept group
      required:
        - entries
      type: object
      properties:
        entries:
          description: Object types to add
          type: array
          items:
            $ref: "#/components/schemas/AddObjectType"
    AddObjectType:
      description: Object types to add
      required:
        - id
      type: object
      properties:
        id:
          description: Object type ID
          type: string
    UpdateConceptGroup:
      description: Update a concept group
      required:
        - name
      type: object
      properties:
        name:
          description: Name
          type: string
        tags:
          description: Tags used for business identification
          type: array
          items:
            type: string
        comment:
          description: Comment
          type: string
        icon:
          description: Icon
          type: string
        color:
          description: Color
          type: string
    SimpleConceptGroup:
      description: Simple concept group information
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Concept group ID
          type: string
        name:
          description: Concept group name
          type: string
    ConceptGroupDetail:
      description: Concept group details
      required:
        - branch
        - color
        - comment
        - create_time
        - creator
        - icon
        - id
        - name
        - object_types
        - tags
        - update_time
        - updater
        - kn_id
      type: object
      properties:
        id:
          description: ID
          type: string
        name:
          description: Name
          type: string
        tags:
          description: Tags. May be empty.
          type: array
          items:
            type: string
        comment:
          description: Comment. May be empty.
          type: string
        icon:
          description: Icon
          type: string
        color:
          description: Color
          type: string
        kn_id:
          description: Business knowledge network ID
          type: string
        branch:
          description: Branch ID
          type: string
        object_types:
          description: Object types
          type: array
          items:
            $ref: "#/components/schemas/ObjectTypeDetail"
        relation_types:
          description: Relation type
          type: array
          items:
            $ref: "#/components/schemas/RelationTypeDetail"
        action_types:
          description: Action type
          type: array
          items:
            $ref: "#/components/schemas/ActionTypeDetail"
        creator:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        create_time:
          format: int64
          description: Creation time
          type: integer
        updater:
          $ref: '../_shared/common.yaml#/components/schemas/AccountInfo'
        update_time:
          format: int64
          description: Most recent update time
          type: integer
        module_type:
          description: Module type of the concept
          type: string
