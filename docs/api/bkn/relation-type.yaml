                    comment: pod到node的关系，pod包含于节点
                    icon: ""
                    color: ""
                    branch: main
                    source_object_type_id: pod
                    target_object_type_id: node
                    type: direct
                    mapping_rules:
                      - source_property:
                          name: pod_node_name
                        target_property:
                          name: node_name
                    module_type: relation_type
              检索关系类-第一次请求:
                value:
                  need_total: true
                  limit: 1
                  condition:
                    operation: and
                    sub_conditions:
                      - field: comment
                        operation: match
                        value_from: const
                        value: pod
                      - field: "*"
                        operation: knn
                        value_from: const
                        value:
                          - pod
                          - 10
              检索关系类-非第一次:
                value:
                  cursor: cursor-relation-types-1
                  need_total: true
                  limit: 1
