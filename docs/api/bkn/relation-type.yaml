        - operation
        - value
      type: object
      properties:
        field:
          description: Filter field. Regular expressions support string field types.
          enum:
            - id
            - name
            - comment
          type: string
        operation:
          description: Operator
          enum:
            - regex
          type: string
        value:
          description: Filter value
          type: string
    condition_multi_match:
      description: Multi-field full-text match
      required:
        - operation
        - value
      type: object
      properties:
        fields:
          description:
            "Filter field array. Multi-field full-text matching supports string field types. When empty, queries the field configured by index.default_field in OpenSearch. To match all fields, pass [\"*\"]. Supported fields are name, comment, detail,\
            \ *"
          type: array
          items:
            type: string
        operation:
          description: Operator
          enum:
            - multi_match
          type: string
        value:
          description: Filter value
          type: string
        match_type:
          description: Full-text match type. Defaults to best_fields.
          enum:
            - best_fields
            - most_fields
            - cross_fields
            - phrase
            - phrase_prefix
            - bool_prefix
          type: string
    condition_not_in:
      description: Not-in filter condition
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          description: Filter field. Not-in supports all field types.
          enum:
            - id
            - name
            - comment
          type: string
        operation:
          description: Operator
          enum:
            - not_in
          type: string
        value:
          description: Filter value
          type: array
          items: {}
    condition_match_phrase:
      description: "Match-phrase filter. Supports a single field or * for all fields."
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          description: Filter field. Phrase matching supports string field types.
          enum:
            - name
            - comment
            - "*"
          type: string
        operation:
          description: Operator
          enum:
            - match_phrase
          type: string
        value:
          description: Filter value
          type: string
    condition_match:
      description: "Match filter. Supports a single field or * for all fields."
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          description: Filter field. Full-text matching supports string field types.
          enum:
            - name
            - comment
            - "*"
          type: string
        operation:
          description: Operator
          enum:
            - match
          type: string
        value:
          description: Filter value
          type: string
    condition_knn:
      description: 'KNN filter. Supports a single field or * for _vector.'
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          description: "Filter field. Concept indexes are generated internally and not exposed; use * for field in KNN filters."
          enum:
            - "*"
          type: string
        operation:
          description: Operator
          enum:
            - knn
          type: string
        value:
          description: Filter value. When limit_key is k, limit_value is an integer; when it is max_distance or min_score, limit_value is a float.
          type: number
        limit_key:
          description:
            "Filter and scoring behavior for radial search. k returns the limit_value most similar results; max_distance returns results whose distance is at most limit_value; min_score returns results whose similarity score is at least limit_value. Defaults to k."
          enum:
            - k
            - max_distance
            - min_score
          type: string
          default: k
        limit_value:
          description: "Value used for radial search. Defaults to 100."
          type: number
          default: 100
        sub_conditions:
          description: Child query under KNN
          type: array
          items:
            $ref: "#/components/schemas/Condition"
    condition_and:
      description: AND filter condition
      required:
        - operation
        - sub_conditions
      type: object
      properties:
        operation:
          description: Filter operator
          enum:
            - and
          type: string
        sub_conditions:
          description: Child filter conditions
          type: array
          items:
            $ref: "#/components/schemas/Condition"
    Condition:
      oneOf:
        - $ref: "#/components/schemas/condition_and"
        - $ref: "#/components/schemas/condition_or"
        - $ref: "#/components/schemas/condition_eq"
        - $ref: "#/components/schemas/condition_not_eq"
        - $ref: "#/components/schemas/condition_in"
        - $ref: "#/components/schemas/condition_not_in"
        - $ref: "#/components/schemas/condition_like"
        - $ref: "#/components/schemas/condition_not_like"
        - $ref: "#/components/schemas/condition_regex"
        - $ref: "#/components/schemas/condition_match"
        - $ref: "#/components/schemas/condition_match_phrase"
        - $ref: "#/components/schemas/condition_knn"
        - $ref: "#/components/schemas/condition_multi_match"
