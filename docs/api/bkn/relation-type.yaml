  /api/bkn-backend/v1/knowledge-networks/{kn_id}/relation-types/validation:
    post:
      summary: Validate relation types
      description: |
        Validates relation type dependency existence only and does not write data. It verifies dependencies such as source and target object types and indirect data views.

        Response: HTTP 200 uses valid and detail in the same way as other validation APIs; parameter and authentication failures return non-2xx statuses.

        Internal API: POST /api/bkn-backend/in/v1/.../relation-types/validation. The caller is resolved from headers and OAuth is not required.
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: import_mode
          description: Same as the create relation type API. Defines validation semantics for existing relation type ID conflicts; name conflicts follow create behavior.
          schema:
            type: string
            enum: [normal, ignore, overwrite]
            default: normal
          in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  description: Relation type list to validate. Its structure is the same as the create API.
                  items:
                    type: object
      responses:
        "200":
          description: Validation result returned. Both pass and fail can return 200.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                  detail:
                    type: string
                    description: Explanation when valid is false (error.Error()).
        "400":
          description: Invalid request parameters and similar errors. Business validation failures use 200 plus valid false.
components:
  schemas:
    BasicInfo:
      description: Basic resource information containing an ID and name
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Resource ID
          type: string
        name:
          description: Resource name
          type: string
    ConceptCondition:
      description: Concept query data condition. Filterable fields include type name, property name, and description.
      required:
        - operation
      type: object
      properties:
        field:
          description: Field name
          enum:
            - type_id
            - type_name
            - property_name
            - property_display_name
            - comment
          type: string
        operation:
          description: |-
            Operators.

            knn: Vector filter without vectorizing the original text. The value is an array whose first item is the filter content and whose second item is the number of neighbors to return.

            knn_vector: Vector filter for already-vectorized text. The value is an array whose first item is the vector and whose second item is the number of neighbors to return.
          enum:
            - and
            - or
            - ==
            - "!="
            - in
            - not_in
            - like
            - not_like
            - regex
            - match
            - match_phrase
            - knn
            - knn_vector
          type: string
        sub_conditions:
          description: Child filter conditions
          type: array
          items:
            $ref: "#/components/schemas/ConceptCondition"
        value:
          description: Field value
        value_from:
          description: Field value source. Only const is currently supported.
          enum:
            - const
          type: string
    ConceptGroup:
      description: Concept groups
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Concept groupsID
          type: string
        name:
          description: Concept group name
          type: string
    DataSource:
      description: Data source
      required:
        - type
        - id
      type: object
      properties:
        type:
          description: Backing data source type for indirect relations. Currently only Vega resources are supported.
          enum:
            - resource
          type: string
        id:
          description: vega resource ID
          type: string
        name:
