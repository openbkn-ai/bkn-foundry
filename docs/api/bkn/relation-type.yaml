---
openapi: 3.0.2
info:
  title: RelationType
  version: 0.1.0
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/relation-types:
    get:
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: name_pattern
          description: Fuzzy-match by relation type name. Empty by default.
          schema:
            type: string
          in: query
        - name: sort
          description: Sort field. Defaults to update_time.
          schema:
            enum:
              - update_time
              - name
            type: string
          in: query
        - name: direction
          description: |-
            Sort direction. Supported values are asc and desc.
            Defaults to desc.
          schema:
            enum:
              - asc
              - desc
            type: string
          in: query
        - name: offset
          description: "Offset of the first returned item. Must be greater than or equal to 0. Defaults to 0."
          schema:
            format: int64
            type: integer
          in: query
        - name: limit
          description: |-
            Maximum number of returned items per page.
            Supported paginated values are 1 to 1000; -1 disables pagination.
            Defaults to 10.
          schema:
            format: int64
            type: integer
          in: query
        - name: tag
          description: Exact-match by tag. Empty by default.
          schema:
            type: string
          in: query
        - name: source_object_type_id
          description: Source object type ID
          schema:
            type: string
          in: query
        - name: target_object_type_id
          description: Target object type ID
          schema:
            type: string
          in: query
        - name: bound_object_type_id
          description: Bound object type ID. Finds relation types whose source or target equals this object type. Multiple values are supported.
          schema:
            type: array
            items:
              type: string
          in: query
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRelationTypes"
