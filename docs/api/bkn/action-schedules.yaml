---
openapi: 3.0.2
info:
  title: ActionSchedule
  version: 0.1.0
  description: |-
    Action Schedule management. An action schedule triggers an action type on designated instances according to a cron expression.
    All APIs are exposed under /api/bkn-backend/v1, require OAuth2 authentication, default the branch query parameter
    to main, and use Unix milliseconds for timestamps.
security:
  - OAuth2: []
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/action-schedules:
    post:
      tags:
        - ActionSchedule
      summary: Create an action schedule
      description: "Creates a cron-triggered action schedule in a knowledge network branch. Requires application/json content type."
      operationId: createActionSchedule
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionScheduleCreateRequest"
      responses:
        "201":
          description: Creation succeeded. Returns the new schedule ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network or action type not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
    get:
      tags:
        - ActionSchedule
      summary: List action schedules
      description: Lists action schedules in a knowledge network with pagination and optional name, action type, or status filtering.
      operationId: listActionSchedules
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
        - name: name_pattern
          in: query
          description: Fuzzy match by name. Defaults to empty.
          schema:
            type: string
        - name: action_type_id
          in: query
          description: Filter by bound action type. Defaults to empty.
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status. Defaults to all.
          schema:
            type: string
            enum:
              - active
              - inactive
        - name: offset
          in: query
          description: Offset, greater than or equal to 0. Defaults to 0.
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          description: Page size in the range [1, 1000]. A value of -1 returns all items without pagination.
          schema:
            type: integer
            format: int64
            default: 10
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum:
              - create_time
              - update_time
              - next_run_time
              - last_run_time
              - name
            default: create_time
        - name: direction
          in: query
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActionSchedule"
                  total_count:
                    type: integer
                    format: int64
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/action-schedules/{schedule_id}:
    get:
      tags:
        - ActionSchedule
      summary: Get an action schedule
      operationId: getActionSchedule
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: schedule_id
          in: path
          required: true
          description: Action schedule ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionSchedule"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network or action schedule not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
    put:
      tags:
        - ActionSchedule
      summary: Update an action schedule
      description: |-
        Updates mutable schedule fields: name, cron expression, instances, or dynamic parameters. At least one is required.
        This endpoint does not update status or action type. Requires application/json content type.
      operationId: updateActionSchedule
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: schedule_id
          in: path
          required: true
          description: Action schedule ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionScheduleUpdateRequest"
      responses:
        "200":
          description: Update succeeded with no response body
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network or action schedule not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/action-schedules/{schedule_id}/status:
    put:
      tags:
        - ActionSchedule
      summary: Change action schedule status
      description: "Activates or deactivates a schedule. Activation recalculates the next run time using the stored cron expression. Requires application/json content type."
      operationId: updateActionScheduleStatus
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: schedule_id
          in: path
          required: true
          description: Action schedule ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - inactive
      responses:
        "200":
          description: Status update succeeded with no response body
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network or action schedule not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/action-schedules/{schedule_ids}:
    delete:
      tags:
        - ActionSchedule
      summary: Delete action schedules in batch
      description: Deletes one or more schedules by ID list.
      operationId: deleteActionSchedules
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: schedule_ids
          in: path
          required: true
          description: Comma-separated action schedule ID list
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      responses:
        "204":
          description: Deletion succeeded with no response body
        "400":
          description: Invalid parameters because IDs do not match the knowledge network or branch
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network or one of the action schedules was not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for public APIs
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
  schemas:
    AccountInfo:
      type: object
      description: Account information for creators and updaters
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
    ActionSchedule:
      type: object
      description: Action schedule object
      properties:
        id:
          type: string
        name:
          type: string
        kn_id:
          type: string
        branch:
          type: string
        action_type_id:
          type: string
          description: ID of the bound action type
        cron_expression:
          type: string
          description: Standard five-field cron expression with minute, hour, day, month, and weekday fields
        _instance_identities:
          type: array
          description: Instance identity list. The JSON key has a leading underscore.
          items:
            type: object
        dynamic_params:
          type: object
          description: Dynamic parameters
        status:
          type: string
          enum:
            - active
            - inactive
        last_run_time:
          type: integer
          format: int64
          description: Last run time in Unix milliseconds
        next_run_time:
          type: integer
          format: int64
          description: Next run time in Unix milliseconds
        lock_holder:
          type: string
        lock_time:
          type: integer
          format: int64
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          type: integer
          format: int64
          description: Creation time in Unix milliseconds
        updater:
          $ref: "#/components/schemas/AccountInfo"
        update_time:
          type: integer
          format: int64
          description: Update time in Unix milliseconds
    ActionScheduleCreateRequest:
      type: object
      description: Action schedule creation request
      required:
        - name
        - action_type_id
        - cron_expression
        - _instance_identities
      properties:
        name:
          type: string
          description: Name, with a maximum length of 100
        action_type_id:
          type: string
          description: Action type ID, which must exist in the specified knowledge network and branch
        cron_expression:
          type: string
          description: Valid five-field cron expression
        _instance_identities:
          type: array
          description: Non-empty instance identity list. The JSON key has a leading underscore.
          minItems: 1
          items:
            type: object
        dynamic_params:
          type: object
        status:
          type: string
          description: Defaults to inactive. When active, creation calculates the next run time.
          enum:
            - active
            - inactive
    ActionScheduleUpdateRequest:
      type: object
      description: Action schedule update request. At least one of the four mutable fields is required.
      properties:
        name:
          type: string
          description: Maximum length of 100
        cron_expression:
          type: string
          description: Valid cron expression. Recalculates next_run_time only when the schedule is active.
        _instance_identities:
          type: array
          items:
            type: object
        dynamic_params:
          type: object
