openapi: 3.0.3
info:
  title: BKN Backend API
  description: |
    BKN (Business Knowledge Network) Backend API provides import and export operations for business knowledge networks.
  version: 1.0.0
  contact:
    name: BKN Foundry Team

security:
  - OAuth2: []
  - InternalAuth: []

tags:
  - name: BKN Import/Export
    description: BKN import and export APIs

paths:
  /api/bkn-backend/v1/health:
    get:
      tags:
        - BKN
      summary: Get BKN backend health and platform version
      description: Returns BKN backend runtime information. ServerVersion is the platform version for releases in which all services share one version.
      operationId: getBKNBackendHealth
      security: []
      responses:
        '200':
          description: Health and version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  ServerName:
                    type: string
                  ServerVersion:
                    type: string
                    description: Platform version.
                  Language:
                    type: string
                  GoVersion:
                    type: string
                  GoArch:
                    type: string
                required:
                  - ServerVersion
  # ==================== BKN Import/Export ====================
  /api/bkn-backend/v1/bkns:
    post:
      tags:
        - BKN Import/Export
      summary: Upload and import a BKN tar archive
      description: Upload a BKN tar archive and import it as a business knowledge network. For the archive format, see docs/design/bkn/features/bkn_docs/SPECIFICATION.md
      operationId: uploadBKN
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: BKN tar archive file
            encoding:
              file:
                contentType: application/octet-stream
      parameters:
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
        - name: binding_policy
          in: query
          description: |
            Controls how environment-local bindings in the archive are imported.
            preserve keeps resource, Tool Box, and MCP identifiers and subjects them to proxy permission checks.
            detach removes those identifiers, including indirect-relation backing resources, while preserving the knowledge model topology so targets can be bound later through incremental APIs.
          schema:
            type: string
            enum: [preserve, detach]
            default: preserve
        - name: import_mode
          description: |
            Import mode. normal reports an error for duplicate concept names; overwrite replaces them;
            ignore skips them. Defaults to normal.
          schema:
            type: string
            enum: [normal, overwrite, ignore]
            default: normal
          in: query
        - name: strict_mode
          description: Whether to validate that dependent objects exist. Defaults to true. When empty, the deprecated validate_dependency parameter is used.
          schema:
            type: boolean
            default: true
          in: query
        - name: validate_dependency
          deprecated: true
          description: "Deprecated. Use strict_mode instead. This parameter is retained for compatibility and is read when strict_mode is empty."
          schema:
            type: boolean
            default: true
          in: query
      responses:
        '200':
          description: Import succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  kn_id:
                    type: string
                    description: ID of the created knowledge network
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized

  /api/bkn-backend/v1/bkns/{kn_id}:
    get:
      tags:
        - BKN Import/Export
      summary: Download a BKN tar archive
      description: Export a business knowledge network as a BKN tar archive. For the archive format, see docs/design/bkn/features/bkn_docs/SPECIFICATION.md
      operationId: downloadBKN
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Knowledge network ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      responses:
        '200':
          description: Export succeeded
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized
        '404':
          description: Knowledge network not found
  /api/bkn-backend/v1/bkns/diff:
    post:
      tags:
        - BKN Import/Export
      summary: Compare two knowledge network branches
      description: |
        Report what differs between two knowledge network branches, definition by definition and
        field by field. Both networks are named in the body: neither is the resource being
        addressed, and putting one in the path would suggest the comparison belongs to it.

        Each side is authorized on its own, so a caller who may read one network and not the other
        is refused exactly as they would be asking for that network directly.

        Definitions are paired by type and id. Two networks built independently share no
        definition ids — ids are generated per network — so their comparison degrades into
        "everything created, everything deleted". `lineage` reports that overlap up front, and
        `fallback_by_name` pairs the remainder by name when the caller opts in.

        Definitions that are identical on both sides are counted in `summary` and left out of
        `entries`.
      operationId: diffKNs
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base, target]
              properties:
                base:
                  $ref: '#/components/schemas/KNDiffSideRequest'
                target:
                  $ref: '#/components/schemas/KNDiffSideRequest'
                fallback_by_name:
                  type: boolean
                  default: false
                  description: |
                    Pair definitions by name once id matching is exhausted. A name match is a
                    guess: two definitions can carry the same name and mean different things, so
                    a paired entry reports both ids for a human to check, and an ambiguous name
                    pairs with nothing.
                include_unchanged:
                  type: boolean
                  default: false
                  description: |
                    Also return the definitions that are identical on both sides. They carry no
                    changes — they are there to be listed, not read — and the counts in `summary`
                    are the same either way. A caller that shows the whole model beside the
                    differences asks for them; one that shows only what moved does not pay for
                    them.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KNDiffResult'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        '401':
          description: Unauthorized
        '403':
          description: The caller may not read one of the two networks
        '404':
          description: Knowledge network not found
  /api/bkn-backend/v1/bkns/diff/object-data-stats:
    post:
      tags:
        - BKN Import/Export
      summary: Count the data behind one object type on each side of a comparison
      description: |
        Report how much data sits behind two object types: the row count of each bound resource and
        the number of distinct primary keys in it.

        This is a separate call from the comparison because it queries the customer's own database.
        A comparison opens without paying for it, and pays only for the object type someone
        actually opens.

        Two numbers is the whole of it on purpose. Per-column statistics — null rates, value
        distributions — cost another pass over the table for every column, and this runs while
        someone waits with a comparison open.

        `same_resource` is true when both object types are bound to the same resource. The two
        sides are then reading one table and every number matches by construction, which is not a
        finding about the data. `missing_keys` counts rows with a NULL in any primary key column:
        they identify no object at all. `duplicate_keys` counts the rows with a complete key beyond
        the first for each key: a non-zero value means the resource holds rows the model believes
        are the same object. The two are kept apart because they are different faults, and a row
        without a key must not read as a duplicate.
      operationId: objectDataStats
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base, target]
              properties:
                base:
                  $ref: '#/components/schemas/ObjectDataStatsSideRequest'
                target:
                  $ref: '#/components/schemas/ObjectDataStatsSideRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectDataStatsResult'
        '400':
          description: Invalid request, or an object type bound to no data resource
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        '401':
          description: Unauthorized
        '403':
          description: The caller may not query data in one of the two networks
        '404':
          description: The object type does not exist in that branch
  /api/bkn-backend/v1/knowledge-networks/names:
    post:
      tags:
        - BKN
      summary: Batch get knowledge network names by ID
      description: "Batch return knowledge network names by ID, for example for object-level authorization pages. Missing IDs are skipped without an error. Requires application/json content type."
      operationId: queryKNNamesByIDs
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: List of knowledge network IDs to resolve, with at most 100 items. An empty list returns empty entries.
                  maxItems: 100
                  items:
                    type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        '401':
          description: Unauthorized
  /api/bkn-backend/v1/resources:
    get:
      tags:
        - BKN
      summary: List resources
      description: Lists resources by resource type with pagination on the unified resource platform. Currently supports resource_type=knowledge_network.
      operationId: listResources
      security:
        - OAuth2: []
      parameters:
        - name: resource_type
          in: query
          required: true
          description: |
            Resource type. The current implementation recognizes only knowledge_network, which represents a knowledge network.
            It maps to interfaces.RESOURCE_TYPE_KN.

            Other values do not return an error. Instead, the default branch returns 200 with an empty response body.
            This is not an empty list: there is no body at all. An invalid value causes the client
            to fail JSON parsing or receive no data, rather than receive a 400 response.
          schema:
            type: string
            enum: [knowledge_network]
        - name: keyword
          in: query
          description: Filter by name keyword. Defaults to empty.
          schema:
            type: string
        - name: offset
          in: query
          description: Offset. Defaults to 0.
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          description: Page size. Defaults to 10.
          schema:
            type: integer
            format: int64
            default: 10
        - name: sort
          description: Sort field. Defaults to name.
          schema:
            type: string
            default: name
          in: query
        - name: direction
          description: Sort direction. Defaults to desc.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          in: query
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: string
                        name:
                          type: string
                  total_count:
                    type: integer
                    format: int64
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        '401':
          description: Unauthorized

components:
  schemas:
    KNDiffSideRequest:
      type: object
      required: [kn_id]
      properties:
        kn_id:
          type: string
        branch:
          type: string
          default: main
          description: Branch name. Defaults to main.

    ObjectDataStatsSideRequest:
      type: object
      required: [kn_id, ot_id]
      properties:
        kn_id:
          type: string
        branch:
          type: string
          default: main
        ot_id:
          type: string

    ObjectDataStats:
      type: object
      properties:
        kn_id:
          type: string
        branch:
          type: string
        ot_id:
          type: string
        ot_name:
          type: string
        resource_id:
          type: string
        primary_keys:
          type: array
          items:
            type: string
        row_count:
          type: integer
          format: int64
        primary_key_distinct:
          type: integer
          format: int64
          description: |
            Absent when the object type declares no primary key: there is nothing to count
            distinct values of, and zero would read as "every row is a duplicate".
        missing_keys:
          type: integer
          format: int64
          description: Rows with a NULL in any primary key column. Absent when the object type declares no primary key.
        duplicate_keys:
          type: integer
          format: int64
          description: |
            Rows with a complete key, minus distinct complete keys. Non-zero means the resource holds
            rows the model believes are the same object. Rows counted in missing_keys are not
            counted here.

    ObjectDataStatsResult:
      type: object
      properties:
        base:
          $ref: '#/components/schemas/ObjectDataStats'
        target:
          $ref: '#/components/schemas/ObjectDataStats'
        same_resource:
          type: boolean
          description: Both object types are bound to the same resource, so the two sides read one table and every number matches by construction.
        delta:
          type: object
          description: Target minus base.
          properties:
            row_count:
              type: integer
              format: int64
            primary_key_distinct:
              type: integer
              format: int64

    KNDiffSide:
      type: object
      description: Echoes what was compared, so a stored result still says what it was.
      properties:
        kn_id:
          type: string
        branch:
          type: string
        name:
          type: string

    KNDiffValueChange:
      type: object
      properties:
        old:
          type: string
        new:
          type: string

    KNDiffFieldChange:
      type: object
      properties:
        path:
          type: string
          description: |
            Where the difference is, written for a reader rather than for a parser:
            `data_properties[alt_part].description` names the property by its own name, so a
            reordered table produces no changes at all.
          example: data_properties[alt_part].description
        kind:
          type: string
          enum: [create, update, delete]
        old:
          type: string
        new:
          type: string

    KNDiffDefinition:
      type: object
      properties:
        type:
          type: string
          enum: [object_type, relation_type, action_type, risk_type, concept_group, metric, network]
        id:
          type: string
        action:
          type: string
          enum: [create, update, delete, skip]
        name:
          $ref: '#/components/schemas/KNDiffValueChange'
        paired_by:
          type: string
          enum: [id, name]
          description: How the two sides were matched. `name` means the ids differ and both are reported.
        base_id:
          type: string
        target_id:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/KNDiffFieldChange'

    KNDiffResult:
      type: object
      properties:
        base:
          $ref: '#/components/schemas/KNDiffSide'
        target:
          $ref: '#/components/schemas/KNDiffSide'
        summary:
          type: object
          description: Counts every definition, including the identical ones left out of entries.
          properties:
            created:
              type: integer
            updated:
              type: integer
            deleted:
              type: integer
            unchanged:
              type: integer
        lineage:
          type: object
          description: |
            How much of the two networks' identity overlaps. `common_ids` of zero means the two
            were built independently and the comparison is a wall of creates and deletes rather
            than a readable result.
          properties:
            common_ids:
              type: integer
            total_ids:
              type: integer
            related:
              type: boolean
        network:
          allOf:
            - $ref: '#/components/schemas/KNDiffDefinition'
          description: |
            The root file, reported on its own. Two different networks always differ here by
            construction, so it is kept out of the definition counts.
        entries:
          type: array
          description: Definitions that differ. Identical ones are counted in summary only.
          items:
            $ref: '#/components/schemas/KNDiffDefinition'

  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for public APIs
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
