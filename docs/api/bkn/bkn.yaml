openapi: 3.0.3
info:
  title: BKN Backend API
  description: |
    BKN (Business Knowledge Network) Backend API provides import and export operations for business knowledge networks.
  version: 1.0.0
  contact:
    name: BKN Foundry Team

security:
  - OAuth2: []
  - InternalAuth: []

tags:
  - name: BKN Import/Export
    description: BKN import and export APIs

paths:
  /api/bkn-backend/v1/health:
    get:
      tags:
        - BKN
      summary: Get BKN backend health and platform version
      description: Returns BKN backend runtime information. ServerVersion is the platform version for releases in which all services share one version.
      operationId: getBKNBackendHealth
      security: []
      responses:
        '200':
          description: Health and version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  ServerName:
                    type: string
                  ServerVersion:
                    type: string
                    description: Platform version.
                  Language:
                    type: string
                  GoVersion:
                    type: string
                  GoArch:
                    type: string
                required:
                  - ServerVersion
  # ==================== BKN Import/Export ====================
  /api/bkn-backend/v1/bkns:
    post:
      tags:
        - BKN Import/Export
      summary: Upload and import a BKN tar archive
      description: Upload a BKN tar archive and import it as a business knowledge network. For the archive format, see docs/design/bkn/features/bkn_docs/SPECIFICATION.md
      operationId: uploadBKN
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: BKN tar archive file
            encoding:
              file:
                contentType: application/octet-stream
      parameters:
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
        - name: import_mode
          description: |
            Import mode. normal reports an error for duplicate concept names; overwrite replaces them;
            ignore skips them. Defaults to normal.
          schema:
            type: string
            enum: [normal, overwrite, ignore]
            default: normal
          in: query
        - name: strict_mode
          description: Whether to validate that dependent objects exist. Defaults to true. When empty, the deprecated validate_dependency parameter is used.
          schema:
            type: boolean
            default: true
          in: query
        - name: validate_dependency
          deprecated: true
          description: "Deprecated. Use strict_mode instead. This parameter is retained for compatibility and is read when strict_mode is empty."
          schema:
            type: boolean
            default: true
          in: query
      responses:
        '200':
          description: Import succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  kn_id:
                    type: string
                    description: ID of the created knowledge network
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized

  /api/bkn-backend/v1/bkns/{kn_id}:
    get:
      tags:
        - BKN Import/Export
      summary: Download a BKN tar archive
      description: Export a business knowledge network as a BKN tar archive. For the archive format, see docs/design/bkn/features/bkn_docs/SPECIFICATION.md
      operationId: downloadBKN
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Knowledge network ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      responses:
        '200':
          description: Export succeeded
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized
        '404':
          description: Knowledge network not found
  /api/bkn-backend/v1/knowledge-networks/names:
    post:
      tags:
        - BKN
      summary: Batch get knowledge network names by ID
      description: "Batch return knowledge network names by ID, for example for object-level authorization pages. Missing IDs are skipped without an error. Requires application/json content type."
      operationId: queryKNNamesByIDs
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: List of knowledge network IDs to resolve, with at most 100 items. An empty list returns empty entries.
                  maxItems: 100
                  items:
                    type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        '401':
          description: Unauthorized
  /api/bkn-backend/v1/resources:
    get:
      tags:
        - BKN
      summary: List resources
      description: Lists resources by resource type with pagination on the unified resource platform. Currently supports resource_type=knowledge_network.
      operationId: listResources
      security:
        - OAuth2: []
      parameters:
        - name: resource_type
          in: query
          required: true
          description: |
            Resource type. The current implementation recognizes only knowledge_network, which represents a knowledge network.
            It maps to interfaces.RESOURCE_TYPE_KN.

            Other values do not return an error. Instead, the default branch returns 200 with an empty response body.
            This is not an empty list: there is no body at all. An invalid value causes the client
            to fail JSON parsing or receive no data, rather than receive a 400 response.
          schema:
            type: string
            enum: [knowledge_network]
        - name: keyword
          in: query
          description: Filter by name keyword. Defaults to empty.
          schema:
            type: string
        - name: offset
          in: query
          description: Offset. Defaults to 0.
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          description: Page size. Defaults to 10.
          schema:
            type: integer
            format: int64
            default: 10
        - name: sort
          description: Sort field. Defaults to name.
          schema:
            type: string
            default: name
          in: query
        - name: direction
          description: Sort direction. Defaults to desc.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          in: query
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: string
                        name:
                          type: string
                  total_count:
                    type: integer
                    format: int64
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        '401':
          description: Unauthorized

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for public APIs
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
