---
openapi: 3.0.2
info:
  title: BKN 知识网络 · Cypher 查询 API
  version: 0.1.0
  description: |-
    Read-only Cypher queries over the instance data of a knowledge network.
    Each MATCH branch is compiled into SQL and executed through vega-backend, so the
    default subset supports bounded MATCH patterns, WHERE over properties, and scalar
    projections and aggregates. Typed graph values, expressions and ordered stages are
    inferred when needed; graph_v1 can also be selected explicitly. Evaluation and
    evidence aggregation are bounded. Unsupported constructs are refused by name.
    Paging is written in the query itself with SKIP and LIMIT; there is no paging parameter.
    Exposed under /api/bkn-backend/v1 (OAuth2) and /api/ontology-manager/v1 (alias), with the
    branch query parameter defaulting to main.
security:
  - OAuth2: []
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/cypher-queries:
    post:
      tags:
        - CypherQuery
      summary: Run a read-only Cypher query
      description: |-
        Compiles a Cypher query against the knowledge network's model and returns the rows it
        produces. Requires application/json content type and the query_data operation on each
        object type and relation type the query names; a network-wide query_data grant covers
        them, since the child operation inherits from its parent network. Every property the
        query names -- in RETURN, WHERE, ORDER BY, an aggregate or an inline property map --
        must have the effective property access level full for the caller. A property at
        level none does not exist for the caller: naming it is a 400
        BknBackend.Cypher.InvalidQuery "unknown property", exactly as for a property outside
        the model, and it is never offered as a suggestion. A Column Masking (`masked`) or schema-only property is
        refused with 403 BknBackend.Cypher.PropertyForbidden naming it as
        object_type_id.property. Implicit join keys are not public output; returning a relation value also authorizes
        the join-key observations it exposes as evidence. Column Masking is not applied to Cypher results.

        The caller needs no grant on the vega resources behind those object types. The
        compiled statement runs through vega-backend's raw query under the caller's own
        identity first, and vega-backend checks view_detail on each resource, as before; a
        caller holding those grants is answered that way. Only when vega-backend refuses that
        run with 403, on the main branch and when every object type and relation type binding
        the query reads through is a current published binding, is the same statement run
        again under the knowledge network's managed proxy account, which vega-backend checks
        for view_detail on each resource. The statement is generated from the model, so it
        references only the resources of those bindings. When the network has no usable proxy
        (no mapping, not active, not synchronized with the published model, or a binding not
        published), on other branches, or when the proxy account is refused too, the refusal
        is returned as 403 BknBackend.Cypher.Forbidden. Other failures are not retried.

        A concept the caller may not query is absent from the model the query is compiled
        against, so naming it reads as an unknown label rather than as a refusal: this
        endpoint cannot be used to find out what a model contains. A caller who may read
        nothing in the network gets 403 for queries reading object data. A tableless RETURN
        does not read network facts.

        Labels and relationship types accept either the id or the name of the object type or
        relation type. Properties are addressed by property name; display names and logic
        properties are not accepted. A query that does not write its own LIMIT is capped at
        1000 rows, and a LIMIT above 10000 is refused rather than silently reduced.

        The generated SQL is not returned: it names physical tables and columns, which the
        caller is not entitled to just because they may read the data.
      operationId: runCypherQuery
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CypherQueryRequest"
      responses:
        "200":
          description: The query ran. Returns its columns and rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CypherQueryResult"
        "400":
          description: |-
            The query is the caller's to fix. error_code distinguishes the reason:
            BknBackend.Cypher.SyntaxError (could not be parsed),
            BknBackend.Cypher.Unsupported (valid openCypher outside the supported subset),
            BknBackend.Cypher.InvalidQuery (does not match the knowledge network model),
            BknBackend.Cypher.LimitExceeded (LIMIT above the ceiling),
            BknBackend.Cypher.InvalidParameter (missing or oversized query).
            error_details carries the compiler's message, with a line and column where the
            construct appears.
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: |-
            error_code distinguishes the reason:
            Public.Forbidden (the caller may query nothing in this knowledge network, or carries
            no identity),
            BknBackend.Cypher.PropertyForbidden (the query names a Column Masking (`masked`) or schema-only
            property; error_details lists them as object_type_id.property),
            BknBackend.Cypher.Forbidden (vega-backend refused a resource the compiled statement
            reads to the caller, and the knowledge network's proxy account could not be used or
            was refused too). The statement is never included.
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "404":
          description: Knowledge network not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "406":
          description: Content-Type is not application/json
        "500":
          description: |-
            BknBackend.Cypher.QueryFailed: the compiled statement failed to run for a reason other
            than a refused resource. The dependency's message is not passed through.
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/auth
          tokenUrl: /oauth2/token
          scopes: {}
  schemas:
    CypherQueryRequest:
      type: object
      required:
        - query
      properties:
        result_format:
          type: string
          enum: [graph_v1]
          description: |-
            Optional explicit value-result selection; language features are also inferred
            from the query without this field. Existing scalar SQL queries retain their
            execution path. New value evaluation supports arithmetic, CASE, nullable
            booleans, property comparisons, list/map values and access, registered scalar
            functions and top-level count/sum/avg/min/max/collect, including DISTINCT and
            mixed aggregates. RETURN without MATCH is supported. DISTINCT, ORDER BY,
            SKIP and LIMIT follow grouping/aggregation. Aggregates within scalar expressions
            remain unsupported. ORDER BY expressions may refer to projected aliases.
            Paths, comprehensions, existential subqueries,
            relation properties and procedures are not implemented yet. This is not a full
            openCypher compatibility claim.
            UNION and UNION ALL support up to 32 independently scoped branches with identical
            column names; mixing the two operators is rejected. Every branch is compiled and
            authorized before any branch reads data. Branch ORDER BY/SKIP/LIMIT is local;
            the default 1000-row cap applies once after the union. UNWIND supports up to 32
            expansions, including parameter lists, empty/null inputs and scalar inputs.
            WITH, MATCH, OPTIONAL MATCH and UNWIND run in clause order, with at most 64 stages.
            WITH replaces the variable scope and supports aggregation, DISTINCT, ordering,
            SKIP/LIMIT and a following WHERE. RETURN * and WITH * expand the visible scope.
            Node aliases and collect-to-UNWIND preserve property origins and authorization;
            reading an attribute does not implicitly add it to public snapshot properties.
            OPTIONAL MATCH null-extends only newly introduced variables after its predicate.
            Staged MATCH requires full, complete node primary keys, even for scalar output.
            Each MATCH currently scans a bounded authorized observation before correlation;
            a selective final result may still exceed the candidate budget.
            Graph origins through arbitrary scalar functions/CASE remain limited.
            object_properties continues to name MATCH node variables, not WITH aliases.
            UNION shares a 9999-row work budget (sum of max(candidate rows, expanded rows)
            per simple branch; staged branches account cumulative intermediate work), an
            8 MiB assembly budget and the request timeout. Staged work counts the sum of
            max(stage source/input rows, stage output rows), with a separate cap of 79992
            correlation comparisons. Overflows or an
            incomplete branch reject the entire query. Separate reads do not guarantee a
            shared datasource snapshot.
            A value evaluation allows 9999 candidate rows plus one probe, an 8 MiB assembly
            budget and 30-second timeout. Exceeding a budget rejects the whole evaluation.
        object_properties:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: |-
            graph_v1 only. Snapshot property names by node variable. Complete primary keys,
            requested properties and the join-key observations exposed by relation values
            require full property access, including in nested evidence. Values come from
            the same observation; no later object lookup is performed.
          example:
            p: [name]
        parameters:
          type: object
          additionalProperties: true
          description: |-
            Values for $name, including JSON scalars, null, lists and maps. Nested values are
            bounded to 32 levels and by the evaluation payload budget. Existing simple IN
            lists retain SQL pushdown; complex, empty or nullable lists use bounded value
            evaluation. Parameters never become schema names or physical SQL identifiers.
          example:
            region: "eu"
            floor: 100
        query:
          type: string
          maxLength: 8192
          description: |-
            The Cypher query. Existing scalar SQL shape (the additional value-expression capabilities are described in result_format and do not require explicit negotiation):
            MATCH (a:Label [{property: value, ...}]) [-[:RELATION]-(b:Label) ...]
            [WHERE <condition>]
            RETURN [DISTINCT] a.property | aggregate(a.property) [AS alias], ...
            [ORDER BY a.property | alias | aggregate(a.property) [DESC]] [SKIP n] [LIMIT n]

            A condition compares a property with =, <>, <, >, <= or >= against a literal or a
            parameter, or tests it with IN [ ... ], IN $list (the whole list as one parameter),
            IS NULL or IS NOT NULL. A string property can also be matched with STARTS WITH,
            ENDS WITH or CONTAINS against a string literal or parameter: the match is a literal
            substring match (% and _ are not wildcards), a null property never matches, case
            sensitivity follows the column collation, and using them on a non-string property
            is refused with 400. Conditions combine with AND, OR and NOT, and parentheses group
            them. XOR is not supported.

            Aggregates are count, sum, avg, min and max, each also in its DISTINCT form, plus
            count(*). Cypher has no GROUP BY: aggregating anything groups by everything else
            the query returns. A grouped or DISTINCT result can only be sorted by a value it
            returns.

            A MATCH may contain several comma-separated paths, and a query may contain several
            MATCH clauses; both mean one shape. A variable written twice is the node it named
            the first time, which is how two paths meet, and paths that share no variable are
            a cartesian product. The first mention of a node names its object type; a later
            one may omit the label but must not contradict it.

            A path may contain several relationships. Each names exactly one relation type and
            may be written -[:R]->, <-[:R]- or undirected as -[:R]-; each node names exactly
            one object type and may carry an inline property map, which means the equalities
            it stands for.

            Cypher forbids one MATCH from traversing the same relationship twice, and that
            is enforced: within one MATCH, every pair of hops over one relation type must
            differ in its source row or its target row, which needs those object types to
            have a primary key. Where one of the hops is undirected the requirement cannot
            be stated, and the query is refused rather than answered with paths Cypher would
            not return. Hops in different MATCH clauses are not compared: writing
            `MATCH (a)-[:R]->(b) MATCH (a)-[:R]->(c)` is how one asks for every pair of
            things a reaches, b and c being the same included. One query's patterns
            may hold at most eight relationships and nine nodes, because each relationship is
            a join and each node is a table -- one that no relationship reaches is joined to
            the rest by nothing -- and the row limit bounds what comes back rather than what
            it costs to produce.
          example: "MATCH (o:order)-[:rel_order_item_order]->(i:order_item) WHERE o.status IN ['paid', 'shipped'] AND o.amount > $floor RETURN o.status AS status, count(*) AS orders ORDER BY orders DESC LIMIT 20"
    CypherQueryResult:
      type: object
      properties:
        result_format:
          type: string
          enum: [graph_v1]
          description: Present for typed value results, whether inferred or explicitly selected.
        value_types:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CypherValueType'
          description: Recursive logical types, keyed by result column name.
        execution:
          $ref: '#/components/schemas/CypherExecution'
        columns:
          type: array
          description: Output columns, in RETURN order. The name is the AS alias, or the source text of the property reference when no alias was written.
          items:
            $ref: "#/components/schemas/CypherQueryColumn"
        entries:
          type: array
          description: Result rows, keyed by column name.
          items:
            type: object
            additionalProperties: true
    CypherQueryColumn:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          description: Column type as reported by the underlying resource, or the logical kind in graph_v1.


    CypherValueType:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: Model scalar type, or object, relation, map, list, null, any (dynamic type).
        object_type_id:
          type: string
        relation_type_id:
          type: string
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CypherValueType'
        element:
          $ref: '#/components/schemas/CypherValueType'
    CypherExecution:
      type: object
      required: [match_rows, match_complete, evidence_complete, conclusions_limited]
      properties:
        candidate_rows:
          type: integer
          description: Source candidate rows before residual WHERE and UNWIND; staged queries sum physical MATCH observations, and UNION sums branch candidates.
        match_rows:
          type: integer
          description: Rows entering the final projection after earlier stage operations, before final grouping; UNION sums branch counts before deduplication.
        match_complete:
          type: boolean
        evidence_complete:
          type: boolean
          description: Completeness of evidence for returned conclusions.
        conclusions_limited:
          type: boolean
          description: True when SKIP or LIMIT omits otherwise matched conclusions.

    CypherObjectValue:
      type: object
      required: [kind, network_id, branch, object_type_id, key]
      properties:
        kind:
          type: string
          enum: [object]
        network_id:
          type: string
        branch:
          type: string
        object_type_id:
          type: string
        key:
          type: object
          description: Complete primary key, keyed by model property name. Values use exact decimal strings for integers.
          additionalProperties:
            type: object
            required: [type, value]
            properties:
              type:
                type: string
              value:
                type: string
        properties:
          type: object
          additionalProperties: true
          description: Only explicitly requested, authorized snapshot properties.
    CypherRelationValue:
      type: object
      description: A direct join fact observed in this evaluation; it has no persisted edge ID.
      required: [kind, relation_type_id, source, target, binding_digest, basis]
      properties:
        kind:
          type: string
          enum: [relation]
        relation_type_id:
          type: string
        source:
          $ref: '#/components/schemas/CypherObjectValue'
        target:
          $ref: '#/components/schemas/CypherObjectValue'
        binding_digest:
          type: string
          description: SHA-256 digest of the relation type, update time and mapping definition; not a data snapshot reference.
        basis:
          type: array
          description: Authorized source/target logical properties and their values from the same matching row.
          items:
            type: object
            required: [source_property, source_value, target_property, target_value]
            properties:
              source_property:
                type: string
              target_property:
                type: string
              source_value:
                description: Observed source join-key value.
              target_value:
                description: Observed target join-key value.
