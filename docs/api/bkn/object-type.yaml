          schema:
            type: string
          in: query
        - name: sort
          description: Sort field. Defaults to update_time.
          schema:
            enum:
              - update_time
              - name
            type: string
          in: query
        - name: direction
          description: |-
            Sort direction. Supported values are asc and desc.
            Defaults to desc.
          schema:
            enum:
              - asc
              - desc
            type: string
          in: query
        - name: offset
          description: "Offset of the first returned item. Must be greater than or equal to 0. Defaults to 0."
          schema:
            format: int64
            type: integer
          in: query
        - name: limit
          description: |-
            Maximum number of returned items per page.
            Supported paginated values are 1 to 1000; -1 disables pagination.
            Defaults to 10.
          schema:
            format: int64
            type: integer
          in: query
        - name: tag
          description: Exact-match by tag. Empty by default.
          schema:
            type: string
          in: query
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
        - name: need_total
          description: Whether to return total_count. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: search_after
          description: Deep-pagination cursor, separated by commas. When provided, offset is ignored.
          schema:
            type: string
          in: query
