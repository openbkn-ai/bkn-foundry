            - "*"
            - data_properties.name
            - data_properties.display_name
            - data_properties.comment
            - logic_properties.name
            - logic_properties.display_name
            - logic_properties.comment
          type: string
        operation:
          description: Operator
          enum:
            - match
          type: string
        value:
          description: Filter value
          type: string
    condition_knn:
      description: 'KNN filter. Supports a single field or * for _vector.'
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          description: "Filter field. Concept indexes are generated internally and not exposed; use * for field in KNN filters."
          enum:
            - "*"
          type: string
        operation:
          description: Operator
          enum:
            - knn
          type: string
        value:
          description: Filter value. When limit_key is k, limit_value is an integer; when it is max_distance or min_score, limit_value is a float.
          type: number
        limit_key:
          description:
            "Filter and scoring behavior for radial search. k returns the limit_value most similar results; max_distance returns results whose distance is at most limit_value; min_score returns results whose similarity score is at least limit_value. Defaults to k."
          enum:
            - k
            - max_distance
            - min_score
          type: string
          default: k
        limit_value:
          description: "Value used for radial search. Defaults to 100."
          type: number
          default: 100
        sub_conditions:
          description: Child query under KNN
          type: array
          items:
            $ref: "#/components/schemas/Condition"
    FirstQueryWithCursor:
      description: First object type search request
      required:
        - limit
      type: object
      properties:
        concept_groups:
          description: Concept group ID array
          type: array
          items:
            type: string
        condition:
          $ref: "#/components/schemas/Condition"
          description: Object type search condition
        sort:
          description: Sort field. Defaults to _score with descending direction.
          type: array
          items:
            $ref: "#/components/schemas/Sort"
        limit:
          description: Number of returned entries. Defaults to 10. Range is 1 to 10000.
          type: integer
        need_total:
          description: Whether a total count is needed. Defaults to false.
          type: boolean
    PageTurnQueryWithCursor:
      description: Subsequent request for a paginated query
      required:
        - limit
        - cursor
        - condition
      type: object
      properties:
        concept_groups:
          description: Concept group ID array
          type: array
          items:
            type: string
        condition:
          $ref: "#/components/schemas/Condition"
          description: Filter condition
        sort:
          description: Sort field. Defaults to _score with descending direction.
          type: array
          items:
            $ref: "#/components/schemas/Sort"
        limit:
          description: Number of returned entries. Defaults to 10. Range is 1 to 10000.
          type: integer
        need_total:
          description: Whether a total count is needed. Defaults to false.
          type: boolean
        cursor:
          description: next_cursor returned by the previous response.
          type: string
    condition_and:
      description: AND filter condition
      required:
        - operation
        - sub_conditions
      type: object
      properties:
        operation:
          description: Filter operator
          enum:
            - and
          type: string
        sub_conditions:
          description: Child filter conditions
          type: array
          items:
            $ref: "#/components/schemas/Condition"
    Condition:
      anyOf:
        - $ref: "#/components/schemas/condition_and"
        - $ref: "#/components/schemas/condition_or"
        - $ref: "#/components/schemas/condition_eq"
        - $ref: "#/components/schemas/condition_not_eq"
        - $ref: "#/components/schemas/condition_in"
        - $ref: "#/components/schemas/condition_not_in"
        - $ref: "#/components/schemas/condition_like"
        - $ref: "#/components/schemas/condition_not_like"
        - $ref: "#/components/schemas/condition_regex"
        - $ref: "#/components/schemas/condition_match"
        - $ref: "#/components/schemas/condition_match_phrase"
        - $ref: "#/components/schemas/condition_knn"
        - $ref: "#/components/schemas/condition_multi_match"
