  /api/bkn-backend/v1/knowledge-networks/{kn_id}/object-types/validation:
    post:
      summary: Validate object types
      description: |
        Validates concept dependency existence only and does not write data. Use it for pre-import checks or batch self-checks.
        When strict_mode is true, validates dependencies such as data views, vector-index embedding models, metric models and operators bound to logical properties, and concept groups.

        For same-batch references, such as a relation type referencing an object type that has not been persisted, single-type validation recognizes only persisted resources in strict mode when the request cannot include the referenced definition.
        In that case, use full knowledge-network validation with the same structure as the create API, or concept-group validation with nested object_types, relation_types, and action_types. The server derives BatchIDIndex from the submitted JSON, making entries visible within the same create transaction.
        Relation-mapping validation requires object type data properties. If a batch declares only object type IDs without property definitions, existence validation may pass while mapping-rule validation is reduced.

        Response: HTTP 200 with valid set to true indicates success. When valid is false, detail contains the server error message. Invalid parameters, authentication failures, and missing resources still return non-2xx statuses.

        Internal API: POST /api/bkn-backend/in/v1/.../object-types/validation. Other behavior is the same; the caller is resolved from headers and OAuth is not required.
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: import_mode
          description: "Same as the create object type API. Defines validation semantics for persisted object type ID or name conflicts: normal, ignore, or overwrite."
          schema:
            type: string
            enum: [normal, ignore, overwrite]
            default: normal
          in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  description: Object type list to validate. Its structure is the same as the create API.
                  items:
                    type: object
      responses:
        "200":
          description: Validation result returned. Both pass and fail can return 200.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                  detail:
                    type: string
                    description: Explanation when valid is false (error.Error()).
        "400":
          description: Invalid request parameters and similar errors. A business validation failure is represented by 200 plus valid false and detail, not this status.
components:
  schemas:
    BasicInfo:
      description: Basic resource information containing an ID and name
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Resource ID
          type: string
        name:
          description: Resource name
          type: string
    ConceptTypeResponse:
      description: Query response structure for object, relation, and action types
      required:
        - id
        - name
        - tags
      type: object
      properties:
        id:
          description: Concept ID
          type: string
        name:
          description: Concept name
          type: string
        tags:
          description: Tags
          type: array
          items:
            type: string
        groups:
          description: Owning concept group ID
          type: array
          items:
            type: string
    DataSource:
      description: Data source
      required:
        - type
      type: object
      properties:
        type:
          description: Data source type. Currently only Vega resources are supported.
          enum:
            - resource
          type: string
        id:
          description: vega resource ID
          type: string
        name:
          description: Name. Returned when retrieving details.
          type: string
    DataProperty:
      description: Data properties
      required:
        - name
        - display_name
        - type
      type: object
      properties:
        name:
          description: Property name. It may contain only lowercase English letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        display_name:
          description: Property display name
          type: string
        type:
          description: Property data type. In addition to view field types, metric and tool are supported.
          type: string
        comment:
          description: Property description
          type: string
        mapped_field:
          $ref: "#/components/schemas/ViewField"
          description: Field name mapped to the data source
        index_config:
          $ref: "#/components/schemas/IndexConfig"
          description: Index configuration
        condition_operations:
          description: |
            Supported filter operations for this property. They are inferred from the property type, such as
            string and text, then augmented by indexes already built on the data source. When the mapped Vega
            resource field has a full-text index, match and multi_match are added; keyword indexes add equality
            operations. If no local index exists because the build task has not run or completed, only type-derived
            operations are returned.
          type: array
          items:
            type: string
    FulltextConfig:
      description: Full-text index configuration
      required:
        - analyzer
        - enabled
      type: object
      properties:
        analyzer:
          description: Analyzer
          enum:
            - standard
            - ik_max_word
          type: string
        enabled:
          description: Whether enabled
          type: boolean
      example:
        analyzer: standard
        enabled: true
    VectorConfig:
      description: Vector index configuration
      required:
        - enabled
      type: object
      properties:
        enabled:
          description: Whether enabled
          type: boolean
        model_id:
          description: Vector model ID
          type: string
      example:
        enabled: true
        model_id: some text
    LogicProperty:
      description: Logical properties
      required:
        - name
        - data_source
        - parameters
      type: object
      properties:
        name:
          description: Property name. It may contain only lowercase English letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        display_name:
          description: Property display name
          type: string
        type:
          description: Property data type. In addition to view field types, metric and tool are supported.
          type: string
        comment:
          description: Property description
          type: string
        index:
          description: Whether to enable indexing. Defaults to true.
          type: boolean
        data_source:
          $ref: "#/components/schemas/LogicSource"
          description: Logical source
        parameters:
          description: Parameters required by the logic
          type: array
          items:
