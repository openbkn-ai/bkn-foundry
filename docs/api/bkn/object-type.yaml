    condition_match:
      description: "Match filter. Supports a single field or * for all fields."
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          description: Filter field. Full-text matching supports string field types.
          enum:
            - name
            - comment
            - "*"
            - data_properties.name
            - data_properties.display_name
            - data_properties.comment
            - logic_properties.name
            - logic_properties.display_name
