---
openapi: 3.0.2
info:
  title: BKN 知识网络 · 对象类 API
  version: 0.1.0
  description: |
    Object types use `object_type:{kn_id}/{object_type_id}`. Reads and lists
    require `view_detail`; data reads require `query_data`; updates and deletes
    use `modify` and `delete`. Lists and searches are filtered before total and
    pagination. See `../knowledge-network-authorization.md`.

    With `strict_mode=true`, resource-backed object types read only the Vega schema under
    `view_detail`. Main-branch publication reuses the effective delegator selected by Proxy
    preflight instead of requiring the current editor to repeat the downstream permission.
    Missing bindings return 400; a current-user permission denial returns 403; controlled lookup
    failures return 502, and timeout/unavailable dependencies return 503. Downstream bodies are
    never copied into the public response. Tool-backed logical properties use the same 400/502/503
    dependency classification.
security:
  - OAuth2: []
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/object-types:
    get:
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: name_pattern
          description: Fuzzy-match by object type name. Empty by default.
          schema:
            type: string
          in: query
        - name: sort
          description: Sort field. Defaults to update_time.
          schema:
            enum:
              - update_time
              - name
            type: string
          in: query
        - name: direction
          description: |-
            Sort direction. Supported values are asc and desc.
            Defaults to desc.
          schema:
            enum:
              - asc
              - desc
            type: string
          in: query
        - name: offset
          description: "Offset of the first returned item. Must be greater than or equal to 0. Defaults to 0."
          schema:
            format: int64
            type: integer
          in: query
        - name: limit
          description: |-
            Maximum number of returned items per page.
            Supported paginated values are 1 to 1000; -1 disables pagination.
            Defaults to 10.
          schema:
            format: int64
            type: integer
          in: query
        - name: tag
          description: Exact-match by tag. Empty by default.
          schema:
            type: string
          in: query
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
        - name: need_total
          description: Whether to return total_count. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: search_after
          description: Deep-pagination cursor, separated by commas. When provided, offset is ignored.
          schema:
            type: string
          in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListObjectTypes"
          description: ok
      summary: List object types
