  /api/bkn-backend/v1/knowledge-networks/{kn_id}/object-types/validation:
    post:
      summary: Validate object types
      description: |
        Validates concept dependency existence only and does not write data. Use it for pre-import checks or batch self-checks.
        When strict_mode is true, validates dependencies such as data views, vector-index embedding models, metric models and operators bound to logical properties, and concept groups.

        For same-batch references, such as a relation type referencing an object type that has not been persisted, single-type validation recognizes only persisted resources in strict mode when the request cannot include the referenced definition.
        In that case, use full knowledge-network validation with the same structure as the create API, or concept-group validation with nested object_types, relation_types, and action_types. The server derives BatchIDIndex from the submitted JSON, making entries visible within the same create transaction.
        Relation-mapping validation requires object type data properties. If a batch declares only object type IDs without property definitions, existence validation may pass while mapping-rule validation is reduced.

        Response: HTTP 200 with valid set to true indicates success. Ordinary model validation failures use valid=false and detail. Strict dependency failures return the documented 400/403/502/503 error envelope, whose error_details includes a safe dependency_kind.

        Internal API: POST /api/bkn-backend/in/v1/.../object-types/validation. Other behavior is the same; the caller is resolved from headers and OAuth is not required.
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: confirm_clear_declarations
          in: query
          description: |
            With overwrite, a file that does not carry the BKN spec 3.0 declarations of an existing object type
            (aliases, lifecycle and property declarations), such as a 2.x package or an old JSON export, would clear them.
            Without this parameter the request is refused with 409 BknBackend.ObjectType.DeclarationsWouldBeCleared,
            whose details list the declarations; pass true to clear them.
          schema:
            type: boolean
            default: false
        - name: import_mode
          description: "Same as the create object type API. Defines validation semantics for persisted object type ID or name conflicts: normal, ignore, or overwrite."
          schema:
            type: string
            enum: [normal, ignore, overwrite]
            default: normal
          in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  description: Object type list to validate. Its structure is the same as the create API.
                  items:
                    type: object
      responses:
        "200":
          description: Ordinary model-validation result. Strict dependency failures use the non-2xx responses below.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                  detail:
                    type: string
                    description: Explanation when valid is false (error.Error()).
        "400":
          $ref: "../_shared/errors.yaml#/components/responses/StrictDependencyBadRequest"
        "403":
          $ref: "../_shared/errors.yaml#/components/responses/StrictDependencyForbidden"
        "502":
          $ref: "../_shared/errors.yaml#/components/responses/StrictDependencyBadGateway"
        "503":
          $ref: "../_shared/errors.yaml#/components/responses/StrictDependencyUnavailable"
components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
  schemas:
    ObjectTypeStatsResult:
      type: object
      required:
        - entries
        - total
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ObjectTypeStatsEntry"
        total:
          description: Number of entries
          type: integer
    ObjectTypeStatsEntry:
      type: object
      required:
        - id
        - count
      properties:
        id:
          description: Object type ID
          type: string
        count:
          description: Exact instance count. Null when the Vega measurement is unavailable or error is set.
          type: integer
          format: int64
          nullable: true
        exact:
          description: True when count is available.
          type: boolean
        source:
          description: catalog for collected Vega counts, index for live dataset counts, query for row-filtered counts. Absent when count is null.
          type: string
          enum:
            - index
            - catalog
            - query
        as_of:
          description: When the count was taken, in Unix milliseconds. Absent when count is null.
          type: integer
          format: int64
        error:
          description: Why this object type has no count.
          type: object
          properties:
            code:
              description: >-
                Error code, for example Public.Forbidden, BknBackend.ObjectType.ObjectTypeNotFound,
                BknBackend.ObjectType.NoDataSource or BknBackend.ObjectType.InternalError.StatsQueryFailed.
              type: string
            message:
              description: Localized description
              type: string
    BasicInfo:
      description: Basic resource information containing an ID and name
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: Resource ID
          type: string
        name:
          description: Resource name
          type: string
    ConceptTypeResponse:
      description: Query response structure for object, relation, and action types
      required:
        - id
        - name
        - tags
      type: object
      properties:
        id:
          description: Concept ID
          type: string
        name:
          description: Concept name
          type: string
        tags:
          description: Tags
          type: array
          items:
            type: string
        groups:
          description: Owning concept group ID
          type: array
          items:
            type: string
    DataSource:
      description: Data source
      required:
        - type
      type: object
      properties:
        type:
          description: Data source type. Currently only Vega resources are supported.
          enum:
            - resource
          type: string
        id:
          description: vega resource ID
          type: string
        name:
          description: Name. Returned when retrieving details.
          type: string
    DataProperty:
      description: Data properties
      required:
        - name
        - display_name
        - type
      type: object
      properties:
        name:
          description: Property name. It may contain only lowercase English letters, digits, underscores, and hyphens, and cannot start with an underscore or hyphen.
          type: string
        display_name:
          description: Property display name
          type: string
        type:
          description: Property data type. In addition to view field types, metric and tool are supported.
          type: string
        comment:
          description: Property description
          type: string
        mapped_field:
          $ref: "#/components/schemas/ViewField"
          description: Field name mapped to the data source
        mask_rule:
          $ref: "#/components/schemas/MaskRule"
          description: Optional Column Masking rule used when the effective property access level is `masked`. It applies only to query results and never modifies source data.
        aliases:
          description: |
            BKN spec 3.0 property declaration: other names of the property. An update that leaves the field
            out keeps the stored aliases; null or [] clears them.
          type: array
          items:
            type: string
        semantic:
          description: |
            BKN spec 3.0 property declaration: what the property means. One of event_time, end_time,
            valid_from, valid_to, location, latitude, longitude, status, severity; each value at most once
            per object type. An update that leaves the field out keeps the stored value; null or "" clears it.
          type: string
        required:
          description: |
            BKN spec 3.0 property declaration: every instance has a value. A primary key is required by
            definition and refuses false. An update that leaves the field out keeps the stored value;
            null clears it.
          type: boolean
        constraints:
          $ref: "#/components/schemas/PropertyConstraints"
        condition_operations:
          description: |
            Supported filter operations for this property. They are inferred from the property type, such as
            string and text, then augmented by indexes already built on the data source. When the mapped Vega
            resource field has a full-text index, match and multi_match are added; keyword indexes add equality
            operations. If no local index exists because the build task has not run or completed, only type-derived
            operations are returned.
          type: array
          items:
            type: string
    PropertyConstraints:
      description: |
        BKN spec 3.0 property constraints (SPECIFICATION.md §6.8). They describe the data for understanding
        and display; nothing checks the source data against them. An update that leaves the field out keeps
        the stored value; a value replaces it whole; null or {} clears it.
      type: object
      properties:
        value_type:
          description: |
            ID of a value type of the same network (value-types.yaml) whose base_type is the property's Type.
            A property that names one writes no range, length, pattern or unit of its own.
          type: string
        range:
          description: Closed interval; numbers for a numeric property, ISO 8601 text for date, datetime and timestamp.
          type: object
          properties:
            min: {}
            max: {}
        length:
          description: Closed interval on the number of characters of a string, keyword or text property.
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        pattern:
          description: RE2 regular expression for a string, keyword or text property.
          type: string
        unit:
          description: Unit of a numeric property.
          type: string
        unique:
          description: The values are unique, apart from the primary key.
          type: boolean
        crs:
          description: Coordinate system of a location, latitude or longitude property.
          type: string
          enum: [wgs84, gcj02, bd09]
        timezone:
          description: IANA time zone a datetime value without an offset is read in.
          type: string
    MaskRule:
      description: |
        Strongly typed Column Masking rule for a data property. String rules keep string output, round keeps JSON number
        output, and date_granularity keeps the original date/time string representation. This field is optional;
        logic properties and unsupported data-property types cannot configure a Column Masking rule. Column Masking
        applies only to query results and never modifies source data.
      oneOf:
        - $ref: "#/components/schemas/FixedMaskRule"
        - $ref: "#/components/schemas/PartialMaskRule"
        - $ref: "#/components/schemas/EmailMaskRule"
        - $ref: "#/components/schemas/RoundMaskRule"
        - $ref: "#/components/schemas/DateGranularityMaskRule"
      discriminator:
        propertyName: kind
        mapping:
          fixed: "#/components/schemas/FixedMaskRule"
          partial: "#/components/schemas/PartialMaskRule"
          email: "#/components/schemas/EmailMaskRule"
          round: "#/components/schemas/RoundMaskRule"
          date_granularity: "#/components/schemas/DateGranularityMaskRule"
    FixedMaskRule:
      type: object
      additionalProperties: false
      required: [kind, replacement]
      properties:
        kind:
          type: string
          enum: [fixed]
        replacement:
          $ref: "#/components/schemas/MaskReplacement"
    PartialMaskRule:
      type: object
      additionalProperties: false
      required: [kind, keep_start, keep_end, replacement]
      properties:
        kind:
          type: string
          enum: [partial]
        keep_start:
          type: integer
          minimum: 0
          maximum: 64
        keep_end:
          type: integer
          minimum: 0
          maximum: 64
        replacement:
          $ref: "#/components/schemas/MaskReplacement"
    EmailMaskRule:
      type: object
      additionalProperties: false
      required: [kind, local_keep_start, preserve_domain, replacement]
      properties:
        kind:
          type: string
          enum: [email]
        local_keep_start:
          type: integer
          minimum: 0
          maximum: 64
        preserve_domain:
          type: boolean
        replacement:
          $ref: "#/components/schemas/MaskReplacement"
    RoundMaskRule:
      type: object
      additionalProperties: false
      required: [kind, step]
      properties:
        kind:
          type: string
          enum: [round]
        step:
          description: Finite decimal number greater than zero.
          type: number
          minimum: 0
          exclusiveMinimum: true
    DateGranularityMaskRule:
      type: object
      additionalProperties: false
      required: [kind, granularity]
      properties:
        kind:
          type: string
          enum: [date_granularity]
        granularity:
          description: Must be coarser than the declared property precision.
          type: string
          enum: [year, month, day, hour]
    MaskReplacement:
      description: One to eight printable Unicode code points.
      type: string
      minLength: 1
      maxLength: 8
