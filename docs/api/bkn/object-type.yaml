          type: string
        value:
          description: Filter value
          type: string
    condition_regex:
      description: Regular-expression filter
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          description: Filter field. Regular expressions support string field types.
          enum:
            - id
            - name
            - comment
            - data_properties.name
            - data_properties.display_name
            - data_properties.comment
            - logic_properties.name
            - logic_properties.display_name
            - logic_properties.comment
          type: string
        operation:
          description: Operator
          enum:
            - regex
          type: string
        value:
          description: Filter value
          type: string
    condition_multi_match:
      description: Multi-field full-text match
      required:
        - operation
        - value
      type: object
      properties:
        fields:
          description:
            "Filter field array. Multi-field full-text matching supports string field types. When empty, queries the field configured by index.default_field in OpenSearch. To match all fields, pass [\"*\"]. Supported fields are name, comment, detail,\
            \ *, data_properties.name, data_properties.display_name, data_properties.comment,\
            \ logic_properties.name, logic_properties.display_name, logic_properties.comment"
          type: array
          items:
            type: string
        operation:
          description: Operator
          enum:
            - multi_match
          type: string
        value:
          description: Filter value
          type: string
        match_type:
          description: Full-text match type. Defaults to best_fields.
