            - data_properties.display_name
            - data_properties.comment
            - logic_properties.name
            - logic_properties.display_name
            - logic_properties.comment
          type: string
        operation:
          description: Operator
          enum:
            - in
          type: string
        value:
          description: Filter value
          type: array
          items: {}
    condition_like:
      description: Like filter
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          description: Filter field. Like supports string field types.
          enum:
            - id
            - name
            - comment
            - data_properties.name
            - data_properties.display_name
            - data_properties.comment
            - logic_properties.name
            - logic_properties.display_name
            - logic_properties.comment
          type: string
        operation:
          description: Operator
          enum:
            - like
          type: string
        value:
          description: Filter value
          type: string
    condition_not_like:
      description: Not-like filter
      required:
        - field
