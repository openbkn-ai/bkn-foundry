  /api/bkn-backend/v1/knowledge-networks/{kn_id}/object-types/stats:
    get:
      tags:
        - ObjectType
      summary: Get object type instance counts
      operationId: getObjectTypeStats
      description: |
        Returns counts for all visible object types, or those selected by `ids`.
        Each object type requires `query_data`, matching the existing Cypher endpoint.
        Hidden object types are omitted from a network listing; explicit hidden/missing IDs
        return a not-found row. Visible types without query permission return a forbidden row.

        Without a row-permission filter, this endpoint only reads the bound Vega resource's
        `row_count` and `row_count_time`. A dataset is counted live by Vega (`source: index`);
        other resources return their latest collected exact count (`source: catalog`).
        `as_of` preserves the actual collection time. There is no BKN freshness cutoff.
        Missing counts or timestamps return `count: null` without an error or a fallback scan.
        Discovery estimates and object-index estimates are not used. Count collection/refresh
        remains a Vega responsibility; this endpoint has no cache, refresh or background job.

        Object types narrowed by row-permission filters are counted through the existing Cypher
        service under the caller's identity (`source: query`, `exact: true`). Its ordinary execution
        timeout and request cancellation apply. At most four filtered counts run per request.
        Application-level filter expressions should use the existing Cypher endpoint directly.
        A failed object type has an error on its own row; other rows are still returned.
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
        - name: ids
          description: Comma-separated object type IDs. Omit to count every object type the caller can see.
          schema:
            type: string
          in: query
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectTypeStatsResult"
              example:
                entries:
                  - id: src_orders
                    count: 52310
                    exact: true
                    source: query
                    as_of: 1790000000000
                  - id: src_events
                    count: null
                    exact: false
                  - id: region
                    count: null
                    exact: false
                    error:
                      code: BknBackend.ObjectType.NoDataSource
                      message: The Object Type Is Not Bound to a Data Resource
                total: 3
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        '401':
          description: Unauthorized
        '404':
          description: The knowledge network does not exist
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/object-types/{ot_ids}/sample-data:
    get:
      tags:
        - ObjectType
      summary: Get object type sample data
      operationId: getObjectTypeSampleData
      description: |
        Returns several actual object instances for an object type to verify mappings during modeling.
        columns gives the display order and titles. The structure of entries elements depends on the object type
        property definitions, so fixed fields are not declared.
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: ot_ids
          description: Object type ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Defaults to main.
          schema:
            type: string
            default: main
          in: query
        - name: limit
          description: Number of returned entries. Defaults to 20.
          schema:
            type: integer
            default: 20
          in: query
        - name: offset
          description: Offset. Defaults to 0.
          schema:
            type: integer
            default: 0
          in: query
        - name: need_total
          description: Whether to return total_count. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: search_after
          description: Deep-pagination cursor, separated by commas. When provided, offset is ignored.
          schema:
            type: string
          in: query
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    description: Object type display name
                    type: string
                  columns:
                    description: Column definitions that determine display order and titles
                    type: array
                    items:
                      type: object
                      properties:
                        data_index:
                          description: Property name in the corresponding entries element
                          type: string
                        title:
                          description: Column title
                          type: string
                  entries:
                    description: Sample data rows. Element properties depend on the object type definition.
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total_count:
                    description: Total count. Omitted when need_total is false.
                    type: integer
                    format: int64
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        '401':
          description: Unauthorized
