---
# BKN native metric CRUD using the object-type API framework: entries and total_count lists, POST override batch creation and concept retrieval, and validation.
openapi: 3.0.2
info:
  title: BKN Metrics
  version: 0.1.0
  description: |
    Modeling CRUD for BKN native metrics: create, list, validate, update, and delete.

    Metrics use `metric:{kn_id}/{metric_id}`. Reads and lists require
    `view_detail`; metric data requires `query_data`; updates and deletes use
    `modify` and `delete`. Lists and searches are filtered before total and
    pagination. See `../knowledge-network-authorization.md`.

    ## Supported matrix (current implementation)

    | Capability | Status | Notes |
    |------|------|------|
    | metric_type=atomic with scope_type=object_type | Writable and queryable | Supported by strict writes and ontology-query execution |
    | calculation_formula.condition, including and/or combinations | Writable | Isomorphic with ontology-query Condition; see query documentation for merge semantics |
    | time_dimension, having, and analysis_dimensions | Partially available | Fields can be persisted; verify end-to-end query behavior in ontology-query |
    | metric_type=derived and composite | Future | The schema reserves these values; strict writes and dry-run reject them and accept atomic only |
    | scope_type=subgraph | Future | The schema reserves it; writes and dry-run accept object_type only |

    ## Querying and dry-run (not in this file)

    Metric data queries and dry-run are provided by ontology-query, not BKN Backend CRUD.

    - Query persisted metrics with POST /api/ontology-query/v1/knowledge-networks/{kn_id}/metrics/{metric_id}/data
    - Run a dry-run without persistence with POST /api/ontology-query/v1/knowledge-networks/{kn_id}/metrics/dry-run
    - Request body: MetricQueryRequestBody with condition, analysis_dimensions, time, having, and limit

    See the contract in ontology-query.yaml.
    Refer to the metric data and dry-run paths and the MetricQueryRequestBody and MetricDryRun schemas.
    Consult ontology-query for condition merge semantics and the relationship between analysis_dimensions and group_by.

    Product note: object instance execution targets logical properties. Object-type aggregate metrics must use metric data or dry-run rather than the instance execution entry point.
security:
  - OAuth2: []
  - AppKey: []
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/metrics:
    get:
      summary: List metrics
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: name_pattern
          description: Fuzzy match by name. Defaults to empty.
          schema:
            type: string
          in: query
        - name: sort
          description: Sort type. Defaults to update_time.
          schema:
            enum:
              - update_time
              - name
            type: string
          in: query
        - name: direction
          description: |-
            Sort direction. Supported values are asc and desc.
            Defaults to desc.
          schema:
            enum:
              - asc
              - desc
            type: string
          in: query
        - name: offset
          description: "Offset of the first returned item. Must be greater than or equal to 0. Defaults to 0."
          schema:
            format: int64
            type: integer
          in: query
        - name: limit
          description: |-
            Maximum number of items returned per page.
            Pagination accepts 1 through 1000, and -1 disables pagination.
            Defaults to 10.
          schema:
            format: int64
            type: integer
          in: query
        - name: tag
          description: Exact match by tag. Defaults to empty.
          schema:
            type: string
          in: query
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: scope_type
          description: |
            Filter by metric scope type. The current implementation writes object_type only.
            subgraph is future work; see the supported matrix in info.description.
          schema:
            type: string
            enum:
              - object_type
              - subgraph
          in: query
        - name: scope_ref
          description: |
            Filter by the concept ID referenced by the metric scope, such as an object type ID.
            Multiple comma-separated IDs are supported; a match for any ID is returned.
            Use this to list metrics for multiple object types. When scope_ref is provided without scope_type,
            scope_type defaults to object_type.
          schema:
            type: string
          in: query
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMetrics"
    post:
      summary: Create metrics in batch or retrieve metrics by concept
      description: |
        This follows POST object-types and uses x-http-method-override to select semantics.
        - POST creates metrics in batch with a ReqMetrics entries array. Strict mode accepts metric_type=atomic and scope_type=object_type only.
        - GET retrieves by concept or condition with cursor pagination, using the same body as object type retrieval.
        Use ontology-query metric data or dry-run to query or calculate metrics after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/override"
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: x-http-method-override
          description: Request override header
          schema:
            enum:
              - POST
              - GET
            type: string
          in: header
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies during batch creation, such as scope and concept groups. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: import_mode
          description: |
            Import mode. normal reports an error for duplicate concept names; overwrite replaces them;
            ignore skips them. Defaults to normal.
          schema:
            type: string
            enum: [normal, overwrite, ignore]
            default: normal
          in: query
      responses:
        "201":
          description: Batch creation succeeded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./object-type.yaml#/components/schemas/ID"
        "200":
          description: Concept retrieval succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricSearchResponse"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/metrics/validation:
    post:
      summary: Validate metrics
      description: |
        Validates dependency existence without persisting data. Its semantics match POST object-types/validation and it is intended for pre-import and pre-batch checks.
        Response: HTTP 200 with valid=true means validation passed. valid=false includes detail.
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
        - name: strict_mode
          description: Whether to strictly validate dependencies. Defaults to true.
          schema:
            type: boolean
            default: true
          in: query
        - name: import_mode
          description: Matches batch creation semantics and validates conflicts with persisted metric IDs or names using normal, ignore, or overwrite.
          schema:
            type: string
            enum: [normal, ignore, overwrite]
            default: normal
          in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  description: Metrics to validate. Uses the same structure as the creation API.
                  items:
                    $ref: "#/components/schemas/CreateMetricRequest"
      responses:
        "200":
          description: Validation result returned. Both pass and fail can return 200.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
                  detail:
                    type: string
                    description: Explanation when valid is false
        "400":
          description: Invalid request parameters and similar errors. A business validation failure is represented by 200 with valid=false and detail.
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/metrics/{metric_ids}:
    get:
      summary: Batch get metric details
      parameters:
        - name: metric_ids
          description: Metric ID list
          schema:
            type: array
            items:
              type: string
          in: path
          required: true
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricDefinitions"
    put:
      summary: Update a metric
      description: "Updates a metric definition. The metrics/{metric_ids} route is shared with batch get and delete. Requires application/json content type."
      parameters:
        - name: kn_id
          in: path
          required: true
          schema:
            type: string
          description: Business knowledge network ID
        - name: metric_ids
          in: path
          required: true
          schema:
            type: string
          description: Metric ID
        - name: branch
          in: query
          schema:
            type: string
          description: Branch. Uses main when omitted.
        - name: strict_mode
          in: query
          schema:
            type: boolean
            default: true
          description: Whether to strictly validate dependencies. Defaults to true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMetricRequest"
      responses:
        "204":
          description: ok
    delete:
      summary: Delete metrics in batch
      parameters:
        - name: kn_id
          description: Business knowledge network ID
          schema:
            type: string
          in: path
          required: true
        - name: metric_ids
          description: Metric ID list
          schema:
            type: array
            items:
              type: string
          in: path
          required: true
        - name: branch
          description: Branch. Uses main when omitted.
          schema:
            type: string
          in: query
      responses:
        "204":
          description: ok

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'
  schemas:
    MetricUnitType:
      type: string
      description: |
        Metric unit type. The value must be one of the following enum members and matches the bkn-backend interfaces.ValidMetricUnitTypes validation.
      enum:
        - numUnit
        - storeUnit
        - percent
        - transmissionRate
        - timeUnit
        - currencyUnit
        - percentageUnit
        - countUnit
        - weightUnit
        - ordinalRankUnit
    MetricUnit:
      type: string
      description: |
        Metric unit. The value must be one of the following enum members and matches the bkn-backend interfaces.ValidMetricUnits validation.
      enum:
        - none
        - K
        - Mil
        - Bil
        - Tri
        - bit
        - Byte
        - KB
        - MB
        - GB
        - TB
        - PB
        - bps
        - Kbps
        - Mbps
        - μs
        - ms
        - s
        - m
        - h
        - day
        - week
        - month
        - year
        - quarter
        - Fen
        - Jiao
        - CNY
        - 10K_CNY
        - 1M_CNY
        - 100M_CNY
        - US_Cent
        - USD
        - EUR_Cent
        - '%'
        - ‰
        - household
        - transaction
        - piece
        - item
        - times
        - man_day
        - family
        - hand
        - sheet
        - packet
        - ton
        - kg
        - rank
    ListMetrics:
      description: Metric list, isomorphic with ListObjectTypes
      required:
        - entries
        - total_count
      type: object
      properties:
        entries:
          description: Entry list
          type: array
          items:
            $ref: "#/components/schemas/MetricDefinition"
        total_count:
          description: Total count
          type: integer
    MetricDefinitions:
      description: Batch metric detail response, isomorphic with ObjectTypeDetails
      required:
        - entries
      type: object
      properties:
        entries:
          description: Metric array
          type: array
          items:
            $ref: "#/components/schemas/MetricDefinition"
    ReqMetrics:
      description: Batch metric creation request body, isomorphic with ReqObjectTypes
      required:
        - entries
      type: object
      properties:
        entries:
          description: Metrics to create
          type: array
          items:
            $ref: "#/components/schemas/CreateMetricRequest"
    metric-override--get:
      description: Metric concept retrieval request body, isomorphic with override--get and reusing the object type retrieval schema
      oneOf:
        - $ref: "./object-type.yaml#/components/schemas/FirstQueryWithCursor"
        - $ref: "./object-type.yaml#/components/schemas/PageTurnQueryWithCursor"
      type: object
    override:
      description: POST override for batch metric creation and concept retrieval, isomorphic with the object-types override
      oneOf:
        - type: object
        - $ref: "#/components/schemas/ReqMetrics"
        - $ref: "#/components/schemas/metric-override--get"
      discriminator:
        mapping:
          x-http-method-override:POST: "#/components/schemas/ReqMetrics"
          x-http-method-override:GET: "#/components/schemas/metric-override--get"
        propertyName: x-http-method-override
      type: object
    MetricSearchResponse:
      description: Metric concept retrieval response, isomorphic with ObjectTypeSearchResponse
      required:
        - type
        - entries
      type: object
      properties:
        entries:
          description: Metric entries
          type: array
          items:
            $ref: "#/components/schemas/MetricDefinition"
        total_count:
          description: Total count
          type: integer
        next_cursor:
          description: Opaque continuation cursor. Send it back as cursor for the next page.
          type: string
        groups:
          description: Concept group information, consistent with object type retrieval
          type: array
          items: {}
        type:
          description: Resource type identifier
          type: string
    MetricTimeDimension:
      description: Time dimension, DESIGN appendix B.2
      type: object
      required:
        - property
      properties:
        property:
          type: string
          description: Time column or event-time semantic field name
        default_range_policy:
          type: string
          description: Default policy when no dynamic time is provided. none requires the request to explicitly provide a time window.
          enum:
            - last_1h
            - last_24h
            - calendar_day
            - none
      additionalProperties: false
    MetricAggregation:
      description: Single aggregation, DESIGN appendix B.1
      type: object
      required:
        - property
        - aggr
      properties:
        property:
          type: string
        aggr:
          type: string
          enum:
            - count_distinct
            - sum
            - max
            - min
            - avg
            - count
      additionalProperties: false
    MetricGroupBy:
      type: object
      required:
        - property
      properties:
        property:
          type: string
        description:
          type: string
      additionalProperties: false
    MetricOrderBy:
      type: object
      required:
        - property
        - direction
      properties:
        property:
          type: string
        direction:
          type: string
          enum:
            - asc
            - desc
      additionalProperties: false
    MetricHaving:
      description: Filter for aggregation results, DESIGN appendix B.1
      type: object
      properties:
        field:
          type: string
          enum:
            - __value
        operation:
          type: string
          enum:
            - ==
            - "!="
            - ">"
            - ">="
            - "<"
            - "<="
            - in
            - not_in
            - range
            - out_range
        value: {}
      additionalProperties: false
    MetricCalculationFormula:
      description: Metric calculation formula with a condition isomorphic with ontology-query Condition, DESIGN appendix B.1
      type: object
      required:
        - aggregation
      properties:
        condition:
          $ref: "../ontology-query/ontology-query.yaml#/components/schemas/Condition"
        aggregation:
          $ref: "#/components/schemas/MetricAggregation"
        group_by:
          type: array
          items:
            $ref: "#/components/schemas/MetricGroupBy"
        order_by:
          type: array
          items:
            $ref: "#/components/schemas/MetricOrderBy"
        having:
          $ref: "#/components/schemas/MetricHaving"
      additionalProperties: false
    MetricAnalysisDimension:
      description: Analysis dimension entry, DESIGN appendix B.2
      type: object
      required:
        - name
      properties:
        name:
          type: string
        display_name:
          type: string
      additionalProperties: false
    MetricDefinition:
      type: object
      required:
        - id
        - kn_id
        - branch
        - name
        - metric_type
        - scope_type
        - scope_ref
        - calculation_formula
      properties:
        id:
          type: string
        kn_id:
          type: string
        branch:
          type: string
        name:
          type: string
        comment:
          type: string
        tags:
          type: array
          items:
            type: string
          description: Tags, consistent with object type and relation type presentation
        icon:
          type: string
          description: Display icon identifier
        color:
          type: string
          description: Display color, either a semantic color or color value, with the same maximum length as f_color in storage
        unit_type:
          $ref: "#/components/schemas/MetricUnitType"
        unit:
          $ref: "#/components/schemas/MetricUnit"
        metric_type:
          type: string
          description: |
            Metric type. The enum reserves derived and composite for future work.
            Strict writes and ontology-query dry-run currently accept atomic only.
          enum:
            - atomic
            - derived
            - composite
        scope_type:
          type: string
          description: |
            Aggregation subject type. subgraph is future work.
            Writes and dry-run currently accept object_type only.
          enum:
            - object_type
            - subgraph
        scope_ref:
          type: string
          description: Aggregation subject reference. It is an object type ID when scope_type is object_type.
        time_dimension:
          $ref: "#/components/schemas/MetricTimeDimension"
        calculation_formula:
          $ref: "#/components/schemas/MetricCalculationFormula"
        analysis_dimensions:
          type: array
          items:
            $ref: "#/components/schemas/MetricAnalysisDimension"
        operations:
          description: Operations allowed for the current accessor on this metric.
          type: array
          items:
            type: string
    CreateMetricRequest:
      type: object
      required:
        - name
        - metric_type
        - scope_type
        - scope_ref
        - calculation_formula
      properties:
        name:
          type: string
        comment:
          type: string
        tags:
          type: array
          items:
            type: string
        icon:
          type: string
        color:
          type: string
        unit_type:
          $ref: "#/components/schemas/MetricUnitType"
        unit:
          $ref: "#/components/schemas/MetricUnit"
        metric_type:
          type: string
          description: |
            Metric type. The enum reserves derived and composite for future work.
            Strict writes currently accept atomic only.
          enum:
            - atomic
            - derived
            - composite
        scope_type:
          type: string
          description: |
            Aggregation subject type. subgraph is future work.
            Writes currently accept object_type only.
          enum:
            - object_type
            - subgraph
        scope_ref:
          type: string
          description: Aggregation subject reference. It is an object type ID when scope_type is object_type.
        time_dimension:
          $ref: "#/components/schemas/MetricTimeDimension"
        calculation_formula:
          $ref: "#/components/schemas/MetricCalculationFormula"
        analysis_dimensions:
          type: array
          items:
            $ref: "#/components/schemas/MetricAnalysisDimension"
    UpdateMetricRequest:
      type: object
      properties:
        comment:
          type: string
        tags:
          type: array
          items:
            type: string
        icon:
          type: string
        color:
          type: string
        unit_type:
          $ref: "#/components/schemas/MetricUnitType"
        unit:
          $ref: "#/components/schemas/MetricUnit"
        metric_type:
          type: string
          description: |
            Metric type. The enum reserves derived and composite for future work.
            Strict updates currently accept atomic only.
          enum:
            - atomic
            - derived
            - composite
        time_dimension:
          $ref: "#/components/schemas/MetricTimeDimension"
        calculation_formula:
          $ref: "#/components/schemas/MetricCalculationFormula"
        analysis_dimensions:
          type: array
          items:
            $ref: "#/components/schemas/MetricAnalysisDimension"
