---
openapi: 3.0.2
info:
  title: RiskType
  version: 0.1.0
  description: |-
    Risk Type management. A risk type is a lightweight concept with only a name, tags, comment, and display metadata
    (icon and color). It is not bound to action types or thresholds. All APIs are exposed under /api/bkn-backend/v1,
    require OAuth2 authentication, and default the branch query parameter to main.
security:
  - OAuth2: []
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/risk-types:
    post:
      tags:
        - RiskType
      summary: Create risk types in batch or search by criteria
      description: |-
        This endpoint uses the x-http-method-override header to select an operation:
        - An omitted header or POST creates or imports risk types in batch using entries.
        - GET searches risk types by criteria or semantics using a ConceptsQuery body.
        - Other values return 400.

        Requires an application/json content type.
      operationId: createOrSearchRiskTypes
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
        - name: x-http-method-override
          in: header
          description: Method override. Empty or POST creates in batch; GET searches.
          schema:
            type: string
            enum:
              - POST
              - GET
        - name: import_mode
          in: query
          description: |-
            Applies only to creation. normal reports existing items; ignore skips them; overwrite replaces them by ID.
          schema:
            type: string
            enum:
              - normal
              - ignore
              - overwrite
            default: normal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/RiskTypeCreateRequest"
                - $ref: "#/components/schemas/ConceptsQuery"
      responses:
        "201":
          description: Creation succeeded. Returns an array of risk type IDs for create operations only.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
        "200":
          description: Search results for search operations only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskTypesSearchResult"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
    get:
      tags:
        - RiskType
      summary: List risk types
      description: Lists risk types in a knowledge network with pagination and optional name or tag filtering.
      operationId: listRiskTypes
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
        - name: name_pattern
          in: query
          description: Fuzzy match by name or ID. Defaults to empty.
          schema:
            type: string
        - name: tag
          in: query
          description: Fuzzy match by tag. Defaults to empty.
          schema:
            type: string
        - name: offset
          in: query
          description: Offset, greater than or equal to 0. Defaults to 0.
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          description: Page size in the range [1, 1000]. A value of -1 returns all items without pagination.
          schema:
            type: integer
            format: int64
            default: 10
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum:
              - name
              - update_time
            default: update_time
        - name: direction
          in: query
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/RiskType"
                  total_count:
                    type: integer
                    format: int64
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/risk-types/{rt_id}:
    put:
      tags:
        - RiskType
      summary: Update a risk type
      description: "Fully updates one risk type. Requires application/json content type."
      operationId: updateRiskType
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: rt_id
          in: path
          required: true
          description: Risk type ID
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskTypeInput"
      responses:
        "204":
          description: Update succeeded with no response body
        "400":
          description: Invalid parameters, including an existing name
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network or risk type not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/risk-types/{rt_ids}:
    get:
      tags:
        - RiskType
      summary: Batch get risk types by ID
      description: Gets the specified risk types by ID in batch. If any ID is missing, the entire request returns 404.
      operationId: getRiskTypes
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: rt_ids
          in: path
          required: true
          description: Comma-separated risk type ID list
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/RiskType"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network or one of the risk types was not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
    delete:
      tags:
        - RiskType
      summary: Delete risk types in batch
      description: Deletes one or more risk types by ID list.
      operationId: deleteRiskTypes
      security:
        - OAuth2: []
      parameters:
        - name: kn_id
          in: path
          required: true
          description: Business knowledge network ID
          schema:
            type: string
        - name: rt_ids
          in: path
          required: true
          description: Comma-separated risk type ID list
          schema:
            type: string
        - name: branch
          in: query
          description: Branch name. Defaults to main.
          schema:
            type: string
            default: main
      responses:
        "204":
          description: Deletion succeeded with no response body
        "401":
          description: Unauthorized
        "404":
          description: Knowledge network or one of the risk types was not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for public APIs
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
  schemas:
    AccountInfo:
      type: object
      description: Account information for creators and updaters
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
    RiskType:
      type: object
      description: Risk type object
      properties:
        id:
          type: string
        name:
          type: string
          description: Name, with a maximum length of 40
        tags:
          type: array
          description: Tags, with at most 5 items
          items:
            type: string
        comment:
          type: string
          description: Comment, with a maximum length of 1000
        icon:
          type: string
        color:
          type: string
        kn_id:
          type: string
          description: Populated by the server from the path
        branch:
          type: string
          description: Populated by the server from the branch query parameter
        module_type:
          type: string
          description: Always risk_type
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          type: integer
          format: int64
          description: Creation time in Unix milliseconds
        updater:
          $ref: "#/components/schemas/AccountInfo"
        update_time:
          type: integer
          format: int64
          description: Update time in Unix milliseconds
    RiskTypeInput:
      type: object
      description: Writable risk type fields for create and update requests
      required:
        - name
      properties:
        id:
          type: string
          description: Optional. Generated automatically when empty during creation.
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        comment:
          type: string
        icon:
          type: string
        color:
          type: string
    RiskTypeCreateRequest:
      type: object
      description: Batch creation request
      required:
        - entries
      properties:
        entries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RiskTypeInput"
    RiskTypesSearchResult:
      type: object
      description: Search result envelope
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RiskType"
        total_count:
          type: integer
          format: int64
          description: Returned only when need_total is requested
        next_cursor:
          type: string
          description: Opaque continuation cursor. Send it back as cursor for the next page.
        overall_ms:
          type: integer
          format: int64
    ConceptsQuery:
      type: object
      description: Concept search query body for POST with x-http-method-override set to GET
      properties:
        concept_groups:
          type: array
          items:
            type: string
        condition:
          $ref: "#/components/schemas/Condition"
        need_total:
          type: boolean
          description: When true, the response includes total_count
        limit:
          type: integer
          description: Defaults to 10
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              direction:
                type: string
                enum:
                  - asc
                  - desc
        cursor:
          type: string
          description: next_cursor returned by the previous response.
    Condition:
      type: object
      description: Filter condition tree
      properties:
        field:
          type: string
        operation:
          type: string
        sub_conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        value_from:
          type: string
        value:
          description: Type is not fixed
