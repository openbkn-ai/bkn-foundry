openapi: 3.0.2
info:
  title: BKN 知识网络 · 事件 API
  version: 0.1.0
  description: |-
    Events of a knowledge network. An event records something that happened in the business: a rule
    found an object in an abnormal state (source `rule`), or a person reported something (source
    `report`). Events belong to the network, not to an application. Applications follow a network's
    events through the change feed and handle them in their own tasks.

    Each kind of event is an event class: an object type of the network whose `kinds` include
    `event`, maintained through the object type API (`object-type.yaml`) and carried in BKN packages
    (BKN specification §6.9). Its `event` configuration holds the source, the object type the events
    are about (`subject`), a default severity, a merge window and a handling note. The platform keeps
    the class's data source (a dataset that copies the class's events), its properties, keys and its
    relation `{id}_subject` to the subject. `event_type` in this API is the ID of the class.

    Events are written and read against the event classes of the version the network runs: the
    published version that is running in a versioned network, its main branch otherwise. A class
    only in the draft has no events until the draft is published.

    The module serves from the professional edition up. Without the license every route of this
    API, internal ones included, answers 404 as a path the server does not have; the capability
    snapshot tells what the edition lacks.

    ## Authorization

    Every operation checks one knowledge-network permission after confirming that the network exists.

    | Operations | Permission on the knowledge network |
    | --- | --- |
    | List and get events, count occurrences, report an event, verify / reject / close / reopen an event, list and record rule checks | `query_data` |

    A caller without the permission gets 403. The change feed carries no identity and checks no
    permission. See `../knowledge-network-authorization.md`.

    ## Authentication and the internal face

    The routes under `/api/bkn-backend/v1` require an OAuth2 bearer token (an AppKey is not accepted).
    Each of them has a twin under `/api/bkn-backend/in/v1` with the same method, parameters, body and
    response. The twin takes the caller from the `x-account-id` and `x-account-type` request headers
    instead of a token and is reachable only inside the cluster. The one internal-only route is the
    change feed `GET /api/bkn-backend/in/v1/knowledge-networks/{kn_id}/event-changes`, which applications
    such as Workshop read to follow a network's events.

    ## Behaviour

    - Events are kept on the network, not on a branch. The network is looked up on its main branch;
      an unknown network is 404 `BknBackend.KnowledgeNetwork.NotFound`.
    - Request bodies are JSON of at most 16 MiB; a larger body is 413 `BknBackend.KnEvent.TooLarge`.
      A field the API does not define is refused with 400 `BknBackend.KnEvent.InvalidParameter`.
      Responses are not cached. All times are Unix timestamps in milliseconds.
    - Statuses of an event: `unverified`, `verified`, `rejected`, `duplicate`, `closed`. The status
      describes the event itself; how an application handles it is recorded by that application.
    - A rule event class is fed by rule checks. The first check of an object that is not yet open
      creates a `verified` event (verified by `rule`). A check that finds an open event's object again
      only refreshes it. A check that covers an open event's object but does not hit it ends the
      abnormal period: the event becomes `closed` and gets `ended_at`. A rejected event is never
      reopened by a check, and a person's close does not end a rule event's period; a rule event
      ends only when its rule finds it over.
    - A reported event class is fed by reports. A report is `unverified` unless `verify` is true,
      which verifies it at once as the reporter. If the class has `merge_hours` above 0 and the report
      has an `object_key`, and an `unverified` or `verified` event of the same class and object has an
      `occurred_at` within the window, the new event is stored as `duplicate` with `merged_into` set
      to the first event.
    - An event class that has events cannot be deleted: the object type API answers 409
      `BknBackend.KnEvent.EventTypeInUse`. Deleting a class leaves its dataset in place.
    - The change feed keeps every change to an event. The entries for a check that only refreshed an
      event (action `checked`) are removed after 7 days; the other entries are the events' history and
      are kept.
    - Names of the reporter, verifier and actors are resolved from the user directory when the change
      is written; if the directory is unavailable the name is left empty.

    Resource IDs of knowledge networks use lowercase letters, digits, underscores and hyphens, start
    with a letter or digit, and contain at most 128 characters.
security:
  - OAuth2: []
tags:
  - name: KnEvent
    description: Events, reports, actions and occurrence counts
  - name: KnEventRuleCheck
    description: Rule checks of rule event classes
  - name: KnEventChange
    description: Internal change feed
paths:
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/events:
    get:
      tags:
        - KnEvent
      summary: List events
      description: |-
        Lists events of the knowledge network, newest recorded first (ordered by `recorded_at`, then ID,
        descending). Requires `query_data`. Entries carry no `history`. Pages are cursor based: pass the
        `next_cursor` of a page as `cursor` to get the next one; `next_cursor` is empty on the last page.
        `from` and `to` choose the events by when they occurred. An unknown status, a cursor that is not
        valid, or a `from` that is not before `to` is 400.
      operationId: listKnEvents
      parameters:
        - $ref: "#/components/parameters/KNID"
        - name: event_type
          in: query
          description: Event class IDs, comma separated or repeated. Empty values are ignored. Defaults to all classes.
          schema:
            type: string
          example: overdue_order,quality_issue
        - name: status
          in: query
          description: Statuses, comma separated, each one of `unverified`, `verified`, `rejected`, `duplicate`, `closed`. Defaults to all statuses.
          schema:
            type: string
          example: unverified,verified
        - name: object_key
          in: query
          description: Only events about the object with this key.
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size. A non-negative integer; 0 or absent gives 50, a value above 200 is reduced to 200. A negative or non-numeric value is 400.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 50
            maximum: 200
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnEventList"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - KnEvent
      summary: Report an event
      description: |-
        Reports an event of a `report` event class. Requires `query_data`. The reporter is the caller.

        The event starts `unverified`, or `verified` when `verify` is true. If the class's `merge_hours`
        is above 0, `object_key` is given and an `unverified` or `verified` event of the same class and
        object has an `occurred_at` within `merge_hours` of this one's, the new event is stored as
        `duplicate` (`verify` is then ignored) with `merged_into` set to the first matching event, and
        that event is returned too. `occurred_at` defaults to the time of the report. `object_name`
        defaults to `object_key`. `detail` is free JSON of at most 1 MiB and defaults to `{}`.

        404 `BknBackend.KnEvent.EventTypeNotFound` when the version the network runs has no such class;
        409 `BknBackend.KnEvent.SourceMismatch` if the class's source is `rule`.
      operationId: reportKnEvent
      parameters:
        - $ref: "#/components/parameters/KNID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnEventReportInput"
      responses:
        "201":
          description: Recorded. `events` holds the new event and, for a duplicate, the event it repeats (second).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnEventsResult"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/events/{event_id}:
    get:
      tags:
        - KnEvent
      summary: Get an event
      description: Returns one event with its `history`, oldest first. Requires `query_data`. 404 `BknBackend.KnEvent.EventNotFound` if the event does not exist.
      operationId: getKnEvent
      parameters:
        - $ref: "#/components/parameters/KNID"
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/events/{event_id}/{action}:
    post:
      tags:
        - KnEvent
      summary: Verify, reject, close or reopen an event
      description: |-
        Takes an action on an event. Requires `query_data`. The body is optional; when present it may
        only hold `reason`. The caller is recorded as the actor in the event's history.

        | Action | From status | To status | Reason |
        | --- | --- | --- | --- |
        | `verify` | `unverified` | `verified` (records the verifier) | optional |
        | `reject` | `unverified` | `rejected` | required |
        | `close` | `verified` | `closed` | required |
        | `reopen` | `closed` | `verified` | required |

        A `reopen` is allowed for a closed reported event at any time, and for a closed rule event only
        while its rule has not ended it (`ended_at` is 0). Closing a reported event sets `ended_at`;
        reopening it clears it. Closing a rule event does not set `ended_at`. The `actions` field of an
        event lists what it allows now.

        An action name other than the four above is 404 `Public.NotFound`. An action the status does
        not allow is 409 `BknBackend.KnEvent.ActionNotAllowed`, with error details
        `{"action": "...", "status": "..."}`. A missing required reason is 400.
      operationId: changeKnEvent
      parameters:
        - $ref: "#/components/parameters/KNID"
        - $ref: "#/components/parameters/EventID"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - verify
              - reject
              - close
              - reopen
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnEventReasonInput"
      responses:
        "200":
          description: The changed event, as `events` with one entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnEventsResult"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/event-stats:
    get:
      tags:
        - KnEvent
      summary: Count event occurrences
      description: |-
        Counts, for each event class, the events that occurred in a span. Requires `query_data`.
        Rejected and duplicate events do not count, nor does what a rule found already there on its
        first decision, or its first after the rule changed (`backlog`). `open_count` is how many of
        the counted events are `unverified` or `verified`; `last_occurred_at` is when the latest of
        them occurred. Classes with no occurrences have no entry; entries are ordered by class ID.

        The span runs from `from`, inclusive, to `to`, exclusive. With neither, it is the seven days
        up to now; with `from` alone it runs up to now, with `to` alone it is the seven days before
        `to`. The response gives the span it counted. A `from` that is not before `to` is 400.
      operationId: countKnEvents
      parameters:
        - $ref: "#/components/parameters/KNID"
        - name: event_type
          in: query
          description: Event class IDs, comma separated or repeated. Defaults to all classes.
          schema:
            type: string
        - name: object_key
          in: query
          description: Only events about the object with this key.
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnEventStats"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/bkn-backend/v1/knowledge-networks/{kn_id}/rule-checks:
    get:
      tags:
        - KnEventRuleCheck
      summary: List the last rule checks
      description: |-
        Lists the last recorded check of each rule event class the network runs, ordered by class ID.
        Requires `query_data`. A class that has never been checked has no entry. Not paginated.
      operationId: listKnEventRuleChecks
      parameters:
        - $ref: "#/components/parameters/KNID"
      responses:
        "200":
          description: The last checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnEventRuleCheckList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - KnEventRuleCheck
      summary: Record a rule check
      description: |-
        Records one run of the rule of a rule event class and applies it to the class's events.
        Requires `query_data`. 404 `BknBackend.KnEvent.EventTypeNotFound` when the version the network
        runs has no such class; 409 `BknBackend.KnEvent.SourceMismatch` if the class's source is
        `report`.

        A class that has a record-event action type in the version the network runs takes checks only
        from it: the platform runs it on its schedule and records its checks through the internal API,
        naming it in `action_type_id` (409 `BknBackend.KnEvent.RecognitionMismatch` for any other check,
        and for a check that names an action type the class does not have). The public API does not
        take `action_type_id` (400). The internal API takes the `x-bkn-execution-id` header, the action
        execution the check belongs to (1 to 40 letters, digits and `-`), and records it in the history
        of every event the check changes.

        - `status: unknown` means the rule could not decide. No event changes state; the open events of
          the class only get `last_checked_at` and `check_status: unknown` refreshed. The stored check
          keeps `last_ok`, the time of the last check that decided.
        - `status: ok` means the rule decided and `hits` is the complete result for the objects it
          read. A hit with no open event of the class for that key opens a new `verified` event; a hit
          whose object has an open event refreshes it (`rule_version`, attributes merged by property
          name, `last_checked_at`, `check_status: ok`); an open event whose object is not hit is
          closed. Duplicate keys in `hits` count once, the first one winning.
        - `covered` limits `ok` to the objects the rule read when it read only some: open events whose
          `object_key` is not listed are left as they are. Absent or `null`, the check covered all
          objects. An empty list covers none.
        - An event opened by the first `ok` check of a class, or by the first after its `rule_version`
          changed, is marked `backlog: true`: it records what had long been wrong.
        - Only events whose period is open (`ended_at` is 0) and that are not `rejected` take part in a
          check. A closed event whose period has ended is never changed by a check, so an object that
          is hit again opens a new event.
        - A closed event whose rule has not ended it does take part: a hit refreshes it, and a miss ends
          its period.

        The event's title for a hit is the class name and the object name. `hits` has at most 20000
        entries (413 beyond), each with a `key` of 1 to 250 characters. A hit's `detail` is written to
        the event it opens; a later check does not change it.
      operationId: recordKnEventRuleCheck
      parameters:
        - $ref: "#/components/parameters/KNID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnEventRuleCheckInput"
      responses:
        "200":
          description: The events the check created or changed (current state, without history) and the check recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnEventRuleCheckResult"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/bkn-backend/in/v1/knowledge-networks/{kn_id}/event-changes:
    get:
      tags:
        - KnEventChange
      summary: Read the change feed of a network's events
      description: |-
        Internal, cluster only. Returns the changes to a network's events after a sequence number, so an
        application can follow them and handle the events in its own tasks. It takes no caller identity
        and checks no permission; the network must exist (404 otherwise).

        Each write to an event appends one entry with a network-wide increasing `seq`. An entry carries
        the event's state after the write, without `history`. A page's entries are ordered by `seq`,
        ascending. To follow the feed, read with `after` set to the `last_seq` of the previous page and
        stop when `entries` is empty; `last_seq` then equals the `after` that was sent. Sequence numbers
        may have gaps, because the feed removes `checked` entries after 7 days.

        `action` is one of `reported`, `detected`, `recovered`, `recovered-after-update`, `checked`, or
        the person's actions `verify`, `reject`, `close`, `reopen`. `checked` means a rule check only
        refreshed the detection fields of an open event.
      operationId: listKnEventChanges
      security: []
      parameters:
        - $ref: "#/components/parameters/KNID"
        - name: after
          in: query
          description: Return entries with a sequence greater than this. A non-negative integer; defaults to 0, the start of the feed. A negative or non-numeric value is 400.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum entries in the page. 0 or absent gives 500; a value above 1000 is reduced to 1000. A negative or non-numeric value is 400.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 500
            maximum: 1000
      responses:
        "200":
          description: One page of the feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnEventChangeList"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
  parameters:
    KNID:
      name: kn_id
      in: path
      required: true
      description: Business knowledge network ID
      schema:
        type: string
        maxLength: 128
        pattern: "^[a-z0-9][a-z0-9_-]{0,127}$"
    From:
      name: from
      in: query
      description: Only events that occurred at or after this time. A non-negative integer; 0 or absent sets no start. A negative or non-numeric value is 400.
      schema:
        type: integer
        format: int64
        minimum: 0
    To:
      name: to
      in: query
      description: Only events that occurred before this time. A non-negative integer; 0 or absent sets no end. A negative or non-numeric value is 400.
      schema:
        type: integer
        format: int64
        minimum: 0
    EventID:
      name: event_id
      in: path
      required: true
      description: Event ID
      schema:
        type: string
  responses:
    InvalidParameter:
      description: |-
        BknBackend.KnEvent.InvalidParameter: a field or parameter is invalid, and error_details names
        it.
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Forbidden:
      description: The caller lacks the knowledge-network permission the operation needs
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotFound:
      description: |-
        The knowledge network (BknBackend.KnowledgeNetwork.NotFound), event class (BknBackend.KnEvent.EventTypeNotFound),
        event (BknBackend.KnEvent.EventNotFound) or action name (Public.NotFound) was not found. Without
        the license every route answers 404 as a path the server does not have.
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Conflict:
      description: |-
        One of BknBackend.KnEvent.SourceMismatch (error_details: `{"event_type", "source"}`),
        BknBackend.KnEvent.RecognitionMismatch (error_details: `{"event_type", "action_type_id"}`) or
        BknBackend.KnEvent.ActionNotAllowed (error_details: `{"action", "status"}`).
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    TooLarge:
      description: BknBackend.KnEvent.TooLarge. The body is over 16 MiB, `detail` is over 1 MiB, or `hits` has more than 20000 entries.
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalError:
      description: BknBackend.KnEvent.InternalError
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
  schemas:
    KnEventAttribute:
      type: object
      description: A value of the event object's property, stored as given.
      properties:
        key:
          type: string
          maxLength: 250
        label:
          type: string
          maxLength: 256
    KnEventAttributes:
      type: object
      maxProperties: 64
      description: Values by property name, at most 64; a name is 1 to 128 characters.
      additionalProperties:
        $ref: "#/components/schemas/KnEventAttribute"
    KnEventTransition:
      type: object
      description: One entry of an event's history.
      properties:
        action:
          type: string
          description: "`reported`, `detected`, `recovered`, `recovered-after-update`, `verify`, `reject`, `close` or `reopen`."
        from_status:
          type: string
        to_status:
          type: string
        actor:
          type: string
          description: Account ID; empty for a rule.
        actor_type:
          type: string
          description: Account type, or `rule` when the rule made the change.
        actor_name:
          type: string
        note:
          type: string
          description: The reason given.
        time:
          type: integer
          format: int64
        execution_id:
          type: string
          description: The action execution that made the change, for a check of a record-event action type; absent otherwise.
    KnEvent:
      type: object
      properties:
        id:
          type: string
        kn_id:
          type: string
        event_type:
          type: string
          description: ID of the event class.
        event_type_name:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - unverified
            - verified
            - rejected
            - duplicate
            - closed
        severity:
          type: string
        source:
          type: string
          enum:
            - rule
            - report
        rule_version:
          type: string
        object_type:
          type: string
          description: ID of the object type the event is about (the class's `subject`). Empty for a report without `object_key`.
        object_key:
          type: string
        object_name:
          type: string
        object_attributes:
          $ref: "#/components/schemas/KnEventAttributes"
        occurred_at:
          type: integer
          format: int64
        recorded_at:
          type: integer
          format: int64
        ended_at:
          type: integer
          format: int64
          description: When the abnormal period ended; 0 while it has not.
        first_detected_at:
          type: integer
          format: int64
          description: Rule events only.
        last_checked_at:
          type: integer
          format: int64
          description: Rule events only. When a rule check last looked at the event.
        check_status:
          type: string
          enum:
            - ok
            - unknown
          description: Rule events only. Outcome of the last check that looked at the event.
        detail:
          type: object
          additionalProperties: true
        backlog:
          type: boolean
          description: Rule events only. True for an event found by the first deciding check after the rule was set up.
        merged_into:
          type: string
          description: ID of the event a `duplicate` repeats.
        reported_by:
          type: string
        reported_by_name:
          type: string
        verified_by:
          type: string
        verified_by_type:
          type: string
          description: Account type of the verifier, or `rule` for a rule event.
        verified_by_name:
          type: string
        verified_at:
          type: integer
          format: int64
        revision:
          type: integer
          description: Starts at 1 and increases with each change to the event.
        create_time:
          type: integer
          format: int64
        update_time:
          type: integer
          format: int64
        actions:
          type: array
          description: The actions the event's status allows now.
          items:
            type: string
            enum:
              - verify
              - reject
              - close
              - reopen
        history:
          type: array
          description: Only in the response of the get operation. Oldest first.
          items:
            $ref: "#/components/schemas/KnEventTransition"
        handling:
          $ref: "#/components/schemas/KnEventHandling"
    KnEventHandling:
      type: object
      description: |
        How the platform handled the event with its class's handling action, run by itself (`handling_action.mode`
        `auto`). Absent for an event the platform does not handle.
      required: [action_type_id, status, attempts, update_time]
      properties:
        action_type_id:
          type: string
        status:
          type: string
          description: |
            `queued`: waiting to be tried, again after ontology-query could not be asked; `started`: the action is
            executing, see `execution_id` in the action logs; `needs_person`: the action type is governed and only a
            person can start it; `failed`: it could not be executed, see `message`.
          enum: [queued, started, needs_person, failed]
        execution_id:
          type: string
          description: The action execution, once started. Absent when an execution of the action on the object was already running.
        message:
          type: string
          description: Why it is waiting, needs a person or failed.
        attempts:
          type: integer
        update_time:
          type: integer
          format: int64
    KnEventList:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/KnEvent"
        next_cursor:
          type: string
          description: Empty on the last page.
    KnEventsResult:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/KnEvent"
    KnEventReportInput:
      type: object
      required:
        - event_type
        - title
      properties:
        event_type:
          type: string
          description: ID of an event class whose source is `report`.
        title:
          type: string
          maxLength: 256
          description: Title, trimmed.
        occurred_at:
          type: integer
          format: int64
          minimum: 0
          description: When it happened. Defaults to the time of the report.
        object_key:
          type: string
          maxLength: 250
        object_name:
          type: string
          maxLength: 256
        object_attributes:
          $ref: "#/components/schemas/KnEventAttributes"
        detail:
          type: object
          additionalProperties: true
          description: Free JSON of at most 1 MiB.
        verify:
          type: boolean
          default: false
          description: Verify the event at once, as its reporter.
    KnEventReasonInput:
      type: object
      properties:
        reason:
          type: string
          maxLength: 512
          description: Why. Required by `reject`, `close` and `reopen`.
    KnEventRuleHit:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 250
          description: Key of the object the rule found.
        name:
          type: string
          maxLength: 256
          description: Defaults to `key`.
        attributes:
          $ref: "#/components/schemas/KnEventAttributes"
        detail:
          type: object
          additionalProperties: true
          description: What the rule found about the object, such as a metric's value; at most 16 KiB. Written to the event the check opens.
        identity:
          type: object
          additionalProperties: true
          description: |
            The object's primary keys and their values, at most 4 KiB. The handling action of a class that runs it by
            itself is executed on it; an event found without it is not handled (`failed`).
    KnEventRuleCheckInput:
      type: object
      required:
        - event_type
        - status
      properties:
        event_type:
          type: string
          description: ID of an event class whose source is `rule`.
        action_type_id:
          type: string
          maxLength: 128
          description: Internal API only. The record-event action type whose check this is, sent by the platform.
        rule_version:
          type: string
          maxLength: 64
        status:
          type: string
          enum:
            - ok
            - unknown
        message:
          type: string
          maxLength: 1024
          description: Why the rule could not decide, for `unknown`.
        hits:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/KnEventRuleHit"
        covered:
          type: array
          nullable: true
          description: Object keys the check read, when it read only some.
          items:
            type: string
    KnEventStats:
      type: object
      properties:
        from:
          type: integer
          format: int64
          description: Start of the span counted, inclusive.
        to:
          type: integer
          format: int64
          description: End of the span counted, exclusive.
        entries:
          type: array
          description: One entry per class with occurrences, ordered by class ID; never null.
          items:
            $ref: "#/components/schemas/KnEventStatEntry"
    KnEventStatEntry:
      type: object
      properties:
        event_type:
          type: string
          description: ID of the event class.
        count:
          type: integer
          description: Events of the class that occurred in the span.
        open_count:
          type: integer
          description: Of them, the `unverified` and `verified` ones.
        last_occurred_at:
          type: integer
          format: int64
          description: When the latest of them occurred.
    KnEventRuleCheck:
      type: object
      properties:
        event_type:
          type: string
        status:
          type: string
          enum:
            - ok
            - unknown
        rule_version:
          type: string
        hits:
          type: integer
          description: Distinct hit keys of an `ok` check; 0 for `unknown`.
        message:
          type: string
        last_ok:
          type: integer
          format: int64
          description: When the rule last decided, `ok` checks; 0 if it never has.
        checked_by:
          type: string
        time:
          type: integer
          format: int64
    KnEventRuleCheckList:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/KnEventRuleCheck"
        total:
          type: integer
    KnEventRuleCheckResult:
      type: object
      properties:
        events:
          type: array
          description: Events the check created or changed, including refreshed ones.
          items:
            $ref: "#/components/schemas/KnEvent"
        check:
          $ref: "#/components/schemas/KnEventRuleCheck"
    KnEventChange:
      type: object
      properties:
        seq:
          type: integer
          format: int64
        event_id:
          type: string
        action:
          type: string
          description: "`reported`, `detected`, `recovered`, `recovered-after-update`, `checked`, `verify`, `reject`, `close` or `reopen`."
        time:
          type: integer
          format: int64
        event:
          $ref: "#/components/schemas/KnEvent"
    KnEventChangeList:
      type: object
      properties:
        entries:
          type: array
          description: Ordered by `seq`, ascending.
          items:
            $ref: "#/components/schemas/KnEventChange"
        last_seq:
          type: integer
          format: int64
          description: The largest `seq` returned, or the requested `after` when nothing is new.
