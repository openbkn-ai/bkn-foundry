openapi: 3.0.3
info:
  title: 身份与授权 · 用户自助授权 API
  version: 0.1.3
  description: |
    Allows an authenticated subject to read its own direct knowledge-network
    instance grants and the authorization registry used by the authorization
    management UI. BKN Trace uses this API to recover the exact set of
    knowledge networks managed by a network_builder.
    These reads require a currently enabled account, even when an old token
    remains active. Disabled or deleted accounts receive 401; account lookup
    failures receive 503. Successful introspection results are not cached.
    Direct-grant reads are not role permission listings and do not return role-inherited grants, wildcard
    grants, or grants belonging to another subject.
servers:
  - url: /api/safe/v1
security:
  - BearerAuth: []
paths:
  /me/logout:
    post:
      tags: [Self service]
      operationId: logoutStudioSession
      summary: Revoke the current Studio credentials before browser sign-out
      security:
        - BearerAuth: []
        - {}
      description: |
        Supply the Studio access token in Authorization and, when issued, its
        refresh token and saved ID token in the JSON body. The server introspects
        access/refresh credentials,
        rejects active tokens for any client other than openbkn-studio or for
        different subjects, and verifies the ID token's RS256 signature using
        Hydra's current JWKS, issuer, Studio audience and subject. Its signed sid
        selects only Studio consent requests in that browser login session.
        Revoking those exact consent request IDs also invalidates credentials
        rotated before sign-out. Other clients, including those in the same
        browser, and independently authorized devices are unaffected.
        The presented access/refresh tokens are also explicitly revoked and
        checked for inactivity. No user-wide or client-wide revocation is used.
        Token-only callers without an ID token revoke only presented credentials.

        A still-active refresh token can authenticate sign-out when the access
        token is absent or was revoked by a partially completed attempt. At least
        one credential is required. A signed ID token also allows retries after
        access and refresh tokens are already inactive. Expired ID tokens are
        accepted only for this session-scoped sign-out, never as API access
        credentials. Already inactive
        credentials are accepted idempotently and produce no new access log.
        A logout access fact is emitted only after confirmed revocation with a
        resolved subject; audit transport failure does not prevent logout.

        A 503 means revocation could not be confirmed and may be partial. Keep
        credentials for retry and do not report successful sign-out. Refresh
        tokens must never appear in URLs or logs. The browser must separately
        complete Hydra's OIDC end-session redirect to clear its login cookies.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  writeOnly: true
                  description: Current refresh token, when one was issued.
                id_token:
                  type: string
                  writeOnly: true
                  description: Saved Hydra ID token; required to revoke the browser session's complete token history.
      responses:
        '204':
          description: Presented credentials are inactive; browser end-session is still required.
        '400':
          description: Malformed or oversized request body.
        '401':
          description: Missing credentials or active credentials with invalid ownership or token use.
        '503':
          description: Revocation is unavailable, incomplete, or could not be verified. Retry with the same credentials.
  /me/authorization-registry:
    get:
      tags: [Self service]
      operationId: getMyAuthorizationRegistry
      summary: Get the authorization registry for the signed-in subject
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      description: |
        Returns the resource-type and operation definitions loaded and validated
        at startup, from the same snapshot used by authorization checks and writes.
        Persisted definition changes take effect after restart.
        The response contains no grants, principals, or concrete
        resource IDs. It is authenticated with `RequireUser` and is intended
        for browser authorization-management clients; service-to-service
        callers use the internal `/api/safe/v1/authz/registry` endpoint.
      responses:
        '200':
          description: Authorization resource types and their operations.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationRegistryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/knowledge-network-grants:
    get:
      tags: [Self service]
      operationId: getMyKnowledgeNetworkGrants
      summary: Get the current subject's direct knowledge-network instance grants
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      description: |
        Returns the direct grants and operation sets held by the bearer-token
        subject on concrete knowledge-network instances. Role-level or type-wide
        grants such as `knowledge_network:*` are excluded. Callers must not treat
        a role capability wildcard as permission to read business content.
      responses:
        '200':
          description: Direct knowledge-network instance grants for the current subject
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                properties:
                  grants:
                    type: array
                    items:
                      type: object
                      required: [knowledge_network_id, operations]
                      properties:
                        knowledge_network_id:
                          type: string
                          description: Concrete knowledge-network ID; never '*'
                        operations:
                          type: array
                          items:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/AccountUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Requested language for human-readable errors. Supports `zh-CN` and `en-US`.
      schema:
        type: string
        example: en-US
  headers:
    ContentLanguage:
      description: Language actually used for the localized error response.
      schema:
        type: string
        example: en-US
    PrivateNoCache:
      description: Authenticated responses allow only private caching and must be revalidated before every use.
      schema:
        type: string
        example: private, no-cache
  responses:
    Unauthorized:
      description: Missing/invalid bearer token, or a disabled/deleted account.
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BknSafeError'
    AccountUnavailable:
      description: The current account state could not be verified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BknSafeError'
    InternalError:
      description: Authorization registry or storage failure.
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BknSafeError'
  schemas:
    BknSafeError:
      description: BKN Safe error envelope with the deprecated legacy `error` alias.
      allOf:
        - $ref: '../_shared/errors.yaml#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: string
              deprecated: true
              description: Human-readable error alias for legacy clients; identical to `description`.
    AuthorizationRegistryResponse:
      type: object
      required: [resource_types]
      properties:
        resource_types:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationRegistryResourceType'
    AuthorizationRegistryResourceType:
      type: object
      required: [id, name, operations]
      properties:
        id:
          type: string
          description: Stable authorization resource-type identifier.
        name:
          type: string
          description: Display name registered for the resource type.
        parent_type:
          type: string
          description: Parent resource type from which compatible operations may inherit; omitted when none is declared.
        operations:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationRegistryOperation'
    AuthorizationRegistryOperation:
      type: object
      required: [id, name, grantable, requires]
      properties:
        id:
          type: string
          description: Stable operation identifier.
        name:
          type: string
          description: Display name registered for the operation.
        description:
          type: string
          description: Optional explanation of the operation's scope and limitations.
        grantable:
          type: boolean
          description: Whether authorization write APIs may persist allow or deny policies for this operation. Defaults to true when omitted from the seed registry.
        parent_operation:
          type: string
          description: Compatible operation on `parent_type` used for parent-resource inheritance; omitted when none is declared.
        requires:
          type: array
          description: Direct same-resource prerequisite operations. Empty when the operation has no prerequisites.
          items:
            type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
