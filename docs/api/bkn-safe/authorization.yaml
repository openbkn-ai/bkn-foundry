openapi: 3.0.3
info:
  title: bkn-safe internal authorization API
  version: 0.5.0
  description: |
    Internal service-to-service authorization contract used by BKN,
    ontology-query, context-loader, and execution-factory.

    The decision and resource-directory routes are tokenless and belong
    exclusively to the platform-internal network trust boundary defined by
    bkn-foundry #333. Callers authenticate their own public request first and
    pass the resulting concrete `accessor_id`; clients must never expose those
    endpoints through an Ingress. `/explain` is the explicit exception: it is
    a bearer-token administrator diagnostic guarded by `admin-authz:view`.

    Local authorization is a narrower intermediate mode for Vega's
    Resource-to-Catalog orchestration. It accepts only concrete `resource` and
    `catalog` references plus their approved operations. It does not introduce
    a service credential and does not trust `x-caller-service` or another
    caller-supplied service-name header for authorization. Sandbox and customer
    workloads must be isolated from this internal face by NetworkPolicy before
    local mode is deployed.

    Knowledge-network roots use `{kn_id}`. Child resources use
    `{kn_id}/{child_id}`. The supported KN resource types are
    `knowledge_network`, `concept_group`, `object_type`, `relation_type`,
    `action_type`, `metric`, and `risk_type`.

    `resource-filter` has no fixed resource, operation, or matrix-cell hard cap
    and does not define a fixed-scale 413 response. `property-levels` has a
    separate security limit of 100 object types, 200 properties per object type,
    and 1000 properties per request. Callers may dynamically chunk requests,
    but any failed or invalid chunk fails the complete business request.
servers:
  - url: /api/safe/v1/authz
security: []
paths:
  /check:
    post:
      operationId: checkAuthorization
      summary: Check one resource operation
      description: |
        `evaluation_scope` defaults to `effective`, which invokes the final
        `operation_decision` used by ordinary business callers. `local` inspects
        only base rules on the requested resource, skipping parent fallback and
        runtime enforcement of operation requirements. The response still lists
        the target operation's direct `requires`, so the trusted Vega client can
        apply them after its Resource→Catalog base merge. It is available only
        on the platform-internal network face for the Resource→Catalog relation
        Vega owns. The local result
        is input to Vega's parent fallback, not a final authorization result;
        neither local `allow` nor local `none` may by itself authorize a
        business operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
            examples:
              objectTypeQueryData:
                value:
                  accessor_id: user-a
                  resource:
                    type: object_type
                    id: supply_chain/purchase_order
                  operation: query_data
      responses:
        '200':
          description: |
            Structured decision. `allowed` remains backward compatible and is
            true exactly when `decision=allow`. Unknown and disabled accounts
            preserve their existing `{allowed:false}` response and omit the
            structured fields, so account state is not misreported as a local
            policy miss or an effective default deny.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthorizationUnavailable'
  /operations:
    post:
      operationId: listAllowedOperations
      summary: List allowed operations for one resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationsRequest'
      responses:
        '200':
          description: Allowed operations from the registered resource catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthorizationUnavailable'
  /resource-filter:
    post:
      operationId: filterAuthorizedResources
      summary: Filter trusted candidates and project their allowed operations
      description: |
        `visibility_operations` and `candidate_operations` are independent.
        A resource is returned only when every visibility operation is allowed.
        Its `operations` value is the allowed subset of candidate operations.
        An empty visibility list returns every requested resource. Omitting
        candidate operations uses each resource type's operation catalog.

        `evaluation_scope=local` is available only on the platform-internal
        network face. It accepts only concrete Resource/Catalog references and
        their approved operations, returns every requested resource regardless
        of visibility, and adds one `decisions` entry for every visibility or
        candidate operation and every direct requirement, including explicit
        `deny` and `none`. Each target entry also lists its `requires`. Vega uses
        those entries to perform the parent fallback it owns; it must not treat
        local `allowed` as final. Out-of-bound local shapes return 400 and never
        fall back to effective evaluation.
        Omitting the scope keeps the historical effective response shape.

        The response preserves first-seen candidate order and de-duplicates
        resources and operations. An unknown or disabled account returns an
        empty `resources` array. An empty candidate list is valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceFilterRequest'
            examples:
              mixedKnowledgeNetworkChildren:
                value:
                  accessor_id: user-a
                  resources:
                    - type: object_type
                      id: supply_chain/purchase_order
                    - type: metric
                      id: supply_chain/on_time_rate
                  visibility_operations: [view_detail]
                  candidate_operations: [view_detail, query_data, modify, delete, authorize]
      responses:
        '200':
          description: Filtered resources in stable candidate order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceFilterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthorizationUnavailable'
  /property-levels:
    post:
      operationId: resolveObjectPropertyAccessLevels
      summary: Resolve effective access levels for requested object properties
      description: |
        Resolves `none < schema < masked < full` in one call for the exact
        object types and properties supplied by a trusted workload. The
        workload derives `accessor_id` from its already-authenticated public
        request; it must never copy an accessor supplied by an end user.

        Core maps `query_data` to `full`, `view_detail` without `query_data` to
        `schema`, and no applicable operation to `none`. A registered Enterprise
        resolver may only narrow that base level. Community builds and
        unavailable Enterprise capability return the core mapping and cannot
        produce `masked`.

        Entries and properties preserve request order. Unknown or disabled
        accessors receive `none` for every requested property. Invalid object
        references, duplicate items, duplicate properties, and limits above
        100 object types, 200 properties per object type, or 1000 total
        properties are rejected before authorization work starts. An invalid,
        partial, or unavailable Enterprise decision returns 503; callers must
        fail the complete business request rather than infer a fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyLevelsRequest'
            examples:
              customerProperties:
                value:
                  accessor_id: user-a
                  items:
                    - object_type_ref: supply_chain/customer
                      properties: [name, mobile, id_card]
      responses:
        '200':
          description: Effective levels for every requested property in stable request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyLevelsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/AuthorizationUnavailable'
  /resources:
    get:
      operationId: listAuthorizedResourceIds
      summary: List concrete resource IDs allowed for one operation
      parameters:
        - name: accessor_id
          in: query
          required: true
          schema: {type: string}
        - name: resource_type
          in: query
          required: true
          schema: {type: string}
        - name: operation
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Concrete resource IDs. Type-wide `*` grants are excluded.
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids:
                    type: array
                    items: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthorizationUnavailable'
  /policies:
    post:
      operationId: createResourcePolicy
      summary: Grant operations on one concrete resource
      description: |
        Wildcard resource types and wildcard operations are rejected.
        `action_type:*:execute` is also rejected; Action Type execute grants
        must target a concrete `{kn_id}/{action_type_id}`.

        BKN creation uses two server-recognized lifecycle shapes. A newly
        created knowledge network sends `[full_business_access, authorize]`;
        bkn-safe atomically stores the logical Community bundle and a
        system-derived `authorize` grant. A newly created Action Type sends
        `[execute]`, stored as system-derived direct execution authority.
        Policy and authority sources are selected by bkn-safe and are never
        accepted from the request body. Other requests that pass the wildcard
        guards retain the compatibility policy writer, except that a knowledge
        network request containing `full_business_access` must match the exact
        lifecycle shape above or it is rejected with `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyWriteRequest'
      responses:
        '204': {description: Policy created}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteResourcePolicies
      summary: Delete all policies for one concrete resource
      description: |
        Deletes ordinary direct policies for the resource. If the resource still
        has policies managed by proxy grant sources, the request fails with `409`;
        callers must revoke or synchronize those sources before retrying cleanup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource]
              properties:
                resource:
                  $ref: '#/components/schemas/ResourceRef'
      responses:
        '204': {description: Policies deleted or already absent}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ManagedProxyPoliciesRemain'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listResourcePolicies
      summary: List direct policies for a resource
      parameters:
        - name: resource_type
          in: query
          required: true
          schema: {type: string}
        - name: resource_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Matching direct policies.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/PolicyEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /resource-parents:
    put:
      operationId: upsertResourceParents
      summary: Upsert concrete child-to-parent ownership edges
      description: |
        The hierarchy pair must be declared in the seeded catalog. Items are
        concrete instance IDs; wildcards and self-parent edges are rejected.
        One request accepts at most 1000 items and returns 400 when exceeded.
        This ResourceParent write cap is separate from resource-filter, which
        has no fixed candidate hard cap.
      parameters:
        - name: dry_run
          in: query
          required: false
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceParentWriteRequest'
            examples:
              objectTypeParent:
                value:
                  resource_type: object_type
                  parent_type: knowledge_network
                  items:
                    - resource_id: supply_chain/purchase_order
                      parent_id: supply_chain
      responses:
        '204': {description: 'Edges upserted, or the item list was empty'}
        '200':
          description: Dry-run preview when `dry_run=true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceParentPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteResourceParents
      summary: Delete child-to-parent edges
      description: Idempotent. One request accepts at most 1000 resource IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceParentDeleteRequest'
      responses:
        '204': {description: Edges deleted or already absent}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listResourceParents
      summary: Read stored child-to-parent edges for reconciliation
      parameters:
        - name: resource_type
          in: query
          required: true
          schema: {type: string}
        - name: parent_id
          in: query
          required: false
          schema: {type: string}
        - name: resource_id
          in: query
          required: false
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Stable page ordered by resource ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceParentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /explain:
    post:
      operationId: explainAuthorization
      summary: Explain one final operation decision
      description: |
        Authenticated administrator diagnostic endpoint. Unlike the other
        routes in this document, this route is not tokenless: the caller must
        hold `admin-authz:view`. It returns matching user/role/public Core
        grants, wildcard and parent fallback, Community bundle expansion, and
        each direct runtime requirement. The response never includes property
        names, masking rules, or data values and does not persist a proof chain.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
      responses:
        '200':
          description: On-demand structured explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': {description: Missing or invalid bearer token}
        '403': {description: Caller lacks `admin-authz:view`}
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Malformed or unsafe request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BknSafeError'
    InternalError:
      description: Authorization engine or storage failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BknSafeError'
    AuthorizationUnavailable:
      description: Account state cannot be read; no permission is granted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BknSafeError'
    ManagedProxyPoliciesRemain:
      description: Managed proxy grant sources must be removed before generic resource policy cleanup.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BknSafeError'
  schemas:
    BknSafeError:
      description: BKN Safe error envelope with the deprecated legacy `error` alias.
      allOf:
        - $ref: '../_shared/errors.yaml#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: string
              deprecated: true
              description: Legacy human-readable error alias; identical to `description`.
    ResourceRef:
      type: object
      required: [type]
      properties:
        type: {type: string}
        id: {type: string}
    CheckRequest:
      type: object
      required: [accessor_id, resource, operation]
      properties:
        accessor_id: {type: string}
        resource:
          $ref: '#/components/schemas/ResourceRef'
        operation: {type: string}
        evaluation_scope:
          $ref: '#/components/schemas/EvaluationScope'
    CheckResponse:
      type: object
      required: [allowed]
      properties:
        allowed: {type: boolean}
        evaluation_scope:
          $ref: '#/components/schemas/EvaluationScope'
        decision:
          $ref: '#/components/schemas/AuthorizationDecision'
        basis:
          $ref: '#/components/schemas/DecisionBasis'
        requires:
          type: array
          items: {type: string}
          description: Direct same-resource prerequisites declared by the operation catalog; omitted when empty.
        denied_requirement:
          type: string
          description: Present when the final decision is denied because this direct required operation was denied.
        requirement_basis:
          $ref: '#/components/schemas/DecisionBasis'
    OperationsRequest:
      type: object
      required: [accessor_id, resource]
      properties:
        accessor_id: {type: string}
        resource:
          $ref: '#/components/schemas/ResourceRef'
    OperationsResponse:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items: {type: string}
    ResourceFilterRequest:
      type: object
      required: [accessor_id]
      properties:
        accessor_id: {type: string}
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
        resource_type: {type: string}
        resource_ids:
          type: array
          items: {type: string}
        visibility_operations:
          type: array
          items: {type: string}
        candidate_operations:
          type: array
          items: {type: string}
        evaluation_scope:
          $ref: '#/components/schemas/EvaluationScope'
    FilteredResource:
      type: object
      required: [resource_type, resource_id, operations]
      properties:
        resource_type: {type: string}
        resource_id: {type: string}
        operations:
          type: array
          items: {type: string}
        decisions:
          type: array
          description: Present only for `evaluation_scope=local`.
          items:
            $ref: '#/components/schemas/OperationDecision'
    ResourceFilterResponse:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/FilteredResource'
    EvaluationScope:
      type: string
      enum: [effective, local]
      default: effective
      description: |
        Effective invokes the final operation decision. Local is a
        platform-internal base intermediate result and accepts only:
        `resource` with `view_detail|query_data`, or `catalog` with
        `view_detail|modify|delete|authorize|task_manage|resource_manage|query_data`.
        It relies on the internal network boundary rather than service
        credentials; `x-caller-service` is audit metadata and never changes the
        decision. An out-of-bound local shape returns 400.
    AuthorizationDecision:
      type: string
      enum: [allow, deny, none]
      description: "`none` is valid only for local evaluation."
    DecisionBasis:
      type: string
      enum: [direct, inherited, bundle, wildcard, default, requires, none]
      description: |
        `none` accompanies only a local `none`; `default` accompanies only an
        effective deny produced when no rule or trusted parent decides;
        `requires` denotes a final denial caused by a denied direct prerequisite.
    OperationDecision:
      type: object
      required: [operation, decision, basis]
      properties:
        operation: {type: string}
        decision:
          $ref: '#/components/schemas/AuthorizationDecision'
        basis:
          $ref: '#/components/schemas/DecisionBasis'
        requires:
          type: array
          items: {type: string}
          description: Direct same-resource prerequisites. Local callers evaluate their returned decisions after trusted parent merging.
        denied_requirement:
          type: string
          description: Present with `basis=requires`; names the denied direct prerequisite operation.
        requirement_basis:
          $ref: '#/components/schemas/DecisionBasis'
    PropertyAccessLevel:
      type: string
      enum: [none, schema, masked, full]
      description: Ordered effective visibility; unknown values are invalid and fail closed.
    PropertyLevelsRequest:
      type: object
      additionalProperties: false
      required: [accessor_id, items]
      properties:
        accessor_id:
          type: string
          minLength: 1
          description: Concrete caller identity derived by the trusted workload from its authentication context.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PropertyLevelsRequestItem'
    PropertyLevelsRequestItem:
      type: object
      additionalProperties: false
      required: [object_type_ref, properties]
      properties:
        object_type_ref:
          type: string
          minLength: 3
          maxLength: 81
          pattern: '^[a-z0-9][a-z0-9_-]{0,39}/[a-z0-9][a-z0-9_-]{0,39}$'
          description: Canonical resource ID part `<kn_id>/<ot_id>` without an `object_type:` prefix.
        properties:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,39}$'
    PropertyLevelsResponse:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PropertyLevelsEntry'
    PropertyLevelsEntry:
      type: object
      additionalProperties: false
      required: [object_type_ref, properties]
      properties:
        object_type_ref:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/PropertyLevelDecision'
    PropertyLevelDecision:
      type: object
      additionalProperties: false
      required: [name, level, source]
      properties:
        name:
          type: string
        level:
          $ref: '#/components/schemas/PropertyAccessLevel'
        source:
          type: string
          enum: [object_type, property]
          description: The layer that constrained the effective level; `property` is emitted only for an explicit property grant.
    PolicyWriteRequest:
      type: object
      required: [accessor_id, resource, operations]
      properties:
        accessor_id: {type: string}
        resource:
          $ref: '#/components/schemas/ResourceRef'
        operations:
          type: array
          items: {type: string}
    PolicyEntry:
      type: object
      required: [accessor_id, resource, operations]
      properties:
        accessor_id: {type: string}
        resource:
          $ref: '#/components/schemas/ResourceRef'
        operations:
          type: array
          items: {type: string}
        denied_operations:
          type: array
          items: {type: string}
          description: |
            Explicit deny exceptions on this accessor and resource. Omitted by
            older servers; clients that do not inspect policy administration
            details may ignore it. Runtime decision endpoints already apply
            deny precedence and keep their existing request/response shapes.
    ExplainRequest:
      type: object
      required: [accessor_id, resource, operation]
      additionalProperties: false
      properties:
        accessor_id: {type: string, minLength: 1}
        resource:
          $ref: '#/components/schemas/ResourceRef'
        operation: {type: string, minLength: 1}
    ExplainEvaluation:
      type: object
      required: [scope, decision, basis]
      properties:
        scope: {type: string, enum: [effective]}
        decision: {$ref: '#/components/schemas/AuthorizationDecision'}
        basis: {$ref: '#/components/schemas/DecisionBasis'}
        requires: {type: array, items: {type: string}}
        denied_requirement: {type: string}
        requirement_basis: {$ref: '#/components/schemas/DecisionBasis'}
    ExplainGrant:
      type: object
      required: [grant_id, subject_id, subject_kind, object, operation, effect, policy_source, authority_source, match]
      properties:
        grant_id: {type: string}
        subject_id: {type: string}
        subject_kind: {type: string, enum: [user, role, public]}
        object: {type: string}
        operation: {type: string}
        effect: {type: string, enum: [allow, deny]}
        policy_source: {type: string}
        authority_source: {type: string}
        match: {type: string, enum: [direct, wildcard, bundle]}
    ExplainStep:
      type: object
      required: [resource_type, resource_id, operation, decision, basis, matched_grants]
      properties:
        resource_type: {type: string}
        resource_id: {type: string}
        operation: {type: string}
        decision: {$ref: '#/components/schemas/AuthorizationDecision'}
        basis: {$ref: '#/components/schemas/DecisionBasis'}
        matched_grants: {type: array, items: {$ref: '#/components/schemas/ExplainGrant'}}
        inherited_from: {$ref: '#/components/schemas/ResourceRef'}
        parent_operation: {type: string}
    ExplainRequirement:
      type: object
      required: [operation, evaluation, steps]
      properties:
        operation: {type: string}
        evaluation: {$ref: '#/components/schemas/ExplainEvaluation'}
        steps: {type: array, items: {$ref: '#/components/schemas/ExplainStep'}}
    ExplainResponse:
      type: object
      required: [accessor_id, resource_type, resource_id, operation, evaluation, steps, requirements]
      properties:
        accessor_id: {type: string}
        resource_type: {type: string}
        resource_id: {type: string}
        operation: {type: string}
        evaluation: {$ref: '#/components/schemas/ExplainEvaluation'}
        steps: {type: array, items: {$ref: '#/components/schemas/ExplainStep'}}
        requirements: {type: array, items: {$ref: '#/components/schemas/ExplainRequirement'}}
        account_active:
          type: boolean
          description: False only when the requested accessor is absent or disabled.
