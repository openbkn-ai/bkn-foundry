openapi: 3.0.3
info:
  title: BKN Safe Proxy Grant Source API
  version: 0.1.5
  description: |
    Allows trusted BKN workloads to maintain least-privilege grant sources for managed proxy
    accounts. This API is available only on the internal ClusterIP surface and is not exposed
    through Ingress.

    Source records, materialization markers, authorization audit entries, and Casbin Allow
    policies are updated in one database transaction. Replaying the same source is idempotent;
    multiple sources may share one Allow policy. At runtime, a managed proxy Allow is effective
    only while at least one active source for the exact permission is currently valid. A
    `kn_proxy_binding` source is valid while its recorded delegator remains enabled and still has
    the exact downstream operation; `manual` and `admin` sources follow their explicit lifecycle.
    Manual or legacy Allow policies that predate the source are preserved and reported as
    untracked during reconciliation, but an untracked policy alone does not authorize a managed
    proxy.
servers:
  - url: /api/safe/in/v1
security: []
paths:
  /proxy-grant-sources:
    post:
      tags: [Proxy grant sources]
      operationId: createProxyGrantSource
      summary: Create or reactivate a proxy grant source
      description: |
        For `kn_proxy_binding`, the actor must be enabled, non-managed, and hold the exact operation
        being delegated; target `authorize` is not required. Replaying an active binding keeps its
        still-valid historical delegator. If that delegator is no longer valid, an actor holding
        the exact operation takes over the source. `manual` and `admin` sources continue to require
        both `authorize` and the delegated operation. The first creation or a delegator transfer
        returns 201; an unchanged replay returns 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      responses:
        '201':
          description: The source was created, together with a Casbin Allow policy when required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyGrantSource'
        '200':
          description: The same source is already active; the existing record is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyGrantSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /proxy-grant-sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Source record ID.
        schema:
          type: string
          maxLength: 64
    delete:
      tags: [Proxy grant sources]
      operationId: revokeProxyGrantSource
      summary: Revoke a proxy grant source
      description: |
        Repeated revocation is idempotent. The Allow policy is preserved while another active
        source remains; revoking the final source removes only policies owned by this service.
        A prerequisite synthesized from an operation requirement is revoked together with its
        target unless another active operation still requires it. An explicitly requested source
        is never cascade-revoked. Revoking a prerequisite that an active source still requires
        returns 409 and leaves it active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: The source was revoked or was already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyGrantSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /proxy-grant-sources/check:
    post:
      tags: [Proxy grant sources]
      operationId: checkProxyGrantSourceAuthority
      summary: Check whether an actor may establish or retain a source
      description: |
        Applies the same source-type rules as creation. A retained `kn_proxy_binding` is allowed
        when its recorded delegator is still valid even if the current knowledge-network editor
        does not hold the downstream operation. If the historical delegator is invalid, the
        current actor must hold that exact operation so synchronization can transfer the source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      responses:
        '200':
          description: The check completed; insufficient authority is represented by `allowed=false`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /proxy-grant-sources/check-batch:
    post:
      tags: [Proxy grant sources]
      operationId: checkProxyGrantSourceAuthorities
      summary: Check a complete set of KN binding sources
      description: |
        Applies the same retained-delegator and replacement rules as the single-source check,
        but loads source, operation, user, and delegator state in batches. Insufficient authority
        is returned in `denied_sources`; the request does not change source or policy state.
        `resolved_sources` records the enabled effective delegator for every allowed normalized
        source so the publishing service can perform a least-privilege dependency lookup. This
        response contract is required by bkn-backend and is not backward compatible with an older
        bkn-safe that omits the field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCheckRequest'
      responses:
        '200':
          description: The check completed; an empty denied_sources array means every source is allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCheckResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /proxy-grant-sources/sync:
    post:
      tags: [Proxy grant sources]
      operationId: syncProxyGrantSources
      summary: Synchronize the complete source set from the latest published model
      description: |
        `sources` is the proxy account's complete current set of `kn_proxy_binding` sources.
        Every new source and invalid historical delegator is checked before any mutation. A valid
        historical delegator is preserved; an invalid one is transferred to the sync actor only
        when that actor holds the exact downstream operation. If one source cannot be established
        or transferred, the entire synchronization is rejected without changing sources or
        policies. Removed entries do not affect manual sources or other active sources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Synchronization completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /proxy-grant-sources/reconcile:
    post:
      tags: [Proxy grant sources]
      operationId: reconcileProxyGrantSources
      summary: Repair drift between the source ledger and Casbin Allow policies
      description: |
        Restores Allow policies missing for currently valid active sources and removes source-owned
        Allow policies that have no currently valid active source. Invalid `kn_proxy_binding`
        sources remain active as model-binding facts, are counted in `invalid_sources`, and do not
        authorize runtime access. Existing policies without a materialization marker are reported
        in `untracked_policies` instead of being deleted, avoiding accidental removal of historical
        manual grants; they do not authorize a managed proxy without a valid source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
      responses:
        '200':
          description: Reconciliation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: The request is missing fields, exceeds length limits, contains wildcards, or targets an operation outside the proxy allowlist or operation catalog
      content:
        application/json:
          schema:
            $ref: '../_shared/errors.yaml#/components/schemas/Error'
    Forbidden:
      description: The source belongs to another knowledge network, or the actor lacks the authority required by the source type (`kn_proxy_binding` requires the exact delegated operation; `manual` and `admin` also require `authorize`)
      content:
        application/json:
          schema:
            $ref: '../_shared/errors.yaml#/components/schemas/Error'
    NotFound:
      description: The proxy account or source record does not exist
      content:
        application/json:
          schema:
            $ref: '../_shared/errors.yaml#/components/schemas/Error'
    Conflict:
      description: The proxy account is inactive, or the requested source is still required by another active operation
      content:
        application/json:
          schema:
            $ref: '../_shared/errors.yaml#/components/schemas/Error'
    InternalError:
      description: A database, Casbin, or audit write failed; in-transaction failures are rolled back, while a post-commit cache reload failure may be retried idempotently
      content:
        application/json:
          schema:
            $ref: '../_shared/errors.yaml#/components/schemas/Error'
  schemas:
    GrantRequest:
      type: object
      additionalProperties: false
      required: [proxy_account_id, grantor_id, source]
      properties:
        proxy_account_id:
          type: string
          minLength: 1
          maxLength: 64
        grantor_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Compatibility field naming the current actor; stored as `granted_by` when the actor creates, reactivates, or takes over a source.
        source:
          $ref: '#/components/schemas/SourceSpec'
    BatchCheckRequest:
      type: object
      additionalProperties: false
      required: [proxy_account_id, grantor_id, sources]
      properties:
        proxy_account_id:
          type: string
          minLength: 1
          maxLength: 64
        grantor_id:
          type: string
          minLength: 1
          maxLength: 64
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceSpec'
    RevokeRequest:
      type: object
      additionalProperties: false
      required: [grantor_id]
      properties:
        grantor_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Compatibility field naming the actor requesting synchronization.
    SyncRequest:
      type: object
      additionalProperties: false
      required: [proxy_account_id, grantor_id, sources]
      properties:
        proxy_account_id:
          type: string
          minLength: 1
          maxLength: 64
        grantor_id:
          type: string
          minLength: 1
          maxLength: 64
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceSpec'
    ReconcileRequest:
      type: object
      additionalProperties: false
      required: [requested_by]
      properties:
        proxy_account_id:
          type: string
          maxLength: 64
          description: When omitted, all managed proxy accounts are reconciled.
        requested_by:
          type: string
          minLength: 1
          maxLength: 64
    SourceSpec:
      type: object
      additionalProperties: false
      required:
        - resource_type
        - resource_id
        - operation
        - source_id
        - kn_id
        - binding_type
        - binding_id
      properties:
        resource_type:
          type: string
          enum: [resource, tool_box, mcp]
        resource_id:
          type: string
          minLength: 1
          maxLength: 128
        operation:
          type: string
          enum: [view_detail, query_data, execute]
        source_type:
          type: string
          enum: [kn_proxy_binding, manual, admin]
          default: kn_proxy_binding
        source_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable caller-generated source key; one binding may reuse it across multiple permissions.
        kn_id:
          type: string
          minLength: 1
          maxLength: 128
        binding_type:
          type: string
          minLength: 1
          maxLength: 64
        binding_id:
          type: string
          minLength: 1
          maxLength: 128
    ProxyGrantSource:
      type: object
      additionalProperties: false
      required:
        - id
        - proxy_account_id
        - resource_type
        - resource_id
        - operation
        - source_type
        - source_id
        - kn_id
        - binding_type
        - binding_id
        - requirement_derived
        - granted_by
        - lifecycle_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        proxy_account_id:
          type: string
        resource_type:
          type: string
          enum: [resource, tool_box, mcp]
        resource_id:
          type: string
        operation:
          type: string
          enum: [view_detail, query_data, execute]
        source_type:
          type: string
          enum: [kn_proxy_binding, manual, admin]
        source_id:
          type: string
        kn_id:
          type: string
        binding_type:
          type: string
        binding_id:
          type: string
        requirement_derived:
          type: boolean
          description: True only when the source was synthesized from an operation prerequisite.
        granted_by:
          type: string
        lifecycle_status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    CheckResult:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          description: Returned only when `allowed=false`; it does not contain target connection details.
    BatchCheckResult:
      type: object
      additionalProperties: false
      required: [denied_sources, resolved_sources]
      properties:
        denied_sources:
          type: array
          description: Sources that need the current actor to hold the operation but failed that check.
          items:
            $ref: '#/components/schemas/SourceSpec'
        resolved_sources:
          type: array
          description: Allowed explicit and derived sources with the effective delegator selected by preflight.
          items:
            $ref: '#/components/schemas/ResolvedSource'
    ResolvedSource:
      type: object
      additionalProperties: false
      required:
        - resource_type
        - resource_id
        - operation
        - source_id
        - kn_id
        - binding_type
        - binding_id
        - granted_by
      properties:
        resource_type:
          type: string
          enum: [resource, tool_box, mcp]
        resource_id:
          type: string
          minLength: 1
          maxLength: 128
        operation:
          type: string
          enum: [view_detail, query_data, execute]
        source_type:
          type: string
          enum: [kn_proxy_binding, manual, admin]
          default: kn_proxy_binding
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        kn_id:
          type: string
          minLength: 1
          maxLength: 128
        binding_type:
          type: string
          minLength: 1
          maxLength: 64
        binding_id:
          type: string
          minLength: 1
          maxLength: 128
        granted_by:
          type: string
          minLength: 1
    SyncResult:
      type: object
      additionalProperties: false
      required: [added, transferred, revoked, unchanged, sources]
      properties:
        added:
          type: integer
          minimum: 0
        transferred:
          type: integer
          minimum: 0
          description: Active bindings whose invalid historical delegator was replaced by the sync actor.
        revoked:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ProxyGrantSource'
    ReconcileResult:
      type: object
      additionalProperties: false
      required:
        - policies_restored
        - policies_removed
        - markers_created
        - markers_removed
        - untracked_policies
        - invalid_sources
      properties:
        policies_restored:
          type: integer
          minimum: 0
        policies_removed:
          type: integer
          minimum: 0
        markers_created:
          type: integer
          minimum: 0
        markers_removed:
          type: integer
          minimum: 0
        untracked_policies:
          type: integer
          minimum: 0
        invalid_sources:
          type: integer
          minimum: 0
          description: Active binding-source rows whose recorded delegator no longer has the exact downstream operation.
