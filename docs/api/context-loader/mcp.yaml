---
openapi: 3.0.3
info:
  title: MCP 服务
  description: |
    Context Loader 把自己的检索能力同时以 **MCP Server** 形式对外：Cursor、Claude
    Desktop 等 MCP 客户端可以直接接入，不必逐个封装 REST 调用。

    普通 Agent 默认只使用两个受管生命周期工具：`bkn_start_interaction`、
    `bkn_finish_interaction`。首轮 start 只提交问题并由服务内部创建 Conversation，
    首轮可选声明用于展示的 `agent_name`；名称在 Conversation 内固化，后续轮次省略
    或保持相同值，不允许中途变更。后续轮次复用服务端返回的 `conversation_id`；finish 只提交当前 Interaction 的
    结果，不关闭可跨轮、跨日复用的 Conversation。业务工具包括 `search_schema`、
    `query_object_instance`、`query_instance_subgraph`、`get_logic_properties_values`、
    `get_action_info`、`execute_action`、`get_action_execution`、
    `list_action_executions`、`find_skills`、`run_sql`、`list_knowledge_networks`、
    `get_kn_detail`、`get_object_types`、`get_relation_types`、`list_resources`、
    `describe_resource`、`list_skills`、`get_skill_content`、`read_skill_file`。
    另有一个默认不装配的 `execute_skill`：它把入口命令送进沙箱执行，只有显式开启
    （`EXECUTE_SKILL_ENABLED=true`）才出现在 `tools/list` 与 `GET /mcp/info`，
    未开启时与「没编译进来」无异。该开关是技能执行能力的总闸，同时决定
    `/kn/execute_skill` 这条 REST 路由是否注册。业务工具必须显式携带服务自描述 schema 中的 `bkn_context`，
    其中只要求权威返回的 `conversation_id` 和 `interaction_id`；Operation key、租约、
    重试和 closure manifest 由 Context Loader 与 BKN Trace Core 管理；
    各工具的语义与参数含义见本目录下对应的 REST 文档。

    **接入方式**：Streamable HTTP，端点 `/api/agent-retrieval/v1/mcp`，
    协议流程 `initialize` → `tools/list` → `tools/call`（JSON-RPC 2.0）。
    鉴权与 REST 一致：`Authorization: Bearer <token>`，OAuth access token 或
    `bak_` 前缀的 AppKey。宿主适配器可选使用
    `X-OpenBKN-Host-Conversation-Key` 和 `X-OpenBKN-Client-Invocation-Id`，或对应的
    `openbkn.ai/host-conversation-key`、`openbkn.ai/client-invocation-id` MCP `_meta`
    提示会话关联与调用幂等；`client-invocation-id` 可用于 start 和每一次业务工具调用，
    同一 ID 重试复用原 Interaction 或 Operation / Receipt，不同输入返回幂等冲突。
    未提供逐调用提示时，跨连接重试退化为 at-least-once。这些提示不参与身份和权限判定，
    普通 Agent 参数不得提交。

    不想先握手就想知道有哪些工具时，直接 `GET /mcp/info`——它返回完整的工具目录
    （含每个工具的输入输出 schema）与一份可直接粘贴的客户端配置。
  version: 0.1.3
servers:
  - url: /api/agent-retrieval/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /mcp/info:
    get:
      tags:
        - MCP
      summary: MCP 服务自描述文档
      operationId: getMCPInfo
      description: |
        一次 GET 拿到端点、协议、鉴权方式、全部工具的名称 / 描述 / 输入输出 schema，
        以及一份可直接用的客户端配置示例。给人看，也给 Agent 自举用。

        `endpoint` 按当次请求推导（识别 `X-Forwarded-Proto`），因此走网关访问时
        返回的就是网关地址，可直接抄进客户端配置。
      responses:
        '200':
          description: 自描述文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPInfo'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误（内嵌的工具元数据读取失败）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mcp/toolkit:
    get:
      tags:
        - MCP
      deprecated: true
      summary: PTC 工具包（旧路径，已弃用）
      operationId: getPTCToolkitLegacy
      description: |
        **已弃用，改用 `GET /mcp/ptc/toolkit`。** 响应完全相同，仅路径不同。

        旧路径描述的是 PTC 那套工具面，却挂在 `/mcp` 下面，读起来像在描述 `/mcp`——
        与 `/mcp/info` 的对称关系是错的。保留只为兼容先上线的客户端，新接入不要用。

        面向「只给模型一个写代码的工具」这种用法：模型写一段 Python，沙箱执行，
        脚本里调用本服务的能力，中间结果留在沙箱，只有 stdout 回到上下文。

        本接口一次返回客户端需要的全部素材：

        - `tools` —— 要暴露给模型的工具全表。**客户端应当遍历它建工具，不要按名字
          硬编码**，这样以后加工具是纯服务端改动。
        - `stub` —— 沙箱内的 Python 实现，随每次执行内联进脚本。
        - `sandbox_mcp_url` —— 沙箱回访本服务的**集群内**地址。沙箱用不了浏览器
          侧的网关地址，而集群内地址只有服务端知道。
        - `version` —— 上述内容的哈希，客户端据此缓存；工具表一变它就变。

        由服务端而非客户端渲染工具说明，有两个客户端做不到的地方：一是 schema 里
        没有 `bkn_context`（它是生命周期守卫在运行时向业务工具索取的），从
        `tools/list` 自行渲染的客户端会把它当成必填参数写进签名，让模型去填一个它
        没有的值；二是只有服务端知道哪些工具真正注册了。

        `digest` / `stub` / `sandbox_mcp_url` 三个顶层字段先于 `tools` 上线，保留
        为兼容字段；`digest` 与 `tools` 里 `run_code` 的 `description` 恒为同一份内容。
      responses:
        '200':
          description: 工具包
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTCToolkit'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误（内嵌的工具元数据读取失败）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mcp/ptc:
    post:
      tags:
        - MCP
      summary: PTC MCP 端点（只有 run_code / run_shell）
      operationId: postPTCMCP
      description: |
        与 `/mcp` 同为 MCP Streamable HTTP，差别只在工具面：这里**只有四个工具**

        - `bkn_start_interaction` / `bkn_finish_interaction` —— 会话生命周期
        - `run_code` —— 写一段 Python 交沙箱执行
        - `run_shell` —— 跑一条 shell 命令

        BKN 的全部能力（知识网络、对象类、实例查询、SQL）不在工具面上，而是以
        Python 函数的形式存在于 `run_code` 的沙箱里，签名清单就是 `run_code` 的工具
        描述。中间结果留在沙箱，只有 `stdout` 回到调用方的上下文。

        **为什么另开一个端点而不是加到 `/mcp` 上**：两套工具面互斥。客户端同时看到
        `run_code` 和二十来个业务工具时，模型会挑后者——一行 JSON 就能发，而
        `run_code` 要构思一段脚本。PTC 于是退化成普通工具调用，省上下文这件事也就
        不成立了。接入时二选一。

        **执行在服务端**：客户端只发代码，context-loader 带上**调用方本人的令牌**去打
        执行工厂的公开面，那边照常校验算子类型上的 `execute` 权限。因此任何 MCP
        客户端（Claude Desktop、Cursor、第三方 Agent）都能直接用，不必自己实现
        「取工具包 + 拼 handler + 打执行工厂」那一套。想自己实现的走 `GET /mcp/ptc/toolkit`。

        `run_code` 与 `run_shell` 共用同一个工作目录（按 `conversation_id` 分），
        前者写下的文件后者能直接 `wc` / `head` / `grep`。

        调用顺序：先 `bkn_start_interaction` 拿 `conversation_id` 与 `interaction_id`，
        之后每次调用都带 `bkn_context`，结束时 `bkn_finish_interaction`。

        **默认不启用。** `run_code` / `run_shell` 是沙箱执行通道，且比 `execute_skill`
        更宽（后者只能跑已注册技能的入口命令），因此服从同一道部署级总闸
        `EXECUTE_SKILL_ENABLED`（默认关）。未开启时本端点返回 404，与「没编译进来」
        无异——503 等于向探测者承认这里本该有一条执行通道。

        注意 `GET /mcp/ptc/toolkit` 与 `GET /mcp/ptc/info` **不受该开关影响**：它们只是
        文档，不执行任何东西。自建前端拿工具包后是自己去打执行工厂，那侧另有算子类型上
        的 `execute` 权限判定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 请求（`initialize` / `tools/list` / `tools/call` …）
      responses:
        '200':
          description: JSON-RPC 响应（`Accept` 含 `text/event-stream` 时为 SSE）
          content:
            application/json:
              schema:
                type: object
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '404':
          description: 执行总闸 `EXECUTE_SKILL_ENABLED` 未开启（默认）；本端点视同不存在
        '503':
          description: 总闸已开但端点装配失败（内嵌工具元数据读取失败）；`/mcp` 与 REST 端点不受影响
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mcp/ptc/toolkit:
    get:
      tags:
        - MCP
      summary: PTC 工具包（自行实现 PTC 时用）
      operationId: getPTCToolkit
      description: |
        给不走 `POST /mcp/ptc`、想自己实现 PTC 的客户端（例如自建前端）用：一次返回
        全部素材，客户端自行组装工具并打执行工厂。

        - `tools` —— 要暴露给模型的工具全表。**遍历它建工具，不要按名字硬编码**，
          这样以后加工具是纯服务端改动。
        - `stub` —— 沙箱内的 Python 实现，随每次执行内联进脚本。
        - `sandbox_mcp_url` —— 沙箱回访本服务的**集群内**地址。沙箱用不了浏览器侧的
          网关地址，而集群内地址只有服务端知道。
        - `version` —— 内容哈希，客户端据此缓存；工具表一变它就变。

        由服务端而非客户端渲染工具说明，有两个客户端做不到的地方：一是 schema 里
        没有 `bkn_context`（它是生命周期守卫在运行时向业务工具索取的），从
        `tools/list` 自行渲染的客户端会把它当成必填参数写进签名，让模型去填一个它
        没有的值；二是只有服务端知道哪些工具真正注册了。

        注意与 `POST /mcp/ptc` 的差别：那边由服务端代跑代码，`bkn_context` 是工具的
        必填入参；这里返回的 schema **不含** `bkn_context`，因为自建前端自己管会话。

        `digest` / `stub` / `sandbox_mcp_url` 三个顶层字段先于 `tools` 上线，保留为
        兼容字段；`digest` 与 `tools` 里 `run_code` 的 `description` 恒为同一份内容。
      responses:
        '200':
          description: 工具包
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTCToolkit'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误（内嵌的工具元数据读取失败）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mcp/ptc/info:
    get:
      tags:
        - MCP
      summary: PTC MCP 端点自描述文档
      operationId: getPTCMCPInfo
      description: |
        与 `GET /mcp/info` 同构，只是 `endpoint` 指向 `/mcp/ptc`。给要接 PTC 端点的
        客户端抄连接配置用。
      responses:
        '200':
          description: 自描述文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPInfo'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

  /mcp:
    post:
      tags:
        - MCP
      summary: MCP Streamable HTTP 端点
      operationId: mcpStreamableHTTP
      description: |
        标准 MCP Streamable HTTP 入口，收发 JSON-RPC 2.0 报文。请求与响应结构由
        MCP 协议定义，本文档不再复述——用现成的 MCP 客户端接入即可，不要手写调用。

        同一路径也接受协议规定的其他方法（如用于服务端推送的 `GET`、用于结束会话的
        `DELETE`），具体以 MCP 规范为准。

        `tools/list` 的每个工具除协议必备字段外，还带一组展示元数据，供客户端直接
        渲染工具目录，不必自行维护工具名到中文名的映射表：

        - `title`：展示名，MCP 协议自身的字段（2025-06-18 起）。缺失时回退到 `name`。
        - `_meta["openbkn.ai/group"]`：分组标识，稳定值，可用于分支判断。
        - `_meta["openbkn.ai/group_title"]`：分组展示名。
        - `_meta["openbkn.ai/order"]`：目录内位置，升序；未声明的排在末尾。

        `title` 与 `group_title` 随部署的语言设置本地化；`group` 与 `order` 不随语言
        变化。`_meta` 下这三项不是协议字段，不认识它们的客户端会按协议忽略。
        `GET /mcp/info` 返回同一份元数据，只是平铺成普通字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 请求（`initialize` / `tools/list` / `tools/call` 等）。
              additionalProperties: true
            examples:
              列出工具:
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: tools/list
              调用工具:
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/call
                  params:
                    name: search_schema
                    arguments:
                      kn_id: kn_medical
                      query: 药品不良反应
                      bkn_context:
                        conversation_id: conv_...
                        interaction_id: int_...
      responses:
        '200':
          description: JSON-RPC 2.0 响应或 SSE 事件流
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  schemas:
    PTCToolkit:
      type: object
      required: [version, tools, stub, sandbox_mcp_url]
      properties:
        version:
          type: string
          description: |
            内容哈希（`sha256:<hex>`），覆盖工具全表与 stub。客户端按它缓存：
            只要模型看到的工具面变了，它就变。
          example: sha256:cf2da95c884b63d0...
        tools:
          type: array
          description: |
            要暴露给模型的工具全表。遍历它建工具，不要按名字硬编码。
          items:
            $ref: '#/components/schemas/PTCTool'
        stub:
          type: string
          description: |
            沙箱侧的 Python 实现，只依赖标准库（MCP streamable HTTP 就是 JSON-RPC
            over POST，urllib 足够），沙箱镜像无需预装任何东西。

            `wrap: handler` 的工具执行时把它拼在模型代码前面。它导出 `_configure(event)`，
            由入口调用以注入 MCP 地址、凭据与 `bkn_context`，并把当前目录切到本次
            对话的工作目录。
        sandbox_mcp_url:
          type: string
          format: uri
          description: 沙箱回访本服务的集群内地址（结尾必带 `/`，缺了会 307 而 urllib 不对 POST 跟随重定向）。
          example: http://agent-retrieval:30779/api/agent-retrieval/v1/mcp/
        digest:
          type: string
          description: |
            兼容字段：等同于 `tools` 里 `run_code` 的 `description`。新客户端读 `tools` 即可。

    PTCTool:
      type: object
      required: [name, description, input_schema, language, wrap]
      properties:
        name:
          type: string
          description: 工具名，直接用作暴露给模型的工具名。
          example: run_shell
        description:
          type: string
          description: 工具描述，原样作为模型看到的说明，不要截断或改写。
        input_schema:
          type: object
          description: 入参 JSON Schema，顶层恒为 `object`。
        language:
          type: string
          enum: [python, shell]
          description: |
            直接填进执行工厂 `POST /function/execute` 的 `language` 字段。
            沙箱控制面只认 `python` / `javascript` / `shell`，填 `bash` 会被 422 拒掉。
        wrap:
          type: string
          enum: [handler, cd_workdir]
          description: |
            客户端该如何把模型的入参组装成 `code`：

            - `handler` —— 取 `stub`，后面拼 `def handler(event):`，模型的 `code` 缩进
              进函数体，首行调用 `_configure(event)`；凭据与 `bkn_context` 走 `event`
              下发（**不要用 `env_vars`**：沙箱会话是池化复用的，env 会把上一个调用方
              的值留在容器里）。
            - `cd_workdir` —— 在模型给的 `command` 前面拼一行 `cd` 到本次对话的工作
              目录，使其与 `run_code` 共用同一批文件。目录路径按下述规则由
              `conversation_id` 算出。

            工作目录规则（与 `stub` 内的实现逐字一致，两边都必须遵守）：
            把 `conversation_id` 中 `[A-Za-z0-9_-]` 以外的字符逐个替换成 `-`，截断到
            64 字符，得到 `safe`；目录为 `/workspace/conv-<safe>`，`safe` 为空时用
            `/workspace/shared`。

            用归一化而不是哈希，是因为浏览器的 `crypto.subtle` 只在安全源下可用，
            而部署常常是裸 HTTP，算不了 sha1。

    MCPInfo:
      type: object
      properties:
        service:
          type: string
          description: MCP 服务名。
          example: context-loader
        endpoint:
          type: string
          description: 本服务对外的 MCP Streamable HTTP 地址，按当次请求推导。
          example: https://example.com/api/agent-retrieval/v1/mcp
        protocol:
          type: string
          description: 协议说明。
          example: MCP / JSON-RPC 2.0 (initialize → tools/list → tools/call)
        transport:
          type: string
          description: 传输方式。
          example: Streamable HTTP
        auth:
          type: string
          description: 鉴权说明。
        tool_count:
          type: integer
          description: 工具数量。
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPToolInfo'
          description: 工具目录，按工具名字典序。
        client_config_example:
          type: object
          additionalProperties: true
          description: |
            可直接粘贴到 MCP 客户端的配置片段（`mcpServers` 形态），
            其中 Authorization 处需替换为真实凭据。

    MCPToolInfo:
      type: object
      properties:
        name:
          type: string
          description: 工具名，调用时使用的程序标识，不随展示需要变化。
        title:
          type: string
          description: |
            工具展示名（随部署语言设置本地化）。对应 `tools/list` 里 MCP 协议
            自身的 `title` 字段；客户端应优先展示它，缺失时回退到 `name`。
        group:
          type: string
          description: |
            分组标识，稳定值，供客户端分组或分支判断。当前取值：
            `lifecycle` / `discovery` / `query` / `action` / `resource`。
            扩展工具未声明时不返回。
        group_title:
          type: string
          description: 分组展示名（随部署语言设置本地化）。
        order:
          type: integer
          description: |
            目录内的排列位置，升序。未声明时不返回，客户端应把这类工具排在末尾。
        description:
          type: string
          description: 工具描述（随部署语言设置本地化）。
        input_schema:
          type: object
          additionalProperties: true
          description: 入参 JSON Schema；元数据缺失时不返回。
        output_schema:
          type: object
          additionalProperties: true
          description: 出参 JSON Schema；元数据缺失时不返回。
