---
openapi: 3.0.3
info:
  title: MCP 服务
  description: |
    Context Loader 把自己的检索能力同时以 **MCP Server** 形式对外：Cursor、Claude
    Desktop 等 MCP 客户端可以直接接入，不必逐个封装 REST 调用。

    工具集共 27 个，分两类。

    **业务工具 16 个**，与本模块的 REST 端点一一对应：`search_schema`、
    `query_object_instance`、`query_instance_subgraph`、`get_logic_properties_values`、
    `get_action_info`、`execute_action`、`get_action_execution`、
    `list_action_executions`、`find_skills`、`run_sql`、`list_knowledge_networks`、
    `get_kn_detail`、`get_object_types`、`get_relation_types`、`list_resources`、
    `describe_resource`。各工具的语义与参数含义见本目录下对应的 REST 文档。

    **业务溯源工具 11 个**，用于管理 BKN Trace 的会话与交互：
    `bkn_create_conversation`、`bkn_resume_conversation`、`bkn_close_conversation`、
    `bkn_start_interaction`、`bkn_complete_interaction`、`bkn_fail_interaction`、
    `bkn_cancel_interaction`、`bkn_handoff_interaction`、`bkn_get_operation`、
    `bkn_retry_operation`、`bkn_get_receipt`。只有需要业务级溯源的调用方才用得到，
    见下方「业务溯源上下文」。

    **接入方式**：Streamable HTTP，端点 `/api/agent-retrieval/v1/mcp`，
    协议流程 `initialize` → `tools/list` → `tools/call`（JSON-RPC 2.0）。
    鉴权与 REST 一致：`Authorization: Bearer <token>`，OAuth access token 或
    `bak_` 前缀的 AppKey，不需要其他头。

    **业务溯源上下文（`bkn_context`）**

    每个业务工具的入参里都有一个可选的 `bkn_context`，声明这次调用属于哪一轮业务
    对话。它有三个必填子字段，要么同时提供、要么整体省略，不接受只给一部分——
    缺失的字段只能凭空生成，会让回执声称一条从未发生的因果关系。

    - `conversation_id`：来自 `bkn_create_conversation` 的返回，不可自拟
    - `interaction_id`：来自 `bkn_start_interaction` 的返回，不可自拟
    - `operation_key`：调用方自取的字符串，同一次逻辑调用重试时须保持不变，
      本服务据此做幂等，重发不会重复执行

    **省略时**（Cursor、Claude Code 等通用 MCP 客户端的默认情形）：本服务按当次
    MCP 连接自动归并——一条连接对应一个会话，连接内的所有调用归入同一次交互。
    调用直接可用，无需任何额外配置，但证据链只能追溯到「哪条连接」，
    追溯不到「哪个用户提问」，且该交互不会收口，拿不到 closure manifest。

    自动会话有两处需要知晓的行为，都不需要客户端干预，但会被观察到：

    - **空闲后自动重建**。交互租约为 5 分钟，每次工具调用自动续期。连接空闲超过
      租约后，本服务在下一次调用时自动开启新交互并重试，调用照常返回，仅该次多出
      一到两次内部往返。连续多段空闲同样能恢复，上限为单次调用重建 3 代。
    - **每 128 次调用有一段恢复窗口**。一次交互最多承载 128 个操作。达到上限后，
      需等待约 5 分钟让租约自然过期、由服务端回收，其间该连接的工具调用会持续失败
      并返回 `operation_required`。恢复后自动继续，无需重连。

    断开重连会分配新的 MCP 会话，因而开启新的业务对话，此前的因果链不再延续。
    需要跨重连保持同一条证据链的调用方，应自带 `bkn_context`。

    **自带时**（bkn-agent 等持有真实业务会话的调用方）：先用溯源工具建立会话与
    交互，再把三个字段带进每次业务调用，即可获得完整的业务级溯源。

    注意 REST 面没有连接的概念，因此那 16 个端点的 `bkn_context` 仍为必填，
    与 MCP 面不同。

    **多业务域部署**：单业务域安装无需任何额外请求头。若部署时清空了
    `observability.lifecycle.default_business_domain`，则每次请求都须带
    `x-business-domain`，否则调用会被拒绝。

    不想先握手就想知道有哪些工具时，直接 `GET /mcp/info`——它返回完整的工具目录
    （含每个工具的输入输出 schema）与一份可直接粘贴的客户端配置。
  version: 0.1.3
servers:
  - url: /api/agent-retrieval/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /mcp/info:
    get:
      tags:
        - MCP
      summary: MCP 服务自描述文档
      operationId: getMCPInfo
      description: |
        一次 GET 拿到端点、协议、鉴权方式、全部工具的名称 / 描述 / 输入输出 schema，
        以及一份可直接用的客户端配置示例。给人看，也给 Agent 自举用。

        `endpoint` 按当次请求推导（识别 `X-Forwarded-Proto`），因此走网关访问时
        返回的就是网关地址，可直接抄进客户端配置。
      responses:
        '200':
          description: 自描述文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPInfo'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误（内嵌的工具元数据读取失败）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mcp:
    post:
      tags:
        - MCP
      summary: MCP Streamable HTTP 端点
      operationId: mcpStreamableHTTP
      description: |
        标准 MCP Streamable HTTP 入口，收发 JSON-RPC 2.0 报文。请求与响应结构由
        MCP 协议定义，本文档不再复述——用现成的 MCP 客户端接入即可，不要手写调用。

        同一路径也接受协议规定的其他方法（如用于服务端推送的 `GET`、用于结束会话的
        `DELETE`），具体以 MCP 规范为准。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 请求（`initialize` / `tools/list` / `tools/call` 等）。
              additionalProperties: true
            examples:
              列出工具:
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: tools/list
              调用工具:
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/call
                  params:
                    name: search_schema
                    arguments:
                      kn_id: kn_medical
                      query: 药品不良反应
      responses:
        '200':
          description: JSON-RPC 2.0 响应或 SSE 事件流
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  schemas:
    MCPInfo:
      type: object
      properties:
        service:
          type: string
          description: MCP 服务名。
          example: context-loader
        endpoint:
          type: string
          description: 本服务对外的 MCP Streamable HTTP 地址，按当次请求推导。
          example: https://example.com/api/agent-retrieval/v1/mcp
        protocol:
          type: string
          description: 协议说明。
          example: MCP / JSON-RPC 2.0 (initialize → tools/list → tools/call)
        transport:
          type: string
          description: 传输方式。
          example: Streamable HTTP
        auth:
          type: string
          description: 鉴权说明。
        tool_count:
          type: integer
          description: 工具数量。
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPToolInfo'
          description: 工具目录，按工具名字典序。
        client_config_example:
          type: object
          additionalProperties: true
          description: |
            可直接粘贴到 MCP 客户端的配置片段（`mcpServers` 形态），
            其中 Authorization 处需替换为真实凭据。

    MCPToolInfo:
      type: object
      properties:
        name:
          type: string
          description: 工具名。
        description:
          type: string
          description: 工具描述（随部署语言设置本地化）。
        input_schema:
          type: object
          additionalProperties: true
          description: 入参 JSON Schema；元数据缺失时不返回。
        output_schema:
          type: object
          additionalProperties: true
          description: 出参 JSON Schema；元数据缺失时不返回。
