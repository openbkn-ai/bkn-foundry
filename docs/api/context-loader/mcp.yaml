---
openapi: 3.0.3
info:
  title: 上下文加载 · MCP 服务 API
  description: |
    Context Loader 把自己的检索能力同时以 **MCP Server** 形式对外：Cursor、Claude
    Desktop 等 MCP 客户端可以直接接入，不必逐个封装 REST 调用。

    普通 Agent 默认只使用两个受管生命周期工具：`bkn_start_interaction`、
    `bkn_finish_interaction`。每轮 start 都提交完整问题、固定的 `agent_name` 和 `conversation_mode`：没有当前
    Conversation 时用 `new` 且不传 `conversation_id`；按显式 id 延续时用 `continue` 并传入 start 返回的 id。
    宿主提供会话映射时，以宿主映射为准。finish 只提交当前 Interaction 的
    结果，不关闭可跨轮、跨日复用的 Conversation。全部工具见下文「工具目录」。
    `run_sql`、`list_resources`、`describe_resource` 已移除：它们按调用者
    自己的数据资源授权返回物理列，绕开知识网络的属性级规则。MCP（`tools/list`、
    `tools/call`、按需网关与沙箱能力面）和 REST（`POST /kn/run_sql`、
    `POST /kn/list_resources`、`POST /kn/describe_resource`，现返回 404）都不再提供。
    业务工具必须显式携带服务自描述 schema 中的 `bkn_context`，
    其中只要求权威返回的 `conversation_id` 和 `interaction_id`；Operation key、租约、
    重试和 closure manifest 由 Context Loader 与 BKN Trace Core 管理；
    关闭 Trace 采集时，start_interaction 仍创建会话与交互并返回真实 ID；
    业务工具继续携带这些 ID 执行，但不新增 Operation、回执或证据；
    finish_interaction 仍结束交互。Trace Core 不可用时，无法创建受管控会话，
    start_interaction 不返回 ID；调用方先重试 start，不会伪造 ID。

    **接入方式**：Streamable HTTP，端点 `/api/agent-retrieval/v1/mcp`，
    协议流程 `initialize` → `tools/list` → `tools/call`（JSON-RPC 2.0）。
    鉴权与 REST 一致：`Authorization: Bearer <token>`，OAuth access token 或
    `bak_` 前缀的 AppKey。宿主适配器可选使用
    `X-OpenBKN-Host-Conversation-Key` 和 `X-OpenBKN-Client-Invocation-Id`，或对应的
    `openbkn.ai/host-conversation-key`、`openbkn.ai/client-invocation-id` MCP `_meta`
    提示会话关联与调用幂等；`client-invocation-id` 可用于 start 和每一次业务工具调用，
    同一 ID 重试复用原 Interaction 或 Operation / Receipt，不同输入返回幂等冲突。
    未提供逐调用提示时，跨连接重试退化为 at-least-once。这些提示不参与身份和权限判定，
    普通 Agent 参数不得提交。

    不想先握手就想知道有哪些工具时，直接 `GET /mcp/info`——它返回完整的工具目录
    （含每个工具的输入输出 schema）与一份可直接粘贴的客户端配置。

    **精简入口**：`/api/agent-retrieval/v1/mcp-compact` 是同一进程里的第二个 MCP
    端点，鉴权、受管生命周期和工具语义与 `/mcp` 相同，面向每次模型调用都携带全部
    工具定义的宿主。它只公布 14 个工具，其余能力经按需网关使用，见下文
    `/mcp-compact` 与 `GET /mcp-compact/info`。

    ### 工具目录

    下表是社区版的全部工具，与服务内嵌的工具元数据一一对应；部署实际公布的目录以
    `GET /mcp/info` 为准，许可证覆盖的企业版工具会额外出现在其中。「精简入口」一列
    说明该工具在 `/mcp-compact` 上是直接公布、经按需网关使用，还是只在精简入口提供。
    「参数与返回」一列指向同目录下的 REST 文档，工具的语义与参数含义以其中的同名接口
    为准；MCP 侧另需 `bkn_context`，查询类工具还可用 `response_format`（`json` 或
    `toon`）选择结果格式。逐字段的入参与输出 schema 以 `GET /mcp/info` 为准。
    没有 REST 接口的工具在下文单独说明。

    | 工具 | 分组 | 用途 | 精简入口 | 参数与返回 |
    | --- | --- | --- | --- | --- |
    | `bkn_start_interaction` | lifecycle | 为当前用户问题开始一次受管 Interaction，返回业务工具所需的 `bkn_context` | 直接公布 | 本文开头 |
    | `bkn_finish_interaction` | lifecycle | 回复用户前结束当前 Interaction；Conversation 可继续使用 | 直接公布 | 本文开头 |
    | `list_knowledge_networks` | discovery | 列出当前账号可见的知识网络，取得其余工具所需的 `kn_id` | 直接公布 | 知识网络浏览 API |
    | `get_kn_detail` | discovery | 取知识网络 Schema：概念组、对象类、关系类与行动类；规模过大的网络只返回导航壳 | 直接公布 | 知识网络浏览 API |
    | `search_schema` | discovery | 按自然语言检索相关的对象类、关系类、行动类与指标 | 直接公布 | Schema 检索 API |
    | `get_object_types` | discovery | 按 id 取对象类完整定义及可见的 `related_metrics`；不传 id 时分页列举对象类索引 | 经网关 | 知识网络浏览 API |
    | `get_relation_types` | discovery | 按 id 取关系类完整定义（含 `mapping_rules`）；不传 id 时分页列举 | 经网关 | 知识网络浏览 API |
    | `search_instance` | query | 用一句自然语言直接召回实例，并附带读懂这些实例所需的对象类精简定义 | 直接公布 | 对象实例查询 API |
    | `query_object_instance` | query | 已知对象类时按条件过滤实例，支持排序、选择字段与 cursor 翻页 | 直接公布 | 对象实例查询 API |
    | `query_instance_subgraph` | query | 沿已知关系路径拉取实例子图，支持多跳 | 直接公布 | 实例子图查询 API |
    | `explore_subgraph` | query | 不预先知道路径时，从起点对象类按方向与跳数探索关联子图 | 经网关 | 实例子图查询 API |
    | `get_logic_properties_values` | query | 为一批实例计算对象类上定义的逻辑属性 | 经网关 | 逻辑属性求值 API（`/kn/logic-property-resolver`） |
    | `run_cypher` | query | 用对象类名与关系类名写 Cypher，服务端编译为一条只读 SQL 执行；适合聚合、排名与多跳问题 | 直接公布 | Cypher 查询 API |
    | `query_metric` | query | 按已发布对象指标 V1 的固定口径取数，支持过滤、分组、排序、分页与时间范围 | 直接公布 | 逻辑属性求值 API（`/kn/query_metric`） |
    | `drill_through_metric` | query | 分页查看 `query_metric` 某个结果桶中参与计算的对象实例 | 直接公布 | 本文，见下文 |
    | `get_action_info` | action | 按行动类 ID 取业务定义、入参 schema 与结果 schema | 经网关 | 行动类定义查询与执行 API |
    | `execute_action` | action | 执行行动；执行是异步的，返回 `execution_id` | 经网关 | 行动类定义查询与执行 API |
    | `get_action_execution` | action | 按 `execution_id` 查询一次执行的整体状态与逐条结果 | 经网关 | 行动类定义查询与执行 API |
    | `list_action_executions` | action | 按行动类、状态与触发方式分页列出执行历史 | 经网关 | 行动类定义查询与执行 API |
    | `list_skills` | skill | 浏览平台已发布的 Skill；不受知识网络挂载约束，结果是目录而非权限 | 经网关 | Skill 读取与执行 API |
    | `get_skill_content` | skill | 读技能主文档 SKILL.md 与技能包文件清单 | 经网关 | Skill 读取与执行 API |
    | `read_skill_file` | skill | 读技能包内的单个文件 | 经网关 | Skill 读取与执行 API |
    | `execute_skill` | skill | 在沙箱内用 Python 执行技能包里的脚本；默认不装配，见下文 | 经网关（开启时） | Skill 读取与执行 API |
    | `search_capabilities` | tool | 在同一个排序空间里检索该网络已挂载的 Skill、函数工具（含 API 工具）与 MCP 工具 | 经网关 | 能力检索与调用 API |
    | `execute_tool` | tool | 调用一个已挂载到该网络的函数工具或 MCP 工具，返回工具原始响应 | 经网关 | 能力检索与调用 API |
    | `run_code` | execution | 在沙箱内执行一段 Python，脚本里可直接把业务工具当函数调用 | 经网关 | 本文，见下文 |
    | `run_shell` | execution | 在沙箱内执行一条 shell 命令，用于查看环境与 `run_code` 落盘的文件 | 经网关 | 本文，见下文 |
    | `search_native_tools` | gateway | 按要做的事查找按需工具，返回候选与可直接执行的 `ready` | 仅精简入口 | `/mcp-compact` |
    | `describe_native_tool` | gateway | 取一个按需工具的参数 schema 与调用模板 | 仅精简入口 | `/mcp-compact` |
    | `execute_native_tool` | gateway | 按目标工具名执行一个按需工具 | 仅精简入口 | `/mcp-compact` |

    除 `list_knowledge_networks`、`list_skills`、两个生命周期工具和三个网关工具外，
    其余工具都要求 `kn_id`。

    **`execute_skill` 的开关**：默认不装配，只有显式开启（`EXECUTE_SKILL_ENABLED=true`）
    才出现在 `tools/list` 与 `GET /mcp/info`，未开启时与「没编译进来」无异。该开关是
    技能执行能力的总闸，同时决定 `/kn/execute_skill` 这条 REST 路由是否注册。

    **`drill_through_metric`**：只对 `query_metric` 返回、且 `available_actions` 含
    `participants` 的结果桶可用；`drill` 只表示还能按分析维度继续下钻，不代表能查看参与
    实例，`status=no_data` 的桶不提供参与实例。入参：

    - `kn_id`、`metric_id`、`version`（必填）：与产生该桶的 `query_metric` 调用一致；
    - `query`（必填）：产生该桶时 `query_metric` 使用的完整 `query`，服务端会重新校验；
    - `bucket_key`（必填）：`query_metric` 对应结果条目返回的不透明桶键；
    - `page_size`（1–100，默认 100）与 `cursor`（上一页返回的 `next_cursor`）：翻页。

    返回 `participants[]`（每项含 `instance_identity` 与 `role`）、`next_cursor`、
    `bucket_value`、`evaluated_at`、`status`（`ok` 或 `partial`）与 `warnings[]`。

    **`run_code` 与 `run_shell`**：两者在沙箱内执行，共用一个按会话隔离的工作目录。

    - `run_code`：入参 `code`（Python 源码，最多 102400 个 Unicode 字符，系统包装与
      工具桩不计入）与 `timeout`（秒，默认 60）。只返回脚本 print 到 stdout 的内容，
      中间结果不进入模型上下文，过滤与聚合应在脚本内完成。脚本内可直接把业务工具当函数调用，
      无需 import；参数与各工具的输入 schema 一致，但不传 `bkn_context`（由运行时
      注入），`response_format` 固定为 `json`，返回值即该工具输出 schema 描述的对象，
      调用失败抛 `ToolError`。工具的描述按当前工具面动态生成，列出可调用的函数名。
    - `run_shell`：入参 `command`（交给 `sh -c` 执行，可用管道与 `&&`）与 `timeout`
      （秒，默认 60），返回 stdout 与 stderr。只用于查看环境与文件；读取知识网络数据应调用对应的业务工具。

    `GET /mcp/info` 返回的 `toolkit_version` 是这一工具面的内容哈希，与沙箱镜像中的
    `__toolkit_version__` 同源，用于判断镜像是否滞后于服务端。

    **权限说明（`permission_guidance`）**：`query_object_instance` 与
    `get_logic_properties_values` 在访问权限影响调用时附带该对象，两个入口相同。
    被 403 拒绝时，它加在错误正文 JSON（`isError=true`）的顶层，与 `code`、`details`
    并列；`query_object_instance` 成功但有字段脱敏 / 只可见字段名，或行访问范围
    收窄了结果时，它出现在结果顶层；调用时指定了 `properties` 的，只看这些字段。结构：`message`（按请求语言生成、可直接展示给
    用户的说明：缺什么权限、结果受什么影响，以及下一步——有申请链接时提示提交后
    等待管理员授权再重新发起，没有时提示联系管理员）、`resource`（`type=object_type`、
    `id=<kn_id>/<ot_id>`、`kn_id`、`ot_id`，调用者可查看该对象类定义时才有
    `name`）与 `shortfalls[]`。每项的 `scope` 取 bkn-safe 权限申请的
    proposal kind：`grant`（缺基础操作，附 `operations`）、`property_grants`
    （附拿不到原始值的 `properties`）、`row_filter`（结果可能不完整）。
    `request_permission_url` 是 Studio 对象类详情页打开申请弹窗的地址：请求经
    ingress 进入（带 `X-Forwarded-Host`）时为绝对地址，
    主机即调用者访问 MCP 所用的主机；集群内调用拿不到对外主机，此时为相对
    Studio 主机的路径（以 `/` 开头），由调用方补全。链接在路由模板后追加申请弹窗的
    预填参数：`operations`（grant，逗号分隔）或 `properties`（property_grants，逗号
    分隔）、按请求语言生成的默认 `reason`（URL 编码，空格为 `%20`），以及
    `source=agent`。链接只在调用者是用户账号、且能查看该对象类定义时给出；否则只说明受限，
    不给链接也不给名称。路径模板和开关由部署配置
    `permission_request.path_template` / `permission_request.disabled` 决定，
    社区版没有申请流程时应关闭。空结果或空值本身不代表权限不足。

    **Knowledge-network versions**: every tool that takes `kn_id` also takes the optional arguments
    `kn_version` (`running` by default, `draft`, or a version number of a versioned knowledge network) and
    `draft_revision` (an integer, only with `kn_version=draft`). Without the arguments, the
    connection headers `X-Kn-Version` and `X-Kn-Draft-Revision` supply the defaults; an argument
    overrides the headers as a whole. The legacy `branch` argument still works but must agree with
    `kn_version` (`main` is the running version, `draft` is the draft). A tool call reads one version
    only: the first answer of the knowledge-network services fixes it for the rest of the call, and if
    the draft moves on during a call that did not name its `draft_revision`, the call is repeated once
    against the new draft. Errors about the version are returned as the usual `Public.*` error with the
    downstream code in `error_details`: for example a version that does not exist is `Public.NotFound` with
    `BknBackend.KNVersion.VersionNotFound`, a purged one (HTTP 410) is also `Public.NotFound` with
    `BknBackend.KNVersion.VersionPurged`, and a draft that changed is `Public.Conflict` with
    `BknBackend.KNVersion.DraftRevisionMismatch`. The REST endpoints of this service take no version.
  version: 0.1.3
servers:
  - url: /api/agent-retrieval/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /mcp/info:
    get:
      tags:
        - MCP
      summary: MCP 服务自描述文档
      operationId: getMCPInfo
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      description: |
        一次 GET 拿到端点、协议、鉴权方式、全部工具的名称 / 描述 / 输入输出 schema，
        以及一份可直接用的客户端配置示例。给人看，也给 Agent 自举用。

        `endpoint` 按当次请求推导（识别 `X-Forwarded-Proto`），因此走网关访问时
        返回的就是网关地址，可直接抄进客户端配置。
      responses:
        '200':
          description: 自描述文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPInfo'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误（内嵌的工具元数据读取失败）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mcp:
    post:
      tags:
        - MCP
      summary: MCP Streamable HTTP 端点
      operationId: mcpStreamableHTTP
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      description: |
        标准 MCP Streamable HTTP 入口，收发 JSON-RPC 2.0 报文。请求与响应结构由
        MCP 协议定义，本文档不再复述——用现成的 MCP 客户端接入即可，不要手写调用。

        同一路径也接受协议规定的其他方法（如用于服务端推送的 `GET`、用于结束会话的
        `DELETE`），具体以 MCP 规范为准。

        `tools/list` 的每个工具除协议必备字段外，还带一组展示元数据，供客户端直接
        渲染工具目录，不必自行维护工具名到中文名的映射表：

        - `title`：展示名，MCP 协议自身的字段（2025-06-18 起）。缺失时回退到 `name`。
        - `_meta["openbkn.ai/group"]`：分组标识，稳定值，可用于分支判断。
        - `_meta["openbkn.ai/group_title"]`：分组展示名。
        - `_meta["openbkn.ai/order"]`：目录内位置，升序；未声明的排在末尾。

        `title` 与 `group_title` 随部署的语言设置本地化；`group` 与 `order` 不随语言
        变化。`_meta` 下这三项不是协议字段，不认识它们的客户端会按协议忽略。
        `GET /mcp/info` 返回同一份元数据，只是平铺成普通字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 请求（`initialize` / `tools/list` / `tools/call` 等）。
              additionalProperties: true
            examples:
              列出工具:
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: tools/list
              调用工具:
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/call
                  params:
                    name: search_schema
                    arguments:
                      kn_id: kn_medical
                      query: 药品不良反应
                      bkn_context:
                        conversation_id: conv_...
                        interaction_id: int_...
      responses:
        '200':
          description: JSON-RPC 2.0 响应或 SSE 事件流
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

  /mcp-compact/info:
    get:
      tags:
        - MCP
      summary: 精简入口自描述文档
      operationId: getCompactMCPInfo
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      description: |
        `/mcp-compact` 的自描述，结构与 `GET /mcp/info` 相同，区别只有：

        - `endpoint` 指向精简入口；
        - `tools` 只含本入口公布的 14 个工具，schema 与本入口 `tools/list` 一致
          （业务工具无输出 schema，`bkn_context` 只声明两个 ID，见 `/mcp-compact`）；
        - 不返回 `toolkit_version`：该哈希描述的是 `/mcp` 公布的工具面，也是沙箱镜像
          构建时对齐的对象；本入口经网关可达沙箱执行工具，但不公布它们，要比对版本
          请用 `GET /mcp/info`。
      responses:
        '200':
          description: 自描述文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPInfo'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误（内嵌的工具元数据读取失败）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mcp-compact:
    post:
      tags:
        - MCP
      summary: 精简入口的 MCP Streamable HTTP 端点
      operationId: compactMCPStreamableHTTP
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      description: |
        与 `/mcp` 相同的 MCP Streamable HTTP 协议、鉴权与受管生命周期，工具定义更少，
        适合每次模型调用都携带全部工具定义的宿主。

        **公布的工具**（固定 14 个，不随连接变化）：

        - 生命周期：`bkn_start_interaction`、`bkn_finish_interaction`；
        - 直接查询：`list_knowledge_networks`、`get_kn_detail`、`search_schema`、
          `search_instance`、`query_object_instance`、`query_metric`、
          `drill_through_metric`、`run_cypher`、`query_instance_subgraph`；
        - 按需网关：`search_native_tools`、`describe_native_tool`、`execute_native_tool`。

        **按需网关**：`/mcp` 上的其余业务工具（含 `explore_subgraph`、
        `execute_action`、`search_capabilities`、`execute_tool`、技能工具、沙箱执行工具
        `run_code` / `run_shell`，以及许可证覆盖的企业版工具）不出现在 `tools/list`，
        经网关使用：

        1. `search_native_tools`：用一句话说明要做的事，返回候选工具及其适用场景。
           只有一个候选明显胜出、且它的参数 schema 不超过 4000 字节时，结果里还会带
           `ready`：`{name, arguments_schema, call_template}`，与
           `describe_native_tool` 对同一个名字的回答逐字节一致，直接据此执行即可；
        2. `describe_native_tool`：取目标的参数 schema 与调用模板。上一步给了
           `ready` 就不必再调；候选打平或 schema 过大时才需要这一跳；
        3. `execute_native_tool`：`name` 填目标工具名，`arguments` 填目标参数，
           `bkn_context` 放在外层。目标按自身名称经过与直接调用相同的许可证闸门和受管
           guard，Trace 记录的是目标工具名。

        本入口未公布的工具直接用 `tools/call` 调用时，按不存在的工具返回协议标准错误。

        **与 `/mcp` 的差异**：

        - 业务工具不公布输出 schema，也不接受 `response_format`；结果为文本，
          受管回执放在结果的 `_meta["openbkn.ai/receipt"]`，不返回
          `structuredContent`。两个生命周期工具的结果与 `/mcp` 相同。
        - 输入 schema 中的 `bkn_context` 只声明 `conversation_id` 与
          `interaction_id`；`business_refs` 等其余字段仍被接受。
        - 传入工具未声明的参数时直接拒绝（`unknown_arguments`，附允许的参数列表），
          拒绝发生在受管 Operation 创建之前。
        - `execute_native_tool` 会解析字符串形式的 `arguments`，并去掉与外层一致的
          内层 `bkn_context`；发生这类归一时，实际执行的参数回显在结果的
          `_meta["openbkn.ai/normalized_arguments"]`。

        **网关的拒绝码**（结果 `isError=true`，正文为 JSON，`error` 字段取值如下）：

        | 取值 | 含义 |
        | --- | --- |
        | `unknown_tool` | 网关里没有这个名字；正文说明挂载函数与技能的正确调用方式 |
        | `published_directly` | 目标已在本入口直接公布，应直接调用 |
        | `invalid_arguments` | 参数不符合目标 schema；附 `violations`，schema 不超过 8000 字符时一并返回 |
        | `schema_too_large` | 目标的参数 schema 超过 8000 字符，`describe_native_tool` 不返回 |
        | `bkn_context_mismatch` | 内层 `bkn_context` 与外层不一致 |
        | `response_format_not_accepted` | 目标参数里带了 `response_format` |
        | `unknown_arguments` | 调用了未声明的参数 |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 请求（`initialize` / `tools/list` / `tools/call` 等）。
              additionalProperties: true
            examples:
              经网关调用:
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: execute_native_tool
                    arguments:
                      name: run_cypher
                      arguments:
                        kn_id: kn_demo
                        query: MATCH (o:orders) RETURN o.status, count(o.id) AS n
                      bkn_context:
                        conversation_id: conv_...
                        interaction_id: int_...
      responses:
        '200':
          description: JSON-RPC 2.0 响应或 SSE 事件流
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: |
        可选的 RFC 9110 语言偏好。服务从支持的 `zh-CN`、`en-US` 中选择工具目录
        （`title` / `description` / schema 描述）与服务端说明的语言。

        MCP 协议本身不定义语言协商，`initialize` 参数里没有 locale 字段，所以这个
        传输层请求头是唯一的通道。客户端在 MCP 连接配置的 `headers` 里设置它。

        不传则使用部署配置的服务默认语言，无需客户端参与。**每个请求独立判定**，
        不与 `Mcp-Session-Id` 绑定。

  schemas:
    MCPInfo:
      type: object
      properties:
        service:
          type: string
          description: MCP 服务名。
          example: context-loader
        endpoint:
          type: string
          description: 本服务对外的 MCP Streamable HTTP 地址，按当次请求推导。
          example: https://example.com/api/agent-retrieval/v1/mcp
        protocol:
          type: string
          description: 协议说明。
          example: MCP / JSON-RPC 2.0 (initialize → tools/list → tools/call)
        transport:
          type: string
          description: 传输方式。
          example: Streamable HTTP
        auth:
          type: string
          description: 鉴权说明。
        language:
          type: string
          enum: [zh-CN, en-US]
          description: |
            本次响应实际使用的语言，即工具目录（`title` / `description` / schema
            描述）与服务端说明的语言。由请求的 `Accept-Language` 决定；不传或不支持
            时为部署配置的服务默认语言。
          example: zh-CN
        supported_languages:
          type: array
          items:
            type: string
          description: 本服务支持的语言标签。
          example: [zh-CN, en-US]
        tool_count:
          type: integer
          description: 工具数量。
        toolkit_version:
          type: string
          description: |
            当前工具面的内容哈希，与沙箱镜像里的 `__toolkit_version__` 同源同算法。
            镜像滞后于服务端时，症状只是签名对不上、失败信息里看不出根因；
            比对这两个值即可判定。
            `GET /mcp-compact/info` 不返回此字段。
          example: "sha256:55dd56a2d9df5a549923c85826e6cfeec4a49c4f3fce6a25f19bd7c807d24843"
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPToolInfo'
          description: 工具目录，按工具名字典序。
        client_config_example:
          type: object
          additionalProperties: true
          description: |
            可直接粘贴到 MCP 客户端的配置片段（`mcpServers` 形态），
            其中 Authorization 处需替换为真实凭据。

    MCPToolInfo:
      type: object
      properties:
        name:
          type: string
          description: 工具名，调用时使用的程序标识，不随展示需要变化。
        title:
          type: string
          description: |
            工具展示名（随部署语言设置本地化）。对应 `tools/list` 里 MCP 协议
            自身的 `title` 字段；客户端应优先展示它，缺失时回退到 `name`。
        group:
          type: string
          description: |
            分组标识，稳定值，供客户端分组或分支判断。当前取值：
            `lifecycle` / `discovery` / `query` / `action` / `resource` /
            `skill` / `tool` / `execution` / `gateway`（`gateway` 只出现在精简入口）。
            扩展工具未声明时不返回。
        group_title:
          type: string
          description: 分组展示名（随部署语言设置本地化）。
        order:
          type: integer
          description: |
            目录内的排列位置，升序。未声明时不返回，客户端应把这类工具排在末尾。
        description:
          type: string
          description: 工具描述（随部署语言设置本地化）。
        input_schema:
          type: object
          additionalProperties: true
          description: 入参 JSON Schema；元数据缺失时不返回。
        output_schema:
          type: object
          additionalProperties: true
          description: 出参 JSON Schema；元数据缺失时不返回。
