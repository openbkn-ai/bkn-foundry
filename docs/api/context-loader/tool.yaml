---
openapi: 3.0.3
info:
  title: 已发布工具的检索与调用
  description: |
    把执行工厂里已注册、已发布的**函数工具**（Toolbox Tool，`metadata_type=function`）
    交给调用方使用：`search_tools` 找到工具并拿回业务入参契约，`execute_tool` 以调用者
    自己的身份执行它。

    **`search_tools` 目前是列举加字面过滤，不是语义召回**。执行工厂没有跨工具箱的工具
    枚举端点，也还没有可供 embedding 的工具数据集，所以本接口按当前账户可见的已发布
    工具箱逐个取回已启用工具，再按名称、说明、使用规则与工具箱名做大小写不敏感的子串
    匹配。「能算汇率的工具」这类问法答不了，换关键词或留空 `query` 通览更有效。契约按
    「传检索词、拿有界列表」写，等 #1009 的工具数据集落地后换掉排序实现即可，调用方无感。

    **可见性与权限押在下游**：两条接口都带调用者原始令牌打执行工厂的公开 API，工具箱是否
    对该账户可见、工具是否允许执行由执行工厂判定，Context Loader 不代为放行。

    **`execute_tool` 有不可回滚的副作用**：注册进来的函数可以对外部系统写入。调用前先读
    `search_tools` 返回的 `description` 与 `use_rule`。服务端先在「当前账户可调用的已启用
    工具」列表里核对 `tool_id`，不在其中直接 400，不会打到执行代理。

    **托管 Interaction**：请求体里的 `bkn_context` 可选。带上时，`conversation_id` 与
    `interaction_id` 会随调用透传到执行工厂，被调函数因而落在同一个 Interaction 下，
    证据链完整；不带则只执行、不归因。

    **认证**：`Authorization: Bearer <token>`（OAuth access token 或 `bak_` AppKey）。
  version: 0.1.5
servers:
  - url: /api/agent-retrieval/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /kn/search_tools:
    post:
      tags:
        - Tool
      summary: 检索可调用的已发布函数工具
      operationId: searchTools
      x-contract-probe:
        readonly: true
        order: 1
        body:
          limit: 3
      description: |
        返回当前账户可调用的已发布函数工具。每条命中都带 `tool_id`、`toolbox_id` 与裁剪
        过的 `input_schema`（只保留业务入参，服务地址等传输信息不下发），可直接用于构造
        `execute_tool` 调用。

        `limit` 默认 20、上限 100：每条命中都带一份入参 schema，调大会显著占用上下文。
        命中数超过 `limit` 时 `truncated=true` 并给出 `message`。

        单个工具箱取列表失败时跳过该箱而不是整体失败：一个被撤销或损坏的工具箱不该让
        调用方看不到其余所有工具。

        **空结果是 200 不是错误**：无匹配时 `tools: []` 并带 `message` 说明。
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/ResponseFormat'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchToolsRequest'
            examples:
              全部:
                value: {}
              按关键词:
                value:
                  query: 汇率
                  limit: 10
              限定工具箱:
                value:
                  toolbox_id: box_finance
      responses:
        '200':
          description: 可调用的已发布工具列表，可能为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchToolsResponse'
              examples:
                有结果:
                  value:
                    tools:
                      - tool_id: tool_fx_convert
                        toolbox_id: box_finance
                        toolbox_name: 财务工具箱
                        name: fx_convert
                        description: 按指定日期汇率换算金额
                        use_rule: 只用于已结算币种，未结算单据先调 settle_order
                        input_schema:
                          request_body:
                            content:
                              application/json:
                                schema:
                                  type: object
                                  properties:
                                    amount:
                                      type: number
                                    from:
                                      type: string
                                    to:
                                      type: string
                    total_matched: 1
                空结果:
                  value:
                    tools: []
                    total_matched: 0
                    message: 没有匹配的已发布工具。请先在执行工厂注册工具、发布所属工具箱并启用工具，或放宽 query、去掉 toolbox_id 后重试。
            application/toon:
              schema:
                type: string
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '502':
          description: 上游 execution-factory 不可用
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

  /kn/execute_tool:
    post:
      tags:
        - Tool
      summary: 执行一个已发布函数工具
      operationId: executeTool
      description: |
        以调用者身份执行工具，返回工具的原始响应。

        `toolbox_id` 与 `tool_id` 必须取自 `search_tools`；`arguments` 按其返回的
        `input_schema` 填，只放业务参数——令牌、会话 id 等传输信息由平台携带，写进
        `arguments` 既不生效也会被记进调用参数。

        **函数自身报错同样是 200**：调用成功不等于业务成功，需读响应体判断。

        工具已停用、所属工具箱未发布，或当前账户无权访问时返回 400，`message` 说明原因，
        请求不会打到执行代理。
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteToolRequest'
            examples:
              调用:
                value:
                  toolbox_id: box_finance
                  tool_id: tool_fx_convert
                  arguments:
                    amount: 1200
                    from: USD
                    to: CNY
              归因到当前 Interaction:
                value:
                  bkn_context:
                    conversation_id: conv_01J8Z
                    interaction_id: int_01J8Z
                  toolbox_id: box_finance
                  tool_id: tool_fx_convert
                  arguments:
                    amount: 1200
                    from: USD
                    to: CNY
      responses:
        '200':
          description: 工具原始响应
          content:
            application/json:
              schema:
                type: object
                description: 工具自身的响应体，结构由该工具的 OpenAPI 契约决定。
                additionalProperties: true
        '400':
          description: 缺少 toolbox_id / tool_id，或该工具不在可调用的已启用工具列表中
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '502':
          description: 上游 execution-factory 不可用
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 可选的 RFC 9110 语言偏好。服务从支持的 `zh-CN`、`en-US` 中选择响应错误文本语言。
    ResponseFormat:
      name: response_format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - toon
        default: json
      description: 响应格式。`toon` 返回 `application/toon`，同构数组压成表格，省 token。

  headers:
    ContentLanguage:
      description: 仅当响应包含本地化人类可读文本时返回，值为实际使用的语言。
      schema:
        type: string

  schemas:
    SearchToolsRequest:
      type: object
      properties:
        bkn_context:
          $ref: '../_shared/common.yaml#/components/schemas/BKNContext'
        query:
          type: string
          description: |
            可选。按工具名、说明、使用规则与工具箱名匹配，大小写不敏感的字面子串匹配。
            留空返回当前账户可调用的全部工具。
          example: 汇率
        toolbox_id:
          type: string
          description: 可选。只在该工具箱内检索，取自本接口此前返回的 `toolbox_id`。
          example: box_finance
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: 可选。最多返回多少个工具。每条命中都带入参 schema。

    SearchToolsResponse:
      type: object
      properties:
        tools:
          type: array
          description: 当前账户可调用的已发布函数工具。
          items:
            $ref: '#/components/schemas/ToolEntry'
        total_matched:
          type: integer
          description: 匹配到的工具总数，可能大于 `tools` 长度。
        truncated:
          type: boolean
          description: 为 true 表示命中数超过 `limit`，只返回了前若干条。
        message:
          type: string
          description: 空结果或截断说明。

    ToolEntry:
      type: object
      properties:
        tool_id:
          type: string
          description: 工具 ID，连同 `toolbox_id` 一起传给 `execute_tool`。
        toolbox_id:
          type: string
          description: 所属工具箱 ID，`execute_tool` 必填。
        toolbox_name:
          type: string
          description: 所属工具箱名称。
        name:
          type: string
          description: 工具名。
        description:
          type: string
          description: 工具说明。
        use_rule:
          type: string
          description: 使用规则，注册者对调用时机与约束的说明。
        input_schema:
          type: object
          description: |
            业务入参契约，取自工具 OpenAPI 规格的 `parameters` / `request_body` /
            `components.schemas`，服务地址等传输信息已裁掉。
          additionalProperties: true

    ExecuteToolRequest:
      type: object
      required:
        - toolbox_id
        - tool_id
        - arguments
      properties:
        bkn_context:
          $ref: '../_shared/common.yaml#/components/schemas/BKNContext'
        toolbox_id:
          type: string
          description: 工具箱 ID，取自 `search_tools`。
          example: box_finance
        tool_id:
          type: string
          description: 工具 ID，取自 `search_tools`。
          example: tool_fx_convert
        arguments:
          type: object
          description: 工具的业务入参，按 `search_tools` 返回的 `input_schema` 填写。
          additionalProperties: true
