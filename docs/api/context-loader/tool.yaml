---
openapi: 3.0.3
info:
  title: 已发布工具的检索与调用
  description: |
    把执行工厂里已注册、已发布的**函数工具**（Toolbox Tool，`metadata_type=function`）
    交给调用方使用：`search_tools` 找到工具并拿回业务入参契约，`execute_tool` 以调用者
    自己的身份执行它。

    **范围是知识网络挂载的函数**。`kn_id` 必填：两条接口的候选集都取自该知识网络已挂载
    的 Function 绑定，收窄粒度是**工具**而不是工具箱——同一个工具箱里可以只有部分工具
    挂到本网络，未挂载的那些既搜不到也调不了。网络未挂载任何函数时返回空列表并给出提示，
    不会退回「当前账户可见的全部工具」。

    **可见性是两者的交集**：挂载决定这个网络用哪些工具，调用者自身权限决定他能否看到与
    执行。回填入参 schema 时带调用者原始令牌打执行工厂公开 API，该账户看不到的工具箱里
    的命中会被丢弃，不会列出一个 `execute_tool` 随后会拒绝的工具。

    **`execute_tool` 有不可回滚的副作用**：注册进来的函数可以对外部系统写入。调用前先读
    `search_tools` 返回的 `description` 与 `use_rule`。服务端执行前先核两道：工具必须已挂载
    到该知识网络，且在「当前账户可调用的已启用工具」列表里；任一不满足直接 400，不会打到
    执行代理。收窄检索面本身不构成管控——工具 ID 会活过产生它的那次检索。

    **托管 Interaction**：请求体里的 `bkn_context` 可选。带上时，`conversation_id` 与
    `interaction_id` 会随调用透传到执行工厂，被调函数因而落在同一个 Interaction 下，
    证据链完整；不带则只执行、不归因。

    **认证**：`Authorization: Bearer <token>`（OAuth access token 或 `bak_` AppKey）。
  version: 0.1.5
servers:
  - url: /api/agent-retrieval/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /kn/search_tools:
    post:
      tags:
        - Tool
      summary: 检索可调用的已发布函数工具
      operationId: searchTools
      x-contract-probe:
        readonly: true
        order: 1
        body:
          limit: 3
      description: |
        返回该知识网络已挂载、且当前账户可调用的函数工具。每条命中都带 `tool_id`、
        `toolbox_id` 与裁剪过的 `input_schema`（只保留业务入参，服务地址等传输信息不下发），
        可直接用于构造 `execute_tool` 调用。

        `limit` 默认 20、上限 100：每条命中都带一份入参 schema，调大会显著占用上下文。
        命中数超过 `limit` 时 `truncated=true` 并给出 `message`。

        回填 schema 时单个工具箱取列表失败会跳过该箱而不是整体失败：一个被撤销或损坏的
        工具箱不该让调用方看不到其余所有工具。

        **空结果是 200 不是错误**：无匹配时 `tools: []` 并带 `message` 说明。
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/ResponseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchToolsRequest'
            examples:
              全部已挂载:
                value:
                  kn_id: supply_chain
              按关键词:
                value:
                  kn_id: supply_chain
                  query: 汇率
                  limit: 10
              限定工具箱:
                value:
                  kn_id: supply_chain
                  toolbox_id: box_finance
      responses:
        '200':
          description: 可调用的已发布工具列表，可能为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchToolsResponse'
              examples:
                有结果:
                  value:
                    tools:
                      - tool_id: tool_fx_convert
                        toolbox_id: box_finance
                        toolbox_name: 财务工具箱
                        name: fx_convert
                        description: 按指定日期汇率换算金额
                        use_rule: 只用于已结算币种，未结算单据先调 settle_order
                        input_schema:
                          request_body:
                            content:
                              application/json:
                                schema:
                                  type: object
                                  properties:
                                    amount:
                                      type: number
                                    from:
                                      type: string
                                    to:
                                      type: string
                    total_matched: 1
                空结果:
                  value:
                    tools: []
                    total_matched: 0
                    message: 没有匹配的已发布工具。请先在执行工厂注册工具、发布所属工具箱并启用工具，或放宽 query、去掉 toolbox_id 后重试。
            application/toon:
              schema:
                type: string
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '502':
          description: 上游 execution-factory 不可用
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

  /kn/execute_tool:
    post:
      tags:
        - Tool
      summary: 执行一个已发布函数工具
      operationId: executeTool
      description: |
        以调用者身份执行工具，返回工具的原始响应。

        `toolbox_id` 与 `tool_id` 必须取自 `search_tools`；`arguments` 按其返回的
        `input_schema` 填，只放业务参数——令牌、会话 id 等传输信息由平台携带，写进
        `arguments` 既不生效也会被记进调用参数。

        **函数自身报错同样是 200**：调用成功不等于业务成功，需读响应体判断。

        工具已停用、所属工具箱未发布，或当前账户无权访问时返回 400，`message` 说明原因，
        请求不会打到执行代理。
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteToolRequest'
            examples:
              调用:
                value:
                  toolbox_id: box_finance
                  tool_id: tool_fx_convert
                  arguments:
                    amount: 1200
                    from: USD
                    to: CNY
              归因到当前 Interaction:
                value:
                  bkn_context:
                    conversation_id: conv_01J8Z
                    interaction_id: int_01J8Z
                  toolbox_id: box_finance
                  tool_id: tool_fx_convert
                  arguments:
                    amount: 1200
                    from: USD
                    to: CNY
      responses:
        '200':
          description: 工具原始响应
          content:
            application/json:
              schema:
                type: object
                description: 工具自身的响应体，结构由该工具的 OpenAPI 契约决定。
                additionalProperties: true
        '400':
          description: 缺少 toolbox_id / tool_id，或该工具不在可调用的已启用工具列表中
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '502':
          description: 上游 execution-factory 不可用
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 可选的 RFC 9110 语言偏好。服务从支持的 `zh-CN`、`en-US` 中选择响应错误文本语言。
    ResponseFormat:
      name: response_format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - toon
        default: json
      description: 响应格式。`toon` 返回 `application/toon`，同构数组压成表格，省 token。

  headers:
    ContentLanguage:
      description: 仅当响应包含本地化人类可读文本时返回，值为实际使用的语言。
      schema:
        type: string

  schemas:
    SearchToolsRequest:
      type: object
      required:
        - kn_id
      properties:
        bkn_context:
          $ref: '../_shared/common.yaml#/components/schemas/BKNContext'
        kn_id:
          type: string
          description: |
            知识网络 ID。工具范围取自该网络已挂载的 Function 绑定；未挂载任何函数时返回
            空列表并给出提示。
          example: supply_chain
        query:
          type: string
          description: |
            可选。在该网络已挂载的工具内按名称与说明排序。留空则列出全部已挂载工具。
          example: 汇率
        toolbox_id:
          type: string
          description: |
            可选。只在该工具箱已挂载到本网络的工具内检索，不会越出挂载范围。取自本接口
            此前返回的 `toolbox_id`。
          example: box_finance
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: 可选。最多返回多少个工具。每条命中都带入参 schema。

    SearchToolsResponse:
      type: object
      properties:
        tools:
          type: array
          description: 该知识网络已挂载、且当前账户可调用的函数工具。
          items:
            $ref: '#/components/schemas/ToolEntry'
        total_matched:
          type: integer
          description: 匹配到的工具总数，可能大于 `tools` 长度。
        truncated:
          type: boolean
          description: 为 true 表示命中数超过 `limit`，只返回了前若干条。
        message:
          type: string
          description: 空结果或截断说明。

    ToolEntry:
      type: object
      properties:
        tool_id:
          type: string
          description: 工具 ID，连同 `toolbox_id` 一起传给 `execute_tool`。
        toolbox_id:
          type: string
          description: 所属工具箱 ID，`execute_tool` 必填。
        toolbox_name:
          type: string
          description: 所属工具箱名称。
        name:
          type: string
          description: 工具名。
        description:
          type: string
          description: 工具说明。
        use_rule:
          type: string
          description: 使用规则，注册者对调用时机与约束的说明。
        input_schema:
          type: object
          description: |
            业务入参契约，取自工具 OpenAPI 规格的 `parameters` / `request_body` /
            `components.schemas`，服务地址等传输信息已裁掉。
          additionalProperties: true

    ExecuteToolRequest:
      type: object
      required:
        - kn_id
        - toolbox_id
        - tool_id
        - arguments
      properties:
        bkn_context:
          $ref: '../_shared/common.yaml#/components/schemas/BKNContext'
        kn_id:
          type: string
          description: |
            知识网络 ID，须与 `search_tools` 所用一致。工具必须已挂载到该网络才可调用。
          example: supply_chain
        toolbox_id:
          type: string
          description: 工具箱 ID，取自 `search_tools`。
          example: box_finance
        tool_id:
          type: string
          description: 工具 ID，取自 `search_tools`。
          example: tool_fx_convert
        arguments:
          type: object
          description: 工具的业务入参，按 `search_tools` 返回的 `input_schema` 填写。
          additionalProperties: true
