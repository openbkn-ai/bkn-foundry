---
openapi: 3.0.3
info:
  title: 上下文加载 · Cypher 查询 API
  description: |
    用只读 Cypher 查知识网络：标签是对象类，关系类型是关系类，属性是逻辑属性名。
    本服务不自带查询语言实现——它把请求带着调用方身份转给 bkn-backend，由那边按
    知识网络的模型将各 MATCH 分支编译为 SQL，并完成有界求值和 UNION 合并后返回结果。

    与其他查询入口的分工：

    - [object-instance.yaml](object-instance.yaml) 的 `query_object_instance`：
      单个对象类的平面过滤，不跨关系。
    - [instance-subgraph.yaml](instance-subgraph.yaml) 的 `query_instance_subgraph`
      / `explore_subgraph`：要的是**子图**（节点 + 边的拓扑）。
    - 本接口：要的是**表**（按路径过滤后投影出的行，可聚合、可排序、可分页），
      路径与条件写在一句 Cypher 里。
    - [data-access.yaml](data-access.yaml) 的 `run_sql`：绕开本体直查物理表。
      本接口表达不了的口径（CTE、窗口函数）或资源没建成对象类时才落到那里。

    **不需要 `resource_id`，也不需要物理列名**——名字全部取自
    [schema-search.yaml](schema-search.yaml) 的 `search_schema` 或
    [kn-explore.yaml](kn-explore.yaml) 的 `get_object_types` / `get_relation_types`。

    **授权**：由 bkn-backend 按调用方账户裁决——语句点名的每个对象类与关系类都要有
    `query_data`（网络级授权会继承到其下的对象类与关系类），再往下 vega 对每个资源
    校验读取权限。无权查询的概念在编译用的模型里直接不存在，写了只会报「未知标签」，
    而不是「无权」，所以不能拿本接口探测模型里有什么。本服务只做转发，不放大调用方能
    读的范围。

    **认证**：`Authorization: Bearer <token>`（OAuth access token 或 `bak_` AppKey）。
  version: 0.1.4
servers:
  - url: /api/agent-retrieval/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /kn/run_cypher:
    post:
      tags:
        - Cypher
      summary: 对知识网络执行只读 Cypher
      operationId: runCypher
      description: |
        编译并执行一条只读 Cypher 语句。查询会自动选择 SQL 下推或有界类型化求值，新增表达式能力见 result_format 字段，无需显式解锁；以下描述原有 SQL 子集：

        - **MATCH**：一个或多个 MATCH 子句；一个 MATCH 里可以写逗号分隔的多条路径。
          同名变量指同一个节点；不共享变量的两部分是笛卡尔积。
        - **节点**：变量首次出现时必须带标签（对象类 id 或名称），可带内联属性
          `{prop: value}`。
        - **关系**：`-[:R]->`、`<-[:R]-`、无向 `-[:R]-`，每条必须指名一个关系类；
          一条查询的模式最多 8 条关系、9 个节点（不与其他节点相连的节点也各算一张表）。
          关系变量（`-[r:R]->`）不支持。
        - **OPTIONAL MATCH**：写一条关系，把一个新节点挂到前面子句已经找到的节点上。
          匹配不到时该行保留，新节点的列为 NULL，所以 `count(可选侧的属性)` 得 0 而不是整行
          消失（`count(*)` 仍然算 1 行）——按邻居数排序又不丢零度邻居，用的就是这一点。
          它自带的 `WHERE` 与内联属性决定这条关系匹配到什么，不决定哪些行留下。
          限制：首个子句必须是 `MATCH`；一条 `OPTIONAL MATCH` 只能写一条关系、只能引入一个
          新节点（两端都已匹配或两端都是新节点都会被拒）；它引入的节点不能被后面的 `MATCH`
          或查询的 `WHERE` 再要求，否则留下来的行会被重新删掉，这类查询改用有界阶段执行。
        - **WHERE**：`=` `<>` `<` `>` `<=` `>=`、`IN [...]`、`IS NULL` / `IS NOT NULL`，
          `STARTS WITH` / `ENDS WITH` / `CONTAINS`，用 `AND` / `OR` / `NOT` 组合，可加括号。
          值可写 `$name` 参数；`IN $list` 可把整个列表作为一个参数传入。字符串谓词左侧须为
          `变量.属性`，右侧须为字符串字面量或取值为字符串的参数；按 openCypher 语义做字面
          子串匹配（`%`、`_` 等不是通配符），属性为 null 时不匹配；大小写是否敏感取决于
          数据源列的排序规则（collation）。只能用于字符串属性，用在数值、日期等属性上返回 400。
        - **RETURN**：属性、`AS` 别名、`DISTINCT`，以及 `count` / `sum` / `avg` /
          `min` / `max`（含 `count(*)` 与 `DISTINCT` 形式）。有聚合时按 RETURN 中其余
          列自动分组——这是 Cypher 的隐式 GROUP BY，无需也不能自己写 GROUP BY。
        - **算术**：`+` `-` `*` `/` `%` 与取负，可加括号，可写在 RETURN（含聚合的参数）、
          `WHERE` 比较的两侧和 `ORDER BY` 里，如 `count(*) * 2`、`sum(o.price * o.qty)`、
          `count(o.x) * 1.0 / count(*)`、`WHERE o.amount * o.rate > $floor`、
          `ORDER BY count(g.id) * 0.5 + p.rank * 0.3 DESC`。操作数是数值属性、聚合、数字或
          取值为数字的参数；字符串、布尔、null 与非数值属性返回 400。与 openCypher 语义不一致的
          写法一律拒绝而不是照做：两个整数相除（Cypher 丢余数，各 SQL 库不一致），要小数结果把
          一边乘 `1.0`；`%` 只用于整数；除以字面量 0；`^` 乘方。聚合只能出现在 RETURN 与
          ORDER BY 里，不能写在 `WHERE` 中。一个列或排序键既有聚合又在聚合外直接读属性（如
          `o.x - avg(o.x)`）时，该属性须同时作为单独的列返回，结果按它分组；DISTINCT 结果要按
          算出来的值排序，请在 RETURN 里给它起别名再按别名排序。没有声明类型的属性交给数据源决定。
          `IN` 列表、内联属性、`SKIP` / `LIMIT` 里仍不能写算术。
        - **ORDER BY / SKIP / LIMIT**：ORDER BY 可用属性、返回列名或聚合。结果被聚合
          或 DISTINCT 折叠后，只能按返回的值排序。

        **新增值求值**：支持整个节点/命名定向关系、算术、CASE、XOR、列表/map、
        常用函数和顶层 collect 等聚合；自动根据查询选用，不要求 result_format 解锁。
        UNION / UNION ALL 支持独立作用域、去重/保留重复，所有分支先编译并授权；
        同一查询不能混用两种 UNION。WITH、MATCH、OPTIONAL MATCH、UNWIND 按顺序执行；
        支持变量别名、聚合后过滤、阶段分页及 WITH */RETURN *。UNWIND 后可继续 MATCH，
        节点别名及 collect/UNWIND 保留属性来源并提前授权；可选匹配未命中只将新变量设为 null。
        分阶段匹配要求完整且可读的节点主键；每个 MATCH 当前先有界扫描再关联，
        最终结果很小也可能因候选扫描过大而失败。

        **仍不支持**：变长路径、推导式、存在子查询、关系属性和任意过程调用。
        有界值求值路径的聚合须位于投影顶层；原 SQL 路径仍支持上述聚合算术。
        任意函数/CASE 派生图值的属性来源跟踪仍有限。
        所有写操作（CREATE / MERGE / DELETE / SET / REMOVE）继续拒绝。

        **行数**：不写 `LIMIT` 默认返回 1000 行；`LIMIT` 不得超过 10000。

        **关系唯一性**：按 openCypher 语义，同一条路径里共用同一关系类的多跳互不相同，
        编译器会自动补上主键不等的条件，调用方不必自己写。该规则按子句划分，因此
        `OPTIONAL MATCH` 的那一跳不参与——它补出的条件会落在 `WHERE` 里，正好删掉外连接
        保住的行。
      parameters:
        - $ref: '#/components/parameters/ResponseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCypherRequest'
            examples:
              两跳带过滤:
                value:
                  kn_id: kn_retail
                  query: >-
                    MATCH (c:customer)<-[:rel_order_customer]-(o:order)-[:rel_order_item_order]->(i:order_item)
                    WHERE c.city = 'Shanghai' AND o.status IN ['paid', 'shipped']
                    RETURN c.name AS customer, o.order_no AS order_no, i.sku AS sku
                    LIMIT 100
              聚合与参数:
                value:
                  kn_id: kn_retail
                  query: >-
                    MATCH (c:customer)<-[:rel_order_customer]-(o:order)
                    WHERE o.amount > $floor
                    RETURN c.city AS city, count(*) AS orders, sum(o.amount) AS amount
                    ORDER BY amount DESC LIMIT 20
                  parameters:
                    floor: 100
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCypherResponse'
            application/toon:
              schema:
                type: string
        '400':
          description: |
            缺少 `kn_id` / `query`，或语句用了不支持的语法、引用了不存在的对象类 /
            关系类 / 属性。编译器的拒绝原样透传，`error_details` 里带构造名与位置。
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '403':
          description: 账户没有该知识网络的数据查询权限
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误，或下游依赖故障
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  parameters:
    ResponseFormat:
      name: response_format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - toon
        default: json
      description: 响应格式。`toon` 返回 `application/toon`，同构数组压成表格，省 token。

  schemas:
    RunCypherRequest:
      type: object
      required:
        - kn_id
        - query
      properties:
        result_format:
          type: string
          enum: [graph_v1]
          description: |-
            Optional explicit value-result selection; language features are also inferred
            from the query without this field. Existing scalar SQL queries retain their
            execution path. New value evaluation supports arithmetic, CASE, nullable
            booleans, property comparisons, list/map values and access, registered scalar
            functions and top-level count/sum/avg/min/max/collect, including DISTINCT and
            mixed aggregates. RETURN without MATCH is supported. DISTINCT, ORDER BY,
            SKIP and LIMIT follow grouping/aggregation. Aggregates within scalar expressions
            remain unsupported. ORDER BY expressions may refer to projected aliases.
            Paths, comprehensions, existential subqueries,
            relation properties and procedures are not implemented yet. This is not a full
            openCypher compatibility claim.
            UNION and UNION ALL support up to 32 independently scoped branches with identical
            column names; mixing the two operators is rejected. Every branch is compiled and
            authorized before any branch reads data. Branch ORDER BY/SKIP/LIMIT is local;
            the default 1000-row cap applies once after the union. UNWIND supports up to 32
            expansions, including parameter lists, empty/null inputs and scalar inputs.
            WITH, MATCH, OPTIONAL MATCH and UNWIND run in clause order, with at most 64 stages.
            WITH replaces the variable scope and supports aggregation, DISTINCT, ordering,
            SKIP/LIMIT and a following WHERE. RETURN * and WITH * expand the visible scope.
            Node aliases and collect-to-UNWIND preserve property origins and authorization;
            reading an attribute does not implicitly add it to public snapshot properties.
            OPTIONAL MATCH null-extends only newly introduced variables after its predicate.
            Staged MATCH requires full, complete node primary keys, even for scalar output.
            Each MATCH currently scans a bounded authorized observation before correlation;
            a selective final result may still exceed the candidate budget.
            Graph origins through arbitrary scalar functions/CASE remain limited.
            object_properties continues to name MATCH node variables, not WITH aliases.
            UNION shares a 9999-row work budget (sum of max(candidate rows, expanded rows)
            per simple branch; staged branches account cumulative intermediate work), an
            8 MiB assembly budget and the request timeout. Staged work counts the sum of
            max(stage source/input rows, stage output rows), with a separate cap of 79992
            correlation comparisons. Overflows or an
            incomplete branch reject the entire query. Separate reads do not guarantee a
            shared datasource snapshot.
            A value evaluation allows 9999 candidate rows plus one probe, an 8 MiB assembly
            budget and 30-second timeout. Exceeding a budget rejects the whole evaluation.
        object_properties:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: |-
            graph_v1 only. Snapshot property names by node variable. Complete primary keys,
            requested properties and the join-key observations exposed by relation values
            require full property access, including in nested evidence. Values come from
            the same observation; no later object lookup is performed.
          example:
            p: [name]
        bkn_context:
          $ref: '../_shared/common.yaml#/components/schemas/BKNContext'
        kn_id:
          type: string
          description: 知识网络 ID，来自 `list_knowledge_networks`。
        branch:
          type: string
          description: 分支名。不传按主分支查。
        query:
          type: string
          description: 只读 Cypher 语句，语法子集见端点说明。
        parameters:
          type: object
          additionalProperties: true
          description: |
            $name 的 JSON 标量、null、列表或 map。嵌套最多 32 层并受载荷预算限制。
            简单 IN 列表保留 SQL 下推；复杂、空或含 null 的列表使用有界求值。
            参数永远不会变成模型标识符或物理 SQL 名称。

    RunCypherResponse:
      type: object
      properties:
        result_format:
          type: string
          enum: [graph_v1]
          description: Present for typed value results, whether inferred or explicitly selected.
        value_types:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CypherValueType'
          description: Recursive logical types, keyed by result column name.
        execution:
          $ref: '#/components/schemas/CypherExecution'
        columns:
          type: array
          description: 输出列，顺序与 `RETURN` 一致。
          items:
            type: object
            properties:
              name:
                type: string
                description: 列名。写了 `AS` 就是别名，否则是属性引用的原文。
              type:
                type: string
                description: 列的数据类型。
        entries:
          type: array
          description: 结果行，按列名取值。
          items:
            type: object
            additionalProperties: true


    CypherValueType:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: Model scalar type, or object, relation, map, list, null, any (dynamic type).
        object_type_id:
          type: string
        relation_type_id:
          type: string
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CypherValueType'
        element:
          $ref: '#/components/schemas/CypherValueType'
    CypherExecution:
      type: object
      required: [match_rows, match_complete, evidence_complete, conclusions_limited]
      properties:
        candidate_rows:
          type: integer
          description: Source candidate rows before residual WHERE and UNWIND; staged queries sum physical MATCH observations, and UNION sums branch candidates.
        match_rows:
          type: integer
          description: Rows entering the final projection after earlier stage operations, before final grouping; UNION sums branch counts before deduplication.
        match_complete:
          type: boolean
        evidence_complete:
          type: boolean
          description: Completeness of evidence for returned conclusions.
        conclusions_limited:
          type: boolean
          description: True when SKIP or LIMIT omits otherwise matched conclusions.

    CypherObjectValue:
      type: object
      required: [kind, network_id, branch, object_type_id, key]
      properties:
        kind:
          type: string
          enum: [object]
        network_id:
          type: string
        branch:
          type: string
        object_type_id:
          type: string
        key:
          type: object
          description: Complete primary key, keyed by model property name. Values use exact decimal strings for integers.
          additionalProperties:
            type: object
            required: [type, value]
            properties:
              type:
                type: string
              value:
                type: string
        properties:
          type: object
          additionalProperties: true
          description: Only explicitly requested, authorized snapshot properties.
    CypherRelationValue:
      type: object
      description: A direct join fact observed in this evaluation; it has no persisted edge ID.
      required: [kind, relation_type_id, source, target, binding_digest, basis]
      properties:
        kind:
          type: string
          enum: [relation]
        relation_type_id:
          type: string
        source:
          $ref: '#/components/schemas/CypherObjectValue'
        target:
          $ref: '#/components/schemas/CypherObjectValue'
        binding_digest:
          type: string
          description: SHA-256 digest of the relation type, update time and mapping definition; not a data snapshot reference.
        basis:
          type: array
          description: Authorized source/target logical properties and their values from the same matching row.
          items:
            type: object
            required: [source_property, source_value, target_property, target_value]
            properties:
              source_property:
                type: string
              target_property:
                type: string
              source_value:
                description: Observed source join-key value.
              target_value:
                description: Observed target join-key value.
