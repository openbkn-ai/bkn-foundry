---
openapi: 3.0.3
info:
  title: 上下文加载 · Cypher 查询 API
  description: |
    用只读 Cypher 查知识网络：标签是对象类，关系类型是关系类，属性是逻辑属性名。
    本服务不自带查询语言实现——它把请求带着调用方身份转给 bkn-backend，由那边按
    知识网络的模型将各 MATCH 分支编译为 SQL，并完成有界求值和 UNION 合并后返回结果。

    与其他查询入口的分工：

    - [object-instance.yaml](object-instance.yaml) 的 `query_object_instance`：
      单个对象类的平面过滤，不跨关系。
    - [instance-subgraph.yaml](instance-subgraph.yaml) 的 `query_instance_subgraph`
      / `explore_subgraph`：要的是**子图**（节点 + 边的拓扑）。
    - 本接口：要的是**表**（按路径过滤后投影出的行，可聚合、可排序、可分页），
      路径与条件写在一句 Cypher 里。
    - [data-access.yaml](data-access.yaml) 的 `run_sql`：绕开本体直查物理表。
      本接口表达不了的口径（CTE、窗口函数）或资源没建成对象类时才落到那里。

    **不需要 `resource_id`，也不需要物理列名**——名字全部取自
    [schema-search.yaml](schema-search.yaml) 的 `search_schema` 或
    [kn-explore.yaml](kn-explore.yaml) 的 `get_object_types` / `get_relation_types`。

    **授权**：由 bkn-backend 按调用方账户裁决——语句点名的每个对象类与关系类都要有
    `query_data`（网络级授权会继承到其下的对象类与关系类），再往下 vega 对每个资源
    校验读取权限。无权查询的概念在编译用的模型里直接不存在，写了只会报「未知标签」，
    而不是「无权」，所以不能拿本接口探测模型里有什么。本服务只做转发，不放大调用方能
    读的范围。

    **认证**：`Authorization: Bearer <token>`（OAuth access token 或 `bak_` AppKey）。
  version: 0.1.4
servers:
  - url: /api/agent-retrieval/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /kn/run_cypher:
    post:
      tags:
        - Cypher
      summary: 对知识网络执行只读 Cypher
      operationId: runCypher
      description: |
        按可见 BKN 本体执行只读查询，自动选择 SQL 下推或有界图求值。

        支持 MATCH/OPTIONAL MATCH/WITH/UNWIND/RETURN、UNION/UNION ALL、作用域和别名、
        列表/map/CASE、列表与模式推导式、all/any/none/single、相关及嵌套 EXISTS、
        一般聚合表达式、统计聚合和已注册的标量/时间函数。分页可使用整数参数与常量表达式。
        节点标签和关系类型可省略；关系可写多个类型或命名无向模式。
        支持固定/变长路径值及 nodes/relationships/length；显式范围至多八跳，
        无界路径若还可能继续超过八跳则整条报超限，不返回截断路径集合。

        节点身份是对象类和完整类型主键；一个节点只有一个对象类。
        direct 关系是端点连接事实，没有独立关系实例或自有属性。
        properties(r) 为空，r.property 为 null。多独立标签、同类型同端点多条独立边、
        关系自有属性的原生属性图测试不适用于此契约；写操作和过程调用仍拒绝。
        同一 MATCH 不重复使用关系；不同 MATCH 的唯一性独立处理。

        所有阶段、分支及子查询先编译授权，再读数据；内部依赖不扩大显式公开快照。
        CASE/coalesce/head/last、列表和路径传递保留图属性来源。
        复杂模式先有界扫描授权的对象类和 direct 关系观察，再与输入关联，
        因此小结果也可能超扫描预算。全请求共享工作行、载荷和超时预算，
        任何不完整或超限均整体失败。完整限制见 result_format。

        不写 LIMIT 默认返回 1000 行，LIMIT 不得超过 10000；具体工作预算可更早限制求值。
        SQL 下推字符串匹配遵循数据源排序规则，服务端字符串求值区分大小写。
        本实现不宣称完整只读 TCK 兼容，时区使用宿主 IANA tzdb。
      parameters:
        - $ref: '#/components/parameters/ResponseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCypherRequest'
            examples:
              两跳带过滤:
                value:
                  kn_id: kn_retail
                  query: >-
                    MATCH (c:customer)<-[:rel_order_customer]-(o:order)-[:rel_order_item_order]->(i:order_item)
                    WHERE c.city = 'Shanghai' AND o.status IN ['paid', 'shipped']
                    RETURN c.name AS customer, o.order_no AS order_no, i.sku AS sku
                    LIMIT 100
              聚合与参数:
                value:
                  kn_id: kn_retail
                  query: >-
                    MATCH (c:customer)<-[:rel_order_customer]-(o:order)
                    WHERE o.amount > $floor
                    RETURN c.city AS city, count(*) AS orders, sum(o.amount) AS amount
                    ORDER BY amount DESC LIMIT 20
                  parameters:
                    floor: 100
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCypherResponse'
            application/toon:
              schema:
                type: string
        '400':
          description: |
            缺少 `kn_id` / `query`，或语句用了不支持的语法、引用了不存在的对象类 /
            关系类 / 属性。编译器的拒绝原样透传，`error_details` 里带构造名与位置。
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '403':
          description: 账户没有该知识网络的数据查询权限
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误，或下游依赖故障
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  parameters:
    ResponseFormat:
      name: response_format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - toon
        default: json
      description: 响应格式。`toon` 返回 `application/toon`，同构数组压成表格，省 token。

  schemas:
    RunCypherRequest:
      type: object
      required:
        - kn_id
        - query
      properties:
        result_format:
          type: string
          enum: [graph_v1]
          description: |-
            Optional explicit graph_v1 selection; language features are inferred from the query.
            Existing scalar SQL queries retain their execution path. Bounded evaluation supports
            CASE/nullable booleans, arithmetic, lists/maps, list comprehensions, all/any/none/single,
            registered scalar and temporal functions, and aggregates inside scalar/map/list
            expressions (count/sum/avg/min/max/collect/stdev/stdevp/percentileCont/percentileDisc).
            Temporal values use ISO text and logical value_types; IANA zone rules use host tzdb.
            WITH, MATCH, OPTIONAL MATCH and UNWIND execute in order (64 stages, 32 UNWINDs).
            WITH replaces scope and supports aliases, aggregate filtering and local pagination.
            UNION/UNION ALL allow 32 independently scoped branches with identical column names;
            mixing operators is refused. The default 1000-row cap applies after union evaluation.
            Pagination accepts nonnegative integer parameters or row-independent expressions.
            Patterns support typed/untyped nodes, direct relationship type alternatives, named
            undirected relationships, fixed/variable paths, nodes()/relationships()/length(),
            pattern comprehensions/predicates and correlated EXISTS, including nested queries.
            Each MATCH enforces relationship uniqueness. Explicit path bounds cannot exceed eight
            hops; an unbounded traversal that can exceed eight fails instead of truncating.
            Nodes have one BKN object type. A direct relation is a virtual endpoint join fact,
            with no independently stored properties or parallel edge identities. properties(r)
            is empty and r.property is null. Native multi-label/parallel/property-bearing edge
            fixtures are not applicable to this graph contract. Writes and procedures are refused.
            Graph-valued CASE/coalesce/head/last/list/path operations preserve property origins.
            All stages, branches and correlated observations are compiled and authorized before
            reads, including lazy/empty branches. Query dependencies do not expand public object
            snapshots. object_properties names MATCH node variables, not WITH aliases.
            Graph binding requires full readable complete primary keys. Generic patterns scan
            bounded authorized type/relation observations before correlation and cache them per
            request; selective output may still exceed the scan budget. No datasource transaction
            snapshot is guaranteed. The request shares 9999 work rows, 8 MiB assembly, 79992
            iterations/comparisons and a 30-second timeout. Each pattern allows at most 64 typed
            observations. Incomplete reads or budget overflow fail the entire query.
            This is a bounded BKN implementation, not a full read-only TCK certification.
        object_properties:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: |-
            graph_v1 only. Snapshot property names by node variable. Complete primary keys,
            requested properties and the join-key observations exposed by relation values
            require full property access, including in nested evidence. Values come from
            the same observation; no later object lookup is performed.
          example:
            p: [name]
        bkn_context:
          $ref: '../_shared/common.yaml#/components/schemas/BKNContext'
        kn_id:
          type: string
          description: 知识网络 ID，来自 `list_knowledge_networks`。
        branch:
          type: string
          description: 分支名。不传按主分支查。
        query:
          type: string
          description: 只读 Cypher 语句，语法子集见端点说明。
        parameters:
          type: object
          additionalProperties: true
          description: |
            $name 的 JSON 标量、null、列表或 map。嵌套最多 32 层并受载荷预算限制。
            简单 IN 列表保留 SQL 下推；复杂、空或含 null 的列表使用有界求值。
            参数永远不会变成模型标识符或物理 SQL 名称。

    RunCypherResponse:
      type: object
      properties:
        result_format:
          type: string
          enum: [graph_v1]
          description: Present for typed value results, whether inferred or explicitly selected.
        value_types:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CypherValueType'
          description: Recursive logical types, keyed by result column name.
        execution:
          $ref: '#/components/schemas/CypherExecution'
        columns:
          type: array
          description: 输出列，顺序与 `RETURN` 一致。
          items:
            type: object
            properties:
              name:
                type: string
                description: 列名。写了 `AS` 就是别名，否则是属性引用的原文。
              type:
                type: string
                description: 列的数据类型。
        entries:
          type: array
          description: 结果行，按列名取值。
          items:
            type: object
            additionalProperties: true


    CypherValueType:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: Model scalar type, or object, relation, map, list, null, any (dynamic type).
        object_type_id:
          type: string
        relation_type_id:
          type: string
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CypherValueType'
        element:
          $ref: '#/components/schemas/CypherValueType'
    CypherExecution:
      type: object
      required: [match_rows, match_complete, evidence_complete, conclusions_limited]
      properties:
        candidate_rows:
          type: integer
          description: Source candidate rows before residual WHERE and UNWIND; staged queries sum physical MATCH observations, and UNION sums branch candidates.
        match_rows:
          type: integer
          description: Rows entering the final projection after earlier stage operations, before final grouping; UNION sums branch counts before deduplication.
        match_complete:
          type: boolean
        evidence_complete:
          type: boolean
          description: Completeness of evidence for returned conclusions.
        conclusions_limited:
          type: boolean
          description: True when SKIP or LIMIT omits otherwise matched conclusions.

    CypherObjectValue:
      type: object
      required: [kind, network_id, branch, object_type_id, key]
      properties:
        kind:
          type: string
          enum: [object]
        network_id:
          type: string
        branch:
          type: string
        object_type_id:
          type: string
        key:
          type: object
          description: Complete primary key, keyed by model property name. Values use exact decimal strings for integers.
          additionalProperties:
            type: object
            required: [type, value]
            properties:
              type:
                type: string
              value:
                type: string
        properties:
          type: object
          additionalProperties: true
          description: Only explicitly requested, authorized snapshot properties.
    CypherRelationValue:
      type: object
      description: A direct join fact observed in this evaluation; it has no persisted edge ID.
      required: [kind, relation_type_id, source, target, binding_digest, basis]
      properties:
        kind:
          type: string
          enum: [relation]
        relation_type_id:
          type: string
        source:
          $ref: '#/components/schemas/CypherObjectValue'
        target:
          $ref: '#/components/schemas/CypherObjectValue'
        binding_digest:
          type: string
          description: SHA-256 digest of the relation type, update time and mapping definition; not a data snapshot reference.
        basis:
          type: array
          description: Authorized source/target logical properties and their values from the same matching row.
          items:
            type: object
            required: [source_property, source_value, target_property, target_value]
            properties:
              source_property:
                type: string
              target_property:
                type: string
              source_value:
                description: Observed source join-key value.
              target_value:
                description: Observed target join-key value.
