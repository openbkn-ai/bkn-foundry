---
openapi: 3.0.3
info:
  title: 对象实例查询
  description: |
    按对象类查询实例数据。Context Loader（服务名 `agent-retrieval`）在这里做的是
    **面向 Agent 的收口**：接受结构化条件，转发给 ontology-query，再把结果按 Agent
    能直接消费的形态返回。

    典型链路：`search_schema` 拿到对象类与可用算子 → 本接口取实例 → 从每条记录的
    `_instance_identity` 取标识 → 喂给 [action.yaml](action.yaml) 的 `get_action_info`
    或 [logic-property.yaml](logic-property.yaml) 的 `logic-property-resolver`。

    **翻页两条路，互斥**：

    - `search_after` 游标翻页：适用于对象索引 / 数据视图路径，只能顺翻，不能跳页；
      把上一页响应里的 `search_after` 原样回传即可，响应里没有该字段就是没有下一页。
    - `offset` 偏移翻页：适用于资源（vega 表源）路径，可跳任意页。

    **认证**：`Authorization: Bearer <token>`（OAuth access token 或 `bak_` AppKey）。
  version: 0.1.3
servers:
  - url: /api/agent-retrieval/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /kn/query_object_instance:
    post:
      tags:
        - ObjectInstance
      summary: 查询对象实例
      operationId: queryObjectInstance
      x-contract-probe:
        readonly: true
        order: 3
        query:
          kn_id: '{cl_kn_id}'
          ot_id: '{cl_ot_id}'
        body:
          limit: 2
      description: |
        按单个对象类查询实例。`kn_id` / `ot_id` 走 **query 参数**，过滤与分页走请求体。

        **条件两种写法**：

        - `filters`：扁平简写，多个条件按 AND 组合，`value_from` 自动取 `const`。
          覆盖「字段 op 值 [AND ...]」这类绝大多数场景。
        - `condition`：完整嵌套结构，需要 OR / 多层嵌套时用。

        两者同传时 `condition` 优先，`filters` 被忽略。

        **算子白名单以对象类为准**：可用算子看 `get_object_types` 返回的
        `condition_operations`，不要照抄本文档的枚举全集。对绑定 Vega 资源的对象类，
        这份清单由 BKN 按资源上**真实建成的索引**派生：字段建了全文索引才出现
        `match` / `multi_match`，建了向量索引且 embedding 模型可解析才出现 `knn`。
        没建索引的字段只保留按属性类型推导的比较算子。

        **文本检索选哪个**：`match` 走全文索引，按分析器分词后词法命中；`knn` 走向量
        索引，能召回字面不重合的表述（换个说法、跨语言）。两者是独立算子，没有隐式
        融合；要同时用就放进 `or` 的 `sub_conditions`。`knn` 另需 `limit_key: k` 与
        `limit_value: <近邻数>`。

        条件里用了字段不支持的算子时，ontology-query 返回 400 并原样透传错误详情
        （如 `OntologyQuery.InvalidParameter.Condition`）。

        **`_score` 的取舍**：纯结构化过滤在底层落成常量打分查询，每条命中分数相同，
        没有相关度语义，因此响应里的 `_score` 会被剥掉，避免调用方误以为结果按相关度
        排序。只有查询里含 `knn` 或 `match` 这类真正打分的算子时才保留 `_score`。

        **排序**：`sort` 可选，多字段按数组顺序依次比较（前一个相等才看后一个）。
        不传时的默认序**不保证语义**——既不是「最新」也不是「最相关」，因此
        「最近的 N 条」「金额最高的 N 个」必须显式传 `sort`，不能靠 `limit` 截默认序。
        `field` 是否属于该对象类由 ontology-query 校验，非法字段或非法 `direction`
        返回 400 并透传原因。

        **总数**：响应的 `total_count` 为满足过滤条件的实例总数，不受 `limit` 限制，
        无需请求方开启。判断「一共多少条」读它即可，不必翻页累加。三态要分清：

        - 有值且大于 0：真实总数。
        - 值为 `0`：真实零命中（字段存在）。
        - **字段缺失**：本次没有计算总数，不能推断为 0。用 `search_after` 翻页时
          第二页起即如此（下游在游标非空时强制关闭总数计算）。要总数就回到不带
          `search_after` 的首次查询。
      parameters:
        - name: kn_id
          in: query
          required: true
          schema:
            type: string
          description: 知识网络 ID。
        - name: ot_id
          in: query
          required: true
          schema:
            type: string
          description: 对象类 ID。
        - name: include_logic_params
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            是否返回逻辑属性的计算参数。默认 false，结果不含逻辑属性字段与值；
            逻辑属性求值请用 [logic-property.yaml](logic-property.yaml)。
        - $ref: '#/components/parameters/ResponseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryObjectInstanceRequest'
            examples:
              扁平过滤:
                summary: filters 简写（等价于 status == Running AND replicas > 1）
                value:
                  filters:
                    - field: status
                      op: '=='
                      value: Running
                    - field: replicas
                      op: '>'
                      value: 1
                  limit: 20
                  properties:
                    - pod_name
                    - status
              嵌套条件:
                summary: condition 完整写法（OR 组合）
                value:
                  condition:
                    operation: or
                    sub_conditions:
                      - field: status
                        operation: '=='
                        value: Failed
                        value_from: const
                      - field: status
                        operation: '=='
                        value: Unknown
                        value_from: const
                  limit: 10
              游标翻下一页:
                value:
                  search_after:
                    - '20250922_020907_00027_qe7sf'
                    - 'xdb6f0e5f5ba7449ab94822da9f008386'
                  limit: 20
      responses:
        '200':
          description: 对象实例数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectDataResponse'
            application/toon:
              schema:
                type: string
                description: TOON 编码的同一结构（`response_format=toon` 时）。
        '400':
          description: 参数错误；条件不合法时携带下游 ontology-query 的具体原因
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '404':
          description: 知识网络或对象类不存在（下游状态码原样保留，不塌陷成 400）
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误，或下游依赖故障
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

  /kn/search_instance:
    post:
      tags:
        - ObjectInstance
      summary: 语义召回实例
      operationId: searchInstance
      x-contract-probe:
        readonly: true
        order: 4
        body:
          kn_id: '{cl_kn_id}'
          query: 巡检探测
      description: |
        用一句自然语言直接召回实例，**不需要先知道对象类和字段名**——这是
        `search_schema`（只回 Schema）与 `query_object_instance`（要先给出结构化条件）
        之间缺的那一步。

        执行两段：先按 `query` 锁定相关对象类，再在这些对象类上做语义实例召回；
        向量（`knn`）与全文（`match`）两路并发发出后按名次融合，因此两种命中都能进入结果。

        **自足**：除实例行外，还附带读懂它们所需的对象类精简定义（`object_types`，
        只含真正出了实例的那几个），单次调用就够用，不必再回头查 Schema。
        只有 `condition_operations` 含 `match` / `knn` 的属性参与召回，
        **没建索引的对象类不会出实例**。

        **无命中不是错误**：返回空 `nodes` 加一句 `message`，不返回 5xx。
      parameters:
        - $ref: '#/components/parameters/ResponseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchInstanceRequest'
      responses:
        '200':
          description: 召回结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchInstanceResponse'
            application/toon:
              schema:
                type: string
        '400':
          description: 参数错误（缺 kn_id / query 为空 / max_* 非正）
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误，或下游依赖故障
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  parameters:
    ResponseFormat:
      name: response_format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - toon
        default: json
      description: 响应格式。`toon` 返回 `application/toon`，同构数组压成表格，省 token。

  schemas:
    SearchInstanceRequest:
      type: object
      required:
        - query
      properties:
        kn_id:
          type: string
          description: 知识网络 ID。也可改用 `X-Kn-ID` 请求头传入。
        query:
          type: string
          description: |
            自然语言问题或关键词。整句直接传，不必拆成字段条件——向量通道吃整句，
            全文通道由分析器分词。
        concept_groups:
          type: array
          items:
            type: string
          description: 限定召回范围到指定的 BKN 概念分组；不传则在整个知识网络内召回。
        object_types:
          type: array
          items:
            type: string
          description: |
            把召回范围钉死在这几个对象类上，只取对象类 id（例如 `material`），不接受名称。
            id 来自 `search_schema` 响应的 `concept_id`、本接口响应的 `object_type_id`
            或 `get_kn_detail` 的 `object_types[].id`。不传则不限。
            过滤发生在相关性排序与 `max_object_types` 截断之前，因此点名的对象类不会因为
            排名靠后被挤掉。列表里的 id 一个都不存在时返回空 `nodes`，并在 `message` 里
            列出这些 id。
        exclude_object_types:
          type: array
          items:
            type: string
          description: |
            从召回范围里排除这几个对象类，同样只取对象类 id。适合上一轮返回里混进了噪音
            对象类、想重跑一次时用；与 `object_types` 有重叠时以排除为准。
        max_object_types:
          type: integer
          default: 10
          minimum: 1
          description: 参与实例召回的对象类数量上限。每多一个对象类多一轮下游查询。
        max_instances_per_type:
          type: integer
          default: 5
          minimum: 1
          description: 每个对象类最多返回几条实例。
        rerank:
          type: boolean
          default: false
          description: |
            是否对召回结果做语义精排。默认关。开启后由 cross-encoder 逐条判断相关性并
            **重排返回顺序**（`rrf_score` 不变，模型分单独落在 `reranker_score`，
            见响应说明），能分辨名次融合分不出的语义差异。
            代价是多一次模型调用（约 100~400ms），且要求部署里注册了精排小模型；
            模型不可用时自动退回原顺序，不报错。
        include_object_types:
          type: boolean
          default: true
          description: |
            是否附带命中对象类的精简定义。默认附带——不附带的话，要读懂返回的实例
            还得再调一次 `get_object_types`，而那一趟会把同一个 query 的概念召回重跑一遍。

    SearchInstanceResponse:
      type: object
      required:
        - nodes
      properties:
        nodes:
          type: array
          description: |
            命中的实例，**按相关性全局降序**排列，跨对象类统一排序。每条带
            `object_type_id`（可直接喂给 `get_object_types` / `query_object_instance`）、
            `properties`，以及 `rank` 与若干分数字段。

            **排序只认 `rank`**（从 1 开始，与返回顺序一致）。哪一个分数决定了位次取决于
            请求：默认是融合分，开启精排时是模型分。按任何单一分数字段自行重排都可能得到
            与服务端不同的顺序。

            分数字段各有量纲，是解释排序的证据，不能互相比较：

            - `rrf_score`：RRF 融合分，「某一路第一」=1.0、「两路都第一」=2.0。表达两条
              召回通道的一致程度，**不是绝对相关度**——某通道的第一名恒得 1.0，哪怕整个
              对象类都与 query 无关。
            - `bm25_score`：全文通道原始 `_score`。**无上界**，随语料与 query 长度漂移，
              不能跨 query / 跨知识网络比较，也不能当阈值。
            - `knn_score`：向量通道相似度，0~1，是唯一跨 query 大致可比的原始分。
            - `reranker_score`：cross-encoder 精排分，0~1。仅当精排真的跑过并给该条打分时
              出现；精排窗口（默认前 50 条）之外的行不带此字段。**该字段是否存在，也是
              判断精排生效还是模型不可用静默降级的唯一依据。**
            - `heuristic_score`：本地兜底打分（0/0.3/0.5/0.85 档），仅在所有通道都没拿到
              索引 `_score`、名次无意义时出现，与 `rrf_score` 不共享刻度。
            - `score`：**已废弃**，等同于 `rrf_score` 或 `heuristic_score` 但不说明是哪个，
              保留仅为兼容。
          items:
            type: object
            additionalProperties: true
        object_types:
          type: array
          description: |
            读懂 `nodes` 所需的对象类精简定义（属性名与类型），**只含真正出了实例的
            那些对象类**，不是召回扫过的全部。`include_object_types=false` 时不返回。
          items:
            type: object
            additionalProperties: true
        message:
          type: string
          description: 仅在没有命中时出现，说明为什么是空的。

    QueryObjectInstanceRequest:
      type: object
      required:
        - bkn_context
      properties:
        bkn_context:
          $ref: '../_shared/common.yaml#/components/schemas/BKNContext'
        condition:
          $ref: '#/components/schemas/Condition'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FlatFilter'
          description: |
            扁平过滤简写，多个条件按 AND 组合。与 `condition` 互斥，同传时
            `condition` 优先。需要 OR 或嵌套时改用 `condition`。
        limit:
          type: integer
          default: 10
          minimum: 1
          maximum: 10000
          description: 返回条数。
        properties:
          type: array
          items:
            type: string
          description: 指定返回的属性字段；不传返回全部属性。
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortSpec'
          description: |
            排序字段，按数组顺序依次比较。不传时默认序不保证语义，需要「最新 /
            最大 / 最小的前 N 条」时必须显式指定。
        search_after:
          type: array
          items: {}
          description: |
            游标翻页：上一页响应返回的 `search_after` 原样回传。首次查询留空。
            与 `offset` 互斥。
        offset:
          type: integer
          description: |
            偏移翻页：适用于资源（vega 表源）路径，可跳页。与 `search_after` 互斥。

    SortSpec:
      type: object
      description: 单个排序字段。
      required:
        - field
        - direction
      properties:
        field:
          type: string
          description: 排序字段，必须是该对象类的属性名。
        direction:
          type: string
          enum: [asc, desc]
          description: 排序方向。

    FlatFilter:
      type: object
      description: 单个「字段 算子 值」比较。多个之间按 AND 组合，`value_from` 固定为 `const`。
      required:
        - field
        - op
        - value
      properties:
        field:
          type: string
          description: 对象类属性名。
        op:
          $ref: '#/components/schemas/ConditionOperation'
        value:
          description: |
            字段值。`in` / `not_in` 传数组，`range` / `out_range` 传 `[min, max]`，
            其余传单值。

    Condition:
      type: object
      description: |
        过滤条件。逻辑算子（`and` / `or`）用 `sub_conditions` 组合子条件；
        叶子条件用 `field` + `operation` + `value` + `value_from`。

        **`value` 与 `value_from` 必须成对出现**，且 `value_from` 目前只支持 `const`。
      required:
        - operation
      properties:
        field:
          type: string
          description: 字段名，即对象类的属性名。逻辑算子节点不需要。
        operation:
          $ref: '#/components/schemas/ConditionOperation'
        sub_conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
          description: 子条件数组，供 `and` / `or` 组合使用。
        value:
          description: |
            字段值，格式随算子而定：比较类传单值；`range` / `out_range` 传
            `[min, max]`；`in` / `not_in` 传值数组；`knn` 传向量或待向量化的文本。
        value_from:
          type: string
          enum:
            - const
          description: 值来源。目前只支持 `const`，且必须与 `value` 同时出现。
        limit_key:
          type: string
          enum:
            - k
            - min_score
            - min_distance
          description: |
            向量检索（`knn`）的限定维度：`k` 取回条数，`min_score` 最低相似度，
            `min_distance` 最大距离。
        limit_value:
          description: 与 `limit_key` 配套的取值。

    ObjectDataResponse:
      type: object
      description: |
        对象实例查询结果。本接口固定不返回对象类定义（`object_type`）——需要定义
        请走 [kn-explore.yaml](kn-explore.yaml) 的 `get_object_types`。
      properties:
        datas:
          type: array
          items:
            $ref: '#/components/schemas/ObjectInstance'
          description: 对象实例列表。
        total_count:
          type: integer
          format: int64
          description: |
            满足过滤条件的实例总数，不受 `limit` 限制。零命中时为 `0`（字段存在）。
            字段缺失表示本次未计算总数——`search_after` 翻页第二页起如此——
            不可推断为 0。
        search_after:
          type: array
          items: {}
          description: |
            下一页游标。非空时把它作为下次请求的 `search_after` 传入；字段不存在
            或为空表示没有更多数据。

    ObjectInstance:
      type: object
      additionalProperties: true
      description: |
        单条对象实例。业务字段随对象类建模动态变化，此外固定含若干下划线前缀的
        元字段。
      properties:
        _instance_id:
          type: string
          description: 该实例的唯一标识字符串。
        _instance_identity:
          type: object
          additionalProperties: true
          description: |
            该实例的主键键值对。**下游接口要求的 `_instance_identities` 必须从这里
            原样取，不能自己拼**。
        _display:
          description: 展示用的摘要字段。
        _score:
          type: number
          format: float
          description: |
            相关度得分。仅当查询含 `knn` / `match` 等真正打分的算子时返回；
            纯结构化过滤下该字段被剥除。

    ConditionOperation:
      type: string
      description: |
        查询算子全集。**实际可用范围以对象类的 `condition_operations` 为准**
        （见 [kn-explore.yaml](kn-explore.yaml) 的 `get_object_types`）。
      enum:
        - and
        - or
        - '=='
        - '!='
        - '>'
        - '<'
        - '>='
        - '<='
        - in
        - not_in
        - like
        - not_like
        - range
        - out_range
        - exist
        - not_exist
