---
openapi: 3.0.3
info:
  title: 逻辑属性求值
  description: |
    批量求一批对象实例的**逻辑属性**（指标 `metric` 或算子 `operator`）值。

    逻辑属性不直接存在于数据源里，需要带参数计算，而参数往往藏在用户的自然语言里
    （「最近一年」→ 时间窗、「按省份」→ 分析维度）。本接口先用大模型把 `query`
    翻译成各属性的 `dynamic_params`，再批量取值，省掉调用方自己拼参数的工作。

    对象类有哪些逻辑属性、各自需要什么参数，看
    [kn-explore.yaml](kn-explore.yaml) 的 `get_object_types` 返回的
    `logic_properties[].parameters`。

    同一份文件里还有 `POST /kn/query_metric`：**类级指标、或没绑到任何逻辑属性的
    指标**走它，直接按 `metric_id` 与 MetricDefinition 的口径取数。两条路的分工是
    「实例 + 已绑逻辑属性 → `logic-property-resolver`，其余 → `query_metric`」；
    已建模的指标一律不该用 `run_sql` 重写口径。指标清单来自 `get_object_types`
    返回的 `related_metrics`。

    **认证**：`Authorization: Bearer <token>`（OAuth access token 或 `bak_` AppKey）。
  version: 0.1.3
servers:
  - url: /api/agent-retrieval/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /kn/logic-property-resolver:
    post:
      tags:
        - LogicProperty
      summary: 批量求逻辑属性值
      operationId: resolveLogicProperties
      description: |
        **`query` 的质量决定成败**：参数由大模型从 `query`（必要时加
        `additional_context`）里推断。查询里要含时间范围、统计维度等业务上下文，
        否则会因缺参失败。

        **缺参返回 400，不是空结果**：模型判定必需的 input 参数无法从查询推出时，
        返回 400，`details` 里是 `MISSING_INPUT_PARAMS` 及逐属性的缺失说明。补上
        上下文重试即可。

        与之区分的是 500 `DYNAMIC_PARAMS_GENERATION_FAILED`：那是大模型或依赖服务
        故障，不是调用方少给信息，重试或查服务状态。

        **结果与入参对齐**：`datas` 与 `_instance_identities` 顺序一一对应，每项含
        主键和本次请求的 `properties`。
      parameters:
        - $ref: '#/components/parameters/ResponseFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveLogicPropertiesRequest'
            examples:
              指标求值:
                value:
                  kn_id: kn_medical
                  ot_id: ot_company
                  query: 最近一年这些药企的药品上市数量和经营健康度
                  _instance_identities:
                    - company_id: company_000001
                    - company_id: company_000002
                  properties:
                    - approved_drug_count
                    - business_health_score
              带调试信息:
                value:
                  kn_id: kn_medical
                  ot_id: ot_company
                  query: 最近一年这些药企的药品上市数量
                  additional_context: 'timezone=Asia/Shanghai; step=1d'
                  _instance_identities:
                    - company_id: company_000001
                  properties:
                    - approved_drug_count
                  options:
                    return_debug: true
      responses:
        '200':
          description: 逻辑属性值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveLogicPropertiesResponse'
            application/toon:
              schema:
                type: string
                description: TOON 编码的同一结构（`response_format=toon` 时）。
        '400':
          description: |
            参数错误，或动态参数缺失（`details` 含 `MISSING_INPUT_PARAMS`
            与逐属性的缺失说明）
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: |
            服务内部错误。动态参数生成失败（大模型或依赖服务异常）时
            `details` 含 `DYNAMIC_PARAMS_GENERATION_FAILED`
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

  /kn/query_metric:
    post:
      tags:
        - LogicProperty
      summary: 按指标口径取数
      operationId: queryMetric
      description: |
        按已建模指标自身的口径计算取数，是 OT-first 指标路径的第 3 步：
        `search_schema` / `get_kn_detail` 锁定对象类 → `get_object_types` 从
        `related_metrics` 里选定 `metric_id` → 本接口计算。

        与 `logic-property-resolver` 的分工：实例级、且已绑到逻辑属性的指标走那条
        （它会先用大模型推参数）；**类级指标、或未绑逻辑属性的指标走本接口**，参数
        由调用方显式给出，不经大模型。

        `time` 在指标没有时间维度（`related_metrics[].time_dimension` 为空）时可整体
        省略。给了就要自洽：**省略 `instant` 等同于 `instant=false`（序列查询），
        必须带 `step`**；`instant=true` 取单点（此时 `step` 被下游忽略）；
        `start` 与 `end` 要么都给要么都不给。`step` 大小写不敏感。

        这些规则在本服务就地校验并返回 400，规则逐条对齐 ontology-query 的
        `validateMetricQueryRequest`——本地比下游严会把合法调用误拒，比下游松只是
        把同一个错误延后。

        请求体与 ontology-query 的 `MetricQueryRequestBody` 同构；响应只保留结果序列，
        不回带指标定义（`related_metrics` 里已经有了）。
      parameters:
        - $ref: '#/components/parameters/ResponseFormat'
        - $ref: '#/components/parameters/XKnID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryMetricRequest'
            examples:
              取单点:
                value:
                  kn_id: kn_supplychain
                  metric_id: metric_product_total
              按维度拆分的区间序列:
                value:
                  kn_id: kn_supplychain
                  metric_id: metric_product_total
                  analysis_dimensions:
                    - region
                  time:
                    instant: false
                    start: 1735660800
                    end: 1743436800
                    step: month
      responses:
        '200':
          description: 指标结果序列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryMetricResponse'
            application/toon:
              schema:
                type: string
                description: TOON 编码的同一结构（`response_format=toon` 时）。
        '400':
          description: |
            缺 `kn_id` / `metric_id`，或时间窗不合法（序列查询缺 `step`、`step` 不是
            日历粒度、`start`/`end` 未成对、`start` 晚于 `end`、`fill_null` 用在
            非序列查询上）
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '401':
          description: 凭据缺失或无效
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '404':
          description: 指标不存在（下游 ontology-query 判定）
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'
        '500':
          description: 服务内部错误或下游异常
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorAgentRetrieval'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  parameters:
    ResponseFormat:
      name: response_format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - toon
        default: json
      description: 响应格式。`toon` 返回 `application/toon`，同构数组压成表格，省 token。
    XKnID:
      name: x-kn-id
      in: header
      required: false
      schema:
        type: string
      description: 知识网络 ID 的请求头写法；请求体里给了 `kn_id` 时以请求体为准。

  schemas:
    QueryMetricRequest:
      type: object
      required:
        - kn_id
        - metric_id
      properties:
        kn_id:
          type: string
          description: 知识网络 ID。也可用 `x-kn-id` 头传。
        metric_id:
          type: string
          description: |
            指标 ID，取自 `get_object_types` 返回的 `related_metrics[].id`，
            或对象类逻辑属性 `data_source` 里引用的指标 ID。
        time:
          $ref: '#/components/schemas/MetricTimeWindow'
        condition:
          type: object
          additionalProperties: true
          description: |
            过滤条件，结构与 `query_object_instance` 的 `condition` 一致
            （`field` / `operation` / `value` / `value_from`，可 `and` / `or` 嵌套）。
        analysis_dimensions:
          type: array
          items:
            type: string
          description: |
            分析维度（按维度拆分结果）。取值须来自
            `related_metrics[].analysis_dimensions`。
        order_by:
          type: array
          description: 结果排序。
          items:
            type: object
            properties:
              property:
                type: string
              direction:
                type: string
                enum:
                  - asc
                  - desc
        having:
          type: object
          description: 对聚合结果过滤。
          properties:
            field:
              type: string
            operation:
              type: string
            value: {}
        limit:
          type: integer
          description: 返回条数上限。
        fill_null:
          type: boolean
          default: false
          description: |
            区间查询时，无数据的步长点是否补空。仅对序列查询有效，且必须同时给
            `time.start` 与 `time.end`。

    MetricTimeWindow:
      type: object
      description: |
        时间窗。指标没有时间维度时可整体省略；给了就要自洽（见接口说明）。
      properties:
        instant:
          type: boolean
          description: '`true` 取单点（`step` 被忽略）；`false` 或**省略**取序列（必须带 `step`）。'
        start:
          type: integer
          format: int64
          description: 起始时间，unix 秒。
        end:
          type: integer
          format: int64
          description: 结束时间，unix 秒。
        step:
          type: string
          enum:
            - day
            - week
            - month
            - quarter
            - year
          description: 序列步长（大小写不敏感）。序列查询必传（含省略 `instant` 的情形）。

    QueryMetricResponse:
      type: object
      properties:
        kn_id:
          type: string
        metric_id:
          type: string
        datas:
          type: array
          description: |
            按 `labels` 分组的结果序列。未传 `analysis_dimensions` 时通常只有一条，
            `labels` 为空。
          items:
            $ref: '#/components/schemas/MetricDataSeries'
        overall_ms:
          type: integer
          format: int64
          description: 耗时（毫秒）。

    MetricDataSeries:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: 该序列对应的维度取值。
        times:
          type: array
          items: {}
          description: 时间点（unix 秒）。
        time_strs:
          type: array
          items:
            type: string
          description: 时间点的可读形式。
        values:
          type: array
          items: {}
          description: 与 `times` 一一对应的指标值。
        growth_values:
          type: array
          items: {}
        growth_rates:
          type: array
          items: {}
        proportions:
          type: array
          items: {}

    ResolveLogicPropertiesRequest:
      type: object
      required:
        - bkn_context
        - kn_id
        - ot_id
        - query
        - _instance_identities
        - properties
      properties:
        bkn_context:
          $ref: '../_shared/common.yaml#/components/schemas/BKNContext'
        kn_id:
          type: string
          description: 知识网络 ID。
        ot_id:
          type: string
          description: 对象类 ID。
        query:
          type: string
          description: |
            用户查询。需要包含时间范围、统计维度、业务上下文，用于生成
            `dynamic_params`。信息不足会导致 400 缺参。
        _instance_identities:
          type: array
          items:
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: number
                - type: boolean
          description: |
            对象实例标识数组，**必须从上游取，不可自拼**：先调
            `query_object_instance` 或 `query_instance_subgraph`，从每个对象的
            `_instance_identity` 取值，按原顺序组成数组。
          example:
            - company_id: company_000001
        properties:
          type: array
          items:
            type: string
          description: 要求值的逻辑属性名列表（`metric` 或 `operator`）。
        additional_context:
          type: string
          description: |
            补充上下文，如 timezone、instant、step 或对象属性，帮助模型生成更准的
            `dynamic_params`。
        llm_model:
          type: string
          description: 覆盖用于生成动态参数的大模型；留空走系统默认大模型。
        options:
          $ref: '#/components/schemas/ResolveOptions'

    ResolveOptions:
      type: object
      description: 高级选项。
      properties:
        return_debug:
          type: boolean
          default: false
          description: 是否返回 `debug`（生成的 dynamic_params、告警等）。
        max_repair_rounds:
          type: integer
          default: 1
          description: 参数生成失败时的重试修复轮数。
        max_concurrency:
          type: integer
          default: 4
          description: 多属性并发求值的并发上限。

    ResolveLogicPropertiesResponse:
      type: object
      required:
        - datas
      properties:
        datas:
          type: array
          items:
            type: object
            additionalProperties: true
          description: |
            与 `_instance_identities` 顺序一一对应，每项含主键与本次请求的
            `properties` 取值。
        debug:
          $ref: '#/components/schemas/ResolveDebugInfo'

    ResolveDebugInfo:
      type: object
      description: 仅 `options.return_debug=true` 时返回。
      properties:
        dynamic_params:
          type: object
          additionalProperties: true
          description: 模型生成的全部动态参数。
        agent_info:
          type: object
          additionalProperties: true
          description: 按属性分组的模型调用信息。
        now_ms:
          type: integer
          format: int64
          description: 服务端时间戳（Unix 毫秒），时间类参数以它为基准。
        warnings:
          type: array
          items:
            type: string
          description: 告警信息。
        trace_id:
          type: string
          description: 链路追踪 ID。
