---
openapi: 3.1.1
info:
  title: Semantic Understanding Task
  version: 0.1.0
  description: |
    Vega Backend asynchronous semantic-understanding task API. A task can target
    one Resource or an entire Catalog. The worker submits the task to bkn-agent
    and writes back results and application status asynchronously.
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /semantic-understanding-tasks:
    get:
      summary: List semantic-understanding tasks
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [resource, catalog]
        - name: catalog_id
          in: query
          schema: { type: string }
        - name: resource_id
          in: query
          schema: { type: string }
        - name: status
          description: Filter by status. Repeat the parameter for multiple statuses, which are combined with OR.
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [pending, running, completed, failed, cancelled]
        - name: apply_mode
          description: Application mode.
          in: query
          schema:
            type: string
            enum: [dry_run, fill_empty, force]
        - name: applied
          description: Whether the result has been applied.
          in: query
          schema:
            type: boolean
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          description: Sort field. Tasks with `start_time` or `finish_time` equal to `0` are sorted as ordinary numeric values.
          in: query
          schema:
            type: string
            enum: [create_time, start_time, finish_time]
            default: create_time
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSemanticUnderstandingTasks" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      summary: Create a semantic-understanding task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSemanticUnderstandingTaskRequest" }
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticUnderstandingTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /semantic-understanding-tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get semantic-understanding task details
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticUnderstandingTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      summary: Delete semantic-understanding tasks
      description: The path parameter may contain comma-separated task IDs. Running tasks cannot be deleted.
      parameters:
        - name: ignore_missing
          in: query
          schema: { type: boolean, default: false }
      responses:
        "204": { description: Deleted successfully }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  responses:
    BadRequest:
      description: Invalid request parameters or body
      content: { application/json: { schema: { $ref: "../_shared/errors.yaml#/components/schemas/Error" } } }
    Unauthorized:
      description: OAuth token validation failed
      content: { application/json: { schema: { $ref: "../_shared/errors.yaml#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "../_shared/errors.yaml#/components/schemas/Error" } } }
    Conflict:
      description: State conflict or an active task already exists
      content: { application/json: { schema: { $ref: "../_shared/errors.yaml#/components/schemas/Error" } } }
    InternalServerError:
      description: Internal server error
      content: { application/json: { schema: { $ref: "../_shared/errors.yaml#/components/schemas/Error" } } }
  schemas:
    AccountInfo:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
    SamplePolicy:
      type: object
      properties:
        masked:
          type: boolean
          enum: [false]
          description: Only unmasked sample rows are currently supported. Samples are stored in task input and sent to the semantic-understanding Agent.
        max_rows:
          type: integer
          minimum: 1
          maximum: 20
          description: Maximum sample rows sent to the semantic-understanding Agent. Each text cell retains at most 128 Unicode characters, and serialized samples are limited to 128 KiB; only complete leading rows are retained when exceeded.
    CreateSemanticUnderstandingTaskRequest:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [resource, catalog] }
        catalog_id: { type: string }
        resource_id: { type: string }
        apply_mode: { type: string, enum: [dry_run, fill_empty, force], default: fill_empty }
        confidence_threshold: { type: number, format: double, default: 0.75 }
        include_sample_rows:
          type: boolean
          description: Whether to read and send raw sample rows. Supported only for Resource semantic-understanding tasks. If sampling is unavailable, the task is still created and continues with no sample rows.
        sample_policy: { $ref: "#/components/schemas/SamplePolicy" }
      allOf:
        - if:
            properties: { scope: { const: resource } }
          then:
            required: [resource_id]
        - if:
            properties: { scope: { const: catalog } }
          then:
            required: [catalog_id]
    SemanticUnderstandingTask:
      type: object
      required: [id, scope, catalog_id, agent_id, input, input_hash, status, apply_mode, confidence_threshold, confidence, applied, creator, create_time]
      properties:
        id: { type: string }
        scope: { type: string, enum: [resource, catalog] }
        catalog_id: { type: string }
        catalog_name: { type: string }
        resource_id: { type: string }
        resource_name: { type: string }
        agent_task_id: { type: string }
        agent_id: { type: string }
        input: { type: string }
        input_hash: { type: string }
        status: { type: string, enum: [pending, running, completed, failed, cancelled] }
        apply_mode: { type: string, enum: [dry_run, fill_empty, force] }
        result_json: { type: string }
        confidence_threshold: { type: number, format: double }
        confidence: { type: number, format: double }
        confidence_detail_json: { type: string }
        apply_detail_json: { type: string }
        applied: { type: boolean }
        failure_detail: { type: string }
        creator: { $ref: "#/components/schemas/AccountInfo" }
        create_time: { type: integer, format: int64 }
        start_time: { type: integer, format: int64 }
        finish_time: { type: integer, format: int64 }
    ListSemanticUnderstandingTasks:
      type: object
      required: [entries, total_count]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/SemanticUnderstandingTaskSummary" }
        total_count: { type: integer, format: int64 }
    SemanticUnderstandingTaskSummary:
      type: object
      required: [id, scope, catalog_id, agent_id, status, apply_mode, confidence_threshold, confidence, applied, creator, create_time]
      properties:
        id: { type: string }
        scope: { type: string, enum: [resource, catalog] }
        catalog_id: { type: string }
        catalog_name: { type: string }
        resource_id: { type: string }
        resource_name: { type: string }
        agent_task_id: { type: string }
        agent_id: { type: string }
        status: { type: string, enum: [pending, running, completed, failed, cancelled] }
        apply_mode: { type: string, enum: [dry_run, fill_empty, force] }
        confidence_threshold: { type: number, format: double }
        confidence: { type: number, format: double }
        applied: { type: boolean }
        creator: { $ref: "#/components/schemas/AccountInfo" }
        create_time: { type: integer, format: int64 }
        start_time: { type: integer, format: int64 }
        finish_time: { type: integer, format: int64 }
