---
openapi: 3.1.1
info:
  title: ConnectorType
  description: |
    APIs for Vega Backend connector types.

    A connector type describes a registered data-source driver, such as mysql,
    postgresql, or opensearch, together with its registration metadata and enabled
    state. Field configuration (`field_config`, compatible with JSON Schema
    `properties`) is returned only by the detail endpoint and is obtained from the
    runtime implementation. Local definitions come from implementations in the
    current process; runtime field definitions for remote connectors are not yet
    implemented. `mode` distinguishes in-process `local` connectors from `remote`
    connectors invoked over HTTP. `category` identifies the data-source category.
  version: 0.1.0
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /connector-types:
    get:
      summary: List connector types
      description: Returns paginated summaries of registered connector types without `field_config`. Supports filtering by `name`, `tag`, `mode`, `category`, `enabled`, and `available`.
      parameters:
        - name: name
          description: Filters connector types whose name contains this value.
          in: query
          schema:
            type: string
        - name: tag
          description: Filters by an exact tag match. Empty by default.
          in: query
          schema:
            type: string
        - name: mode
          description: Filters by runtime mode.
          in: query
          schema:
            type: string
            enum:
              - local
              - remote
        - name: category
          description: Filters by category.
          in: query
          schema:
            type: string
            enum:
              - table
              - index
              - topic
              - file
              - fileset
              - metric
              - api
        - name: enabled
          description: Filters by enabled state. Omit to disable this filter.
          in: query
          schema:
            type: boolean
        - name: available
          description: Filters by whether the running binary includes the connector implementation. Omit to disable this filter.
          in: query
          schema:
            type: boolean
        - name: offset
          description: Pagination offset. Must be at least 0 and defaults to 0.
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          description: Page size from 1 to 1000. Use -1 to disable pagination. Defaults to 20.
          in: query
          schema:
            type: integer
            format: int64
            default: 20
        - name: sort
          description: Sort field. Defaults to `name`.
          in: query
          schema:
            type: string
            enum:
              - name
            default: name
        - name: direction
          description: Sort direction. Defaults to `desc`.
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConnectorTypes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Register a connector type
      description: Creates a connector type. `type` must be unique; an existing value returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorTypeReq"
      responses:
        "201":
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTypeRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          description: A connector type with the same `type` already exists
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /connector-types/{type}:
    parameters:
      - name: type
        description: Connector type identifier, such as `mysql` or `postgresql`.
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get connector type details
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The runtime connector field definition is unavailable, for example because remote connector field definitions are not implemented. The error code is `VegaBackend.ConnectorType.FieldConfigUnavailable`.
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update a connector type
      description: |
        Fully updates the connector type identified by the `type` path parameter.
        The primary key cannot be changed.

        The request body must include `type`, and it must exactly match the path parameter:
        - Missing → 400 `VegaBackend.ConnectorType.InvalidParameter.Type`.
        - Mismatch → 409 `VegaBackend.ConnectorType.TypeMismatch`.

        If a new `name` is already used by another type, the endpoint returns 409
        `VegaBackend.ConnectorType.NameExists`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorTypeReq"
      responses:
        "204":
          description: Updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          description: |
            Primary-key or name conflict:
            - Request-body `type` differs from the path parameter → `VegaBackend.ConnectorType.TypeMismatch`.
            - The new `name` is already used by another connector type → `VegaBackend.ConnectorType.NameExists`.
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete a connector type
      description: Deletes the connector type identified by `type`. Built-in types with `mode=local` cannot be deleted and return 403.
      responses:
        "204":
          description: Deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The connector type cannot be deleted, for example a built-in local type
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /connector-types/{type}/enable:
    parameters:
      - name: type
        description: Connector type identifier
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Enable a connector type
      description: Enables the connector type. The operation is idempotent.
      responses:
        "204":
          description: Enabled successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /connector-types/{type}/disable:
    parameters:
      - name: type
        description: Connector type identifier
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Disable a connector type
      description: Disables the connector type. The operation is idempotent.
      responses:
        "204":
          description: Disabled successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  responses:
    BadRequest:
      description: Invalid request parameters or request body
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized because OAuth token validation failed
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotAcceptable:
      description: Content-Type is not `application/json`
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
  schemas:
    ConnectorFieldConfig:
      description: Connector configuration-field metadata compatible with JSON Schema `properties`.
      type: object
      required:
        - name
        - type
      properties:
        name:
          description: Field display name
          type: string
        type:
          description: Field type
          type: string
          enum:
            - string
            - integer
            - number
            - boolean
            - object
            - array
        description:
          description: Field description
          type: string
        required:
          description: Whether the field is required
          type: boolean
          default: false
        encrypted:
          description: Whether the field must be stored encrypted (custom extension)
          type: boolean
          default: false
    ConnectorTypeSummary:
      description: Summary of a registered connector type without runtime field definitions.
      type: object
      required:
        - type
        - name
        - mode
        - category
        - enabled
        - available
      properties:
        type:
          description: Globally unique connector type identifier
          type: string
        name:
          description: Connector type display name
          type: string
        tags:
          description: Tags
          type: array
          items:
            type: string
        description:
          description: Type description
          type: string
        mode:
          description: Runtime mode
          type: string
          enum: [local, remote]
        category:
          description: Category
          type: string
          enum: [table, index, topic, file, fileset, metric, api]
        endpoint:
          description: Remote service address, used only in `remote` mode
          type: string
        enabled:
          description: Whether the connector type is enabled
          type: boolean
        available:
          description: Whether the running binary includes this connector implementation
          type: boolean
        operations:
          description: Operations the current user may perform on this connector type
          type: array
          items:
            type: string
    ConnectorType:
      description: Connector type details. `field_config` is read from the runtime; it is omitted when `available` is false.
      type: object
      required:
        - type
        - name
        - mode
        - category
        - enabled
        - available
      properties:
        type:
          description: Globally unique connector type identifier
          type: string
        name:
          description: Connector type display name
          type: string
        tags:
          description: Tags
          type: array
          items:
            type: string
        description:
          description: Type description
          type: string
        mode:
          description: Runtime mode
          type: string
          enum:
            - local
            - remote
        category:
          description: Category
          type: string
          enum:
            - table
            - index
            - topic
            - file
            - fileset
            - metric
            - api
        endpoint:
          description: Remote service address, used only in `remote` mode
          type: string
        field_config:
          description: Field configuration compatible with JSON Schema `properties`; each key is a field identifier
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ConnectorFieldConfig"
        enabled:
          description: Whether the connector type is enabled
          type: boolean
        available:
          description: Whether the running binary includes this connector implementation
          type: boolean
        operations:
          description: Operations supported by this connector type
          type: array
          items:
            type: string
    ConnectorTypeReq:
      description: |
        Request body for creating or updating a connector type.

        - `type` is required for both POST and PUT and identifies the resource primary key.
        - For POST, `type` must be globally unique. An existing value returns 409
          `VegaBackend.ConnectorType.TypeExists`.
        - When POST or PUT registers or updates a `local` connector, the running binary
          must contain the implementation registered under that key. `name` may change,
          while `mode` and `category` must match the code definition.
        - Field definitions are neither accepted by registration requests nor persisted;
          read the runtime definitions through the detail endpoint.
        - For PUT, `type` must exactly match the path parameter. A missing value returns
          400 `VegaBackend.ConnectorType.InvalidParameter.Type`; a mismatch returns 409
          `VegaBackend.ConnectorType.TypeMismatch`.
      type: object
      required:
        - type
        - name
        - mode
        - category
      properties:
        type:
          description: Connector type identifier. Required for POST and PUT; for PUT it must match the path parameter.
          type: string
        name:
          description: Connector type display name
          type: string
        tags:
          description: Tags
          type: array
          items:
            type: string
        description:
          description: Type description
          type: string
        mode:
          description: Runtime mode
          type: string
          enum:
            - local
            - remote
        category:
          description: Category. When POST or PUT registers or updates a local connector, this must match the backend code definition.
          type: string
          enum:
            - table
            - index
            - topic
            - file
            - fileset
            - metric
            - api
        endpoint:
          description: Remote service address, used only in `remote` mode
          type: string
        enabled:
          description: Whether the connector type is enabled
          type: boolean
          default: false
    ListConnectorTypes:
      description: Connector type list
      type: object
      required:
        - entries
        - total_count
      properties:
        entries:
          description: Entries
          type: array
          items:
            $ref: "#/components/schemas/ConnectorTypeSummary"
        total_count:
          description: Total number of entries
          type: integer
          format: int64
    ConnectorTypeRef:
      description: Connector type reference
      type: object
      required:
        - type
      properties:
        type:
          description: Connector type identifier
          type: string
