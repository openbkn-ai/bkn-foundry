---
openapi: 3.1.1
info:
  title: Resource Data
  description: |
    Vega Backend Resource 数据子资源（`/resources/{id}/data`）相关 API。

    本规范覆盖两类语义：

    1. **通用资源数据查询**：`POST /resources/{id}/data` + `X-HTTP-Method-Override: GET`，
       对任意 category 的 Resource 执行数据查询（filter + 分页）。
    2. **dataset documents 的写/删/访问**：`POST` 的 `Override: POST` 创建一条文档，
       `PUT` 完整替换一条文档，`GET` / `DELETE` 支持按逗号分隔的文档 ID 批量操作；
       它们以及 `POST` 的 `Override: DELETE` 分支，仅对 `Resource.category=dataset` 生效。

    **dataset 不顶层化**：dataset 在系统中只是 `Resource.category=dataset` 的特化形态，
    无独立 ID 体系。CRUD 走 `/resources/{id}`，仅 documents 子资源（即本规范）独立 API surface。

    端点设计遵循 [vega-backend/CLAUDE.md] 的"端点设计规则"。`POST /data` 用
    `X-HTTP-Method-Override` 头多分发，是为了兼容现有 query 语义并在同一条路径上
    暴露 create / delete-by-filter，避免在仓库内引入新的"动作端点"形态。

    **错误码复用 Resource 系列**：本规范不引入 `Dataset.*` 专属错误码；单条文档不存在
    与 resource 不存在共用 `VegaBackend.Resource.NotFound`，靠 `error_details` 区分。
  version: 0.1.0
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /resources/{id}/data:
    parameters:
      - name: id
        description: Resource ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Resource 数据多分发端点
      description: |
        **必须**带 `X-HTTP-Method-Override` 头，值是 `GET` / `POST` / `DELETE` 之一
        （大小写不敏感）；缺失或值非法返回 400 `VegaBackend.InvalidParameter.OverrideMethod`。

        三种分支：

        | Override | 行为 | category 限制 | body schema |
        |---|---|---|---|
        | `GET` | 列表 / 查询文档 | 任意（兼容现有通用查询） | `ResourceDataQueryParams` |
        | `POST` | 创建一条文档 | **dataset 强制** | `Document`（`_id` 可选，无则后端生成） |
        | `DELETE` | 按 filter 删除文档 | **dataset 强制** | `ResourceDataQueryParams`（`filter_condition` 必填非空） |

        **`Override: GET` 响应**：200 + `{ entries, total_count, paging }`。cursor 模式通过
        `paging.next_cursor` 续页；`total_count` 仅在 `need_total=true` 时返回。

        **`Override: POST` 响应**：201 + `{ id }`。后端为未指定 id 的文档生成 id。

        **`Override: DELETE` 响应**：204。空 `filter_condition` 拒绝 400 避免误删全表。

        非 dataset category 的 resource 调 Override=POST/DELETE → 400
        `VegaBackend.Resource.InternalError.InvalidCategory`。
      parameters:
        - name: X-HTTP-Method-Override
          description: 必填；值为 GET / POST / DELETE 之一
          in: header
          required: true
          schema:
            type: string
            enum:
              - GET
              - POST
              - DELETE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ResourceDataQueryParams"
                - $ref: "#/components/schemas/Document"
      responses:
        "200":
          description: Override=GET 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "201":
          description: Override=POST 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "204":
          description: Override=DELETE 删除成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /resources/{id}/data/{docid}:
    parameters:
      - name: id
        description: Resource ID
        in: path
        required: true
        schema:
          type: string
      - name: docid
        description: |
          文档 ID 或以逗号分隔的文档 ID 列表。服务端会删除空白项并保留首次出现的 ID；
          处理后没有 ID 时返回 400。PUT 仅接受单个文档 ID。
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 获取一个或多个 dataset 文档
      description: |
        按请求 ID 顺序返回 `{ "entries": [...] }`，单 ID 也使用同一响应结构。
        默认严格：任一文档不存在即返回 404。`?ignore_missing=true` 时跳过缺失文档。

        category 限制：仅 `dataset`。Resource 当前不可查询时返回 409，状态优先级和
        列表查询一致。
      parameters:
        - name: ignore_missing
          description: 容忍缺失文档，跳过而非返回 404；默认 false
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentEntriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: 完整替换一个 dataset 文档（upsert）
      description: |
        `docid` 是目标文档 ID。body 中的 `_id` 会被路径参数覆盖；文档已存在时完整替换，
        不存在时以该 ID 创建，不支持 patch/merge 更新。

        对 `string` / `text` 字段上的 vector Feature：若 body 显式携带派生字段
        `<field>_vector`，服务端校验后直接使用；否则源文本非空时同步生成向量。生成或
        校验失败时不会向 OpenSearch 写入该文档。

        category 限制：仅 `dataset`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Document"
      responses:
        "200":
          description: 替换或创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: 按 ID 删除一个或多个 dataset 文档
      description: |
        默认严格：服务端在删除前核验全部文档，任一不存在即返回 404，且不发起删除。
        `?ignore_missing=true` 时跳过不存在的文档，仅删除已找到的文档。

        这是一请求内的预检语义；预检后发生的并发删除仍可能使底层批量删除失败。
        category 限制：仅 `dataset`。
      parameters:
        - name: ignore_missing
          description: 容忍缺失文档，跳过而非返回 404；默认 false
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: 删除成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  responses:
    BadRequest:
      description: |
        请求参数 / 请求体非法。常见 errcode：
        - `VegaBackend.InvalidParameter.OverrideMethod`：POST 缺/错 Override 头
        - `VegaBackend.InvalidParameter.RequestBody`：body schema / 必填字段不合法
        - `VegaBackend.InvalidParameter.FilterCondition`：filter_condition 解析失败
        - `VegaBackend.Resource.InternalError.InvalidCategory`：写/删/单条 GET 操作针对非 dataset resource
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: 未授权（OAuth Token 校验失败）
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotFound:
      description: |
        Resource 或文档不存在。errcode `VegaBackend.Resource.NotFound`；
        通过 `error_details` 字符串区分是 resource 还是 document 找不到。
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Conflict:
      description: |
        Resource 当前无法查询，按以下优先级返回 errcode：
        - `status=disabled`：`VegaBackend.Resource.NotQueryable`
        - `status=stale`：`VegaBackend.Resource.NotQueryable`
        - `last_discover_status=missing`：`VegaBackend.Resource.MetadataUnavailable`
        - 其他状态下 `schema_definition` 为空：`VegaBackend.Resource.MetadataUnavailable`
        - `POST /resources/{id}/data` 的 `Override: GET` 分支中，Resource 状态和元数据均
          可查询但所属 Catalog 已禁用：`VegaBackend.Catalog.IsDisabled`

        因此同时满足多个条件时，以列表中靠前的条件为准。元数据不可用时，调用方应
        重新探查并刷新资源字段；`missing` 资源还需要先恢复源端对象。
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotAcceptable:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalServerError:
      description: 服务内部错误（如底层 OpenSearch / 索引故障）
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
  schemas:
    Document:
      description: |
        文档对象。content 字段集开放，由具体 dataset schema 决定。
        - `POST /resources/{id}/data`（Override=POST）创建一条文档；`_id` 可选。
        - `PUT /resources/{id}/data/{docid}` 如携带 `_id`，以 path 为准。
      type: object
      additionalProperties: true
      properties:
        _id:
          description: 文档 ID
          type: string
    DocumentEntriesResponse:
      description: 按文档 ID 获取的响应；entries 顺序与有效请求 ID 一致。
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Document"
    ResourceDataQueryParams:
      description: |
        查询 / 删除参数。`Override: GET` 用 filter+分页查询；`Override: DELETE` 用
        `filter_condition` 删除（filter 必须非空，否则 400）。
      type: object
      properties:
        filter_condition:
          description: |
            过滤条件，结构由 `FilterCondCfg` 决定。Override=DELETE 时必填且非空。
          type: object
          additionalProperties: true
        paging:
          $ref: "#/components/schemas/PagingRequest"
        sort:
          description: 排序字段
          type: array
          items:
            $ref: "#/components/schemas/SortField"
        output_fields:
          description: 指定输出字段列表
          type: array
          items:
            type: string
        need_total:
          description: 是否在响应里携带 total_count。cursor 首次请求的值会被冻结；续页携带的值被忽略。
          type: boolean
          default: false
        aggregation:
          $ref: "#/components/schemas/Aggregation"
        group_by:
          type: array
          items:
            $ref: "#/components/schemas/GroupByItem"
        having:
          $ref: "#/components/schemas/HavingClause"
    SortField:
      type: object
      required:
        - field
        - direction
      properties:
        field:
          type: string
        direction:
          type: string
          enum: [asc, desc]
    Aggregation:
      type: object
      required: [property, aggr]
      properties:
        property: { type: string }
        aggr:
          type: string
          enum: [count, count_distinct, sum, max, min, avg]
        alias: { type: string }
    GroupByItem:
      type: object
      required: [property]
      properties:
        property: { type: string }
        description: { type: string }
        calendar_interval:
          type: string
          enum: [minute, hour, day, week, month, quarter, year]
    HavingClause:
      type: object
      required: [field, operation, value]
      properties:
        field:
          type: string
          enum: [__value, "count(*)"]
        operation:
          type: string
          enum: ["==", "!=", ">", ">=", "<", "<=", in, not_in, range, out_range]
        value: {}
    ListResponse:
      description: |
        查询响应。`total_count` 仅在请求 `need_total=true` 时返回。
      type: object
      required:
        - entries
      properties:
        entries:
          description: 文档条目
          type: array
          items:
            $ref: "#/components/schemas/Document"
        total_count:
          description: 总条数（仅 need_total=true 时返回）
          type: integer
          format: int64
        paging:
          $ref: "#/components/schemas/PagingResponse"
        warnings:
          description: 非阻断告警
          type: array
          items:
            type: string
    PagingRequest:
      description: 首次请求使用 offset 和 limit；cursor 续页以 cursor 定位，need_total 可携带但不会覆盖首次请求冻结值，其余查询参数不得重传。
      type: object
      allOf:
        - if:
            required: [mode]
            properties:
              mode:
                const: cursor
          then:
            required: [limit]
            properties:
              keep_alive_sec:
                minimum: 60
                maximum: 3600
      properties:
        mode:
          type: string
          enum: [single, cursor]
          default: single
        offset:
          description: 首次请求的起始偏移，>=0；实际物理查询为 OpenSearch 的非聚合请求要求 offset + limit 不超过 10000。
          type: integer
          minimum: 0
        limit:
          description: 单次最多返回条数；cursor 模式必填，范围 [1, 10000]。
          type: integer
          minimum: 1
          maximum: 10000
        keep_alive_sec:
          description: cursor 成功取页后的空闲租约秒数；首次 cursor 请求时取值范围 [60, 3600]，single 模式下忽略。省略时默认 1800。
          type: integer
        cursor:
          type: string
    PagingResponse:
      type: object
      required: [next_cursor, expires_at_sec]
      properties:
        next_cursor:
          type: [string, "null"]
        expires_at_sec:
          type: [integer, "null"]
          format: int64
    IdResponse:
      description: 单条写入操作的响应。服务端返回的是单数 `id`，不是 `ids` 数组
      type: object
      required:
        - id
      properties:
        id:
          description: 文档 ID
          type: string
