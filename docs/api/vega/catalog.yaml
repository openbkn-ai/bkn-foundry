---
openapi: 3.1.1
info:
  title: VEGA 引擎 · 目录 API
  description: |
    Vega Backend Catalog（数据目录）API。

    Catalog 是一个数据源连接的抽象，对应一个物理数据源（MySQL / SQL Server / OpenSearch / S3 等）
    或逻辑目录（虚拟视图）。资源（`Resource`）按 catalog 归属注册。

    **HTTP API 连接器（`connector_type: http`，专业版及以上）**

    EE 提供通用 HTTP API 连接器；首次使用时通过既有连接器类型注册入口创建并启用
    `type=http`、`mode=local`、`category=api` 的类型记录。社区版或未装配实现时不能使用。
    该 Catalog 仍是 `physical`，持久化只读 category=api；类别由服务端从连接器取得，逻辑 Catalog 的 category 为空字符串。

    创建和显式配置更新先做本地配置校验，再沿用物理 Catalog 流程执行连接测试；
    成功保存为 `healthy`，连接失败默认不保存，`allow_unhealthy=true` 时可保存为 `unhealthy`。
    连接测试、显式预检和周期健康检查共用连接器 TestConnection，HTTP API 实现仅做 TCP/TLS 探测，
    不登录、不发送 HTTP 请求、不验证凭据或业务访问权限。
    API Catalog 沿用物理目录的健康检查计划：默认继承平台计划，也可显式启用、修改或禁用。
    HTTP API 连接测试只验证目标 TCP 连通性，HTTPS 额外完成使用默认信任链和主机名校验的 TLS 握手；
    不发送 HTTP 请求、不登录、不验证凭据或业务权限。健康结果仅代表该传输层可达性，
    不能作为 read Resource 业务验证结果。实际认证与 read Resource 的业务验证随后续 Resource 执行交付。
    通用 HTTP 连接器声明 SupportDiscover=false，不支持发现任务或发现计划；探查入口依据连接器声明的能力校验，不按名称 http 或类别 api 一律拒绝。配置结构见 `HTTPAPIConnectorConfig`。
    连接器固定配置字段名按定义精确区分大小写；大小写变体按未知字段忽略，不参与解码。`variables` 的动态成员名及驱动 options 的成员名和值保持原样，不递归改名。
    Token、API Key 和其他自定义参数及凭据统一存入 `variables`，
    `sensitive_variables` 直接列出其中需要保护的成员名，例如 `["app_secret"]`。模板仍直接使用 `{{ app_secret }}`。同名顶层字段和 variables 成员同时存在时，加密、解密及普通读取隐藏均处理两处，不能因顶层字段存在而漏处理变量。
    调用方提交敏感明文，不预先加密；创建或显式更新时，敏感值以大小写任意形式的 `enc:` 开头均返回 400，该限制不受 Crypto 开关影响。启用平台 Crypto 后，后端使用 AES-256-GCM 加密独立存储副本，保存 `ENC:Base64(nonce + 含认证标签的密文)`；nonce 由后端生成，与密文同字段保存，无需额外数据库列。
    显式关闭 Crypto 时沿用明文保存策略。开关只控制新写入：读取明文时保持原值，读取带 ENC: 标记的密文时始终使用原 AES 密钥解密；关闭后仍需保留该密钥，缺钥、编码错误或认证失败时明确报错，不回退为明文。不兼容 RSA 密文，不进行数据迁移。新配置的连接测试直接使用明文，不进行存储加解密，也不修改原请求。

    **SQL Server 连接器（`connector_type: sqlserver`）**

    ```json
    {
      "connector_type": "sqlserver",
      "connector_config": {
        "host": "sqlserver.example.com",
        "port": 1433,
        "username": "vega_reader",
        "password": "<password>",
        "database": "sales",
        "schemas": ["dbo", "reporting"],
        "options": {
          "encrypt": true,
          "trustservercertificate": false,
          "hostnameincertificate": "sqlserver.example.com",
          "connection timeout": 30,
          "app name": "vega-backend"
        }
      }
    }
    ```

    - `host`、`port`、`username`、`password`、`database` 必填；`schemas` 为空时发现当前账号可见的非系统 schema。
    - `options` 仅允许 `encrypt`、`trustservercertificate`、`hostnameincertificate`、
      `connection timeout` 和 `app name`（名称不区分大小写）；其中前两项必须是 boolean。
    - 推荐使用独立只读账号，并授予目标数据库的连接、元数据查看和查询权限。例如：
      `GRANT CONNECT TO [vega_reader]`、`GRANT VIEW DEFINITION TO [vega_reader]`，以及
      `ALTER ROLE [db_datareader] ADD MEMBER [vega_reader]`；不要授予 `db_datawriter`、`db_ddladmin` 或 `db_owner`。
    - TLS 可通过上述驱动参数启用；`trustservercertificate: true` 会跳过服务端证书校验，只适合受控测试环境。
      未配置 `encrypt` 时使用 go-mssqldb v1.9.2 的 `EncryptionOff` 默认行为，即客户端不主动要求全程加密；
      如需确定启用 TLS，应显式配置 `encrypt: true` 和 `trustservercertificate: false`。
      当前未提供自定义 CA 文件配置，TLS 成功与失败路径尚待真实 SQL Server 环境验收。
    - 一个 Catalog 只连接一个 database，并在其中按 schema 发现对象；不支持跨数据库发现、CDC 和 Windows 集成认证。

    本文件仅包含 catalog 自身的 CRUD 与状态相关端点。跨资源的便利端点：
    - `POST /catalogs/{id}/discover`（手动发现一次） → 见 `discover-task.yaml`
    - `GET /catalogs/{ids}/resources`（按 catalog 列资源） → 见 `resource.yaml`
    - `GET /catalogs/{cid}/discover-schedules`（按 catalog 列调度） → 见 `discover-schedule.yaml`
    - `GET/PUT /catalogs/{id}/health-check-schedule`（健康检查计划） → 见 `catalog-health-check-schedule.yaml`

    每个外部接口都有一一对应的内部版本，路径前缀为 `/api/vega-backend/in/v1`，请求体与
    响应结构与外部完全一致；区别仅在于鉴权方式：外部走 OAuth Token 校验，内部从请求头
    （`X-Account-ID` / `X-Account-Type`）解析访问者。

    本文档仅描述外部接口。
  version: 0.2.1
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /catalogs/stats/by-connector-type:
    get:
      summary: 按连接器类型统计可见 catalog
      description: |
        返回当前用户具有 `view_detail` 权限的 catalog，按 `catalog_type` 与 `connector_type` 聚合后的数量。
        `catalog_type=logical` 的条目没有关联连接器，其 `connector_type` 固定为空字符串。
        该接口仅供目录树首层展示使用，不返回 catalog 详情或连接配置。
      parameters:
        - name: name
          in: query
          description: 按 catalog 名称模糊过滤后再聚合
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [catalog_type, connector_type, catalog_count]
                      properties:
                        catalog_type:
                          type: string
                          enum: [physical, logical]
                        connector_type:
                          type: string
                        catalog_count:
                          type: integer
                          format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs:
    get:
      summary: 获取 catalog 列表
      description: |
        分页获取 catalog 摘要；支持按 name、tag、type、connector_type、health_check_status 过滤。
        列表不返回详情专属的 `connector_config` 与 `metadata`，需要这些字段时使用
        `GET /catalogs/{id}`。

      parameters:
        - name: name
          description: 按名称模糊过滤，匹配名称中包含该值的 catalog
          in: query
          schema:
            type: string
        - name: tag
          description: 按标签精确过滤
          in: query
          schema:
            type: string
        - name: type
          description: 按 catalog 类型过滤
          in: query
          schema:
            type: string
            enum:
              - physical
              - logical
        - name: connector_type
          description: 按连接器类型过滤
          in: query
          schema:
            type: string
        - name: health_check_status
          description: 按健康检查状态过滤
          in: query
          schema:
            type: string
            enum:
              - healthy
              - degraded
              - unhealthy
              - offline
              - unchecked
        - name: enabled
          description: 按 catalog 启用状态过滤
          in: query
          schema:
            type: boolean
        - name: offset
          description: 分页偏移量，>=0，默认 0
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          description: 每页数量，1-1000，-1 表示不分页，默认 20
          in: query
          schema:
            type: integer
            format: int64
            default: 20
        - name: sort
          description: 排序字段
          in: query
          schema:
            type: string
            enum:
              - name
              - create_time
              - update_time
            default: update_time
        - name: direction
          description: 排序方向
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCatalogs"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: 创建 catalog
      description: |
        创建一个新的 catalog。`name` 全局唯一，已存在时返回 409。
        `connector_type` 必须是已注册且 enabled 的连接器类型。

        物理 Catalog（包括 HTTP API）的 category 由服务端从连接器取得，调用方不配置；逻辑 Catalog 保存空字符串。物理 Catalog 在持久化前执行一次连接测试。默认连接失败返回 400，且不会创建 Catalog；
        可传 `allow_unhealthy=true` 保存该 Catalog，并将其健康状态记为 `unhealthy`。
        HTTP API 的成功仅表示 TCP/TLS 可达；`allow_unhealthy` 不豁免本地配置或版本校验。
      parameters:
        - name: allow_unhealthy
          in: query
          description: |
            是否在物理 Catalog 的连接测试失败时仍继续创建。默认 `false`；为 `true` 时创建成功，
            但初始健康状态为 `unhealthy`。配置校验、敏感明文使用 enc: 保留前缀（忽略大小写）或连接器创建失败仍返回 400；存储加密失败返回 500，allow_unhealthy 不豁免加密失败。
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          description: 同名 catalog 已存在 / connector_type 未启用
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}:
    parameters:
      - name: id
        description: catalog ID，多个用英文逗号分隔（如 `id1,id2,id3`）
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 获取 catalog 详情
      description: |
        路径参数支持单条或批量（逗号分隔）。重复 ID 按首次出现的位置去重；
        `entries` 按请求中的 ID 顺序返回。任一 ID 不存在时，整批返回 404。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Catalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: 删除 catalog
      description: |
        一次只允许删除一个 catalog；路径参数包含逗号时返回 400。删除会同步移除该 catalog 下的资源、
        探查计划与健康检查计划，以及全部关联的构建、探查和语义理解任务记录（包括 pending 和终态历史记录）。
        构建索引不在此流程中清理。存在 `running` 任务时拒绝删除，
        构建任务处于 `stopping` 时也会拒绝删除。

        传入 `dry_run=true` 时仅执行权限、存在性和影响分析，不写入任何数据；返回该 catalog
        的资源、构建任务、探查计划、健康检查计划、探查任务和语义理解任务计数；
        `protected_resources` 返回不能随 Catalog 级联删除的 dataset/logical_view 数量，`blockers`
        返回稳定的机器可读阻断原因。`can_delete` 严格反映当前 DELETE 的阻断规则，调用方仍须
        以不带 `dry_run` 的请求结果为准，因为预检与实际删除之间可能有并发变更。
      parameters:
        - name: dry_run
          in: query
          required: false
          description: 为 true 时模拟删除并返回影响报告；默认 false，执行真实删除。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: dry_run 影响报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDeletionImpact"
        "204":
          description: 删除成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: 修改 catalog
      description: |
        全量更新指定 catalog。catalog 由路径参数 `id` 唯一确定（主键不可改）。

        请求体的 `id` 字段可省略，省略时使用路径参数 `id`；显式提供时必须与路径参数完全一致：
        - 格式非法 → 400 `VegaBackend.InvalidParameter.ID`。
        - 与路径参数不一致 → 409 `VegaBackend.Catalog.IDMismatch`。

        `name` 改动后若新名称已被其它 catalog 占用，返回 409 `VegaBackend.Catalog.NameExists`。

        必须传入 `expected_update_time` 进行乐观并发控制。该值应取自最近一次查询响应的
        `update_time`；若 catalog 已被其他请求更新，返回 409 `VegaBackend.Catalog.UpdateConflict`。

        `enabled` 不能通过 PUT 切换；请求体中的 `enabled` 必须与当前 catalog 状态一致。
        如需启用/禁用，使用 `POST /catalogs/{id}/enable` 或 `POST /catalogs/{id}/disable`。

        `connector_config` 是全量更新的例外：省略或传 `null` 时保留已存连接配置及敏感字段，
        非 API 类别不执行敏感字段解密、连接器创建或连接测试，健康状态及检查结果保持不变。
        API 身份由 Catalog 已保存的 category=api 判定，不依赖类型名称 http；API 类别即使省略配置，仍解密已存配置并通过本地实例创建校验实现、版本和配置，且不访问上游。
        因此只修改名称、标签或描述不要求数据源当前可连接，也不需要 `allow_unhealthy=true`。
        其他字段仍遵循上述全量更新约定，并继续校验 `expected_update_time`。

        显式提交 `connector_config` 对象时，按完整配置替换，不与已存配置合并；
        `{}` 是显式空配置，仍须通过连接器配置校验，不等同于省略。
        修改影响发现范围的字段后，旧 Resource 会在下一次 discover 对齐时标记为 `stale`。

        显式修改物理 Catalog 配置时会先执行连接测试。默认连接失败返回 400，且不会持久化更新；
        可传 `allow_unhealthy=true` 保存更新，并将健康状态记为 `unhealthy`。
        HTTP API 配置更新也执行 TCP/TLS 连接测试；省略配置的元数据更新仅本地校验已存实例，
        不新增网络探测并保留已有健康状态及结果。
      parameters:
        - name: allow_unhealthy
          in: query
          description: |
            是否在物理 Catalog 的连接测试失败时仍继续更新。默认 `false`；为 `true` 时更新成功，
            但健康状态为 `unhealthy`。配置校验、敏感明文使用 enc: 保留前缀（忽略大小写）或连接器创建失败仍返回 400；存储加密失败返回 500，allow_unhealthy 不豁免加密失败。
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CatalogRequest"
                - type: object
                  required:
                    - expected_update_time
      responses:
        "204":
          description: 更新成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          description: |
            主键 / 名称冲突。可能的错误码：
            - `VegaBackend.Catalog.IDMismatch`
            - `VegaBackend.Catalog.NameExists`
            - `VegaBackend.Catalog.InvalidParameter`（尝试通过 PUT 切换 enabled）
            - `VegaBackend.Catalog.UpdateConflict`（`expected_update_time` 与当前 `update_time` 不一致）
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/enable:
    parameters:
      - name: id
        description: catalog ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 启用 catalog
      description: |
        启用 catalog。接口幂等：已启用的 catalog 再次启用返回 204。
        从禁用切换为启用时，`health_check_status` 重置为 `unchecked`。
      responses:
        "204":
          description: 启用成功或已启用
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/disable:
    parameters:
      - name: id
        description: catalog ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 禁用 catalog
      description: |
        禁用 catalog。接口幂等：已禁用的 catalog 再次禁用返回 204。
        禁用不会覆盖 `health_check_status`，健康状态保留最近一次检查结果。
      responses:
        "204":
          description: 禁用成功或已禁用
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/test-connection:
    post:
      summary: 预检未保存的 Catalog 连接配置
      description: |
        使用请求中的 `connector_type` 与 `connector_config` 执行一次同步连接测试。
        本接口不创建或更新 Catalog，也不持久化健康状态；适用于创建或编辑表单保存前的“测试连接”。
        HTTP API 类型与其他物理连接器共用显式测试接口，但仅执行目标 TCP/TLS 可达性探测；
        与创建、配置更新及周期健康检查一致，不发送 HTTP 请求、不登录、不验证凭据或 read Resource。
        TCP/TLS 可达不代表认证或业务读取成功。

        探测结果通过响应体 `success` 字段返回；目标不可达不视为 HTTP 错误：
        - 连通 → 200 `{ success: true, message }`
        - 连不通 → 200 `{ success: false, message }`
        - 非 2xx 仅用于请求、鉴权、参数校验或服务内部错误。

        失败时 `message` 保留连接器返回的诊断详情（例如主机、端口、用户名、数据库名和驱动错误），
        但会替换连接器声明的密码、token 等敏感配置值，并限制异常超长的远端响应。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogConnectionTestRequest"
      responses:
        "200":
          description: 探测完成（成功或失败均返回，业务结果看 `success` 字段）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/health-status:
    parameters:
      - name: id
        description: catalog ID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 获取 catalog 健康状态
      description: 返回指定 catalog 的最近一次健康检查结果（状态 + 时间 + 详情）。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHealthStatusEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/test-connection:
    parameters:
      - name: id
        description: catalog ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 测试 catalog 连接
      description: |
        以当前持久化的 `connector_config` 真实建立一次到数据源的连接，验证连通性。
        与 `health-status`（异步定时检查的最近结果）不同，本端点是**同步实时探测**。
        调用者必须拥有目标 Catalog 的 `modify` 权限。
        HTTP API 类型与创建、配置更新和周期健康检查共用相同连接器测试；HTTP 仅建立 TCP 连接，
        HTTPS 另验证默认信任链与目标主机名并完成 TLS 握手。不发送 HTTP 请求、不登录、不验证凭据或业务 API。
        成功统一返回 `Connection test succeeded.`，表示对应连接器 TestConnection 通过；通用 HTTP 连接器的实际检查范围仍仅为 TCP/TLS，read Resource 业务验证由后续执行能力提供。

        探测结果通过响应体 `success` 字段返回；连不通**不**视为 HTTP 错误：
        - 连通 → 200 `{ success: true, message }`
        - 连不通 → 200 `{ success: false, message }`
        - 非 2xx 仅用于"请求 / 鉴权 / 服务内部"问题，与目标连通性无关。

        失败时 `message` 保留连接器返回的诊断详情（例如主机、端口、用户名、数据库名和驱动错误），
        但会替换连接器声明的密码、token 等敏感配置值，并限制异常超长的远端响应。
      responses:
        "200":
          description: 探测完成（成功或失败均返回，业务结果看 `success` 字段）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  responses:
    BadRequest:
      description: |
        请求参数 / 请求体非法。常见 errcode（命名以合入代码为准）：
        - `VegaBackend.InvalidParameter.RequestBody`：body schema 不合法
        - `VegaBackend.InvalidParameter.ID`：`id` 缺失或格式非法（小写字母/数字/`_`/`-`，首字符须为字母或数字，长度 ≤40）
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: 未授权（OAuth Token 校验失败）
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Conflict:
      description: |
        Catalog 操作冲突。常见情形：
        - 当前依赖状态不允许删除
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotAcceptable:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalServerError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
  schemas:
    CatalogDeletionImpact:
      type: object
      description: |
        Physical Catalog 检查全部级联对象；Logical Catalog 仅检查 Resource 和 Semantic Understanding Task，
        其 Build/Discover Task 与两类 Schedule 影响固定为 0。
      required:
        - catalog_id
        - can_delete
        - blockers
        - resources
        - protected_resources
        - build_tasks
        - catalog_health_check_schedules
        - discover_schedules
        - discover_tasks
        - semantic_understanding_tasks
      properties:
        catalog_id:
          type: string
        can_delete:
          type: boolean
          description: 无受保护资源且三类任务均未正在执行时为 true。
        blockers:
          type: array
          description: 当前阻止真实删除的机器可读原因；可删除时为空数组。
          items:
            type: string
            enum:
              - protected_resources
              - build_tasks_running_or_stopping
              - discover_tasks_running
              - semantic_understanding_tasks_running
        resources:
          type: integer
          description: 将随 Catalog 删除的全部资源数（包含受保护资源）。
        protected_resources:
          type: integer
          description: 不允许随 Catalog 级联删除的 dataset/logical_view 资源数。
        build_tasks:
          $ref: "#/components/schemas/CatalogDeletionTaskImpact"
        catalog_health_check_schedules:
          type: integer
          format: int64
          description: 将随 Catalog 级联删除的健康检查计划数量。
        discover_schedules:
          type: integer
          format: int64
          description: 将随 Catalog 级联删除的发现计划数量。
        discover_tasks:
          $ref: "#/components/schemas/CatalogDeletionTaskImpact"
        semantic_understanding_tasks:
          $ref: "#/components/schemas/CatalogDeletionTaskImpact"
    CatalogDeletionTaskImpact:
      type: object
      required:
        - will_delete
        - blocking
      properties:
        will_delete:
          type: integer
          format: int64
          description: >-
            不区分状态的全部关联任务记录数，包括 pending、终态历史及 blocking 中统计的执行中任务。
            blocking 是其中的子集（will_delete >= blocking），两者不可相加。
            仅真实删除通过阻断检查后才级联删除这些记录；存在阻断时不执行删除。
        blocking:
          type: integer
          format: int64
          description: 当前阻止删除的执行中任务数；Build Task 包含 running/stopping，其他任务包含 running。
    AccountInfo:
      description: 账号信息
      type: object
      properties:
        id:
          type: string
        type:
          description: 账号类型（user / app / anonymous 等）
          type: string
        name:
          description: 账号显示名
          type: string
    Catalog:
      description: Catalog（数据目录）实体
      type: object
      required:
        - id
        - name
        - type
        - category
        - enabled
        - connector_type
      properties:
        id:
          description: catalog ID；小写字母、数字、下划线、连字符，不能以下划线开头，最大长度 40
          type: string
          pattern: "^[a-z0-9][a-z0-9\\-_]{0,39}$"
          maxLength: 40
        name:
          description: catalog 名称，必填，全局唯一，最大长度 255
          type: string
          minLength: 1
          maxLength: 255
        tags:
          description: 标签列表（可选），最多 5 个，每个标签非空且最大长度 40，不能包含特殊字符
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 40
        description:
          description: 描述，最大长度 1000
          type: string
          maxLength: 1000
        type:
          description: catalog 类型
          type: string
          enum:
            - physical
            - logical
        category:
          description: 服务端创建时从连接器填充并持久化的只读类别，如 table、index、api；逻辑 Catalog 为空字符串。创建后不可修改。
          type: string
          maxLength: 32
          readOnly: true
        enabled:
          description: 是否启用
          type: boolean
        built_in:
          description: 是否为内置 Catalog
          type: boolean
        connector_type:
          description: 连接器类型标识（参见 connector-type.yaml）；SQL Server 使用 `sqlserver`，专业版 HTTP API 使用 `http`
          type: string
          examples:
            - sqlserver
        connector_config:
          description: |
            连接器配置（结构由 ConnectorType.field_config 决定）。普通读取不返回敏感字段；
            静态敏感字段定义的读取不受许可证档位限制；连接器未装配、无法取得字段定义时，
            普通和受保护的配置读取均返回不可用错误，不返回未过滤的配置。逻辑 Catalog 无连接配置时可为 null。
          type: [object, "null"]
          additionalProperties: true
        metadata:
          description: 扩展元信息；关系型 Catalog 探查后可包含 schemas 快照
          type: object
          properties:
            schemas:
              description: 探查发现的 schema 名称列表
              type: array
              items:
                type: string
          additionalProperties: true
        health_check_status:
          description: 最近一次健康检查状态
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
            - offline
            - unchecked
        last_check_time:
          description: 最近一次健康检查时间（毫秒时间戳）
          type: integer
          format: int64
        health_check_result:
          description: 最近一次健康检查详情
          type: string
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          type: integer
          format: int64
        updater:
          $ref: "#/components/schemas/AccountInfo"
        update_time:
          type: integer
          format: int64
        operations:
          description: 当前用户对该 catalog 的操作权限集合
          type: array
          items:
            type: string
    HTTPAPIConnectorConfig:
      description: |
        专业版 http 连接器的通用顶层配置由 field_config 声明：base_url、options、variables、sensitive_variables 和可选 login_request。
        timeout_seconds 和 max_response_mib 位于 options；创建和显式配置更新沿用物理连接器测试流程，当前仅探测 TCP/TLS 可达性。
        Token/API Key 等凭据统一放入 variables，并通过 sensitive_variables 声明保护；请求通过 Header/参数模板自行注入，例如 Authorization: Bearer {{ token }}。
        不定义 auth_type 或顶层 token，不自动注入 Bearer Header。login_request 包含 request、response 和 success_rule，Cookie 由后续执行阶段的 HTTP Client/CookieJar 自动管理。
        调用方提交敏感明文，创建或显式更新时拒绝以 enc: 开头的敏感值（忽略大小写）；Crypto 启用时后端加密存储，显式关闭时沿用明文保存。固定字段精确区分大小写，未知配置键（包括大小写变体）忽略，不作为可引用变量；variables 的动态成员名和值保持原样；不提供旧字段兼容或迁移。
      type: object
      additionalProperties: true
      required: [base_url]
      properties:
        base_url:
          type: string
          format: uri
          description: HTTP/HTTPS 服务根地址；不得包含内嵌用户凭据、Query 或 fragment。
        options:
          type: object
          description: HTTP 连接与执行参数；省略时使用默认值，未知选项忽略。不得作为模板变量引用，不包含凭据。
          additionalProperties: true
          properties:
            timeout_seconds:
              type: integer
              minimum: 1
              description: 整次调用预算（秒）；省略时初始默认 30 秒，运行时受平台硬上限约束。
            max_response_mib:
              type: integer
              minimum: 1
              description: 单个解压后响应上限（MiB）；省略时初始默认 10 MiB，运行时受平台硬上限约束。
        variables:
          type: object
          description: 自定义参数及凭据，包含 Token/API Key；模板仅引用此对象的成员，如 {{ token }}。名称须以字母开头，后续只含字母、数字或下划线，不得与当前通用顶层字段或系统/模板保留名冲突。被列入 sensitive_variables 的值必须为字符串。
          additionalProperties: true
          propertyNames:
            allOf:
              - pattern: "^[A-Za-z][A-Za-z0-9_]*$"
              - not:
                  enum: [base_url, options, variables, sensitive_variables, login_request]
        sensitive_variables:
          type: array
          description: |
            variables 中需要保护的直接成员名，省略视为空；如 token/app_secret 需由此声明。成员须存在且为字符串，不接受变量路径。普通读取隐藏对应值，Crypto 只决定新写入是否加密；受保护读取按原值处理明文，并使用同一 AES 密钥解密 ENC:Base64(nonce + 含认证标签的密文)。调用方不预先加密；保存时禁止以 enc: 开头的敏感明文（忽略大小写）。同名顶层字段和 variables 成员均受保护。
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        login_request:
          type: object
          description: 可选登录定义，包含 request、response 和 success_rule；模板仅引用 variables。后续执行阶段在业务请求前登录，Cookie 在本次调用内自动传递；当前只做配置校验。
          additionalProperties: true
    CatalogRequest:
      description: |
        catalog 创建 / 更新请求体。

        - POST：`id` 可省略，由后端生成；若携带且已存在，返回 409 `VegaBackend.Catalog.IdExists`。
        - PUT：`id` 可省略，省略时使用路径参数 `id`；显式提供时必须与路径参数完全一致。格式非法返回 400 `VegaBackend.InvalidParameter.ID`，不一致返回 409 `VegaBackend.Catalog.IDMismatch`。
        - `enabled` 使用 boolean 零值语义：未传按 `false` 处理。PUT 时该值必须与当前 catalog 状态一致；启停切换请使用专用 enable/disable 接口。
      type: object
      required:
        - name
        - enabled
        - connector_type
      properties:
        id:
          description: catalog ID；POST 时可省略由后端生成，PUT 时可省略并使用路径参数，显式提供时必须与路径参数一致；小写字母、数字、下划线、连字符，不能以下划线开头，最大长度 40
          type: string
          pattern: "^[a-z0-9][a-z0-9\\-_]{0,39}$"
          maxLength: 40
        expected_update_time:
          description: 仅 PUT 使用的必填乐观锁版本，取自最近一次查询响应的 `update_time`
          type: integer
          format: int64
          minimum: 1
        name:
          description: catalog 名称，必填，全局唯一，最大长度 255
          type: string
          minLength: 1
          maxLength: 255
        tags:
          description: 标签列表（可选），最多 5 个，每个标签非空且最大长度 40，不能包含特殊字符
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 40
        description:
          description: 描述，最大长度 1000
          type: string
          maxLength: 1000
        enabled:
          description: 是否启用；未传按 false 处理。PUT 不允许切换该字段，启停切换请使用专用 enable/disable 接口。
          type: boolean
        connector_type:
          description: 连接器类型标识；必须是已注册且 enabled 的类型，SQL Server 使用 `sqlserver`，专业版 HTTP API 使用 `http`
          type: string
          examples:
            - sqlserver
        connector_config:
          description: |
            连接器配置；固定字段由 ConnectorType.field_config 定义并精确区分大小写，大小写变体按未知字段忽略；动态变量名及字段值保持原样。敏感值按明文提交，保存时禁止以 enc: 开头（忽略大小写）；后端按平台 Crypto 设置加密存储，原请求不改写。
            PUT 时省略或 null 表示保留已存配置、敏感字段和健康状态，并跳过连接测试；
            显式对象（包括 {}）按完整配置校验和替换，不合并已存字段。
            POST 时物理 Catalog 仍必须提供满足连接器要求的配置。HTTP API 结构见 HTTPAPIConnectorConfig；
            省略配置的 PUT 仍对已存配置做本地校验，但不访问上游。
          type: [object, "null"]
          additionalProperties: true
          examples:
            - host: sqlserver.example.com
              port: 1433
              username: vega_reader
              password: <password>
              database: sales
              schemas: [dbo, reporting]
              options:
                encrypt: true
                trustservercertificate: false
        built_in:
          description: 仅 POST 创建内置 logical Catalog 时可设为 `true`；与非空 `connector_type` 同时提供返回 400。省略时为 `false`，PUT 时忽略。
          type: boolean
    CatalogCreateRequest:
      allOf:
        - $ref: "#/components/schemas/CatalogRequest"
        - type: object
          properties:
            health_check_schedule:
              description: |
                可选的健康检查计划组合创建参数。physical Catalog（包括 HTTP API）缺失或 `null` 时创建
                `mode=inherit` 的计划。提供对象时 `mode` 必填；仅 `mode=enabled` 时 `cron_expr` 必填；
                创建失败时整个 Catalog 创建请求回滚。API Catalog 的检查只执行 TCP/TLS 可达性探测，
                不发送 HTTP 请求、不登录、不验证凭据或业务读取。保存计划本身不立即执行周期任务；
                Catalog 创建及显式连接配置更新仍按正常流程同步执行 TestConnection。
              oneOf:
                - $ref: "catalog-health-check-schedule.yaml#/components/schemas/CatalogHealthCheckScheduleRequest"
                - type: "null"
    CatalogSummary:
      description: |
        Catalog 列表摘要。为避免在列表中返回连接配置与扩展元数据，不包含
        `connector_config`、`metadata`；仅输出从 metadata 提取的 schema 名称列表。
        详情请使用 `GET /catalogs/{id}`。
      type: object
      required:
        - id
        - name
        - type
        - category
        - enabled
        - connector_type
      properties:
        id:
          description: catalog ID
          type: string
        name:
          description: catalog 名称
          type: string
        tags:
          description: 标签列表
          type: array
          items:
            type: string
        description:
          description: 描述
          type: string
        type:
          description: catalog 类型
          type: string
          enum: [physical, logical]
        category:
          description: 服务端创建时从连接器填充并持久化的只读类别，如 table、index、api；逻辑 Catalog 为空字符串。创建后不可修改。
          type: string
          maxLength: 32
          readOnly: true
        enabled:
          description: 是否启用
          type: boolean
        built_in:
          description: 是否为内置 Catalog
          type: boolean
        connector_type:
          description: 连接器类型标识
          type: string
        schemas:
          description: 从 catalog metadata 提取的 schema 名称列表，不包含其他 metadata。
          type: array
          items:
            type: string
        health_check_status:
          description: 最近一次健康检查状态
          type: string
          enum: [healthy, degraded, unhealthy, offline, unchecked]
        last_check_time:
          description: 最近一次健康检查时间（毫秒时间戳）
          type: integer
          format: int64
        health_check_result:
          description: 最近一次健康检查详情
          type: string
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          description: 创建时间，毫秒时间戳
          type: integer
          format: int64
        updater:
          $ref: "#/components/schemas/AccountInfo"
        update_time:
          description: 更新时间，毫秒时间戳
          type: integer
          format: int64
        operations:
          description: 当前用户对该 catalog 的操作权限集合
          type: array
          items:
            type: string
    ListCatalogs:
      description: catalog 列表
      type: object
      required:
        - entries
        - total_count
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSummary"
        total_count:
          type: integer
          format: int64
    CatalogRef:
      description: catalog 引用（创建成功响应）
      type: object
      required:
        - id
      properties:
        id:
          type: string
    CatalogConnectionTestRequest:
      description: 未保存的物理 Catalog 连接测试请求
      type: object
      required:
        - connector_type
        - connector_config
      properties:
        connector_type:
          description: 已注册且 enabled 的连接器类型标识；SQL Server 使用 `sqlserver`
          type: string
          examples:
            - sqlserver
        connector_config:
          description: 用于本次探测的明文连接器配置；字段由 ConnectorType.field_config 决定。本次调用不落库，不对输入执行 Encrypt 或 Decrypt，不改写请求
          type: object
          additionalProperties: true
          examples:
            - host: sqlserver.example.com
              port: 1433
              username: vega_reader
              password: <password>
              database: sales
              schemas: [dbo, reporting]
              options:
                encrypt: true
                trustservercertificate: false
    CatalogHealthStatusEntry:
      description: catalog 健康状态条目
      type: object
      required:
        - id
        - health_check_status
      properties:
        id:
          description: catalog ID
          type: string
        health_check_status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
            - offline
            - unchecked
        last_check_time:
          description: 最近一次检查时间（毫秒时间戳）；通用 HTTP 连接器对应最近一次 TCP/TLS 可达性探测
          type: integer
          format: int64
        health_check_result:
          description: 检查详情；成功统一记录 `Connection test succeeded.`，表示对应连接器 TestConnection 通过，实际检查范围由连接器定义。通用 HTTP 连接器仅检查 TCP/TLS，不验证认证或业务请求。失败时保留经过敏感配置值脱敏和长度限制的连接器错误信息。创建或更新时指定 `allow_unhealthy=true` 而连接失败，仍记录固定文案 `Connection test failed.`。
          type: string
    TestConnectionResult:
      description: 连接测试结果
      type: object
      required:
        - success
      properties:
        success:
          description: 是否连通
          type: boolean
        message:
          description: 详情；失败时为经过敏感配置值脱敏和长度限制的连接器错误信息
          type: string
