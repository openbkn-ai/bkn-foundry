---
openapi: 3.1.1
info:
  title: Catalog
  description: |
    Vega Backend Catalog（数据目录）API。

    Catalog 是一个数据源连接的抽象，对应一个物理数据源（MySQL / SQL Server / OpenSearch / S3 等）
    或逻辑目录（虚拟视图）。资源（`Resource`）按 catalog 归属注册。

    **SQL Server 连接器（`connector_type: sqlserver`）**

    ```json
    {
      "connector_type": "sqlserver",
      "connector_config": {
        "host": "sqlserver.example.com",
        "port": 1433,
        "username": "vega_reader",
        "password": "<encrypted-password>",
        "database": "sales",
        "schemas": ["dbo", "reporting"],
        "options": {
          "encrypt": true,
          "trustservercertificate": false,
          "hostnameincertificate": "sqlserver.example.com",
          "connection timeout": 30,
          "app name": "vega-backend"
        }
      }
    }
    ```

    - `host`、`port`、`username`、`password`、`database` 必填；`schemas` 为空时发现当前账号可见的非系统 schema。
    - `options` 仅允许 `encrypt`、`trustservercertificate`、`hostnameincertificate`、
      `connection timeout` 和 `app name`（名称不区分大小写）；其中前两项必须是 boolean。
    - 推荐使用独立只读账号，并授予目标数据库的连接、元数据查看和查询权限。例如：
      `GRANT CONNECT TO [vega_reader]`、`GRANT VIEW DEFINITION TO [vega_reader]`，以及
      `ALTER ROLE [db_datareader] ADD MEMBER [vega_reader]`；不要授予 `db_datawriter`、`db_ddladmin` 或 `db_owner`。
    - TLS 可通过上述驱动参数启用；`trustservercertificate: true` 会跳过服务端证书校验，只适合受控测试环境。
      未配置 `encrypt` 时使用 go-mssqldb v1.9.2 的 `EncryptionOff` 默认行为，即客户端不主动要求全程加密；
      如需确定启用 TLS，应显式配置 `encrypt: true` 和 `trustservercertificate: false`。
      当前未提供自定义 CA 文件配置，TLS 成功与失败路径尚待真实 SQL Server 环境验收。
    - 一个 Catalog 只连接一个 database，并在其中按 schema 发现对象；不支持跨数据库发现、CDC 和 Windows 集成认证。

    **可检索业务 KV（`extensions`，Issue #382，方案 B）**

    - 与 `tags`（最多 5 个、用于展示的短字符串列表）不同，`extensions` 为 **扁平 string→string**，
      用于 DIP 等域外元数据及 **列表按 key/value 筛选**；持久化见 **`t_entity_extension`**（仅存一套行）。
    - **创建 / 更新**：请求体可选 **`extensions`**。**根对象出现 `extensions` 键**（含 `{}`）
      即对该 catalog 做 KV **整包替换**；**键不出现**则不修改已有 KV。
    - **读取**：详情与列表（`include_extensions=true` 时）返回 **`extensions`**。
    - **列表**：默认不返回各条目的 KV object；`include_extensions=true` 时返回。
      可选 `include_extension_keys` 仅投影部分 key。
    - **列表筛选**：**`extension_key`/`extension_value`**（数组 query，`style=form` + `explode=true`），等长成对 AND。
    - 设计依据：
      [catalog-resource-labels-scheme-b-design.md](../../../design/vega/features/vega-backend/dip-for-extension/catalog-resource-labels-scheme-b-design.md)

    **持久化（与 `migrations/mariadb`、`migrations/dm8` 惯例对齐）**

    - 表名：`t_entity_extension`（**不**改 `t_catalog` / `t_resource` 主表结构）。
    - 列：`f_entity_id` VARCHAR(40) NOT NULL（与 `t_catalog.f_id` **同一取值空间、全局唯一**）、
      `f_key` VARCHAR(128) NOT NULL、`f_value` VARCHAR(512) NOT NULL、
      `f_create_time` / `f_update_time` BIGINT（与现有表时间字段风格一致）。
    - 主键：`PRIMARY KEY (f_entity_id, f_key)`（单值语义；**无** `f_scope` 列，依赖 catalog/resource
      id 全局不冲突之前提，见设计文档）。
    - 索引（MariaDB 示例，DM8 同源语义）：`KEY idx_entity (f_entity_id)`；
      `KEY idx_entity_key_value (f_entity_id, f_key, f_value(191))` 等（前缀长度以方言上限为准）。
    - 删除 catalog 时应用层同事务删除 `t_entity_extension` 中 `f_entity_id` 等于该 catalog `f_id` 的行；
      若级联删除其下 resource，须一并删除对应 resource 的 `f_entity_id` 行。

    本文件仅包含 catalog 自身的 CRUD 与状态相关端点。跨资源的便利端点：
    - `POST /catalogs/{id}/discover`（手动发现一次） → 见 `discover-task.yaml`
    - `GET /catalogs/{ids}/resources`（按 catalog 列资源） → 见 `resource.yaml`
    - `GET /catalogs/{cid}/discover-schedules`（按 catalog 列调度） → 见 `discover-schedule.yaml`

    每个外部接口都有一一对应的内部版本，路径前缀为 `/api/vega-backend/in/v1`，请求体与
    响应结构与外部完全一致；区别仅在于鉴权方式：外部走 OAuth Token 校验，内部从请求头
    （`X-Account-ID` / `X-Account-Type`）解析访问者。

    本文档仅描述外部接口。
  version: 0.2.1
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /catalogs:
    get:
      summary: 获取 catalog 列表
      description: |
        分页获取 catalog；支持按 name、tag、type、connector_type、health_check_status 过滤。

        **KV 筛选**：`extension_key` / `extension_value` 为数组 query。
        序列化形如 `extension_key=a&extension_key=b&extension_value=1&extension_value=2`。参与筛选的一组参数 **必须等长**，
        按下标配对为 AND 等值条件；长度不一致或未成对 → 400。
      parameters:
        - name: name
          description: 按名称模糊过滤，匹配名称中包含该值的 catalog
          in: query
          schema:
            type: string
        - name: tag
          description: 按标签精确过滤
          in: query
          schema:
            type: string
        - name: type
          description: 按 catalog 类型过滤
          in: query
          schema:
            type: string
            enum:
              - physical
              - logical
        - name: connector_type
          description: 按连接器类型过滤
          in: query
          schema:
            type: string
        - name: health_check_status
          description: 按健康检查状态过滤
          in: query
          schema:
            type: string
            enum:
              - healthy
              - degraded
              - unhealthy
              - offline
              - unchecked
        - name: enabled
          description: 按 catalog 启用状态过滤
          in: query
          schema:
            type: boolean
        - name: offset
          description: 分页偏移量，>=0，默认 0
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          description: 每页数量，1-1000，-1 表示不分页，默认 20
          in: query
          schema:
            type: integer
            format: int64
            default: 20
        - name: sort
          description: 排序字段
          in: query
          schema:
            type: string
            enum:
              - name
              - create_time
              - update_time
            default: update_time
        - name: direction
          description: 排序方向
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: extension_key
          description: 与 `extension_value` 成对；多条件 AND。等长数组，按下标配对；等值匹配 `t_entity_extension.f_key`。
          in: query
          schema:
            type: array
            maxItems: 5
            items:
              type: string
              maxLength: 128
          style: form
          explode: true
        - name: extension_value
          description: 与 `extension_key` 成对；语义见 `extension_key`。
          in: query
          schema:
            type: array
            maxItems: 5
            items:
              type: string
              maxLength: 512
          style: form
          explode: true
        - name: include_extensions
          description: |
            为 true 时列表 `entries` 中每条 Catalog 带 `extensions`；默认 false。
          in: query
          schema:
            type: boolean
            default: false
        - name: include_extension_keys
          description: |
            逗号分隔的 key 列表；在 `include_extensions` 为 true 时仅返回列出的 key（仍一次加载后过滤）。
            未携带或为空表示返回全部 key。
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCatalogs"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: 创建 catalog
      description: |
        创建一个新的 catalog。`name` 全局唯一，已存在时返回 409。
        `connector_type` 必须是已注册且 enabled 的连接器类型。

        物理 Catalog 会在持久化前执行一次连接测试。默认连接失败返回 400，且不会创建 Catalog；
        可传 `allow_unhealthy=true` 保存该 Catalog，并将其健康状态记为 `unhealthy`。

        可选 **`extensions`**：与 `t_catalog` 插入 **同一事务**内写入 `t_entity_extension`。
        响应体 `CatalogRef` 返回 `extensions`，与持久化一致。
      parameters:
        - name: allow_unhealthy
          in: query
          description: |
            是否在物理 Catalog 的连接测试失败时仍继续创建。默认 `false`；为 `true` 时创建成功，
            但初始健康状态为 `unhealthy`。配置校验、敏感字段解密或连接器创建失败仍返回 400。
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          description: 同名 catalog 已存在 / connector_type 未启用
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}:
    parameters:
      - name: id
        description: catalog ID，多个用英文逗号分隔（如 `id1,id2,id3`）
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 获取 catalog 详情
      description: |
        路径参数支持单条或批量（逗号分隔）；批量时不存在的 ID 不会报错，结果中按存在的返回。
        每条 `Catalog` 含 **`extensions`**（无副表行时为 `{}`）。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Catalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: 删除 catalog
      description: |
        一次只允许删除一个 catalog；路径参数包含逗号时返回 400。删除会同步移除该 catalog 下的资源、
        构建索引、探查计划与健康检查计划，并删除 `t_entity_extension` 中 `f_entity_id` 等于被删
        catalog / resource `f_id` 的行。三类任务记录均保留：尚未开始的构建、探查和语义理解任务
        标记为 `cancelled`；已有终态任务保持原状态。存在 `running` 任务时拒绝删除，
        构建任务处于 `stopping` 时也会拒绝删除。

        传入 `dry_run=true` 时仅执行权限、存在性和影响分析，不写入任何数据；返回该 catalog
        的资源、构建任务、探查计划、健康检查计划、探查任务和语义理解任务计数；
        `protected_resources` 返回不能随 Catalog 级联删除的 dataset/logicview 数量，`blockers`
        返回稳定的机器可读阻断原因。`can_delete` 严格反映当前 DELETE 的阻断规则，调用方仍须
        以不带 `dry_run` 的请求结果为准，因为预检与实际删除之间可能有并发变更。
      parameters:
        - name: dry_run
          in: query
          required: false
          description: 为 true 时模拟删除并返回影响报告；默认 false，执行真实删除。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: dry_run 影响报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDeletionImpact"
        "204":
          description: 删除成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: 修改 catalog
      description: |
        全量更新指定 catalog。catalog 由路径参数 `id` 唯一确定（主键不可改）。

        请求体的 `id` 字段**必填**，且必须与路径参数完全一致：
        - 缺失 / 格式非法 → 400 `VegaBackend.InvalidParameter.ID`。
        - 不一致 → 409 `VegaBackend.Catalog.IDMismatch`。

        `name` 改动后若新名称已被其它 catalog 占用，返回 409 `VegaBackend.Catalog.NameExists`。

        `enabled` 不能通过 PUT 切换；请求体中的 `enabled` 必须与当前 catalog 状态一致。
        如需启用/禁用，使用 `POST /catalogs/{id}/enable` 或 `POST /catalogs/{id}/disable`。

        `connector_config` 可修改；修改影响发现范围的字段后，旧 Resource 会在下一次
        discover 对齐时标记为 `stale`。

        修改物理 Catalog 配置时会先执行连接测试。默认连接失败返回 400，且不会持久化更新；
        可传 `allow_unhealthy=true` 保存更新，并将健康状态记为 `unhealthy`。

        **extensions**：请求体若包含 **`extensions` 键**（含空对象 `{}`），则对该 catalog **整包替换**
        `t_entity_extension` 中 `f_entity_id = id` 的全部行；**键未出现**则不修改副表。
      parameters:
        - name: allow_unhealthy
          in: query
          description: |
            是否在物理 Catalog 的连接测试失败时仍继续更新。默认 `false`；为 `true` 时更新成功，
            但健康状态为 `unhealthy`。配置校验、敏感字段解密或连接器创建失败仍返回 400。
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogRequest"
      responses:
        "204":
          description: 更新成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          description: |
            主键 / 名称冲突。可能的错误码：
            - `VegaBackend.Catalog.IDMismatch`
            - `VegaBackend.Catalog.NameExists`
            - `VegaBackend.Catalog.InvalidParameter`（尝试通过 PUT 切换 enabled）
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/enable:
    parameters:
      - name: id
        description: catalog ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 启用 catalog
      description: |
        启用 catalog。接口幂等：已启用的 catalog 再次启用返回 204。
        从禁用切换为启用时，`health_check_status` 重置为 `unchecked`。
      responses:
        "204":
          description: 启用成功或已启用
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/disable:
    parameters:
      - name: id
        description: catalog ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 禁用 catalog
      description: |
        禁用 catalog。接口幂等：已禁用的 catalog 再次禁用返回 204。
        禁用不会覆盖 `health_check_status`，健康状态保留最近一次检查结果。
      responses:
        "204":
          description: 禁用成功或已禁用
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/test-connection:
    post:
      summary: 预检未保存的 Catalog 连接配置
      description: |
        使用请求中的 `connector_type` 与 `connector_config` 执行一次同步连接测试。
        本接口不创建或更新 Catalog，也不持久化健康状态；适用于创建或编辑表单保存前的“测试连接”。

        探测结果通过响应体 `success` 字段返回；目标不可达不视为 HTTP 错误：
        - 连通 → 200 `{ success: true, message }`
        - 连不通 → 200 `{ success: false, message }`
        - 非 2xx 仅用于请求、鉴权、参数校验或服务内部错误。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogConnectionTestRequest"
      responses:
        "200":
          description: 探测完成（成功或失败均返回，业务结果看 `success` 字段）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/health-status:
    parameters:
      - name: id
        description: catalog ID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 获取 catalog 健康状态
      description: 返回指定 catalog 的最近一次健康检查结果（状态 + 时间 + 详情）。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHealthStatusEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/test-connection:
    parameters:
      - name: id
        description: catalog ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 测试 catalog 连接
      description: |
        以当前持久化的 `connector_config` 真实建立一次到数据源的连接，验证连通性。
        与 `health-status`（异步定时检查的最近结果）不同，本端点是**同步实时探测**。
        调用者必须拥有目标 Catalog 的 `modify` 权限。

        探测结果通过响应体 `success` 字段返回；连不通**不**视为 HTTP 错误：
        - 连通 → 200 `{ success: true, message }`
        - 连不通 → 200 `{ success: false, message }`
        - 非 2xx 仅用于"请求 / 鉴权 / 服务内部"问题，与目标连通性无关。
      responses:
        "200":
          description: 探测完成（成功或失败均返回，业务结果看 `success` 字段）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/health-check-schedule:
    parameters:
      - name: id
        description: physical Catalog ID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 获取 Catalog 健康检查计划
      description: |
        仅 physical Catalog 支持；需要该 Catalog 的 `view_detail` 权限。Catalog 的详情与列表响应不会内嵌该对象。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHealthCheckSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: 修改 Catalog 健康检查计划
      description: |
        仅 physical Catalog 支持，需要该 Catalog 的 `modify` 权限。不支持 DELETE 或单独的启停接口：
        使用 `mode=inherit`、`enabled`、`disabled` 完成全量状态切换。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogHealthCheckScheduleRequest"
      responses:
        "200":
          description: 更新后的计划
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHealthCheckSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  responses:
    BadRequest:
      description: |
        请求参数 / 请求体非法。常见 errcode（命名以合入代码为准）：
        - `VegaBackend.InvalidParameter.RequestBody`：body schema 不合法
        - `VegaBackend.InvalidParameter.ID`：`id` 缺失或格式非法（小写字母/数字/`_`/`-`，首字符须为字母或数字，长度 ≤40）
        - `VegaBackend.Extensions.InvalidFormat`：`extensions` 非 object 或 key/value 非 string
        - `VegaBackend.Extensions.QuotaExceeded`：条数或长度超限
        - `VegaBackend.Extensions.ReservedKey`：key 以 `vega_` 开头
        - `VegaBackend.Extensions.MismatchedQueryPairs`：`extension_key` / `extension_value` 数组长度不一致或未成对
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: 未授权（OAuth Token 校验失败）
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Conflict:
      description: 当前依赖状态不允许删除
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotAcceptable:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalServerError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
  schemas:
    CatalogDeletionImpact:
      type: object
      description: |
        Physical Catalog 检查全部级联对象；Logical Catalog 仅检查 Resource 和 Semantic Understanding Task，
        其 Build/Discover Task 与两类 Schedule 影响固定为 0。
      required:
        - catalog_id
        - can_delete
        - blockers
        - resources
        - protected_resources
        - build_tasks
        - catalog_health_check_schedules
        - discover_schedules
        - discover_tasks
        - semantic_understanding_tasks
      properties:
        catalog_id:
          type: string
        can_delete:
          type: boolean
          description: 无受保护资源且三类任务均未正在执行时为 true。
        blockers:
          type: array
          description: 当前阻止真实删除的机器可读原因；可删除时为空数组。
          items:
            type: string
            enum:
              - protected_resources
              - build_tasks_running_or_stopping
              - discover_tasks_running
              - semantic_understanding_tasks_running
        resources:
          type: integer
          description: 将随 Catalog 删除的全部资源数（包含受保护资源）。
        protected_resources:
          type: integer
          description: 不允许随 Catalog 级联删除的 dataset/logicview 资源数。
        build_tasks:
          $ref: "#/components/schemas/CatalogDeletionTaskImpact"
        catalog_health_check_schedules:
          type: integer
          format: int64
          description: 将随 Catalog 级联删除的健康检查计划数量。
        discover_schedules:
          type: integer
          format: int64
          description: 将随 Catalog 级联删除的发现计划数量。
        discover_tasks:
          $ref: "#/components/schemas/CatalogDeletionTaskImpact"
        semantic_understanding_tasks:
          $ref: "#/components/schemas/CatalogDeletionTaskImpact"
    CatalogDeletionTaskImpact:
      type: object
      required:
        - will_cancel
        - blocking
      properties:
        will_cancel:
          type: integer
          format: int64
          description: 当前为 pending、真实删除时将被标记为 cancelled 的任务数。
        blocking:
          type: integer
          format: int64
          description: 当前阻止删除的执行中任务数；Build Task 包含 running/stopping，其他任务包含 running。
    EntityExtensions:
      description: |
        扁平 KV 的 JSON object 形态（`string`→`string`）。用于 **`Catalog` / `CatalogRequest` / `CatalogRef`**
        上的 **`extensions`** 属性。

        存于 `t_entity_extension`；与 `tags` 语义独立。无数据时 JSON 为 `{}`。单实体条数、键值长度以服务端配置为准
        （建议 ≤64 条；key ≤128；value ≤512 UTF-8）；禁止 key 以 `vega_` 开头（平台保留）。

        **列表**：`include_extensions` 为 true 时，条目返回 `extensions`；默认 false 时可省略以减小负载。
        `include_extension_keys` 非空时仅投影所列 key。

        **请求体（POST/PUT）**：根对象出现 **`extensions` 键**（含 `{}`）即触发该实体 KV **整包替换**；
        **键未出现**则不修改副表（与 `info.description` 一致）。
      type: object
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 512
      propertyNames:
        maxLength: 128
    AccountInfo:
      description: 账号信息
      type: object
      properties:
        id:
          type: string
        type:
          description: 账号类型（user / app / anonymous 等）
          type: string
        name:
          description: 账号显示名
          type: string
    Catalog:
      description: Catalog（数据目录）实体
      type: object
      required:
        - id
        - name
        - type
        - enabled
        - connector_type
      properties:
        id:
          description: catalog ID；小写字母、数字、下划线、连字符，不能以下划线开头，最大长度 40
          type: string
          pattern: "^[a-z0-9][a-z0-9\\-_]{0,39}$"
          maxLength: 40
        name:
          description: catalog 名称，必填，全局唯一，最大长度 255
          type: string
          minLength: 1
          maxLength: 255
        tags:
          description: 标签列表（可选），最多 5 个，每个标签非空且最大长度 40，不能包含特殊字符
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 40
        description:
          description: 描述，最大长度 1000
          type: string
          maxLength: 1000
        type:
          description: catalog 类型
          type: string
          enum:
            - physical
            - logical
        enabled:
          description: 是否启用
          type: boolean
        internal:
          description: 是否为内部 Catalog
          type: boolean
        connector_type:
          description: 连接器类型标识（参见 connector-type.yaml）；SQL Server 使用 `sqlserver`
          type: string
          examples:
            - sqlserver
        connector_config:
          description: 连接器配置（结构由 ConnectorType.field_config 决定）
          type: object
          additionalProperties: true
        metadata:
          description: 扩展元信息；关系型 Catalog 探查后可包含 schemas 快照
          type: object
          properties:
            schemas:
              description: 探查发现的 schema 名称列表
              type: array
              items:
                type: string
          additionalProperties: true
        extensions:
          $ref: "#/components/schemas/EntityExtensions"
        health_check_status:
          description: 最近一次健康检查状态
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
            - offline
            - unchecked
        last_check_time:
          description: 最近一次健康检查时间（毫秒时间戳）
          type: integer
          format: int64
        health_check_result:
          description: 最近一次健康检查详情
          type: string
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          type: integer
          format: int64
        updater:
          $ref: "#/components/schemas/AccountInfo"
        update_time:
          type: integer
          format: int64
        operations:
          description: 当前用户对该 catalog 的操作权限集合
          type: array
          items:
            type: string
    CatalogRequest:
      description: |
        catalog 创建 / 更新请求体。

        - POST：`id` 可省略，由后端生成；若携带且已存在，返回 409 `VegaBackend.Catalog.IdExists`。
        - PUT：`id` **必填**，且必须与路径参数 `id` 完全一致。缺失或格式非法返回 400 `VegaBackend.InvalidParameter.ID`，不一致返回 409 `VegaBackend.Catalog.IDMismatch`。
        - `enabled` 使用 boolean 零值语义：未传按 `false` 处理。PUT 时该值必须与当前 catalog 状态一致；启停切换请使用专用 enable/disable 接口。

        可选 **`extensions`**（见 `EntityExtensions`）：写入规则见 `info.description`。
      type: object
      required:
        - name
        - enabled
        - connector_type
      properties:
        id:
          description: catalog ID；POST 时可省略由后端生成，PUT 时必填且必须与路径参数一致；小写字母、数字、下划线、连字符，不能以下划线开头，最大长度 40
          type: string
          pattern: "^[a-z0-9][a-z0-9\\-_]{0,39}$"
          maxLength: 40
        name:
          description: catalog 名称，必填，全局唯一，最大长度 255
          type: string
          minLength: 1
          maxLength: 255
        tags:
          description: 标签列表（可选），最多 5 个，每个标签非空且最大长度 40，不能包含特殊字符
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 40
        description:
          description: 描述，最大长度 1000
          type: string
          maxLength: 1000
        enabled:
          description: 是否启用；未传按 false 处理。PUT 不允许切换该字段，启停切换请使用专用 enable/disable 接口。
          type: boolean
        connector_type:
          description: 连接器类型标识；必须是已注册且 enabled 的类型，SQL Server 使用 `sqlserver`
          type: string
          examples:
            - sqlserver
        connector_config:
          description: 连接器配置；字段由 ConnectorType.field_config 决定
          type: object
          additionalProperties: true
          examples:
            - host: sqlserver.example.com
              port: 1433
              username: vega_reader
              password: <encrypted-password>
              database: sales
              schemas: [dbo, reporting]
              options:
                encrypt: true
                trustservercertificate: false
        internal:
          description: 仅 POST 创建 logical Catalog 时可设为 `true`；与非空 `connector_type` 同时提供返回 400。省略时为 `false`，PUT 时忽略。
          type: boolean
        extensions:
          $ref: "#/components/schemas/EntityExtensions"
    CatalogCreateRequest:
      allOf:
        - $ref: "#/components/schemas/CatalogRequest"
        - type: object
          properties:
            health_check_schedule:
              description: |
                可选的健康检查计划组合创建参数。仅 physical Catalog 支持；缺失或 `null` 时创建
                `mode=inherit` 的计划。提供对象时 `mode` 必填；仅 `mode=enabled` 时 `cron_expr` 必填；
                创建失败时整个 Catalog 创建请求回滚。
              oneOf:
                - $ref: "#/components/schemas/CatalogHealthCheckScheduleRequest"
                - type: "null"
    CatalogHealthCheckScheduleRequest:
      description: Catalog 健康检查计划配置；可在创建 physical Catalog 时组合提交，或通过 PUT 独立修改
      type: object
      required:
        - mode
      properties:
        mode:
          description: "`inherit` 使用 ConfigMap 的平台默认 Cron 并清空自定义 Cron，`enabled` 使用本请求的 Cron，`disabled` 停用。PUT 设置为 `disabled` 时保留已有自定义 Cron。"
          type: string
          enum: [inherit, enabled, disabled]
        cron_expr:
          description: 仅当 `mode=enabled` 时必填的健康检查 Cron 表达式；相邻两次执行的间隔不得短于 1 小时。PUT 的 `mode=disabled` 忽略该字段并保留已有自定义 Cron
          type: string
          minLength: 1
    CatalogHealthCheckSchedule:
      description: physical Catalog 的独立健康检查计划及最近调度元数据
      type: object
      required:
        - catalog_id
        - mode
        - last_run
        - next_run
      properties:
        catalog_id:
          type: string
        mode:
          type: string
          enum: [inherit, enabled, disabled]
        cron_expr:
          type: string
        last_run:
          description: 最近一次计划执行时间，Unix 毫秒时间戳；健康检查结果存放于 Catalog，而非本对象
          type: integer
          format: int64
        next_run:
          description: 下次计划执行时间，Unix 毫秒时间戳；`disabled` 时为 0，创建或切换为 `inherit` 时按平台全局 Cron 计算为未来时间
          type: integer
          format: int64
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          type: integer
          format: int64
        updater:
          $ref: "#/components/schemas/AccountInfo"
        update_time:
          type: integer
          format: int64
    ListCatalogs:
      description: catalog 列表
      type: object
      required:
        - entries
        - total_count
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Catalog"
        total_count:
          type: integer
          format: int64
    CatalogRef:
      description: catalog 引用（创建成功响应）；含 `extensions`
      type: object
      required:
        - id
      properties:
        id:
          type: string
        extensions:
          $ref: "#/components/schemas/EntityExtensions"
    CatalogConnectionTestRequest:
      description: 未保存的物理 Catalog 连接测试请求
      type: object
      required:
        - connector_type
        - connector_config
      properties:
        connector_type:
          description: 已注册且 enabled 的连接器类型标识；SQL Server 使用 `sqlserver`
          type: string
          examples:
            - sqlserver
        connector_config:
          description: 用于本次探测的连接器配置；字段由 ConnectorType.field_config 决定
          type: object
          additionalProperties: true
          examples:
            - host: sqlserver.example.com
              port: 1433
              username: vega_reader
              password: <encrypted-password>
              database: sales
              schemas: [dbo, reporting]
              options:
                encrypt: true
                trustservercertificate: false
    CatalogHealthStatusEntry:
      description: catalog 健康状态条目
      type: object
      required:
        - id
        - health_check_status
      properties:
        id:
          description: catalog ID
          type: string
        health_check_status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
            - offline
            - unchecked
        last_check_time:
          description: 最近一次检查时间（毫秒时间戳）
          type: integer
          format: int64
        health_check_result:
          description: 检查详情 / 错误信息
          type: string
    TestConnectionResult:
      description: 连接测试结果
      type: object
      required:
        - success
      properties:
        success:
          description: 是否连通
          type: boolean
        message:
          description: 详情（失败时为错误信息）
          type: string
