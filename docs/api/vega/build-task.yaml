---
openapi: 3.1.1
info:
  title: BuildTask
  description: |
    Vega Backend 构建任务（BuildTask）相关 API。

    BuildTask 是顶级独立资源，每条 task 关联 1 个 Resource，对其执行 streaming /
    batch 两种模式之一的构建。状态机：

      pending → running → stopping → stopped
                    ↘ completed
                    ↘ failed
                    ↘ cancelled

    外部仅可触发 `start` / `stop` 两个动作；其它状态由 worker 内部转移，外部只读。
    `start` / `stop` 返回 HTTP 202 且 body 为空，仅表示"指令被接受"，**不**表示
    status 已切换；持久化 status 由 worker 实际执行时写入，客户端如需感知应轮询 GET。

    端点设计遵循 [vega-backend/CLAUDE.md] 的"端点设计规则"：批量删除走 path
    （`DELETE /build-tasks/{ids}`，逗号分隔），不提供 `/resources/{id}/build-tasks`
    嵌套列表视图——按父资源过滤一律走 `GET /build-tasks?resource_id={id}`。
  version: 0.1.0
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /build-tasks:
    get:
      summary: 获取构建任务列表
      description: 分页获取构建任务；支持按 resource_id / catalog_id / status / mode / execute_type 过滤。
      parameters:
        - name: resource_id
          description: 按归属 resource 过滤
          in: query
          schema:
            type: string
        - name: catalog_id
          description: 按归属 catalog 过滤
          in: query
          schema:
            type: string
        - name: status
          description: 按状态过滤；多个状态重复传递该参数，状态之间为 OR 关系。
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - pending
                - running
                - stopping
                - stopped
                - completed
                - failed
                - cancelled
        - name: mode
          description: 按任务模式过滤
          in: query
          schema:
            type: string
            enum:
              - streaming
              - batch
        - name: execute_type
          description: 按批处理执行方式过滤；流式任务不匹配该筛选条件
          in: query
          schema:
            type: string
            enum:
              - full
              - incremental
        - name: offset
          description: 分页偏移量，>=0，默认 0
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          description: 每页数量，默认 20
          in: query
          schema:
            type: integer
            format: int64
            default: 20
        - name: sort
          description: 排序字段，默认按创建时间排序
          in: query
          schema:
            type: string
            enum:
              - create_time
              - start_time
              - finish_time
              - last_progress_time
            default: create_time
        - name: direction
          description: 排序方向，默认 desc
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBuildTasks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: 创建构建任务
      description: |
        为指定 Resource 创建构建任务。同一 Resource 同时只能有一个 active BuildTask
        （`pending` / `running` / `stopping`）；已存在 active Task 时返回 400
        `VegaBackend.BuildTask.Exist`。终态 Task 不阻止创建新任务。

        - `streaming` 模式要求 Resource 在 `source_metadata.primary_keys` 中声明主键。
        - `batch` 模式要求 `build_key_fields` 非空。
        - 所有字段都需要在 Resource 的 schema 中存在；否则 400。
        - 创建后 status = `pending`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBuildTaskRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    description: 新建 BuildTask ID
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /build-tasks/{id}:
    parameters:
      - name: id
        description: BuildTask ID；DELETE 时可传逗号分隔的 ID 列表
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 获取构建任务详情
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: 删除构建任务（整体事务）
      description: |
        整体事务语义：所有 id 通过预校验后才进入删除阶段，任一预校验失败整批不删。

        预校验顺序：

        1. 任一 id 处于 `pending` / `running` / `stopping` → 409 `VegaBackend.BuildTask.HasRunningExecution`，
           `error_details` 携带 `{ active_ids: [...] }`。状态拦截**不可绕过**；pending/running
           必须先 stop，stopping 必须等待停止完成后再删。
        2. 任一 id 不存在（且未启用 `ignore_missing`）→ 404 `VegaBackend.BuildTask.NotFound`，
           `error_details` 携带 `{ missing_ids: [...] }`。
        3. 全部通过 → 只删除结束态 Task 数据库记录，返回 204。删除 Task 不修改 Resource
           本地索引状态，也不删除 OpenSearch 索引。
      parameters:
        - name: ignore_missing
          description: |
            放宽不存在性检查：缺失 id 视为已删除（静默跳过），其它 id 正常删。
            **不影响** pending/running/stopping 拦截。
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: 删除成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /build-tasks/{id}/start:
    parameters:
      - name: id
        description: BuildTask ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 启动构建任务
      description: |
        合法状态转移：`status ∈ {stopped, failed}` → `pending` → `running`。
        `failed` 允许重试；`pending` 已在队列中、`completed` 已结束，二者均不允许 start。
        batch 任务默认按 `synced_mark` 续跑；incremental 任务不支持 `reset=true`，传入时返回
        409 `VegaBackend.BuildTask.IncrementalResetUnsupported`。full 任务仅在 `reset=true` 时清除进度并从头重建，
        不修改原始 `execute_type`；
        worker 实际开始执行时会清空 `error_msg`。

        **响应 status 滞后**：HTTP 202 表示"启动指令已被接受并入队"，**不**表示
        status 已切换为 `running`。worker 实际执行时才会写为 `running`，
        客户端如需确认应轮询 GET。响应 body 为空。

        **非幂等**：对非 stopped / failed 状态的 task 调用 start 返回 409
        `VegaBackend.BuildTask.InvalidStateTransition`。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBuildTaskRequest"
      responses:
        "202":
          description: 启动指令已接受（body 为空）
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /build-tasks/{id}/stop:
    parameters:
      - name: id
        description: BuildTask ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: 停止构建任务
      description: |
        合法状态转移：
        - `pending` → `stopped`：任务尚在队列中，直接标记停止，worker 出队后会跳过。
        - `running` → `stopping`：正常停止，worker 在批间检查点退出后写 `stopped`。

        **响应 status 滞后**：HTTP 202 表示"停止指令已被记录"。running 任务的
        `stopping → stopped` 由 worker 异步推进，客户端可轮询 GET 拿最新 status。响应 body 为空。

        **非幂等**：对非 pending / running 状态的 task 调 stop 返回 409；
        `stopping` 中再次 stop 也返回 409
        `VegaBackend.BuildTask.InvalidStateTransition`。
      responses:
        "202":
          description: 停止指令已接受（body 为空）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  responses:
    BadRequest:
      description: 请求参数 / 请求体非法
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: 未授权（OAuth Token 校验失败）
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotAcceptable:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Conflict:
      description: |
        状态冲突：状态机不允许该转移，或 task 处于 running/stopping 无法删除
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalServerError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
  schemas:
    AccountInfo:
      description: 操作者信息
      type: object
      required:
        - id
        - type
      properties:
        id:
          description: 账户 ID
          type: string
        type:
          description: 账户类型
          type: string
        name:
          description: 显示名
          type: string
    BuildTask:
      description: 构建任务实体
      type: object
      required:
        - id
        - resource_id
        - catalog_id
        - status
        - mode
        - total_count
        - synced_count
        - creator
        - create_time
      properties:
        id:
          description: 全局唯一 ID
          type: string
        resource_id:
          description: 关联 Resource ID
          type: string
        catalog_id:
          description: 关联 Catalog ID（冗余存储以加速过滤）
          type: string
        resource_name:
          description: 关联 Resource 的当前名称；响应时按当前任务集合批量补齐，不落库
          type: string
        catalog_name:
          description: 关联 Catalog 的当前名称；响应时按当前任务集合批量补齐，不落库
          type: string
        status:
          description: 状态
          type: string
          enum:
            - pending
            - running
            - stopping
            - stopped
            - completed
            - failed
            - cancelled
        mode:
          description: 任务模式
          type: string
          enum:
            - streaming
            - batch
        execute_type:
          description: batch 任务创建时选择的执行类型。历史 batch 任务缺失该值时按 `full` 返回；streaming 任务不适用且不返回。
          type: string
          enum:
            - incremental
            - full
        total_count:
          description: 总数
          type: integer
          format: int64
        synced_count:
          description: 已同步数
          type: integer
          format: int64
        synced_mark:
          description: 不透明的执行 checkpoint 字符串，仅用于展示和透传；调用方不得解析其内部结构
          type: string
        error_msg:
          description: 错误或取消原因（仅在 failed/cancelled 状态下有意义）
          type: string
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          description: 创建时间，毫秒级时间戳
          type: integer
          format: int64
        start_time:
          description: 开始执行时间，毫秒级时间戳；未开始时为 0
          type: integer
          format: int64
        finish_time:
          description: 完成时间，毫秒级时间戳；未完成时为 0
          type: integer
          format: int64
        last_progress_time:
          description: 最近一次对外可观测进度更新时间，毫秒级时间戳；无进度更新时为 0
          type: integer
          format: int64
        failure_detail:
          description: 任务完成但存在部分向量化失败时的明细
          type: string
        index_config:
          $ref: "#/components/schemas/BuildTaskIndexConfig"
    BuildTaskSummary:
      description: 构建任务列表摘要；索引配置快照和 failure_detail 请调用单条详情接口获取。
      type: object
      required: [id, resource_id, catalog_id, status, mode, total_count, synced_count, synced_mark, creator, create_time]
      properties:
        id: { type: string }
        resource_id: { type: string }
        resource_name: { type: string }
        catalog_id: { type: string }
        catalog_name: { type: string }
        status: { type: string }
        mode: { type: string }
        execute_type: { type: string }
        total_count: { type: integer, format: int64 }
        synced_count: { type: integer, format: int64 }
        synced_mark:
          description: 不透明的执行 checkpoint 字符串，仅用于展示和透传
          type: string
        error_msg: { type: string }
        creator: { $ref: "#/components/schemas/AccountInfo" }
        create_time: { type: integer, format: int64 }
        start_time: { type: integer, format: int64 }
        finish_time: { type: integer, format: int64 }
        last_progress_time: { type: integer, format: int64 }
    BuildTaskIndexConfig:
      description: 创建任务时从 Resource 派生的索引配置快照
      type: object
      properties:
        build_key_fields:
          type: array
          items:
            type: string
        fields:
          type: array
          description: 创建任务时固化的本地索引配置契约字段
          items:
            $ref: "#/components/schemas/BuildTaskIndexConfigField"
        features:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BuildTaskFieldIndexFeature"
    BuildTaskIndexConfigField:
      type: object
      required: [name, original_name, original_type, type, features]
      properties:
        name: { type: string }
        original_name: { type: string }
        original_type: { type: string }
        type: { type: string }
        features:
          type: array
          items:
            $ref: "#/components/schemas/BuildTaskIndexConfigFieldFeature"
    BuildTaskIndexConfigFieldFeature:
      type: object
      required: [name, feature_type, ref_property]
      properties:
        name: { type: string }
        feature_type: { type: string }
        ref_property: { type: string }
        config:
          type: object
          additionalProperties: true
    BuildTaskFieldIndexFeature:
      type: object
      properties:
        vector:
          type: object
          description: 创建构建任务时解析并固化的嵌入模型快照
          required:
            - model_id
            - embedding_dim
          properties:
            model_id:
              type: string
            model_name:
              type: string
            model_type:
              type: string
            embedding_dim:
              type: integer
            batch_size:
              type: integer
            max_tokens:
              type: integer
        fulltext:
          type: object
          properties:
            analyzer:
              type: string
    CreateBuildTaskRequest:
      description: 创建构建任务请求体
      type: object
      required:
        - resource_id
        - mode
      properties:
        resource_id:
          description: 关联 Resource ID（必填）
          type: string
        mode:
          description: 任务模式
          type: string
          enum:
            - streaming
            - batch
        execute_type:
          description: batch 执行类型；省略时服务端默认 `full`
          type: string
          enum:
            - incremental
            - full
    StartBuildTaskRequest:
      description: 启动构建任务请求体（可选）
      type: object
      properties:
        reset:
          description: 仅对原始 `execute_type=full` 的任务有效；为 true 时清空进度并从头执行。incremental 任务传 true 返回 409 冲突
          type: boolean
          default: false
    ListBuildTasks:
      description: 构建任务列表
      type: object
      required:
        - entries
        - total_count
      properties:
        entries:
          description: 条目列表
          type: array
          items:
            $ref: "#/components/schemas/BuildTaskSummary"
        total_count:
          description: 总条数
          type: integer
          format: int64
