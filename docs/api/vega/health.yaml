openapi: 3.1.1
info:
  title: Vega Backend Health API
  description: Vega Backend health and platform-version APIs.
  version: 0.1.0
servers:
  - url: /api/vega-backend/v1
paths:
  /health:
    get:
      summary: Get Vega Backend health and platform version
      description: Returns Vega Backend runtime information. ServerVersion is the platform version when all services share one release version.
      operationId: getVegaBackendHealth
      security: []
      responses:
        '200':
          description: Health and version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  ServerName:
                    type: string
                  ServerVersion:
                    type: string
                    description: Platform version.
                  Language:
                    type: string
                  GoVersion:
                    type: string
                  GoArch:
                    type: string
                required:
                  - ServerVersion
  /readyz:
    get:
      summary: Get Vega Backend readiness
      description: Returns 200 when the service can receive traffic and 503 while it is draining during shutdown.
      operationId: getVegaBackendReadiness
      security: []
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is draining or not ready
