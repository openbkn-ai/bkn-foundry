---
openapi: 3.1.1
info:
  title: Auth Resource
  description: |
    Vega Backend authorization resource-list API.

    Queries a compact list of resources available for authorization by
    `resource_type`, for use in permission configuration.

    Supported `resource_type` values:

    - `catalog`: Catalog authorization resources.
    - `resource`: Resource authorization resources.
    - `connector-type`: ConnectorType authorization resources.
  version: 0.1.0
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /auth-resources:
    get:
      operationId: listAuthResources
      summary: List authorization resources
      parameters:
        - name: resource_type
          description: Authorization resource type
          in: query
          required: true
          schema:
            type: string
            enum:
              - catalog
              - resource
              - connector-type
        - name: id
          description: Exact resource ID filter
          in: query
          schema:
            type: string
        - name: keyword
          description: Name keyword filter
          in: query
          schema:
            type: string
        - name: offset
          description: Pagination offset, at least 0; defaults to 0
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          description: Page size; defaults to 50
          in: query
          schema:
            type: integer
            format: int64
            default: 50
        - name: sort
          description: Sort field; only `name` is supported
          in: query
          schema:
            type: string
            enum:
              - name
            default: name
        - name: direction
          description: Sort direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuthResources"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  schemas:
    AuthResource:
      description: Compact information about an authorization resource
      type: object
      required:
        - id
        - type
        - name
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - catalog
            - resource
            - connector-type
        name:
          type: string
    ListAuthResources:
      description: Authorization resource-list response
      type: object
      required:
        - entries
        - total_count
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuthResource"
        total_count:
          type: integer
          format: int64
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
