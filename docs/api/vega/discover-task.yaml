---
openapi: 3.1.1
info:
  title: DiscoverTask
  description: |
    APIs for Vega Backend resource-discovery tasks.

    A DiscoverTask is an **execution audit record** created through one of three paths:

    - Manual trigger: `POST /catalogs/{id}/discover`, documented at the end of this specification.
    - Scheduled trigger: a worker starts it from a `DiscoverSchedule`; see
      [discover-schedule.yaml](discover-schedule.yaml).
    - Resource refresh: `POST /resources/{id}/discover`; see [resource.yaml](resource.yaml).

    `queue_priority` is a read-only integer computed by the server; larger values have
    higher priority. The default priorities are 10 for scheduled catalog discovery,
    20 for manual catalog discovery, and 30 for resource refresh. Workers dequeue tasks
    strictly by priority and execute tasks for the same catalog serially.

    The worker advances the state machine (`pending → running → completed/failed/cancelled`)
    in one direction. Users cannot cancel, retry, or restart a task. The public API exposes
    only list, get, and cleanup operations.

    Bulk deletion follows the endpoint rules in [vega-backend/CLAUDE.md]: IDs are passed
    as a comma-separated path parameter to `DELETE /discover-tasks/{ids}`. Parent-resource
    filters use query parameters such as `catalog_id`, `schedule_id`, and `resource_id`;
    nested list endpoints are not provided.
  version: 0.1.0
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /discover-tasks:
    get:
      summary: List discovery tasks
      description: Returns paginated discovery tasks and supports filtering by `catalog_id`, `resource_id`, `schedule_id`, `status`, `strategy`, and `trigger_type`.
      parameters:
        - name: catalog_id
          description: Filter by owning catalog
          in: query
          schema:
            type: string
        - name: resource_id
          description: |
            Filters by the Resource being refreshed. A non-empty value matches only
            resource-refresh tasks; catalog-discovery tasks leave this field empty.
          in: query
          schema:
            type: string
        - name: schedule_id
          description: |
            Filters by the owning DiscoverSchedule. Tasks with `trigger_type=manual`
            always have an empty value.
          in: query
          schema:
            type: string
        - name: status
          description: Filters by status. Repeat this parameter for multiple values, which are combined with OR.
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [pending, running, completed, failed, cancelled]
        - name: strategy
          description: Filters by discovery strategy.
          in: query
          schema:
            type: string
            enum:
              - full_sync
              - create_only
              - cleanup_only
        - name: trigger_type
          description: Filters by trigger type.
          in: query
          schema:
            type: string
            enum:
              - manual
              - scheduled
        - name: offset
          description: Pagination offset. Must be at least 0 and defaults to 0
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          description: Page size. Defaults to 20
          in: query
          schema:
            type: integer
            format: int64
            default: 20
        - name: sort
          description: Sort field. Results default to descending creation time. A zero timestamp is sorted as a normal database value, first in ascending order and last in descending order.
          in: query
          schema:
            type: string
            enum: [create_time, start_time, finish_time, last_progress_time]
            default: create_time
        - name: direction
          description: Sort direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDiscoverTasks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /discover-tasks/{id}:
    parameters:
      - name: id
        description: DiscoverTask ID. DELETE accepts a comma-separated list of IDs.
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get discovery task details
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete discovery tasks atomically
      description: |
        The operation is atomic: deletion starts only after every ID passes validation.
        If any validation fails, nothing is deleted.

        Validation order:

        1. If any ID is `pending` or `running`, return 409
           `VegaBackend.DiscoverTask.HasRunningExecution` with
           `{ running_ids: [...] }` in `error_details`. This status check cannot be
           bypassed because deleting a task while a worker writes it would leave orphaned
           data. Wait until the task reaches `completed`, `failed`, or `cancelled`.
        2. If any ID does not exist and `ignore_missing` is false, return 404
           `VegaBackend.DiscoverTask.NotFound` with `{ missing_ids: [...] }` in
           `error_details`.
        3. If all IDs pass, delete them and return 204.
      parameters:
        - name: ignore_missing
          description: |
            Relaxes the existence check: missing IDs are treated as already deleted and
            silently skipped, while other IDs are deleted normally. This does **not**
            bypass the `pending`/`running` check.
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /catalogs/{id}/discover:
    parameters:
      - name: id
        description: Catalog ID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Manually trigger catalog resource discovery
      description: |
        Triggers resource discovery for the specified catalog. **Asynchronous:** the
        server creates a DiscoverTask with `trigger_type=manual`, immediately returns its
        task ID, and lets a worker perform discovery asynchronously. Poll
        `GET /discover-tasks/{id}` with the returned ID to observe progress.

        The optional body is `{"strategy":"full_sync|create_only|cleanup_only"}` and
        defaults to `full_sync`. This RPC-style nested endpoint represents an action on a
        catalog rather than creation of a top-level task.

        Only catalogs with `type=physical` are supported. A logical catalog returns 400.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverTriggerRequest"
      responses:
        "200":
          description: Trigger accepted; the DiscoverTask was created and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverTriggerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Catalog not found
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "409":
          description: Catalog is disabled
          content:
            application/json:
              schema:
                $ref: "../_shared/errors.yaml#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  responses:
    BadRequest:
      description: Invalid request parameters or request body
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized because OAuth token validation failed
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Conflict:
      description: |
        Status conflict; a task in `pending` or `running` cannot be deleted
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
  schemas:
    AccountInfo:
      description: Operator information
      type: object
      required:
        - id
        - type
      properties:
        id:
          description: Account ID
          type: string
        type:
          description: Account type
          type: string
        name:
          description: Display name
          type: string
    DiscoverResult:
      description: Discovery task result, meaningful only when `status=completed`.
      type: object
      required:
        - catalog_id
        - new_count
        - stale_count
        - unchanged_count
        - message
      properties:
        catalog_id:
          description: Associated catalog ID
          type: string
        new_count:
          description: Number of resources created by this discovery run
          type: integer
        stale_count:
          description: Number of resources invalidated by this discovery run
          type: integer
        unchanged_count:
          description: Number of unchanged resources in this discovery run
          type: integer
        updated_count:
          description: Number of resources whose changed attributes were updated
          type: integer
        restored_count:
          description: Number of invalid resources restored to available
          type: integer
        failed_count:
          description: Number of resources that failed during discovery
          type: integer
        message:
          description: Execution details
          type: string
    DiscoverTask:
      description: Discovery task entity
      type: object
      required:
        - id
        - catalog_id
        - schedule_id
        - strategy
        - trigger_type
        - queue_priority
        - status
        - progress
        - message
        - creator
        - create_time
      properties:
        id:
          description: Globally unique ID
          type: string
        catalog_id:
          description: Associated catalog ID
          type: string
        resource_id:
          description: ID of the refreshed Resource; omitted for catalog discovery tasks
          type: string
        resource_name:
          description: Current name of the refreshed Resource; omitted if the Resource no longer exists
          type: string
        catalog_name:
          description: Associated catalog name
          type: string
        schedule_id:
          description: |
            Associated DiscoverSchedule ID. Empty when `trigger_type=manual`.
          type: string
        strategy:
          description: Discovery strategy
          type: string
          enum:
            - full_sync
            - create_only
            - cleanup_only
        trigger_type:
          description: Trigger type
          type: string
          enum:
            - manual
            - scheduled
        queue_priority:
          description: |
            Read-only integer queue priority computed by the server. Larger values have
            higher priority. The defaults are 10 for scheduled catalog discovery, 20 for
            manual catalog discovery, and 30 for resource refresh.
          type: integer
          readOnly: true
        status:
          description: Status
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
        progress:
          description: Progress from 0 to 100
          type: integer
        message:
          description: Status details or error message
          type: string
        start_time:
          description: Start time as a millisecond timestamp; 0 if not started
          type: integer
          format: int64
        finish_time:
          description: Completion time as a millisecond timestamp; 0 if not completed
          type: integer
          format: int64
        last_progress_time:
          description: Time of the latest externally observable progress update, as a millisecond timestamp; 0 if never updated
          type: integer
          format: int64
        result:
          description: Execution result, non-empty only when status is `completed`
          $ref: "#/components/schemas/DiscoverResult"
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          description: Creation time as a millisecond timestamp
          type: integer
          format: int64
    DiscoverTaskResultSummary:
      description: Result counters used in discovery-task lists. Execution details are returned only by the single-task detail endpoint.
      type: object
      required: [catalog_id, new_count, stale_count, unchanged_count, updated_count, restored_count, failed_count]
      properties:
        catalog_id: { type: string }
        new_count: { type: integer }
        stale_count: { type: integer }
        unchanged_count: { type: integer }
        updated_count: { type: integer }
        restored_count: { type: integer }
        failed_count: { type: integer }
    DiscoverTaskSummary:
      description: Discovery-task list summary. Use the single-task detail endpoint for the complete result and its message.
      type: object
      required: [id, catalog_id, schedule_id, strategy, trigger_type, queue_priority, status, progress, creator, create_time]
      properties:
        id: { type: string }
        catalog_id: { type: string }
        resource_id:
          description: ID of the refreshed Resource; omitted for catalog discovery tasks
          type: string
        resource_name:
          description: Current name of the refreshed Resource; omitted if the Resource no longer exists
          type: string
        catalog_name: { type: string }
        schedule_id: { type: string }
        strategy:
          type: string
          enum: [full_sync, create_only, cleanup_only]
        trigger_type:
          type: string
          enum: [manual, scheduled]
        queue_priority:
          description: Read-only integer queue priority computed by the server. Larger values have higher priority; defaults are low=10, normal=20, and high=30.
          type: integer
          readOnly: true
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        progress: { type: integer }
        start_time: { type: integer, format: int64 }
        finish_time: { type: integer, format: int64 }
        last_progress_time: { type: integer, format: int64 }
        result: { $ref: "#/components/schemas/DiscoverTaskResultSummary" }
        creator: { $ref: "#/components/schemas/AccountInfo" }
        create_time: { type: integer, format: int64 }
    DiscoverTriggerResponse:
      description: Response to a manual asynchronous trigger, containing the new DiscoverTask ID.
      type: object
      required:
        - id
      properties:
        id:
          description: ID of the new DiscoverTask. Use `GET /discover-tasks/{id}` to poll its progress.
          type: string
    DiscoverTriggerRequest:
      description: Optional strategy for manually triggered discovery. The server uses `full_sync` when omitted.
      type: object
      properties:
        strategy:
          type: string
          enum:
            - full_sync
            - create_only
            - cleanup_only
    ListDiscoverTasks:
      description: List of discovery-task summaries. Use the single-task detail endpoint for complete results.
      type: object
      required:
        - entries
        - total_count
      properties:
        entries:
          description: Entries
          type: array
          items:
            $ref: "#/components/schemas/DiscoverTaskSummary"
        total_count:
          description: Total number of entries
          type: integer
          format: int64
