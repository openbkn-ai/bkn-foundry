---
openapi: 3.1.1
info:
  title: CatalogHealthCheckSchedule
  description: |
    Vega Backend Catalog 健康检查计划 API。

    每个 physical Catalog 对应一条健康检查计划。计划是 Catalog 的独立子资源，Catalog 详情与
    列表响应不会内嵌该对象。创建 physical Catalog 时可通过 `health_check_schedule` 组合创建；
    创建后的查询和修改使用本文件定义的独立端点。

    每个外部接口都有一一对应的内部版本，路径前缀为 `/api/vega-backend/in/v1`，请求体与
    响应结构与外部完全一致；区别仅在于鉴权方式。本文档仅描述外部接口。
  version: 0.1.0
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /catalogs/{id}/health-check-schedule:
    parameters:
      - name: id
        description: physical Catalog ID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 获取 Catalog 健康检查计划
      description: 仅 physical Catalog 支持；需要该 Catalog 的 `view_detail` 权限。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHealthCheckSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: 修改 Catalog 健康检查计划
      description: |
        仅 physical Catalog 支持，需要该 Catalog 的 `modify` 权限。不支持 DELETE 或单独的启停接口：
        使用 `mode=inherit`、`enabled`、`disabled` 完成全量状态切换。

        必须传入 `expected_update_time` 进行乐观并发控制。该值应取自最近一次查询响应的
        `update_time`；若计划已被其他请求更新，返回 409
        `VegaBackend.CatalogHealthCheckSchedule.UpdateConflict`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CatalogHealthCheckScheduleRequest"
                - type: object
                  required:
                    - expected_update_time
      responses:
        "200":
          description: 更新后的计划
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHealthCheckSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  responses:
    BadRequest:
      description: |
        请求参数或请求体非法。常见 errcode：
        - `VegaBackend.CatalogHealthCheckSchedule.InvalidParameter`：Catalog 不是 physical 类型，或计划模式、Cron 配置非法
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: 未授权（OAuth Token 校验失败）
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Forbidden:
      description: Catalog 权限不足
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotFound:
      description: |
        健康检查计划或其所属 Catalog 不存在。errcode：
        - `VegaBackend.CatalogHealthCheckSchedule.NotFound`
        - `VegaBackend.Catalog.NotFound`
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotAcceptable:
      description: Content-Type 不是 application/json
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Conflict:
      description: |
        健康检查计划更新冲突。errcode：
        - `VegaBackend.CatalogHealthCheckSchedule.UpdateConflict`：`expected_update_time` 与当前 `update_time` 不一致
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalServerError:
      description: |
        服务内部错误。可能的 errcode：
        - `VegaBackend.CatalogHealthCheckSchedule.InternalError`
        - `VegaBackend.CatalogHealthCheckSchedule.InternalError.GetFailed`
        - `VegaBackend.CatalogHealthCheckSchedule.InternalError.UpdateFailed`
        - `VegaBackend.Catalog.InternalError.GetFailed`：获取父 Catalog 失败
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
  schemas:
    AccountInfo:
      description: 账号信息
      type: object
      properties:
        id:
          type: string
        type:
          description: 账号类型（user / app / anonymous 等）
          type: string
        name:
          description: 账号显示名
          type: string
    CatalogHealthCheckScheduleRequest:
      description: Catalog 健康检查计划配置；可在创建 physical Catalog 时组合提交，或通过 PUT 独立修改
      type: object
      required:
        - mode
      properties:
        expected_update_time:
          description: 仅独立 PUT 使用的必填乐观锁版本，取自最近一次查询响应的 `update_time`
          type: integer
          format: int64
          minimum: 1
        mode:
          description: "`inherit` 使用 ConfigMap 的平台默认 Cron 并清空自定义 Cron，`enabled` 使用本请求的 Cron，`disabled` 停用。PUT 设置为 `disabled` 时保留已有自定义 Cron。"
          type: string
          enum: [inherit, enabled, disabled]
        cron_expr:
          description: 仅当 `mode=enabled` 时必填的健康检查 Cron 表达式；相邻两次执行的间隔不得短于 1 小时。PUT 的 `mode=disabled` 忽略该字段并保留已有自定义 Cron
          type: string
          minLength: 1
    CatalogHealthCheckSchedule:
      description: physical Catalog 的独立健康检查计划及最近调度元数据
      type: object
      required:
        - catalog_id
        - mode
        - last_run
        - next_run
      properties:
        catalog_id:
          type: string
        mode:
          type: string
          enum: [inherit, enabled, disabled]
        cron_expr:
          type: string
        last_run:
          description: 最近一次计划执行时间，Unix 毫秒时间戳；健康检查结果存放于 Catalog，而非本对象
          type: integer
          format: int64
        next_run:
          description: 下次计划执行时间，Unix 毫秒时间戳；`disabled` 时为 0，创建或切换为 `inherit` 时按平台全局 Cron 计算为未来时间
          type: integer
          format: int64
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          type: integer
          format: int64
        updater:
          $ref: "#/components/schemas/AccountInfo"
        update_time:
          type: integer
          format: int64
