---
openapi: 3.1.1
info:
  title: CatalogHealthCheckSchedule
  description: |
    Vega Backend Catalog health-check schedule API.

    Each physical Catalog has one health-check schedule. The schedule is an
    independent child resource and is not embedded in Catalog detail or list
    responses. It can be created with a physical Catalog through
    `health_check_schedule`; subsequent reads and updates use the dedicated
    endpoints defined here.

    Every external endpoint has a matching internal version under
    `/api/vega-backend/in/v1` with identical request and response structures.
    Only authentication differs. This document describes external APIs only.
  version: 0.1.0
servers:
  - url: /api/vega-backend/v1
security:
  - OAuth2: []
paths:
  /catalogs/{id}/health-check-schedule:
    parameters:
      - name: id
        description: physical Catalog ID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a Catalog health-check schedule
      description: Supported only for physical Catalogs and requires `view_detail` on the Catalog.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHealthCheckSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update a Catalog health-check schedule
      description: |
        Supported only for physical Catalogs and requires `modify` on the
        Catalog. DELETE and separate enable/disable endpoints are not supported.
        Use `mode=inherit`, `enabled`, or `disabled` for full state transitions.

        `expected_update_time` is required for optimistic concurrency control.
        Use `update_time` from the latest query response. A concurrent update
        causes a 409 response.
        `VegaBackend.CatalogHealthCheckSchedule.UpdateConflict`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CatalogHealthCheckScheduleRequest"
                - type: object
                  required:
                    - expected_update_time
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHealthCheckSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    OAuth2:
      $ref: "../_shared/auth.yaml#/components/securitySchemes/OAuth2"
  responses:
    BadRequest:
      description: |
        Invalid request parameters or body. Common errcode:
        - `VegaBackend.CatalogHealthCheckSchedule.InvalidParameter`: the Catalog is not physical, or the mode or Cron configuration is invalid
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized because OAuth token validation failed
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Forbidden:
      description: Insufficient Catalog permission
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotFound:
      description: |
        The health-check schedule or its Catalog does not exist. Errcode:
        - `VegaBackend.CatalogHealthCheckSchedule.NotFound`
        - `VegaBackend.Catalog.NotFound`
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    NotAcceptable:
      description: Content-Type is not application/json
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    Conflict:
      description: |
        Health-check schedule update conflict. Errcode:
        - `VegaBackend.CatalogHealthCheckSchedule.UpdateConflict`: `expected_update_time` does not match the current `update_time`
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
    InternalServerError:
      description: |
        Internal server error. Possible errcodes:
        - `VegaBackend.CatalogHealthCheckSchedule.InternalError`
        - `VegaBackend.CatalogHealthCheckSchedule.InternalError.GetFailed`
        - `VegaBackend.CatalogHealthCheckSchedule.InternalError.UpdateFailed`
        - `VegaBackend.Catalog.InternalError.GetFailed`: failed to read the parent Catalog
      content:
        application/json:
          schema:
            $ref: "../_shared/errors.yaml#/components/schemas/Error"
  schemas:
    AccountInfo:
      description: Account information
      type: object
      properties:
        id:
          type: string
        type:
          description: Account type, such as user, app, or anonymous
          type: string
        name:
          description: Account display name
          type: string
    CatalogHealthCheckScheduleRequest:
      description: Catalog health-check schedule configuration, submitted with physical Catalog creation or updated independently with PUT
      type: object
      required:
        - mode
      properties:
        expected_update_time:
          description: Required optimistic-lock version for standalone PUT, taken from `update_time` in the latest query response
          type: integer
          format: int64
          minimum: 1
        mode:
          description: "`inherit` uses the platform default Cron from ConfigMap and clears the custom Cron; `enabled` uses the Cron in this request; `disabled` stops the schedule. Setting `disabled` with PUT preserves an existing custom Cron."
          type: string
          enum: [inherit, enabled, disabled]
        cron_expr:
          description: Health-check Cron expression required only when `mode=enabled`; adjacent runs must be at least one hour apart. PUT with `mode=disabled` ignores this field and preserves the existing custom Cron
          type: string
          minLength: 1
    CatalogHealthCheckSchedule:
      description: Independent health-check schedule and recent scheduling metadata for a physical Catalog
      type: object
      required:
        - catalog_id
        - mode
        - last_run
        - next_run
      properties:
        catalog_id:
          type: string
        mode:
          type: string
          enum: [inherit, enabled, disabled]
        cron_expr:
          type: string
        last_run:
          description: Most recent scheduled execution time as Unix milliseconds. Health-check results belong to the Catalog, not this object
          type: integer
          format: int64
        next_run:
          description: Next scheduled execution time as Unix milliseconds. It is 0 when disabled and a future time calculated from the platform Cron when created or switched to `inherit`
          type: integer
          format: int64
        creator:
          $ref: "#/components/schemas/AccountInfo"
        create_time:
          type: integer
          format: int64
        updater:
          $ref: "#/components/schemas/AccountInfo"
        update_time:
          type: integer
          format: int64
