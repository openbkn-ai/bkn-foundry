        '404':
          description: Model or requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'
        '500':
          description: Internal model service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'
        '502':
          description: Invalid embedding provider or adapter response (ModelFactory.ExternalSmallModel.Used.InvalidResponse).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'
      description: >-
        The registered model type must be embedding; a mismatch returns HTTP 400 with code
        ModelFactory.ExternalSmallModel.Used.InvalidParameter before any provider or adapter call.
        Successful provider and adapter responses must contain a non-empty data array of
        non-empty numeric embedding vectors. Invalid output returns HTTP 502 with code
        ModelFactory.ExternalSmallModel.Used.InvalidResponse. Provider extension fields are preserved.
      x-implementation: infra/mf-model-api/app/routers/small_model_router.py
