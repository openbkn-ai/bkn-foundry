paths:
  /small-model/reranker:
    post:
      summary: Small Model Reranker
      operationId: model_used_11_api_mf_model_api_v1_small_model_reranker_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsedReranker'
        required: true
        description: JSON request accepted by the implemented handler signature. Dictionary fields are
          validated by the controller.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid request, including a registered model type mismatch (Model Factory error envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'
        '401':
          description: Missing, invalid or expired Bearer access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'
        '403':
          description: The caller is not allowed to perform this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'
        '404':
          description: Model or requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'
        '500':
          description: Internal model service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastApiError'
      description: >-
        The configured max_documents limits the number of input documents per request.
        When exceeded, returns HTTP 400 with code ModelFactory.ExternalSmallModel.Used.InvalidParameter
        before calling the provider. Documents are never truncated or split. Unconfigured limits
        retain the previous behavior.
        The registered model type must be reranker; a mismatch returns HTTP 400 with code
        ModelFactory.ExternalSmallModel.Used.InvalidParameter before any provider or adapter call.
        Successful results are returned without a FastAPI response_model.
      x-implementation: infra/mf-model-api/app/routers/small_model_router.py
