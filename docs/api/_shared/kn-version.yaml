# Knowledge-network versioning fragments shared by the bkn module documents.
# Like errors.yaml and auth.yaml, this file is a $ref fragment and is not linted
# as a standalone API description. Referencing module documents validate it
# while resolving their references.
openapi: 3.0.3
info:
  title: shared knowledge-network versioning fragments
  version: 0.1.0
paths: {}
components:
  parameters:
    KnVersion:
      name: kn_version
      in: query
      required: false
      description: |
        Which version of a versioned knowledge network to read: `running` (the default), `draft`, or a
        version number. Reading the draft needs `modify` on the network; reading any other version
        needs `view_detail`. Do not combine it with `branch` (400 `BknBackend.KNVersion.InvalidVersion`,
        which is also the answer to a value that is not `running`, `draft` or a positive integer). A
        version that does not exist is 404 `BknBackend.KNVersion.VersionNotFound` and a purged one is
        410 `BknBackend.KNVersion.VersionPurged`. A network without versioning is shown as its running
        version 1: `running`, `draft` and `1` are accepted and all mean the main branch; any other
        value is 400 `BknBackend.KNVersion.NotVersioned`.

        Not accepted on writes: a write to a versioned network always goes to its draft, and a write
        that names `kn_version` is refused with 400 `BknBackend.KNVersion.InvalidVersion`.

        A write to a versioned network that sends `branch=draft` only changes the draft, which is
        published later. A write without `branch`, or with `branch=main`, is a direct write: it goes
        to the draft and is published as a new version in the same request, so later reads of the
        running version see it, as on a network without versioning. A direct write needs no
        `If-Match` or `expected_draft_revision` (they are still checked when sent), and its response
        carries the new version in `X-Kn-Version`. A direct write is refused with 409
        `BknBackend.KNVersion.DraftHasChanges` while the draft holds unpublished changes, which it
        would otherwise publish too; an import with `overwrite_changes=true` replaces them instead.
        When the write or its publish fails, the draft is put back as it was before the write and
        the publish error is returned, for example 400 `BknBackend.KNVersion.ValidationFailed`.

        A network without versioning is its main branch, shown as v1: writes without `branch` change
        main, as they always did. The first write that sends `branch=draft` versions it in the same request:
        main becomes the running version 1, the draft starts as a copy of it, and the write lands in
        the draft. That write needs no `If-Match` or `expected_draft_revision` (they are still
        checked when sent); the writes after it need them as on any versioned network.
      schema:
        type: string
        example: draft
    DraftRevision:
      name: draft_revision
      in: query
      required: false
      description: |
        With `kn_version=draft`, the draft revision the caller expects to read (see the `revision` of
        `draft` in the versioning state, and the `X-Kn-Draft-Revision` response header). A different
        current revision is refused with 409 `BknBackend.KNVersion.DraftRevisionMismatch`.
      schema:
        type: integer
        format: int64
        minimum: 0
    ExpectedDraftRevision:
      name: expected_draft_revision
      in: query
      required: false
      description: |
        The draft revision the write is based on. On a versioned network it is required when the
        request changes the draft as a whole (an import, or `skill_content` of the network) and
        accepted instead of `If-Match` when a delete removes several definitions at once. A different
        current revision is refused with 409 `BknBackend.KNVersion.DraftRevisionMismatch`. Accepted
        but never required on a network without versioning, or by a direct write (see `kn_version`).
      schema:
        type: integer
        format: int64
        minimum: 0
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The `revision` of the definition being changed or deleted, as returned in its `revision` field
        or `ETag` response header (quotes are optional). Required on a versioned network for an update
        (`PUT`, `PATCH`) and, for a delete of one definition, unless `expected_draft_revision` is sent;
        missing it is 428 `BknBackend.KNVersion.PreconditionRequired`. A stale value is 409
        `BknBackend.KNVersion.DefinitionModified`, whose details carry `current_etag`. `If-Match`
        names one definition: with several ids in the path send `expected_draft_revision` instead.
        Accepted but never required on a network without versioning, or by a direct write (see
        `kn_version`).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes a version operation safe to retry, at most 64 characters. Retrying with the same key
        returns the result and status of the first call without running the operation again; a key
        already used for a different operation or target version is 422
        `BknBackend.KNVersion.IdempotencyKeyReused`.
      schema:
        type: string
        maxLength: 64
  headers:
    XKnVersion:
      description: |
        The version this response was read from: a version number, or `draft`. Sent for reads of a
        versioned network, and by a direct write with the version it published.
      schema:
        type: string
    XKnDraftRevision:
      description: |
        The draft revision. Sent when the response was read from the draft (`kn_version=draft`), and
        by a write to the draft of a versioned network that succeeded: then it is the revision the
        write produced, to use as the next `expected_draft_revision`.
      schema:
        type: integer
        format: int64
    XKnRunningVersion:
      description: |
        The running version of the network when the read was resolved. Sent for reads of a versioned
        network that has a running version (not before its first publish), also when another
        version or the draft was read, so a caller that named a version number can tell whether it
        is the running one.
      schema:
        type: integer
    ETag:
      description: |
        Revision of the single definition returned, quoted. Send it back as `If-Match` when updating
        or deleting the definition on a versioned network.
      schema:
        type: string
  schemas:
    KnVersioning:
      description: >-
        Version state of a versioned network. Present only on a network with versioning (it is
        absent otherwise); the same object is returned by `GET /knowledge-networks/{kn_id}/versioning`,
        where an unversioned network answers `enabled: false` with `full_history` only.
      type: object
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum: [enabled, disabling]
          description: "`disabling` while an operator is turning versioning off; writes and version operations are paused."
        running_version:
          type: integer
          description: The version that unscoped reads and queries use. 0 before the first version is published.
        previous_version:
          type: integer
          description: The version that ran before, or 0 when none is kept.
        full_history:
          type: boolean
          description: false in the Community edition, which keeps only the running and the previous version.
        draft:
          type: object
          properties:
            base_version:
              type: integer
              description: The version the draft started from.
            has_changes:
              type: boolean
              description: The draft differs from the running version by its base or by edits.
            outdated:
              type: boolean
              description: The running version was switched after the draft took its base.
            revision:
              type: integer
              format: int64
              description: Draft revision; every write to the draft adds one.
            index:
              type: object
              nullable: true
              description: >-
                Concept index build of the draft. The index is kept current on every write to the draft,
                so it is reported as `ready` for the current revision.
              properties:
                revision:
                  type: integer
                  format: int64
                status:
                  type: string
                  enum: [building, ready, failed]
            index_ready:
              type: boolean
    KnVersionError:
      description: |
        Error envelope of the versioning errors: the common `Error` with a
        `BknBackend.KNVersion.*` code.
      allOf:
        - $ref: './errors.yaml#/components/schemas/Error'
  responses:
    PreconditionRequired:
      description: |
        `BknBackend.KNVersion.PreconditionRequired`. A write to the draft of a versioned network
        (`branch=draft`) lacks the precondition its operation needs: `If-Match`,
        `expected_draft_revision`, or either of them.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnVersionError'
    DefinitionModified:
      description: |
        Conflict on a versioned network. `BknBackend.KNVersion.DefinitionModified` when `If-Match` no
        longer matches the definition (details `current_etag`);
        `BknBackend.KNVersion.DraftRevisionMismatch` when `expected_draft_revision` no longer matches
        (details `draft_revision`); `BknBackend.KNVersion.DraftHasChanges` when a whole-draft replace
        would overwrite unpublished changes without `overwrite_changes=true`, or a direct write
        (without `branch=draft`) would publish them;
        `BknBackend.KNVersion.InvalidVersion` when a write that was resolved before versioning was
        enabled reaches a branch other than the draft (a request that names `kn_version` or a
        branch other than `main` or `draft` is refused earlier, with 400);
        `BknBackend.KNVersion.VersioningDisabling` while versioning is being turned off.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnVersionError'
    ReadConflict:
      description: |
        A read of the draft of a versioned network that no longer holds. `BknBackend.KNVersion.DraftRevisionMismatch`
        when `draft_revision` differs from the current revision, or the draft was written while the
        read was running (details `draft_revision`); `BknBackend.KNVersion.VersioningDisabling` while
        versioning is being turned off. A draft written while the read was running makes the server
        run the read once more before it answers 409, so the error means the draft kept changing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnVersionError'
    VersionNotFound:
      description: |
        `BknBackend.KNVersion.VersionNotFound`. The requested version number was never published.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnVersionError'
    VersionPurged:
      description: |
        `BknBackend.KNVersion.VersionPurged`. The requested version was purged, or was purged while
        the read was running; its content is gone.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnVersionError'
