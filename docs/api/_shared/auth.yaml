# Shared authentication schemes — single source of truth
#
# Security schemes for public platform APIs are centralized here. Module YAML
# files reference them with
#   $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
# and activate the named scheme through `security:` on a path or operation.
#
# Current state: only BKN explicitly declares OAuth2 among the handwritten YAML
# files. Vega, dataflow, and other modules do not yet declare security. This file
# centralizes the authoritative definitions; adding security references to each
# module is separate module-owned work so a documentation migration does not
# silently change API semantics.
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authentication for public APIs.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
    AppKey:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Application key with the `bak_` prefix. Send it as
        `Authorization: Bearer bak_xxx` for service-to-service or
        application-level calls.
