# Common schema fragments shared across modules.
# Like errors.yaml and auth.yaml, this file is a $ref fragment and is not linted
# as a standalone API description. Referencing module documents validate it
# while resolving their references.
openapi: 3.0.3
info:
  title: shared common schemas
  version: 0.1.2
paths: {}
components:
  schemas:
    AccountInfo:
      type: object
      description: |
        Actor information. The service returns an object rather than a bare ID,
        corresponding to the Go type `interfaces.AccountInfo{ID, Type, Name}`.
      properties:
        id:
          type: string
          description: Account ID
        type:
          type: string
          description: Account type, such as user or app
        name:
          type: string
          description: Account display name
      example:
        id: a0f02238-6cec-11f0-82bb-fa1c4529a151
        type: user
        name: Administrator
    BKNContext:
      type: object
      additionalProperties: false
      description: |
        BKN Trace business-provenance context identifying the business
        conversation and interaction to which this call belongs. Required on
        REST APIs.

        Both required child fields are server-issued handles and must not be
        invented by the caller:

        - `conversation_id`: obtained from the Context Loader MCP tool
          `bkn_start_interaction` on the first turn
        - `interaction_id`: obtained from the Context Loader MCP tool
          `bkn_start_interaction`

        These handles are available only through the provenance MCP tool above.
        The BKN Trace Core session APIs under `/api/agent-observability/v1`
        accept gateway credentials only from trusted in-cluster services. They
        do not accept OAuth tokens or `bak_` AppKeys; direct external calls
        receive `401 permission_denied`.
        Context Loader derives the Operation idempotency identity on the server
        from request correlation, tool name, and normalized input. Callers must
        not submit `operation_key`. Network retries should reuse
        `bkn-request-id` or provide a stable
        `X-OpenBKN-Client-Invocation-Id` for the same logical call. This hint is
        used only for idempotency and has no role in identity, authorization, or
        data-isolation decisions.
      required:
        - conversation_id
        - interaction_id
      properties:
        conversation_id:
          type: string
          description: Server-issued business conversation ID.
          example: conv_8eca1655217a128b16727ce664cd579c
        interaction_id:
          type: string
          description: Server-issued interaction ID for one question-and-answer turn.
          example: int_0ab58662974fe9edcfb4ae3e77e43502
        parent_operation_id:
          type: string
          description: Upstream operation ID that caused this call.
        causation_event_ids:
          type: array
          items:
            type: string
          description: Event IDs that caused this call.
        business_refs:
          type: array
          maxItems: 64
          description: Canonical business-object, data, or logic references known to this call.
          items:
            type: object
            additionalProperties: false
            required:
              - ref_type
              - ref_id
            properties:
              ref_type:
                type: string
                description: Business reference type, such as object_type, property, or data_resource.
              ref_id:
                type: string
                description: Canonical business reference ID. Except for data_resource, it must belong to the current knowledge network.
              version:
                type: string
                description: Reference version. Omission means unversioned.
