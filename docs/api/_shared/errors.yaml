# 共享错误响应体 —— 单一来源
#
# `Error` 由 kweaver-go-lib/rest.BaseError JSON 序列化得到，vega / bkn / dataflow /
# execution-factory / bkn-safe 走这套信封。各模块 YAML 用
#   $ref: '../_shared/errors.yaml#/components/schemas/Error'
# 引用，不再各自内嵌。
#
# 注意：adp 下的 context-loader（agent-retrieval）与 execution-factory
#       （agent-operator-integration）没有用 kweaver-go-lib，各自带了一份同源的
#       infra/errors.HTTPError，字段名与 rest.BaseError 不同（code/description/
#       solution/link/details），见下方 ErrorCompact——不改成 BaseError 是因为其
#       调用方（MCP 客户端、Studio）已按现字段名解析。
#       ErrorAgentRetrieval 是 ErrorCompact 的别名，保留是因为 context-loader 的
#       9 份 YAML 已按该名引用（#578 已合入）。
#
# 注意：mf-model 是 FastAPI，错误信封字段不同（code/detail/link），单列
#       errors-fastapi.yaml，不并入本文件——不假装全平台一套。
components:
  schemas:
    Error:
      description: |
        统一错误响应体。由 `kweaver-go-lib/rest.BaseError` JSON 序列化得到。
      type: object
      required:
        - error_code
        - description
        - solution
        - error_link
        - error_details
      properties:
        error_code:
          type: string
          description: 机器可读错误码。
        description:
          type: string
          description: 人类可读错误说明。
        solution:
          type: string
          description: 建议的处理方式。
        error_link:
          type: string
          description: 指向错误详情文档的链接。
        error_details:
          description: 详细内容，类型不固定。

    ErrorCompact:
      description: |
        adp 下 context-loader（`agent-retrieval`）与 execution-factory
        （`agent-operator-integration`）共用的错误响应体，由各自的
        `infra/errors.HTTPError` 序列化得到。字段名与上面的 `Error` **不同**，
        对接时不要混用。

        另一个易踩的点：错误来自下游服务时，这两个服务会原样透传下游响应体，
        此时字段名是下游的信封（通常是 `error_code` / `error_details`）。
        判断来源看 `code` 前缀：`Public.*` 与服务自己的前缀
        （`agentRetrieval.*` / `AgentOperatorIntegration.*`，注意后者首字母大写）
        是本服务产生的。

        **例外：来自 mf-model-api 的错误不适用上面的 `code` 前缀判定。**
        `mf-model-api` 的 `/v1/chat/completions` 是 OpenAI 兼容面，失败一律返回
        OpenAI 错误体 `{"error": {"message", "type", "param", "code"}}`，顶层
        没有 `code`（原来的业务码挪进了 `error.code`）。凡是走大模型调用的端点
        （如 execution-factory 的 `/ai_generate/*`），透传出来的就是这个形态：
        顶层有 `error` 对象即表示错误来自模型调用链路，用 `error.message`
        取文案、`error.type` 取分类（`rate_limit_exceeded` /
        `service_unavailable_error` / `invalid_request_error` 等）。
      type: object
      properties:
        code:
          type: string
          description: |
            机器可读错误码。通用错误为 `Public.<ErrCode>`（如 `Public.BadRequest`），
            业务错误为 `<服务名>.<ErrCode>.<ExtCode>`，如
            `AgentOperatorIntegration.BadRequest.ValidationRequired`。
          example: Public.BadRequest
        description:
          type: string
          description: 人类可读错误说明（按请求语言本地化）。
        solution:
          type: string
          description: 建议的处理方式。
        link:
          type: string
          description: 指向错误详情文档的链接；无对应文档时为「无」。
        details:
          description: 详细内容，类型不固定（字符串或对象）。

    ErrorOpenAI:
      description: |
        OpenAI 兼容的错误响应体。`mf-model-api` 的 `/v1/chat/completions` 只返回
        这一种形态，凡是把大模型调用结果往上抛的端点（如 execution-factory 的
        `/ai_generate/function/{type}`）也原样透传。

        与 `ErrorCompact` 的关键差异：**顶层只有 `error` 一个字段**，业务码在
        `error.code` 里，没有 `solution` / `link`。判断错误是否来自模型调用链路，
        看顶层有没有 `error` 对象即可。

        覆盖范围包括请求体校验失败（HTTP 400）：`/v1/chat/completions` 上的参数
        缺失 / 类型错误也是这个形状，原业务码（`ModelFactory.Router.ParamError.*`）
        在 `error.code` 里。
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: 人类可读的错误说明，可直接展示给用户。
              example: Service is too busy. Please try again later.
            type:
              type: string
              nullable: true
              description: |
                错误分类。常见取值：`rate_limit_exceeded`（上游限流）、
                `service_unavailable_error`（上游暂时不可用）、
                `invalid_request_error`（请求本身有问题）、
                `authentication_error` / `permission_error`（本服务与模型厂商
                之间的认证问题，**不代表调用方凭据有问题**）、
                `api_connection_error`（连不上模型服务）、`server_error`。
              example: service_unavailable_error
            param:
              nullable: true
              description: 出问题的参数名；无则为 null。
            code:
              nullable: true
              description: |
                机器可读错误码。上游给了就透传上游的；本服务产生的错误则是原
                envelope 的业务码（如 `ModelFactory.ModelController.Model.ConnectError`）。
              example: service_unavailable_error

    ErrorAgentRetrieval:
      description: |
        `ErrorCompact` 的别名，供 context-loader 的 YAML 引用（#578 合入时用的是
        这个名字，9 份文件都按它写的，故保留）。**结构完全等同 `ErrorCompact`**，
        新写文档请直接引 `ErrorCompact`。
      allOf:
        - $ref: '#/components/schemas/ErrorCompact'
