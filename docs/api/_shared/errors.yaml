# Shared error response bodies — single source of truth
#
# `Error` is the JSON representation of comm-go/rest.BaseError. Vega, BKN,
# dataflow, execution-factory, and bkn-safe use this envelope. Module YAML files
# reference it with:
#   $ref: '../_shared/errors.yaml#/components/schemas/Error'
# instead of embedding independent copies.
#
# Note: context-loader (`agent-retrieval`) and execution-factory
# (`agent-operator-integration`) under adp do not use the
# comm-go/rest.BaseError envelope. They use equivalent local
# infra/errors.HTTPError types whose field names differ:
# code/description/solution/link/details. ErrorCompact documents that contract.
# It remains separate because MCP clients and Studio already parse these fields.
# ErrorAgentRetrieval is retained as an alias because the nine context-loader
# YAML files introduced in #578 reference that name.
#
# Note: mf-model uses FastAPI and a different code/detail/link envelope. It must
# use a separate errors-fastapi.yaml rather than being forced into this schema.
components:
  schemas:
    Error:
      description: |
        Common error response serialized from `comm-go/rest.BaseError`.
      type: object
      required:
        - error_code
        - description
        - solution
        - error_link
        - error_details
      properties:
        error_code:
          type: string
          description: Machine-readable error code.
        description:
          type: string
          description: Human-readable error description.
        solution:
          type: string
          description: Recommended remediation.
        error_link:
          type: string
          description: Link to detailed error documentation.
        error_details:
          description: Error details with a service-defined type.

    ErrorCompact:
      description: |
        Error response shared by context-loader (`agent-retrieval`) and
        execution-factory (`agent-operator-integration`) under adp. It is
        serialized from each service's `infra/errors.HTTPError`. Its field names
        differ from `Error` above and clients must not treat them as the same
        envelope.

        When an error originates from a downstream service, these services pass
        the downstream body through unchanged. In that case the field names are
        those of the downstream envelope, commonly `error_code` and
        `error_details`. Use the `code` prefix to identify locally generated
        errors: `Public.*`, `agentRetrieval.*`, or
        `AgentOperatorIntegration.*` (the last prefix starts with a capital
        letter).

        Errors from mf-model-api are an exception to the prefix rule.
        `/v1/chat/completions` exposes an OpenAI-compatible surface and always
        returns `{"error": {"message", "type", "param", "code"}}` on failure.
        There is no top-level `code`; the original business code is in
        `error.code`. Endpoints that call a large model, such as
        execution-factory `/ai_generate/*`, pass this shape through. A top-level
        `error` object therefore identifies an error from the model call chain.
        Read `error.message` for the text and `error.type` for classifications
        such as `rate_limit_exceeded`, `service_unavailable_error`, and
        `invalid_request_error`.
      type: object
      properties:
        code:
          type: string
          description: |
            Machine-readable error code. Generic errors use
            `Public.<ErrCode>`, such as `Public.BadRequest`. Business errors use
            `<service>.<ErrCode>.<ExtCode>`, for example
            `AgentOperatorIntegration.BadRequest.ValidationRequired`.
          example: Public.BadRequest
        description:
          type: string
          description: Localized, human-readable error description.
        solution:
          type: string
          description: Recommended remediation.
        link:
          type: string
          description: Link to error documentation; may indicate that no link is available.
        details:
          description: Error details, commonly a string or object.

    ErrorOpenAI:
      description: |
        OpenAI-compatible error response. `mf-model-api`
        `/v1/chat/completions` returns only this shape, and endpoints that pass
        large-model failures through, such as execution-factory
        `/ai_generate/function/{type}`, return it unchanged.

        Unlike `ErrorCompact`, the top level contains only `error`. The business
        code is in `error.code`, and there are no `solution` or `link` fields.
        A top-level `error` object identifies a failure from the model call
        chain.

        This shape also covers request validation failures (HTTP 400). Missing
        or invalid parameters on `/v1/chat/completions` use the same envelope,
        with the original business code, such as
        `ModelFactory.Router.ParamError.*`, in `error.code`.
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: Human-readable error message suitable for display.
              example: Service is too busy. Please try again later.
            type:
              type: string
              nullable: true
              description: |
                Error classification. Common values include
                `rate_limit_exceeded` for upstream throttling,
                `service_unavailable_error` for temporary upstream outages,
                `invalid_request_error` for invalid requests,
                `authentication_error` or `permission_error` for authentication
                between this service and the model provider (not caller
                authentication), `api_connection_error` for connectivity
                failures, and `server_error`.
              example: service_unavailable_error
            param:
              nullable: true
              description: Name of the invalid parameter, or null.
            code:
              nullable: true
              description: |
                Machine-readable error code. An upstream code is passed through;
                locally generated errors use the original envelope's business
                code, such as
                `ModelFactory.ModelController.Model.ConnectError`.
              example: service_unavailable_error

    ErrorAgentRetrieval:
      description: |
        Alias of `ErrorCompact` retained for the context-loader YAML files added
        in #578. The structure is identical. New documentation should reference
        `ErrorCompact` directly.
      allOf:
        - $ref: '#/components/schemas/ErrorCompact'
