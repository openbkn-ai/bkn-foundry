# Shared error response bodies — single source of truth
#
# `Error` is the JSON representation of comm-go/rest.BaseError. Vega, BKN,
# dataflow, execution-factory, and bkn-safe use this envelope. Module YAML files
# reference it with:
#   $ref: '../_shared/errors.yaml#/components/schemas/Error'
# instead of embedding independent copies.
#
# Context-loader and execution-factory also use Error for local failures.
# Raw proxy responses can retain their dependency-owned envelope (e.g. ErrorOpenAI).
# ErrorAgentRetrieval is a legacy schema name referencing Error.
#
# Note: mf-model uses FastAPI and a different code/detail/link envelope. It must
# use a separate errors-fastapi.yaml rather than being forced into this schema.
components:
  responses:
    StrictDependencyBadRequest:
      description: The submitted strict dependency binding is invalid, missing, or unpublished.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StrictDependencyForbidden:
      description: The current user is not allowed to perform the dependency operation required by validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StrictDependencyBadGateway:
      description: A controlled dependency lookup was denied, returned a downstream error, or returned an invalid response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StrictDependencyUnavailable:
      description: A strict dependency lookup timed out or its service is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      description: |
        Common error response serialized from `comm-go/rest.BaseError`.
      type: object
      required:
        - error_code
        - description
        - error_details
      properties:
        error_code:
          type: string
          description: Machine-readable error code.
        description:
          type: string
          description: Human-readable error description.
        error_details:
          description: |
            Error details with a service-defined type. Strict dependency failures use an object
            containing `dependency_kind` and may include a safe nested `detail`; raw downstream
            response bodies and network errors are never included.
        metadata:
          type: object
          additionalProperties: true
          description: Optional public template parameters, approved by the caller for disclosure; not an internal diagnostic container.

    ErrorOpenAI:
      description: |
        OpenAI-compatible error response. `mf-model-api`
        `/v1/chat/completions` returns only this shape, and endpoints that pass
        large-model failures through, such as execution-factory
        `/ai_generate/function/{type}`, return it unchanged.

        Unlike `Error`, the top level contains only `error`. The business
        code is in `error.code`, and there are no `solution` or `link` fields.
        A top-level `error` object identifies a failure from the model call
        chain.

        This shape also covers request validation failures (HTTP 400). Missing
        or invalid parameters on `/v1/chat/completions` use the same envelope,
        with the original business code, such as
        `ModelFactory.Router.ParamError.*`, in `error.code`.
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: Human-readable error message suitable for display.
              example: Service is too busy. Please try again later.
            type:
              type: string
              nullable: true
              description: |
                Error classification. Common values include
                `rate_limit_exceeded` for upstream throttling,
                `service_unavailable_error` for temporary upstream outages,
                `invalid_request_error` for invalid requests,
                `authentication_error` or `permission_error` for authentication
                between this service and the model provider (not caller
                authentication), `api_connection_error` for connectivity
                failures, and `server_error`.
              example: service_unavailable_error
            param:
              nullable: true
              description: Name of the invalid parameter, or null.
            code:
              nullable: true
              description: |
                Machine-readable error code. An upstream code is passed through;
                locally generated errors use the original envelope's business
                code, such as
                `ModelFactory.ModelController.Model.ConnectError`.
              example: service_unavailable_error

    ErrorAgentRetrieval:
      description: Alias of the shared Error envelope retained for existing context-loader references.
      allOf:
        - $ref: '#/components/schemas/Error'
