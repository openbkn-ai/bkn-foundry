openapi: 3.1.0
info:
  title: 执行工厂 · 能力实验室 API
  version: 0.1.0
  description: Implemented capabilities-lab route group. Authorization and Cookie headers are forwarded
    to upstream public APIs; the group middleware itself does not validate Bearer tokens. user_id, then
    X-User-ID, then the configured default determines its user context. Responses use the capabilities-lab
    envelope, not Error. Feature-gated operations return 404 when disabled.
servers:
- url: /api/capabilities-lab/v1
paths:
  /health:
    get:
      summary: Health
      operationId: capabilitiesLabHealth
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                - upstream
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                  service:
                    type: string
                    const: capabilities-lab
                  upstream:
                    type: string
                    enum:
                    - ok
                    - down
  /meta:
    get:
      summary: Meta
      operationId: capabilitiesLabMeta
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
  /metrics:
    get:
      summary: Metrics
      operationId: capabilitiesLabMetrics
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
      description: Route is registered only when metrics are enabled.
  /capabilities:
    get:
      summary: List Capabilities
      operationId: capabilitiesLabListCapabilities
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityListResponse'
        '502':
          description: Request or upstream operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
      parameters:
      - name: kind
        in: query
        schema:
          type: string
      - name: keyword
        in: query
        schema:
          type: string
      - name: group_id
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Missing or noninteger values use the default.
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
        description: Missing or noninteger values use the default.
  /capabilities/http:
    post:
      summary: Create Http Capability
      operationId: capabilitiesLabCreateHttpCapability
      responses:
        '201':
          description: Successful response
          content:
            application/json:
