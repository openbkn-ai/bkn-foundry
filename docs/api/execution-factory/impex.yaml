---
openapi: 3.0.3
info:
  title: 导入导出
  description: |
    把算子、工具箱、MCP 打成 `.adp` 包导出，或从包导入回来。用于环境间搬运与备份。

    **导出是 GET、导入是 multipart**：导入不是发 JSON，而是把 `.adp` 文件作为
    表单字段 `data` 上传，`Content-Type` 必须是 `multipart/form-data`，
    否则直接 415。

    **认证**：`Authorization: Bearer <token>`（OAuth access token 或 `bak_` 前缀的
    AppKey）。
  version: 0.1.3
servers:
  - url: /api/agent-operator-integration/v1
security:
  - OAuth2: []
  - AppKey: []
paths:
  /impex/export/{type}/{id}:
    get:
      tags:
        - Impex
      summary: 导出组件配置
      operationId: exportComponent
      description: |
        导出单个组件的配置。响应带
        `Content-Disposition: attachment; filename=<type>_export_<时间戳>.adp`，
        浏览器会直接落盘；`Content-Type` 仍是 `application/json`——`.adp` 就是 JSON。

        导出内容按 `type` 落在响应的对应字段里（`operator` / `toolbox` / `mcp`），
        其余字段不出现。
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ComponentType'
          description: 组件类型。
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 组件 ID。
      responses:
        '200':
          description: |
            组件配置。响应头带 `Content-Disposition`，文件名形如
            `operator_export_20260731_150405.adp`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentImpexConfig'
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 附件下载头，含建议文件名。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 组件不存在
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorCompact'
        '500':
          $ref: '#/components/responses/InternalError'

  /impex/import/{type}:
    post:
      tags:
        - Impex
      summary: 导入组件配置
      operationId: importComponent
      description: |
        上传 `.adp` 包导入组件。

        **三个容易踩的点**：

        1. **必须 `multipart/form-data`**。发 JSON 会直接 415，报文写明
           `Content-Type must be multipart/form-data`。
        2. **文件字段名固定是 `data`**，不是 `file`。
        `mode` 决定同名组件的处理：`create` 只新建，撞上已存在的就报错；
        `upsert` 存在则更新。默认 `create`。
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ComponentType'
          description: 组件类型。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: string
                  format: binary
                  description: '`.adp` 包文件。**字段名必须是 `data`**。'
                mode:
                  $ref: '#/components/schemas/ImportMode'
      responses:
        '200':
          description: 导入成功（无响应体内容）
        '400':
          description: 参数错误、文件读取失败，或 `create` 模式下组件已存在
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorCompact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          description: '`Content-Type` 不是 `multipart/form-data`'
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ErrorCompact'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    OAuth2:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/OAuth2'
    AppKey:
      $ref: '../_shared/auth.yaml#/components/securitySchemes/AppKey'

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '../_shared/errors.yaml#/components/schemas/ErrorCompact'
    Unauthorized:
      description: 凭据缺失或无效
      content:
        application/json:
          schema:
            $ref: '../_shared/errors.yaml#/components/schemas/ErrorCompact'
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: '../_shared/errors.yaml#/components/schemas/ErrorCompact'

  schemas:
    ComponentType:
      type: string
      enum:
        - operator
        - toolbox
        - mcp
      description: 组件类型。传其他值返回 400。

    ImportMode:
      type: string
      enum:
        - create
        - upsert
      default: create
      description: |
        导入模式。`create` 只新建，同名组件已存在时报错；`upsert` 存在则更新。

    ComponentImpexConfig:
      type: object
      description: |
        `.adp` 包内容。按导出的 `type` 只出现对应的那一个字段。
      properties:
        operator:
          type: object
          additionalProperties: true
          description: |
            算子配置。含 `configs`（算子本体）与 `composite_configs`
            （组合算子的依赖配置）。
        toolbox:
          type: object
          additionalProperties: true
          description: 工具箱配置。
        mcp:
          type: object
          additionalProperties: true
          description: MCP 配置。
