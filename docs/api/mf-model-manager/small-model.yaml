components:
  schemas:
    AddExternalSmallModel:
      properties:
        model_name:
          type: string
          title: Model Name
          description: Model name
        model_type:
          type: string
          pattern: ^(reranker|embedding)$
          title: Model Type
          description: Model type
        model_config:
          type: object
          title: Model Config
          description: Third-party model service configuration
          default: {}
        adapter:
          type: boolean
          title: Adapter
          description: Whether to enable the adapter service
          default: false
        adapter_code:
          type: string
          title: Adapter Code
          description: Adapter code
        batch_size:
          type: integer
          title: Batch Size
          description: Batch size
        max_documents:
          type: [integer, 'null']
          minimum: 1
          maximum: 2147483647
          description: >-
            Maximum input documents per rerank request; only supported for reranker models.
            Null disables the local limit. Creation without this field has no local limit.
            Editing without this field preserves the saved limit; explicit null clears it.
            Requests exceeding the limit return HTTP 400 without calling the provider.
        max_tokens:
          type: integer
          title: Max Tokens
          description: Maximum token count
        embedding_dim:
          type: integer
          title: Embedding Dim
          description: Embedding dimension
        default:
          type: boolean
          title: Default
          description: Whether to set this model as the system default
          default: false
        is_private:
          type: boolean
          title: Is Private
          description: Whether this is a private route used to control validation
          default: false
      type: object
      required:
      - model_name
      - model_type
      - batch_size
      title: AddExternalSmallModel
