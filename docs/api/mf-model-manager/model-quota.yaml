          maximum: 9999.9999
          minimum: 1.0
          title: Input Tokens
          description: Total input token quota
        output_tokens:
          type: number
          maximum: 9999.9999
          minimum: 0.0
          title: Output Tokens
          description: Total output token quota
          default: 0.0
        currency_type:
          type: integer
          maximum: 1.0
          minimum: 0.0
          title: Currency Type
        referprice_in:
          type: number
          maximum: 1000.0
          minimum: 0.0
