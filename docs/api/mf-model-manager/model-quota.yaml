          description: Input token unit price
        referprice_out:
          type: number
          maximum: 1000.0
          minimum: 0.0
          title: Referprice Out
          description: Output token unit price
          default: 0
        num_type:
          items:
            type: integer
            maximum: 5.0
            minimum: 0.0
          type: array
          maxItems: 2
          minItems: 2
          title: Num Type
        price_type:
          items:
            type: string
            pattern: ^(thousand|million)$
          type: array
          maxItems: 2
          minItems: 2
          title: Price Type
