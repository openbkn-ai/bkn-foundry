version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # Go 官方与基础正确性检查
    - govet
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - ineffassign
    - nilerr
    - nilnesserr
    - nilnil
    - staticcheck
    - unused

    # 资源释放与上下文相关检查
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - spancheck

    # 可维护性与安全的低噪声检查
    - asciicheck
    - bidichk
    - errname
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gomoddirectives
    - goprintffuncname
    - gosec
    - loggercheck
    - makezero
    - mirror
    - misspell
    - nolintlint
    - reassign

  exclusions:
    generated: lax
    paths:
      - db/driver/kingbase/gokb
      - interfaces/mock
      - tests

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - db/driver/kingbase/gokb
      - interfaces/mock
      - tests

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true
