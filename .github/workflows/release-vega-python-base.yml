name: release-vega-python-base

on:
  push:
    branches:
      - main
    paths:
      - "vega/vega-python-base/**"
      - ".github/workflows/release-vega-python-base.yml"
      - ".github/workflows/reusable-container-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GHCR (true) or verify build only (false)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Resolve Python base checksum tag
        shell: bash
        run: |
          set -euo pipefail
          date="$(TZ=Asia/Shanghai git show -s --format=%cd --date=format-local:%Y%m%d HEAD)"
          checksum="$(cd vega/vega-python-base && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-7)"
          echo "tag=$date-$checksum" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-tag
    uses: ./.github/workflows/reusable-container-image.yml
    secrets: inherit
    with:
      context: "."
      dockerfile: Dockerfile
      image-name: vega-python-base
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      service-path: vega/vega-python-base
      version: ${{ needs.resolve-tag.outputs.tag }}
