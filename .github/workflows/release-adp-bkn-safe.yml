name: release-adp-bkn-safe

# One image (bkn-safe) and two charts (bkn-safe + the paired upstream hydra).
# The ISF replacement: bkn-safe (authn/authz/directory) + ORY Hydra (token engine).

on:
  push:
    tags:
      - 'v*'
    branches: ['**']
    paths:
      - 'bkn-safe/**'
      - '.github/workflows/release-adp-bkn-safe.yml'
      - '.github/workflows/reusable-*.yml'
      # 版本冻结提交（release/<x.y.z> 分支）触发全量重建
      - 'VERSION'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GHCR (true) or verify build only (false)'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write

jobs:
  version:
    uses: ./.github/workflows/reusable-version.yml

  verify:
    needs: version
    uses: ./.github/workflows/reusable-release-verify.yml
    with:
      service-path: bkn-safe
      stack: chart-only

  build:
    needs: [version, verify]
    uses: ./.github/workflows/reusable-container-image.yml
    secrets: inherit
    with:
      service-path: bkn-safe
      dockerfile: Dockerfile
      context: '.'
      image-name: bkn-safe
      version: ${{ needs.version.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

  chart-bkn-safe:
    needs: [version, verify, build]
    uses: ./.github/workflows/reusable-chart.yml
    with:
      service-path: bkn-safe
      chart-path: charts/bkn-safe
      chart-name: bkn-safe
      version: ${{ needs.version.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

  chart-hydra:
    needs: [version, verify]
    uses: ./.github/workflows/reusable-chart.yml
    with:
      service-path: bkn-safe
      chart-path: charts/hydra
      chart-name: hydra
      version: ${{ needs.version.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
