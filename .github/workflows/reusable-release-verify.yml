name: reusable-release-verify

on:
  workflow_call:
    inputs:
      service-path:
        type: string
        required: true
        description: Service directory (e.g., bkn-trace/agent-observability)
      stack:
        type: string
        required: true
        description: go | python | chart-only
      go-mod-file:
        type: string
        default: go.mod
        description: Path to go.mod relative to service dir
      python-version:
        type: string
        default: '3.11'
        description: Python version for setup
      test-flags:
        type: string
        default: ''
        description: Extra flags for go test (e.g. -skip <pattern>)

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Go module directory
        id: go-module
        if: ${{ inputs.stack == 'go' }}
        working-directory: ${{ inputs.service-path }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ inputs.go-mod-file }}"
          echo "directory=$(dirname "${{ inputs.go-mod-file }}")" >> "$GITHUB_OUTPUT"

      - name: Test (Go)
        if: ${{ inputs.stack == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service-path }}/${{ inputs.go-mod-file }}

      - name: Run Go test
        if: ${{ inputs.stack == 'go' }}
        working-directory: ${{ inputs.service-path }}/${{ steps.go-module.outputs.directory }}
        run: go test ${{ inputs.test-flags }} ./...

      - name: Setup Python
        if: ${{ inputs.stack == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Python test
        if: ${{ inputs.stack == 'python' }}
        working-directory: ${{ inputs.service-path }}
        run: |
          pip install -r requirements.txt
          # 单测专用依赖（pytest/httpx 等）不进运行镜像 requirements.txt，放 test-requirements.txt
          [ -f test-requirements.txt ] && pip install -r test-requirements.txt || true
          pytest

      - name: Setup Helm
        if: ${{ inputs.stack == 'chart-only' }}
        uses: azure/setup-helm@v4

      - name: Helm lint
        if: ${{ inputs.stack == 'chart-only' }}
        working-directory: ${{ inputs.service-path }}
        run: |
          # Chart-only services should have chart in specific subdirs
          find . -name Chart.yaml -type f | while read chart; do
            chart_dir=$(dirname "$chart")
            helm lint "$chart_dir"
          done
