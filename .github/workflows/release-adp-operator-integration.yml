name: release-adp-operator-integration

on:
  push:
    tags:
      - 'v*'
    branches: ['**']
    paths:
      - 'adp/execution-factory/operator-integration/**'
      - '.github/workflows/release-adp-operator-integration.yml'
      - '.github/workflows/reusable-*.yml'
      # 版本冻结提交（release/<x.y.z> 分支）触发全量重建
      - 'VERSION'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GHCR (true) or verify build only (false)'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write

jobs:
  version:
    uses: ./.github/workflows/reusable-version.yml

  verify:
    needs: version
    uses: ./.github/workflows/reusable-release-verify.yml
    with:
      service-path: adp/execution-factory/operator-integration
      stack: chart-only

  build:
    needs: [version, verify]
    uses: ./.github/workflows/reusable-container-image.yml
    secrets: inherit
    with:
      service-path: adp/execution-factory/operator-integration
      dockerfile: docker/Dockerfile
      context: '.'
      image-name: agent-operator-integration
      version: ${{ needs.version.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

  chart:
    needs: [version, verify, build]
    uses: ./.github/workflows/reusable-chart.yml
    with:
      service-path: adp/execution-factory/operator-integration
      chart-path: helm/agent-operator-integration
      chart-name: agent-operator-integration
      version: ${{ needs.version.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
