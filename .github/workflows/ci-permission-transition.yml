name: ci-permission-transition

on:
  pull_request:
    paths:
      - 'bkn-safe/server/migrationcontract/**'
      - '.github/workflows/ci-permission-transition.yml'

permissions:
  contents: read

concurrency:
  group: ci-permission-transition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bkn-safe/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bkn-safe/server/go.mod
      - run: go test ./migrationcontract -count=1
