name: reusable-version

on:
  workflow_call:
    inputs:
      publish:
        default: false
        type: boolean
    outputs:
      publish:
        value: ${{ jobs.resolve.outputs.publish }}
        description: Whether the release may publish artifacts
      version:
        value: ${{ jobs.resolve.outputs.version }}
        description: Resolved version string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        env:
          CI_REF_NAME: ${{ github.ref_name }}
          CI_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          # Single source of truth: repo-root VERSION (shared by all services)
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be a stable X.Y.Z version; received $BASE_VERSION"
            exit 1
          fi
          REF_NAME="$CI_REF_NAME"
          REF_TYPE="$CI_REF_TYPE"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"

          if [[ "$REF_TYPE" == "tag" ]]; then
            # A tag may be the stable VERSION or its prerelease (for example,
            # v0.1.1-rc.1). Keep the full tag version on every image and chart,
            # but never let it cross the release line declared in VERSION.
            TAG_VERSION="${REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$BASE_VERSION" && ! "$TAG_VERSION" =~ ^"$BASE_VERSION"-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
              echo "::error file=VERSION::tag v$TAG_VERSION must equal VERSION ($BASE_VERSION) or use it as a prerelease prefix"
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            if [[ "$REF_NAME" == release/* ]]; then
              # Release 分支名必须与根 VERSION 一致：分支刚切出、版本冻结提交尚未
              # 落地时，VERSION 还是上一个版本，此时构建出的制品版本号会指向错误的
              # 发布周期（例如在 release/0.1.2 上产出 0.1.1-release）。
              BRANCH_VERSION="${REF_NAME#release/}"
              if [[ "$BRANCH_VERSION" != "$BASE_VERSION" ]]; then
                echo "::error::分支 $REF_NAME 与根 VERSION($BASE_VERSION) 不一致，拒绝构建：" \
                     "请先提交版本冻结（VERSION -> $BRANCH_VERSION）。"
                exit 1
              fi
            fi
            # Every branch uses the same immutable format. The bare version and
            # explicit RC versions belong to tags, so a later branch push can
            # never overwrite a deployable candidate.
            SANITIZED_BRANCH="$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^0-9a-zA-Z.-]+#-#g; s#-+#-#g; s#^[.-]+##; s#[.-]+$##')"
            # The VERSION prefix already identifies the release line; keeping
            # its number in the branch token would duplicate it in the tag.
            if [[ "$REF_NAME" == release/* ]]; then SANITIZED_BRANCH=release; fi
            COMMIT_DATE="$(TZ=Asia/Shanghai git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)"
            # Embed the commit time (Asia/Shanghai, fixed-width YYYYMMDDHHMMSS) so
            # the prerelease is monotonically sortable. Commit time, not build time,
            # keeps CI re-runs reproducible.
            VERSION="$BASE_VERSION-$SANITIZED_BRANCH.$COMMIT_DATE.sha$SHORT_SHA"
          fi

          if [[ "$REF_TYPE" == "tag" || "${{ github.event_name }}" == "push" ]]; then
            PUBLISH=true
          else
            PUBLISH='${{ inputs.publish }}'
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
