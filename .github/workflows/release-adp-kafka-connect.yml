name: release-adp-kafka-connect

on:
  push:
    tags:
      - 'v*'
    branches: ['**']
    paths:
      - 'adp/vega/kafka-connect/**'
      - '.github/workflows/release-adp-kafka-connect.yml'
      - '.github/workflows/reusable-*.yml'
      # 版本冻结提交（release/<x.y.z> 分支）触发全量重建
      - 'VERSION'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GHCR (true) or verify build only (false)'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      service-path: adp/vega/kafka-connect
      stack: chart-only

  build-kafka-connect:
    needs: test
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    with:
      service-path: adp/vega/kafka-connect
      dockerfile: docker/Dockerfile
      context: docker
      image-name: kafka-connect
      version: ${{ needs.test.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      build-args: |
        BASE_IMAGE=bitnamilegacy/kafka:3.9.0-debian-12-r10

  chart-kafka-connect:
    needs: [test, build-kafka-connect]
    uses: ./.github/workflows/reusable-chart.yml
    with:
      service-path: adp/vega/kafka-connect
      chart-path: helm
      chart-name: kafka-connect
      version: ${{ needs.test.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
