name: ci-vega

# VEGA Backend PR gate: lint, unit tests, coverage and build.

on:
  pull_request:
    paths:
      - 'vega/**'
      - '.github/actions/golangci-lint/**'
      - '.github/workflows/ci-vega.yml'

permissions:
  contents: read

concurrency:
  group: ci-vega-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vega/vega-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vega/vega-backend/server/go.mod

      - name: 静态检查
        uses: ./.github/actions/golangci-lint
        with:
          working-directory: vega/vega-backend/server

      - name: 单元测试与覆盖率
        run: make test-cover COVERAGE_THRESHOLD=10

      - name: 构建
        run: cd server && go build ./...

      - name: 上传覆盖率产物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vega-backend-coverage
          if-no-files-found: warn
          path: |
            vega/vega-backend/test-result/coverage.out
            vega/vega-backend/test-result/coverage.html
            vega/vega-backend/test-result/coverage.xml
