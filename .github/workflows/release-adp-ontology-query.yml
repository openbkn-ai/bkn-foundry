name: release-adp-ontology-query

on:
  push:
    tags:
      - 'v*'
    branches: ['**']
    paths:
      - 'adp/bkn/ontology-query/**'
      - 'comm-go/**'
      - '.github/workflows/release-adp-ontology-query.yml'
      - '.github/workflows/reusable-*.yml'
      # 版本冻结提交（release/<x.y.z> 分支）触发全量重建
      - 'VERSION'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GHCR (true) or verify build only (false)'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write

jobs:
  version:
    uses: ./.github/workflows/reusable-version.yml

  verify:
    needs: version
    uses: ./.github/workflows/reusable-release-verify.yml
    with:
      service-path: adp/bkn/ontology-query
      stack: chart-only

  build:
    needs: [version, verify]
    uses: ./.github/workflows/reusable-container-image.yml
    secrets: inherit
    with:
      service-path: adp/bkn/ontology-query
      dockerfile: docker/Dockerfile
      # Root context includes comm-go required by the service-local replace.
      context: '../../..'
      image-name: ontology-query
      version: ${{ needs.version.outputs.version }}
      build-args: |
        SERVER_VERSION=${{ needs.version.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

  chart:
    needs: [version, verify, build]
    uses: ./.github/workflows/reusable-chart.yml
    with:
      service-path: adp/bkn/ontology-query
      chart-path: helm/ontology-query
      chart-name: ontology-query
      version: ${{ needs.version.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
