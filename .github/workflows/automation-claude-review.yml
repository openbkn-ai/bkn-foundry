name: Claude Code Review

# 由 Claude 对 PR 做代码评审：开启、重开、从 draft 转 ready、每次推送新提交时各跑
# 一次；此外可在评论里写 `/review` 或 `@claude` 手动要一轮。
#
# 覆盖每次推送而非只审首版，是因为评审之后追加的提交往往是「按意见快速改一下」，
# 恰恰最容易引入新问题；只审首版会让这部分完全不过审。
# 连续推送的浪费由下面的 concurrency 收敛：新一次运行会取消尚未完成的上一次。
# 「推提交」与「回帖 /review」若在同一段时间内发生，同样收敛成一轮——两个入口都保留，
# 合并掉的只是重复劳动：存活的那轮 checkout 拿的是 PR 最新 HEAD（含新提交），而下方
# prompt 本就要求读回既有 inline 评论与其下的回复，代码与回复两边都不会漏。
#
# 口令过滤有个必须靠 prompt 兜住的副作用：作者「推提交 + 紧接着发一条处理说明」时，
# 那条说明多半不含口令，过不了下方 job 的 if，也就不会去取消正在跑的那轮；而推送那轮
# 的评论是在 job 开头预取的，说明发在它开头之后就永远读不到。#619 第九轮实测：02:28:42
# 推送触发评审，02:28:56 作者发说明「appSetting 死字段本轮不采纳」，02:31:56 的结论仍把
# 这条原样列了出来——作者会认为没人在听。debounce 那 15 秒对此完全无效，它只让**合格
# 的**评论有机会取消推送轮，不合格的评论按 comment.id 单独分组、根本不参与取消。
# 因此分片 prompt 要求「写 findings 之前最后再拉一次顶层评论」。注意只堵住了顶层这一半：
# 作者在 bot 的 inline 评论下回复「不采纳」仍读不到，因为补另一半要 `gh api`，而分片
# 刻意不给（全方法通配会让模型能 POST /pulls/N/reviews，破坏「表态只能有一次」）。
#
# 评论也能触发复评，但必须在正文里显式写 `/review` 或 `@claude`。早先是每条评论都跑
# 一轮，作者每回一帖就复评一次，轮次膨胀且额度白烧——待确认项现在不阻断放行（见下方
# prompt），自动复评失去了存在理由，改成按需触发。两个口令都收是因为 `@claude` 已是
# 团队既有习惯，本仓没有别的 workflow 接管它；只认 `/review` 会让这个写法在合并后
# 静默失效，连提示都没有。注意 contains 是子串匹配，评论里粘到含 `/review` 字样的
# 链接或命令会误触发一轮——代价是一次评审，未做更严的匹配。
# 为避免自我循环，评论事件由下方 job 的 if 过滤掉 bot 自己的评论，并限定发起者为
# OWNER/MEMBER/COLLABORATOR——评论事件在 base 仓上下文携带 secret 运行，限定关联方
# 可挡掉 fork 陌生人触发的 pwn-request。
#
# 需要对任意 PR 重新评审时，手动触发 workflow_dispatch 并填 PR 编号。
#
# pull_request 触发只对代码路径生效；纯配置类改动（release manifest 刷新、镜像同步、
# workflow 自身调整、文档）不进评审，既省额度也避免噪声。
#
# 这份列表是「哪些目录算代码」的唯一声明，漏一个就是整条服务线永不进评审——而且不会
# 报错，只是安静地什么都不发生。#1201 只改 bkn-trace，opened 与 synchronize 都被 paths
# 滤掉，作者是发现没人评审才手动触发的；那个 PR 改的是会话归属与错误披露语义，恰好是
# 最该有人看第二遍的地方。bkn-trace 有 128 个非测试 Go 文件、自己的 CI，只是从来没在
# 这里登记过。data-migrator 同理（67 个 Python 文件）。
#
# 加目录时按「有没有会被执行的代码」判断，不按目录重要性：docs/ 与 ref/ 里的少量脚本
# 不入列，deploy/ 只收 scripts/ 这一层——其余是 chart 与 manifest，属于上面说的纯配置。
# 这个文件自身在 .github/ 下，同样不在列表里，所以改它的 PR 不会自我评审。
# 注意：GitHub Actions 不允许同一事件同时使用 paths 与 paths-ignore，因此这里
# 只写 include 列表——未列出的路径自动跳过——并用 ! 前缀排除列表内的文档文件。
# 评论事件不支持 paths 过滤，靠 job if 与 Claude 自身判断相关性。

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'adp/**'
      - 'infra/**'
      - 'bkn-safe/**'
      - 'bkn-trace/**'
      - 'comm-go/**'
      - 'data-migrator/**'
      - 'deploy/scripts/**'
      - '!**/*.md'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  # 分组判据是「这条事件能不能过下方 job 的 if」，不是「它是不是评论事件」。
  #
  # 能过 if 的（推送、人工写 `/review`/`@claude` 的评论、手动触发）全部落 -review 组，
  # cancel-in-progress 生效：连续推送时新 run 取消旧 run；作者「推提交 + 回帖 /review」
  # 这种连续动作也收敛成一轮，而不是推送和评论各跑一轮。
  #
  # 过不了 if 的评论（bot 自己贴的进度/行内评论、外部人员的评论、不含口令的普通回帖）
  # 必须按 comment.id 各自成组。concurrency 在 run 排队时求值，早于 job if，落进共享组
  # 就会在 if 把它过滤掉之前先取消掉正在跑的评审。claude-code-action 的 tracking comment
  # 与 create_inline_comment 正是这条路径——曾导致评审贴出第一条评论那刻就自杀。
  #
  # 因此下面的判据必须与 job if 的评论分支逐条对齐（非 bot、含口令、author_association
  # 属 OWNER/MEMBER/COLLABORATOR）。漏对一条，那类事件就能溜进共享组杀掉正在跑的评审。
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}-${{ (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && !(github.event.sender.login != 'github-actions[bot]' && (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) && format('comment-{0}', github.event.comment.id) || 'review' }}
  cancel-in-progress: true

# 评审分四段跑：plan 定范围 → review 出结论 → verify 复核阻塞项 → verdict 落表态。
#
# 曾经是分片并行的（一个模块一片 + 一片专看跨模块契约），起因是 #662 撞 60 轮上限、
# 连烧两次 $5、零产出。分片消掉了那个失败模式，但代价在 #709 里被认定不划算：
#   - 最近十个 PR 里七个的代码文件数不超过 12，一个 agent 就审得完，却在付六片的钱；
#   - 六片各自独立找问题，按单片 20% 阻断率算，至少一片阻断的概率是 1 − 0.8⁶ ≈ 74%，
#     #685 连续五轮 CHANGES_REQUESTED 不收敛，这是原因之一；
#   - 逼出分片的那个约束也变了：上限 80、prompt 有轮次预算、文档与测试走浅审、
#     深挖条件触发。
# 现在是单 agent，--max-turns 200。矩阵仍在（只有一条），周边机器沿用不变。
#
# 三条不变量（改这个文件必须守住）：
#   - **责任范围不等于可读范围**。清单圈定「为哪些文件出结论」，核查可以读全仓——
#     改动在一处、调用方在另一个模块，是本仓最贵的一类缺陷。
#   - **表态只能有一次，且由 verdict 落**。评审 agent 不给 `gh pr review`，也不给
#     `Bash(gh api:*)`（全方法通配能 POST /pulls/N/reviews 绕过去）。汇总用确定性
#     脚本而非再起一个模型：拼接已有结论不需要判断力，也不该有编造空间。
#   - **阻塞项必须过 verify 独立复核才进 PR**。发现者自评把握挡不住误报——同一段
#     上下文里模型对自己刚推出来的结论天然高估。verify 换一份干净上下文、默认立场
#     是驳回，照 evidence 去原地验。误报的代价不对称：放过一个待确认项作者自己会
#     看到，报一个假阻塞项则挂住 PR、逼作者证伪一个不存在的问题。
#   - **阻塞项只能被修掉或被显式撤销，不能靠没人再提它而消失**。复评 prompt 为了收敛
#     只让评审看新增提交，于是上一轮报 5 条、作者修 3 条时，剩下 2 条不再出现在本轮
#     findings 里，verdict 从本轮 findings 算出来的 action 就成了 approve——PR 带着两条
#     已知阻塞项过了合并门，页面上还看不出有东西没动。所以结论正文里携带一个隐藏状态
#     块，仍然成立的阻塞项跨轮传递，每轮由 verify 重判「现在还成立吗」，作者用
#     `/dismiss <编号>` 或在回复里讲清不采纳的理由来关掉。
#
# 静默是最坏的结果：跑挂了 PR 上什么都没有，与「压根没触发」无法区分（#671 首轮就是
# 这样被当成没触发的）。verdict 挂 if: always()，回填占位保证「跑了但没产出」可见，
# 没有结论时也要贴一条通告说明本轮空转。


jobs:
  plan:
    # 逐事件放行：
    #   - workflow_dispatch：手动，总放行。
    #   - pull_request：只同仓 PR（fork 拿不到 secret，跳过避免红叉）。
    #   - 评论/行内回复：必须挂在 PR 上、PR 仍 open、评论正文含 `/review` 或
    #     `@claude`、非 bot 自己发的、且发起者为 OWNER/MEMBER/COLLABORATOR，
    #     挡掉自我循环与 fork 陌生人的 pwn-request。
    #     state == 'open' 让合并/关闭后的评论不再触发复评——merge 已不可逆，
    #     再跑只是白费额度、在死 PR 上贴噪声。
    #     口令过滤把「每回一帖跑一轮」压成按需触发，评审轮次由人决定。
    #
    # 放行判据只写在这一个 job 上，下游靠 needs 继承，避免三处各写一份逐渐走样。
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.pull_request.state == 'open' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.sender.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.sender.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write 是为了贴那条进度评论：分片模式关掉了 claude-code-action 的
      # track_progress（每片各贴一条会把 PR 刷满），PR 上从触发到出结论的七八分钟里
      # 便完全没有动静，看起来像没触发。这里补一条**唯一**的进度评论，由 verdict 收尾
      # 时删掉——过程态不该留在 PR 的历史里，结论本身才是记录。
      pull-requests: write
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      shards: ${{ steps.plan.outputs.shards }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
      skip_round: ${{ steps.plan.outputs.skip_round }}
      prior_rounds: ${{ steps.plan.outputs.prior_rounds }}
      carried: ${{ steps.plan.outputs.carried }}
      dismissed: ${{ steps.plan.outputs.dismissed }}
      file_total: ${{ steps.plan.outputs.file_total }}
      file_listed: ${{ steps.plan.outputs.file_listed }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      GH_TOKEN: ${{ github.token }}
      # gh 解析目标仓库只认 --repo、GH_REPO、当前目录的 git remote 三者，**不读**
      # GITHUB_REPOSITORY。这个 job 有意不 checkout，工作目录不是 git 仓库，不给
      # GH_REPO 的话 gh 会以 failed to determine base repo 直接非零退出，plan 一挂
      # 下游全跳过——连 verdict 的 always() 兜底都够不着（它被 needs.plan.result 挡着）。
      # 同仓 automation-agent-metrics.yml 是同样不 checkout 的场景，那里逐条带 -R。
      GH_REPO: ${{ github.repository }}
    steps:
      # 推送事件先静默一小会儿再往下走。作者（多数时候是 agent）常见动作是
      # `git push` 紧接着 `gh pr comment "/review"`，两条事件各触发一次评审；静默期内
      # 后一条到达时，上面的 concurrency 会把本 run 取消，而此刻还没 checkout、没调
      # Claude、没贴 tracking comment，取消的代价是零。等满则照常跑，只晚十几秒。
      # 只挂 pull_request：评论触发与手动触发都是人明确要一轮，不该让它等。
      - name: Debounce push events
        if: github.event_name == 'pull_request'
        run: sleep 15

      - name: Resolve PR number
        id: meta
        run: echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # 只调 API 取改动文件清单，不 checkout——分片规划不需要工作区，省掉一次全仓拉取。
      - name: Plan shards
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import collections, json, os, pathlib, re, subprocess

          pr = os.environ["PR_NUMBER"]
          repo = os.environ["GH_REPO"]
          # `gh pr view --json files` 一次最多返回 100 个文件，超出部分静默丢掉，那些文件
          # 就永远不进任何分片、也永远不被评审——比漏审更糟的是没人知道漏了。改走 REST
          # /pulls/{n}/files 自己翻页：每页 100，取到 FILE_CAP 为止。
          #
          # 不用 --paginate 是给超大 PR 兜底——那种 PR 翻十几页也只会用到前 FILE_CAP 个，
          # 多出来的页是白花的 API 调用。上限本身仍然存在（单 agent 的上下文吃不下无限
          # 文件），差额照旧由 verdict 在结论里点明。
          FILE_CAP = 500
          PER_PAGE = 100
          paths = []
          page = 1
          while len(paths) < FILE_CAP:
              batch = subprocess.run(
                  ["gh", "api",
                   "repos/%s/pulls/%s/files?per_page=%d&page=%d" % (repo, pr, PER_PAGE, page),
                   "--jq", ".[].filename"],
                  capture_output=True, text=True, check=True,
              ).stdout.splitlines()
              batch = [p for p in batch if p.strip()]
              paths += batch
              if len(batch) < PER_PAGE:
                  break
              page += 1
          paths = paths[:FILE_CAP]
          total = int(subprocess.run(
              ["gh", "pr", "view", pr, "--json", "changedFiles", "--jq", ".changedFiles"],
              capture_output=True, text=True, check=True,
          ).stdout.strip())

          # adp/ 与 infra/ 下一层才是服务边界（adp/bkn、infra/bkn-agent）；其余仓根目录
          # 本身就是一个服务。归不进这两类的（docs/、examples/、根文件）落 misc，
          # 宁可多跑一片也不静默丢掉——漏审比多花钱贵。
          TWO_LEVEL = {"adp", "infra"}
          TOP_LEVEL = {"bkn-safe", "comm-go", "deploy", "data-migrator", "migrations"}

          # 实测最近 10 个 PR 的 222 个改动文件里只有 44% 是代码：测试 25%、文档 15%、
          # 配置与生成物 12%。此前它们与代码同规格评审——文档也在被追引用点、被做触发式
          # 深挖，一片就是 5 分钟和几十轮。按类分流：
          #   deep    代码，全套
          #   shallow 测试，跟着所属模块走但不追引用点（测试的调用方就是它自己）
          #   低风险  文档/示例/生成物，单独一片浅审
          # 迁移、helm、values 不在此列——它们是本仓最高频的事故来源，永远走 deep。
          def klass(path):
              risky = ("migrations/" in path or "/helm/" in path
                       or path.endswith("values.yaml"))
              if risky:
                  return "deep"
              if ("_test." in path or "/tests/" in path
                      or path.endswith("_test.go")):
                  return "shallow"
              if (path.startswith(("docs/", "examples/")) or path.endswith(".md")
                      or path.endswith((".lock", ".sum"))):
                  return "lowrisk"
              return "deep"

          groups, lowrisk = collections.OrderedDict(), []
          for p in paths:
              k = klass(p)
              if k == "lowrisk":
                  lowrisk.append(p)
                  continue
              parts = p.split("/")
              if parts[0] in TWO_LEVEL and len(parts) > 2:
                  key = "/".join(parts[:2])
              elif parts[0] in TOP_LEVEL:
                  key = parts[0]
              else:
                  key = "misc"
              groups.setdefault(key, []).append(p)

          # 一片，一个 agent 看全部。
          #
          # 分片曾解决过一个真问题：#662 撞 60 轮上限、连烧两次 $5、零产出，改造前 189
          # 次运行里 12 次失败全是 error_max_turns。但它被无条件用在了每个 PR 上，而
          # 最近十个 PR 里有七个的代码文件数不超过 12——一个 agent 审得完，却在付六片的
          # 钱、等九分钟。
          #
          # 更要命的是阻断概率被放大：六片各自独立找问题，按单片 20% 的阻断率算，至少
          # 一片阻断的概率是 1 − 0.8⁶ ≈ 74%。#685 连续五轮 CHANGES_REQUESTED、始终不
          # 收敛，这是原因之一。「审得更全」和「更难通过」是同一件事的两面。
          #
          # 当初逼出分片的那个 60 轮上限，前提也已经变了：上限抬到 80、prompt 里有轮次
          # 预算、文档与测试走浅审、深挖改成条件触发。同一个 PR，现在单 agent 的活比
          # #662 时少得多，把上限放到 200 就够。
          #
          # 保留的是文件类分流——deep / shallow / lowrisk 的区分省的是真活，与分片无关。
          # 不再需要 contract 片：一个 agent 本来就看得见全量 diff，跨模块一致性自然在
          # 视野里。
          deep_files = sorted(f for g in groups.values() for f in g if klass(f) == "deep")
          shallow_files = sorted(f for g in groups.values() for f in g if klass(f) == "shallow")

          shards = [{
              "key": "review",
              "label": "全量",
              "kind": "single",
              "files": "\n".join("- " + f for f in deep_files) or "（本轮没有代码改动）",
              "files_shallow": "\n".join("- " + f for f in (shallow_files + sorted(lowrisk))),
          }] if paths else []

          print("shards=" + json.dumps(shards, ensure_ascii=False))
          print("has_shards=" + ("true" if shards else "false"))
          # 已有过几轮结论。分片与 verdict 共用这一个数来收紧配额，免得各自从评论历史
          # 里推断「这是第几轮」还推出不同结果。
          # 历史结论：轮数用来收紧配额，最后一轮的表态用来决定这次要不要跑，正文里
          # 那条隐藏状态块用来把上一轮没修完的阻塞项带到这一轮。
          prior = subprocess.run(
              ["gh", "api", "repos/%s/pulls/%s/reviews" % (repo, pr),
               "--paginate", "--jq",
               '[.[] | select((.body // "") != "") | {state, body}] | @json'],
              capture_output=True, text=True)
          rounds = []
          if prior.returncode == 0:
              for chunk in prior.stdout.splitlines():
                  try:
                      rounds += json.loads(chunk)
                  except ValueError:
                      pass
          rounds = [r for r in rounds if isinstance(r, dict)]
          states = [r.get("state") for r in rounds]
          print("prior_rounds=%d" % len(states))

          # 未修完的阻塞项必须跨轮存活。此前 verdict 只从本轮 findings 收集阻塞项：
          # 上一轮报 5 条、作者修 3 条，第二轮 findings 里就只剩那 3 条的复查（复评
          # prompt 明令不许重列已提过的问题），剩下 2 条既不复述也不计票，action 算出来
          # 是 approve——PR 带着两条已知阻塞项过了合并门。
          #
          # 状态放结论正文的隐藏块，不放 artifact：artifact 只留 7 天且要按 run id 反查，
          # 而结论正文是 PR 自带的、任何一轮都读得回的持久载体。倒着找第一条带块的正文
          # ——空转轮与被取消轮不落表态、不写块，自然被跳过。
          STATE_RE = re.compile(r"<!-- claude-review-state:\s*(\{.*?\})\s*-->", re.S)
          carried = []
          for r in reversed(rounds):
              m = STATE_RE.search(str(r.get("body") or ""))
              if not m:
                  continue
              try:
                  blob = json.loads(m.group(1))
              except ValueError:
                  break
              if isinstance(blob, dict):
                  carried = [x for x in (blob.get("open") or []) if isinstance(x, dict)]
              break

          # 逃生口。遗留项默认一直阻断，误报若没有撤销通道就会把 PR 永久挂死。两条路：
          # 作者写 `/dismiss <编号>`（这里认），或在回复里讲清为什么不采纳（verify 认，
          # 见下游 prompt）。口令限定 OWNER/MEMBER/COLLABORATOR，与本 workflow 的触发
          # 判据同一套——否则外部人员一句评论就能摘掉阻塞项。排除 Bot 作者：结论正文
          # 里印着各条的编号与这句提示，自己贴的文字不能反过来把自己的结论撤掉。
          #
          # `/dismiss` 不在触发口令里，单发不起一轮；提示语让作者跟 `/review` 写在同一
          # 条评论里，一条评论既撤销又复评。
          ALLOWED = {"OWNER", "MEMBER", "COLLABORATOR"}
          DISMISS_RE = re.compile(r"/dismiss\s+`?([0-9a-f]{8})`?")
          dismissed = set()
          for endpoint in ("issues/%s/comments" % pr, "pulls/%s/comments" % pr):
              got = subprocess.run(
                  ["gh", "api", "repos/%s/%s" % (repo, endpoint), "--paginate", "--jq",
                   '.[] | select((.user.type // "") != "Bot") '
                   '| [.author_association, .body] | @json'],
                  capture_output=True, text=True)
              if got.returncode != 0:
                  continue
              for ln in got.stdout.splitlines():
                  try:
                      assoc, body = json.loads(ln)
                  except (ValueError, TypeError):
                      continue
                  if assoc in ALLOWED:
                      dismissed |= set(DISMISS_RE.findall(str(body or "")))
          # 上限 12：遗留清单每轮都要过一遍复核，无上限会让 verify 的轮次预算被历史
          # 拖垮。真攒到 12 条以上说明这个 PR 该拆，不该靠评审兜。
          # 必须与 verdict 里写状态块的 STATE_CAP 一致。
          carried = [c for c in carried if c.get("key") not in dismissed][:12]
          print("carried=" + json.dumps(carried, ensure_ascii=False))
          print("dismissed=" + json.dumps(sorted(dismissed)))

          # 已经 approve 过之后，作者多半在打磨（补测试、改注释、rebase）。本周实测：
          # 首次 approve 之后的重复 approve 占全部结论轮的 18%，#683 与 #695 各浪费四五轮，
          # 每轮都在重复确认同一个结论。这些轮次不自动跑，作者要复评回一句 /review 即可
          # ——上一轮 approve 的正文里就写着这句。
          #
          # 例外：新提交碰了高危面照跑。这几类是「改一行毁一个环境」的地方，而 main 的
          # ruleset 是 dismiss_stale_reviews_on_push: false——approve 不会因为推送而失效，
          # 所以这里跳过就等于门也不拦、人也不看。
          #
          # CHANGES_REQUESTED 之后不受影响：那时作者在修问题，正是最该盯的阶段。
          RISKY = ("migrations/", "/helm/", "bkn-safe/")
          risky = [p_ for p_ in paths
                   if any(m in p_ for m in RISKY) or p_.endswith("values.yaml")]
          # 文件清单被 FILE_CAP 截断时不跳过：截掉的那部分里可能正有 migrations
          # 或 helm 改动，按「未触及高危面」放过就是拿看不见的东西赌。
          truncated = total > len(paths)
          # `not carried` 是兜底：approve 轮本就不该留下遗留项，真留下了说明状态块与
          # 表态不一致，此时跳过等于把它永久藏起来。
          skip = (os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
                  and states and states[-1] == "APPROVED"
                  and not risky and not truncated and not carried)
          # 这个块的 stdout 整个重定向进 $GITHUB_OUTPUT，任何不含 = 的行都会让 runner
          # 以 Invalid format 报错、plan 步骤失败——所以 ::notice:: 不能从这里打，
          # 落成文件由下面的 shell 发出。
          if skip:
              pathlib.Path("skip-notice.txt").write_text(
                  "PR #%s 上一轮已放行，且本次改动未触及高危面，跳过自动复评。"
                  "需要复评请回复 /review。" % pr, encoding="utf-8")
          print("skip_round=%s" % ("true" if skip else "false"))
          print("file_total=%d" % total)
          print("file_listed=%d" % len(paths))
          PY
          # 跳过提示在这里发：上面的 stdout 是 $GITHUB_OUTPUT，发不了 workflow command。
          if [ -f skip-notice.txt ]; then
            echo "::notice::$(cat skip-notice.txt)"
          fi

      # 跳过这一轮时 verdict 不跑，进度评论的清理也就不跑——上一轮被 concurrency 取消
      # 后残留的那条会永久停在「评审进行中」，与它自己写的「结论落地后这条会自动消失」
      # 直接矛盾。所以跳过路径也要清一次。
      - name: Remove stale progress comment when skipping
        if: steps.plan.outputs.skip_round == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          MARKER='<!-- claude-review-progress -->'
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | .[]" \
          | while read -r id; do
              gh api -X DELETE "repos/${GH_REPO}/issues/comments/${id}" >/dev/null
            done

      # 同一条评论反复复用（靠 body 里的 HTML 标记定位），复评不会越堆越多。
      # 失败不阻断评审：进度提示挂了没关系，评审本身要继续。
      - name: Post progress comment
        if: steps.plan.outputs.has_shards == 'true' && steps.plan.outputs.skip_round != 'true'
        continue-on-error: true
        env:
          SHARDS: ${{ steps.plan.outputs.shards }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 转圈图标。自己存在仓里而不是复用 claude-code-action 那个 user-attachment：
          # 那是别人项目的资产，删掉就成裂图。本仓是 public，raw 链接可被 GitHub 的
          # 图片代理取到；私有仓则不行，届时要换成上传到 user-attachments。
          # 分支取默认分支而不是写死 main：改名或迁移资产后这里会静默变成裂图，
          # workflow 侧看不出任何异常，只有渲染出来的评论里才看得见。
          SPINNER: ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.event.repository.default_branch || 'main' }}/.github/assets/review-spinner.gif
        run: |
          set -euo pipefail
          MARKER='<!-- claude-review-progress -->'
          body=$(python3 - <<'PY'
          import json, os
          shards = json.loads(os.environ["SHARDS"])
          lines = ["<!-- claude-review-progress -->",
                   '### <img src="%s" width="16" height="16" /> 评审进行中'
                   % os.environ["SPINNER"],
                   "",
                   "评审完成后统一给出一次结论。",
                   ""]
          # 复选框由各分片跑完后回来打勾（review job 的 Tick progress 步骤）。
          lines += ["- [ ] `%s`" % s["label"] for s in shards]
          lines += ["", "[查看运行日志](%s)" % os.environ["RUN_URL"],
                    "", "_结论落地后这条会自动消失。_"]
          print("\n".join(lines))
          PY
          )
          existing=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | last // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

  review:
    needs: plan
    if: needs.plan.outputs.has_shards == 'true' && needs.plan.outputs.skip_round != 'true'
    name: review (${{ matrix.shard.label }})
    runs-on: ubuntu-latest
    # agent 卡住时不能让 job 一路跑到 runner 的 6 小时上限：verdict 在 needs 上等着，
    # 一片挂死会把整轮评审的结论一起拖到没人再看的时候。
    timeout-minutes: 30
    strategy:
      # 一片撞上限或失败，其余片必须照跑完——分片的意义就在于故障隔离。
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
      SHARD_KEY: ${{ matrix.shard.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # pull_request 事件下 checkout 会自动落到 PR 的 merge ref；其它事件
          # （手动触发、评论、行内回复）只会拿到默认分支，需要下一步显式切到
          # PR 分支，因此这里放开深度以便 gh pr checkout 能建立分支。
          # 快照类文件要 `git show` 取前一版比对，也需要历史。
          fetch-depth: 0

      # PR 可能在本轮跑到一半时被合并，分支随即删除，gh pr checkout 会以
      # `couldn't find remote ref` 硬失败（#670 实测：review 片 03:48 切分支成功，
      # verify 03:56 起跑时分支已没了）。此时该跳过而不是留个红叉——PR 都合了，
      # 评审结论已无处可用。exit 0 之后必须把后续步骤一起 gate 掉，否则会拿默认
      # 分支的工作树当 PR 内容评审。
      - name: Checkout PR branch (non-PR events)
        id: prbranch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "::warning::PR #$PR_NUMBER 已是 $state（本轮跑到一半被合并或关闭），跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr checkout "$PR_NUMBER"
          echo "已切到 PR #$PR_NUMBER: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

      - name: Prepare findings dir
        run: mkdir -p findings

      # 上一轮的 inline 评论由 shell 预取成文件，分片不再需要 `Bash(gh api:*)`——那是
      # 全方法通配，模型可以直接 POST /pulls/N/reviews 落一条评审状态，绕过「表态只能
      # 有一次」这条不变量（该不变量此前只靠 prompt 约束，不是权限上做不到）。
      # 顺带省轮次：一次 shell 调用替掉模型自己发的一轮工具调用。
      - name: Prefetch prior review comments
        if: steps.prbranch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 两个来源都要取：/issues/N/comments 是顶层评论、/pulls/N/comments 是 inline
          # 评论及其回复。作者的处理说明（哪条采纳、哪条不采纳）多半发在顶层，只取
          # inline 等于没在听——#619 第九轮就是这么把作者「本轮不采纳」的表态漏掉的。
          #
          # --paginate 是逐页应用 --jq 的，评论超过一页时输出会是多个 JSON 数组首尾
          # 相接、不是一个合法数组。所以先取原始页，再用 jq -s 合并成一个数组。
          # 各留最近 100 条：这里取的是全部历史轮次，攒多了会挤占分片的上下文，
          # 而复评真正要看的是最近几轮。
          fetch() {
            gh api "repos/${GH_REPO}/$1" --paginate | jq -s "[.[][] | $2] | .[-100:]"
          }
          # `fetch ... || echo '[]'` 不是干净的兜底：gh --paginate 取到第二页才失败时，
          # 前面的页已经被 jq 输出，再追加一个 `[]` 得到的是解析不了的 JSON——下游拿到
          # 这种文件会当成「没有可读的评论」，作者写过的「不采纳」就此读不到。
          # 先落临时文件，整条流水线成功了才拼进去。
          emit() {
            if fetch "$1" "$2" > "${RUNNER_TEMP:-/tmp}/fetch.json"; then
              cat "${RUNNER_TEMP:-/tmp}/fetch.json"
            else
              echo '[]'
            fi
          }
          {
            echo '{"issue_comments":'
            emit "issues/${PR_NUMBER}/comments" \
              '{user: .user.login, created_at, body}'
            echo ',"review_comments":'
            emit "pulls/${PR_NUMBER}/comments" \
              '{path, line, user: .user.login, created_at, body}'
            # 上一轮的结论正文在 /pulls/N/reviews，与 inline 评论是两个端点。待确认项
            # 只存在于正文里，不取就等于每轮从零开始——实测 #683 连续三轮各报十条互不
            # 重叠的待确认项，正是因为看不见自己上一轮说过什么。
            echo ',"prior_verdicts":'
            emit "pulls/${PR_NUMBER}/reviews" \
              '{user: .user.login, state, submitted_at, body}'
            echo '}'
          } > prior-comments.json || echo '{"issue_comments":[],"review_comments":[],"prior_verdicts":[]}' \
            > prior-comments.json

      - name: Claude review
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && steps.prbranch.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 分片模式下关掉 track_progress：每片各贴一条进度评论会把 PR 刷满，
          # 而最终只有 verdict 那一条结论有意义。
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            对这个 PR 做一次代码评审。整轮只有你一个评审者，PR 的全部改动都归你。

            产出文件：${{ github.workspace }}/findings/${{ matrix.shard.key }}.json

            仓库是 openbkn 单体仓，包含 Go / Python 微服务、Helm chart 与部署脚本。
            协作规范见 rules/CONTRIBUTING.zh.md。

            ## 范围

            你负责这个 PR 的**全部**改动，下面是需要出结论的文件：

            ${{ matrix.shard.files }}

            ${{ matrix.shard.files_shallow != '' && '下面这些测试文件**浅审**：只看它们是否验证了真实行为、有没有把断言写成永真。不追引用点、不做触发式深挖——测试的调用方就是它自己。' || '' }}

            ${{ matrix.shard.files_shallow }}

            **责任范围不等于可读范围。** 上面的清单圈定「你要为哪些文件出结论」，
            核查时可以读全仓任意文件——改动在一处、调用方在另一个模块，是本仓最贵的
            一类缺陷。

            ## 轮次预算（先读这一节）

            这个任务有轮次上限。撞上限意味着整轮零产出，比漏掉一条意见糟得多。因此：

            - 互不依赖的 Read / Grep / Glob / git 调用放在同一条消息里并发发出，不要
              一轮发一条。逐条串行是耗尽轮次的首要原因。
            - 用掉大约三分之二轮次时停止深挖，用已经核实的内容收敛出结论。
            - 最后一步必须写出 `${{ github.workspace }}/findings/${{ matrix.shard.key }}.json`
              （**必须用这个绝对路径**，工具不接受相对路径）。宁可给一份范围有限、在
              not_covered 里写明未覆盖面的结论，也不要什么都不产出。

            ## 关注面（按优先级）

            1. **正确性** — 逻辑错误、边界条件、错误处理缺失、并发/竞态、资源泄漏
               （未关闭的连接、goroutine 泄漏）。
            2. **安全** — 凭据硬编码、鉴权/授权绕过、注入、越权访问内部接口、日志泄露
               敏感信息。
            3. **兼容性** — 数据库迁移是否幂等、接口是否破坏既有调用方、Helm values
               变更是否会让存量环境升级失败。这是本仓的高频事故来源。
            4. **测试** — 新增逻辑是否有覆盖，测试是否验证了真实行为。

            这是**优先级**，不是清单。三行改动不需要逐条走一遍——只看这次改动实际
            能触到的那几条。兼容性只在碰了迁移、接口、Helm values 时才成立；测试只在
            新增了逻辑时才成立。

            ## 审到哪里为止

            **只审这次改动引入或改变的行为。** 既有代码里的问题不归这个 PR 负责——
            除非这次改动让它变得可达、更频繁、或后果更严重；那种情况要在意见里说清
            「是这次改动使它成为问题」，否则不提。

            **走出 diff 只为回答一个问题：这次改动有没有破坏别处的假设。** 不是为了
            通读子系统，也不是为了对这块代码形成完整认识。问题答完就回来。

            具体到动作：改动的函数、接口、字段**语义变了**才 `git grep` 追引用点；
            纯内部实现改写、签名与语义都没变的，不追。跨服务调用只在这次改动可能影响
            另一侧时才去读那一侧。

            **不要为了展示覆盖面而写「我还核了 X，没问题」。** 没问题就不写。

            审得多不等于审得好。一份把三行改动铺成子系统巡检的意见，作者读完不知道
            该改什么。

            ## 触发式深挖（diff 命中才做，没命中直接跳过；命中了也只查命中的那一类）

            这几类改动只读 diff 必然看不出问题（本仓已因「只读 diff」连续三轮漏过一个
            阻断项），命中时必须走出 diff 核源码：

            - **整份快照类文件**（migrations/*/init.sql、lock 文件、生成物）：
              `git show <ref>:<上一版本同名文件>` 取前一版逐行比对，确认差异只有本次
              应有的那几处。全量快照最容易夹带丢列、改名、复活废弃列，而这些在 diff 里
              全是 `+`，读不出来。
            - **字段 / 参数的改名或删除**：定义其语义的文件通常不在 diff 里。`git grep`
              旧名确认无残留，并读配置与校验定义（例如连接器 field_config 中某项是否
              `Required: false`），确认新逻辑没把原本合法的取值判成非法。
            - **被删掉的代码**：先问它在维护什么不变量。删掉一个分支等于不再保证那个
              不变量，必须确认对应的输入形态确实已经不存在，而不是「当前主路径不会
              产生」——存量数据仍会产生。
            - **migrations/ 改动**：分别核全新安装（只执行最大版本目录的 init.sql）与
              存量升级（只按序执行 NN-*.sql 并跳过 init.sql，见 data-migrator/server/
              migrate/script_selector.py）。两条路径最终 schema 必须一致，且都要与代码
              实际引用的列对齐——把相关 f_ 列名 `git grep` 到 drivenadapters 层核对。

            ## 复评（作者推了新提交）

            目标是收敛，不是每轮重开一次全面评审：

            - 先读回上一轮的评论：已经预取到 `${{ github.workspace }}/prior-comments.json`（绝对
              路径），直接读文件，不要自己去调 API。里面两个来源都有：`issue_comments`
              是顶层评论——作者的处理说明（哪条采纳、哪条不采纳）多半发在这里，
              `review_comments` 是 inline 评论及其回复，`prior_verdicts` 是此前每一轮
              的结论正文——**待确认项只出现在那里**，不读就会把上一轮说过的话换个说法
              再说一遍。三个来源全看。
            - **作者明确表示不采纳的建议，记一次就够，本轮不要再列**——包括写进
              unconfirmed。他已经做过判断，再列一遍只是在告诉他你没读他的回复。只有
              出现新证据推翻他的理由时才重提，并在 what 里说清新证据是什么。
            - **待确认项必须收敛。** 只要 `prior_verdicts` 非空（即此前已有过结论），
              这一轮的 unconfirmed **至多 1 条，且只能是本轮新增提交引入的问题**。
              此前任何一轮结论正文里出现过的，无论作者有没有处理，都不再提。
              「换个角度再说一遍同一个文件」也算重提。
              评审的目标是让 PR 能走，不是每轮都证明自己还能找出东西——一份挑不完
              毛病的清单，作者第三轮就不看了。
            - 已经提过的问题，作者改了、或给出对得上疑点的解释，就算过。不必追求措辞
              完美，更不要凭「可能」把同一条追问第二遍。
            - 上面的触发式深挖只在首轮做；复评的范围限定在上一轮之后新增的提交与文件。
            - 第二轮起，除非发现你能说清失效场景的确定阻断项，否则不要再报阻塞项。
            - **上一轮报过、作者还没修的阻塞项不用你再列一遍**：它们由复核环节按编号
              逐轮跟踪——改没改、作者认不认，那边判，判完照样进结论、照样阻断。你重列
              一次只会让同一条问题在正文里出现两遍（拼装脚本按 file:line 去重，重复的
              那条会被直接丢掉，等于白花轮次）。
            - **写 findings 之前，最后再拉一次顶层评论**，逐字发这一条：
              `gh pr view ${{ env.PR_NUMBER }} --json comments --jq '[.comments[-30:][] | {author: .author.login, body}]'`
              PR 号已在 YAML 层插成字面量：allowedTools 是前缀白名单，命令里出现
              `$PR_NUMBER` 这类展开会被权限层以 `Contains simple_expansion` 拒掉，
              整条规则跑不起来。`--jq` 同样别省——不投影的话每条评论返回十几个字段
              且是全部历史，而这一步正发生在轮次与上下文最紧的收尾时刻。
              为什么要重拉：`prior-comments.json` 是本 job 开头预取的，而评审要跑好
              几分钟；作者常在这段时间里推完提交紧接着发一条处理说明——哪条采纳了、
              哪条不采纳、为什么。只读预取文件就会把他刚说过的话原样再问一遍。#619
              第九轮实测：作者在推送后 14 秒发说明「appSetting 死字段本轮不采纳」，
              那轮结论仍把这条原样列了出来。新读到的按上面两条规则处理：已解释的
              算过，明确不采纳的从 unconfirmed 里去掉。

            ## 产出

            两件事，缺一不可：

            **一律用中文**写 inline comment 与 findings JSON 里的所有文字。代码标识符、
            错误信息、命令、路径保持原样，不翻译。

            **inline comment 的配额**：此前已有 ${{ needs.plan.outputs.prior_rounds }}
            轮结论。为 0 时最多贴 3 条；不为 0 时最多 1 条，且只针对本轮新增提交。
            每条 inline 都是一次通知和一个要人去关掉的会话，堆在 Files 视图里不会自己
            消失——实测出现过 31 个文件的 PR 一轮贴 15 条、1 个文件的 PR 贴 5 条。
            同一个问题**不要既贴 inline 又写进 unconfirmed**：位置明确、作者照着改就行
            的贴 inline；需要他判断的写 unconfirmed。

            **一、先写 `${{ github.workspace }}/findings/${{ matrix.shard.key }}.json`**
            （绝对路径）。**这一步排在最前面是有意的**：它是唯一会进入最终结论的
            产出，inline comment 不进。实测出过贴完 inline 就收尾、没写这个文件的情况，
            结果是整轮评审在 PR 上零反馈——比漏一条意见糟得多。所以：先落文件，
            后贴 inline；结论有更新就重写一遍文件。严格用下面的结构：

            ```json
            {
              "shard": "${{ matrix.shard.label }}",
              "status": "completed",
              "summary": "整体判断，最多两句",
              "impact": "这次改动可能波及什么，一句话；没什么可说就填空串",
              "blockers": [
                {"file": "adp/bkn/x.go", "line": 42, "what": "问题是什么",
                 "scenario": "什么输入、什么状态、坏成什么样",
                 "evidence": ["comm-go/x/y.go:88-95 这几行里读到的、支撑这条结论的事实"]}
              ],
              "unconfirmed": [{"file": "...", "what": "待确认项，一到两句，不阻断放行"}],
              "not_covered": "本轮没核到的面，一句话；全核到了就填空串"
            }
            ```

            **blockers 的门槛**：你已经读过源码核实，能说清具体的失效场景，并且自评
            把握 ≥ 90 分。说不清、或失效场景里有任何一环没在代码里核实过，都不算阻塞
            项——降级进 unconfirmed，或者直接丢掉。

            ## 怎么写一条意见

            固定形状，两句话：**哪里坏了** + **什么情况下坏**。位置放 `file`/`line`，
            证据放 `evidence`，都不要写进正文。

            > `factory.go:179` 删除分支后 map 项不再清理。连接器被删又同名注册时会命中
            > 旧实例，直到进程重启。

            不要写的东西，一条都不要：

            - 铺垫与转折（「值得注意的是」「这不是假设」「问题出在另一半」）
            - 你的推理过程、排除了哪些可能、这条有多难查
            - 复述 PR 描述或 diff 内容
            - 自评可信度的旁白（门槛不到就不该提，提了就别再解释自己多确信）
            - 与行为无关的事：格式、命名、结尾换行、注释措辞、文件放在哪一层
            - 在 not_covered 里论证「这个面在本 PR 上不适用所以不算漏审」——
              没这个面就填空串

            读的人是在改代码的间隙看这条，不是在读你的工作报告。

            ## 范围

            **作者划的范围就是本轮范围。** 评论里写了「只看这个提交」「这轮只改了 X」，
            就照办，不要因为顺手看见别处可疑而扩进来——那属于下一轮，或者作者自己会问。

            **但覆盖不能缩。** 责任清单里的每个文件都要过一遍。下面的条数与长度上限
            **只作用于你写出来多少，不作用于你审了多少**：审满，然后挑最值得说的写。
            清单太长跑不完，就在 not_covered 里写明「X 之后未覆盖」，不要默默略过——
            漏审而不说，比漏审本身糟。

            **正文长度是有代价的。** 你的输出会原样成为那条评审结论，作者要一次读完；
            一份没人读完的评审等于没评。所以：

            - `summary` 最多两句；`impact` 一句，说「可能坏成什么样」而不是列举清单，
              没有实质影响就填空串；`not_covered` 一句，全核到了就填空串。
            - `unconfirmed` **最多 2 条**，每条一到两句，只给结论和位置，不复述推理过程。
              超过 3 条说明你在凑数——留下最值得作者看的那几条。
            - 上一轮已经提过、这一轮没有新证据的，**不要再列一遍做状态标注**。作者已经
              看过了，重复列出只会让每一轮的结论比上一轮更长。
            - 与行为无关的意见一律不提：格式、命名、结尾换行、注释措辞、文件放在哪一层。
              这些既不阻断也不值得作者花时间读。

            `evidence` 必填且必须是你**这一轮真读过的** file:line。写不出具体位置，
            说明这条是从 diff 表面推出来的，不是核实出来的——那它就不是阻塞项。
            复核环节会照着 evidence 去原地验，编造的位置一验就穿。

            **二、inline comment 只贴改进建议与待确认项**（贴到对应行，说明「问题是什么
            + 怎么改」），**不要贴阻塞项**。阻塞项一律只进上面的 JSON，经独立的 verify
            环节复核后才会出现在 PR 上——本仓的评审历史上出现过一批高危项事后核实几乎
            全是误报，未经复核就贴到行上，作者要为假问题付出真时间。不复述 diff，不为
            凑数提格式化/命名类琐碎意见。

            **你不要调用 `gh pr review`。** 表态由 verdict 环节根据复核结果统一落一次——
            阻塞项要先过独立复核才算数，你自己表态会绕开它。你的 JSON 就是你的表态。

            不要把 CI 当放行条件。CI 全绿是 Branch Protection 的独立闸门，合并时自然会
            拦住，评审只判代码本身。

          # 只给 gh pr diff 不够：Claude 需要进文件看上下文、比对具体 commit，会伸手
          # Read/Grep/git diff 等未授权工具而被拒。之前一次评审因此连撞 12 次 permission
          # denial、耗尽轮次、评论冻在「进行中」。补齐只读检视工具（Read/Grep/Glob/LS +
          # git diff/log/show）与 PR view/checks/api。
          #
          # Write 是分片模式新加的，用来落 findings JSON；分片不给 `gh pr review`——
          # 表态权限收在 verdict 一处。
          #
          # 轮次上限 80：#662 曾在 60 触顶零产出。分片后单片实际轮数远低于此，这个值
          # 是余量而非目标，跑不满不计费。
          # 只有一个 agent，没必要在 effort 上省——它要独自承担整轮判断。轮次上限从 80
          # 抬到 200：这是当初逼出分片的那个约束，放开它才是单 agent 方案成立的前提。
          # 旧注释保留如下：effort 与轮次按片分档；contract 片要在全仓比对多处声明，
          # 保持 xhigh；模块片做的是「读 diff 找问题」，high 足够，而 xhigh 每轮多生成的
          # 思考 token 是实打实的成本。低风险片只做一致性核对，25 轮绰绰有余。
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --max-turns 200
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,LS,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*)"

      # if: always()——分片撞上限时 action 以失败退出，但它此前可能已经写了 JSON；
      # 更重要的是没写也要让 verdict 知道这片跑挂了（靠 artifact 缺失判定）。
      # 分片跑完却没写 findings 的情况实测发生过（#671 首轮三片全没写，整轮零反馈）。
      # 补一个占位，让 verdict 能把「跑了但没落结论」与「job 整个挂掉」区分开，也保证
      # 至少有一个 artifact 存在。
      - name: Backfill missing findings
        if: always() && steps.prbranch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # 不依赖 Prepare findings dir：那步是隐式 success()，前面任一步失败就会被跳过，
          # 而本步是 always()——目录不存在时重定向会直接失败，安全网反而变成第二处报错。
          mkdir -p findings
          f="findings/${SHARD_KEY}.json"
          if [ ! -s "$f" ]; then
            echo "::warning::分片 ${SHARD_KEY} 未写出 findings，回填占位。"
            printf '{"shard":"%s","status":"no_output","summary":"","impact":"","blockers":[],"unconfirmed":[],"not_covered":"本片跑完但没落下结论，这些文件未经评审。"}\n' \
              "${SHARD_KEY}" > "$f"
          fi

      # 每片跑完回来把自己那行打勾，让那条唯一的进度评论真的动起来。
      # 粒度是「每片一次」，不是 track_progress 那种每步一更——后者在分片下会变成
      # N 条评论各自转圈，把 PR 刷满。
      # 并发写同一条评论：两片几乎同时结束时可能丢一次更新，纯显示问题，重试三次即可。
      # continue-on-error：进度显示挂了不该影响评审产出。
      - name: Tick progress
        if: always() && steps.prbranch.outputs.skip != 'true'
        continue-on-error: true
        env:
          # 这两个必须显式给：本文件没有 workflow 级 env，review job 的 env 里也没有，
          # 只有 Prefetch 那步自带。缺了会在本步第一条语句就 KeyError，而
          # continue-on-error 把它咽成绿色——本地手测时它们来自开发者自己的 shell，
          # 这类缺失测不出来。
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHARD_LABEL: ${{ matrix.shard.label }}
          SHARD_KEY: ${{ matrix.shard.key }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time

          MARKER = "<!-- claude-review-progress -->"
          repo, pr = os.environ["GH_REPO"], os.environ["PR_NUMBER"]
          label = os.environ["SHARD_LABEL"]

          # 判据取 findings 文件本身，不取 job.status。`Claude review` 那步在缺凭据时是
          # **被跳过**的，跳过不影响 job 绿——用 job.status 会让一次没人审过的运行把每
          # 一片都打上勾，正是这一步要防的事。回填保证了文件必然存在。
          try:
              data = json.loads(
                  (pathlib.Path("findings") / (os.environ["SHARD_KEY"] + ".json"))
                  .read_text(encoding="utf-8"))
              reviewed = isinstance(data, dict) and data.get("status") != "no_output"
          except Exception:
              reviewed = False

          done = "- [x] `%s`" % label
          if not reviewed:
              done += " —— 未产出结论，本片文件未经评审"
          todo = "- [ ] `%s`" % label

          def gh(*args):
              return subprocess.run(["gh", "api", *args], capture_output=True,
                                    text=True, check=True).stdout

          for attempt in range(3):
              try:
                  # `--paginate` 不带 `--jq` 会把每页各输出一个数组、首尾相接，不是合法
                  # JSON（本文件在预取那处已经踩过并记下了这个坑）。`--jq '.[]'` 逐页
                  # 展开成一行一个对象，跨页拼接后仍可逐行解析。
                  raw = gh("repos/%s/issues/%s/comments" % (repo, pr),
                           "--paginate", "--jq", ".[]")
                  comments = [json.loads(l) for l in raw.splitlines() if l.strip()]
                  target = next((c for c in reversed(comments)
                                 if MARKER in (c.get("body") or "")), None)
                  if target is None:
                      break
                  body = target["body"]
                  if todo not in body:
                      break
                  gh("-X", "PATCH", "repos/%s/issues/comments/%s" % (repo, target["id"]),
                     "-f", "body=" + body.replace(todo, done, 1))
                  break
              except (subprocess.CalledProcessError, ValueError):
                  if attempt == 2:
                      raise
                  time.sleep(2)
          PY

      # 逐轮的工具调用在 Actions 日志里看不到（track_progress: false 不流式输出），
      # 于是「轮数花在哪」只能靠猜，后续调优也就没有依据。这里把 action 写的完整执行
      # 记录留成 artifact，离线就能统计每轮在 Read / Grep / Bash / 思考上的分布。
      - name: Upload transcript
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p transcript
          f="${RUNNER_TEMP}/claude-execution-output.json"
          [ -f "$f" ] && cp "$f" "transcript/${SHARD_KEY}.json" || true

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.shard.key }}
          path: findings/
          if-no-files-found: ignore
          retention-days: 7

      - name: Store transcript artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.shard.key }}
          path: transcript/
          if-no-files-found: ignore
          retention-days: 7

      - name: Warn when credential missing
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "::warning::Secret CLAUDE_CODE_OAUTH_TOKEN not set — skipping Claude review."

  # 阻塞项在进 PR 之前先过一道独立复核。
  #
  # 起因：本仓评审历史上出现过一批标成高危的项，事后逐条核源码几乎全是误报。误报的
  # 代价不对称——放过一个待确认项，作者自己会看到；报一个假阻塞项，PR 被 CHANGES_REQUESTED
  # 挂住，作者要花真时间去证伪一个不存在的问题，几次之后就没人再信这个评审了。
  #
  # 让发现者自评把握（分片 prompt 里的 ≥ 90 分）挡不住这个：同一段上下文里，模型对自己
  # 刚推出来的结论天然高估。所以复核必须换一份干净上下文重来一遍，且**默认立场是驳回**——
  # 拿不出「读了哪个文件哪几行、看到了什么」就判 refuted，不给「看起来像有问题」留出口。
  #
  # job 本身总会起（checkout + 下载 artifact，秒级），但只有真存在阻塞项时才调模型。
  # 多数 PR 没有阻塞项，模型这一步直接跳过，额度开销为零。
  verify:
    timeout-minutes: 20
    needs: [plan, review]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_shards == 'true' && needs.plan.outputs.skip_round != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
      CARRIED: ${{ needs.plan.outputs.carried }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR 可能在本轮跑到一半时被合并，分支随即删除，gh pr checkout 会以
      # `couldn't find remote ref` 硬失败（#670 实测：review 片 03:48 切分支成功，
      # verify 03:56 起跑时分支已没了）。此时该跳过而不是留个红叉——PR 都合了，
      # 评审结论已无处可用。exit 0 之后必须把后续步骤一起 gate 掉，否则会拿默认
      # 分支的工作树当 PR 内容评审。
      - name: Checkout PR branch (non-PR events)
        id: prbranch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "::warning::PR #$PR_NUMBER 已是 $state（本轮跑到一半被合并或关闭），跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr checkout "$PR_NUMBER"

      # 全部分片都没产出时一个 artifact 都不存在。download-artifact 在这种情况下是否
      # 静默通过没有保证，硬失败会把 verify 和 verdict 一起带走——那正是要消掉的
      # 「跑挂了 PR 上什么都没有」。下游按「文件缺失 = 该片未覆盖」处理，容得下空目录。
      - name: Download findings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true

      # id 用 `<分片 key>#<该片内序号>` 生成，verdict 会按同样规则重算一遍去对齐结论。
      # 不用全局自增序号：分片是并行的，artifact 下载顺序不保证稳定。
      - name: Collect blockers
        id: collect
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib

          items = []
          for path in sorted(pathlib.Path("findings").glob("*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (ValueError, OSError):
                  continue
              key = path.stem
              for i, b in enumerate(data.get("blockers") or []):
                  # 过滤规则与 verdict 的拼装脚本严格一致，序号同样取自 enumerate。
                  if not isinstance(b, dict):
                      continue
                  items.append({
                      "id": "%s#%d" % (key, i),
                      "carried": False,
                      "shard": data.get("shard", key),
                      "file": b.get("file", ""),
                      "line": b.get("line"),
                      "what": b.get("what", ""),
                      "scenario": b.get("scenario", ""),
                      "evidence": b.get("evidence") or [],
                  })

          # 上一轮遗留、作者还没关掉的阻塞项也进来复核，问题换成「现在还成立吗」。
          # 它们不在本轮 findings 里（复评 prompt 明令不许重列已提过的问题），由 plan
          # 从上一轮结论正文的状态块里读回来。id 走 carry# 命名空间，与分片的
          # `<key>#<序号>` 不会撞；verdict 用**逐字相同**的顺序与跳过规则重算一遍
          # ——id 是复核结论的唯一对齐依据，两端错位会把结论贴到别的项上。
          try:
              carried = json.loads(os.environ.get("CARRIED") or "[]")
          except ValueError:
              carried = []
          if not isinstance(carried, list):
              carried = []
          for i, c in enumerate(carried):
              if not isinstance(c, dict):
                  continue
              items.append({
                  "id": "carry#%d" % i,
                  "carried": True,
                  "verified": bool(c.get("verified")),
                  "shard": c.get("shard", ""),
                  "file": c.get("file", ""),
                  "line": c.get("line"),
                  "what": c.get("what", ""),
                  "scenario": c.get("scenario", ""),
                  "evidence": c.get("evidence") or [],
              })

          pathlib.Path("blockers.json").write_text(
              json.dumps(items, ensure_ascii=False, indent=2), encoding="utf-8")
          print("count=%d" % len(items))
          print("carried=%d" % sum(1 for x in items if x["carried"]))
          PY

      # 遗留项的第二条撤销通道：作者在评论里讲清为什么不采纳。复核环节必须读得到这些话，
      # 否则「模型不认作者的理由」就成了死锁——PR 会被一条它自己认定的问题永久挂住。
      # 与分片一样由 shell 预取：verify 的 allowedTools 里没有 `gh api`（全方法通配能
      # POST /pulls/N/reviews，破坏「表态只能有一次」）。
      - name: Prefetch author replies
        if: steps.collect.outputs.carried != '0' && steps.prbranch.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --paginate 逐页应用 --jq，多页时输出不是合法数组；先取原始页再 jq -s 合并。
          fetch() {
            gh api "repos/${GH_REPO}/$1" --paginate | jq -s "[.[][] | $2] | .[-100:]"
          }
          # `fetch ... || echo '[]'` 不是干净的兜底：gh --paginate 取到第二页才失败时，
          # 前面的页已经被 jq 输出，再追加一个 `[]` 得到的是解析不了的 JSON——下游拿到
          # 这种文件会当成「没有可读的评论」，作者写过的「不采纳」就此读不到。
          # 先落临时文件，整条流水线成功了才拼进去。
          emit() {
            if fetch "$1" "$2" > "${RUNNER_TEMP:-/tmp}/fetch.json"; then
              cat "${RUNNER_TEMP:-/tmp}/fetch.json"
            else
              echo '[]'
            fi
          }
          {
            echo '{"issue_comments":'
            emit "issues/${PR_NUMBER}/comments" \
              '{user: .user.login, created_at, body}'
            echo ',"review_comments":'
            emit "pulls/${PR_NUMBER}/comments" \
              '{path, line, user: .user.login, created_at, body}'
            echo '}'
          } > author-replies.json || echo '{"issue_comments":[],"review_comments":[]}' \
            > author-replies.json

      - name: Verify blockers
        if: steps.collect.outputs.count != '0' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
          && steps.prbranch.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            待复核的**阻塞项**全部列在
            `${{ github.workspace }}/blockers.json`（**必须用这个绝对路径读**，工具不接受相对路径）。
            里面有两类，靠 `carried` 字段区分：`false` 是本轮新报的，你的工作是逐条
            **尝试驳回**，只让站得住的那些进 PR；`true` 是上一轮遗留、至今没关掉的，
            判据完全相反，见下面单独一节。

            你不是在复述别人的结论，也不是在补充新问题。发现新问题不归你管，写进
            notes 即可，不要加进 verdicts。

            ## 立场

            **默认驳回。** 每一条的默认判定是 `refuted: true`，只有你自己动手把失效
            场景在源码里走通了，才翻成 `refuted: false`。

            报告方给了 `evidence`（它声称读过的 file:line）。照着去原地读，然后问：

            - 那几行真的写着它说的东西吗？位置对不上、内容对不上，直接驳回。
            - 就算内容对得上，从这几行能推出它描述的失效场景吗？中间缺一环就驳回。
            - 触发这个场景需要的输入/状态，在真实调用路径上到得了吗？到不了就驳回：
              「理论上可以构造出来」不算。
            - 有没有它没看到的上游校验、默认值、早退分支，已经把这个场景挡掉了？
              `git grep` 调用方确认。挡掉了就驳回。

            拿不准就驳回。放过一个真问题，作者和后续的 CI 还有机会拦；放行一个假问题，
            PR 被挂住、作者花时间证伪一个不存在的东西，几次之后没人再信这个评审。

            ## `carried: true` 的那几条：立场相反

            id 形如 `carry#N` 的，是**上一轮就报过、已经过了一次复核、作者至今没关掉**的
            阻塞项。它们不是新结论，不需要再证一遍——**默认 `refuted: false`（仍然成立）**，
            只有下面两种情况才翻成 `refuted: true`：

            1. **已经修了。** 去当前工作树读那个位置：代码改了，或者失效场景里的某一环
               现在被挡掉了。`reason` 写清你读的 file:line 和它现在长什么样。
            2. **作者明确不采纳并给了理由。** `${{ github.workspace }}/author-replies.json`
               里是本 PR 的顶层评论与 inline 回复（文件不存在就是没有可读的回复）。作者
               说了「这条不改」「设计如此」「不在本 PR 范围」之类且给出了对得上的理由，
               就判 `refuted: true`，`reason` 里引用他的原话。**你不认同他的理由也照判**
               ——采纳与否是作者的决定，不是你的。只有他压根没回应过这一条时才继续保留。

            找不到证据说明它被修了、作者也没回应过，就保持 `refuted: false`。这里的默认
            方向与上面新报的阻塞项**正好相反**，别套错：新报的默认不成立，遗留的默认成立。

            **例外：`carried: true` 但 `verified: false` 的，按新报的规则办**（默认
            `refuted: true`，核实通过才保留）。这类条目是上一轮复核环节整个挂掉时带过来的，
            从没有人验过它——立场反过来等于把一条没验过的结论提拔成默认阻断。

            ## 轮次预算

            互不依赖的 Read / Grep / git 调用放在同一条消息里并发发出。每条阻塞项分到
            的预算有限，先照 evidence 直接定位，别从头通读整个模块。

            最后一步必须写出 `${{ github.workspace }}/verified.json`（绝对路径）。没写就等于整个复核
            环节失效，所有阻塞项会以「未复核」的身份进 PR。

            ## 产出

            写 `${{ github.workspace }}/verified.json`，`verdicts` 必须覆盖 `blockers.json`
            里的每一个 id：

            ```json
            {
              "verdicts": [
                {"id": "adp-bkn#0", "refuted": true,
                 "reason": "驳回或确认的理由，指明你读了哪个文件的哪几行"}
              ],
              "notes": "复核过程中顺带发现的、但不属于本次阻塞项的事情，可以为空串"
            }
            ```

            `reason` 里必须出现你**这一轮真读过的** file:line。这是复核结论本身的
            evidence，写不出来的结论和它要驳回的东西是同一种毛病。

            `reason` **一律用中文**。它会原样进 verdict 正文，与骨架和评审给的文字
            并排显示，语言不一致会读成两份东西。
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --max-turns 80
            --allowedTools "Read,Grep,Glob,LS,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*)"

      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            blockers.json
            verified.json
          if-no-files-found: ignore
          retention-days: 7

  verdict:
    # always()：任一分片撞上限、超时或崩掉，都要照样表态并写明哪片没覆盖。
    # 「跑挂了 PR 上什么都没有」正是分片要消掉的失败模式，这里是它的落点。
    needs: [plan, review, verify]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_shards == 'true' && needs.plan.outputs.skip_round != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
      SHARDS: ${{ needs.plan.outputs.shards }}
      PRIOR_ROUNDS: ${{ needs.plan.outputs.prior_rounds }}
      CARRIED: ${{ needs.plan.outputs.carried }}
      DISMISSED: ${{ needs.plan.outputs.dismissed }}
      FILE_TOTAL: ${{ needs.plan.outputs.file_total }}
      FILE_LISTED: ${{ needs.plan.outputs.file_listed }}
      GH_TOKEN: ${{ github.token }}
      # 同 plan：这个 job 也不 checkout，没有 GH_REPO 的话最后那条 gh pr review
      # 会在「确定 base repo」这一步就失败——分片全跑完、verdict.md 也拼好了，
      # 唯一一次表态却落不下去，「一定有一次表态」的设计在最后一米断掉。
      GH_REPO: ${{ github.repository }}
    steps:
      # 全部分片都没产出时一个 artifact 都不存在。download-artifact 在这种情况下是否
      # 静默通过没有保证，硬失败会把 verify 和 verdict 一起带走——那正是要消掉的
      # 「跑挂了 PR 上什么都没有」。下游按「文件缺失 = 该片未覆盖」处理，容得下空目录。
      - name: Download findings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true

      # verify 整个挂掉时这个 artifact 不存在，下一步会把全部阻塞项标成「未复核」
      # 照常报上去——复核缺席只该降低可信度，不该让阻塞项静默消失。
      - name: Download verification
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: verification
          path: verification

      # 汇总用确定性脚本，不再起一个模型：拼接已有结论不需要判断力，也不该有编造空间。
      - name: Assemble verdict
        id: assemble
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import collections, json, os, pathlib, subprocess, zlib

          repo, pr = os.environ["GH_REPO"], os.environ["PR_NUMBER"]
          shards = json.loads(os.environ["SHARDS"])
          root = pathlib.Path("findings")

          done, missing, blockers, unconfirmed, lines = [], [], [], [], []
          for s in shards:
              path = root / (s["key"] + ".json")
              if not path.exists():
                  missing.append((s, "absent"))
                  continue
              # 防御要罩住整个循环体，不能只罩 json.loads：文件解析成顶层数组时
              # data.get() 抛 AttributeError，同样会让 Assemble 非零退出。
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if not isinstance(data, dict):
                      raise ValueError("not an object")
                  # 回填的占位不算「产出过结论」：否则全片静默失败会变成 approve 一个
                  # 从没被审过的 PR——比不表态糟得多。
                  status = data.get("status")
              except (ValueError, OSError, AttributeError):
                  missing.append((s, "malformed"))
                  continue
              if status == "no_output":
                  missing.append((s, "no_output"))
                  continue
              done.append((s, data))
              # findings 是模型写的，属于不可信输入：JSON 合法但结构不对（元素是字符串
              # 而非对象）会让下面的 dict()/get() 抛异常，Assemble 非零退出后 Post review
              # 不执行、告警分支也不成立——PR 上既无表态也无告警，只剩一个红叉。
              # 序号取自 enumerate 而非计数器，跳过畸形元素不会让 id 错位（id 是
              # survived/refuted 分类的唯一依据，错位会把复核结论贴到别的阻塞项上）。
              # verify 的 collect 步骤必须用完全相同的过滤规则。
              for i, b in enumerate(data.get("blockers") or []):
                  if not isinstance(b, dict):
                      continue
                  # id 规则必须与 verify 的 collect 步骤一致：<分片 key>#<片内序号>。
                  b = dict(b, id="%s#%d" % (s["key"], i))
                  blockers.append((s, b))
              for u in data.get("unconfirmed") or []:
                  if isinstance(u, dict):
                      unconfirmed.append((s, u))

          # 一片都没产出（多半是 secret 缺失或全线失败）：不表态，只留告警。
          # 此时 request-changes 会拿一个「什么都没审」当阻塞理由挂住 PR。
          if not done:
              print("action=none")
              raise SystemExit(0)

          # 上一轮遗留、这一轮既没修也没被撤销的阻塞项，重新出现在结论里并继续阻断。
          # 它们不在本轮 findings 里（复评 prompt 明令不许重列已提过的问题），由 plan
          # 从上一轮结论正文的隐藏状态块读回来。遍历顺序与跳过规则必须与 verify 的
          # collect 步骤逐字相同——id 是复核结论的唯一对齐依据。
          # 注意这里**不再按 dismissed 过滤 carried**：plan 已经滤过一遍，这里再滤会让
          # 序号与 verify 那端错位。
          CARRY = {"key": "carry", "label": "遗留"}
          try:
              carried_raw = json.loads(os.environ.get("CARRIED") or "[]")
          except ValueError:
              carried_raw = []
          if not isinstance(carried_raw, list):
              carried_raw = []
          try:
              dismissed = set(json.loads(os.environ.get("DISMISSED") or "[]"))
          except ValueError:
              dismissed = set()

          def fkey(file_, what):
              # 跨轮身份。每轮的 id 是按位置算的，条数一变就指向别的项，不能拿给作者
              # 写 `/dismiss`。改用内容散列：位置 + 措辞归一化，同一条问题跨轮稳定。
              # 用 crc32 不用 hashlib：这里只要一个稳定短标识，不是防篡改摘要，而
              # zlib 是纯 stdlib、不牵扯 OpenSSL 动态库，本机也跑得起来好验。
              raw = "%s\n%s" % (str(file_ or "").strip(),
                                " ".join(str(what or "").split()).lower())
              return "%08x" % (zlib.crc32(raw.encode("utf-8")) & 0xffffffff)

          carried = []
          for i, c in enumerate(carried_raw):
              if not isinstance(c, dict):
                  continue
              c = dict(c, id="carry#%d" % i)
              if not c.get("key"):
                  c["key"] = fkey(c.get("file"), c.get("what"))
              carried.append((CARRY, c))

          # 作者撤销掉的不再报。同位置去重不在这里做——见下面复核分组之后那段。
          fresh = []
          for s_, b in blockers:
              b["key"] = fkey(b.get("file"), b.get("what"))
              if b["key"] in dismissed:
                  continue
              fresh.append((s_, b))
          blockers = fresh + carried

          # 复核结论：refuted 的阻塞项不进 PR，只留在折叠区里备查——全部丢掉的话，
          # 复核环节把真问题误杀了也没人看得见。
          verdicts = {}
          vpath = pathlib.Path("verification/verified.json")
          if vpath.exists():
              try:
                  for v in json.loads(vpath.read_text(encoding="utf-8")).get("verdicts") or []:
                      verdicts[v.get("id")] = v
              except (ValueError, OSError):
                  verdicts = {}

          # 机器人贴到 PR 上的文字一律中文：结论骨架、分片名、进度评论、空转通告、
          # 回填占位、verify 的驳回理由，全部同一种语言。曾按分片投票在 zh/en 之间切换，
          # 结果是骨架跟着投票走、分片名等仍写死中文，拿到的是混排文档——所以不做切换，
          # 定死一种。注意这与「我们自己写的 PR 标题与正文用英文」是两回事，别混淆。
          T = {"block": "阻塞项",
               "verified": "以下每一条都经过一轮独立复核（默认驳回，核实通过才保留）。",
               "unrev": "（**未复核**，复核环节未产出结论）",
               "scen": "失效场景：",
               "dropped": "复核未通过或已关闭的 %d 条", "why": "结论：",
               "closed": "（**遗留项已关闭**）",
               "byshard": "各分片结论", "impact": "影响范围：", "notcov": "未覆盖：",
               "clean": "_（无问题）_", "counts": "_（阻塞 %d，待确认 %d）_",
               "detail": "各分片的影响范围与未覆盖面",
               "more_unconf": "另有 %d 条待确认项已省略，以免正文过长；详见各分片日志。",
               "carried": "（**上一轮遗留**，已挂 %d 轮未处理）",
               "state_trunc": "另有 %d 条阻塞项未进入跨轮跟踪（状态块上限 %d 条），下一轮不会自动带回来——本轮请一并处理。",
               "dismiss": "认为其中某条是误报：回复 `/dismiss 编号`（每条前面那串 8 位编号）撤销它，或者直接说明为什么不采纳——复核环节会读你的回复。想让撤销当场生效，在同一条评论里带上 `/review`。",
               "unconf": "待确认项（不阻断放行）", "missing": "未产出结论的分片",
               "missing_body": "下面这些分片没有产出结论，**这些文件本轮未经评审**：",
               "reason_no_output": "跑完了但没落下结论（多半是撞轮次上限或提前收尾）",
               "reason_absent": "整个分片没跑起来或中途挂了",
               "reason_malformed": "写出的结论文件解析不了",
               "trunc": "文件清单被截断",
               "trunc_body": "本 PR 共 %s 个改动文件，分片只拿到 %s 个（评审的文件清单上限 500），**其余 %d 个未进入任何分片、本轮未经评审**。",
               "footer": "改完请推新提交，或回复 `/review` 要一轮复评。**没修完的阻塞项会带到下一轮**，不会因为下一轮没再提它而消失。",
               "footer_ok": "有异议或想再评一轮，请回复 `/review`——普通回帖不会触发复评，且回帖人需为本仓 OWNER/MEMBER/COLLABORATOR。"}

          # 模型不一定听话，长度要有确定性兜底——与「模型输出是不可信输入」同一思路。
          # 只有一个评审者时，每行挂 [标签] 前缀、外加一个只有一行的「各分片结论」
          # 小节，都是纯噪声。多片形态随时可能回来，所以按片数分支而不是删掉。
          multi = len(done) > 1

          def tag(label):
              return "[%s] " % label if multi else ""

          def clip(x, n):
              x = " ".join(str(x).split())
              return x if len(x) <= n else x[:n - 1].rstrip() + "…"

          survived, refuted, unreviewed = [], [], []
          for s_, b in blockers:
              v = verdicts.get(b["id"])
              if v is None:
                  unreviewed.append((s_, b, None))
              elif v.get("refuted"):
                  refuted.append((s_, b, v))
              else:
                  survived.append((s_, b, v))

          # 未复核的仍然当阻塞项报，但在正文里标出来——复核缺席是降可信度，不是免罪。
          blockers = [(s_, b) for s_, b, _ in survived + unreviewed]

          # 同位置去重：本轮新报的条目若与某条**仍然存活的**遗留项落在同一 file:line，
          # 按重复丢掉，留遗留那条——它带着轮次计数和作者已经见过的措辞。
          #
          # 这一步必须排在复核分组**之后**。排在之前的话，遗留项这一轮被判成已关闭
          # （作者原地改掉、行号没变）时，同位置那条本轮新报、且已通过复核的阻塞项会跟着
          # 一起消失：既不进阻塞清单也不进折叠区，正文里一个字都没有；若它是本轮唯一
          # 一条，action 直接算成 approve。
          kept_loc = {(str(b.get("file") or ""), b.get("line"))
                      for s_, b in blockers if s_ is CARRY}
          blockers = [(s_, b) for s_, b in blockers
                      if s_ is CARRY
                      or (str(b.get("file") or ""), b.get("line")) not in kept_loc]

          if blockers:
              lines.append("## %s\n" % T["block"])
              lines.append(T["verified"] + "\n")
              for s_, b in blockers:
                  loc = b.get("file", "")
                  if b.get("line"):
                      loc += ":%s" % b["line"]
                  mark = "" if verdicts.get(b["id"]) else T["unrev"]
                  if s_ is CARRY:
                      # 轮次含这一轮：状态块里存的是「此前报过几轮」，报到第二遍时
                      # 存的是 1，显示要写 2。写状态块那段用同一个式子。
                      mark += T["carried"] % (max(0, int(b.get("rounds") or 0)) + 1)
                  # 编号前置：它是作者写 `/dismiss` 时要抄的东西，藏在行尾没人找得到。
                  lines.append("- `%s` **%s%s** — %s%s"
                               % (b.get("key", ""), tag(s_["label"]), loc,
                                  clip(b.get("what", ""), 300), mark))
                  if b.get("scenario"):
                      lines.append("  %s%s" % (T["scen"], clip(b["scenario"], 300)))
              lines.append("")
              lines.append(T["dismiss"] + "\n")

          if refuted:
              lines.append("<details><summary>" + (T["dropped"] % len(refuted)) + "</summary>\n")
              for s_, b, v in refuted:
                  # 遗留项走到这里多半是「作者修好了」或「作者说明了不采纳」，不是
                  # 「这条是误报」。同一个折叠区里两种含义并排，措辞必须分得开。
                  lines.append("- **%s%s** — %s%s"
                               % (tag(s_["label"]), b.get("file", ""),
                                  clip(b.get("what", ""), 200),
                                  T["closed"] if s_ is CARRY else ""))
                  lines.append("  %s%s" % (T["why"], clip(v.get("reason", ""), 200)))
              lines.append("\n</details>\n")

          # 标量字段同样是不可信输入：这里用 + 拼接（而非 %s 格式化）要求 str，
          # 模型把 impact 写成数组就抛 TypeError，失败形态与上面挡掉的畸形元素一致
          # ——Assemble 非零退出后既无表态也无告警。一律套 str()。
          # 每片一行，详情折叠。改造前影响范围是整个 PR 写一次，分片后变成每片各写一段，
          # 实测把结论正文撑到了改造前的 3 倍——阻塞项被埋在中间没人看得见。
          if not multi:
              only = done[0][1]
              if only.get("summary"):
                  lines.append(clip(only["summary"], 400) + "\n")
          else:
              lines.append("## %s\n" % T["byshard"])
              for s, data in done:
                  n_b = len([b for _, b in blockers if _ is s])
                  n_u = len([u for ss, u in unconfirmed if ss is s])
                  # 不叫 tag：那是上面的前缀函数，同名会把它遮蔽掉，
                  # 后面待确认项再调用就成了 str is not callable。
                  counts = T["clean"] if not (n_b or n_u) else T["counts"] % (n_b, n_u)
                  lines.append("- **%s** — %s %s"
                               % (s["label"], clip(data.get("summary") or "", 240), counts))
          lines.append("")

          detail = []
          for s, data in done:
              extra = [(T["impact"], data.get("impact")), (T["notcov"], data.get("not_covered"))]
              extra = [(k, v) for k, v in extra if str(v or "").strip()]
              if not extra:
                  continue
              detail.append("**%s**" % s["label"])
              detail += ["- %s%s" % (k, clip(v, 200)) for k, v in extra]
              detail.append("")
          if detail:
              lines.append("<details><summary>%s</summary>\n" % T["detail"])
              lines += detail
              lines.append("</details>\n")

          # 复评轮的配额要衰减。待确认项不阻断、成本低，模型每轮都会把配额填满，于是
          # 「每轮十条互不重叠的新问题」可以无限持续——实测 #683 连续三轮如此，而后两轮
          # 本身已经是 approve。收敛规则写进了 prompt，但那靠自觉，这里再挡一道。
          # 轮次由 plan 一次算好传下来，分片与这里共用同一个数，避免两处各查一次、
          # 也避免它们对「这是第几轮」得出不同结论。
          prior_rounds = int(os.environ.get("PRIOR_ROUNDS") or 0)
          per_shard_cap, total_cap = (1, 2) if prior_rounds else (2, 6)

          # 首轮每片至多 2 条、总共 6 条；复评轮收到 1 条 / 2 条。
          if unconfirmed:
              lines.append("## %s\n" % T["unconf"])
              # 轮转取：分片时代 contract 片排在最后会被挤掉，才有了这个写法。现在只有
              # 一片，它退化成按顺序取，保留是因为多片形态随时可能再需要。
              by_shard = collections.OrderedDict()
              for s, u in unconfirmed:
                  by_shard.setdefault(s["key"], []).append((s, u))
              shown = 0
              for rnd in range(per_shard_cap):
                  for k, items in by_shard.items():
                      if len(items) <= rnd or shown >= total_cap:
                          continue
                      s, u = items[rnd]
                      shown += 1
                      lines.append("- **%s%s** — %s"
                                   % (tag(s["label"]), u.get("file", ""), clip(u.get("what", ""), 220)))
              dropped_u = len(unconfirmed) - shown
              if dropped_u > 0:
                  lines.append("- _%s_" % (T["more_unconf"] % dropped_u))
              lines.append("")

          if missing:
              lines.append("## %s\n" % T["missing"])
              lines.append(T["missing_body"] + "\n")
              # 两种原因指向完全不同的修法（轮次预算 vs job 失败），所以要分开写，
              # 不能都渲染成一行「未覆盖」。
              for s, reason in missing:
                  lines.append("- %s — %s" % (s["label"], T["reason_" + reason]))
              lines.append("")

          dropped = int(os.environ.get("FILE_TOTAL") or 0) - int(os.environ.get("FILE_LISTED") or 0)
          if dropped > 0:
              lines.append("## %s\n" % T["trunc"])
              lines.append(T["trunc_body"] % (os.environ["FILE_TOTAL"],
                                          os.environ["FILE_LISTED"], dropped) + "\n")

          # approve 之后作者仍可能想争一句，而普通回帖不触发复评（评论正文必须含
          # /review 或 @claude）。不写这句，他没有别的途径知道这件事。
          lines.append(T["footer"] if blockers else T["footer_ok"])

          # 隐藏状态块：这一轮仍然成立的阻塞项原样带给下一轮。没有它，作者只修一部分时
          # 剩下的会在下一轮 findings 里消失，action 算成 approve 放行。
          # `-->` 出现在正文里会提前截断这个块，转成 JSON 的 \u003e 转义（json.loads
          # 解回来仍是 `-->`）。
          #
          # 遗留项排在前面：截断从尾部切，按 `fresh + carried` 的原顺序会让挂了好几轮的
          # 老问题被本轮新报的挤出状态块——下一轮读不回来就此消失，正是这个机制要消掉的
          # 失败模式。真被截掉时在正文里点明，不做静默截断。
          # STATE_CAP 必须与 plan 读取时的上限一致。
          STATE_CAP = 12
          ordered = ([x for x in blockers if x[0] is CARRY]
                     + [x for x in blockers if x[0] is not CARRY])
          state = []
          for s_, b in ordered:
              state.append({
                  "key": b.get("key", ""),
                  "shard": b.get("shard") or s_["label"],
                  "file": str(b.get("file") or ""),
                  "line": b.get("line"),
                  "what": clip(b.get("what", ""), 300),
                  "scenario": clip(b.get("scenario", ""), 300),
                  "evidence": [str(e) for e in (b.get("evidence") or [])][:4],
                  "rounds": max(0, int(b.get("rounds") or 0)) + 1,
                  # 这一条是否真的过过复核。verify 整个挂掉那轮的阻塞项照样进 PR（标
                  # 「未复核」），也照样进状态块——不然它下一轮就静默消失了。但它不能因此
                  # 白拿「默认仍然成立」的待遇：那等于把一条从没验过的结论提拔成默认阻断，
                  # 只能靠 /dismiss 摘。下游 verify 按这个字段选立场。
                  # 一旦在任何一轮过了复核就永久为真，后续某轮 verify 挂了也不回退。
                  "verified": bool(verdicts.get(b["id"])) or bool(b.get("verified")),
              })
          if len(state) > STATE_CAP:
              lines.append(T["state_trunc"] % (len(state) - STATE_CAP, STATE_CAP) + "\n")
          blob = json.dumps({"v": 1, "open": state[:STATE_CAP]}, ensure_ascii=False)
          lines.append("\n<!-- claude-review-state: %s -->" % blob.replace("-->", "--\\u003e"))

          pathlib.Path("verdict.md").write_text("\n".join(lines), encoding="utf-8")
          print("action=" + ("request-changes" if blockers else "approve"))
          PY

      # 待确认项与「未覆盖的分片」都不阻断放行：写进 approve 的 body 当提示，由作者
      # 自行判断。为了等一个回应而改用 --request-changes，只会把 PR 挂在那里。
      # PR 可能在评审跑的这几分钟里被合并（#670 实测：03:53 合并，03:56 verdict 仍贴出
      # 一条 CHANGES_REQUESTED）。merge 已不可逆，此时表态纯属噪声，还会让人误以为
      # 合进去的东西有阻塞项。job if 里的 state == 'open' 是在事件到达时求值的，拦不住
      # 跑到一半才发生的合并，只能在落地前再查一次。
      # 组织策略禁止 GitHub Actions 批准 PR，而 main 的 ruleset 要求 1 个 approval——
      # 两条撞在一起，github-actions[bot] 发的 approve 会被 GraphQL 拒，评审就过不了
      # 合并门。禁令只针对 github-actions[bot]，GitHub App 身份不受限（分片前由
      # claude-code-action 以 claude[bot] 身份表态，正是靠这一点过门的）。
      #
      # 配了 REVIEW_APP_ID / REVIEW_APP_PRIVATE_KEY 就用 App 身份表态；没配则退回
      # github.token，approve 失败时由下面的兜底改贴评论。两条路都不会让结论丢掉。
      - name: Mint reviewer token
        id: apptoken
        if: vars.REVIEW_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}

      - name: Post review
        id: post
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
        if: steps.assemble.outputs.action != 'none'
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "::warning::PR #$PR_NUMBER 已是 $state，跳过表态。结论见下方 job summary。"
            cat verdict.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.assemble.outputs.action }}" = "request-changes" ]; then
            gh pr review "$PR_NUMBER" --request-changes --body-file verdict.md
          elif ! gh pr review "$PR_NUMBER" --approve --body-file verdict.md; then
            # 仓库若关闭「Allow GitHub Actions to create and approve pull requests」，
            # approve 会被 GraphQL 拒（request-changes 不受限，因为那不算批准）。
            # 结论不能因此丢掉——改贴普通评论，并说清为什么没有评审状态。
            echo "::warning::approve 被拒，改以评论形式给出结论。"
            {
              cat verdict.md
              printf '\n\n---\n\n_本轮没有阻塞项。仓库当前禁止 GitHub Actions 批准 PR，因此以评论形式给出结论，没有 APPROVED 状态。需要自动批准的话，在 Settings → Actions → General 打开「Allow GitHub Actions to create and approve pull requests」。_\n'
            } > verdict-comment.md
            gh pr comment "$PR_NUMBER" --body-file verdict-comment.md
          fi

      # always()：不管有没有落表态（PR 中途被合并也会跳过表态），这条过程态评论都要
      # 清掉，否则会永远停在「评审进行中」误导后来的人。
      - name: Remove progress comment
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          MARKER='<!-- claude-review-progress -->'
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | .[]" \
          | while read -r id; do
              gh api -X DELETE "repos/${GH_REPO}/issues/comments/${id}" >/dev/null
            done

      # 静默是最坏的结果：PR 上什么都没有，与「压根没触发」无法区分——#671 首轮就是
      # 这样被当成没触发的。
      #
      # 一个反复出现且最难自查的原因：claude-code-action 校验运行时的 workflow 文件与
      # 默认分支上的副本是否逐字一致，不一致就把自己整步跳过（日志里是
      # "Workflow validation failed"）。于是任何在途的评审，只要这期间有人把 workflow
      # 改动合进 main，就会静默 no-op——#693 就是这么空转的。改这个文件的当天尤其常见，
      # 所以通告文案把它列在第一条。这里不落评审状态（没审过就不该 request-changes，也不该
      # approve），但必须留一条普通评论说明这轮空转了。
      # 这一轮真落了表态，就把上一轮的空转通告删掉——否则作者会在第 4 轮的结论旁边
      # 读到第 3 轮的「本轮评审空转」。
      - name: Clear stale empty-round notice
        if: steps.post.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          MARKER='<!-- claude-review-empty -->'
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | .[]" \
          | while read -r id; do
              gh api -X DELETE "repos/${GH_REPO}/issues/comments/${id}" >/dev/null
            done

      # 判据取 Post review 的**实际结果**，不取 Assemble 的意图：Assemble 崩掉时
      # output 没写出来、Post review 被跳过；gh pr review 自己失败时意图是 approve
      # 但 PR 上什么都没有。两种都必须通告，否则进度评论被删、原地不留任何东西。
      - name: Report empty round
        if: always() && steps.post.outcome != 'success'
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::warning::本轮未落评审表态。"
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          [ "$state" = "OPEN" ] || exit 0
          MARKER='<!-- claude-review-empty -->'
          body=$(printf '%s\n### 本轮评审没有产出结论\n\n没有分片落下结论，**这些改动本轮未经评审**。没有表态是因为无从表态——既不该 request-changes，也不该 approve。\n\n常见原因：本轮运行期间 workflow 文件被合进默认分支（claude-code-action 要求两者逐字一致，不一致会整步跳过）、分片撞轮次上限、模型未写出结论文件、汇总步骤失败、凭据缺失。[查看运行日志](%s)\n\n回复 `/review` 可以再要一轮。下一轮真出了结论，这条会自动消失。' "$MARKER" "$RUN_URL")
          # 复用同一条：synchronize 每次推送跑一轮，凭据缺失这类持续故障否则会在 PR 上
          # 堆出一串一模一样的通告，正是进度评论当初特意避开的噪声。
          existing=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | last // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
