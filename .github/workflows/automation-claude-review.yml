name: Claude Code Review

# 由 Claude 对 PR 做代码评审：开启、重开、从 draft 转 ready、每次推送新提交时各跑
# 一次；此外可在评论里写 `/review` 或 `@claude` 手动要一轮。
#
# 覆盖每次推送而非只审首版，是因为评审之后追加的提交往往是「按意见快速改一下」，
# 恰恰最容易引入新问题；只审首版会让这部分完全不过审。
# 连续推送的浪费由下面的 concurrency 收敛：新一次运行会取消尚未完成的上一次。
# 「推提交」与「回帖 /review」若在同一段时间内发生，同样收敛成一轮——两个入口都保留，
# 合并掉的只是重复劳动：存活的那轮 checkout 拿的是 PR 最新 HEAD（含新提交），而下方
# prompt 本就要求读回既有 inline 评论与其下的回复，代码与回复两边都不会漏。
#
# 口令过滤有个必须靠 prompt 兜住的副作用：作者「推提交 + 紧接着发一条处理说明」时，
# 那条说明多半不含口令，过不了下方 job 的 if，也就不会去取消正在跑的那轮；而推送那轮
# 的评论是在 job 开头预取的，说明发在它开头之后就永远读不到。#619 第九轮实测：02:28:42
# 推送触发评审，02:28:56 作者发说明「appSetting 死字段本轮不采纳」，02:31:56 的结论仍把
# 这条原样列了出来——作者会认为没人在听。debounce 那 15 秒对此完全无效，它只让**合格
# 的**评论有机会取消推送轮，不合格的评论按 comment.id 单独分组、根本不参与取消。
# 因此分片 prompt 要求「写 findings 之前最后再拉一次顶层评论」。注意只堵住了顶层这一半：
# 作者在 bot 的 inline 评论下回复「不采纳」仍读不到，因为补另一半要 `gh api`，而分片
# 刻意不给（全方法通配会让模型能 POST /pulls/N/reviews，破坏「表态只能有一次」）。
#
# 评论也能触发复评，但必须在正文里显式写 `/review` 或 `@claude`。早先是每条评论都跑
# 一轮，作者每回一帖就复评一次，轮次膨胀且额度白烧——待确认项现在不阻断放行（见下方
# prompt），自动复评失去了存在理由，改成按需触发。两个口令都收是因为 `@claude` 已是
# 团队既有习惯，本仓没有别的 workflow 接管它；只认 `/review` 会让这个写法在合并后
# 静默失效，连提示都没有。注意 contains 是子串匹配，评论里粘到含 `/review` 字样的
# 链接或命令会误触发一轮——代价是一次评审，未做更严的匹配。
# 为避免自我循环，评论事件由下方 job 的 if 过滤掉 bot 自己的评论，并限定发起者为
# OWNER/MEMBER/COLLABORATOR——评论事件在 base 仓上下文携带 secret 运行，限定关联方
# 可挡掉 fork 陌生人触发的 pwn-request。
#
# 需要对任意 PR 重新评审时，手动触发 workflow_dispatch 并填 PR 编号。
#
# pull_request 触发只对代码路径生效；纯配置类改动（release manifest 刷新、镜像同步、
# workflow 自身调整、文档）不进评审，既省额度也避免噪声。
# 注意：GitHub Actions 不允许同一事件同时使用 paths 与 paths-ignore，因此这里
# 只写 include 列表——未列出的路径自动跳过——并用 ! 前缀排除列表内的文档文件。
# 评论事件不支持 paths 过滤，靠 job if 与 Claude 自身判断相关性。

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'adp/**'
      - 'infra/**'
      - 'bkn-safe/**'
      - 'comm-go/**'
      - 'deploy/scripts/**'
      - '!**/*.md'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  # 分组判据是「这条事件能不能过下方 job 的 if」，不是「它是不是评论事件」。
  #
  # 能过 if 的（推送、人工写 `/review`/`@claude` 的评论、手动触发）全部落 -review 组，
  # cancel-in-progress 生效：连续推送时新 run 取消旧 run；作者「推提交 + 回帖 /review」
  # 这种连续动作也收敛成一轮，而不是推送和评论各跑一轮。
  #
  # 过不了 if 的评论（bot 自己贴的进度/行内评论、外部人员的评论、不含口令的普通回帖）
  # 必须按 comment.id 各自成组。concurrency 在 run 排队时求值，早于 job if，落进共享组
  # 就会在 if 把它过滤掉之前先取消掉正在跑的评审。claude-code-action 的 tracking comment
  # 与 create_inline_comment 正是这条路径——曾导致评审贴出第一条评论那刻就自杀。
  #
  # 因此下面的判据必须与 job if 的评论分支逐条对齐（非 bot、含口令、author_association
  # 属 OWNER/MEMBER/COLLABORATOR）。漏对一条，那类事件就能溜进共享组杀掉正在跑的评审。
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}-${{ (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && !(github.event.sender.login != 'github-actions[bot]' && (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) && format('comment-{0}', github.event.comment.id) || 'review' }}
  cancel-in-progress: true

# 评审分四段跑：plan 算分片 → review 按分片并行 → verify 复核阻塞项 → verdict 汇总表态。
#
# 起因：#662（adp/bkn 5 文件 + adp/context-loader 4 文件）由单个 agent 通吃，连撞两次
# error_max_turns（num_turns 61），整轮零产出、额度全烧。单 agent 的轮数随 PR 规模线性
# 涨，抬上限只是把撞墙点后移。
#
# 分片解决两件事：
#   1. 墙钟从 Σ(各模块) 变成 max(各模块)，且单片轮数远低于上限；
#   2. verdict 挂 if: always()，任一分片撞墙或失败时照样落表态并写明「该片未覆盖」——
#      「跑挂了什么都没有」这个失败模式在结构上被消掉。
#
# 代价是成本上升：每片各自重读一遍共享上下文，总额约等于片数 × 单片。这是拿钱换时间。
#
# 三条不变量，改这个 workflow 时必须守住：
#   - **分片切的是责任范围，不是可读范围**。每片都拿全仓 checkout，只是「为哪些文件出
#     结论」不同。改动在 adp/bkn、调用方在 adp/context-loader 是本仓最贵的一类缺陷，
#     限制可读范围会直接把它切瞎。
#   - **跨模块契约必须有一片拿全量 diff**。REST 路由 / MCP 工具定义 / .adp / SDK / CLI
#     的多处声明对齐、配置与部署面、数据面，这三个面按模块切开就废了，固定由 contract
#     片统一看。
#   - **表态只能有一次**。分片只贴 inline comment、只写 findings JSON，一律不许调
#     `gh pr review`；N 片各自表态会在 PR 上挂出 N 条评审状态，作者不知道该解哪个。
#     汇总用确定性脚本而非再起一个模型：拼接已有结论不需要判断力，也不该有编造空间。
#   - **阻塞项必须过独立复核才能进 PR**。发现者自评把握挡不住误报——同一段上下文里
#     模型对自己刚推出来的结论天然高估。verify 换一份干净上下文、默认立场是驳回，
#     照 evidence 去原地验。误报的代价不对称：放过一个待确认项作者自己会看到，
#     报一个假阻塞项则挂住 PR、逼作者证伪一个不存在的问题，几次之后没人再信这个评审。

jobs:
  plan:
    # 逐事件放行：
    #   - workflow_dispatch：手动，总放行。
    #   - pull_request：只同仓 PR（fork 拿不到 secret，跳过避免红叉）。
    #   - 评论/行内回复：必须挂在 PR 上、PR 仍 open、评论正文含 `/review` 或
    #     `@claude`、非 bot 自己发的、且发起者为 OWNER/MEMBER/COLLABORATOR，
    #     挡掉自我循环与 fork 陌生人的 pwn-request。
    #     state == 'open' 让合并/关闭后的评论不再触发复评——merge 已不可逆，
    #     再跑只是白费额度、在死 PR 上贴噪声。
    #     口令过滤把「每回一帖跑一轮」压成按需触发，评审轮次由人决定。
    #
    # 放行判据只写在这一个 job 上，下游靠 needs 继承，避免三处各写一份逐渐走样。
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.pull_request.state == 'open' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.sender.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.sender.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write 是为了贴那条进度评论：分片模式关掉了 claude-code-action 的
      # track_progress（每片各贴一条会把 PR 刷满），PR 上从触发到出结论的七八分钟里
      # 便完全没有动静，看起来像没触发。这里补一条**唯一**的进度评论，由 verdict 收尾
      # 时删掉——过程态不该留在 PR 的历史里，结论本身才是记录。
      pull-requests: write
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      shards: ${{ steps.plan.outputs.shards }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
      file_total: ${{ steps.plan.outputs.file_total }}
      file_listed: ${{ steps.plan.outputs.file_listed }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      GH_TOKEN: ${{ github.token }}
      # gh 解析目标仓库只认 --repo、GH_REPO、当前目录的 git remote 三者，**不读**
      # GITHUB_REPOSITORY。这个 job 有意不 checkout，工作目录不是 git 仓库，不给
      # GH_REPO 的话 gh 会以 failed to determine base repo 直接非零退出，plan 一挂
      # 下游全跳过——连 verdict 的 always() 兜底都够不着（它被 needs.plan.result 挡着）。
      # 同仓 automation-agent-metrics.yml 是同样不 checkout 的场景，那里逐条带 -R。
      GH_REPO: ${{ github.repository }}
    steps:
      # 推送事件先静默一小会儿再往下走。作者（多数时候是 agent）常见动作是
      # `git push` 紧接着 `gh pr comment "/review"`，两条事件各触发一次评审；静默期内
      # 后一条到达时，上面的 concurrency 会把本 run 取消，而此刻还没 checkout、没调
      # Claude、没贴 tracking comment，取消的代价是零。等满则照常跑，只晚十几秒。
      # 只挂 pull_request：评论触发与手动触发都是人明确要一轮，不该让它等。
      - name: Debounce push events
        if: github.event_name == 'pull_request'
        run: sleep 15

      - name: Resolve PR number
        id: meta
        run: echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # 只调 API 取改动文件清单，不 checkout——分片规划不需要工作区，省掉一次全仓拉取。
      - name: Plan shards
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import collections, json, os, subprocess

          pr = os.environ["PR_NUMBER"]
          out = subprocess.run(
              ["gh", "pr", "view", pr, "--json", "files,changedFiles",
               "--jq", '.changedFiles, (.files[].path)'],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          # `gh pr view --json files` 一次最多返回 100 个文件。超出部分会被静默丢掉，
          # 那些文件就永远不进任何分片、也永远不被评审——比漏审更糟的是没人知道漏了。
          # 这里把总数单独取出来对账，差额由 verdict 在结论里点明。
          total = int(out[0].strip())
          paths = [p for p in out[1:] if p.strip()]

          # adp/ 与 infra/ 下一层才是服务边界（adp/bkn、infra/bkn-agent）；其余仓根目录
          # 本身就是一个服务。归不进这两类的（docs/、examples/、根文件）落 misc，
          # 宁可多跑一片也不静默丢掉——漏审比多花钱贵。
          TWO_LEVEL = {"adp", "infra"}
          TOP_LEVEL = {"bkn-safe", "comm-go", "deploy", "data-migrator", "migrations"}

          # 实测最近 10 个 PR 的 222 个改动文件里只有 44% 是代码：测试 25%、文档 15%、
          # 配置与生成物 12%。此前它们与代码同规格评审——文档也在被追引用点、被做触发式
          # 深挖，一片就是 5 分钟和几十轮。按类分流：
          #   deep    代码，全套
          #   shallow 测试，跟着所属模块走但不追引用点（测试的调用方就是它自己）
          #   低风险  文档/示例/生成物，单独一片浅审
          # 迁移、helm、values 不在此列——它们是本仓最高频的事故来源，永远走 deep。
          def klass(path):
              risky = ("migrations/" in path or "/helm/" in path
                       or path.endswith("values.yaml"))
              if risky:
                  return "deep"
              if ("_test." in path or "/tests/" in path
                      or path.endswith("_test.go")):
                  return "shallow"
              if (path.startswith(("docs/", "examples/")) or path.endswith(".md")
                      or path.endswith((".lock", ".sum"))):
                  return "lowrisk"
              return "deep"

          groups, lowrisk = collections.OrderedDict(), []
          for p in paths:
              k = klass(p)
              if k == "lowrisk":
                  lowrisk.append(p)
                  continue
              parts = p.split("/")
              if parts[0] in TWO_LEVEL and len(parts) > 2:
                  key = "/".join(parts[:2])
              elif parts[0] in TOP_LEVEL:
                  key = parts[0]
              else:
                  key = "misc"
              groups.setdefault(key, []).append(p)

          # 片数上限。超过就把文件最少的几片并进 misc：并行度再高也换不来收益，
          # 而每片都是一份完整上下文的开销。
          MAX_MODULE_SHARDS = 6
          modules = [(k, v) for k, v in groups.items() if k != "misc"]
          if len(modules) > MAX_MODULE_SHARDS:
              modules.sort(key=lambda kv: len(kv[1]), reverse=True)
              for k, v in modules[MAX_MODULE_SHARDS:]:
                  groups.setdefault("misc", []).extend(v)
                  del groups[k]

          shards = []
          for key, files in groups.items():
              deep = sorted(f for f in files if klass(f) == "deep")
              shallow = sorted(f for f in files if klass(f) == "shallow")
              shards.append({
                  "key": key.replace("/", "-"),
                  "label": key,
                  "kind": "misc" if key == "misc" else "module",
                  "files": "\n".join("- " + f for f in deep) or "（本片没有代码改动）",
                  "files_shallow": "\n".join("- " + f for f in shallow),
              })

          # 低风险文件单独成片而不是直接丢掉：静默不审比多花几分钱糟得多，
          # 而且文档与代码对不上本身就是要报的问题。
          if lowrisk:
              shards.append({
                  "key": "low-risk",
                  "label": "docs / examples / generated",
                  "kind": "lowrisk",
                  "files": "\n".join("- " + f for f in sorted(lowrisk)),
                  "files_shallow": "",
              })

          # contract 片固定存在（只要 PR 有改动）：跨模块契约、配置与部署面、数据面
          # 这三个面切开就废了，必须有人拿全量 diff 统一看。
          if paths:
              shards.append({
                  "key": "contract",
                  "label": "跨模块契约 / 配置与部署面 / 数据面",
                  "kind": "contract",
                  "files": "",
                  "files_shallow": "",
              })

          print("shards=" + json.dumps(shards, ensure_ascii=False))
          print("has_shards=" + ("true" if shards else "false"))
          print("file_total=%d" % total)
          print("file_listed=%d" % len(paths))
          PY

      # 同一条评论反复复用（靠 body 里的 HTML 标记定位），复评不会越堆越多。
      # 失败不阻断评审：进度提示挂了没关系，评审本身要继续。
      - name: Post progress comment
        if: steps.plan.outputs.has_shards == 'true'
        continue-on-error: true
        env:
          SHARDS: ${{ steps.plan.outputs.shards }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 转圈图标。自己存在仓里而不是复用 claude-code-action 那个 user-attachment：
          # 那是别人项目的资产，删掉就成裂图。本仓是 public，raw 链接可被 GitHub 的
          # 图片代理取到；私有仓则不行，届时要换成上传到 user-attachments。
          # 分支取默认分支而不是写死 main：改名或迁移资产后这里会静默变成裂图，
          # workflow 侧看不出任何异常，只有渲染出来的评论里才看得见。
          SPINNER: ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.event.repository.default_branch || 'main' }}/.github/assets/review-spinner.gif
        run: |
          set -euo pipefail
          MARKER='<!-- claude-review-progress -->'
          body=$(python3 - <<'PY'
          import json, os
          shards = json.loads(os.environ["SHARDS"])
          lines = ["<!-- claude-review-progress -->",
                   '### <img src="%s" width="16" height="16" /> 评审进行中'
                   % os.environ["SPINNER"],
                   "",
                   "按模块分 %d 片并行，逐片完成后统一给出一次结论。" % len(shards),
                   ""]
          # 复选框由各分片跑完后回来打勾（review job 的 Tick progress 步骤）。
          lines += ["- [ ] `%s`" % s["label"] for s in shards]
          lines += ["", "[查看运行日志](%s)" % os.environ["RUN_URL"],
                    "", "_结论落地后这条会自动消失。_"]
          print("\n".join(lines))
          PY
          )
          existing=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | last // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

  review:
    needs: plan
    if: needs.plan.outputs.has_shards == 'true'
    name: review (${{ matrix.shard.label }})
    runs-on: ubuntu-latest
    # agent 卡住时不能让 job 一路跑到 runner 的 6 小时上限：verdict 在 needs 上等着，
    # 一片挂死会把整轮评审的结论一起拖到没人再看的时候。
    timeout-minutes: 30
    strategy:
      # 一片撞上限或失败，其余片必须照跑完——分片的意义就在于故障隔离。
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
      SHARD_KEY: ${{ matrix.shard.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # pull_request 事件下 checkout 会自动落到 PR 的 merge ref；其它事件
          # （手动触发、评论、行内回复）只会拿到默认分支，需要下一步显式切到
          # PR 分支，因此这里放开深度以便 gh pr checkout 能建立分支。
          # 快照类文件要 `git show` 取前一版比对，也需要历史。
          fetch-depth: 0

      # PR 可能在本轮跑到一半时被合并，分支随即删除，gh pr checkout 会以
      # `couldn't find remote ref` 硬失败（#670 实测：review 片 03:48 切分支成功，
      # verify 03:56 起跑时分支已没了）。此时该跳过而不是留个红叉——PR 都合了，
      # 评审结论已无处可用。exit 0 之后必须把后续步骤一起 gate 掉，否则会拿默认
      # 分支的工作树当 PR 内容评审。
      - name: Checkout PR branch (non-PR events)
        id: prbranch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "::warning::PR #$PR_NUMBER 已是 $state（本轮跑到一半被合并或关闭），跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr checkout "$PR_NUMBER"
          echo "已切到 PR #$PR_NUMBER: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

      - name: Prepare findings dir
        run: mkdir -p findings

      # 上一轮的 inline 评论由 shell 预取成文件，分片不再需要 `Bash(gh api:*)`——那是
      # 全方法通配，模型可以直接 POST /pulls/N/reviews 落一条评审状态，绕过「表态只能
      # 有一次」这条不变量（该不变量此前只靠 prompt 约束，不是权限上做不到）。
      # 顺带省轮次：一次 shell 调用替掉模型自己发的一轮工具调用。
      - name: Prefetch prior review comments
        if: steps.prbranch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 两个来源都要取：/issues/N/comments 是顶层评论、/pulls/N/comments 是 inline
          # 评论及其回复。作者的处理说明（哪条采纳、哪条不采纳）多半发在顶层，只取
          # inline 等于没在听——#619 第九轮就是这么把作者「本轮不采纳」的表态漏掉的。
          #
          # --paginate 是逐页应用 --jq 的，评论超过一页时输出会是多个 JSON 数组首尾
          # 相接、不是一个合法数组。所以先取原始页，再用 jq -s 合并成一个数组。
          # 各留最近 100 条：这里取的是全部历史轮次，攒多了会挤占分片的上下文，
          # 而复评真正要看的是最近几轮。
          fetch() {
            gh api "repos/${GH_REPO}/$1" --paginate | jq -s "[.[][] | $2] | .[-100:]"
          }
          {
            echo '{"issue_comments":'
            fetch "issues/${PR_NUMBER}/comments" \
              '{user: .user.login, created_at, body}' || echo '[]'
            echo ',"review_comments":'
            fetch "pulls/${PR_NUMBER}/comments" \
              '{path, line, user: .user.login, created_at, body}' || echo '[]'
            echo '}'
          } > prior-comments.json || echo '{"issue_comments":[],"review_comments":[]}' \
            > prior-comments.json

      - name: Claude review
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && steps.prbranch.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 分片模式下关掉 track_progress：每片各贴一条进度评论会把 PR 刷满，
          # 而最终只有 verdict 那一条结论有意义。
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            这次评审按模块分片并行，你负责其中一片。

            分片：${{ matrix.shard.label }}
            类型：${{ matrix.shard.kind }}
            产出文件：${{ github.workspace }}/findings/${{ matrix.shard.key }}.json

            仓库是 openbkn 单体仓，包含 Go / Python 微服务、Helm chart 与部署脚本。
            协作规范见 rules/CONTRIBUTING.zh.md。

            ## 你这一片的范围

            ${{ matrix.shard.kind == 'contract' && '你拿的是全量 diff，但**只看跨模块一致性，不重复别人已经在做的模块内逻辑审查**。三个面：一、跨模块契约——同一能力在 REST 路由、MCP 工具定义、.adp 描述、SDK、CLI 等多处各有一份声明，必须同步改，只改其中一处就是线上不一致。二、配置与部署面——Helm values、configmap、环境变量、chart 默认值的改动，分别核存量环境升级（沿用旧值会不会失效、缺省值会不会被覆盖）与全新安装。三、数据面——落库字段、索引结构、消息体格式的变化，确认存量数据仍能被新代码正确读出；滚动升级期间新旧版本并存，两边必须互相兼容。' || (matrix.shard.kind == 'lowrisk' && '这一片是文档、示例与生成物，**浅审**：只确认它们与本次代码改动是否一致（描述与实现对不上、示例跑不通、生成物与源不同步），以及有没有泄露凭据或内部地址。不做引用点追踪，不做触发式深挖，不写影响范围。没问题就直接落结论收工——这一片的预算远小于代码片。' || '你负责为下面这些文件出结论：') }}

            ${{ matrix.shard.files }}

            ${{ matrix.shard.files_shallow != '' && '本片还有下面这些测试文件，**浅审**：只看它们是否验证了真实行为、有没有把断言写成永真。不追引用点、不做触发式深挖——测试的调用方就是它自己。' || '' }}

            ${{ matrix.shard.files_shallow }}

            **责任范围不等于可读范围。** 上面的清单只圈定「你为哪些文件出结论」，
            核查时可以读全仓任意文件——改动在你这片、调用方在别的模块，是本仓最贵的
            一类缺陷，绝不能因为分片而不去追。

            ## 轮次预算（先读这一节）

            这个任务有轮次上限。撞上限意味着你这片零产出，比漏掉一条意见糟得多。因此：

            - 互不依赖的 Read / Grep / Glob / git 调用放在同一条消息里并发发出，不要
              一轮发一条。逐条串行是耗尽轮次的首要原因。
            - 你只负责一片，不要去审别片的文件；跨片的问题写进 findings 的 notes，
              由 verdict 汇总。
            - 用掉大约三分之二轮次时停止深挖，用已经核实的内容收敛出结论。
            - 最后一步必须写出 `${{ github.workspace }}/findings/${{ matrix.shard.key }}.json`
              （**必须用这个绝对路径**，工具不接受相对路径）。宁可给一份范围有限、在
              not_covered 里写明未覆盖面的结论，也不要什么都不产出。

            ## 关注面（按优先级）

            1. **正确性** — 逻辑错误、边界条件、错误处理缺失、并发/竞态、资源泄漏
               （未关闭的连接、goroutine 泄漏）。
            2. **安全** — 凭据硬编码、鉴权/授权绕过、注入、越权访问内部接口、日志泄露
               敏感信息。
            3. **兼容性** — 数据库迁移是否幂等、接口是否破坏既有调用方、Helm values
               变更是否会让存量环境升级失败。这是本仓的高频事故来源。
            4. **测试** — 新增逻辑是否有覆盖，测试是否验证了真实行为。

            评审的对象是**改动带来的整体影响**，不是这份 diff 的文本。每一处改动都要
            先回答：谁在依赖它、它原本承诺了什么、改完之后这些承诺是否仍然成立。改动
            的函数、接口、字段，用 `git grep` 找出引用点核对新语义是否仍然成立；跨服务
            调用要把另一侧的实现一起读，别只看本服务这一半。

            ## 触发式深挖（diff 命中才做，没命中直接跳过）

            这几类改动只读 diff 必然看不出问题（本仓已因「只读 diff」连续三轮漏过一个
            阻断项），命中时必须走出 diff 核源码：

            - **整份快照类文件**（migrations/*/init.sql、lock 文件、生成物）：
              `git show <ref>:<上一版本同名文件>` 取前一版逐行比对，确认差异只有本次
              应有的那几处。全量快照最容易夹带丢列、改名、复活废弃列，而这些在 diff 里
              全是 `+`，读不出来。
            - **字段 / 参数的改名或删除**：定义其语义的文件通常不在 diff 里。`git grep`
              旧名确认无残留，并读配置与校验定义（例如连接器 field_config 中某项是否
              `Required: false`），确认新逻辑没把原本合法的取值判成非法。
            - **被删掉的代码**：先问它在维护什么不变量。删掉一个分支等于不再保证那个
              不变量，必须确认对应的输入形态确实已经不存在，而不是「当前主路径不会
              产生」——存量数据仍会产生。
            - **migrations/ 改动**：分别核全新安装（只执行最大版本目录的 init.sql）与
              存量升级（只按序执行 NN-*.sql 并跳过 init.sql，见 data-migrator/server/
              migrate/script_selector.py）。两条路径最终 schema 必须一致，且都要与代码
              实际引用的列对齐——把相关 f_ 列名 `git grep` 到 drivenadapters 层核对。

            ## 复评（作者推了新提交）

            目标是收敛，不是每轮重开一次全面评审：

            - 先读回上一轮的评论：已经预取到 `${{ github.workspace }}/prior-comments.json`（绝对
              路径），直接读文件，不要自己去调 API。里面两个来源都有：`issue_comments`
              是顶层评论——作者的处理说明（哪条采纳、哪条不采纳）多半发在这里，
              `review_comments` 是 inline 评论及其回复。inline 那部分只看落在你这片
              文件上的；顶层那部分全看。
            - **作者明确表示不采纳的建议，记一次就够，本轮不要再列**——包括写进
              unconfirmed。他已经做过判断，再列一遍只是在告诉他你没读他的回复。只有
              出现新证据推翻他的理由时才重提，并在 what 里说清新证据是什么。
            - 已经提过的问题，作者改了、或给出对得上疑点的解释，就算过。不必追求措辞
              完美，更不要凭「可能」把同一条追问第二遍。
            - 上面的触发式深挖只在首轮做；复评的范围限定在上一轮之后新增的提交与文件。
            - 第二轮起，除非发现你能说清失效场景的确定阻断项，否则不要再报阻塞项。
            - **写 findings 之前，最后再拉一次顶层评论**，逐字发这一条：
              `gh pr view ${{ env.PR_NUMBER }} --json comments --jq '[.comments[-30:][] | {author: .author.login, body}]'`
              PR 号已在 YAML 层插成字面量：allowedTools 是前缀白名单，命令里出现
              `$PR_NUMBER` 这类展开会被权限层以 `Contains simple_expansion` 拒掉，
              整条规则跑不起来。`--jq` 同样别省——不投影的话每条评论返回十几个字段
              且是全部历史，而这一步正发生在轮次与上下文最紧的收尾时刻。
              为什么要重拉：`prior-comments.json` 是本 job 开头预取的，而评审要跑好
              几分钟；作者常在这段时间里推完提交紧接着发一条处理说明——哪条采纳了、
              哪条不采纳、为什么。只读预取文件就会把他刚说过的话原样再问一遍。#619
              第九轮实测：作者在推送后 14 秒发说明「appSetting 死字段本轮不采纳」，
              那轮结论仍把这条原样列了出来。新读到的按上面两条规则处理：已解释的
              算过，明确不采纳的从 unconfirmed 里去掉。

            ## 产出

            两件事，缺一不可：

            **一律用中文**写 inline comment 与 findings JSON 里的所有文字。代码标识符、
            错误信息、命令、路径保持原样，不翻译。

            **一、先写 `${{ github.workspace }}/findings/${{ matrix.shard.key }}.json`**
            （绝对路径）。**这一步排在最前面是有意的**：它是你这片唯一会进入最终结论的
            产出，inline comment 不进。实测出过分片贴完 inline 就收尾、没写这个文件的
            情况，结果是整轮评审在 PR 上零反馈——比漏一条意见糟得多。所以：先落文件，
            后贴 inline；结论有更新就重写一遍文件。严格用下面的结构：

            ```json
            {
              "shard": "${{ matrix.shard.label }}",
              "status": "completed",
              "summary": "整体判断，最多两句",
              "impact": "这片改动可能波及什么，一句话；没什么可说就填空串",
              "blockers": [
                {"file": "adp/bkn/x.go", "line": 42, "what": "问题是什么",
                 "scenario": "什么输入、什么状态、坏成什么样",
                 "evidence": ["comm-go/x/y.go:88-95 这几行里读到的、支撑这条结论的事实"]}
              ],
              "unconfirmed": [{"file": "...", "what": "待确认项，一到两句，不阻断放行"}],
              "not_covered": "本轮没核到的面，一句话；全核到了就填空串"
            }
            ```

            **blockers 的门槛**：你已经读过源码核实，能说清具体的失效场景，并且自评
            把握 ≥ 90 分。说不清、或失效场景里有任何一环没在代码里核实过，都不算阻塞
            项——降级进 unconfirmed，或者直接丢掉。

            **写法**：只写结论和位置，不写你怎么推出来的。不要说明某个发现有多难查、
            你排除了哪些可能、你注意到了什么细节——读的人要的是「哪里坏了、怎么坏」。
            不要评论文件有没有结尾换行、是不是仓里唯一的某类文件、命名风格如何这类
            与行为无关的事；也不要在 not_covered 里论证「这个面在本 PR 上不适用所以
            不算漏审」，一句「无此面」就够。

            **正文长度是有代价的。** 所有分片的输出会拼进同一条评审结论，作者要一次读完；
            一份没人读完的评审等于没评。所以：

            - `summary` 最多两句；`impact` 一句，说「可能坏成什么样」而不是列举清单，
              没有实质影响就填空串；`not_covered` 一句，全核到了就填空串。
            - `unconfirmed` **最多 2 条**，每条一到两句，只给结论和位置，不复述推理过程。
              超过 3 条说明你在凑数——留下最值得作者看的那几条。
            - 上一轮已经提过、这一轮没有新证据的，**不要再列一遍做状态标注**。作者已经
              看过了，重复列出只会让每一轮的结论比上一轮更长。
            - 与行为无关的意见一律不提：格式、命名、结尾换行、注释措辞、文件放在哪一层。
              这些既不阻断也不值得作者花时间读。

            `evidence` 必填且必须是你**这一轮真读过的** file:line。写不出具体位置，
            说明这条是从 diff 表面推出来的，不是核实出来的——那它就不是阻塞项。
            复核环节会照着 evidence 去原地验，编造的位置一验就穿。

            **二、inline comment 只贴改进建议与待确认项**（贴到对应行，说明「问题是什么
            + 怎么改」），**不要贴阻塞项**。阻塞项一律只进上面的 JSON，经独立的 verify
            环节复核后才会出现在 PR 上——本仓的评审历史上出现过一批高危项事后核实几乎
            全是误报，未经复核就贴到行上，作者要为假问题付出真时间。不复述 diff，不为
            凑数提格式化/命名类琐碎意见。

            **你不要调用 `gh pr review`。** 表态由 verdict 环节统一落一次；N 个分片各自
            表态会在 PR 上挂出 N 条互相打架的评审状态。你的 JSON 就是你的表态。

            不要把 CI 当放行条件。CI 全绿是 Branch Protection 的独立闸门，合并时自然会
            拦住，评审只判代码本身。

          # 只给 gh pr diff 不够：Claude 需要进文件看上下文、比对具体 commit，会伸手
          # Read/Grep/git diff 等未授权工具而被拒。之前一次评审因此连撞 12 次 permission
          # denial、耗尽轮次、评论冻在「进行中」。补齐只读检视工具（Read/Grep/Glob/LS +
          # git diff/log/show）与 PR view/checks/api。
          #
          # Write 是分片模式新加的，用来落 findings JSON；分片不给 `gh pr review`——
          # 表态权限收在 verdict 一处。
          #
          # 轮次上限 80：#662 曾在 60 触顶零产出。分片后单片实际轮数远低于此，这个值
          # 是余量而非目标，跑不满不计费。
          # effort 与轮次按片分档：contract 片要在全仓范围内比对多处声明，是最难的判断，
          # 保持 xhigh；模块片做的是「读 diff 找问题」，high 足够，而 xhigh 每轮多生成的
          # 思考 token 是实打实的成本。低风险片只做一致性核对，25 轮绰绰有余。
          claude_args: |
            --model claude-opus-5
            --effort ${{ matrix.shard.kind == 'contract' && 'xhigh' || 'high' }}
            --max-turns ${{ matrix.shard.kind == 'lowrisk' && '25' || '80' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,LS,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*)"

      # if: always()——分片撞上限时 action 以失败退出，但它此前可能已经写了 JSON；
      # 更重要的是没写也要让 verdict 知道这片跑挂了（靠 artifact 缺失判定）。
      # 分片跑完却没写 findings 的情况实测发生过（#671 首轮三片全没写，整轮零反馈）。
      # 补一个占位，让 verdict 能把「跑了但没落结论」与「job 整个挂掉」区分开，也保证
      # 至少有一个 artifact 存在。
      - name: Backfill missing findings
        if: always() && steps.prbranch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # 不依赖 Prepare findings dir：那步是隐式 success()，前面任一步失败就会被跳过，
          # 而本步是 always()——目录不存在时重定向会直接失败，安全网反而变成第二处报错。
          mkdir -p findings
          f="findings/${SHARD_KEY}.json"
          if [ ! -s "$f" ]; then
            echo "::warning::分片 ${SHARD_KEY} 未写出 findings，回填占位。"
            printf '{"shard":"%s","status":"no_output","summary":"","impact":"","blockers":[],"unconfirmed":[],"not_covered":"本片跑完但没落下结论，这些文件未经评审。"}\n' \
              "${SHARD_KEY}" > "$f"
          fi

      # 每片跑完回来把自己那行打勾，让那条唯一的进度评论真的动起来。
      # 粒度是「每片一次」，不是 track_progress 那种每步一更——后者在分片下会变成
      # N 条评论各自转圈，把 PR 刷满。
      # 并发写同一条评论：两片几乎同时结束时可能丢一次更新，纯显示问题，重试三次即可。
      # continue-on-error：进度显示挂了不该影响评审产出。
      - name: Tick progress
        if: always() && steps.prbranch.outputs.skip != 'true'
        continue-on-error: true
        env:
          # 这两个必须显式给：本文件没有 workflow 级 env，review job 的 env 里也没有，
          # 只有 Prefetch 那步自带。缺了会在本步第一条语句就 KeyError，而
          # continue-on-error 把它咽成绿色——本地手测时它们来自开发者自己的 shell，
          # 这类缺失测不出来。
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHARD_LABEL: ${{ matrix.shard.label }}
          SHARD_KEY: ${{ matrix.shard.key }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time

          MARKER = "<!-- claude-review-progress -->"
          repo, pr = os.environ["GH_REPO"], os.environ["PR_NUMBER"]
          label = os.environ["SHARD_LABEL"]

          # 判据取 findings 文件本身，不取 job.status。`Claude review` 那步在缺凭据时是
          # **被跳过**的，跳过不影响 job 绿——用 job.status 会让一次没人审过的运行把每
          # 一片都打上勾，正是这一步要防的事。回填保证了文件必然存在。
          try:
              data = json.loads(
                  (pathlib.Path("findings") / (os.environ["SHARD_KEY"] + ".json"))
                  .read_text(encoding="utf-8"))
              reviewed = isinstance(data, dict) and data.get("status") != "no_output"
          except Exception:
              reviewed = False

          done = "- [x] `%s`" % label
          if not reviewed:
              done += " —— 未产出结论，本片文件未经评审"
          todo = "- [ ] `%s`" % label

          def gh(*args):
              return subprocess.run(["gh", "api", *args], capture_output=True,
                                    text=True, check=True).stdout

          for attempt in range(3):
              try:
                  # `--paginate` 不带 `--jq` 会把每页各输出一个数组、首尾相接，不是合法
                  # JSON（本文件在预取那处已经踩过并记下了这个坑）。`--jq '.[]'` 逐页
                  # 展开成一行一个对象，跨页拼接后仍可逐行解析。
                  raw = gh("repos/%s/issues/%s/comments" % (repo, pr),
                           "--paginate", "--jq", ".[]")
                  comments = [json.loads(l) for l in raw.splitlines() if l.strip()]
                  target = next((c for c in reversed(comments)
                                 if MARKER in (c.get("body") or "")), None)
                  if target is None:
                      break
                  body = target["body"]
                  if todo not in body:
                      break
                  gh("-X", "PATCH", "repos/%s/issues/comments/%s" % (repo, target["id"]),
                     "-f", "body=" + body.replace(todo, done, 1))
                  break
              except (subprocess.CalledProcessError, ValueError):
                  if attempt == 2:
                      raise
                  time.sleep(2)
          PY

      # 逐轮的工具调用在 Actions 日志里看不到（track_progress: false 不流式输出），
      # 于是「轮数花在哪」只能靠猜，后续调优也就没有依据。这里把 action 写的完整执行
      # 记录留成 artifact，离线就能统计每轮在 Read / Grep / Bash / 思考上的分布。
      - name: Upload transcript
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p transcript
          f="${RUNNER_TEMP}/claude-execution-output.json"
          [ -f "$f" ] && cp "$f" "transcript/${SHARD_KEY}.json" || true

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.shard.key }}
          path: findings/
          if-no-files-found: ignore
          retention-days: 7

      - name: Store transcript artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.shard.key }}
          path: transcript/
          if-no-files-found: ignore
          retention-days: 7

      - name: Warn when credential missing
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "::warning::Secret CLAUDE_CODE_OAUTH_TOKEN not set — skipping Claude review."

  # 阻塞项在进 PR 之前先过一道独立复核。
  #
  # 起因：本仓评审历史上出现过一批标成高危的项，事后逐条核源码几乎全是误报。误报的
  # 代价不对称——放过一个待确认项，作者自己会看到；报一个假阻塞项，PR 被 CHANGES_REQUESTED
  # 挂住，作者要花真时间去证伪一个不存在的问题，几次之后就没人再信这个评审了。
  #
  # 让发现者自评把握（分片 prompt 里的 ≥ 90 分）挡不住这个：同一段上下文里，模型对自己
  # 刚推出来的结论天然高估。所以复核必须换一份干净上下文重来一遍，且**默认立场是驳回**——
  # 拿不出「读了哪个文件哪几行、看到了什么」就判 refuted，不给「看起来像有问题」留出口。
  #
  # job 本身总会起（checkout + 下载 artifact，秒级），但只有真存在阻塞项时才调模型。
  # 多数 PR 没有阻塞项，模型这一步直接跳过，额度开销为零。
  verify:
    timeout-minutes: 20
    needs: [plan, review]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_shards == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR 可能在本轮跑到一半时被合并，分支随即删除，gh pr checkout 会以
      # `couldn't find remote ref` 硬失败（#670 实测：review 片 03:48 切分支成功，
      # verify 03:56 起跑时分支已没了）。此时该跳过而不是留个红叉——PR 都合了，
      # 评审结论已无处可用。exit 0 之后必须把后续步骤一起 gate 掉，否则会拿默认
      # 分支的工作树当 PR 内容评审。
      - name: Checkout PR branch (non-PR events)
        id: prbranch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "::warning::PR #$PR_NUMBER 已是 $state（本轮跑到一半被合并或关闭），跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr checkout "$PR_NUMBER"

      # 全部分片都没产出时一个 artifact 都不存在。download-artifact 在这种情况下是否
      # 静默通过没有保证，硬失败会把 verify 和 verdict 一起带走——那正是要消掉的
      # 「跑挂了 PR 上什么都没有」。下游按「文件缺失 = 该片未覆盖」处理，容得下空目录。
      - name: Download findings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true

      # id 用 `<分片 key>#<该片内序号>` 生成，verdict 会按同样规则重算一遍去对齐结论。
      # 不用全局自增序号：分片是并行的，artifact 下载顺序不保证稳定。
      - name: Collect blockers
        id: collect
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib

          items = []
          for path in sorted(pathlib.Path("findings").glob("*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (ValueError, OSError):
                  continue
              key = path.stem
              for i, b in enumerate(data.get("blockers") or []):
                  # 过滤规则与 verdict 的拼装脚本严格一致，序号同样取自 enumerate。
                  if not isinstance(b, dict):
                      continue
                  items.append({
                      "id": "%s#%d" % (key, i),
                      "shard": data.get("shard", key),
                      "file": b.get("file", ""),
                      "line": b.get("line"),
                      "what": b.get("what", ""),
                      "scenario": b.get("scenario", ""),
                      "evidence": b.get("evidence") or [],
                  })

          pathlib.Path("blockers.json").write_text(
              json.dumps(items, ensure_ascii=False, indent=2), encoding="utf-8")
          print("count=%d" % len(items))
          PY

      - name: Verify blockers
        if: steps.collect.outputs.count != '0' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
          && steps.prbranch.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            上一环节的评审分片报了若干**阻塞项**，全部列在
            `${{ github.workspace }}/blockers.json`（**必须用这个绝对路径读**，工具不接受相对路径）。你的
            工作是逐条**尝试驳回**它们，只让站得住的那些进 PR。

            你不是在复述别人的结论，也不是在补充新问题。发现新问题不归你管，写进
            notes 即可，不要加进 verdicts。

            ## 立场

            **默认驳回。** 每一条的默认判定是 `refuted: true`，只有你自己动手把失效
            场景在源码里走通了，才翻成 `refuted: false`。

            报告方给了 `evidence`（它声称读过的 file:line）。照着去原地读，然后问：

            - 那几行真的写着它说的东西吗？位置对不上、内容对不上，直接驳回。
            - 就算内容对得上，从这几行能推出它描述的失效场景吗？中间缺一环就驳回。
            - 触发这个场景需要的输入/状态，在真实调用路径上到得了吗？到不了就驳回：
              「理论上可以构造出来」不算。
            - 有没有它没看到的上游校验、默认值、早退分支，已经把这个场景挡掉了？
              `git grep` 调用方确认。挡掉了就驳回。

            拿不准就驳回。放过一个真问题，作者和后续的 CI 还有机会拦；放行一个假问题，
            PR 被挂住、作者花时间证伪一个不存在的东西，几次之后没人再信这个评审。

            ## 轮次预算

            互不依赖的 Read / Grep / git 调用放在同一条消息里并发发出。每条阻塞项分到
            的预算有限，先照 evidence 直接定位，别从头通读整个模块。

            最后一步必须写出 `${{ github.workspace }}/verified.json`（绝对路径）。没写就等于整个复核
            环节失效，所有阻塞项会以「未复核」的身份进 PR。

            ## 产出

            写 `${{ github.workspace }}/verified.json`，`verdicts` 必须覆盖 `blockers.json`
            里的每一个 id：

            ```json
            {
              "verdicts": [
                {"id": "adp-bkn#0", "refuted": true,
                 "reason": "驳回或确认的理由，指明你读了哪个文件的哪几行"}
              ],
              "notes": "复核过程中顺带发现的、但不属于本次阻塞项的事情，可以为空串"
            }
            ```

            `reason` 里必须出现你**这一轮真读过的** file:line。这是复核结论本身的
            evidence，写不出来的结论和它要驳回的东西是同一种毛病。

            `reason` **一律用中文**。它会原样进 verdict 正文，与骨架和分片给的文字
            并排显示，语言不一致会读成两份东西。
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --max-turns 40
            --allowedTools "Read,Grep,Glob,LS,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*)"

      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            blockers.json
            verified.json
          if-no-files-found: ignore
          retention-days: 7

  verdict:
    # always()：任一分片撞上限、超时或崩掉，都要照样表态并写明哪片没覆盖。
    # 「跑挂了 PR 上什么都没有」正是分片要消掉的失败模式，这里是它的落点。
    needs: [plan, review, verify]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_shards == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
      SHARDS: ${{ needs.plan.outputs.shards }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FILE_TOTAL: ${{ needs.plan.outputs.file_total }}
      FILE_LISTED: ${{ needs.plan.outputs.file_listed }}
      GH_TOKEN: ${{ github.token }}
      # 同 plan：这个 job 也不 checkout，没有 GH_REPO 的话最后那条 gh pr review
      # 会在「确定 base repo」这一步就失败——分片全跑完、verdict.md 也拼好了，
      # 唯一一次表态却落不下去，「一定有一次表态」的设计在最后一米断掉。
      GH_REPO: ${{ github.repository }}
    steps:
      # 全部分片都没产出时一个 artifact 都不存在。download-artifact 在这种情况下是否
      # 静默通过没有保证，硬失败会把 verify 和 verdict 一起带走——那正是要消掉的
      # 「跑挂了 PR 上什么都没有」。下游按「文件缺失 = 该片未覆盖」处理，容得下空目录。
      - name: Download findings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true

      # verify 整个挂掉时这个 artifact 不存在，下一步会把全部阻塞项标成「未复核」
      # 照常报上去——复核缺席只该降低可信度，不该让阻塞项静默消失。
      - name: Download verification
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: verification
          path: verification

      # 汇总用确定性脚本，不再起一个模型：拼接已有结论不需要判断力，也不该有编造空间。
      - name: Assemble verdict
        id: assemble
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib

          shards = json.loads(os.environ["SHARDS"])
          root = pathlib.Path("findings")

          import collections

          done, missing, blockers, unconfirmed, lines = [], [], [], [], []
          for s in shards:
              path = root / (s["key"] + ".json")
              if not path.exists():
                  missing.append((s, "absent"))
                  continue
              # 防御要罩住整个循环体，不能只罩 json.loads：文件解析成顶层数组时
              # data.get() 抛 AttributeError，同样会让 Assemble 非零退出。
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if not isinstance(data, dict):
                      raise ValueError("not an object")
                  # 回填的占位不算「产出过结论」：否则全片静默失败会变成 approve 一个
                  # 从没被审过的 PR——比不表态糟得多。
                  status = data.get("status")
              except (ValueError, OSError, AttributeError):
                  missing.append((s, "malformed"))
                  continue
              if status == "no_output":
                  missing.append((s, "no_output"))
                  continue
              done.append((s, data))
              # findings 是模型写的，属于不可信输入：JSON 合法但结构不对（元素是字符串
              # 而非对象）会让下面的 dict()/get() 抛异常，Assemble 非零退出后 Post review
              # 不执行、告警分支也不成立——PR 上既无表态也无告警，只剩一个红叉。
              # 序号取自 enumerate 而非计数器，跳过畸形元素不会让 id 错位（id 是
              # survived/refuted 分类的唯一依据，错位会把复核结论贴到别的阻塞项上）。
              # verify 的 collect 步骤必须用完全相同的过滤规则。
              for i, b in enumerate(data.get("blockers") or []):
                  if not isinstance(b, dict):
                      continue
                  # id 规则必须与 verify 的 collect 步骤一致：<分片 key>#<片内序号>。
                  b = dict(b, id="%s#%d" % (s["key"], i))
                  blockers.append((s, b))
              for u in data.get("unconfirmed") or []:
                  if isinstance(u, dict):
                      unconfirmed.append((s, u))

          # 一片都没产出（多半是 secret 缺失或全线失败）：不表态，只留告警。
          # 此时 request-changes 会拿一个「什么都没审」当阻塞理由挂住 PR。
          if not done:
              print("action=none")
              raise SystemExit(0)

          # 复核结论：refuted 的阻塞项不进 PR，只留在折叠区里备查——全部丢掉的话，
          # 复核环节把真问题误杀了也没人看得见。
          verdicts = {}
          vpath = pathlib.Path("verification/verified.json")
          if vpath.exists():
              try:
                  for v in json.loads(vpath.read_text(encoding="utf-8")).get("verdicts") or []:
                      verdicts[v.get("id")] = v
              except (ValueError, OSError):
                  verdicts = {}

          # 机器人贴到 PR 上的文字一律中文：结论骨架、分片名、进度评论、空转通告、
          # 回填占位、verify 的驳回理由，全部同一种语言。曾按分片投票在 zh/en 之间切换，
          # 结果是骨架跟着投票走、分片名等仍写死中文，拿到的是混排文档——所以不做切换，
          # 定死一种。注意这与「我们自己写的 PR 标题与正文用英文」是两回事，别混淆。
          T = {"block": "阻塞项",
               "verified": "以下每一条都经过一轮独立复核（默认驳回，核实通过才保留）。",
               "unrev": "（**未复核**，复核环节未产出结论）",
               "scen": "失效场景：",
               "dropped": "复核未通过、已丢弃的 %d 条", "why": "驳回理由：",
               "byshard": "各分片结论", "impact": "影响范围：", "notcov": "未覆盖：",
               "clean": "_（无问题）_", "counts": "_（阻塞 %d，待确认 %d）_",
               "detail": "各分片的影响范围与未覆盖面",
               "more_unconf": "另有 %d 条待确认项已省略，以免正文过长；详见各分片日志。",
               "unconf": "待确认项（不阻断放行）", "missing": "未产出结论的分片",
               "missing_body": "下面这些分片没有产出结论，**这些文件本轮未经评审**：",
               "reason_no_output": "跑完了但没落下结论（多半是撞轮次上限或提前收尾）",
               "reason_absent": "整个分片没跑起来或中途挂了",
               "reason_malformed": "写出的结论文件解析不了",
               "trunc": "文件清单被截断",
               "trunc_body": "本 PR 共 %s 个改动文件，分片只拿到 %s 个（`gh pr view --json files` 单次上限 100），**其余 %d 个未进入任何分片、本轮未经评审**。",
               "footer": "改完请推新提交，或回复 `/review` 要一轮复评。",
               "footer_ok": "有异议或想再评一轮，请回复 `/review`——普通回帖不会触发复评，且回帖人需为本仓 OWNER/MEMBER/COLLABORATOR。"}

          # 模型不一定听话，长度要有确定性兜底——与「模型输出是不可信输入」同一思路。
          def clip(x, n):
              x = " ".join(str(x).split())
              return x if len(x) <= n else x[:n - 1].rstrip() + "…"

          survived, refuted, unreviewed = [], [], []
          for s_, b in blockers:
              v = verdicts.get(b["id"])
              if v is None:
                  unreviewed.append((s_, b, None))
              elif v.get("refuted"):
                  refuted.append((s_, b, v))
              else:
                  survived.append((s_, b, v))

          # 未复核的仍然当阻塞项报，但在正文里标出来——复核缺席是降可信度，不是免罪。
          blockers = [(s_, b) for s_, b, _ in survived + unreviewed]

          if blockers:
              lines.append("## %s\n" % T["block"])
              lines.append(T["verified"] + "\n")
              for s_, b in blockers:
                  loc = b.get("file", "")
                  if b.get("line"):
                      loc += ":%s" % b["line"]
                  mark = "" if verdicts.get(b["id"]) else T["unrev"]
                  lines.append("- **[%s] %s** — %s%s"
                               % (s_["label"], loc, clip(b.get("what", ""), 300), mark))
                  if b.get("scenario"):
                      lines.append("  %s%s" % (T["scen"], clip(b["scenario"], 300)))
              lines.append("")

          if refuted:
              lines.append("<details><summary>" + (T["dropped"] % len(refuted)) + "</summary>\n")
              for s_, b, v in refuted:
                  lines.append("- **[%s] %s** — %s" % (s_["label"], b.get("file", ""),
                                                       clip(b.get("what", ""), 200)))
                  lines.append("  %s%s" % (T["why"], clip(v.get("reason", ""), 200)))
              lines.append("\n</details>\n")

          # 标量字段同样是不可信输入：这里用 + 拼接（而非 %s 格式化）要求 str，
          # 模型把 impact 写成数组就抛 TypeError，失败形态与上面挡掉的畸形元素一致
          # ——Assemble 非零退出后既无表态也无告警。一律套 str()。
          # 每片一行，详情折叠。改造前影响范围是整个 PR 写一次，分片后变成每片各写一段，
          # 实测把结论正文撑到了改造前的 3 倍——阻塞项被埋在中间没人看得见。
          lines.append("## %s\n" % T["byshard"])
          for s, data in done:
              n_b = len([b for _, b in blockers if _ is s])
              n_u = len([u for ss, u in unconfirmed if ss is s])
              tag = T["clean"] if not (n_b or n_u) else T["counts"] % (n_b, n_u)
              lines.append("- **%s** — %s %s" % (s["label"], clip(data.get("summary") or "", 240), tag))
          lines.append("")

          detail = []
          for s, data in done:
              extra = [(T["impact"], data.get("impact")), (T["notcov"], data.get("not_covered"))]
              extra = [(k, v) for k, v in extra if str(v or "").strip()]
              if not extra:
                  continue
              detail.append("**%s**" % s["label"])
              detail += ["- %s%s" % (k, clip(v, 200)) for k, v in extra]
              detail.append("")
          if detail:
              lines.append("<details><summary>%s</summary>\n" % T["detail"])
              lines += detail
              lines.append("</details>\n")

          # 每片至多 3 条，且整体封顶——各片各写各的，不封顶就会线性膨胀。
          if unconfirmed:
              lines.append("## %s\n" % T["unconf"])
              # 轮转取，不是先到先得：contract 片固定排在最后，先到先得会让多模块 PR
              # 上它的待确认项被前面的模块片整片挤掉，而它恰恰是唯一看跨模块的。
              by_shard = collections.OrderedDict()
              for s, u in unconfirmed:
                  by_shard.setdefault(s["key"], []).append((s, u))
              shown = 0
              for rnd in range(2):
                  for k, items in by_shard.items():
                      if len(items) <= rnd or shown >= 6:
                          continue
                      s, u = items[rnd]
                      shown += 1
                      lines.append("- **[%s] %s** — %s"
                                   % (s["label"], u.get("file", ""), clip(u.get("what", ""), 220)))
              dropped_u = len(unconfirmed) - shown
              if dropped_u > 0:
                  lines.append("- _%s_" % (T["more_unconf"] % dropped_u))
              lines.append("")

          if missing:
              lines.append("## %s\n" % T["missing"])
              lines.append(T["missing_body"] + "\n")
              # 两种原因指向完全不同的修法（轮次预算 vs job 失败），所以要分开写，
              # 不能都渲染成一行「未覆盖」。
              for s, reason in missing:
                  lines.append("- %s — %s" % (s["label"], T["reason_" + reason]))
              lines.append("")

          dropped = int(os.environ.get("FILE_TOTAL") or 0) - int(os.environ.get("FILE_LISTED") or 0)
          if dropped > 0:
              lines.append("## %s\n" % T["trunc"])
              lines.append(T["trunc_body"] % (os.environ["FILE_TOTAL"],
                                          os.environ["FILE_LISTED"], dropped) + "\n")

          # approve 之后作者仍可能想争一句，而普通回帖不触发复评（评论正文必须含
          # /review 或 @claude）。不写这句，他没有别的途径知道这件事。
          lines.append(T["footer"] if blockers else T["footer_ok"])

          pathlib.Path("verdict.md").write_text("\n".join(lines), encoding="utf-8")
          print("action=" + ("request-changes" if blockers else "approve"))
          PY

      # 待确认项与「未覆盖的分片」都不阻断放行：写进 approve 的 body 当提示，由作者
      # 自行判断。为了等一个回应而改用 --request-changes，只会把 PR 挂在那里。
      # PR 可能在评审跑的这几分钟里被合并（#670 实测：03:53 合并，03:56 verdict 仍贴出
      # 一条 CHANGES_REQUESTED）。merge 已不可逆，此时表态纯属噪声，还会让人误以为
      # 合进去的东西有阻塞项。job if 里的 state == 'open' 是在事件到达时求值的，拦不住
      # 跑到一半才发生的合并，只能在落地前再查一次。
      # 组织策略禁止 GitHub Actions 批准 PR，而 main 的 ruleset 要求 1 个 approval——
      # 两条撞在一起，github-actions[bot] 发的 approve 会被 GraphQL 拒，评审就过不了
      # 合并门。禁令只针对 github-actions[bot]，GitHub App 身份不受限（分片前由
      # claude-code-action 以 claude[bot] 身份表态，正是靠这一点过门的）。
      #
      # 配了 REVIEW_APP_ID / REVIEW_APP_PRIVATE_KEY 就用 App 身份表态；没配则退回
      # github.token，approve 失败时由下面的兜底改贴评论。两条路都不会让结论丢掉。
      - name: Mint reviewer token
        id: apptoken
        if: vars.REVIEW_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}

      # 没配 App 凭据时 approve 交给下一步的 claude[bot] 身份；这里只发
      # request-changes——那不算批准，github-actions[bot] 发得出去。
      - name: Post review
        id: post
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
        if: steps.assemble.outputs.action != 'none' && (vars.REVIEW_APP_ID != '' || steps.assemble.outputs.action == 'request-changes')
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "::warning::PR #$PR_NUMBER 已是 $state，跳过表态。结论见下方 job summary。"
            cat verdict.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.assemble.outputs.action }}" = "request-changes" ]; then
            gh pr review "$PR_NUMBER" --request-changes --body-file verdict.md
          elif ! gh pr review "$PR_NUMBER" --approve --body-file verdict.md; then
            # 仓库若关闭「Allow GitHub Actions to create and approve pull requests」，
            # approve 会被 GraphQL 拒（request-changes 不受限，因为那不算批准）。
            # 结论不能因此丢掉——改贴普通评论，并说清为什么没有评审状态。
            echo "::warning::approve 被拒，改以评论形式给出结论。"
            {
              cat verdict.md
              printf '\n\n---\n\n_本轮没有阻塞项。仓库当前禁止 GitHub Actions 批准 PR，因此以评论形式给出结论，没有 APPROVED 状态。需要自动批准的话，在 Settings → Actions → General 打开「Allow GitHub Actions to create and approve pull requests」。_\n'
            } > verdict-comment.md
            gh pr comment "$PR_NUMBER" --body-file verdict-comment.md
          fi

      # 第二级：没配 App 凭据、且这轮判为 approve 时，借 claude-code-action 的身份发。
      # 它以 claude[bot] 这个 GitHub App 登场，不在「Actions 不能批准」的禁令内——
      # 分片前的 approval 正是这么落的。
      #
      # 这确实把模型放回了表态路径，而那是「汇总用确定性脚本」特意挡掉的。所以压到
      # 最薄：结论正文已在 verdict.md 里，命令用 --body-file 传路径，模型不需要复述
      # 任何文本，也无从改动；approve 还是 request-changes 在上一步就定死了，这里只
      # 会走到 approve 一条路；allowedTools 只给一条 gh pr review。
      - name: Post approval as the app identity
        id: postapp
        if: steps.assemble.outputs.action == 'approve' && vars.REVIEW_APP_ID == '' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: false
          prompt: |
            只做一件事，做完就停：执行下面这条命令，一个字都不要改。

            gh pr review ${{ env.PR_NUMBER }} --approve --body-file ${{ github.workspace }}/verdict.md

            不要评审这个 PR，不要读 verdict.md 再复述它的内容，不要追加任何说明，
            不要改用别的 flag。结论已经由上游环节定好，你只是执行者。
          claude_args: |
            --model claude-opus-5
            --effort low
            --max-turns 5
            --allowedTools "Bash(gh pr review:*)"

      # always()：不管有没有落表态（PR 中途被合并也会跳过表态），这条过程态评论都要
      # 清掉，否则会永远停在「评审进行中」误导后来的人。
      - name: Remove progress comment
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          MARKER='<!-- claude-review-progress -->'
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | .[]" \
          | while read -r id; do
              gh api -X DELETE "repos/${GH_REPO}/issues/comments/${id}" >/dev/null
            done

      # 静默是最坏的结果：PR 上什么都没有，与「压根没触发」无法区分——#671 首轮就是
      # 这样被当成没触发的。这里不落评审状态（没审过就不该 request-changes，也不该
      # approve），但必须留一条普通评论说明这轮空转了。
      # 这一轮真落了表态，就把上一轮的空转通告删掉——否则作者会在第 4 轮的结论旁边
      # 读到第 3 轮的「本轮评审空转」。
      - name: Clear stale empty-round notice
        if: steps.post.outcome == 'success' || steps.postapp.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          MARKER='<!-- claude-review-empty -->'
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | .[]" \
          | while read -r id; do
              gh api -X DELETE "repos/${GH_REPO}/issues/comments/${id}" >/dev/null
            done

      # 判据取 Post review 的**实际结果**，不取 Assemble 的意图：Assemble 崩掉时
      # output 没写出来、Post review 被跳过；gh pr review 自己失败时意图是 approve
      # 但 PR 上什么都没有。两种都必须通告，否则进度评论被删、原地不留任何东西。
      # 两条表态路径任一成功就不算空转。
      - name: Report empty round
        if: always() && steps.post.outcome != 'success' && steps.postapp.outcome != 'success'
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::warning::本轮未落评审表态。"
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          [ "$state" = "OPEN" ] || exit 0
          MARKER='<!-- claude-review-empty -->'
          body=$(printf '%s\n### 本轮评审没有产出结论\n\n没有分片落下结论，**这些改动本轮未经评审**。没有表态是因为无从表态——既不该 request-changes，也不该 approve。\n\n常见原因：分片撞轮次上限、模型未写出结论文件、汇总步骤失败、凭据缺失。[查看运行日志](%s)\n\n回复 `/review` 可以再要一轮。下一轮真出了结论，这条会自动消失。' "$MARKER" "$RUN_URL")
          # 复用同一条：synchronize 每次推送跑一轮，凭据缺失这类持续故障否则会在 PR 上
          # 堆出一串一模一样的通告，正是进度评论当初特意避开的噪声。
          existing=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | last // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
