name: Claude Code Review

# 由 Claude 对 PR 做代码评审：开启、重开、从 draft 转 ready、每次推送新提交时各跑
# 一次；此外可在评论里写 `/review` 或 `@claude` 手动要一轮。
#
# 覆盖每次推送而非只审首版，是因为评审之后追加的提交往往是「按意见快速改一下」，
# 恰恰最容易引入新问题；只审首版会让这部分完全不过审。
# 连续推送的浪费由下面的 concurrency 收敛：新一次运行会取消尚未完成的上一次。
# 「推提交」与「回帖 /review」若在同一段时间内发生，同样收敛成一轮——两个入口都保留，
# 合并掉的只是重复劳动：存活的那轮 checkout 拿的是 PR 最新 HEAD（含新提交），而下方
# prompt 本就要求读回既有 inline 评论与其下的回复，代码与回复两边都不会漏。
#
# 评论也能触发复评，但必须在正文里显式写 `/review` 或 `@claude`。早先是每条评论都跑
# 一轮，作者每回一帖就复评一次，轮次膨胀且额度白烧——待确认项现在不阻断放行（见下方
# prompt），自动复评失去了存在理由，改成按需触发。两个口令都收是因为 `@claude` 已是
# 团队既有习惯，本仓没有别的 workflow 接管它；只认 `/review` 会让这个写法在合并后
# 静默失效，连提示都没有。注意 contains 是子串匹配，评论里粘到含 `/review` 字样的
# 链接或命令会误触发一轮——代价是一次评审，未做更严的匹配。
# 为避免自我循环，评论事件由下方 job 的 if 过滤掉 bot 自己的评论，并限定发起者为
# OWNER/MEMBER/COLLABORATOR——评论事件在 base 仓上下文携带 secret 运行，限定关联方
# 可挡掉 fork 陌生人触发的 pwn-request。
#
# 需要对任意 PR 重新评审时，手动触发 workflow_dispatch 并填 PR 编号。
#
# pull_request 触发只对代码路径生效；纯配置类改动（release manifest 刷新、镜像同步、
# workflow 自身调整、文档）不进评审，既省额度也避免噪声。
# 注意：GitHub Actions 不允许同一事件同时使用 paths 与 paths-ignore，因此这里
# 只写 include 列表——未列出的路径自动跳过——并用 ! 前缀排除列表内的文档文件。
# 评论事件不支持 paths 过滤，靠 job if 与 Claude 自身判断相关性。

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'adp/**'
      - 'infra/**'
      - 'bkn-safe/**'
      - 'comm-go/**'
      - 'deploy/scripts/**'
      - '!**/*.md'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  # 分组判据是「这条事件能不能过下方 job 的 if」，不是「它是不是评论事件」。
  #
  # 能过 if 的（推送、人工写 `/review`/`@claude` 的评论、手动触发）全部落 -review 组，
  # cancel-in-progress 生效：连续推送时新 run 取消旧 run；作者「推提交 + 回帖 /review」
  # 这种连续动作也收敛成一轮，而不是推送和评论各跑一轮。
  #
  # 过不了 if 的评论（bot 自己贴的进度/行内评论、外部人员的评论、不含口令的普通回帖）
  # 必须按 comment.id 各自成组。concurrency 在 run 排队时求值，早于 job if，落进共享组
  # 就会在 if 把它过滤掉之前先取消掉正在跑的评审。claude-code-action 的 tracking comment
  # 与 create_inline_comment 正是这条路径——曾导致评审贴出第一条评论那刻就自杀。
  #
  # 因此下面的判据必须与 job if 的评论分支逐条对齐（非 bot、含口令、author_association
  # 属 OWNER/MEMBER/COLLABORATOR）。漏对一条，那类事件就能溜进共享组杀掉正在跑的评审。
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}-${{ (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && !(github.event.sender.login != 'github-actions[bot]' && (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) && format('comment-{0}', github.event.comment.id) || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    # 逐事件放行：
    #   - workflow_dispatch：手动，总放行。
    #   - pull_request：只同仓 PR（fork 拿不到 secret，跳过避免红叉）。
    #   - 评论/行内回复：必须挂在 PR 上、PR 仍 open、评论正文含 `/review` 或
    #     `@claude`、非 bot 自己发的、且发起者为 OWNER/MEMBER/COLLABORATOR，
    #     挡掉自我循环与 fork 陌生人的 pwn-request。
    #     state == 'open' 让合并/关闭后的评论不再触发复评——merge 已不可逆，
    #     再跑只是白费额度、在死 PR 上贴噪声。
    #     口令过滤把「每回一帖跑一轮」压成按需触发，评审轮次由人决定。
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.pull_request.state == 'open' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.sender.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.sender.login != 'github-actions[bot]' &&
       (contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
    steps:
      # 推送事件先静默一小会儿再往下走。作者（多数时候是 agent）常见动作是
      # `git push` 紧接着 `gh pr comment "/review"`，两条事件各触发一次评审；静默期内
      # 后一条到达时，上面的 concurrency 会把本 run 取消，而此刻还没 checkout、没调
      # Claude、没贴 tracking comment，取消的代价是零。等满则照常跑，只晚十几秒。
      # 只挂 pull_request：评论触发与手动触发都是人明确要一轮，不该让它等。
      - name: Debounce push events
        if: github.event_name == 'pull_request'
        run: sleep 15

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # pull_request 事件下 checkout 会自动落到 PR 的 merge ref；其它事件
          # （手动触发、评论、行内回复）只会拿到默认分支，需要下一步显式切到
          # PR 分支，因此这里放开深度以便 gh pr checkout 能建立分支。
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Checkout PR branch (non-PR events)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr checkout "$PR_NUMBER"
          echo "已切到 PR #$PR_NUMBER: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

      - name: Claude review
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress 只支持 pull_request / issues / issue_comment /
          # pull_request_review(_comment) 事件，在 workflow_dispatch 下会直接
          # 报错退出——手动触发那条路径因此从未可用。按事件类型开关。
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            对这个 PR 做代码评审。仓库是 openbkn 单体仓，包含 Go / Python 微服务、
            Helm chart 与部署脚本。协作规范见 rules/CONTRIBUTING.zh.md。

            ## 轮次预算（先读这一节）

            这个任务有轮次上限。撞上限意味着整轮评审零产出，比漏掉一条意见糟得多。因此：

            - 互不依赖的 Read / Grep / Glob / git 调用放在同一条消息里并发发出，不要一轮
              发一条。逐条串行是耗尽轮次的首要原因。
            - 先用一次 `gh pr diff` 判断改动规模与类型，据此决定深挖到哪一层，不要对每个
              文件都做满下面全部动作。
            - 用掉大约三分之二轮次时停止深挖，用已经核实的内容收敛出结论。
            - 最后一步必须是一次 `gh pr review`。宁可给一份范围有限、并在 body 里写明
              「本轮只核到 X，未覆盖 Y」的结论，也不要什么都不产出。

            ## 关注面（按优先级）

            1. **正确性** — 逻辑错误、边界条件、错误处理缺失、并发/竞态、资源泄漏
               （未关闭的连接、goroutine 泄漏）。
            2. **安全** — 凭据硬编码、鉴权/授权绕过、注入、越权访问内部接口、日志泄露
               敏感信息。
            3. **兼容性** — 数据库迁移是否幂等、接口是否破坏既有调用方、Helm values 变更
               是否会让存量环境升级失败。这是本仓的高频事故来源。
            4. **测试** — 新增逻辑是否有覆盖，测试是否验证了真实行为。

            评审的对象是**改动带来的整体影响**，不是这份 diff 的文本。每一处改动都要先
            回答：谁在依赖它、它原本承诺了什么、改完之后这些承诺是否仍然成立。下面四个面
            用 `git grep` / 读源码确认，不要推测：

            - **调用方与被调方**：改动的函数、接口、字段，找出引用点核对新语义是否仍然
              成立；跨服务调用要把另一侧的实现一起读，别只看本服务这一半。
            - **跨模块契约**：同一能力在 REST 路由、MCP 工具定义、.adp 描述、SDK、CLI 等
              多处各有一份声明，必须同步改。只改其中一处就是线上不一致。
            - **配置与部署面**：Helm values、configmap、环境变量、chart 默认值的改动，要
              分别核存量环境升级（沿用旧值会不会失效、缺省值会不会被覆盖）与全新安装。
            - **数据面**：落库字段、索引结构、消息体格式的变化，要确认存量数据仍能被新
              代码正确读出；滚动升级期间新旧版本并存，两边必须互相兼容。

            ## 触发式深挖（diff 命中才做，没命中直接跳过）

            这几类改动只读 diff 必然看不出问题（本仓已因「只读 diff」连续三轮漏过一个
            阻断项），命中时必须走出 diff 核源码：

            - **整份快照类文件**（migrations/*/init.sql、lock 文件、生成物）：
              `git show <ref>:<上一版本同名文件>` 取前一版逐行比对，确认差异只有本次应有
              的那几处。全量快照最容易夹带丢列、改名、复活废弃列，而这些在 diff 里全是
              `+`，读不出来。
            - **字段 / 参数的改名或删除**：定义其语义的文件通常不在 diff 里。`git grep`
              旧名确认无残留，并读配置与校验定义（例如连接器 field_config 中某项是否
              `Required: false`），确认新逻辑没把原本合法的取值判成非法。
            - **被删掉的代码**：先问它在维护什么不变量。删掉一个分支等于不再保证那个
              不变量，必须确认对应的输入形态确实已经不存在，而不是「当前主路径不会
              产生」——存量数据仍会产生。
            - **migrations/ 改动**：分别核全新安装（只执行最大版本目录的 init.sql）与存量
              升级（只按序执行 NN-*.sql 并跳过 init.sql，见 data-migrator/server/migrate/
              script_selector.py）。两条路径最终 schema 必须一致，且都要与代码实际引用的
              列对齐——把相关 f_ 列名 `git grep` 到 drivenadapters 层核对。

            ## 复评（作者推了新提交）

            目标是收敛，不是每轮重开一次全面评审：

            - 先读回上一轮的 inline 评论与其下回复：`gh pr view "$PR_NUMBER" --json
              reviewDecision,comments` 与 `gh api
              "repos/${{ github.repository }}/pulls/$PR_NUMBER/comments"`。
            - 已经提过的问题，作者改了、或给出对得上疑点的解释，就算过。不必追求措辞
              完美，更不要凭「可能」把同一条追问第二遍。
            - 上面的触发式深挖只在首轮做；复评的范围限定在上一轮之后新增的提交与文件。
            - 第二轮起，除非发现你能说清失效场景的确定阻断项，否则就 approve。

            ## 产出

            - **语言跟随 PR**：PR 标题与描述用哪种语言，评审就用哪种语言，inline
              comment 与顶层结论都一样。判据是 PR 本身，不是 diff 里的注释语言，也不是
              仓库的默认语言——本仓多数 PR 是中文，但外部协作者提的 PR 用英文时，回中文
              等于让对方读不懂自己的评审。混合语言时按标题与描述的主体语言走。
              代码标识符、错误信息、命令、路径一律保持原样，不翻译。
            - 具体问题用 inline comment 贴到对应行，说明「问题是什么 + 怎么改」。
            - 顶层 comment 只写整体判断、影响范围（波及哪些服务、接口、存量数据）、阻塞项
              清单、待确认项清单。不复述 diff，不为凑数提格式化/命名类琐碎意见，没问题就
              说没问题。

            落成一次 PR review（不是普通评论），二选一：

            1. 有阻塞项 → `gh pr review "$PR_NUMBER" --request-changes
               --body "<阻塞清单>"`。阻塞项的门槛是：你已经读过源码核实，能说清具体的
               失效场景（什么输入、什么状态、坏成什么样），并且自评把握 ≥ 90 分。说不清、
               或失效场景里有任何一环没在代码里核实过，都不算阻塞项——降级成 approve body
               里的待确认项，或者直接丢掉。
               body 末尾固定带一句「改完请推新提交，或回复 `/review` 要一轮复评」——
               CHANGES_REQUESTED 会一直挡着合并，而改动若落在本 workflow 的 paths 之外，
               推提交并不会自动复评，作者必须知道怎么把这个状态解掉。
            2. 没有阻塞项 → `gh pr review "$PR_NUMBER" --approve --body "<放行理由>"`。
               待确认项不阻断放行：写进 approve 的 body 里当提示，由作者自行判断，不要为了
               等一个回应而改用 --comment 或 --request-changes。

            不要把 CI 当放行条件。CI 全绿是 Branch Protection 的独立闸门，合并时自然会拦住，
            评审只判代码本身。必需检查还在跑、甚至已经失败，都照常按上面二选一表态；失败
            如果明显由这份改动引起，在 body 里点一句即可，不改变结论。

            批准以 github-actions[bot] 身份提交，只表态、不合并。人工仍需自行 merge。

          # 48 文件 / 28 commit 这种大 PR，只给 gh pr diff 不够：Claude 需要进
          # 文件看上下文、比对具体 commit，会伸手 Read/Grep/git diff 等未授权工具而被拒。
          # 之前一次评审因此连撞 12 次 permission denial、耗尽轮次、评论冻在「进行中」。
          # 补齐只读检视工具（Read/Grep/Glob/LS + git diff/log/show）与 PR review/checks/api
          # 并放宽轮次上限。
          #
          # 轮次上限 60 → 80：#662（跨两模块 13 文件）连撞两次 error_max_turns，
          # num_turns 61 后整轮零产出，单次约 5 美元全部白烧。上限只是刹车、跑不满
          # 不计费，但光抬上限治标——同时在 prompt 顶部加了轮次预算一节（并发发起
          # 互不依赖的工具调用、深挖改成 diff 命中才触发、三分之二轮次时收敛、
          # 最后一步必须落 gh pr review），把「耗尽后什么都没有」这个失败模式堵死。
          claude_args: |
            --model claude-opus-5
            --effort xhigh
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,LS,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*)"

      - name: Warn when credential missing
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          echo "::warning::Secret CLAUDE_CODE_OAUTH_TOKEN not set — skipping Claude review."
