name: ci-adp-bkn

# Compile and unit-test gate for PRs touching adp/bkn.

on:
  pull_request:
    paths:
      - 'adp/bkn/**'
      - 'migrations/bkn-project/**'
      - 'infra/sandbox/runtime/sandbox_sdk/**'
      - '.github/workflows/ci-adp-bkn.yml'

permissions:
  contents: read

concurrency:
  group: ci-adp-bkn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bkn-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: adp/bkn/bkn-backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adp/bkn/bkn-backend/server/go.mod
      - run: go build ./...
      - name: Run BKN backend unit tests
        env:
          I18N_MODE_UT: "true"
        run: go test -count=1 -gcflags="all=-l" ./...

  # bkn-project is a Professional capability and lives in openbkn-ee (adp/bkn/bkn-project); neither
  # its code nor its tables may come back to the open core.
  no-bkn-project:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The open core carries no bkn-project
        run: |
          set -u
          if [ -e adp/bkn/bkn-project ] || [ -e migrations/bkn-project ]; then
            echo "::error::bkn-project belongs to the professional edition (openbkn-ee adp/bkn/bkn-project)."
            exit 1
          fi

  ontology-query:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: adp/bkn/ontology-query/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adp/bkn/ontology-query/server/go.mod
      - uses: azure/setup-helm@v4
      - name: Check rendered metric snapshot configuration
        working-directory: adp/bkn/ontology-query
        run: make test-helm
      - run: go build ./...
      - name: Run ontology query unit tests
        env:
          I18N_MODE_UT: "true"
        run: go test -count=1 -gcflags="all=-l" ./...
      - name: Managed Function real Sandbox SDK regression
        env:
          I18N_MODE_UT: "true"
          BKN_ACTION_SDK_TEST: "true"
        run: |
          sudo install -d -m 1777 /workspace
          go test -race -tags=integration ./logics/action_scheduler -run '^TestManagedActionFunctionRealSandboxSDK$' -count=1 -v
