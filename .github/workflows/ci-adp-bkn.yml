name: ci-adp-bkn

# Compile and unit-test gate for PRs touching adp/bkn.

on:
  pull_request:
    paths:
      - 'adp/bkn/**'
      - '.github/workflows/ci-adp-bkn.yml'

permissions:
  contents: read

concurrency:
  group: ci-adp-bkn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bkn-backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: adp/bkn/bkn-backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adp/bkn/bkn-backend/server/go.mod
      - run: go build ./...
      - name: Run BKN backend unit tests
        env:
          I18N_MODE_UT: "true"
        run: go test -count=1 -gcflags="all=-l" ./...

  bkn-project:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: adp/bkn/bkn-project/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adp/bkn/bkn-project/server/go.mod
      # The knowledge base of bkn-project is in the professional edition; the open core keeps only
      # the edition hooks. Neither its packages nor its tables may come back here.
      - name: Core keeps no knowledge base
        working-directory: .
        run: |
          set -u
          latest=$(ls migrations/bkn-project/mariadb | sort -V | tail -1)
          hits=$(grep -rnE 'logics/kb|logics/docdraft|t_bkn_project_kb_' adp/bkn/bkn-project/server "migrations/bkn-project/mariadb/${latest}/init.sql" || true)
          if [ -n "$hits" ]; then
            echo "::error::Knowledge-base code or tables found in the open core; they belong to the professional edition."
            echo "$hits"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - name: Run BKN project unit tests
        env:
          I18N_MODE_UT: "true"
        run: go test -count=1 -gcflags="all=-l" ./...

  ontology-query:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: adp/bkn/ontology-query/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: adp/bkn/ontology-query/server/go.mod
      - uses: azure/setup-helm@v4
      - name: Check rendered metric snapshot configuration
        working-directory: adp/bkn/ontology-query
        run: make test-helm
      - run: go build ./...
      - name: Run ontology query unit tests
        env:
          I18N_MODE_UT: "true"
        run: go test -count=1 -gcflags="all=-l" ./...
      - name: Managed Function real Sandbox SDK regression
        env:
          I18N_MODE_UT: "true"
          BKN_ACTION_SDK_TEST: "true"
        run: |
          sudo install -d -m 1777 /workspace
          go test -race -tags=integration ./logics/action_scheduler -run '^TestManagedActionFunctionRealSandboxSDK$' -count=1 -v
