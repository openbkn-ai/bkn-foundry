name: ci-bkn-trace

on:
  pull_request:
    paths:
      - 'bkn-trace/**'
      - 'infra/bkn-agent/charts/**'
      - 'infra/bkn-agent/scripts/test_evidence_kafka_chart.sh'
      - 'docs/api/agent-observability/**'
      - '.github/workflows/ci-bkn-trace.yml'

permissions:
  contents: read

concurrency:
  group: ci-bkn-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: trace-ci-password
          MARIADB_DATABASE: bkn_trace_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2.19.4
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: bkn-trace/agent-observability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bkn-trace/agent-observability/go.mod
      - name: Static analysis
        uses: ./.github/actions/golangci-lint
        with:
          working-directory: bkn-trace/agent-observability
      - name: Verify OpenBKN license headers
        run: make license-check
      - name: Failed-call deployment polling regression
        run: python3 -m unittest discover -s scripts -p 'test_failed_call_deployment_poll.py' -v
      - name: Unit tests
        run: make test
      - name: Swagger contract drift
        run: make check-swag
      - name: Race tests
        run: make test-race
      - name: MariaDB lifecycle, fault and rebuild integration tests
        env:
          BKN_TRACE_TEST_MARIADB_DSN: root:trace-ci-password@tcp(127.0.0.1:3306)/bkn_trace_ci?parseTime=true&multiStatements=true
          BKN_TRACE_TEST_OPENSEARCH_ENDPOINT: http://127.0.0.1:9200
        run: make test-integration
      - name: Authorized root-service discovery integration test
        env:
          BKN_ROOT_SERVICES_TEST_DSN: root:trace-ci-password@tcp(127.0.0.1:3306)/bkn_trace_ci?parseTime=true&multiStatements=true
          BKN_ROOT_SERVICES_TEST_OS: http://127.0.0.1:9200
        run: go test -tags=integration ./src/drivenadapter/dbaccess/mariadb/sessionstore -run '^TestRootServiceOptionsIntegration$' -count=1 -v
      - name: MariaDB capacity smoke
        env:
          BKN_TRACE_TEST_MARIADB_DSN: root:trace-ci-password@tcp(127.0.0.1:3306)/bkn_trace_ci?parseTime=true&multiStatements=true
        run: make test-performance
      - name: OpenSearch projection and alias integration test
        env:
          BKN_TRACE_TEST_OPENSEARCH_ENDPOINT: http://127.0.0.1:9200
        run: make test-opensearch-integration
      - name: Bounded Span browsing integration test
        env:
          BKN_SPAN_PAGE_TEST_URL: http://127.0.0.1:9200
        run: go test -tags=integration ./src/domain/service/tracesvc -run '^TestSpanPageRealOpenSearch$' -count=1 -v
      - name: Frozen technical Trace archive safety integration test
        env:
          BKN_FROZEN_ARCHIVE_TEST_URL: http://127.0.0.1:9200
        run: go test -tags=integration ./src/drivenadapter/httpaccess/opensearchtraceaccess -run '^TestArchiveFrozenSafetyRealOpenSearch$' -count=1 -v
      - name: Build
        run: make build
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: make helm-lint
      - name: Internal Trace control client/server contract
        working-directory: bkn-trace/tests/internal-control
        run: make ci
      - name: Internal Trace admission chart contract
        working-directory: .
        run: bash bkn-trace/scripts/test_internal_trace_admission_charts.sh
      - name: Evidence publisher chart contract
        working-directory: .
        run: |
          bash infra/bkn-agent/scripts/test_evidence_kafka_chart.sh infra/bkn-agent/charts
