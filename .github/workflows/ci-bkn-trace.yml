name: ci-bkn-trace

on:
  pull_request:
    paths:
      - 'bkn-trace/**'
      - 'comm-go/**'
      - 'docs/api/agent-observability/**'
      - 'deploy/scripts/upgrades/0.2.0/historical_trace_data/**'
      - 'deploy/scripts/upgrades/0.2.0/evidence_outbox_to_kafka/**'
      - '.github/workflows/ci-bkn-trace.yml'

permissions:
  contents: read

concurrency:
  group: ci-bkn-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: trace-ci-password
          MARIADB_DATABASE: bkn_trace_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2.19.4
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: bkn-trace/agent-observability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bkn-trace/agent-observability/go.mod
      - name: Static analysis
        uses: ./.github/actions/golangci-lint
        with:
          working-directory: bkn-trace/agent-observability
      - name: Verify OpenBKN license headers
        run: make license-check
      - name: Failed-call deployment polling regression
        run: python3 -m unittest discover -s scripts -p 'test_failed_call_deployment_poll.py' -v
      - name: Unit tests
        run: make test
      - name: Historical upgrade tool tests
        working-directory: deploy/scripts/upgrades/0.2.0
        run: |
          python3 -m pip install -r historical_trace_data/requirements.txt
          python3 -m unittest discover -s historical_trace_data -p 'test_*.py'
      - name: Offline historical Span codec
        working-directory: deploy/scripts/upgrades/0.2.0/historical_trace_data/span-codec
        run: |
          go vet ./...
          go test ./... -count=1
          go build ./...
      - name: Swagger contract drift
        run: make check-swag
      - name: Race tests
        run: make test-race
      - name: MariaDB lifecycle, fault and rebuild integration tests
        env:
          BKN_TRACE_TEST_MARIADB_DSN: root:trace-ci-password@tcp(127.0.0.1:3306)/bkn_trace_ci?parseTime=true&multiStatements=true
          BKN_TRACE_TEST_OPENSEARCH_ENDPOINT: http://127.0.0.1:9200
        run: make test-integration
      - name: MariaDB capacity smoke
        env:
          BKN_TRACE_TEST_MARIADB_DSN: root:trace-ci-password@tcp(127.0.0.1:3306)/bkn_trace_ci?parseTime=true&multiStatements=true
        run: make test-performance
      - name: OpenSearch projection and alias integration test
        env:
          BKN_TRACE_TEST_OPENSEARCH_ENDPOINT: http://127.0.0.1:9200
        run: make test-opensearch-integration
      - name: Build
        run: make build
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: make helm-lint
      - name: Internal Trace control client/server contract
        working-directory: bkn-trace/tests/internal-control
        run: make ci
      - name: Internal Trace installer and publisher chart contract
        working-directory: .
        run: |
          bash deploy/scripts/services/test_internal_trace_admission.sh
          bash deploy/scripts/services/test_internal_trace_admission_charts.sh
          bash deploy/scripts/services/openbkn_trace_profile_test.sh
