name: release-bkn-trace-otelcol

# Builds and publishes the OpenBKN OCB Collector image, then packages the chart
# against the exact release version. Verify-only runs build without pushing.

on:
  push:
    tags:
      - 'v*'
    branches: ['**']
    paths:
      - 'bkn-trace/otelcol-contribute-chart/**'
      - '.github/workflows/release-bkn-trace-otelcol.yml'
      - '.github/workflows/reusable-*.yml'
      # 版本冻结提交（release/<x.y.z> 分支）触发全量重建
      - 'VERSION'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GHCR (true) or verify build only (false)'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write

jobs:
  version:
    uses: ./.github/workflows/reusable-version.yml

  verify:
    needs: version
    uses: ./.github/workflows/reusable-release-verify.yml
    with:
      service-path: bkn-trace/otelcol-contribute-chart
      stack: chart-only

  chart-regression:
    needs: [version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Verify Collector chart regressions
        working-directory: bkn-trace/otelcol-contribute-chart
        env:
          OTELCOL_RUNTIME_IMAGE: swr.cn-east-3.myhuaweicloud.com/openbkn-ai/otel/opentelemetry-collector-contrib:0.148.0
        run: |
          ./scripts/test_4c8g_baseline.sh
          ./scripts/test_config_rollout.sh

  ocb-contract:
    needs: [version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - uses: azure/setup-helm@v4

      - uses: docker/setup-buildx-action@v3

      - name: Verify OCB registration and image contract
        working-directory: bkn-trace/otelcol-contribute-chart
        run: ./scripts/test_ocb_build_contract.sh

      - name: Test traceadmission processor module
        working-directory: bkn-trace/otelcol-contribute-chart/processor/traceadmissionprocessor
        run: go test ./...

      - name: Build local amd64 OCB smoke image
        run: |
          docker build --platform linux/amd64 --load \
            -f bkn-trace/otelcol-contribute-chart/Dockerfile.openbkn \
            -t otelcol-openbkn:ci-smoke .

      - name: Validate enabled Trace Admission chart with OCB image
        working-directory: bkn-trace/otelcol-contribute-chart
        run: ./scripts/test_ocb_image_local.sh otelcol-openbkn:ci-smoke

  image:
    needs: [version, verify, chart-regression, ocb-contract]
    uses: ./.github/workflows/reusable-container-image.yml
    secrets: inherit
    with:
      # The custom processor imports the checked-out agent-observability
      # traceadmissionsvc module, so the Docker context must be the repository
      # root. The Dockerfile and builder config remain under the chart path.
      service-path: .
      context: .
      dockerfile: bkn-trace/otelcol-contribute-chart/Dockerfile.openbkn
      image-name: otelcol-openbkn
      version: ${{ needs.version.outputs.version }}
      publish: ${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

  chart:
    needs: [version, verify, chart-regression, ocb-contract, image]
    uses: ./.github/workflows/reusable-chart.yml
    with:
      service-path: bkn-trace/otelcol-contribute-chart
      chart-path: charts/otelcol-contrib
      chart-name: otelcol-contrib
      version: ${{ needs.version.outputs.version }}
      publish: ${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
