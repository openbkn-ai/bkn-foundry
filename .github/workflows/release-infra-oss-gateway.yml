name: release-infra-oss-gateway

on:
  push:
    tags:
      - 'v*'
    branches: ['**']
    paths:
      - 'infra/oss-gateway-backend/**'
      - '.github/workflows/release-infra-oss-gateway.yml'
      - '.github/workflows/reusable-*.yml'
      # 版本冻结提交（release/<x.y.z> 分支）触发全量重建
      - 'VERSION'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GHCR (true) or verify build only (false)'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      service-path: infra/oss-gateway-backend
      stack: go
      go-mod-file: go.mod

  build:
    needs: test
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    with:
      service-path: infra/oss-gateway-backend
      dockerfile: Dockerfile
      context: '.'
      image-name: oss-gateway-backend
      version: ${{ needs.test.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      # 内网 swr base 覆盖为公网镜像
      build-args: |
        GO_BUILD_IMAGE=golang:1.25.10
        BASE_IMAGE=ubuntu:24.04

  chart:
    needs: [test, build]
    uses: ./.github/workflows/reusable-chart.yml
    with:
      service-path: infra/oss-gateway-backend
      chart-path: charts
      chart-name: oss-gateway-backend
      version: ${{ needs.test.outputs.version }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
